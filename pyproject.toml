[project]
name = "learn-ukrainian"
version = "1.0.0"
description = "Ukrainian language learning curriculum generator"
requires-python = ">=3.14"
# The runtime closure. uv.lock pins every version with hashes; change a
# requirement here, then run `uv lock` (never edit uv.lock by hand). CI installs
# with `uv sync --locked`, which refuses a lock that no longer matches.
# Production code in scripts/ must run with these and the ml group alone.
dependencies = [
    # The pinned lu-machinery release, its runtime extras and its tested closure
    # (machinery docs/release.md, Consumers). [tool.uv.sources] names the release
    # wheel; uv.lock carries its SHA-256. A machinery release adoption updates both.
    "lu-machinery[api,postgres,pytest]==0.1.68",
    # Repository runtime package (packages/v4-runtime).
    "learn-ukrainian-v4-runtime",

    # YAML/JSON
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "ijson==3.6.0",  # scripts/atlas/export_runtime_shards.py streamed --verify (yajl2_c backend; #8672)

    # CommonMark parsing for deterministic documentation inventory
    "markdown-it-py>=4.2.0",

    # API server
    "fastapi>=0.139.0",
    "uvicorn>=0.48.0",
    # uvicorn's WebSocket protocol implementation: without it uvicorn refuses the
    # Monitor API's /ws/batch upgrade (scripts/project_api/batch_router.py).
    "websockets>=17.4",
    "httpx>=0.28",
    "prometheus-client>=0.26.0",

    # RAG / vector store
    "qdrant-client>=1.14",

    # NLP / Ukrainian. tokenize-uk is vendored at scripts/linguistics/tokenize_uk.py
    # (#1318), intentionally not a dependency: local ABBRS extensions require it.
    "pyahocorasick>=2.3.1",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru",
    "pymorphy3-dicts-uk",
    "regex>=2026.5.9",  # scripts/build/activity_renderer.py (Unicode-property patterns)

    # Testing
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4.0",
    "pytest-rerunfailures>=16.7",  # #9067: quarantined node ids only

    # Linting
    "ruff>=0.17.4",

    # Database
    "aiosqlite>=0.22",
    # psycopg and its C implementation psycopg-binary are exact-pinned together and
    # must always match (#12476). Dependabot bumps the pair as one group.
    "psycopg==3.3.6",  # control-plane storage seam pg authority (Phase 0b #603)
    "psycopg-binary==3.3.6",

    # Process / file-locking / fuzzy-match utilities (#6830 manifest-debt fix:
    # installed transitively until a from-scratch venv rebuild lost them).
    "psutil>=7.2",  # lu_machinery/agent_runtime/watchdog.py
    "filelock>=3.32.2",  # scripts/pipeline/{stress_annotator,state}.py, curriculum_coordinator.py
    "rapidfuzz>=3.14.6",  # .mcp/servers/sources/server.py (handle_verify_quote), scripts/build/linear_pipeline.py

    # Document parsing (#6830 import-scan sweep: imported unconditionally by
    # production scripts/, so pytest collection needs them).
    "lxml>=6.1",  # scripts/ingest/esum_abbyy_parser.py
    "pypdf>=6.21.4",  # scripts/projects/open_model_data/*.py, scripts/rag/scrape_diasporiana.py; 6.21.4 clears CVE-2026-119203 to -119209
    "PyMuPDF>=2.1",  # scripts/rag/{extract_images,annotate_images,poc_pair_page}.py, scripts/tools/analyze_textbook_pages.py
    "ruamel.yaml>=0.19",  # scripts/tools/{fix_plan_latin_refs,convert_seminar_plans_v6}.py
    "python-docx>=1.2.0",  # scripts/ingest/owned_books_ingest.py
    "pillow>=13.0.0",  # scripts/rag/embed.py (image input), tests/test_scrape_diasporiana.py

    # IPA transcription (not on PyPI; [tool.uv.sources] pins the commit)
    "ipa-uk",  # scripts/generate_mdx/generate_ipa.py

    # MCP protocol (sources + trails MCP servers ported to 2.0 API); >=2.2 clears CVE-2026-59951
    "mcp>=2.2,<3",

    # Web scraping (for resource discovery). The chardet extras keep chardet, the
    # encoding detector both libraries use when it is installed, for pages served
    # without a charset; without it they fall back to charset-normalizer.
    "beautifulsoup4[chardet]>=4.15.0",
    "requests[use-chardet-on-py3]>=2.34.2",

    # YouTube ingestion. The secretstorage extra decrypts Chrome cookies on Linux
    # for --cookies-from-browser chrome (scripts/wiki/fetch_external_sources.py).
    "yt-dlp[secretstorage]>=2026.7.4",

    # Build utilities
    "jinja2>=3.1",

    # GraphQL documents: which operation a GitHub request executes (#10730)
    "graphql-core==3.3.1",  # scripts/common/github_client.py (imported only when a document can write)

    # Security floors (transitive dependencies held above their vulnerable range).
    # soupsieve comes via beautifulsoup4. CVE-2026-126192 is fixed in 2.10;
    # CVE-2026-126190 is fixed in 4.0.
    "soupsieve>=4.1",
]

[dependency-groups]
# Model runtimes and their closure. Every entry has a direct use. Default CI
# installs this group without torch, torchvision, open-clip-torch and stanza
# (.github/actions/python-ci-env); pytest-slow-nightly.yml installs all of it.
ml = [
    "torch>=2.13.0",  # CPU build ([tool.uv.sources])
    "torchvision>=0.28.0",  # via open-clip-torch; listed so it takes the same CPU build
    "sentence-transformers>=5.6.1",
    "open-clip-torch>=3.3.0",  # scripts/rag/embed.py (image embeddings; brings torchvision, timm, ftfy)
    "FlagEmbedding>=1.4.0",  # scripts/rag/embed.py, scripts/wiki/dense_rerank.py, scripts/rag/benchmark_embeddings.py
    "datasets>=5.0.1",  # scripts/dataset/train_gemma_huggingface.py (Gemma training)
    "peft>=0.20.0",  # scripts/projects/open_model_data/{train_and_eval_real_model,gemma_hardware_probe}.py, scripts/dataset/train_gemma_huggingface.py
    "stanza>=1.15.0",  # scripts/pipeline/stress_annotator.py, scripts/vocab/rebuild_vocab_simple.py
    "ukrainian-word-stress>=2,<3",  # requires stanza
    "einops>=0.8.2",  # jinaai/jina-embeddings-v3 remote code (scripts/rag/benchmark_embeddings.py, trust_remote_code)
    "faster-whisper>=1.2.1",  # scripts/navsi200_asr_bakeoff.py (ASR bakeoff)
    "av>=18.1.0",  # scripts/navsi200_asr_bakeoff.py (audio decoding)
]
# Contributor tools: type checking, linters, hooks, test and debug utilities.
dev = [
    "pre-commit>=4.6.0",  # mirrors CI checks locally
    "mypy>=2.1.0",  # gradual; see [tool.mypy]
    "yamllint>=1.38.0",  # .venv/bin/yamllint: .github/workflows/validate-yaml.yml, package.json lint:yaml (.yamllint)
    "vulture>=2.16",  # .venv/bin/vulture: scripts/audit/find_dead_code.py
    # Installer and build tools inside the project environment: lu_machinery
    # release_cut runs pip download with the project interpreter.
    "pip>=26.3",
    "setuptools>=75",
    "wheel>=0.48.0",
    "pytest-xdist>=3.6",  # parallel test execution (-n auto)
    "requests-mock>=1.12.1",  # requests transport fixture
    "pytest-mock>=3.17.0",  # fixture-based mocker
    "coverage[toml]>=7.17.0",
    "ipython>=9.18.1",
    "ipdb>=0.13.13",
    # Secret scanners are standalone binaries, not Python packages: gitleaks
    # (pre-commit and CI) and TruffleHog through scripts/audit/secret_scan_local.py
    # (docs/runbooks/secret-scanning.md).
]
# Narrow workflow environments (uv sync --only-group) limit each job to its tools.
pyyaml = ["pyyaml==6.0.3"]
# Local pronunciation uses the packed stress trie without Stanza.
tts = [
    { include-group = "pyyaml" },
    "marisa-trie==1.4.1",
    # Preserve the existing pronunciation pins shared with the main runtime.
    "numpy==2.5.5",
    "onnxruntime==1.32.0",
    "piper-tts==1.3.0",
    "ukrainian-word-stress==2.1.0",
]
# The lu-machinery release and its closure: jobs that run only its entry points.
machinery = ["lu-machinery[api,postgres,pytest]==0.1.68"]
# Python advisory audits use the release and its resolver-free pip-audit entry point.
audit = [{ include-group = "machinery" }, "pip-audit==2.10.1"]
# deploy-pages.yml: the release plus the build scripts' YAML, schema and regex imports.
pages = [{ include-group = "machinery" }, "pyyaml>=6.0", "jsonschema>=4.20", "regex>=2026.5.9"]
# atlas-grow.yml: the release plus the lexicon scripts' imports.
atlas = [
    { include-group = "machinery" },
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "regex>=2026.5.9",
    "requests[use-chardet-on-py3]>=2.34.2",
    "ukrainian-word-stress>=2,<3",
]

[tool.uv]
# One uv release writes and reads uv.lock. python-ci-env installs this
# required-version.
required-version = "==0.13.9"
exclude-newer = "7 days"
# `uv sync` builds the whole environment; CI excludes packages by name.
default-groups = ["ml", "dev"]

[tool.uv.sources]
lu-machinery = { url = "https://github.com/learn-ukrainian/machinery/releases/download/v0.1.68/lu_machinery-0.1.68-py3-none-any.whl" }
learn-ukrainian-v4-runtime = { path = "packages/v4-runtime" }
ipa-uk = { git = "https://github.com/lang-uk/ipa-uk.git", rev = "e7fc944faca090ca985d5ca09a24c59154d9dea1" }
# The CPU builds the host and nightly CI run: no CUDA dependency closure.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 120
timeout_method = "thread"
# Keep pytest's native faulthandler watchdog off: dump_traceback_later is a C
# watchdog thread that walks frames without the GIL, so it raced changing frames
# and SIGSEGV'd a worker during a dump (#11391). pytest-timeout owns hang reporting.
faulthandler_timeout = 0
# Retain only failures so large successful temp sessions do not accumulate (#8572).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# atlas_release is publish-time only (requires data/atlas.db); run explicitly with -m atlas_release
# -p registers the dispatch xdist cap for every invocation that reads this
# config, including paths outside tests/ (a tests/conftest.py hook does not).
addopts = "-v --tb=short -m 'not atlas_release' -p lu_machinery.ci.pytest_dispatch_cap"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "data_tier(*stores, tables=()): real read-only sources/vesum inputs resolved at fixture time",
    "site_toolchain: real Astro MDX compilation; requires site/node_modules and runs in Frontend CI",
    "website: Docusaurus website integrity tests (links, frontmatter, sidebar)",
    "slow: tests that load ML models or require long execution time",
    "repo_invariant: repo-wide invariant checks that run in the PR-tier fastlane",
    "atlas_release: real-DB Atlas runtime-shard release gate (requires data/atlas.db; fails closed)",
    "live_network: opt-out of socket-guard for integration tests requiring outbound network",
    "live_github: intentional integration test that invokes the real GitHub CLI",
    "postgres: needs LEARN_UKRAINIAN_CP_PG_DSN (live Postgres); skips when unset",
    "docs_skills: docs/skills-only CI lane (contract linters for markdown/skills PRs)",
    "reads_content: tests that read curriculum/site-content/wiki files (content CI class lane, #8399)",
    "repo_wide: tests that scan repository trees (tests/, scripts/, agents_extensions/) or run a repo lint, so import-graph selection can never pick them; always run in the selected CI tier (#8707)",
    "needs_artifact(group, rel): test requires data/<rel> from artifact group; skips when unavailable",
    "real_claude_cli_gate: test exercises the real Claude CLI version gate; the shared stub in tests/conftest.py is not applied (#9903)",
    "rules_core_absent: pins an exact argv or prompt block order, so runs without the rules core (tests/rules_core_view.py)",
]

[tool.ruff]
line-length = 120
target-version = "py314"
# Imports resolve from the repository root and scripts/ in both full and
# sparse checkouts. Declare both roots so isort never probes tree presence.
src = [".", "scripts"]
exclude = [
    ".venv/",
    "node_modules/",
    "starlight/",
    "scripts/oneoff/",
]

[tool.ruff.lint]
select = [
    "F",     # Pyflakes (undefined names, unused imports/vars)
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort (import ordering)
    "UP",    # pyupgrade (modernize syntax)
    "B",     # flake8-bugbear (common bugs)
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "PLC0415",  # import-outside-top-level (scripts/api and scripts/project_api only; advisory API import hygiene)
]
ignore = [
    # Legitimate project-specific ignores (Ukrainian codebase)
    "RUF001",  # ambiguous Unicode char in string — Ukrainian text is the product
    "RUF002",  # ambiguous Unicode char in docstring — Ukrainian text
    "RUF003",  # ambiguous Unicode char in comment — Ukrainian text
    "E402",    # module import not at top — unavoidable with sys.path manipulation
    "E501",    # line too long — too many existing, not worth enforcing now
    "E741",    # ambiguous variable name — false positives with Ukrainian text vars
]

[tool.ruff.lint.per-file-ignores]
"!scripts/{api,project_api}/**.py" = ["PLC0415"]  # advisory API import-hygiene scope (machinery and product Monitor API)
"scripts/api/*.py" = ["B008"]  # function call in default arg (FastAPI Depends)
"scripts/project_api/*.py" = ["B008"]  # function call in default arg (FastAPI Depends)
"tests/*.py" = ["F841", "SIM117"]  # unused variables + nested with OK in tests
# NOTE (#5930): do NOT use "scripts/*.py" here — ruff's per-file-ignores globs
# treat `*` as matching across `/`, so that pattern silenced F401/F811/E302/F821
# for the entire scripts/ tree. Root redirect stubs no longer need those ignores.

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "starlight/",
    "node_modules/",
]
# Gradual adoption: target active build entry points and shared runtime modules.
files = [
    "scripts/build/v7_build.py",
    "scripts/build/dispatch.py",
    "scripts/build/enrich.py",
    "scripts/build/activity_repair.py",
    "scripts/build/activity_validator.py",
    "scripts/audit/core.py",
    # The Claude account route key (#10630): its owner and the decision consumers outside agent_runtime.
]

[tool.coverage.run]
source = ["scripts"]
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
fail_under = 0  # Start with baseline, increase over time

[tool.uv.exclude-newer-package]
lu-machinery = false
