# Shared project behavior for Codex App, CLI, and IDE surfaces.
# Root model and reasoning defaults intentionally remain user-scoped so the
# desktop model picker can override them for each task.
# Codex owns context compaction; repository hooks add durable fleet hydration
# only when a launcher has explicitly bound an epic driver.

[features]
# Entire 0.8.42 uses the same project hook surface in Codex CLI and Desktop.
hooks = true
multi_agent = true
remote_compaction_v2 = true
# Fleet streams and file shadow diaries are the durable memory layer.
memories = false

[features.multi_agent_v2]
enabled = true
hide_spawn_agent_metadata = false
# Avoid the server-reserved collaboration.spawn_agent schema. Native V2 stays
# enabled, but exposes its tools as agents.spawn_agent/list_agents.
tool_namespace = "agents"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
interrupt_message = true
