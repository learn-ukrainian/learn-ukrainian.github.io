---
inline:
  - id: act-1
    type: quiz
    title: Яке питальне слово?
    instruction: Choose the question word that fits the noun.
    items:
      - prompt: стіл
        options:
          - text: Який?
            correct: true
          - text: Яка?
            correct: false
          - text: Яке?
            correct: false
        explanation: Стіл is masculine, so ask Який?
      - prompt: книга
        options:
          - text: Яка?
            correct: true
          - text: Який?
            correct: false
          - text: Яке?
            correct: false
        explanation: Книга is feminine, so ask Яка?
      - prompt: фото
        options:
          - text: Яке?
            correct: true
          - text: Яка?
            correct: false
          - text: Який?
            correct: false
        explanation: Фото is neuter in this lesson, so ask Яке?
      - prompt: кімната
        options:
          - text: Яка?
            correct: true
          - text: Який?
            correct: false
          - text: Які?
            correct: false
        explanation: Кімната is feminine.
      - prompt: книги
        options:
          - text: Які?
            correct: true
          - text: Яке?
            correct: false
          - text: Який?
            correct: false
        explanation: Книги is plural, so ask Які?
      - prompt: вікно
        options:
          - text: Яке?
            correct: true
          - text: Який?
            correct: false
          - text: Яка?
            correct: false
        explanation: Вікно is neuter.
  - id: act-2
    type: fill-in
    title: Заверши прикметник
    instruction: Choose the adjective ending that matches the noun.
    items:
      - sentence: велик__ стіл
        answer: ий
        options:
          - ий
          - а
          - е
        explanation: Стіл is masculine, so use великий.
      - sentence: нов__ книга
        answer: а
        options:
          - а
          - ий
          - е
        explanation: Книга is feminine, so use нова.
      - sentence: чист__ вікно
        answer: е
        options:
          - е
          - ий
          - а
        explanation: Вікно is neuter, so use чисте.
      - sentence: стар__ фото
        answer: е
        options:
          - е
          - а
          - ий
        explanation: Фото is neuter in this lesson.
      - sentence: дорог__ телефон
        answer: ий
        options:
          - ий
          - а
          - е
        explanation: Телефон is masculine.
      - sentence: дешев__ листівка
        answer: а
        options:
          - а
          - е
          - ий
        explanation: Листівка is feminine.
      - sentence: гарн__ кімната
        answer: а
        options:
          - а
          - ий
          - е
        explanation: Кімната is feminine.
      - sentence: брудн__ дзеркало
        answer: е
        options:
          - е
          - а
          - ий
        explanation: Дзеркало is neuter.
      - sentence: світл__ плакат
        answer: ий
        options:
          - ий
          - е
          - а
        explanation: Плакат is masculine.
      - sentence: нов__ книги
        answer: і
        options:
          - і
          - а
          - е
        explanation: Plural A1 phrases use нові.
  - id: act-3
    type: group-sort
    title: Сортуй фрази
    instruction: Sort each adjective-noun phrase by the question it answers.
    groups:
      - label: Який?
        items:
          - великий стіл
          - новий телефон
          - старий атлас
          - дорогий плакат
      - label: Яка?
        items:
          - нова книга
          - гарна листівка
          - чиста кімната
          - дешева ручка
      - label: Яке?
        items:
          - старе фото
          - чисте вікно
          - велике ліжко
          - брудне дзеркало
      - label: Які?
        items:
          - нові книги
          - гарні речі
          - старі фото
          - дешеві листівки
  - id: act-4
    type: match-up
    title: Поєднай протилежності
    instruction: Match each adjective with its opposite.
    pairs:
      - left: великий
        right: маленький
      - left: новий
        right: старий
      - left: гарний
        right: поганий
      - left: чистий
        right: брудний
      - left: дорогий
        right: дешевий
      - left: світлий
        right: темний
workbook:
  - type: quiz
    title: Модель речення
    instruction: Choose the natural A1 sentence.
    items:
      - prompt: "Ось книга. Обери речення про неї."
        options:
          - text: Книга нова.
            correct: true
          - text: Книгу нова.
            correct: false
          - text: Книга новий.
            correct: false
        explanation: "Книга нова has feminine nominative agreement. Книгу is accusative; новий is masculine."
      - prompt: "Ось стіл. Обери речення про нього."
        options:
          - text: Стіл чистий.
            correct: true
          - text: Стіл чиста.
            correct: false
          - text: Столу чистий.
            correct: false
        explanation: "Стіл is masculine nominative, so use чистий. Чиста is feminine; столу is not the subject form."
      - prompt: The window is big.
        options:
          - text: Вікно велике.
            correct: true
          - text: Вікно великий.
            correct: false
          - text: Вікно велика.
            correct: false
        explanation: Вікно is neuter.
      - prompt: A nice postcard
        options:
          - text: гарна листівка
            correct: true
          - text: гарний листівка
            correct: false
          - text: гарне листівка
            correct: false
        explanation: Листівка is feminine.
      - prompt: A useful atlas
        options:
          - text: корисний атлас
            correct: true
          - text: корисна атлас
            correct: false
          - text: корисне атлас
            correct: false
        explanation: Атлас is masculine.
      - prompt: Interesting things
        options:
          - text: цікаві речі
            correct: true
          - text: цікава речі
            correct: false
          - text: цікаве речі
            correct: false
        explanation: Plural phrases use цікаві.
  - type: fill-in
    title: Опиши кімнату
    instruction: Complete the short room lines.
    items:
      - sentence: Моя кімната ___ і світла.
        answer: маленька
        options:
          - маленька
          - маленький
          - маленьке
        explanation: Кімната is feminine.
      - sentence: Стіл ___ і чистий.
        answer: новий
        options:
          - новий
          - нова
          - нове
        explanation: Стіл is masculine.
      - sentence: Ліжко старе, ___ зручне.
        answer: але
        options:
          - але
          - який
          - яка
        explanation: Але adds a contrast.
      - sentence: Вікно ___ і чисте.
        answer: велике
        options:
          - велике
          - великий
          - велика
        explanation: Вікно is neuter.
      - sentence: "Книга дорога, ___ листівка дешева."
        answer: а
        options:
          - а
          - якого
          - яке
        explanation: "А joins the clauses about the expensive book and the cheap card. Якого and яке cannot connect these clauses."
      - sentence: У мене є ___ стіл і стара лампа.
        answer: новий
        options:
          - новий
          - нова
          - нове
        explanation: Стіл is masculine.
  - type: quiz
    title: Виправ узгодження прикметників
    instruction: Choose the correct Ukrainian version of each line.
    items:
      - prompt: 'Choose the correct Ukrainian version: Він є добра студент.'
        options:
          - text: Він добрий студент.
            correct: true
          - text: Він добра студент.
            correct: false
          - text: Він є добра студент.
            correct: false
        explanation: Студент is masculine, so use добрий. Є may be present or omitted.
      - prompt: 'Choose the correct Ukrainian version: Це гарна хлопець.'
        options:
          - text: Це гарний хлопець.
            correct: true
          - text: Це гарне хлопець.
            correct: false
          - text: Це гарна хлопець.
            correct: false
        explanation: Хлопець is masculine.
      - prompt: "Choose the correct Ukrainian version: Який твоє ім'я?"
        options:
          - text: Яке твоє ім'я?
            correct: true
          - text: Яка твоє ім'я?
            correct: false
          - text: Який твоє ім'я?
            correct: false
        explanation: Ім'я is neuter, so use Яке. Як тебе звати? is another natural question for an introduction.
      - prompt: 'Choose the correct Ukrainian version: Це цікавий книга.'
        options:
          - text: Це цікава книга.
            correct: true
          - text: Це цікавий книга.
            correct: false
          - text: Це цікаве книга.
            correct: false
        explanation: Книга is feminine, so use цікава.
      - prompt: 'Choose the correct Ukrainian version: Моя кава смачний.'
        options:
          - text: Моя кава смачна.
            correct: true
          - text: Моя кава смачний.
            correct: false
          - text: Моя кава смачне.
            correct: false
        explanation: Кава is feminine, so use смачна.
      - prompt: 'Choose the correct Ukrainian version: Це мій новий ручка.'
        options:
          - text: Це моя нова ручка.
            correct: true
          - text: Це мій новий ручка.
            correct: false
          - text: Це моє нове ручка.
            correct: false
        explanation: Ручка is feminine, so use моя and нова.
  - type: fill-in
    title: Прикметники в реченнях — Adjectives in sentences
    instruction: Choose the adjective form that fits the sentence.
    items:
      - sentence: Цей суп дуже ___.
        answer: смачний
        options:
          - смачний
          - смачна
        explanation: Суп is masculine, so use смачний. Смачна is feminine.
      - sentence: У мене є ___ олівець.
        answer: жовтий
        options:
          - жовтий
          - жовта
        explanation: Олівець is masculine, so use жовтий. Жовта is feminine.
      - sentence: У сусідки ___ кіт.
        answer: чорний
        options:
          - чорний
          - чорне
        explanation: Кіт is masculine, so use чорний. Чорне is neuter.
      - sentence: Прапор ___, а не білий.
        answer: червоний
        options:
          - червоний
          - червона
        explanation: Прапор is masculine, so use червоний. Червона is feminine.
      - sentence: Це ___ фільм.
        answer: поганий
        options:
          - поганий
          - погана
        explanation: Фільм is masculine, so use поганий. Погана is feminine.
      - sentence: Це ___ відповідь на запитання.
        answer: правильна
        options:
          - правильна
          - правильний
        explanation: Відповідь is feminine, so use правильна. Правильний is masculine.
      - sentence: Мені все одно, який олівець. Дай мені, будь ласка, ___ олівець.
        answer: будь-який
        options:
          - будь-який
          - будь-яка
        explanation: The context asks for any pencil. Олівець is masculine, so use будь-який; будь-яка is feminine.
      - sentence: Сергій — ___ хлопчик.
        answer: розумний
        options:
          - розумний
          - розумна
        explanation: Хлопчик is masculine, so use розумний. Розумна is feminine.
      - sentence: Тарас — ___ учень.
        answer: лінивий
        options:
          - лінивий
          - лінива
        explanation: Учень is masculine, so use лінивий. Лінива is feminine.
  - type: translate
    title: Обери український рядок
    instruction: Choose the Ukrainian sentence that matches the English cue.
    items:
      - source: My room is small but nice.
        options:
          - text: Моя кімната маленька, але гарна.
            correct: true
          - text: Мій кімната маленький, але гарний.
            correct: false
          - text: Моє кімната маленьке, але гарне.
            correct: false
        explanation: Кімната is feminine.
      - source: The table is new and clean.
        options:
          - text: Стіл новий і чистий.
            correct: true
          - text: Стіл нова і чиста.
            correct: false
          - text: Стіл нове і чисте.
            correct: false
        explanation: Стіл is masculine.
      - source: The photo is old.
        options:
          - text: Фото старе.
            correct: true
          - text: Фото стара.
            correct: false
          - text: Фото старий.
            correct: false
        explanation: Фото is neuter in this lesson.
      - source: A cheap postcard
        options:
          - text: дешева листівка
            correct: true
          - text: дешевий листівка
            correct: false
          - text: дешеве листівка
            correct: false
        explanation: Листівка is feminine.
      - source: Good afternoon.
        options:
          - text: Добрий день.
            correct: true
          - text: Добра день.
            correct: false
          - text: Добре день.
            correct: false
        explanation: День is masculine, so the greeting is Добрий день.
      - source: The books are interesting.
        options:
          - text: Книги цікаві.
            correct: true
          - text: Книги цікава.
            correct: false
          - text: Книги цікаве.
            correct: false
        explanation: Plural phrases use цікаві.
  - type: true-false
    title: Швидка перевірка
    instruction: Decide if the statement is right.
    items:
      - statement: Стіл новий.
        answer: true
        explanation: Стіл is masculine, so новий is correct.
      - statement: Книга нове.
        answer: false
        explanation: Книга is feminine; say Книга нова.
      - statement: Вікно чисте.
        answer: true
        explanation: Вікно is neuter.
      - statement: Який кімната?
        answer: false
        explanation: Кімната is feminine; ask Яка кімната?
      - statement: Кімната маленька, але гарна.
        answer: true
        explanation: Both adjectives agree with кімната.
      - statement: 'В українській можна описати річ без є: Книга цікава.'
        answer: true
        explanation: This no-є present-tense frame is normal.
