inline:
  - id: act-1
    type: fill-in
    title: Complete the A1 line
    instruction: Choose the word or phrase that fits the time and situation.
    items:
      - sentence: "Адам: Учора зранку я ___ у кафе."
        answer: 'снідав'
        options:
          - 'снідав'
          - "снідала"
          - "снідали"
        explanation: "Адам selects masculine singular снідав. Снідала is feminine and снідали plural."
      - sentence: "Зараз я ___ по Хрещатику."
        answer: 'гуляю'
        options:
          - 'гуляю'
          - "гуляєш"
          - "гуляють"
        explanation: "Я selects first-person singular гуляю. Гуляєш is second-person singular; гуляють third-person plural."
      - sentence: "Адам: Учора я ___ квиток."
        answer: 'купив'
        options:
          - 'купив'
          - "купила"
          - "купили"
        explanation: "Адам selects masculine singular купив. Купила is feminine; купили plural."
      - sentence: "Завтра я ___ по Україні."
        answer: 'буду подорожувати'
        options:
          - 'буду подорожувати'
          - "будеш подорожувати"
          - "будемо подорожувати"
        explanation: "The subject я agrees with буду; будеш and будемо are other person/number forms. The infinitive remains unchanged."
      - sentence: "Учора ввечері ми ___ в кіно."
        answer: 'ходили'
        options:
          - 'ходили'
          - "ходив"
          - "ходила"
        explanation: "Ми selects plural ходили. Ходив and ходила are singular."
      - sentence: "Зараз Олена ___ борщ і салат."
        answer: 'замовляє'
        options:
          - 'замовляє'
          - "замовляю"
          - "замовляєш"
        explanation: "Олена selects third-person singular замовляє. Замовляю is first-person and замовляєш second-person."
      - sentence: "Учора була гарна погода, і ми ___ в парку."
        answer: 'гуляли'
        options:
          - 'гуляли'
          - "гуляв"
          - "гуляла"
        explanation: "Ми selects plural гуляли. Гуляв and гуляла are singular."
      - sentence: 'Я вже ___ до рівня А2!'
        answer: 'готовий'
        options:
          - 'готовий'
          - 'коштує'
          - 'болить'
        explanation: 'Готовий до рівня А2 is the finale can-do line.'
  - id: act-2
    type: order
    title: Put the final day in order
    instruction: Arrange the events from morning to night.
    items:
      - 'О сьомій я прокинувся в готелі.'
      - 'О восьмій я снідав у кафе.'
      - 'О дев’ятій я їхав на метро в центр.'
      - 'Об одинадцятій я купив сувенір.'
      - 'О першій годині дня я обідав з Оленою.'
      - 'О четвертій годині дня ми ходили в кіно.'
      - 'О сьомій вечора ми вечеряли в ресторані.'
      - 'О дев’ятій вечора я повернувся в готель.'
    correct_order: [0, 1, 2, 3, 4, 5, 6, 7]
  - id: act-3
    type: match-up
    title: Situation and phrase
    instruction: Match each everyday situation with the A1 phrase.
    pairs:
      - left: 'introducing yourself'
        right: 'Мене звати...'
      - left: 'asking for directions'
        right: 'Як дістатися до метро?'
      - left: 'ordering coffee'
        right: 'Каву з молоком, будь ласка.'
      - left: 'asking the price'
        right: 'Скільки коштує?'
      - left: 'repairing understanding'
        right: 'Повторіть, будь ласка.'
      - left: 'asking a colleague for help with a task'
        right: 'Допоможи мені з цим завданням, будь ласка.'
      - left: 'calling an ambulance for an injured person'
        right: 'Допоможіть! Викличте швидку!'
      - left: 'asking at a pharmacy for headache tablets'
        right: 'Дайте, будь ласка, таблетки від головного болю.'
      - left: 'saying goodbye'
        right: 'Дякую! До побачення!'
  - id: act-4
    type: group-sort
    title: Sort your A1 toolkit
    instruction: Put each phrase into the right communication group.
    groups:
      - name: 'identity and relationships'
        items:
          - 'Мене звати'
          - 'Я з Канади'
          - 'Це моя подруга'
      - name: 'directions and location'
        items:
          - 'Де метро?'
          - 'Я на вулиці'
          - 'Як дістатися до центру?'
      - name: 'cafe and shopping'
        items:
          - 'Каву, будь ласка'
          - 'Скільки коштує?'
          - 'Я беру це'
      - name: 'explicit time markers'
        items:
          - 'Учора я був'
          - 'Зараз я йду'
          - 'Завтра я буду читати'
workbook:
  - type: quiz
    title: Choose the A1 response
    instruction: "Choose the best answer."
    items:
      - prompt: "— ___ — Квиток коштує сто гривень."
        options:
          - text: 'Скільки коштує квиток?'
            correct: true
          - text: 'Де тут квиток?'
            correct: false
          - text: 'Дайте один квиток.'
            correct: false
        explanation: 'Скільки коштує...? asks the price.'
      - prompt: "— У мене є година. — ___ — Добре, я теж хочу кави."
        options:
          - text: 'Ходімо в кафе!'
            correct: true
          - text: 'Я будемо в кафе.'
            correct: false
          - text: 'Ми буде в кафе.'
            correct: false
        explanation: 'Ходімо... is the A1 invitation phrase.'
      - prompt: "— Де болить? — ___"
        options:
          - text: 'У мене болить голова.'
            correct: true
          - text: "У мене болить головою."
            correct: false
          - text: "У мене болить голові."
            correct: false
        explanation: "Голова is the nominative subject of болить. Головою is instrumental and голові dative; neither can be its subject here."
      - prompt: "Someone asks: 'Де ви?'"
        options:
          - text: 'Я на вулиці Хрещатик.'
            correct: true
          - text: 'Мене звати Адам.'
            correct: false
          - text: 'Я з Канади.'
            correct: false
        explanation: 'Answer the location question with a place.'
      - prompt: "What time frame is in: 'Завтра я буду читати книгу'?"
        options:
          - text: 'Майбутній'
            correct: true
          - text: 'Минулий'
            correct: false
          - text: 'Теперішній'
            correct: false
        explanation: 'Завтра and буду читати mark the future.'
  - type: true-false
    title: A1 finale check
    instruction: Decide whether the line is clear A1 Ukrainian.
    items:
      - statement: 'Мене звати Сара. Я з Канади.'
        answer: true
        explanation: 'This is clear A1 identity language.'
      - statement: 'Вчора я снідає у кафе.'
        answer: false
        explanation: 'Я does not agree with third-person снідає. In a past narrative, я снідав or я снідала is usual; narrative present is also possible.'
      - statement: 'Зараз я їду на метро.'
        answer: true
        explanation: 'Зараз plus present їду is clear.'
      - statement: 'Завтра я буду читати українську.'
        answer: true
        explanation: 'Буду + infinitive is the A1 future.'
      - statement: "Мене звати Адаму."
        answer: false
        explanation: 'The name in Мене звати Адам is nominative, not dative Адаму.'
  - type: quiz
    title: Choose final A1 lines
    instruction: Choose the sentence whose words fit together.
    items:
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Учора я снідав у кафе.
            correct: true
          - text: Учора я снідали у кафе.
            correct: false
          - text: Учора ми снідав у кафе.
            correct: false
        explanation: The key has matching subject and verb forms. я снідали and ми снідав combine a singular subject with a plural verb or a plural subject with a singular verb.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Зараз я їду на метро.
            correct: true
          - text: Зараз я їдеш на метро.
            correct: false
          - text: Зараз я їдуть на метро.
            correct: false
        explanation: The stated subject agrees with їду, not with the person/number forms їдеш or їдуть.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Завтра я буду гуляти в парку.
            correct: true
          - text: Завтра я будеш гуляти в парку.
            correct: false
          - text: Завтра я будемо гуляти в парку.
            correct: false
        explanation: The subject agrees with буду; будеш and будемо belong to different persons or numbers.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Повторіть, будь ласка.
            correct: true
          - text: Повторіть, будь ласку.
            correct: false
          - text: Повторіть, будь ласки.
            correct: false
        explanation: Both alternatives break the fixed request phrase будь ласка.
  - type: fill-in
    title: Final story frame
    instruction: Choose the phrase that completes each sentence in the story.
    items:
      - sentence: 'Мене ___ Адам.'
        answer: 'звати'
        options:
          - 'звати'
          - 'коштує'
          - 'болить'
        explanation: 'Мене звати introduces your name.'
      - sentence: "Адам: Учора зранку я ___ у кафе."
        answer: 'снідав'
        options:
          - 'снідав'
          - 'кафе'
          - 'буду'
        explanation: "Адам selects masculine singular снідав. Кафе is a place noun, not a predicate here; буду requires an infinitive absent from the line."
      - sentence: 'Ввечері ми ___ в кіно.'
        answer: 'ходили'
        options:
          - 'ходили'
          - 'кіно'
          - 'сім'
        explanation: 'Ходили is the past plural form already practiced.'
      - sentence: 'Завтра я ___ повторювати українську.'
        answer: 'буду'
        options:
          - 'буду'
          - 'був'
          - 'є'
        explanation: 'Use буду + infinitive for a future plan.'
  - type: translate
    title: Finish A1
    instruction: Choose the Ukrainian phrase that matches the English prompt.
    items:
      - source: 'My name is Adam. I am from Canada.'
        options:
          - text: 'Мене звати Адам. Я з Канади.'
            correct: true
          - text: "Моє ім'я є Адам. Я маю Канада."
            correct: false
          - text: 'Адам коштує Канада.'
            correct: false
        explanation: 'Use Мене звати... and Я з...'
      - source: 'Yesterday I bought a souvenir.'
        options:
          - text: 'Учора я купив сувенір.'
            correct: true
          - text: 'Завтра я купив сувенір.'
            correct: false
          - text: 'Сувенір мене звати.'
            correct: false
        explanation: 'Учора points to the past.'
      - source: 'Tomorrow I will read Ukrainian.'
        options:
          - text: 'Завтра я буду читати українську.'
            correct: true
          - text: 'Учора я буду читати українську.'
            correct: false
          - text: 'Завтра я читав українську.'
            correct: false
        explanation: 'Use завтра + буду читати.'
  - type: error-correction
    title: Repair final A1 lines
    instruction: Fix the common finale mistake.
    items:
      - sentence: "Мене звати Адаму."
        error: "Адаму"
        correction: 'Адам'
        explanation: 'The name after Мене звати is nominative here.'
      - sentence: 'Адам: Учора я снідала у кафе.'
        error: 'снідала'
        correction: 'снідав'
        explanation: 'Адам agrees with masculine singular снідав.'
      - sentence: 'Завтра я гуляв у парку.'
        error: 'гуляв'
        correction: 'буду гуляти'
        explanation: 'Use буду + infinitive for tomorrow.'
      - sentence: 'Я буду читаю українську.'
        error: 'читаю'
        correction: 'читати'
        explanation: 'After буду, use the infinitive.'
      - sentence: 'Я маю Канада.'
        error: 'маю Канада'
        correction: 'з Канади'
        explanation: 'Use Я з Канади for country of origin.'
