inline:
- id: act-1
  type: quiz
  title: Хто чи що? — Who or what?
  instruction: Обери́ пита́ння або́ займе́нник, що підхо́дить до іме́нника. — Choose
    the question or pronoun that fits the noun.
  items:
  - prompt: та́то (dad)
    options:
    - text: Хто це?
      correct: true
    - text: Що це?
      correct: false
    - text: Воно́?
      correct: false
    explanation: Та́то — це на́зва люди́ни, тому́ запи́туємо «Хто це?». — "Та́то"
      is a person word, so ask "Хто це?".
  - prompt: стіл (table)
    options:
    - text: Що це?
      correct: true
    - text: Хто це?
      correct: false
    - text: Вона́?
      correct: false
    explanation: Стіл — це на́зва предме́та, тому́ запи́туємо «Що це?». — "Стіл" is
      a thing word, so ask "Що це?".
  - prompt: сестра́ (sister)
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Сестра́ — жіно́чого ро́ду (вона́). — "Сестра́" is feminine (вона́).
  - prompt: брат (brother)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Брат — чолові́чого ро́ду (він). — "Брат" is masculine (він).
  - prompt: кни́га (book)
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Кни́га — жіно́чого ро́ду (вона́). — "Кни́га" is feminine (вона́).
  - prompt: вікно́ (window)
    options:
    - text: воно́
      correct: true
    - text: вона́
      correct: false
    - text: він
      correct: false
    explanation: Вікно́ — сере́днього ро́ду (воно́). — "Вікно́" is neuter (воно́).
- id: act-2
  type: group-sort
  title: Сорту́й слова́ за ро́дом — Sort the words by gender
  instruction: 'Розподілі́ть іме́нники за ро́дом: він, вона́ чи воно́. — Sort each
    noun by its safest A1 gender phrase.'
  groups:
  - label: він / мій (masculine)
    items:
    - стіл
    - та́то
    - ба́тько
    - соба́ка
  - label: вона́ / моя́ (feminine)
    items:
    - кни́га
    - сестра́
    - ма́ма
  - label: воно́ / моє́ (neuter)
    items:
    - вікно́
    - мі́сто
- id: act-3
  type: quiz
  title: Він, вона́ чи воно́? — Masculine, feminine, or neuter?
  instruction: Обери́ украї́нський займе́нник для переві́рки ро́ду. — Choose the Ukrainian
    gender-test word.
  items:
  - prompt: стіл (table)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Стіл закі́нчується на при́голосний і нале́жить до чолові́чого ро́ду.
      — "Стіл" ends in a consonant and is masculine.
  - prompt: кни́га (book)
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Кни́га закі́нчується на -а і нале́жить до жіно́чого ро́ду. — "Кни́га"
      ends in -а and is feminine.
  - prompt: вікно́ (window)
    options:
    - text: воно́
      correct: true
    - text: він
      correct: false
    - text: вона́
      correct: false
    explanation: Вікно́ закі́нчується на -о і нале́жить до сере́днього ро́ду. — "Вікно́"
      ends in -о and is neuter.
  - prompt: ба́тько (father)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Ба́тько — чолові́чого ро́ду, бо назива́є чолові́ка. — "Ба́тько" is
      masculine because it names a male person.
  - prompt: сестра́ (sister)
    options:
    - text: вона́
      correct: true
    - text: воно́
      correct: false
    - text: він
      correct: false
    explanation: Сестра́ нале́жить до жіно́чого ро́ду. — "Сестра́" is feminine.
  - prompt: мі́сто (city)
    options:
    - text: воно́
      correct: true
    - text: вона́
      correct: false
    - text: він
      correct: false
    explanation: Мі́сто закі́нчується на -о і нале́жить до сере́днього ро́ду. — "Мі́сто"
      is neuter.
  - prompt: та́то (dad)
    options:
    - text: він
      correct: true
    - text: воно́
      correct: false
    - text: вона́
      correct: false
    explanation: Та́то — чолові́чого ро́ду, бо назива́є чолові́ка. — "Та́то" is masculine
      because it names a male person.
  - prompt: Мико́ла (Mykola - male name)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Мико́ла — чолові́че ім'я́. — "Мико́ла" is a masculine name.
- id: act-5
  type: quiz
  title: Закі́нчення підка́зує рід — The ending hints at the gender
  instruction: Обери́ прави́льний рід за закі́нченням іме́нника. — Choose the usual
    gender signal from the noun ending.
  items:
  - prompt: стіл закі́нчується на при́голосний. — "Стіл" ends in a consonant.
    options:
    - text: він / мій
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: Чітке́ закі́нчення на при́голосний — це звича́йно чолові́чий рід
      (він / мій). — A clear consonant ending is usually masculine.
  - prompt: брат закі́нчується на при́голосний. — "Брат" ends in a consonant.
    options:
    - text: він / мій
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: «Брат» закі́нчується на при́голосний і є чолові́чим ро́дом (він /
      мій). — "Брат" ends in a consonant and is masculine.
  - prompt: кни́га закі́нчується на -а. — "Кни́га" ends in -а.
    options:
    - text: вона́ / моя́
      correct: true
    - text: він / мій
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: Чітке́ закі́нчення на -а — це звича́йно жіно́чий рід (вона́ / моя́).
      — A clear -а ending is usually feminine.
  - prompt: сестра́ закі́нчується на -а. — "Сестра́" ends in -а.
    options:
    - text: вона́ / моя́
      correct: true
    - text: він / мій
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: «Сестра́» закі́нчується на -а і є жіно́чим ро́дом (вона́ / моя́).
      — "Сестра́" ends in -а and is feminine.
  - prompt: вікно́ закі́нчується на -о. — "Вікно́" ends in -о.
    options:
    - text: воно́ / моє́
      correct: true
    - text: він / мій
      correct: false
    - text: вона́ / моя́
      correct: false
    explanation: Чітке́ закі́нчення на -о — це звича́йно сере́дній рід (воно́ / моє́).
      — A clear -о ending is usually neuter.
  - prompt: мі́сто закі́нчується на -о. — "Мі́сто" ends in -о.
    options:
    - text: воно́ / моє́
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: він / мій
      correct: false
    explanation: «Мі́сто» закі́нчується на -о і є сере́днім ро́дом (воно́ / моє́).
      — "Мі́сто" ends in -о and is neuter.
- id: act-4
  type: fill-in
  title: Мій предме́т — My object
  instruction: Обері́ть мій, моя́ чи моє́. — Choose мій, моя́, or моє́.
  items:
  - sentence: Це ___ стіл.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
    explanation: Стіл — чолові́чий рід (Це мій стіл). — "Стіл" is masculine (Це мій
      стіл).
  - sentence: Це ___ кни́га.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Кни́га — жіно́чий рід (Це моя́ кни́га). — "Кни́га" is feminine (Це
      моя́ кни́га).
  - sentence: Це ___ вікно́.
    answer: моє́
    options:
    - моє́
    - мій
    - моя́
    explanation: Вікно́ — сере́дній рід (Це моє́ вікно́). — "Вікно́" is neuter (Це
      моє́ вікно́).
  - sentence: Це ___ кімна́та.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Кімна́та — жіно́чий рід (Це моя́ кімна́та). — "Кімна́та" is feminine
      (Це моя́ кімна́та).
  - sentence: Це ___ лі́жко.
    answer: моє́
    options:
    - моє́
    - моя́
    - мій
    explanation: Лі́жко — сере́дній рід (Це моє́ лі́жко). — "Лі́жко" is neuter (Це
      моє́ лі́жко).
  - sentence: Це ___ телефо́н.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
    explanation: Телефо́н — чолові́чий рід (Це мій телефо́н). — "Телефо́н" is masculine
      (Це мій телефо́н).
  - sentence: Це ___ ру́чка.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Ру́чка — жіно́чий рід (Це моя́ ру́чка). — "Ру́чка" is feminine (Це
      моя́ ру́чка).
  - sentence: Це ___ фо́то.
    answer: моє́
    options:
    - моє́
    - моя́
    - мій
    explanation: Фо́то — сере́дній рід (Це моє́ фо́то). — "Фо́то" is neuter (Це моє́
      фо́то).
- id: act-9
  type: quiz
  title: Фо́рми профе́сій — Profession forms
  instruction: Обери́ приро́дну фо́рму профе́сії. — Choose the natural profession
    form.
  items:
  - prompt: She is a teacher.
    options:
    - text: Вона́ вчи́телька.
      correct: true
    - text: Вона́ вчи́тель.
      correct: false
    - text: Воно́ вчи́телька.
      correct: false
    explanation: Вжива́йте жіно́чу фо́рму профе́сії для жі́нки (вчи́телька). — Use
      the feminine profession form for a woman.
  - prompt: She is a doctor.
    options:
    - text: Вона́ лі́карка.
      correct: true
    - text: Вона́ лі́кар.
      correct: false
    - text: Він лі́карка.
      correct: false
    explanation: Лі́карка — це жіно́ча фо́рма профе́сії. — "Лі́карка" is the feminine
      form.
  - prompt: He is a student.
    options:
    - text: Він студе́нт.
      correct: true
    - text: Він студе́нтка.
      correct: false
    - text: Вона́ студе́нт.
      correct: false
    explanation: Студе́нт — це чолові́ча фо́рма. — "Студе́нт" is the masculine form.
  - prompt: She is an actor.
    options:
    - text: Вона́ акто́рка.
      correct: true
    - text: Вона́ акто́р.
      correct: false
    - text: Воно́ акто́рка.
      correct: false
    explanation: Акто́рка — це жіно́ча фо́рма профе́сії. — "Акто́рка" is the feminine
      profession form.
workbook:
- id: act-w1
  type: group-sort
  title: Сорту́й за ро́дом — Sort by gender
  instruction: Розподілі́ть іме́нники за озна́кою ро́ду. — Sort each noun by its A1
    gender signal.
  groups:
  - label: він / мій (masculine)
    items:
    - стіл
    - та́то
    - ба́тько
    - брат
  - label: вона́ / моя́ (feminine)
    items:
    - кни́га
    - сестра́
    - ма́ма
  - label: воно́ / моє́ (neuter)
    items:
    - вікно́
    - мі́сто
- id: act-w2
  type: match-up
  title: Слова́ для кімна́ти й су́мки — Words for the room and bag
  instruction: З'єдна́йте украї́нський іме́нник з англі́йським перекла́дом. — Match
    each Ukrainian noun with its English cue.
  pairs:
  - left: стіл
    right: table
  - left: кни́га
    right: book
  - left: вікно́
    right: window
  - left: кімна́та
    right: room
  - left: лі́жко
    right: bed
  - left: телефо́н
    right: phone
  - left: ру́чка
    right: pen
  - left: зо́шит
    right: notebook
- id: act-w3
  type: fill-in
  title: У мене́ є предме́ти — I have objects
  instruction: Допо́вніть ре́чення про предме́ти. — Complete the object sentence.
  items:
  - sentence: ___ мене́ є стіл.
    answer: У
    options:
    - У
    - Це
    - Хто
    explanation: Констру́кція «У мене́ є...» — фра́за «у мене є». — "У мене́ є..."
      is the I-have phrase.
  - sentence: У мене́ ___ кни́га.
    answer: є
    options:
    - є
    - зва́ти
    - моя́
    explanation: Фра́за «У мене́ є...» вжива́ється ра́зом. — "У мене́ є..." stays
      as one phrase.
  - sentence: У ___ є телефо́н?
    answer: тебе́
    options:
    - тебе́
    - мене́
    - мій
    explanation: Запита́ння «У тебе́ є...?» зверта́ється до одніє́ї люди́ни. — "У
      тебе́ є...?" asks one familiar person.
  - sentence: У мене́ є ___.
    answer: вікно́
    options:
    - вікно́
    - він
    - моя́
    explanation: Вікно́ — іме́нник пі́сля «У мене́ є». — "Вікно́" is an object noun
      after "У мене́ є".
  - sentence: Де стіл? ___ тут.
    answer: Він
    options:
    - Він
    - Вона́
    - Воно́
    explanation: Стіл — чолові́чий рід, тому́ вжива́ємо «він». — "Стіл" is masculine,
      so use "він".
  - sentence: Де кни́га? ___ тут.
    answer: Вона́
    options:
    - Вона́
    - Він
    - Воно́
    explanation: Кни́га — жіно́чий рід, тому́ вжива́ємо «вона́». — "Кни́га" is feminine,
      so use "вона́".
  - sentence: Де вікно́? ___ там.
    answer: Воно́
    options:
    - Воно́
    - Вона́
    - Він
    explanation: Вікно́ — сере́дній рід, тому́ вжива́ємо «воно́». — "Вікно́" is neuter,
      so use "воно́".
- id: act-w4
  type: error-correction
  title: Ви́прав па́стки ро́ду — Fix the gender traps
  instruction: Обері́ть прави́льне украї́нське ре́чення. — Choose the safer Ukrainian
    sentence.
  items:
  - sentence: Мій кни́га, мій ру́чка (якщо́ гово́рить чолові́к).
    error: Мій кни́га, мій ру́чка (якщо́ гово́рить чолові́к).
    correction: Моя́ кни́га, моя́ ру́чка.
    options:
    - Моя́ кни́га, моя́ ру́чка.
    - Мій кни́га, мій ру́чка.
    explanation: Присві́йний займе́нник узго́джується з іме́нником (кни́га, ру́чка),
      а не з мо́вцем. — The possessive follows the nouns кни́га and ру́чка, not the
      speaker.
  - sentence: Мій кни́га тут.
    error: Мій кни́га тут.
    correction: Моя́ кни́га тут.
    options:
    - Моя́ кни́га тут.
    - Мій кни́га тут.
    explanation: Кни́га — жіно́чий рід, тому́ «моя́ кни́га». — "Кни́га" is feminine,
      so use "моя́".
  - sentence: Мій ру́чка там.
    error: Мій ру́чка там.
    correction: Моя́ ру́чка там.
    options:
    - Моя́ ру́чка там.
    - Мій ру́чка там.
    explanation: Ру́чка — жіно́чий рід, тому́ «моя́ ру́чка». — "Ру́чка" is feminine,
      so use "моя́".
  - sentence: Де стіл? — Воно́ там. (Where is the table? — It is there.)
    error: Де стіл? — Воно́ там. (Where is the table? — It is there.)
    correction: Де стіл? — Він там.
    options:
    - Де стіл? — Він там.
    - Де стіл? — Воно́ там.
    explanation: Стіл — чолові́чий рід, тому́ вжива́ємо «він». — "Стіл" is masculine,
      so the pronoun is він.
  - sentence: Це моя́ та́то.
    error: Це моя́ та́то.
    correction: Це мій та́то.
    options:
    - Це мій та́то.
    - Це моя́ та́то.
    explanation: Та́то — чолові́к, тому́ «мій та́то». — "Та́то" is masculine.
  - sentence: Вона́ Мико́ла.
    error: Вона́ Мико́ла.
    correction: Він Мико́ла.
    options:
    - Він Мико́ла.
    - Вона́ Мико́ла.
    explanation: Мико́ла — чолові́че ім'я́, тому́ «він». — "Мико́ла" is a masculine
      name.
  - sentence: Моя́ соба́ка ду́же га́рна.
    error: Моя́ соба́ка ду́же га́рна.
    correction: Мій соба́ка ду́же га́рний.
    options:
    - Мій соба́ка ду́же га́рний.
    - Моя́ соба́ка ду́же га́рна.
    explanation: 'Соба́ка в украї́нській мо́ві — чолові́чого ро́ду: «мій соба́ка».
      — "Соба́ка" is masculine in Ukrainian; memorize "мій соба́ка".'
  - sentence: Я є студе́нт.
    error: Я є студе́нт.
    correction: Я студе́нт.
    options:
    - Я студе́нт.
