inline:
  - id: act-1
    type: group-sort
    title: Three place questions
    instruction: Sort each phrase by the question it answers.
    groups:
      - name: 'Де?'
        items:
          - 'в Україні'
          - 'у Києві'
          - 'на роботі'
          - 'у школі'
      - name: 'Куди?'
        items:
          - 'в Україну'
          - 'у Київ'
          - 'на роботу'
          - 'у школу'
      - name: 'Звідки?'
        items:
          - 'з України'
          - 'з Києва'
          - 'з роботи'
          - 'зі школи'
  - id: act-2
    type: quiz
    title: Origin or current home
    instruction: Choose the phrase that fits the question.
    items:
      - prompt: 'Звідки ти?'
        options:
          - text: 'Я з України.'
            correct: true
          - text: 'Я в Україні.'
            correct: false
          - text: 'Я в Україну.'
            correct: false
        explanation: 'Звідки? asks for origin or source: з України.'
      - prompt: 'Де ти зараз живеш?'
        options:
          - text: 'У Києві.'
            correct: true
          - text: 'У Київ.'
            correct: false
          - text: 'З Києва.'
            correct: false
        explanation: 'Де? asks for static location: у Києві.'
      - prompt: 'Куди ти їдеш?'
        options:
          - text: 'В Україну.'
            correct: true
          - text: 'В Україні.'
            correct: false
          - text: 'З України.'
            correct: false
        explanation: 'Куди? asks for destination: в Україну.'
      - prompt: 'З якого міста Олена?'
        options:
          - text: 'Вона зі Львова.'
            correct: true
          - text: 'Вона у Львові.'
            correct: false
          - text: 'Вона у Львів.'
            correct: false
        explanation: 'Origin from Lviv is зі Львова.'
      - prompt: 'Звідки Марко йде?'
        options:
          - text: 'З роботи.'
            correct: true
          - text: 'На роботу.'
            correct: false
          - text: 'На роботі.'
            correct: false
        explanation: 'Coming from work uses з роботи.'
      - prompt: 'Де Анна навчається?'
        options:
          - text: 'У школі.'
            correct: true
          - text: 'Зі школи.'
            correct: false
          - text: 'У школу.'
            correct: false
        explanation: 'A static study place answers де?'
  - id: act-3
    type: fill-in
    title: Student badge origins
    instruction: Complete each badge line with the safe from-place phrase.
    items:
      - sentence: 'Звідки ти? — Я ___.'
        answer: 'з України'
        options:
          - 'з України'
          - 'в Україну'
          - 'в Україні'
        explanation: 'Origin uses з України.'
      - sentence: 'Анна ___.'
        answer: 'з Канади'
        options:
          - 'з Канади'
          - 'в Канаді'
          - 'у Канаду'
        explanation: 'Country origin uses з + from-place form.'
      - sentence: 'Ми ___, а ви?'
        answer: 'з Києва'
        options:
          - 'з Києва'
          - 'у Києві'
          - 'у Київ'
        explanation: 'Kyiv changes to з Києва.'
      - sentence: 'Джон ___.'
        answer: 'зі США'
        options:
          - 'зі США'
          - "США"
          - 'у США'
        explanation: 'Use зі США for easier pronunciation.'
      - sentence: 'Мій друг ___.'
        answer: 'з Німеччини'
        options:
          - 'з Німеччини'
          - 'у Німеччину'
          - 'в Німеччині'
        explanation: 'Звідки? uses з Німеччини.'
      - sentence: 'Олена живе в Києві, але вона ___.'
        answer: 'зі Львова'
        options:
          - 'зі Львова'
          - 'у Львові'
          - 'до Львова'
        explanation: 'Origin from Lviv is зі Львова.'
  - id: act-4
    type: match-up
    title: Base name to from-place form
    instruction: Match each base place name with the phrase that answers Звідки?
    pairs:
      - left: 'Україна'
        right: 'з України'
      - left: 'Канада'
        right: 'з Канади'
      - left: 'Київ'
        right: 'з Києва'
      - left: 'Львів'
        right: 'зі Львова'
      - left: 'Одеса'
        right: 'з Одеси'
      - left: 'Харків'
        right: 'з Харкова'
      - left: 'США'
        right: 'зі США'
      - left: 'школа'
        right: 'зі школи'
workbook:
  - type: fill-in
    title: International meet-up
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - sentence: Добрий день! ___ звати Анна.
        answer: Мене
        options:
          - Мене
          - Мені
          - Мною
        explanation: The naming phrase is Мене звати.
      - sentence: Дуже приємно. Мене ___ Марко.
        answer: звати
        options:
          - звати
          - зватися
          - звуся
        explanation: Use the naming phrase Мене звати Марко.
      - sentence: Звідки ___, Анно?
        answer: ти
        options:
          - ти
          - тебе
          - тобі
        explanation: Ти is the subject of the origin question.
      - sentence: — Звідки ти? — Я з ___, із Торонто. А ти?
        answer: Канади
        options:
          - Канади
          - Канада
          - Канадою
        explanation: З takes the genitive form Канади.
      - sentence: — Звідки ти? — Я з ___, з Києва.
        answer: України
        options:
          - України
          - Україна
          - Україною
        explanation: З takes the genitive form України.
      - sentence: Чудово. Говорімо українською! Марко з ___.
        answer: Києва
        options:
          - Києва
          - Київ
          - Києвом
        explanation: З takes the genitive form Києва.
  - type: true-false
    title: Toponym and identity guardrails
    instruction: Decide whether the statement fits this lesson.
    items:
      - statement: Україна, Київ, Львів, and Канада are proper names and use capital letters.
        correct: true
        explanation: Country and city names are proper names.
      - statement: Я з Києва is the safe answer to Звідки ти?
        correct: true
        explanation: Київ changes to Києва after з.
      - statement: Я з України can state origin without є.
        correct: true
        explanation: Є can be omitted here. Its omission is the short A1 model, rather than a ban on є.
      - statement: Вона львів'янка matches a woman from Lviv.
        correct: true
        explanation: Use the feminine demonym.
      - statement: Kiev is the course English spelling for Київ.
        correct: false
        explanation: Use Kyiv / Київ.
      - statement: Зі США is easier and safer than з США.
        correct: true
        explanation: Зі avoids a hard consonant cluster.
  - type: odd-one-out
    title: Find the from-place mismatch
    instruction: Choose the line that does not fit the pattern.
    items:
      - words:
          - 'з України'
          - 'з Канади'
          - 'з Києва'
          - 'у Києві'
        answer: 'у Києві'
        explanation: 'У Києві answers де?, not звідки?'
      - words:
          - 'в Україну'
          - 'у Київ'
          - 'на роботу'
          - 'з роботи'
        answer: 'з роботи'
        explanation: 'З роботи answers звідки?, not куди?'
      - words:
          - 'українець'
          - 'українка'
          - 'киянин'
          - 'з України'
        answer: 'з України'
        explanation: 'The first three name people; з України names origin.'
      - words:
          - 'Kyiv'
          - 'Lviv'
          - 'Odesa'
          - 'Odessa'
        answer: 'Odessa'
        explanation: 'Use Odesa for the Ukrainian city name in English.'
  - type: error-correction
    title: Repair where-from interference
    instruction: Choose the natural Ukrainian repair.
    anchor_id: repair-where-from-interference
    items:
      - sentence: Я з Київ.
        error: Київ
        answer: Я з Києва.
        options:
          - Я з Києва.
          - Я з Київ.
          - Я в Києва.
        explanation: Звідки? uses the from-place form Києва.
      - sentence: Я з Україну.
        error: Україну
        answer: Я з України.
        options:
          - Я з України.
          - Я з Україну.
          - Я з Україною.
        explanation: З takes the genitive form України.
      - sentence: Він живе в Київ.
        error: Київ
        answer: Він живе в Києві.
        options:
          - Він живе в Києві.
          - Він живе в Київ.
          - Він живе з Києва.
        explanation: Живе answers де?, so use в Києві.
      - sentence: Вона львів'янин.
        error: львів'янин
        answer: Вона львів'янка.
        options:
          - Вона львів'янка.
          - Вона львів'янин.
          - Вона з львів'янин.
        explanation: Use the feminine demonym for вона.
      - sentence: — Звідки ти? — Я з США.
        error: з
        answer: — Звідки ти? — Я зі США.
        options:
          - — Звідки ти? — Я зі США.
          - — Звідки ти? — Я з США.
          - — Звідки ти? — Я у США.
        explanation: Зі avoids the consonant cluster before США. The question asks for origin; у США gives location.
      - sentence: Я з місто Львів.
        error: місто Львів
        answer: Я зі Львова.
        options:
          - Я зі Львова.
          - Я зі Львів.
          - Я з міста Львові.
        explanation: Зі takes the genitive form Львова.
  - type: fill-in
    title: Country, city, current home
    instruction: Complete each short introduction with a safe learned phrase.
    items:
      - sentence: "— Звідки ти? — Я ___."
        answer: 'з України'
        options:
          - 'з України'
          - 'в Україні'
          - 'в Україну'
        explanation: "Звідки asks for origin. The keyed з/зі phrase gives that origin. The location and destination alternatives answer де/куди instead of the stated origin question."
      - sentence: "— Звідки Анна? — Вона ___."
        answer: 'з Канади'
        options:
          - 'з Канади'
          - 'у Канаді'
          - 'до Канади'
        explanation: "Звідки asks for origin. The keyed з/зі phrase gives that origin. The location and destination alternatives answer де/куди instead of the stated origin question."
      - sentence: "— Звідки Олена? — Вона ___."
        answer: 'зі Львова'
        options:
          - 'зі Львова'
          - 'у Львові'
          - 'до Львова'
        explanation: "Звідки asks for origin. The keyed з/зі phrase gives that origin. The location and destination alternatives answer де/куди instead of the stated origin question."
      - sentence: 'Ми зараз в Україні, але ми ___.'
        answer: 'з Польщі'
        options:
          - 'з Польщі'
          - 'у Польщі'
          - 'до Польщі'
        explanation: 'Use з Польщі for origin.'
      - sentence: "— Звідки Джон? — Він ___."
        answer: 'зі США'
        options:
          - 'зі США'
          - 'у США'
          - 'до США'
        explanation: "Звідки asks for origin. The keyed з/зі phrase gives that origin. The location and destination alternatives answer де/куди instead of the stated origin question."
      - sentence: "— Звідки Марко? — Він ___."
        answer: 'з Києва'
        options:
          - 'з Києва'
          - 'у Києві'
          - 'у Київ'
        explanation: "Звідки asks for origin. The keyed з/зі phrase gives that origin. The location and destination alternatives answer де/куди instead of the stated origin question."
  - type: match-up
    title: Ask the right place question
    instruction: Match each answer with the question it answers.
    pairs:
      - left: Я в Україні.
        right: У якій країні ти зараз?
      - left: Я їду в Україну.
        right: Куди ти їдеш?
      - left: Я з України.
        right: З якої країни ти?
      - left: Я у Києві.
        right: У якому місті ти зараз живеш?
      - left: Я з Києва.
        right: З якого міста ти?
      - left: Я йду з роботи.
        right: Звідки ти йдеш?
