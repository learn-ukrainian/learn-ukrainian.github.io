inline:
  - id: act-1
    type: quiz
    title: Ти чи ви?
    instruction: Обери фразу для ситуації.
    items:
      - prompt: "Ти говориш одному однокурснику: «Привіт! Ти теж тут навчаєшся? ___»"
        options:
          - text: Як тебе звати?
            correct: true
          - text: Як вас звати?
            correct: false
        explanation: "Ти and тебе keep one consistent way of addressing the classmate. Вас would switch the address within this utterance."
      - prompt: Ти знайомишся з незнайомим дорослим на орієнтації.
        options:
          - text: Як вас звати?
            correct: true
          - text: Як тебе звати?
            correct: false
        explanation: З незнайомим дорослим або у формальній ситуації уживай вас.
      - prompt: "— Привіт! Як тебе звати? — ___"
        options:
          - text: Мене звати Олена. А тебе?
            correct: true
          - text: Мене звати Олена. А вас?
            correct: false
        explanation: "The peer uses тебе, so А тебе returns the question in the same register."
      - prompt: Викладач питає твоє ім'я. Ти відповідаєш і повертаєш питання.
        options:
          - text: Мене звати Петро. А вас?
            correct: true
          - text: Мене звати Петро. А тебе?
            correct: false
        explanation: З викладачем ситуація залишається формальною.
  - id: act-2
    type: fill-in
    title: Склади ім'я
    instruction: Обери пропущене слово або фразу.
    items:
      - sentence: ___ звати Марко.
        answer: Мене
        options:
          - Мене
          - Ти
          - Це
        explanation: Мене звати... — цілий блок для представлення імені.
      - sentence: Як ___ звати?
        answer: тебе
        options:
          - тебе
          - я
          - він
        explanation: Як тебе звати? — неформальне питання.
      - sentence: Як ___ звати?
        answer: вас
        options:
          - вас
          - вона
          - ми
        explanation: Як вас звати? — формальне або множинне питання.
      - sentence: Дуже ___!
        answer: приємно
        options:
          - приємно
          - студент
          - звідки
        explanation: Дуже приємно звучить після обміну іменами.
      - sentence: Мене звати Олена. А ___?
        answer: тебе
        options:
          - тебе
          - Київ
          - це
        explanation: А тебе? неформально повертає питання.
  - id: act-3
    type: match-up
    title: Це / хто / що
    instruction: З'єднай український рядок із його роботою.
    pairs:
      - left: Це Андрій.
        right: представити іншу людину
      - left: Мене звати Оксана.
        right: назвати своє ім'я
      - left: Хто це?
        right: запитати про людину
      - left: Що це?
        right: запитати про річ
      - left: Це кава.
        right: назвати річ
  - id: act-4
    type: quiz
    title: Обери займенник
    instruction: Обери займенник для української ситуації.
    items:
      - prompt: Мовець говорить про себе.
        options:
          - text: я
            correct: true
          - text: ти
            correct: false
          - text: вони
            correct: false
        explanation: Я — це мовець.
      - prompt: Один друг або близький однокурсник.
        options:
          - text: ти
            correct: true
          - text: ви
            correct: false
          - text: він
            correct: false
        explanation: Ти — один неформальний співрозмовник.
      - prompt: Один незнайомий дорослий або формальна ситуація.
        options:
          - text: ви
            correct: true
          - text: ти
            correct: false
          - text: вона
            correct: false
        explanation: Ви — формально до однієї людини, а також множина.
      - prompt: Жінка або дівчина вже відома в розмові.
        options:
          - text: вона
            correct: true
          - text: він
            correct: false
          - text: я
            correct: false
        explanation: Вона вказує на жінку або дівчину.
workbook:
  - type: error-correction
    title: Обери українське речення
    anchor_id: fix-common-l2-traps
    instruction: Обери безпечніший український рядок про ідентичність.
    items:
      - sentence: Я є студента.
        error: студента
        correction: Я студент.
        options:
          - Я студент.
          - Я є студента.
        explanation: Студент is nominative here. Є may be present or omitted; студента does not fit this identity sentence.
      - sentence: Мені звати Джон.
        error: Мені
        correction: Мене звати Джон.
        options:
          - Мене звати Джон.
          - Мені звати Джон.
        explanation: 'Use Мене звати Джон. The person named is the object of звати: мене fits; dative мені does not. A grammatical sentence with є is not an error.'
      - sentence: Як ти звати?
        error: ти
        correction: Як тебе звати?
        options:
          - Як тебе звати?
          - Як ти звати?
        explanation: The person named is the object of звати, so use тебе here; ти is the subject form.
      - sentence: 'Оксана каже: «Я лікарку».'
        error: лікарку
        correction: Я лікарка.
        options:
          - Я лікарка.
          - Я лікарку.
          - Мене лікарка.
        explanation: Я лікарка uses the nominative subject and profession noun. Лікарку is accusative; мене is not the subject form.
      - sentence: Воно мій тато.
        error: Воно
        correction: Це мій тато.
        options:
          - Це мій тато.
          - Воно мій тато.
        explanation: Для першого називання людини вживай це; він можливе після цього.
      - sentence: Добрий день, пане професора!
        error: професора
        correction: Добрий день, пане професоре!
        options:
          - Добрий день, пане професоре!
          - Добрий день, пане професора!
        explanation: Direct address uses the vocative професоре. Професора is an oblique case form.
  - type: match-up
    title: Пари назв людей — Pairs of words for people
    instruction: З'єднай чоловічу і жіночу форму слова. — Match the masculine and feminine forms of each word.
    pairs:
      - left: студент
        right: студентка
      - left: вчитель
        right: вчителька
      - left: лікар
        right: лікарка
      - left: програміст
        right: програмістка
      - left: інженер
        right: інженерка
      - left: українець
        right: українка
      - left: канадієць
        right: канадка
      - left: американець
        right: американка
  - type: group-sort
    title: Неформально чи формально
    instruction: Розклади фрази за ситуацією.
    groups:
      - label: Неформально
        items:
          - Як тебе звати?
          - А тебе?
          - Звідки ти?
      - label: Формально
        items:
          - Як вас звати?
          - А вас?
          - Звідки ви?
  - type: fill-in
    title: Доповни діалог
    instruction: Обери фразу, яка завершує рядок першого знайомства.
    items:
      - sentence: "— Привіт! Ти теж тут навчаєшся? Як ___ звати?"
        answer: тебе
        options:
          - тебе
          - вас
          - я
        explanation: "The same utterance uses ти with this addressee. Тебе maintains that register; the other address switches it mid-utterance, and nominative я does not fit the name construction."
      - sentence: Мене ___ Олена.
        answer: звати
        options:
          - звати
          - це
          - з
        explanation: Мене звати... — блок для імені.
      - sentence: Мене звати Марко. ___ тебе?
        answer: А
        options:
          - А
          - Хто
          - Що
        explanation: А тебе? повертає питання.
      - sentence: "— Добрий день! Ви теж тут навчаєтеся? Як ___ звати?"
        answer: вас
        options:
          - вас
          - тебе
          - я
        explanation: "The same utterance uses ви with this addressee. Вас maintains that register; the other address switches it mid-utterance, and nominative я does not fit the name construction."
      - sentence: Дуже ___!
        answer: приємно
        options:
          - приємно
          - Київ
          - студентка
        explanation: Дуже приємно звучить після обміну іменами.
      - sentence: ___ ти? Я з Канади.
        answer: Звідки
        options:
          - Звідки
          - Хто
          - Що
        explanation: Звідки питає, звідки людина.
  - type: fill-in
    title: Слова знайомства — Words for introductions
    instruction: Доповни речення. — Complete each sentence.
    items:
      - sentence: Це моя ___ Марія.
        answer: дружина
        options:
          - дружина
          - дружину
        explanation: Use nominative дружина after Це моя. Дружину is accusative.
      - sentence: Вибачте, як ___ звати?
        answer: вас
        options:
          - вас
          - ви
        explanation: Use вас as the object of звати. Ви is the subject form; the polite name question is Вибачте, як вас звати?
      - sentence: Я ___ вам за допомогу.
        answer: дякую
        options:
          - дякую
          - дякує
        explanation: Я takes first-person дякую. Дякує is the third-person form.
      - sentence: Мені ___ приємно.
        answer: теж
        options:
          - теж
          - тоже
        explanation: Теж і також — безпечні українські вибори.
      - sentence: Оксана — ___.
        answer: інженерка
        options:
          - інженерка
          - інженерку
        explanation: Оксана — інженерка uses a nominative profession noun. Інженерку is accusative.
      - sentence: Це мій ___.
        answer: лікар
        options:
          - лікар
          - лікаря
        explanation: Use nominative лікар after Це мій. Лікаря is an oblique case form.
  - type: translate
    title: Лексика знайомства
    instruction: Обери англійське значення.
    items:
      - source: Мене звати...
        options:
          - text: My name is...
            correct: true
          - text: Where are you from?
            correct: false
          - text: This is...
            correct: false
        explanation: Мене звати... — блок для імені.
      - source: Як тебе звати?
        options:
          - text: What is your name? informal
            correct: true
          - text: Who is this?
            correct: false
          - text: I am from Ukraine.
            correct: false
        explanation: Тебе позначає неформальну версію.
      - source: Як вас звати?
        options:
          - text: What is your name? formal
            correct: true
          - text: And yours? informal
            correct: false
          - text: This is Kyiv.
            correct: false
        explanation: Вас позначає формальну версію.
      - source: Дуже приємно!
        options:
          - text: Pleased to meet you!
            correct: true
          - text: Goodbye!
            correct: false
          - text: Where from?
            correct: false
        explanation: Дуже приємно ввічливо завершує представлення.
      - source: Звідки ти?
        options:
          - text: Where are you from? informal
            correct: true
          - text: What is this?
            correct: false
          - text: I am a student.
            correct: false
        explanation: Звідки питає про походження.
      - source: Я — студентка.
        options:
          - text: I am a female student.
            correct: true
          - text: She is a doctor.
            correct: false
          - text: My name is...
            correct: false
        explanation: Студентка — жіноча форма.
