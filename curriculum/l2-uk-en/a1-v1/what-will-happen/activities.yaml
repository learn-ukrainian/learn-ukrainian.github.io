inline:
  - id: act-1
    type: match-up
    title: Match the future form
    instruction: Match each person with the future form of бути.
    pairs:
      - left: 'я'
        right: 'буду'
      - left: 'ти'
        right: 'будеш'
      - left: 'він / вона'
        right: 'буде'
      - left: 'ми'
        right: 'будемо'
      - left: 'ви'
        right: 'будете'
      - left: 'вони'
        right: 'будуть'
  - id: act-2
    type: fill-in
    title: Build the compound future
    instruction: Choose the correct form of бути.
    items:
      - sentence: 'Завтра я ___ працювати.'
        answer: 'буду'
        options:
          - 'буду'
          - 'буде'
          - 'будемо'
        explanation: 'Я takes буду.'
      - sentence: 'Що ти ___ робити ввечері?'
        answer: 'будеш'
        options:
          - 'будеш'
          - 'буду'
          - 'будете'
        explanation: 'Ти takes будеш.'
      - sentence: 'Вона ___ читати книжку.'
        answer: 'буде'
        options:
          - 'буде'
          - 'будуть'
          - 'будемо'
        explanation: 'Вона takes буде.'
      - sentence: 'Ми ___ дивитися футбол.'
        answer: 'будемо'
        options:
          - 'будемо'
          - 'буде'
          - 'буду'
        explanation: 'Ми takes будемо.'
      - sentence: 'Ви ___ гуляти в парку?'
        answer: 'будете'
        options:
          - 'будете'
          - 'будеш'
          - 'будуть'
        explanation: 'Ви takes будете.'
      - sentence: 'Вони ___ відпочивати.'
        answer: 'будуть'
        options:
          - 'будуть'
          - 'будемо'
          - 'буде'
        explanation: 'Вони takes будуть.'
  - id: act-3
    type: quiz
    title: "Choose the answer"
    instruction: "Choose the best answer."
    items:
      - prompt: "— Що ти будеш робити завтра? — ___"
        options:
          - text: 'Я буду читати.'
            correct: true
          - text: 'Я буду читаю.'
            correct: false
          - text: "Я будемо читати."
            correct: false
        explanation: "Буду читати combines first-person singular буду with an infinitive. Буду читаю has two finite forms; я будемо disagrees in number."
      - prompt: 'What stays unchanged after будемо?'
        options:
          - text: 'The infinitive.'
            correct: true
          - text: 'A present-tense ending.'
            correct: false
          - text: 'A past-tense ending.'
            correct: false
        explanation: 'The second verb stays in the infinitive.'
      - prompt: 'Which form fits ми?'
        options:
          - text: 'Ми будемо робити.'
            correct: true
          - text: 'Ми буде робити.'
            correct: false
          - text: 'Ми будеш робити.'
            correct: false
        explanation: 'Ми takes будемо.'
      - prompt: "— ___ — Завтра я буду читати книжку."
        options:
          - text: 'Що ти будеш робити завтра?'
            correct: true
          - text: 'Що ти робиш учора?'
            correct: false
          - text: 'Що ти робив зараз?'
            correct: false
        explanation: 'Будеш робити завтра is the future question.'
  - id: act-4
    type: group-sort
    title: Sort the time frames
    instruction: Sort each sentence by time.
    groups:
      - name: 'past'
        items:
          - 'Учора я читав.'
          - 'Учора вона працювала.'
      - name: 'present'
        items:
          - 'Зараз я читаю.'
          - 'Зараз ми працюємо.'
      - name: 'future'
        items:
          - 'Завтра я буду читати.'
          - 'Наступного тижня ми будемо працювати.'
workbook:
  - type: true-false
    title: Check the compound future
    instruction: Decide whether each sentence uses буду + infinitive correctly.
    items:
      - statement: 'Я буду читати завтра.'
        answer: true
        explanation: 'Буду + читати is correct.'
      - statement: 'Що ти будеш робити ввечері?'
        answer: true
        explanation: 'Будеш + робити is correct.'
      - statement: 'Вона буде читає книжку.'
        answer: false
        explanation: 'After буде, use читати.'
      - statement: 'Ми будемо дивитися футбол.'
        answer: true
        explanation: 'Будемо + дивитися is correct.'
      - statement: 'Вони будуть працюють.'
        answer: false
        explanation: 'After будуть, use працювати.'
      - statement: 'Ви будете гуляти в парку?'
        answer: true
        explanation: 'Будете + гуляти is correct.'
  - type: quiz
    title: Choose future sentences
    instruction: Choose the sentence whose words fit together.
    items:
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Завтра я буду працювати.
            correct: true
          - text: Завтра я будеш працювати.
            correct: false
          - text: Завтра я будемо працювати.
            correct: false
        explanation: The subject agrees with буду; будеш and будемо belong to different persons or numbers.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Що ти будеш робити ввечері?
            correct: true
          - text: Що ти буду робити ввечері?
            correct: false
          - text: Що ти будуть робити ввечері?
            correct: false
        explanation: The subject agrees with будеш; буду and будуть belong to different persons or numbers.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Вона буде читати книжку.
            correct: true
          - text: Вона буду читати книжку.
            correct: false
          - text: Вона будуть читати книжку.
            correct: false
        explanation: The subject agrees with буде; буду and будуть belong to different persons or numbers.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Ми будемо дивитися футбол.
            correct: true
          - text: Ми буде дивитися футбол.
            correct: false
          - text: Ми буду дивитися футбол.
            correct: false
        explanation: The subject agrees with будемо; буде and буду belong to different persons or numbers.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Вони будуть відпочивати.
            correct: true
          - text: Вони буде відпочивати.
            correct: false
          - text: Вони буду відпочивати.
            correct: false
        explanation: The subject agrees with будуть; буде and буду belong to different persons or numbers.
  - type: order
    title: From now to tomorrow
    instruction: Put the mini-sequence in a natural time order.
    items:
      - 'Зараз понеділок, восьма ранку. Я читаю.'
      - 'Сьогодні ввечері я буду готувати.'
      - 'Завтра я буду працювати.'
      - 'Наступного тижня я буду відпочивати.'
    correct_order: [0, 1, 2, 3]
  - type: fill-in
    title: "Complete the sentence"
    instruction: "Choose the word that completes each sentence."
    items:
      - sentence: 'Я буду ___ завтра.'
        answer: 'читати'
        options:
          - 'читати'
          - 'читаю'
          - 'читав'
        explanation: "The given future auxiliary takes infinitive читати. читаю is a finite present form and читав a finite past form; neither combines with that auxiliary."
      - sentence: 'Що ти будеш ___ ввечері?'
        answer: 'робити'
        options:
          - 'робити'
          - 'робиш'
          - 'робив'
        explanation: "The given future auxiliary takes infinitive робити. робиш is a finite present form and робив a finite past form; neither combines with that auxiliary."
      - sentence: 'Вона буде ___ вечерю.'
        answer: 'готувати'
        options:
          - 'готувати'
          - 'готує'
          - 'готувала'
        explanation: "The given future auxiliary takes infinitive готувати. готує is a finite present form and готувала a finite past form; neither combines with that auxiliary."
      - sentence: 'Ми будемо ___ футбол.'
        answer: 'дивитися'
        options:
          - 'дивитися'
          - 'дивимося'
          - 'дивилися'
        explanation: "The given future auxiliary takes infinitive дивитися. дивимося is a finite present form and дивилися a finite past form; neither combines with that auxiliary."
      - sentence: 'Вони будуть ___.'
        answer: 'відпочивати'
        options:
          - 'відпочивати'
          - 'відпочивають'
          - 'відпочивали'
        explanation: "The given future auxiliary takes infinitive відпочивати. відпочивають is a finite present form and відпочивали a finite past form; neither combines with that auxiliary."
  - type: translate
    title: Say future plans
    instruction: Choose the Ukrainian sentence that matches the English prompt.
    items:
      - source: 'Tomorrow I will work.'
        options:
          - text: 'Завтра я буду працювати.'
            correct: true
          - text: 'Учора я працював.'
            correct: false
          - text: 'Зараз я працюю.'
            correct: false
        explanation: 'Tomorrow needs буду працювати.'
      - source: 'What will you do in the evening?'
        options:
          - text: 'Що ти будеш робити ввечері?'
            correct: true
          - text: 'Що ти робив учора?'
            correct: false
          - text: 'Що ти робиш зараз?'
            correct: false
        explanation: 'Use будеш робити for you will do.'
      - source: 'We will watch football.'
        options:
          - text: 'Ми будемо дивитися футбол.'
            correct: true
          - text: 'Ми буде дивитися футбол.'
            correct: false
          - text: 'Ми дивилися футбол.'
            correct: false
        explanation: 'Use будемо дивитися.'
      - source: 'They will rest.'
        options:
          - text: 'Вони будуть відпочивати.'
            correct: true
          - text: 'Вони буде відпочивати.'
            correct: false
          - text: 'Вони відпочивали.'
            correct: false
        explanation: 'Use будуть відпочивати.'
  - type: error-correction
    title: Repair future forms
    instruction: 'Keep pronouns and time words. Repair the compound future: an agreed auxiliary plus an infinitive.'
    items:
      - sentence: 'Я буду читаю завтра.'
        error: 'читаю'
        correction: 'читати'
        explanation: 'After буду, use the infinitive читати.'
      - sentence: 'Що ти будеш робиш ввечері?'
        error: 'робиш'
        correction: 'робити'
        explanation: 'After будеш, use робити.'
      - sentence: 'Вона буде читає книжку.'
        error: 'читає'
        correction: 'читати'
        explanation: 'After буде, use читати.'
      - sentence: 'Ми будемо дивимося футбол.'
        error: 'дивимося'
        correction: 'дивитися'
        explanation: 'After будемо, use дивитися.'
      - sentence: 'Ми будемо читаємо текст.'
        error: 'читаємо'
        correction: 'читати'
        explanation: 'After будемо, use the infinitive читати.'
      - sentence: 'Вони будуть працюють.'
        error: 'працюють'
        correction: 'працювати'
        explanation: 'After будуть, use працювати.'
      - sentence: 'Я буде робити завтра.'
        error: 'буде'
        correction: 'буду'
        explanation: 'Я takes буду.'
