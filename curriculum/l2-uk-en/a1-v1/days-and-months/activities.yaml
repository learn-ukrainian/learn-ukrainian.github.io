---
inline:
  - id: act-1
    type: fill-in
    title: Дні тижня по порядку
    instruction: Обери день, який правильно завершує послідовність.
    items:
      - sentence: 'понеділок, ___, середа'
        answer: вівторок
        options:
          - вівторок
          - субота
          - четвер
        explanation: 'After понеділок comes вівторок.'
      - sentence: 'середа, ___, п''ятниця'
        answer: четвер
        options:
          - четвер
          - п'ятниця
          - неділя
        explanation: 'After середа comes четвер.'
      - sentence: 'п''ятниця, ___, неділя'
        answer: субота
        options:
          - субота
          - вівторок
          - середа
        explanation: 'After п''ятниця comes субота.'
      - sentence: 'неділя, ___, вівторок'
        answer: понеділок
        options:
          - понеділок
          - вівторок
          - четвер
        explanation: 'After неділя comes понеділок.'
      - sentence: 'вівторок, середа, ___'
        answer: четвер
        options:
          - четвер
          - п'ятниця
          - неділя
        explanation: 'The sequence is вівторок, середа, четвер.'
      - sentence: 'четвер, п''ятниця, ___'
        answer: субота
        options:
          - субота
          - понеділок
          - вівторок
        explanation: 'The sequence is четвер, п''ятниця, субота.'
      - sentence: 'субота, ___, понеділок'
        answer: неділя
        options:
          - неділя
          - понеділок
          - п'ятниця
        explanation: 'After субота comes неділя.'
  - id: act-2
    type: group-sort
    title: Місяць і пора року
    instruction: Розподіли назви місяців за порами року в Україні.
    groups:
      - label: зима
        items:
          - січень
          - лютий
      - label: весна
        items:
          - квітень
          - травень
      - label: літо
        items:
          - липень
          - серпень
      - label: осінь
        items:
          - жовтень
          - листопад
  - id: act-3
    type: fill-in
    title: У/в для календаря
    instruction: Обери безпечну форму з у/в для дня, місяця або пори року.
    items:
      - sentence: "Урок ___."
        answer: у понеділок
        options:
          - у понеділок
          - понеділок
          - в понеділок
        explanation: "After the consonant in урок and before п, у понеділок follows the consonant-to-consonant pattern."
      - sentence: "Мій день народження — ___."
        answer: у березні
        options:
          - у березні
          - березень
          - в березень
        explanation: "The dash marks a pause. Before the consonant б after a pause, use у березні."
      - sentence: 'Ми гуляємо ___.'
        answer: в суботу
        options:
          - в суботу
          - субота
          - у субота
        explanation: 'Use the weekday phrase в суботу.'
      - sentence: '___ холодно.'
        answer: Взимку
        options:
          - Взимку
          - Зима
          - У зима
        explanation: 'Use the season phrase взимку.'
      - sentence: 'Я вивчаю українську ___.'
        answer: у вівторок
        options:
          - у вівторок
          - вівторок
          - в вівторок
        explanation: 'Use the weekday phrase у вівторок.'
      - sentence: 'Вони відпочивають ___.'
        answer: у серпні
        options:
          - у серпні
          - серпень
          - в серпень
        explanation: 'Use the month phrase у серпні.'
