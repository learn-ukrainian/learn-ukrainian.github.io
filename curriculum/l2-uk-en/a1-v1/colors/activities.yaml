---
inline:
  - id: act-1
    type: quiz
    title: Запитай про колір
    instruction: Choose the natural question or short answer.
    items:
      - prompt: "Ось олівець. Обери запитання про нього."
        options:
          - text: Якого кольору олівець?
            correct: true
          - text: Який колір є олівець?
            correct: false
          - text: Якого кольори олівець?
            correct: false
        explanation: "Use Якого кольору олівець? Якого and кольору agree. Кольори is plural, and Який колір є олівець does not form this question."
      - prompt: Якого кольору светр?
        options:
          - text: Синій.
            correct: true
          - text: Синя.
            correct: false
          - text: Синє.
            correct: false
        explanation: Светр is masculine, so the short answer is синій.
      - prompt: Якого кольору ручка?
        options:
          - text: Червона.
            correct: true
          - text: Червоний.
            correct: false
          - text: Червоне.
            correct: false
        explanation: Ручка is feminine.
      - prompt: Якого кольору вікно?
        options:
          - text: Біле.
            correct: true
          - text: Білий.
            correct: false
          - text: Біла.
            correct: false
        explanation: Вікно is neuter.
      - prompt: Якого кольору соняшники?
        options:
          - text: Жовті.
            correct: true
          - text: Жовта.
            correct: false
          - text: Жовте.
            correct: false
        explanation: Соняшники is plural.
      - prompt: Якого кольору прапор України?
        options:
          - text: Синьо-жовтий.
            correct: true
          - text: "Червоно-жовтий."
            correct: false
          - text: Сіро-жовтий.
            correct: false
        explanation: The standard phrase is синьо-жовтий прапор.
      - prompt: Якого кольору ваза?
        options:
          - text: Синя.
            correct: true
          - text: Синій.
            correct: false
          - text: Синє.
            correct: false
        explanation: Ваза is feminine, so the short answer is синя.
      - prompt: Якого кольору листя?
        options:
          - text: Зелене.
            correct: true
          - text: Зелений.
            correct: false
          - text: Зелена.
            correct: false
        explanation: Листя is neuter in this lesson, so answer зелене.
  - id: act-2
    type: fill-in
    title: Закінчення кольорів
    instruction: Choose the ending or form that matches the noun.
    items:
      - sentence: червон__ олівець
        answer: ий
        options:
          - ий
          - а
          - е
        explanation: Олівець is masculine, so use червоний.
      - sentence: червон__ ручка
        answer: а
        options:
          - а
          - ий
          - е
        explanation: Ручка is feminine.
      - sentence: червон__ яблуко
        answer: е
        options:
          - е
          - а
          - ий
        explanation: Яблуко is neuter.
      - sentence: біл__ светр
        answer: ий
        options:
          - ий
          - а
          - е
        explanation: Светр is masculine.
      - sentence: біл__ сорочка
        answer: а
        options:
          - а
          - ий
          - е
        explanation: Сорочка is feminine.
      - sentence: сір__ пальто
        answer: е
        options:
          - е
          - ий
          - а
        explanation: Пальто is neuter here.
      - sentence: зелен__ зошит
        answer: ий
        options:
          - ий
          - а
          - е
        explanation: Зошит is masculine.
      - sentence: рожев__ листівка
        answer: а
        options:
          - а
          - е
          - ий
        explanation: Листівка is feminine.
      - sentence: син__ книга
        answer: я
        options:
          - я
          - ій
          - є
        explanation: Синій is soft; with книга say синя.
      - sentence: син__ вікно
        answer: є
        options:
          - є
          - ій
          - я
        explanation: With вікно say синє.
  - id: act-3
    type: group-sort
    title: Тверда чи м'яка форма
    instruction: Sort the color phrases by adjective pattern.
    groups:
      - label: Hard pattern -ий/-а/-е
        items:
          - червоний олівець
          - жовта стрічка
          - зелене яблуко
          - білий светр
          - чорна сукня
          - сіре пальто
      - label: Soft pattern -ій/-я/-є
        items:
          - синій светр
          - синя ручка
          - синє море
          - сині речі
  - id: act-4
    type: quiz
    title: Синій чи блакитний
    instruction: Choose the better A1 color phrase.
    items:
      - prompt: A clear sky
        options:
          - text: блакитне небо
            correct: true
          - text: синьо-жовте небо
            correct: false
          - text: коричневе небо
            correct: false
        explanation: For a clear sky, use блакитне небо.
      - prompt: The Ukrainian flag
        options:
          - text: синьо-жовтий прапор
            correct: true
          - text: червоно-жовтий прапор
            correct: false
          - text: зелено-жовтий прапор
            correct: false
        explanation: The standard phrase is синьо-жовтий прапор.
      - prompt: A dark blue sweater
        options:
          - text: синій светр
            correct: true
          - text: блакитна светр
            correct: false
          - text: синє светр
            correct: false
        explanation: Светр is masculine; синій also signals deep blue.
      - prompt: A light-blue postcard
        options:
          - text: блакитна листівка
            correct: true
          - text: синій листівка
            correct: false
          - text: блакитне листівка
            correct: false
        explanation: Листівка is feminine.
      - prompt: A deep-blue sea
        options:
          - text: синє море
            correct: true
          - text: блакитний море
            correct: false
          - text: синя море
            correct: false
        explanation: Море is neuter; синє море is a stable phrase.
      - prompt: A notebook that is dark green
        options:
          - text: темно-зелений зошит
            correct: true
          - text: темна-зелена зошит
            correct: false
          - text: зелено-темний зошит
            correct: false
        explanation: Treat темно-зелений as one compound color phrase.
workbook:
  - type: match-up
    title: Опис зовнішності
    instruction: Match each Ukrainian phrase with its natural context.
    pairs:
      - left: карі очі
        right: brown eyes
      - left: русяве волосся
        right: fair or light-brown hair
      - left: сиве волосся
        right: grey hair
  - type: error-correction
    title: Виправ кольорові пастки
    instruction: Choose the standard Ukrainian correction. Capitals mark the stressed vowel.
    items:
      - sentence: Сукня є червоний.
        error: червоний
        answer: Сукня червона.
        options:
          - Сукня червона.
          - Сукня червоний.
          - Сукня є червоний.
        explanation: Сукня is feminine, so use червона. Є may be present or omitted.
      - sentence: Якого кольори є светр?
        error: кольори
        answer: Якого кольору светр?
        options:
          - Якого кольору светр?
          - Яка кольору светр?
          - Якого кольори є светр?
        explanation: Use the phrase Якого кольору. Кольори does not fit that phrase. Якого кольору є светр? is also grammatical.
      - sentence: Синьо-жовта прапор.
        error: Синьо-жовта
        answer: Синьо-жовтий прапор.
        options:
          - Синьо-жовтий прапор.
          - Синьо-жовта прапор.
          - Синьо-жовте прапор.
        explanation: Прапор is masculine, so use синьо-жовтий. Блакитно-жовтий can also describe a flag; the error here is agreement.
      - sentence: У мене погана настрій.
        error: погана
        answer: У мене поганий настрій.
        options:
          - У мене поганий настрій.
          - У мене погана настрій.
          - У мене погане настрій.
        explanation: Настрій is masculine, so use поганий. Погана and погане do not agree with настрій.
      - sentence: У нього сірий волосся.
        error: сірий
        answer: У нього сиве волосся.
        options:
          - У нього сиве волосся.
          - У нього сірий волосся.
          - Він має сивий волосся.
        explanation: Волосся is neuter, so use сиве or сіре. Сіре волосся is also a valid description; the wrong options have masculine agreement.
      - sentence: ЧорнИй, білИй
        error: ЧорнИй, білИй
        answer: ЧОрний, бІлий
        options:
          - ЧОрний, бІлий
          - чОрна, бІла
          - чОрне, бІле
        explanation: Keep the masculine forms чорний, білий and stress the root. The other options change the gender.
  - type: fill-in
    title: Кольори кімнати й одягу
    instruction: Complete each practical sentence.
    items:
      - sentence: Моя кімната ___.
        answer: біла
        options:
          - біла
          - білий
          - біле
        explanation: Кімната is feminine.
      - sentence: Стіл ___.
        answer: коричневий
        options:
          - коричневий
          - коричнева
          - коричневе
        explanation: Стіл is masculine.
      - sentence: Пальто ___.
        answer: сіре
        options:
          - сіре
          - сірий
          - сіра
        explanation: Пальто is neuter here.
      - sentence: У мене ___ светр.
        answer: синій
        options:
          - синій
          - синя
          - синє
        explanation: Светр is masculine.
      - sentence: У неї ___ очі.
        answer: карі
        options:
          - карі
          - "коричнева"
          - каре
        explanation: Use the fixed appearance phrase карі очі.
      - sentence: У нього ___ волосся.
        answer: русяве
        options:
          - русяве
          - русявий
          - русий
        explanation: Волосся is neuter; learn русяве волосся as a phrase.
      - sentence: У бабусі ___ волосся.
        answer: сиве
        options:
          - сиве
          - сива
          - сивий
        explanation: Learn сиве волосся as a phrase.
      - sentence: Це ___ небо.
        answer: блакитне
        options:
          - блакитне
          - блакитний
          - блакитна
        explanation: Небо is neuter.
  - type: translate
    title: Обери український рядок
    instruction: Choose the Ukrainian sentence that matches the English cue.
    items:
      - source: The dress is red.
        options:
          - text: Сукня червона.
            correct: true
          - text: Сукня є червоний.
            correct: false
          - text: Сукня червоний.
            correct: false
        explanation: Сукня is feminine, so use червона. Є may be present or omitted.
      - source: I have a blue sweater.
        options:
          - text: У мене синій светр.
            correct: true
          - text: У мене синя светр.
            correct: false
          - text: У мене є блакитно светр.
            correct: false
        explanation: Светр is masculine; синій is the soft color form.
      - source: The sky is light blue.
        options:
          - text: Небо блакитне.
            correct: true
          - text: Небо блакитний.
            correct: false
          - text: Небо синя.
            correct: false
        explanation: Небо is neuter, and блакитний means light blue.
      - source: She has brown eyes.
        options:
          - text: У неї карі очі.
            correct: true
          - text: Вона має коричнева очі.
            correct: false
          - text: У неї коричневе очі.
            correct: false
        explanation: Очі is plural, so use карі here. Вона має коричневі очі is also a valid description; коричнева does not agree with очі.
      - source: He has grey hair.
        options:
          - text: У нього сиве волосся.
            correct: true
          - text: У нього сива волосся.
            correct: false
          - text: Він має сивий волосся.
            correct: false
        explanation: Волосся is neuter, so use сиве here. Сіре волосся is also valid; сива and сивий do not agree with волосся.
      - source: The flag is blue and yellow.
        options:
          - text: Прапор синьо-жовтий.
            correct: true
          - text: Прапор червоно-жовтий.
            correct: false
          - text: Прапор синій і жовта.
            correct: false
        explanation: Синьо-жовтий means blue and yellow. Червоно-жовтий means red and yellow; жовта does not agree with masculine прапор.
  - type: true-false
    title: Перевірка кольорів
    instruction: Decide if the statement is right.
    items:
      - statement: Якого кольору светр?
        answer: true
        explanation: This is the standard color question phrase.
      - statement: Якого кольору є светр?
        answer: true
        explanation: Якого кольору є светр? is grammatical. The question can also omit є.
      - statement: Ручка синя.
        answer: true
        explanation: Ручка is feminine, and синій becomes синя.
      - statement: Вікно синій.
        answer: false
        explanation: Вікно is neuter; say Вікно синє.
      - statement: Синій and блакитний are both active A1 words here.
        answer: true
        explanation: Синій is dark/deep blue; блакитний is light/sky blue.
      - statement: Голубий is a production target here.
        answer: false
        explanation: It is passive recognition only here.
      - statement: У неї карі очі.
        answer: true
        explanation: Карі очі is a natural fixed phrase.
      - statement: The Ukrainian flag phrase is синьо-жовтий прапор.
        answer: true
        explanation: Keep this exact phrase.
  - type: match-up
    title: Фрази з кольорами
    instruction: Match each color phrase with the object or image it best fits.
    pairs:
      - left: червоний олівець
        right: red pencil
      - left: червона ручка
        right: red pen
      - left: червоне яблуко
        right: red apple
      - left: блакитне небо
        right: light-blue sky
      - left: синє море
        right: deep-blue sea
      - left: чорна сукня
        right: black dress
      - left: білий светр
        right: white sweater
      - left: коричневі черевики
        right: brown shoes
