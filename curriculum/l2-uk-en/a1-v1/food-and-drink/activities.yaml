  - id: act-2
    type: match-up
    title: Breakfast table pairs
    instruction: Match each Ukrainian food or drink phrase with its meaning.
    pairs:
      - left: 'кава з молоком'
        right: 'coffee with milk'
      - left: 'чай без цукру'
        right: 'tea without sugar'
      - left: 'хліб з маслом'
        right: 'bread with butter'
      - left: 'каша'
        right: 'porridge'
      - left: 'яблуко'
        right: 'apple'
      - left: 'Смачного!'
        right: 'Enjoy your meal!'
      - left: 'я снідаю'
        right: 'I have breakfast'
      - left: 'вода з газом'
        right: 'sparkling water'
  - id: act-3
    type: fill-in
    title: Cafe drink phrases
    instruction: Choose the whole phrase that completes the service line.
    items:
      - sentence: 'Мені каву ___, будь ласка.'
        answer: 'з молоком'
        options:
          - 'з молоком'
          - 'з молоко'
          - 'без молоко'
        explanation: 'Learn каву з молоком as one service phrase.'
      - sentence: 'Чай ___, будь ласка.'
        answer: 'без цукру'
        options:
          - 'без цукру'
          - 'без цукор'
          - 'з цукор'
        explanation: 'Без цукру is the ready phrase.'
      - sentence: 'Я їм хліб ___.'
        answer: 'з маслом'
        options:
          - 'з маслом'
          - 'без масло'
          - 'з масло'
        explanation: 'Use хліб з маслом as a whole phrase.'
      - sentence: 'Дайте, будь ласка, воду ___.'
        answer: 'з газом'
        options:
          - 'з газом'
          - 'з газ'
          - 'без газ'
        explanation: 'Вода з газом is the useful drink phrase.'
      - sentence: 'Я люблю каву ___.'
        answer: 'без молока'
        options:
          - 'без молока'
          - 'без молоко'
          - 'з молока'
        explanation: 'Без молока is memorized here as a phrase.'
      - sentence: "Вона п'є чай ___."
        answer: 'з лимоном'
        options:
          - 'з лимоном'
          - 'з лимон'
          - 'без лимон'
        explanation: 'Чай з лимоном is a ready phrase.'
  - id: act-4
    type: true-false
    title: Food guardrails
    instruction: Decide whether each statement fits this module.
    items:
      - statement: Борщ is a Ukrainian cultural dish in this module.
        answer: true
        explanation: It is named as Ukrainian family and cultural food.
      - statement: Без цукру is practiced as a full phrase.
        answer: true
        explanation: Practice the whole phrase as a service line.
      - statement: Творог is the standard course word for cheese.
        answer: false
        explanation: Use сир, or кисломолочний сир when needed.
      - statement: Смажена картопля is the clean Ukrainian form.
        answer: true
        explanation: Use смажена картопля for fried potatoes.
      - statement: Я їм борщ is a natural line for eating soup.
        answer: true
        explanation: Їсти describes eating a bowl of borscht with a spoon.
      - statement: Смачного! is the natural meal formula.
        answer: true
        explanation: Use Смачного! when people begin eating.
      - statement: Я снідаю means I have breakfast.
        answer: true
        explanation: Use the compact meal verb.
      - statement: Борщ дуже смачно is the best sentence.
        answer: false
        explanation: Say Борщ дуже смачний for the noun борщ.
workbook:
  - type: quiz
    title: Daily meal choices
    instruction: Choose the line that answers the prompt naturally.
    items:
      - prompt: 'Що ти робиш вранці?'
        options:
          - text: 'Я снідаю.'
            correct: true
          - text: 'Я обідаю.'
            correct: false
          - text: 'Я вечеряю.'
            correct: false
        explanation: 'Breakfast uses снідати.'
      - prompt: 'Що ти їси на обід?'
        options:
          - text: 'Я їм борщ і салат.'
            correct: true
          - text: "Я п'ю борщ і салат."
            correct: false
          - text: 'Я їм чай без цукру.'
            correct: false
        explanation: 'Soup is eaten; tea is drunk.'
      - prompt: "Що ти п'єш?"
        options:
          - text: 'Воду або компот.'
            correct: true
          - text: 'Картоплю або рибу.'
            correct: false
          - text: 'Сало або сир.'
            correct: false
        explanation: 'Вода and компот are drinks.'
      - prompt: 'Which line names a Ukrainian cultural food?'
        options:
          - text: 'Борщ зі сметаною.'
            correct: true
          - text: 'Лимонад з газом.'
            correct: false
          - text: 'Кава з молоком.'
            correct: false
        explanation: 'Borscht is a Ukrainian cultural dish.'
      - prompt: 'How do you politely ask for tea without sugar?'
        options:
          - text: 'Чай без цукру, будь ласка.'
            correct: true
          - text: 'Чай без цукор, будь ласка.'
            correct: false
          - text: 'Чай з цукру, будь ласка.'
            correct: false
        explanation: 'Use the memorized phrase без цукру.'
      - prompt: 'What do you say as people start eating?'
        options:
          - text: 'Смачного!'
            correct: true
          - text: 'Добрий вечір!'
            correct: false
          - text: 'До побачення!'
            correct: false
        explanation: 'Смачного! is the meal formula.'
  - type: fill-in
    title: One food day
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - sentence: Вранці я ___ вдома.
        answer: снідаю
        options:
          - снідаю
          - снідає
          - снідаєш
        explanation: Я takes снідаю.
      - sentence: Я їм цю ___ і яблуко.
        answer: кашу
        options:
          - кашу
          - каша
          - каші
        explanation: Цю takes the matching feminine singular object кашу.
      - sentence: Я п'ю каву ___.
        answer: з молоком
        options:
          - з молоком
          - з молоко
          - без молоко
        explanation: Use the additive phrase з молоком.
      - sentence: Вдень я ___ на роботі.
        answer: обідаю
        options:
          - обідаю
          - обідає
          - обідаєте
        explanation: Я takes обідаю.
      - sentence: На обід я їм борщ ___.
        answer: зі сметаною
        options:
          - зі сметаною
          - зі сметана
          - зі сметану
        explanation: Use the additive phrase зі сметаною.
      - sentence: Увечері я ___ вдома.
        answer: вечеряю
        options:
          - вечеряю
          - вечеряє
          - вечеряють
        explanation: Я takes вечеряю.
      - sentence: Я їм рибу ___.
        answer: з рисом
        options:
          - з рисом
          - з рис
          - без рисом
        explanation: Use the additive phrase з рисом.
      - sentence: Я п'ю чай ___.
        answer: без цукру
        options:
          - без цукру
          - без цукор
          - без цукром
        explanation: Без takes the genitive form цукру.
  - type: match-up
    title: Extra food-table glosses
    instruction: Match the food word with its English support.
    pairs:
      - left: 'рис'
        right: 'rice'
      - left: 'макарони'
        right: 'pasta'
      - left: 'морква'
        right: 'carrot'
      - left: 'цибуля'
        right: 'onion'
      - left: 'помідор'
        right: 'tomato'
      - left: 'огірок'
        right: 'cucumber'
      - left: 'апельсин'
        right: 'orange'
      - left: 'йогурт'
        right: 'yogurt'
      - left: 'олія'
        right: 'oil'
      - left: 'кефір'
        right: 'kefir'
      - left: 'лимонад'
        right: 'lemonade'
  - type: fill-in
    title: Meal verb rhythm
    instruction: Choose the natural short line.
    items:
      - sentence: 'Вранці я ___.'
        answer: 'снідаю'
        options:
          - 'снідаю'
          - 'обідаю'
          - 'вечеряю'
        explanation: 'Morning meal: я снідаю.'
      - sentence: "Зараз перша година дня. Я сиджу за столом і їм суп. Вдень я ___."
        answer: 'обідаю'
        options:
          - 'обідаю'
          - 'вечеряю'
          - "п'ю"
        explanation: "The stated midday meal fits обідаю. Вечеряю is the evening meal, and п’ю is drinking rather than the explicitly stated eating of soup."
      - sentence: 'Увечері я ___.'
        answer: 'вечеряю'
        options:
          - 'вечеряю'
          - 'снідаю'
          - 'їм чай'
        explanation: 'Dinner: я вечеряю.'
      - sentence: "Я ___ борщ."
        answer: 'їм'
        options:
          - їм
          - їси
          - їсть
        explanation: "Я requires first-person singular їм. Їси is second-person singular; їсть is third-person singular. The legitimate drink/eat alternatives are not condemned generally."
      - sentence: "Я ___ чай."
        answer: "п'ю"
        options:
          - "п'ю"
          - 'їм'
          - 'вечеряю'
        explanation: 'Tea is drunk.'
      - sentence: "Я хочу каву ___."
        answer: 'з молоком'
        options:
          - з молоком
          - з молоко
          - смачна
        explanation: "З молоком has instrumental after з for the additive milk. З молоко uses nominative/accusative instead; смачна is nominative and cannot agree with accusative каву here."
  - type: fill-in
    title: Build safe food lines
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - answer: снідаю
        sentence: Я ___ вдома.
        options:
          - снідаю
          - снідає
          - снідаєш
        explanation: Я takes снідаю.
      - answer: з молоком
        sentence: Мені каву ___, будь ласка.
        options:
          - з молоком
          - з молоко
          - без молоко
        explanation: Use the additive phrase з молоком.
      - answer: смачний
        sentence: Борщ дуже ___.
        options:
          - смачний
          - смачна
          - смачне
        explanation: Смачний agrees with masculine борщ.
      - answer: їм
        sentence: Я ___ борщ.
        options:
          - їм
          - їси
          - їсть
        explanation: Я takes їм.
      - answer: без цукру
        sentence: Чай ___, будь ласка.
        options:
          - без цукру
          - без цукор
          - без цукром
        explanation: Без takes the genitive form цукру.
      - answer: Смачного!
        sentence: 'Друзі сідають обідати. Побажай їм доброго обіду: «___»'
        options:
          - Смачного!
          - Де пошта?
          - Куди ти їдеш?
        explanation: Смачного! is the meal wish; the alternatives ask about a place or destination.
  - type: error-correction
    title: Repair food and drink interference
    instruction: Choose the clean Ukrainian repair.
    anchor_id: repair-food-and-drink-interference
    items:
      - sentence: Я є хочу їсти.
        error: є
        answer: Я хочу їсти.
        options:
          - Я хочу їсти.
          - Я є хочу їсти.
          - Я є хочеш їсти.
        explanation: Хочу is already a conjugated verb. Use Я хочу їсти.
      - sentence: Кіт п'є теплий молоко.
        error: теплий
        answer: Кіт п'є тепле молоко.
        options:
          - Кіт п'є тепле молоко.
          - Кіт п'є теплий молоко.
          - Кіт п'є тепла молоко.
        explanation: Молоко is neuter, so use тепле молоко.
      - sentence: Вареники з творогом.
        error: творогом
        answer: Вареники із сиром.
        options:
          - Вареники із сиром.
          - Вареники з творогом.
          - Вареники із сир.
        explanation: Use сир in this food context.
      - sentence: Я люблю творог.
        error: творог
        answer: Я люблю сир.
        options:
          - Я люблю сир.
          - Я люблю творог.
          - Я люблю сиром.
        explanation: Use сир as the everyday Ukrainian food word.
      - sentence: На столі смажений картопля.
        error: смажений
        answer: На столі смажена картопля.
        options:
          - На столі смажена картопля.
          - На столі смажений картопля.
          - На столі смажене картопля.
        explanation: Картопля is feminine, so смажена agrees with it.
      - sentence: Смажене картопля.
        error: Смажене
        answer: Смажена картопля.
        options:
          - Смажена картопля.
          - Смажене картопля.
          - Смажений картопля.
        explanation: Картопля is feminine, so use смажена.
      - sentence: Дайте мені один воду.
        error: один
        answer: Дайте мені одну воду. (або склянку води)
        options:
          - Дайте мені одну воду. (або склянку води)
          - Дайте мені один воду.
          - Дайте мені одне воду.
        explanation: Use одну воду, or ask for a glass of water.
      - sentence: Суп з картофель.
        error: картофель
        answer: Суп із картоплею. Або картопляний суп.
        options:
          - Суп із картоплею. Або картопляний суп.
          - Суп з картофель.
          - Суп із картофель.
        explanation: Use картопля / картоплею or картопляний.
      - sentence: Я снідає о сьомій.
        error: снідає
        answer: Я снідаю о сьомій.
        options:
          - Я снідаю о сьомій.
          - Я снідає о сьомій.
          - Я снідаєш о сьомій.
        explanation: Я takes снідаю.
      - sentence: Я їси борщ.
        error: їси
        answer: Я їм борщ.
        options:
          - Я їм борщ.
          - Я їси борщ.
          - Я їсть борщ.
        explanation: Я takes first-person їм.
      - sentence: Клубнічний джем.
        error: Клубнічний
        answer: Полуничний джем.
        options:
          - Полуничний джем.
          - Клубнічний джем.
          - Клубніка джем.
        explanation: Use полуниця / полуничний, not the Russian-root form.
      - sentence: Дайте чай без цукор.
        error: цукор
        answer: Дайте чай без цукру.
        options:
          - Дайте чай без цукру.
          - Дайте чай без цукор.
          - Дайте чай з цукру.
        explanation: Без цукру is memorized as a whole phrase.
      - sentence: Чай з цукор.
        error: цукор
        answer: Чай з цукром.
        options:
          - Чай з цукром.
          - Чай з цукор.
          - Чай без цукром.
        explanation: Чай з цукром is a whole drink phrase.
      - sentence: Борщ дуже смачно.
        error: смачно
        answer: Борщ дуже смачний.
        options:
          - Борщ дуже смачний.
          - Борщ дуже смачно.
          - Борщ дуже смачна.
        explanation: With the noun борщ, use смачний.
      - sentence: Каша дуже смачний.
        error: смачний
        answer: Каша дуже смачна.
        options:
          - Каша дуже смачна.
          - Каша дуже смачний.
          - Каша дуже смачно.
        explanation: With the noun каша, use смачна.
      - sentence: Смачьного!
        error: Смачьного
        answer: Смачного!
        options:
          - Смачного!
          - Смачьного!
          - Смачьному!
        explanation: Write Смачного! without ь after ч. This is a traditional wish before a meal.
