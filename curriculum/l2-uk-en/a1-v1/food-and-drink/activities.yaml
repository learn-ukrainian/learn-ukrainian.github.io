inline:
  - id: act-1
    type: match-up
    title: Food, drink, and meal words
    instruction: Match each Ukrainian food, drink, or meal word with its English meaning.
    pairs:
      - left: хліб
        right: bread
      - left: риба
        right: fish
      - left: м'ясо
        right: meat
      - left: каша
        right: porridge
      - left: сир
        right: cheese
      - left: кава
        right: coffee
      - left: чай
        right: tea
      - left: вода
        right: water
      - left: сік
        right: juice
      - left: молоко
        right: milk
      - left: сніданок
        right: breakfast
      - left: обід
        right: midday meal
      - left: вечеря
        right: evening meal
      - left: борщ
        right: Ukrainian vegetable soup
