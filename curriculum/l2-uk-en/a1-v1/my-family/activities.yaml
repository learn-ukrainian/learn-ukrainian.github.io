inline:
  - id: act-1
    type: quiz
    title: Питання до фото
    instruction: Обери український рядок для фото-розмови.
    items:
      - prompt: "Олег розповідає про свою родину. Ти питаєш, чи є в нього брат."
        options:
          - text: У тебе є брат?
            correct: true
          - text: У мене є брат?
            correct: false
          - text: Це брат?
            correct: false
        explanation: У тебе є...? питає одну знайому людину.
      - prompt: Ти відповідаєш так і кажеш, що маєш одну сестру. — You answer yes and say that you have one sister.
        options:
          - text: Так, у мене є одна сестра.
            correct: true
          - text: Так, у тебе є одна сестра.
            correct: false
          - text: Так, це одна сестра.
            correct: false
        explanation: У мене є... відповідає за себе.
      - prompt: Ти відповідаєш ні короткою A1-фразою. — You answer no with a short A1 phrase.
        options:
          - text: Ні.
            correct: true
          - text: У мене немає брат.
            correct: false
          - text: Ні є брат.
            correct: false
        explanation: На A1 тримай заперечну відповідь простою.
      - prompt: Ти питаєш, як його звати. — You ask what his name is.
        options:
          - text: Як його звати?
            correct: true
          - text: Як її звати?
            correct: false
          - text: Що його звати?
            correct: false
        explanation: Його підходить до брата, тата, сина або дідуся.
      - prompt: Ти показуєш маму на фото. — You point to mom in the photo.
        options:
          - text: Це моя мама.
            correct: true
          - text: Це мій мама.
            correct: false
          - text: Це моє мама.
            correct: false
        explanation: Мама — жіночого роду, тому моя.
      - prompt: Ти показуєш батьків. — You point to parents.
        options:
          - text: Це мої батьки.
            correct: true
          - text: Це мій батьки.
            correct: false
          - text: Це моя батьки.
            correct: false
        explanation: Батьки — множина, тому мої.
  - id: act-2
    type: match-up
    title: Слова родини
    instruction: З'єднай українське слово з українською підказкою.
    pairs:
      - left: мама
        right: мати — mother
      - left: тато
        right: батько — father
      - left: брат
        right: син для моїх батьків — son to my parents
      - left: сестра
        right: дочка для моїх батьків — daughter to my parents
      - left: бабуся
        right: мама мами або тата — mother of mom or dad
      - left: дідусь
        right: тато мами або тата — father of mom or dad
      - left: батьки
        right: мама і тато — mom and dad
      - left: родичі
        right: люди з родини — people from the family
  - id: act-3
    type: fill-in
    title: Склади У мене є
    instruction: Обери слово або фразу для родинного речення.
    items:
      - sentence: ___ мене є брат.
        answer: У
        options:
          - У
          - Це
          - Хто
        explanation: У мене є... — цілий блок, щоб сказати, що хтось або щось є в мене.
      - sentence: У ___ є сестра.
        answer: мене
        options:
          - мене
          - мій
          - це
        explanation: У мене є... відповідає за себе.
      - sentence: У ___ є брат?
        answer: тебе
        options:
          - тебе
          - "мій"
          - він
        explanation: У тебе є...? питає одну знайому людину.
      - sentence: У ___ є діти?
        answer: вас
        options:
          - вас
          - твій
          - вона
        explanation: У вас є...? — формально або множина.
      - sentence: У мене є ___ брат.
        answer: один
        options:
          - один
          - одна
          - дві
        explanation: Брат — чоловічого роду, тому один.
      - sentence: У мене є ___ сестра.
        answer: одна
        options:
          - одна
          - один
          - два
        explanation: Сестра — жіночого роду, тому одна.
      - sentence: У мене є ___ брати.
        answer: два
        options:
          - два
          - дві
          - одна
        explanation: Брати вживаємо з два.
      - sentence: У мене є ___ сестри.
        answer: дві
        options:
          - дві
          - два
          - один
        explanation: Зі словом сестри тут уживаємо дві.
  - id: act-4
    type: fill-in
    title: Мій чи моя?
    instruction: Обери присвійний займенник до родинного слова.
    items:
      - sentence: Це ___ брат.
        answer: мій
        options:
          - мій
          - моя
          - моє
          - мої
        explanation: Брат — чоловічого роду.
      - sentence: Це ___ мама.
        answer: моя
        options:
          - моя
          - мій
          - моє
          - мої
        explanation: Мама — жіночого роду.
      - sentence: Це ___ місто.
        answer: моє
        options:
          - моє
          - мій
          - моя
          - мої
        explanation: Місто — середнього роду.
      - sentence: Це ___ батьки.
        answer: мої
        options:
          - мої
          - мій
          - моя
          - моє
        explanation: Батьки — множина.
      - sentence: Це ___ тато?
        answer: твій
        options:
          - твій
          - твоя
          - твоє
          - твої
        explanation: Тато — чоловічого роду, хоча слово закінчується на -о.
      - sentence: Це ___ сестра?
        answer: твоя
        options:
          - твоя
          - твій
          - твоє
          - твої
        explanation: Сестра — жіночого роду.
      - sentence: Це ___ прізвище?
        answer: твоє
        options:
          - твоє
          - твій
          - твоя
          - твої
        explanation: Прізвище — середнього роду.
      - sentence: Це ___ родичі?
        answer: твої
        options:
          - твої
          - твій
          - твоя
          - твоє
        explanation: Родичі — множина.
workbook:
  - type: error-correction
    title: Обери українське родинне речення
    instruction: Обери безпечніший український рядок.
    items:
      - sentence: Мені звати Джон.
        error: Мені
        correction: Мене звати Джон.
        options:
          - Мене звати Джон.
          - Мені звати Джон.
        explanation: 'Use Мене звати Джон. The person named is the object of звати: мене fits; dative мені does not. A grammatical sentence with є is not an error.'
      - sentence: Я маю брат.
        error: брат
        correction: Я маю брата.
        options:
          - Я маю брата.
          - Я маю брат.
        explanation: 'Мати can express possession. Use брата as the object: Я маю брата. У мене є брат is another valid expression.'
      - sentence: Це мій мама.
        error: мій
        correction: Це моя мама.
        options:
          - Це моя мама.
          - Це мій мама.
        explanation: Мама — жіночого роду, тому вживай моя.
      - sentence: Це є мій брати.
        error: брати
        correction: Це мій брат.
        options:
          - Це мій брат.
          - Це є мій брати.
        explanation: Мій is singular, so use брат. Both Це мій брат and Це є мій брат can identify one brother.
      - sentence: Це мій батьки. Його звати Петро.
        error: батьки
        correction: Це мій батько.
        options:
          - Це мій батько.
          - Це моє батько.
          - Це моя батько.
        explanation: Батьки means parents or several fathers. Його звати Петро establishes one man, so use singular батько with мій. Моє is neuter; моя is feminine.
      - sentence: У мене немає брат.
        error: брат
        correction: У мене немає брата.
        options:
          - У мене немає брата.
          - У мене немає брат.
        explanation: Use the phrase У мене немає брата. Брата is the form used after немає here; the complete sentence preserves the original assertion.
  - type: fill-in
    title: Родинні слова в реченнях — Family words in sentences
    instruction: Обери слово, яке підходить до речення. — Choose the word that fits the sentence.
    items:
      - sentence: Моя ___ — вчителька.
        answer: дружина
        options:
          - дружина
          - дружину
        explanation: Моя needs nominative дружина here. Дружину is accusative.
      - sentence: Мій ___ працює в лікарні.
        answer: чоловік
        options:
          - чоловік
          - чоловіка
        explanation: The subject is Мій чоловік. Чоловіка is an oblique case form.
      - sentence: Це моя ___ Тетяна.
        answer: бабуся
        options:
          - бабуся
          - бабусю
        explanation: Use nominative бабуся after Це моя. Бабусю does not fit this sentence frame.
      - sentence: У нас велика родина — близько десяти ___.
        answer: родичів
        options:
          - родичів
          - родичі
        explanation: Близько десяти takes родичів here. Родичі does not fit this quantity phrase.
      - sentence: Це ще маленька ___.
        answer: дитина
        options:
          - дитина
          - дитину
        explanation: Use nominative дитина with маленька. Дитину is accusative.
      - sentence: Це мій ___ брат.
        answer: молодший
        options:
          - молодший
          - молодша
        explanation: Брат is masculine, so use молодший. Молодша is feminine.
      - sentence: Мій старший брат уже ___.
        answer: одружений
        options:
          - одружений
          - одружена
        explanation: Брат is masculine, so use одружений. Одружена is feminine.
  - type: group-sort
    title: Один / одна / два / дві
    instruction: Розподіли родинні фрази за числівником.
    groups:
      - label: один (one - masc.)
        items:
          - один брат
          - один син
          - один дідусь
      - label: одна (one - fem.)
        items:
          - одна сестра
          - одна дочка
          - одна бабуся
      - label: два (two - masc./neut.)
        items:
          - два брати
          - два сини
      - label: дві (two - fem.)
        items:
          - дві сестри
          - дві дочки
  - type: match-up
    title: Повне ім'я як сигнал
    instruction: З'єднай частину формального імені з підказкою. Це тільки впізнавання.
    pairs:
      - left: ім'я
        right: Марія — first name
      - left: прізвище
        right: Коваленко — surname
      - left: по батькові
        right: Василівна — patronymic
      - left: Добрий день, Маріє Василівно!
        right: формальне звертання — formal address
  - type: fill-in
    title: Доповни фотодіалог
    instruction: Обери пропущене слово з родинної розмови.
    items:
      - sentence: Це ___ сім'я на фотографії.
        answer: моя
        options:
          - моя
          - мій
          - моє
        explanation: Сім'я — жіночого роду.
      - sentence: ___ це? Це мій тато.
        answer: Хто
        options:
          - Хто
          - Що
          - Де
        explanation: Для людини вживай хто.
      - sentence: Це моя сестра. ___ звати Катя.
        answer: Її
        options:
          - Її
          - Його
          - Вони
        explanation: Її підходить до сестри.
      - sentence: Це мій брат. ___ звати Коля.
        answer: Його
        options:
          - Його
          - Її
          - Вона
        explanation: Його підходить до брата.
      - sentence: А це ___ бабуся?
        answer: твоя
        options:
          - твоя
          - твій
          - твоє
        explanation: Бабуся — жіночого роду.
  - type: translate
    title: Швидка перевірка родинної лексики
    instruction: Обери англійське значення.
    items:
      - source: сім'я
        options:
          - text: family, close household
            correct: true
          - text: surname
            correct: false
          - text: profession
            correct: false
        explanation: Сім'я — слово для близької родини.
      - source: родина
        options:
          - text: family or kin
            correct: true
          - text: only one parent
            correct: false
          - text: first name
            correct: false
        explanation: Родина часто звучить ширше, ніж сім'я.
      - source: У мене є брат.
        options:
          - text: I have a brother.
            correct: true
          - text: You have a brother.
            correct: false
          - text: This is my brother.
            correct: false
        explanation: У мене є... — блок, щоб сказати, що щось або хтось є в мене.
      - source: Це моя сестра.
        options:
          - text: This is my sister.
            correct: true
          - text: This is my brother.
            correct: false
          - text: This is her sister.
            correct: false
        explanation: Моя узгоджується зі словом сестра.
      - source: Це мій тато.
        options:
          - text: This is my dad.
            correct: true
          - text: This is my mom.
            correct: false
          - text: Do you have a brother?
            correct: false
        explanation: Мій узгоджується зі словом тато.
