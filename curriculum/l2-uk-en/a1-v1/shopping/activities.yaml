inline:
  - id: act-1
    type: fill-in
    title: Price questions
    instruction: Choose the word that completes each shopping question.
    items:
      - sentence: 'Скільки ___ хліб?'
        answer: 'коштує'
        options:
          - 'коштує'
          - 'коштують'
          - 'коштувати'
        explanation: 'Use коштує with one item.'
      - sentence: 'Скільки ___ молоко?'
        answer: 'коштує'
        options:
          - 'коштує'
          - 'коштують'
          - 'коштувала'
        explanation: 'Молоко is one item here, so use коштує.'
      - sentence: 'Скільки ___ цей сир?'
        answer: 'коштує'
        options:
          - 'коштує'
          - 'коштують'
          - 'коштуєте'
        explanation: 'Цей сир is singular.'
      - sentence: 'Скільки ___ яблука?'
        answer: 'коштують'
        options:
          - 'коштують'
          - 'коштує'
          - 'коштувати'
        explanation: 'Яблука is plural, so use коштують.'
      - sentence: 'Скільки ___ помідори?'
        answer: 'коштують'
        options:
          - 'коштують'
          - 'коштує'
          - 'коштуєш'
        explanation: 'Помідори is plural.'
      - sentence: 'Скільки ___ пляшка води?'
        answer: 'коштує'
        options:
          - 'коштує'
          - 'коштують'
          - 'коштуємо'
        explanation: 'Пляшка is one bottle.'
      - sentence: "Скільки ___ ці пляшки води?"
        answer: 'коштують'
        options:
          - 'коштують'
          - 'коштує'
          - 'коштувала'
        explanation: "The plural subject ці пляшки requires коштують. Коштує and feminine singular past коштувала do not agree with it; the two–four agreement ambiguity is removed with the numeral."
      - sentence: 'Скільки ___ ця сукня?'
        answer: 'коштує'
        options:
          - 'коштує'
          - 'коштують'
          - 'коштуємо'
        explanation: 'Ця сукня is singular.'
  - id: act-2
    type: quiz
    title: Гривня, гривні, гривень
    instruction: Choose the currency form that fits the number.
    items:
      - prompt: '21 ___'
        options:
          - text: 'гривня'
            correct: true
          - text: 'гривні'
            correct: false
          - text: 'гривень'
            correct: false
        explanation: '21 ends like 1: гривня.'
      - prompt: '32 ___'
        options:
          - text: 'гривні'
            correct: true
          - text: 'гривня'
            correct: false
          - text: 'гривень'
            correct: false
        explanation: '32 ends like 2: гривні.'
      - prompt: '45 ___'
        options:
          - text: 'гривень'
            correct: true
          - text: 'гривня'
            correct: false
          - text: 'гривні'
            correct: false
        explanation: '45 uses гривень.'
      - prompt: '100 ___'
        options:
          - text: 'гривень'
            correct: true
          - text: 'гривня'
            correct: false
          - text: 'гривні'
            correct: false
        explanation: '100 uses гривень.'
      - prompt: '1 ___'
        options:
          - text: 'гривня'
            correct: true
          - text: 'гривні'
            correct: false
          - text: 'гривень'
            correct: false
        explanation: '1 is гривня.'
      - prompt: '3 ___'
        options:
          - text: 'гривні'
            correct: true
          - text: 'гривня'
            correct: false
          - text: 'гривень'
            correct: false
        explanation: '3 is гривні.'
      - prompt: '10 ___'
        options:
          - text: 'гривень'
            correct: true
          - text: 'гривня'
            correct: false
          - text: 'гривні'
            correct: false
        explanation: '10 is гривень.'
      - prompt: '54 ___'
        options:
          - text: 'гривні'
            correct: true
          - text: 'гривня'
            correct: false
          - text: 'гривень'
            correct: false
        explanation: '54 ends like 4: гривні.'
  - id: act-3
    type: quiz
    title: Where do you buy it?
    instruction: Choose an ordinary place for buying the named product from the three options. Other suitable shops may exist.
    items:
      - prompt: 'помідори: where would you ordinarily shop for this?'
        options:
          - text: ринок
            correct: true
          - text: театр
            correct: false
          - text: бібліотека
            correct: false
        explanation: Of these three choices, ринок is the ordinary shopping place for this product. This does not rule out other suitable stores.
      - prompt: "м'ясо: where would you ordinarily shop for this?"
        options:
          - text: м'ясний відділ
            correct: true
          - text: театр
            correct: false
          - text: бібліотека
            correct: false
        explanation: Of these three choices, м'ясний відділ is the ordinary shopping place for this product. This does not rule out other suitable stores.
      - prompt: 'сир: where would you ordinarily shop for this?'
        options:
          - text: молочний відділ
            correct: true
          - text: театр
            correct: false
          - text: вокзал
            correct: false
        explanation: Of these three choices, молочний відділ is the ordinary shopping place for this product. This does not rule out other suitable stores.
      - prompt: 'хліб: where would you ordinarily shop for this?'
        options:
          - text: крамниця
            correct: true
          - text: музей
            correct: false
          - text: театр
            correct: false
        explanation: Of these three choices, крамниця is the ordinary shopping place for this product. This does not rule out other suitable stores.
      - prompt: 'молоко: where would you ordinarily shop for this?'
        options:
          - text: супермаркет
            correct: true
          - text: музей
            correct: false
          - text: театр
            correct: false
        explanation: Of these three choices, супермаркет is the ordinary shopping place for this product. This does not rule out other suitable stores.
      - prompt: 'вода: where would you ordinarily shop for this?'
        options:
          - text: магазин
            correct: true
          - text: музей
            correct: false
          - text: бібліотека
            correct: false
        explanation: Of these three choices, магазин is the ordinary shopping place for this product. This does not rule out other suitable stores.
      - prompt: 'сукня: where would you ordinarily shop for this?'
        options:
          - text: магазин одягу
            correct: true
          - text: м'ясний відділ
            correct: false
          - text: молочний відділ
            correct: false
        explanation: Of these three choices, магазин одягу is the ordinary shopping place for this product. This does not rule out other suitable stores.
      - prompt: 'книжка: where would you ordinarily shop for this?'
        options:
          - text: книгарня
            correct: true
          - text: м'ясний відділ
            correct: false
          - text: молочний відділ
            correct: false
        explanation: Of these three choices, книгарня is the ordinary shopping place for this product. This does not rule out other suitable stores.
  - id: act-4
    type: fill-in
    title: Quantity phrases
    instruction: Choose the quantity word or phrase that fits the product.
    items:
      - sentence: 'Дайте, будь ласка, ___ яблук.'
        answer: 'один кілограм'
        options:
          - 'один кілограм'
          - 'одна пляшка'
          - 'один літр'
        explanation: 'Use один кілограм яблук as a buying phrase.'
      - sentence: "Дайте один ___ молока."
        answer: 'літр'
        options:
          - 'літр'
          - 'пляшку'
          - 'буханку'
        explanation: "Один agrees with masculine accusative літр. Пляшку and буханку are feminine accusative and would need одну."
      - sentence: "Дайте одну ___ води."
        answer: 'пляшку'
        options:
          - 'пляшку'
          - 'кілограм'
          - 'буханку'
        explanation: "Одну agrees with feminine accusative пляшку. Masculine кілограм would need один; буханка denotes a loaf, not poured water."
      - sentence: "Дайте одну ___ чаю."
        answer: 'пачку'
        options:
          - пачку
          - літр
          - пачкою
        explanation: "Одну agrees with feminine accusative пачку. Літр is masculine and would need один; пачкою is instrumental rather than the direct object."
      - sentence: 'Дайте ___ хліба.'
        answer: 'буханку'
        options:
          - 'буханку'
          - 'літр'
          - 'пляшку'
        explanation: 'Use буханку хліба.'
      - sentence: 'Дайте, будь ласка, ___ помідорів.'
        answer: 'два кілограми'
        options:
          - 'два кілограми'
          - 'дві пляшки'
          - 'два літри'
        explanation: 'Use два кілограми помідорів.'
      - sentence: 'Купіть три ___ води.'
        answer: 'пляшки'
        options:
          - 'пляшки'
          - 'пляшка'
          - 'кілограм'
        explanation: 'Use три пляшки води.'
workbook:
  - type: group-sort
    title: Shopping shelves
    instruction: Sort each phrase by what it does in a shopping visit.
    groups:
      - name: 'Start or availability'
        items:
          - 'Добрий день!'
          - 'У вас є хліб?'
          - 'Чи є у вас яблука?'
      - name: 'Price'
        items:
          - 'Скільки коштує?'
          - 'Скільки коштують яблука?'
          - 'Дорого!'
      - name: 'Quantity'
        items:
          - 'один кілограм яблук'
          - 'літр молока'
          - 'пляшка води'
      - name: 'Checkout'
        items:
          - 'З вас сто сім гривень.'
          - 'Можна карткою?'
          - 'Карткою, будь ласка.'
  - type: fill-in
    title: One shopping visit
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - sentence: Добрий день! У ___ є яблука?
        answer: вас
        options:
          - вас
          - ви
          - вам
        explanation: У takes the genitive pronoun вас.
      - sentence: — У вас є яблука? — Так, яблука ___.
        answer: є
        options:
          - є
          - має
          - маєте
        explanation: Є states that the apples are available; має and маєте do not agree with the plural subject яблука.
      - sentence: Скільки ___ кілограм яблук?
        answer: коштує
        options:
          - коштує
          - коштують
          - коштувати
        explanation: The singular subject кілограм takes коштує.
      - sentence: Сорок ___.
        answer: гривень
        options:
          - гривень
          - гривня
          - гривні
        explanation: Сорок takes гривень.
      - sentence: Дайте, будь ласка, один ___ яблук.
        answer: кілограм
        options:
          - кілограм
          - кілограма
          - кілограмом
        explanation: Один takes the matching masculine singular object кілограм.
      - sentence: З вас сорок ___.
        answer: гривень
        options:
          - гривень
          - гривня
          - гривні
        explanation: Сорок takes гривень.
      - sentence: Я хочу заплатити карткою. Можна ___?
        answer: карткою
        options:
          - карткою
          - картка
          - картки
        explanation: Карткою expresses the payment method.
      - sentence: Плачу ___, будь ласка.
        answer: карткою
        options:
          - карткою
          - картка
          - картки
        explanation: Карткою expresses the payment method.
  - type: true-false
    title: Shopping decisions
    instruction: Decide whether each statement fits this module.
    items:
      - statement: 'Скільки коштує? asks about price.'
        answer: true
        explanation: 'Коштує is the price verb.'
      - statement: 'Скільки коштують яблука? is used for plural apples.'
        answer: true
        explanation: 'Use коштують with plural items.'
      - statement: 'Кілограм яблук is taught here as a ready shopping phrase.'
        answer: true
        explanation: 'The module avoids a full case lesson.'
      - statement: 'Карткою, будь ласка means by card, please.'
        answer: true
        explanation: 'It is the checkout payment phrase.'
      - statement: 'З вас сто сім гривень is a greeting.'
        answer: false
        explanation: 'It is a checkout total.'
      - statement: 'Приміряти is useful when trying on clothes.'
        answer: true
        explanation: 'Use приміряти for clothing.'
      - statement: 'Скільки це є? is the course price question.'
        answer: false
        explanation: 'Use Скільки це коштує?'
      - statement: 'Грн is the common price-label abbreviation for гривня.'
        answer: true
        explanation: 'Грн appears on price labels.'
  - type: match-up
    title: Shopping phrases
    instruction: Match the product with a natural buying phrase.
    pairs:
      - left: 'яблука'
        right: 'один кілограм яблук'
      - left: 'помідори'
        right: 'два кілограми помідорів'
      - left: 'молоко'
        right: 'літр молока'
      - left: 'вода'
        right: 'пляшка води'
      - left: 'чай'
        right: 'пачка чаю'
      - left: 'хліб'
        right: 'буханка хліба'
  - type: fill-in
    title: Build shopping lines
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - answer: коштує
        sentence: Скільки ___ хліб?
        options:
          - коштує
          - коштують
          - коштувати
        explanation: The singular subject хліб takes коштує.
      - answer: є
        sentence: У вас ___ яблука?
        options:
          - є
          - їси
          - їдеш
        explanation: Є asks whether apples are available; їси and їдеш do not fit this availability question.
      - answer: кілограм
        sentence: Дайте, будь ласка, один ___ яблук.
        options:
          - кілограм
          - кілограма
          - кілограмом
        explanation: Один takes the matching singular object кілограм.
      - answer: гривень
        sentence: З вас сто сім ___.
        options:
          - гривень
          - гривня
          - гривні
        explanation: Сто сім takes гривень.
      - answer: карткою
        sentence: Я хочу заплатити карткою. Можна ___?
        options:
          - карткою
          - картка
          - картки
        explanation: Карткою expresses the payment method.
      - answer: карткою
        sentence: Плачу ___, будь ласка.
        options:
          - карткою
          - картка
          - картки
        explanation: Карткою expresses the payment method.
  - type: quiz
    title: Repair shopping interference
    instruction: Choose the correct Ukrainian version of each line.
    anchor_id: repair-shopping-interference
    items:
      - prompt: Choose the correct question about the price.
        options:
          - text: Скільки це коштує?
            correct: true
          - text: Скільки це є?
            correct: false
          - text: Скільки це має?
            correct: false
        explanation: Use коштує for price questions.
      - prompt: 'Choose the correct Ukrainian version: Я маю 20 гривнів.'
        options:
          - text: Я маю 20 гривень.
            correct: true
          - text: Я маю 20 гривнів.
            correct: false
          - text: Я маю 20 гривні.
            correct: false
        explanation: 20 takes гривень. Маю expresses possession.
      - prompt: 'Choose the correct Ukrainian version: У вас є цей хлібом?'
        options:
          - text: У вас є цей хліб?
            correct: true
          - text: У вас є цей хлібом?
            correct: false
          - text: У вас є цей хліба?
            correct: false
        explanation: Цей takes the matching masculine singular subject хліб.
      - prompt: How do you ask to pay by card?
        options:
          - text: Карткою, будь ласка.
            correct: true
          - text: Я плачу з карткою.
            correct: false
          - text: З карткою, будь ласка.
            correct: false
        explanation: At checkout, use the phrase Карткою, будь ласка.
      - prompt: 'Choose the correct Ukrainian version: Дайте один кілограм яблука.'
        options:
          - text: Дайте, будь ласка, один кілограм яблук.
            correct: true
          - text: Дайте один кілограм яблука.
            correct: false
          - text: Дайте одна кілограм яблук.
            correct: false
        explanation: Use the whole phrase один кілограм яблук.
      - prompt: 'Choose the correct Ukrainian version: Це коштує 50 гривн.'
        options:
          - text: Це коштує 50 гривень.
            correct: true
          - text: Це коштує 50 гривн.
            correct: false
          - text: Це коштує 50 гривні.
            correct: false
        explanation: The money word is гривня; 50 uses гривень.
      - prompt: 'Choose the correct Ukrainian version: Я хочу приміряю пальто.'
        options:
          - text: Я хочу приміряти пальто.
            correct: true
          - text: Я хочу приміряю пальто.
            correct: false
          - text: Я хочу приміряєш пальто.
            correct: false
        explanation: Хочу takes the infinitive приміряти.
      - prompt: 'Choose the correct Ukrainian version: Ці яблука коштує сорок гривень.'
        options:
          - text: Ці яблука коштують сорок гривень.
            correct: true
          - text: Ці яблука коштує сорок гривень.
            correct: false
          - text: Ці яблука коштувати сорок гривень.
            correct: false
        explanation: The plural subject ці яблука takes коштують.
