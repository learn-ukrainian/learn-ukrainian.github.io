inline:
  - id: act-1
    type: fill-in
    title: "Complete the life story"
    instruction: "Choose the word or phrase that completes each sentence."
    items:
      - sentence: "П’ять років тому я був студентом. ___ я жив у Торонто, а тепер живу в Києві."
        answer: 'Раніше'
        options:
          - 'Раніше'
          - "Завтра"
          - "Наступного року"
        explanation: "Раніше fits the previous Toronto period. Завтра and наступного року point after the present Kyiv period, contradicting жив and the contrast."
      - sentence: "___ я живу в Києві."
        answer: 'Зараз'
        options:
          - 'Зараз'
          - "Києві"
          - "Працював"
        explanation: "Зараз is a time adverb. Києві requires a preposition as a location; працював cannot modify живу as a time expression."
      - sentence: '___ я буду вчити українську.'
        answer: 'Далі'
        options:
          - 'Далі'
          - 'У дитинстві'
          - 'Раніше'
        explanation: 'Далі points to a future plan.'
      - sentence: "Тепер мені тридцять років. ___ я ходила в школу."
        answer: 'У дитинстві'
        options:
          - 'У дитинстві'
          - 'Завтра'
          - "Наступного року"
        explanation: "У дитинстві fits the recalled school years; завтра and наступного року conflict with the completed earlier period."
  - id: act-2
    type: order
    title: Put the life story in order
    instruction: Arrange the lines from past to future.
    items:
      - 'Я народився в Канаді.'
      - 'У дитинстві я жив у Торонто.'
      - 'Потім я переїхав у Київ.'
      - 'Зараз я живу в Києві.'
      - 'Далі я буду вчити українську.'
    correct_order: [0, 1, 2, 3, 4]
  - id: act-3
    type: match-up
    title: Story phrases
    instruction: Match each Ukrainian phrase with its English meaning.
    pairs:
      - left: 'я народився'
        right: 'I was born'
      - left: 'я жила'
        right: 'I lived (female speaker)'
      - left: 'я живу'
        right: 'I live'
      - left: 'я працюю'
        right: 'I work'
      - left: 'я буду подорожувати'
        right: 'I will travel'
      - left: 'ми будемо вчити'
        right: 'we will study'
  - id: act-4
    type: group-sort
    title: Sort story pieces
    instruction: Put each phrase into the right story group.
    groups:
      - name: 'past'
        items:
          - 'я народився'
          - 'я жила'
          - 'переїхав'
          - 'у дитинстві'
      - name: 'present'
        items:
          - 'зараз я живу в Києві'
          - 'я живу'
          - 'я працюю'
          - 'я вивчаю'
      - name: 'future'
        items:
          - 'далі я буду подорожувати'
          - 'я буду жити'
          - 'ми будемо вчити'
          - 'вона буде працювати'
workbook:
  - type: true-false
    title: A1 story check
    instruction: Decide whether the sentence stays in the A1 story frame.
    items:
      - statement: 'Раніше я жив у Варшаві.'
        answer: true
        explanation: 'Раніше plus past жив is a clear past sentence.'
      - statement: 'Зараз я буду живу в Києві.'
        answer: false
        explanation: 'Do not put буду before a present form. Use Зараз я живу.'
      - statement: 'Далі я буду подорожувати.'
        answer: true
        explanation: 'Буду + infinitive is the A1 future pattern.'
      - statement: 'Мене звати Софія.'
        answer: true
        explanation: 'This is the normal A1 name phrase.'
      - statement: "Мене звати Софію."
        answer: false
        explanation: 'With Мене звати, the name here is nominative Софія, not accusative Софію.'
  - type: quiz
    title: Choose story lines
    instruction: Choose the sentence whose words fit together.
    items:
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Раніше я жив у Торонто.
            correct: true
          - text: Раніше я жили у Торонто.
            correct: false
          - text: Раніше ми жив у Торонто.
            correct: false
        explanation: The key has matching subject and verb forms. я жили and ми жив combine a singular subject with a plural verb or a plural subject with a singular verb.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Зараз я живу в Києві.
            correct: true
          - text: Зараз я живеш в Києві.
            correct: false
          - text: Зараз я живуть в Києві.
            correct: false
        explanation: The stated subject agrees with живу, not with the person/number forms живеш or живуть.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Далі я буду вчити українську.
            correct: true
          - text: Далі я будеш вчити українську.
            correct: false
          - text: Далі я будемо вчити українську.
            correct: false
        explanation: The subject agrees with буду; будеш and будемо belong to different persons or numbers.
      - prompt: — Як тебе звати? — ___
        options:
          - text: Мене звати Софія.
            correct: true
          - text: Мене звати Софію.
            correct: false
          - text: Мене звати Софії.
            correct: false
        explanation: This construction requires nominative Софія. Софію and Софії are different case forms.
  - type: fill-in
    title: Complete the mini biography
    instruction: "Choose the form that completes the story."
    items:
      - sentence: "Олена: Я ___ у Львові тридцять років тому."
        answer: 'народилася'
        options:
          - 'народилася'
          - "народився"
          - "народилися"
        explanation: "Олена selects feminine singular народилася. Народився is masculine singular; народилися is plural."
      - sentence: "Олена: Раніше я ___ в Одесі."
        answer: 'жила'
        options:
          - 'жила'
          - "жив"
          - "жили"
        explanation: "Олена selects feminine singular жила. Жив is masculine singular; жили is plural."
      - sentence: "Зараз я ___ в офісі."
        answer: 'працюю'
        options:
          - 'працюю'
          - "працюєш"
          - "працюють"
        explanation: "Я selects first-person singular працюю. Працюєш is second-person singular; працюють third-person plural."
      - sentence: "Від завтра я ___ українську щодня."
        answer: 'буду вчити'
        options:
          - 'буду вчити'
          - "будеш вчити"
          - "будемо вчити"
        explanation: "The subject я agrees with буду; будеш and будемо are other person/number forms. The infinitive remains unchanged."
  - type: quiz
    title: Repair the story
    instruction: Choose the better A1 sentence.
    items:
      - prompt: "— Де ти живеш? — ___"
        options:
          - text: 'Зараз я живу в Києві.'
            correct: true
          - text: "Зараз я живеш у Києві."
            correct: false
          - text: 'Зараз я буду живу в Києві.'
            correct: false
        explanation: "Я agrees with живу. Живеш agrees with ти; буду живу incorrectly combines two personal forms."
      - prompt: "— Що ти будеш робити далі? — ___"
        options:
          - text: 'Далі я буду працювати.'
            correct: true
          - text: 'Далі я працював.'
            correct: false
          - text: 'Далі я працюю учора.'
            correct: false
        explanation: 'Буду + infinitive is the A1 future.'
      - prompt: 'Which is the natural name sentence?'
        options:
          - text: 'Мене звати Данило.'
            correct: true
          - text: "Мене звати Данилу."
            correct: false
          - text: 'Я звати Данило.'
            correct: false
        explanation: 'Use the phrase Мене звати...'
  - type: translate
    title: Say your story
    instruction: Choose the Ukrainian sentence that matches the English prompt.
    items:
      - source: 'Earlier I lived in Toronto.'
        options:
          - text: 'Раніше я жив у Торонто.'
            correct: true
          - text: 'Зараз я живу в Торонто.'
            correct: false
          - text: 'Далі я буду жити в Торонто.'
            correct: false
        explanation: 'Earlier points to the past.'
      - source: 'Now I live in Kyiv.'
        options:
          - text: 'Зараз я живу в Києві.'
            correct: true
          - text: 'Раніше я жив у Києві.'
            correct: false
          - text: 'Далі я буду жити в Києві.'
            correct: false
        explanation: 'Now points to the present.'
      - source: 'Next I will study Ukrainian.'
        options:
          - text: 'Далі я буду вчити українську.'
            correct: true
          - text: 'Далі я вчив українську.'
            correct: false
          - text: 'Зараз я вчив українську.'
            correct: false
        explanation: 'Use буду + infinitive for the future.'
  - type: error-correction
    title: Repair the timeline
    instruction: Keep the named speaker, subject and time words. Correct forms; use the compound future for future plans.
    items:
      - sentence: 'Раніше Олена жив у Канаді.'
        error: 'жив'
        correction: 'жила'
        explanation: 'Олена agrees with feminine singular жила, not masculine жив.'
      - sentence: 'Зараз я живеш у Києві.'
        error: 'живеш'
        correction: 'живу'
        explanation: 'Я agrees with first-person живу, not second-person живеш.'
      - sentence: 'Завтра я буду працює тут.'
        error: 'працює'
        correction: 'працювати'
        explanation: 'Буду combines with infinitive працювати, not finite працює.'
      - sentence: 'Я буду працюю в офісі.'
        error: 'працюю'
        correction: 'працювати'
        explanation: 'After буду, use the infinitive працювати.'
      - sentence: 'Мене звати Софію.'
        error: 'Софію'
        correction: 'Софія'
        explanation: 'The name in Мене звати Софія is nominative.'
