          - іде дощ
          - іде сніг
          - сонячно
        explanation: "The clothes are getting wet during the walk at+20 °C. Іде дощ explains that situation. Snow conflicts with the warm scene; sunny weather does not explain the ongoing wetting."
      - sentence: "На термометрі +18 °C. Навесні ___ і красиво."
        answer: тепло
        options:
          - тепло
          - холодно
          - спекотно
        explanation: "The moderate positive temperature fits тепло. Холодно and спекотно describe the contrasting cold/heat extremes in this A1 weather scale."
