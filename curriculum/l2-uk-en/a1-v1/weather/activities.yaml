  - id: act-2
    type: fill-in
    title: Погода і пора року
    instruction: Обери логічну погоду для кожної пори року або температури.
    items:
      - sentence: "Взимку часто ___."
        answer: іде сніг
        options:
          - іде сніг
          - іде снігу
          - іде снігом
        explanation: "Сніг is the nominative subject of іде. Снігу and снігом are different cases."
      - sentence: "Влітку дуже ___."
        answer: спекотно
        options:
          - спекотно
          - спекотний
          - спекотна
        explanation: "Спекотно is an adverb used as an impersonal weather predicate. Спекотний and спекотна are adjectives."
      - sentence: "Восени часто ___."
        answer: іде дощ
        options:
          - іде дощ
          - іде дощу
          - іде дощем
        explanation: "Дощ is the nominative subject of іде. Дощу and дощем are different cases."
      - sentence: "Навесні ___ і красиво."
        answer: тепло
        options:
          - тепло
          - теплий
          - тепла
        explanation: "Тепло and красиво are adverbs in this weather sentence. Теплий and тепла are adjectives."
      - sentence: 'Сьогодні мінус п''ять, дуже ___.'
        answer: холодно
        options:
          - холодно
          - тепло
          - спекотно
        explanation: 'Мінус п''ять points to холодно.'
      - sentence: 'Сьогодні плюс двадцять п''ять, ___.'
        answer: тепло
        options:
          - тепло
          - прохолодно
          - холодно
        explanation: 'Плюс двадцять п''ять can be described as тепло here.'
  - id: act-3
