inline:
  - id: act-1
    type: group-sort
    title: Food by gender
    instruction: Sort the foods by the review groups.
    groups:
      - name: 'Masculine'
        items:
          - 'сир'
          - 'борщ'
          - 'хліб'
          - 'чай'
      - name: 'Feminine'
        items:
          - 'вода'
          - 'кава'
          - 'каша'
          - 'піца'
      - name: 'Neuter'
        items:
          - 'молоко'
          - 'яблуко'
          - 'меню'
          - "м'ясо"
      - name: 'Plural'
        items:
          - 'вареники'
          - 'помідори'
          - 'тарілки'
          - 'склянки'
  - id: act-2
    type: quiz
    title: Accusative checkpoint
    instruction: Choose the correct object form.
    items:
      - prompt: Я їм цей ___.
        options:
          - text: салат
            correct: true
          - text: салата
            correct: false
          - text: салату
            correct: false
        explanation: 'Цей identifies a masculine inanimate accusative object: салат. Салата and салату are not the matching case in this phrase.'
      - prompt: Я бачу ___.
        options:
          - text: брата
            correct: true
          - text: брат
            correct: false
          - text: брату
            correct: false
        explanation: Брат is a male person, so use брата.
      - prompt: Я п'ю цю ___.
        options:
          - text: воду
            correct: true
          - text: вода
            correct: false
          - text: води
            correct: false
        explanation: Цю takes matching feminine accusative воду. Вода is nominative; води is not feminine singular accusative.
      - prompt: Я знаю ___.
        options:
          - text: Олену
            correct: true
          - text: Олена
            correct: false
          - text: Олени
            correct: false
        explanation: Use Олену after знаю.
      - prompt: Я люблю ___.
        options:
          - text: борщ
            correct: true
          - text: борщу
            correct: false
          - text: борщем
            correct: false
        explanation: Борщ is food and stays борщ.
      - prompt: Я чекаю ___.
        options:
          - text: друга
            correct: true
          - text: друг
            correct: false
          - text: другу
            correct: false
        explanation: Use друга for the person you are waiting for.
      - prompt: Я купую цей ___.
        options:
          - text: хліб
            correct: true
          - text: хліба
            correct: false
          - text: хлібу
            correct: false
        explanation: Цей identifies the singular masculine accusative object хліб. Хліба and хлібу do not agree in case with цей.
      - prompt: Я бачу ___.
        options:
          - text: лікаря
            correct: true
          - text: лікар
            correct: false
          - text: лікарю
            correct: false
        explanation: Use лікаря after бачу.
      - prompt: Я їм цю ___.
        options:
          - text: піцу
            correct: true
          - text: піца
            correct: false
          - text: піци
            correct: false
        explanation: Цю requires feminine accusative піцу. Піца is nominative; піци is not feminine singular accusative.
      - prompt: Я люблю цю ___.
        options:
          - text: маму
            correct: true
          - text: мама
            correct: false
          - text: мами
            correct: false
        explanation: Цю identifies one feminine object and takes singular accusative маму.
  - id: act-3
    type: fill-in
    title: Market and cafe day
    instruction: Choose the word or phrase that completes the dialogue.
    items:
      - sentence: "— Що ти їси на сніданок? — Я їм цю ___ і п'ю каву."
        answer: 'кашу'
        options:
          - 'кашу'
          - 'каша'
          - 'каші'
        explanation: "Цю requires feminine singular accusative кашу. Каша is nominative; каші has no feminine singular accusative reading."
      - sentence: '— Потім іду на ринок. Скільки ___ помідори?'
        answer: 'коштують'
        options:
          - 'коштують'
          - 'коштує'
          - 'коштувати'
        explanation: 'Use коштують with plural помідори.'
      - sentence: '— Тридцять ___.'
        answer: 'гривень'
        options:
          - 'гривень'
          - 'гривні'
          - 'гривня'
        explanation: '30 uses гривень.'
      - sentence: '— Дайте ___ яблук, будь ласка.'
        answer: 'кілограм'
        options:
          - 'кілограм'
          - 'літр'
          - 'пляшку'
        explanation: 'Use кілограм яблук.'
      - sentence: '— Потім у кафе: ___ борщ і воду, будь ласка.'
        answer: 'Мені'
        options:
          - 'Мені'
          - 'Я'
          - 'Мною'
        explanation: 'Мені begins the cafe order phrase.'
      - sentence: '— Рахунок, будь ласка. Можна ___?'
        answer: 'карткою'
        options:
          - 'карткою'
          - 'картка'
          - 'картки'
        explanation: 'Карткою is the payment phrase.'
      - sentence: '— О, я бачу ___! Олено, привіт!'
        answer: 'Олену'
        options:
          - 'Олену'
          - 'Олена'
          - 'Олени'
        explanation: 'The greeting uses Олено, but the object is Олену.'
      - sentence: '— Ти знаєш мого ___?'
        answer: 'брата'
        options:
          - 'брата'
          - 'брат'
          - 'братом'
        explanation: 'Use брата for мого брата.'
  - id: act-4
    type: match-up
    title: Situation to phrase
    instruction: Match each situation with the phrase you can say.
    pairs:
      - left: 'In the checkpoint cafe, you ask for coffee with milk.'
        right: 'Мені каву з молоком, будь ласка.'
      - left: 'You ask for the price.'
        right: 'Скільки коштує?'
      - left: 'At the register, you check whether card payment is possible.'
        right: 'Можна карткою?'
      - left: 'The server asks where you will eat.'
        right: 'Тут чи із собою?'
      - left: 'You ask for one kilogram of apples.'
        right: 'Дайте кілограм яблук.'
      - left: 'The price feels high.'
        right: 'Дорого!'
      - left: 'You ask if a seat is free.'
        right: 'Тут вільно?'
      - left: 'After lunch, you thank the server for the meal.'
        right: 'Було дуже смачно, дякую!'
workbook:
  - type: true-false
    title: Food-shopping checks
    instruction: Decide whether each statement fits A1.6.
    items:
      - statement: 'Борщ is presented as a Ukrainian cultural food form.'
        answer: true
        explanation: 'The checkpoint keeps борщ in Ukrainian cultural context.'
      - statement: 'Вареники з картоплею is treated as a useful food phrase.'
        answer: true
        explanation: 'Use the phrase as a memorized expression here.'
      - statement: 'Adding -а to борщ is not the A1.6 target form.'
        answer: true
        explanation: 'Use Я люблю борщ.'
      - statement: 'Мені каву з молоком, будь ласка is a cafe order.'
        answer: true
        explanation: 'It is the ordering frame from M38.'
      - statement: 'Скільки коштують помідори? asks a price for plural tomatoes.'
        answer: true
        explanation: 'Plural помідори takes коштують.'
      - statement: 'Я знаю брата uses кого? for a person.'
        answer: true
        explanation: 'The person form is брата.'
      - statement: 'Смачного! is a natural line when serving guests.'
        answer: true
        explanation: 'Use Смачного! before eating.'
      - statement: 'This checkpoint starts A1.7 phone and email content.'
        answer: false
        explanation: 'A1.7 comes next; this checkpoint closes A1.6.'
  - type: fill-in
    title: Build food-shopping lines
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - answer: ринок
        sentence: — Куди йде Анна? — Анна йде на ___.
        options:
          - ринок
          - ринку
          - ринком
        explanation: Куди requests the destination на ринок.
      - answer: купує
        sentence: Вона ___ помідори, сир і хліб.
        options:
          - купує
          - купую
          - купують
        explanation: Вона takes купує.
      - answer: гривень
        sentence: З вас сто сорок ___.
        options:
          - гривень
          - гривня
          - гривні
        explanation: Сто сорок takes гривень.
      - answer: карткою
        sentence: Анна платить ___.
        options:
          - карткою
          - картка
          - картки
        explanation: Карткою expresses the payment method.
      - answer: в
        sentence: — Куди потім іде Анна? — Потім Анна йде ___ кафе.
        options:
          - в
          - з
          - без
        explanation: В кафе gives the destination; з кафе gives an origin.
      - answer: борщ
        sentence: Вона замовляє цей ___ і каву з молоком.
        options:
          - борщ
          - борщу
          - борщем
        explanation: Цей takes the matching masculine object борщ.
      - answer: Олену
        sentence: У кафе Анна бачить ___.
        options:
          - Олену
          - Олена
          - Оленою
        explanation: The person object is Олену.
      - answer: з картоплею
        sentence: Анна готує вареники ___.
        options:
          - з картоплею
          - з картопля
          - з картоплю
        explanation: Use the additive phrase з картоплею.
      - answer: беруть
        sentence: Гості ___ тарілки і склянки.
        options:
          - беруть
          - бере
          - берете
        explanation: Гості takes беруть.
      - answer: Смачного!
        sentence: 'Гості сідають за стіл обідати. Анна каже: «___»'
        options:
          - Смачного!
          - Де пошта?
          - Куди ти їдеш?
        explanation: Смачного! is the meal wish. Inline direct speech is enclosed in quotation marks.
  - type: fill-in
    title: Serve the table
    instruction: Complete the dinner scene.
    items:
      - sentence: Анна готує ___ з картоплею.
        answer: вареники
        options:
          - вареники
          - рахунок
          - картку
        explanation: Вареники з картоплею is the food phrase.
      - sentence: Вона ставить на стіл ___.
        answer: тарілки
        options:
          - тарілки
          - гривні
          - лікаря
        explanation: Тарілки go on the table.
      - sentence: Гості беруть ___.
        answer: склянки
        options:
          - склянки
          - магазин
          - брата
        explanation: Склянки are glasses.
      - sentence: 'Гості сідають за стіл обідати. Анна каже: «___»'
        answer: Смачного!
        options:
          - Смачного!
          - Скільки коштує?
          - Плачу карткою.
        explanation: Смачного! is the meal wish. Inline direct speech is enclosed in quotation marks.
      - sentence: Олена бере ___ хліба.
        answer: шматок
        options:
          - шматок
          - літр
          - пляшку
        explanation: Use шматок хліба.
      - sentence: Анна наливає одну ___ води.
        answer: склянку
        options:
          - склянку
          - кілограм
          - буханку
        explanation: Одну agrees with feminine accusative склянку. Masculine кілограм would need один; буханка is a loaf and cannot be a measure/container of poured water.
  - type: match-up
    title: From market to cafe
    instruction: Match each moment in the day with the line that fits.
    pairs:
      - left: 'Anna asks the tomato price.'
        right: 'Скільки коштують помідори?'
      - left: 'The seller gives the total.'
        right: 'З вас сто сорок гривень.'
      - left: 'Anna pays with a card.'
        right: 'Я плачу карткою.'
      - left: 'Anna orders soup and water.'
        right: 'Мені борщ і воду, будь ласка.'
      - left: 'The server asks for here or to go.'
        right: 'Вам тут чи із собою?'
      - left: 'Anna asks for the bill.'
        right: 'Дайте, будь ласка, рахунок.'
      - left: 'Olena thanks after lunch.'
        right: 'Було дуже смачно, дякую!'
  - type: group-sort
    title: Що? or кого?
    instruction: Sort the object forms by the question they answer.
    groups:
      - name: 'Що? food and things'
        items:
          - 'борщ'
          - 'воду'
          - 'хліб'
          - 'яблука'
          - 'рахунок'
      - name: 'Кого? people'
        items:
          - 'Олену'
          - 'брата'
          - 'друга'
          - 'лікаря'
          - 'маму'
  - type: quiz
    title: Repair A1.6 interference
    instruction: Pick the A1.6 sentence you would actually say.
    items:
      - prompt: 'Repair: Я хочу вода.'
        options:
          - text: Я хочу воду.
            correct: true
          - text: Я хочу вода.
            correct: false
          - text: Я хочу водою.
            correct: false
        explanation: Use the direct-object form or the memorized service phrase.
      - prompt: 'Repair: Я люблю борща.'
        options:
          - text: Я люблю борщ.
            correct: true
          - text: Я люблю борща.
            correct: false
          - text: Я люблю борщу.
            correct: false
        explanation: Борщ stays борщ as a food object.
      - prompt: 'Repair: Смачний кава.'
        options:
          - text: Смачна кава.
            correct: true
          - text: Смачний кава.
            correct: false
          - text: Смачне кава.
            correct: false
        explanation: 'Кава is feminine: смачна кава.'
      - prompt: 'Repair: Я хочу їда.'
        options:
          - text: Я хочу їсти.
            correct: true
          - text: Я хочу їда.
            correct: false
          - text: Я хочу їси.
            correct: false
        explanation: Хотіти can take the infinitive їсти.
      - prompt: 'Офіціант: Як вас звати? Що вам принести? Джон: ___'
        options:
          - text: Мене звати Джон, дайте меню.
            correct: true
          - text: Мені звати Джон, дайте меню.
            correct: false
          - text: Я є Джон і я маю меню.
            correct: false
        explanation: The key gives a name and requests the menu. Мені has the wrong case with звати; the possession statement я маю меню does not answer the server’s request for what to bring.
      - prompt: 'У кафе двоє офіціантів. Джон звертається до обох: ___'
        options:
          - text: Дайте, будь ласка, рахунок.
            correct: true
          - text: Дай, будь ласка, рахунок.
            correct: false
          - text: Дайте мені рахунком.
            correct: false
        explanation: Дайте addresses both servers. Дай is singular and cannot address both; рахунком is instrumental instead of the direct object рахунок after дайте.
      - prompt: 'Київ. На ціннику написано «20 ₴». Я плачу й кажу: ___'
        options:
          - text: Я плачу гривнями.
            correct: true
          - text: Я плачу рублями.
            correct: false
          - text: Я плачу гривень.
            correct: false
        explanation: The price is denominated in hryvnias, so Я плачу гривнями fits. Рублями names another currency, not this price’s unit; гривень is genitive rather than the payment instrumental.
