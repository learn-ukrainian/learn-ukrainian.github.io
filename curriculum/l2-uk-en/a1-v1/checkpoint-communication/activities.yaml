inline:
  - id: act-1
    type: fill-in
    title: Address plus request
    instruction: Choose the form that completes the checkpoint sentence.
    items:
      - sentence: '___, принеси листівки, будь ласка.'
        answer: 'Маріє'
        options:
          - 'Маріє'
          - 'Марія'
          - 'Марію'
        explanation: 'Use the calling form Маріє.'
      - sentence: '___, постав стіл біля вікна.'
        answer: 'Тарасе'
        options:
          - 'Тарасе'
          - 'Тарас'
          - 'Тарасу'
        explanation: 'Use the calling form Тарасе.'
      - sentence: 'Олено, ___ привітання.'
        answer: 'напиши'
        options:
          - 'напиши'
          - 'писати'
          - 'пише'
        explanation: 'Use the ти command напиши.'
      - sentence: 'Друже, ___ мені, будь ласка.'
        answer: 'допоможи'
        options:
          - 'допоможи'
          - 'допомагати'
          - 'допомагає'
        explanation: 'Use the request form допоможи.'
      - sentence: 'Пані Оксано, ___ маркер, будь ласка.'
        answer: 'дайте'
        options:
          - 'дайте'
          - 'дай'
          - 'дати'
        explanation: 'Use the polite ви form дайте.'
      - sentence: 'Друзі, ___ сюди.'
        answer: 'заходьте'
        options:
          - 'заходьте'
          - 'заходити'
          - 'заходить'
        explanation: 'Use the plural/polite command заходьте.'
  - id: act-2
    type: quiz
    title: Which connector?
    instruction: Choose the connector that fits the checkpoint sentence.
    items:
      - prompt: 'Ми пишемо листівки ___ вітаємо друзів.'
        options:
          - text: 'і'
            correct: true
          - text: 'але'
            correct: false
          - text: 'коли'
            correct: false
        explanation: 'Use і to add another action.'
      - prompt: 'Я хочу допомогти, ___ я зайнятий.'
        options:
          - text: 'але'
            correct: true
          - text: "щоб"
            correct: false
          - text: 'де'
            correct: false
        explanation: 'Use але for contrast.'
      - prompt: "Тарас ставить стіл, ___ людей багато."
        options:
          - text: 'бо'
            correct: true
          - text: "якого"
            correct: false
          - text: "котрий"
            correct: false
        explanation: "Бо introduces the reason. Якого and котрий cannot introduce the impersonal clause людей багато."
      - prompt: "Марія пише, ___ Тарас ставить стіл."
        options:
          - text: 'а'
            correct: true
          - text: "якого"
            correct: false
          - text: "котрого"
            correct: false
        explanation: "А coordinates the two subject-predicate clauses; якого and котрого have no grammatical role in the second clause."
      - prompt: "Я беру маркер, ___ пишу листівку."
        options:
          - text: 'тому що'
            correct: true
          - text: "якого"
            correct: false
          - text: "котрому"
            correct: false
        explanation: "Тому що introduces the reason. Якого and котрому have no compatible antecedent or syntactic role in this clause."
  - id: act-3
    type: fill-in
    title: "Complete the conversation"
    instruction: Complete each short detail frame.
    items:
      - sentence: 'Я знаю, ___ маркери.'
        answer: 'де'
        options:
          - 'де'
          - 'що'
          - 'коли'
        explanation: 'Use де for a place.'
      - sentence: "Я думаю, ___ все готово."
        answer: 'що'
        options:
          - 'що'
          - "якого"
          - "котрому"
        explanation: "Що introduces the thought; якого and котрому cannot introduce все готово."
      - sentence: "— Скажи, ___ зустріч. — О третій."
        answer: 'коли'
        options:
          - 'коли'
          - 'де'
          - 'що'
        explanation: "О третій answers коли. Де asks for a place and що cannot introduce this time question."
      - sentence: 'Вона знає, ___ стіл.'
        answer: 'де'
        options:
          - 'де'
          - 'куди'
          - 'що'
        explanation: 'A static place uses де.'
      - sentence: "— Я не знаю, ___ писати. — Напиши: «З Новим роком!»"
        answer: 'що'
        options:
          - 'що'
          - 'де'
          - 'коли'
        explanation: "The reply supplies the greeting text, answering що; it gives neither a location for де nor a time for коли."
      - sentence: "— Скажіть, ___ ви вільні. — У суботу після обіду."
        answer: 'коли'
        options:
          - 'коли'
          - 'де'
          - 'що'
        explanation: "The reply gives a time, answering коли rather than де; що cannot introduce this time question."
  - id: act-4
    type: match-up
    title: Holiday greetings review
    instruction: Match the holiday phrase to its English meaning.
    pairs:
      - left: 'З Новим роком!'
        right: 'Happy New Year!'
      - left: 'З Різдвом Христовим!'
        right: 'Merry Christmas!'
      - left: 'З Великоднем!'
        right: 'Happy Easter!'
      - left: 'З Днем Незалежності України!'
        right: 'Happy Independence Day of Ukraine!'
      - left: "Бажаю здоров'я."
        right: 'I wish you health.'
      - left: 'Веселих свят!'
        right: 'Happy holidays!'
workbook:
  - type: quiz
    title: Choose checkpoint sentences
    instruction: Choose the sentence whose words fit together.
    items:
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Олено, принеси листівки, будь ласка.
            correct: true
          - text: Олено, принеси листівки, будь ласку.
            correct: false
          - text: Олено, принеси листівки, будь ласки.
            correct: false
        explanation: Both alternatives break the fixed request phrase будь ласка.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Я знаю, де маркери.
            correct: true
          - text: Я знаєш, де маркери.
            correct: false
          - text: Я знають, де маркери.
            correct: false
        explanation: The stated subject agrees with знаю, not with the person/number forms знаєш or знають.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Я хочу допомогти, але я зайнятий.
            correct: true
          - text: Я хочеш допомогти, але я зайнятий.
            correct: false
          - text: Я хочуть допомогти, але я зайнятий.
            correct: false
        explanation: The stated subject agrees with хочу, not with the person/number forms хочеш or хочуть.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Тарасе, постав стіл.
            correct: true
          - text: Тарасе, постав столом.
            correct: false
          - text: Тарасе, постав столу.
            correct: false
        explanation: The construction takes стіл. The case forms столом and столу cannot replace it here.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Ми пишемо листівки і вітаємо друзів.
            correct: true
          - text: Ми пише листівки і вітаємо друзів.
            correct: false
          - text: Ми пишеш листівки і вітаємо друзів.
            correct: false
        explanation: The stated subject agrees with пишемо, not with the person/number forms пише or пишеш.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Вітаю з Новим роком!
            correct: true
          - text: Вітаю з Новий рік!
            correct: false
          - text: Вітаю з Новому році!
            correct: false
        explanation: The construction takes Новим роком. The case forms Новий рік and Новому році cannot replace it here.
  - type: group-sort
    title: Sort communication functions
    instruction: Sort each word or phrase by the function it expresses.
    groups:
      - name: 'calling a person'
        items:
          - 'Олено!'
          - 'Тарасе!'
          - 'Друже!'
      - name: 'commands'
        items:
          - 'принеси'
          - 'постав'
          - 'дайте'
      - name: 'addition, contrast or a reason'
        items:
          - 'Я читаю і пишу.'
          - 'Я хочу, але не можу.'
          - 'Я вдома, бо я хворий.'
      - name: 'knowing a fact, place or time'
        items:
          - 'Я знаю, що урок сьогодні.'
          - 'Я знаю, де кафе.'
          - 'Я знаю, коли урок.'
      - name: 'holiday greetings and names'
        items:
          - 'З Новим роком!'
          - 'З Великоднем!'
          - 'День Незалежності України'
  - type: true-false
    title: Checkpoint readiness
    instruction: Decide whether each statement is ready for this checkpoint.
    items:
      - statement: 'Олено, допоможи, будь ласка is a good address plus request.'
        answer: true
        explanation: 'It uses the calling form and a polite request.'
      - statement: 'Тарас, постав стіл is the best way to address Taras.'
        answer: false
        explanation: 'Use Тарасе when calling him.'
      - statement: 'Я знаю, де маркери has the comma before де.'
        answer: true
        explanation: 'That is the M45 comma habit.'
      - statement: 'Я хочу допомогти але я зайнятий needs no comma.'
        answer: false
        explanation: 'Add the comma before але.'
      - statement: 'З Новим роком is a fixed greeting phrase.'
        answer: true
        explanation: 'This reviews M46.'
      - statement: 'This checkpoint introduces new grammar.'
        answer: false
        explanation: 'It only integrates M42-M46.'
      - statement: 'Будь ласка can soften a request.'
        answer: true
        explanation: 'It keeps the tone polite.'
      - statement: 'Що, де, коли should stay in short A1 frames here.'
        answer: true
        explanation: 'Short details are the target.'
  - type: match-up
    title: Tool to checkpoint skill
    instruction: Match each ready phrase to the A1.7 skill it proves.
    pairs:
      - left: 'Маріє, принеси листівки.'
        right: 'calling form plus request'
      - left: 'Я хочу допомогти, але я зайнятий.'
        right: 'contrast connector'
      - left: 'Я знаю, де маркери.'
        right: 'short place detail'
      - left: 'Пишемо коротко, бо часу мало.'
        right: 'reason connector'
      - left: 'З Різдвом Христовим!'
        right: 'holiday greeting'
      - left: 'Друзі, заходьте.'
        right: 'group address plus command'
  - type: fill-in
    title: Holiday table mini-dialogue
    instruction: Choose the checkpoint word that completes each line.
    items:
      - sentence: 'Олено, ___ листівки, будь ласка.'
        answer: 'принеси'
        options:
          - 'принеси'
          - 'приносити'
          - 'приносить'
        explanation: 'Use the command form принеси.'
      - sentence: "Тарасе, постав столи, ___ людей багато."
        answer: 'бо'
        options:
          - 'бо'
          - "якого"
          - "котрий"
        explanation: "Бо introduces the reason. Якого and котрий cannot introduce людей багато."
      - sentence: "Я думаю, ___ все готово."
        answer: 'що'
        options:
          - 'що'
          - "якого"
          - "котрому"
        explanation: "Що introduces the thought; якого and котрому cannot introduce все готово."
      - sentence: "Марія пише привітання, ___ Тарас ставить стіл."
        answer: 'а'
        options:
          - 'а'
          - "якого"
          - "котрого"
        explanation: "А coordinates the clauses. Neither якого nor котрого has a role in Тарас ставить стіл."
      - sentence: "— Скажіть, ___ ви вільні. — У неділю о другій."
        answer: 'коли'
        options:
          - 'коли'
          - 'бо'
          - 'але'
        explanation: "The reply gives a time, answering коли. Бо would assert a reason and але a contrast, neither requests the time supplied by the reply."
      - sentence: '___ Новим роком!'
        answer: 'З'
        options:
          - 'З'
          - 'На'
          - 'У'
        explanation: 'Use the fixed greeting З Новим роком.'
  - type: error-correction
    title: Repair the checkpoint
    instruction: Keep explicit pronouns, named people and the intended message. Correct address forms, command forms, agreement, case endings or punctuation.
    items:
      - sentence: 'Олена, принеси листівки.'
        error: 'Олена'
        correction: 'Олено'
        explanation: 'Use the calling form when speaking to Olena.'
      - sentence: 'Тарас, постав стіл.'
        error: 'Тарас'
        correction: 'Тарасе'
        explanation: 'Use the calling form Тарасе.'
      - sentence: 'Я знаю де маркери.'
        error: 'знаю де'
        correction: 'знаю, де'
        explanation: 'Add the comma before де.'
      - sentence: 'Я хочу допомогти але я зайнятий.'
        error: 'допомогти але'
        correction: 'допомогти, але'
        explanation: 'Add the comma before але.'
      - sentence: 'Вітаю з Новий рік!'
        error: 'Новий рік'
        correction: 'Новим роком'
        explanation: 'Use the fixed greeting form.'
      - sentence: 'Маріє, ти принесіть маркери.'
        error: 'принесіть'
        correction: 'принеси'
        explanation: 'The explicit familiar ти takes the singular imperative принеси.'
      - sentence: 'Я думаю що все готово.'
        error: 'думаю що'
        correction: 'думаю, що'
        explanation: 'Add the comma before що.'
      - sentence: 'Ми святкує Різдво.'
        error: 'святкує'
        correction: 'святкуємо'
        explanation: 'Ми requires the first-person plural святкуємо.'
