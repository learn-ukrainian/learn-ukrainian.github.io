---
inline:
  - id: act-1
    type: quiz
    title: Змішані форми дій
    instruction: Choose the present-tense form that fits the person.
    items:
      - prompt: Я ___ книгу.
        options:
          - text: читаю
            correct: true
          - text: читаєш
            correct: false
          - text: говорить
            correct: false
        explanation: Я читаю is a Group One form.
      - prompt: Ти ___ українською?
        options:
          - text: говориш
            correct: true
          - text: говорю
            correct: false
          - text: говорять
            correct: false
        explanation: Ти говориш is a Group Two form.
      - prompt: Вона ___ в офісі.
        options:
          - text: працює
            correct: true
          - text: працюю
            correct: false
          - text: працюють
            correct: false
        explanation: Вона працює is the Group One form.
      - prompt: Ми ___ українською.
        options:
          - text: говоримо
            correct: true
          - text: говориш
            correct: false
          - text: говорять
            correct: false
        explanation: Ми говоримо uses the Group Two ending -имо.
      - prompt: Вони ___ у парку.
        options:
          - text: гуляють
            correct: true
          - text: гуляю
            correct: false
          - text: гуляєш
            correct: false
        explanation: Вони гуляють is Group One.
      - prompt: Ви ___ дуже гарно.
        options:
          - text: пишете
            correct: true
          - text: пишите
            correct: false
          - text: пишу
            correct: false
        explanation: Use ви пишете for писати.
      - prompt: Він ___ українською.
        options:
          - text: говорить
            correct: true
          - text: говориш
            correct: false
          - text: говорять
            correct: false
        explanation: Він говорить is Group Two.
      - prompt: Ви ___ сьогодні?
        options:
          - text: працюєте
            correct: true
          - text: працюєш
            correct: false
          - text: працюють
            correct: false
        explanation: Ви працюєте is the polite or plural form.
      - prompt: Я ___ вправу.
        options:
          - text: роблю
            correct: true
          - text: робиш
            correct: false
          - text: роблять
            correct: false
        explanation: Я роблю is the first-person Group Two form.
      - prompt: Вони ___ книгу.
        options:
          - text: читають
            correct: true
          - text: читає
            correct: false
          - text: читаєш
            correct: false
        explanation: Вони читають uses the Group One plural ending.
  - id: act-2
    type: fill-in
    title: Діалог із сусідом
    instruction: Complete the dialogue with the modal, question word, or verb form.
    items:
      - sentence: "Олег: ___ готує сьогодні? Анна: Сьогодні готує Марко."
        answer: Хто
        options:
          - Хто
          - Коли
          - Як
        explanation: "The reply identifies Марко as the cook, so ask Хто. Коли asks for time; як asks for manner."
      - sentence: "Олег: Коли ти ___?"
        answer: прокидаєшся
        options:
          - прокидаєшся
          - прокидається
          - прокидаються
        explanation: "Use прокидаєшся with ти. Прокидається is third-person singular; прокидаються is third-person plural."
      - sentence: 'Олег: Що ти ___ потім?'
        answer: робиш
        options:
          - робиш
          - роблю
          - роблять
        explanation: Ти робиш fits the person ти.
      - sentence: 'Марина: Я ___ в школі.'
        answer: працюю
        options:
          - працюю
          - працює
          - працюємо
        explanation: Я працюю is the first-person form.
      - sentence: 'Олег: Ти ___ читати ввечері?'
        answer: любиш
        options:
          - любиш
          - читаєш
          - робиш
        explanation: Любиш + infinitive asks about liking an action.
      - sentence: "Олег: Я не можу готувати сьогодні й не мушу готувати, але я ___ готувати."
        answer: хочу
        options:
          - хочу
          - можу
          - мушу
        explanation: "Хочу or хоче expresses desire. The other choices contradict the earlier statements that the speaker cannot act and has no obligation to act."
      - sentence: 'Олег: Ти ___ допомагати?'
        answer: можеш
        options:
          - можеш
          - хочу
          - мушу
        explanation: Можеш asks about ability.
      - sentence: 'Марина: Не можу зараз, ___ працювати.'
        answer: мушу
        options:
          - мушу
          - читаю
          - говорю
        explanation: Мушу + infinitive means I have to.
  - id: act-3
    type: fill-in
    title: Мій день
    instruction: Choose the word that completes the short day description.
    items:
      - sentence: "Я снідаю о восьмій, але ___ я прокидаюся о сьомій."
        answer: "спочатку"
        options:
          - спочатку
          - пізніше
          - після цього
        explanation: "The waking time comes before breakfast. Спочатку fits this order; пізніше and після цього would reverse it."
      - sentence: "Потім я ___ і чищу зуби."
        answer: вмиваюся
        options:
          - вмиваюся
          - вмиваєшся
          - вмивається
        explanation: "The subject я needs the first-person singular verb. The other options belong with ти or вони/він."
      - sentence: "Після цього я ___ вдома."
        answer: снідаю
        options:
          - снідаю
          - снідаєш
          - снідають
        explanation: "The subject я needs the first-person singular verb. The other options belong with ти or вони/він."
      - sentence: "Вдень я ___ в офісі."
        answer: працюю
        options:
          - працюю
          - працюєш
          - працюють
        explanation: "The subject я needs the first-person singular verb. The other options belong with ти or вони/він."
      - sentence: Увечері я ___ гуляти.
        answer: хочу
        options:
          - хочу
          - читаю
          - роблю
        explanation: Хочу + infinitive gives an evening plan.
      - sentence: Нарешті я ___ фільм.
        answer: дивлюся
        options:
          - дивлюся
          - мушу
          - снідаю
        explanation: Дивлюся фільм is the familiar evening line.
  - id: act-4
    type: group-sort
    title: Групи дієслів
    instruction: Sort each infinitive by its checkpoint group.
    groups:
      - name: І дієвідміна
        items:
          - читати
          - працювати
          - готувати
          - гуляти
          - прокидатися
          - вмиватися
          - навчатися
      - name: ІІ дієвідміна
        items:
          - говорити
          - робити
          - любити
          - мусити
          - дивитися
