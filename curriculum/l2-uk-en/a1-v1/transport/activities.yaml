inline:
  - id: act-1
    type: quiz
    title: Який транспорт?
    instruction: Choose the natural transport word for each situation.
    items:
      - prompt: 'From the airport to the hotel, faster but expensive.'
        options:
          - text: 'таксі'
            correct: true
          - text: 'трамвай'
            correct: false
          - text: 'колія'
            correct: false
        explanation: 'Таксі is the faster, more expensive option in the dialogue.'
      - prompt: 'City route number seven.'
        options:
          - text: 'автобус'
            correct: true
          - text: 'літак'
            correct: false
          - text: 'вокзал'
            correct: false
        explanation: 'Автобус номер сім is a city bus route.'
      - prompt: 'Underground city travel.'
        options:
          - text: 'метро'
            correct: true
          - text: 'маршрутка'
            correct: false
          - text: 'потяг'
            correct: false
        explanation: 'Метро is the underground city system.'
      - prompt: 'Rail trip to Lviv.'
        options:
          - text: 'потяг'
            correct: true
          - text: 'таксі'
            correct: false
          - text: 'зупинка'
            correct: false
        explanation: 'A trip to Lviv by rail uses потяг.'
      - prompt: 'City rails on the street.'
        options:
          - text: 'трамвай'
            correct: true
          - text: 'літак'
            correct: false
          - text: 'квиток'
            correct: false
        explanation: 'Трамвай runs on rails in the city.'
      - prompt: 'Electric city bus with overhead wires.'
        options:
          - text: 'тролейбус'
            correct: true
          - text: 'метро'
            correct: false
          - text: 'потяг'
            correct: false
        explanation: 'Тролейбус is the electric city bus with wires.'
      - prompt: 'Flight to another country.'
        options:
          - text: 'літак'
            correct: true
          - text: 'автобус'
            correct: false
          - text: 'станція'
            correct: false
        explanation: 'Літак is the transport for a flight.'
      - prompt: 'Small route minibus.'
        options:
          - text: 'маршрутка'
            correct: true
          - text: 'колія'
            correct: false
          - text: 'таксі'
            correct: false
        explanation: 'Маршрутка is a small route minibus.'
  - id: act-2
    type: fill-in
    title: Ticket window
    instruction: Complete the ticket-buying lines.
    items:
      - sentence: Один ___ до Львова, будь ласка.
        answer: квиток
        options:
          - квиток
          - зупинка
          - водій
        explanation: Use квиток for a ticket.
      - sentence: ___ коштує квиток?
        answer: Скільки
        options:
          - Скільки
          - Куди
          - Де
        explanation: Скільки коштує? asks the price.
      - sentence: В один бік чи ___ й назад?
        answer: туди
        options:
          - туди
          - там
          - тут
        explanation: Туди й назад means there and back.
      - sentence: Відправлення ___ дев'ятій.
        answer: о
        options:
          - о
          - в
          - на
        explanation: "Use о with time: о дев'ятій."
      - sentence: Поїзд на ___ колії.
        answer: третій
        options:
          - третій
          - три
          - третє
        explanation: На колії describes the location. Use the feminine locative ordinal третій with колії; три and третє do not fit this construction.
      - sentence: О котрій ___?
        answer: відправлення
        options:
          - відправлення
          - відправленням
          - відправленню
        explanation: The departure event is the nominative subject відправлення in this time question. Instrumental відправленням and dative відправленню cannot be its subject.
  - id: act-3
    type: quiz
    title: Як ми їдемо?
    instruction: Choose the natural travel model.
    items:
      - prompt: "Ми їдемо..."
        options:
          - text: автобусом
            correct: true
          - text: автобусу
            correct: false
          - text: автобуса
            correct: false
        explanation: "Автобусом is the instrumental form for the means of transport. Автобусу and автобуса are not instrumental forms."
      - prompt: 'How do you say by metro?'
        options:
          - text: 'на метро'
            correct: true
          - text: 'метром'
            correct: false
          - text: 'на метрі'
            correct: false
        explanation: 'Метро does not change: на метро.'
      - prompt: 'How do you say by taxi?'
        options:
          - text: 'на таксі'
            correct: true
          - text: 'таксієм'
            correct: false
          - text: 'в таксію'
            correct: false
        explanation: 'Таксі does not change: на таксі.'
      - prompt: 'How do you say by train?'
        options:
          - text: 'потягом'
            correct: true
          - text: 'за потягом'
            correct: false
          - text: 'до потяга'
            correct: false
        explanation: 'Use potiahom: потягом.'
      - prompt: 'How do you say by tram?'
        options:
          - text: 'трамваєм'
            correct: true
          - text: 'на трамваю'
            correct: false
          - text: 'за трамваєм'
            correct: false
        explanation: 'Use the means form трамваєм.'
      - prompt: 'How do you say by trolleybus?'
        options:
          - text: 'тролейбусом'
            correct: true
          - text: 'у тролейбусу'
            correct: false
          - text: 'до тролейбуса'
            correct: false
        explanation: 'Use the means form тролейбусом.'
  - id: act-4
    type: fill-in
    title: Ask the route
    instruction: Complete each short route question or answer.
    items:
      - sentence: 'Як дістатися до ___?'
        answer: 'вокзалу'
        options:
          - 'вокзалу'
          - 'вокзал'
          - 'вокзалі'
        explanation: 'The route phrase is до вокзалу.'
      - sentence: 'Як дістатися до ___?'
        answer: 'центру'
        options:
          - 'центру'
          - 'центр'
          - 'центрі'
        explanation: 'The route phrase is до центру.'
      - sentence: 'Ідіть ___.'
        answer: 'прямо'
        options:
          - 'прямо'
          - 'зупинка'
          - 'квиток'
        explanation: 'Ідіть прямо means go straight.'
      - sentence: 'Поверніть ___.'
        answer: 'направо'
        options:
          - 'направо'
          - 'квиток'
          - 'метро'
        explanation: 'Поверніть направо means turn right.'
      - sentence: 'Поверніть ___.'
        answer: 'наліво'
        options:
          - 'наліво'
          - 'пасажир'
          - 'колія'
        explanation: 'Поверніть наліво means turn left.'
      - sentence: 'Мені ___ тут?'
        answer: 'виходити'
        options:
          - 'виходити'
          - 'квиток'
          - 'коштує'
        explanation: 'Мені виходити тут? asks if this is your stop.'
workbook:
  - type: fill-in
    title: Airport to hotel route
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - sentence: Шановні гості, ___ з аеропорту.
        answer: вийдіть
        options:
          - вийдіть
          - вийди
          - виходжу
        explanation: Вийдіть addresses both guests; вийди addresses one person and виходжу describes the speaker.
      - sentence: Шановні гості, ___ зупинку автобуса.
        answer: знайдіть
        options:
          - знайдіть
          - знайди
          - знаходжу
        explanation: Знайдіть addresses both guests.
      - sentence: Шановні гості, ___ автобусом до метро.
        answer: їдьте
        options:
          - їдьте
          - їдь
          - їду
        explanation: Їдьте addresses both guests.
      - sentence: Шановні гості, потім ___ на метро до центру.
        answer: їдьте
        options:
          - їдьте
          - їдь
          - їду
        explanation: Їдьте addresses both guests.
      - sentence: Шановні гості, на станції ___ прямо.
        answer: ідіть
        options:
          - ідіть
          - іди
          - іду
        explanation: Ідіть addresses both guests.
      - sentence: Готель з правого боку від нас. Готель ___.
        answer: праворуч
        options:
          - праворуч
          - ліворуч
          - позаду
        explanation: Праворуч matches the stated position on the right.
  - type: true-false
    title: Transport culture
    instruction: Decide whether the statement fits the lesson.
    items:
      - statement: 'Добрий день is a natural polite opening.'
        answer: true
        explanation: 'Use Добрий день in transport dialogues.'
      - statement: 'Квиток is the lesson word for ticket.'
        answer: true
        explanation: 'Use квиток.'
      - statement: 'Зупинка is the lesson word for stop.'
        answer: true
        explanation: 'Use зупинка.'
      - statement: 'Один квиток до Львова, будь ласка is a natural ticket line.'
        answer: true
        explanation: 'This is the ticket-window phrase from the dialogue.'
      - statement: 'Я в автобусі answers де?'
        answer: true
        explanation: 'It means I am inside the bus.'
  - type: odd-one-out
    title: Find the odd transport phrase
    instruction: Choose the phrase that does not fit the pattern.
    items:
      - words:
          - автобусом
          - потягом
          - трамваєм
          - на метрі
        answer: на метрі
        explanation: Use на метро.
      - words:
          - квиток
          - зупинка
          - вокзал
          - книга
        answer: книга
        explanation: The first three are transport words. Книга names a book.
      - words:
          - у таксі
          - на метро
          - у метро
          - в таксію
        answer: в таксію
        explanation: Таксі does not change.
      - words:
          - Як дістатися до вокзалу?
          - Де зупинка?
          - Ідіть прямо.
          - Як дістатися до вокзал?
        answer: Як дістатися до вокзал?
        explanation: До takes the genitive вокзалу, not the dictionary form вокзал.
  - type: quiz
    title: Repair transport interference
    instruction: Choose the correct Ukrainian version of each line.
    items:
      - prompt: 'Choose the correct Ukrainian version: Я їду в автобусом до школи.'
        options:
          - text: Я їду автобусом до школи.
            correct: true
          - text: Я їду автобусу до школи.
            correct: false
          - text: Я їду автобусом до школі.
            correct: false
        explanation: Автобусом expresses the means without в. Автобусу is not the instrumental; до requires genitive школи, not locative школі.
      - prompt: 'Choose the correct Ukrainian version: Я сиджу в цьому автобусі і їду за цим автобусом.'
        options:
          - text: Я сиджу в цьому автобусі і їду цим автобусом.
            correct: true
          - text: Я сиджу в цьому автобусі і їду цим автобусу.
            correct: false
          - text: Я сиджу в цьому автобусі і їду за цим автобусом.
            correct: false
        explanation: The speaker is inside this same bus, so їду цим автобусом expresses transport by it. Цим автобусу fails agreement; біля цього автобуса places the traveler outside the bus.
      - prompt: 'Choose the correct Ukrainian version: Я їду в таксію, а потім на метро.'
        options:
          - text: Я їду в таксі, а потім на метро.
            correct: true
          - text: Я їду в таксієм, а потім на метро.
            correct: false
          - text: Я їду в таксію, а потім на метро.
            correct: false
        explanation: Таксі and метро are indeclinable. Here only таксію needs repair; the rest of the sentence provides context.
      - prompt: 'Choose the correct Ukrainian version: Де остановка?'
        options:
          - text: Де зупинка?
            correct: true
          - text: Де остановка?
            correct: false
          - text: Куди зупинка?
            correct: false
        explanation: Use зупинка for a stop.
      - prompt: 'Choose the correct Ukrainian version: Один квитків, будь ласка.'
        options:
          - text: Один квиток, будь ласка.
            correct: true
          - text: Один квитків, будь ласка.
            correct: false
          - text: Одна квиток, будь ласка.
            correct: false
        explanation: Один takes the matching masculine singular квиток.
