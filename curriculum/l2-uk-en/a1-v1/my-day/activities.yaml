---
inline:
  - id: act-1
    type: match-up
    title: Дія і час доби
    instruction: З'єднай дію з логічним часом доби.
    pairs:
      - left: прокидаюся
        right: вранці
      - left: снідаю
        right: вранці
      - left: працюю
        right: вдень
      - left: обідаю
        right: вдень
      - left: вечеряю
        right: ввечері
      - left: дивлюся фільм
        right: ввечері
      - left: лягаю спати
        right: вночі
      - left: сплю
        right: вночі
  - id: act-2
    type: fill-in
    title: Послідовність дня
    instruction: Обери слово або дію, яка логічно продовжує день.
    items:
      - sentence: "Я снідаю о восьмій, але ___ я прокидаюся о сьомій."
        answer: Спочатку
        options:
          - Спочатку
          - Пізніше
          - Після цього
        explanation: "Waking at07:00 precedes breakfast at08:00, so Спочатку fits. Пізніше and Після цього would place07:00 after08:00."
      - sentence: "Після того я ___."
        answer: снідаю
        options:
          - снідаю
          - снідаєш
          - снідають
        explanation: "The subject я needs the first-person singular verb. The other options belong with ти or вони/він."
      - sentence: "Вдень я ___ в офісі."
        answer: працюю
        options:
          - працюю
          - працюєш
          - працюють
        explanation: "The subject я needs the first-person singular verb. The other options belong with ти or вони/він."
      - sentence: "О першій годині я ___."
        answer: обідаю
        options:
          - обідаю
          - обідаєш
          - обідають
        explanation: "The subject я needs the first-person singular verb. The other options belong with ти or вони/він."
      - sentence: "Я працюю до п’ятої, а ___ я читаю книгу о шостій."
        answer: Потім
        options:
          - Потім
          - Перед цим
          - До цього
        explanation: "The second action has a later clock time, so the keyed after-connector fits. Перед цим and До цього both put it before the first action and contradict the clock times."
      - sentence: "Я читаю книгу до одинадцятої, а ___ я лягаю спати о дванадцятій."
        answer: "Потім"
        options:
          - Потім
          - Перед цим
          - До цього
        explanation: "This replacement still tests routine sequence. Потім puts the second action after the first, matching both clock times. Перед цим and До цього reverse that order. The original Нарешті could also mark emotion rather than a final step."
  - id: act-3
    type: fill-in
    title: Частина доби
    instruction: Обери правильну частину доби для речення.
    items:
      - sentence: "На годиннику 07:00. Я п'ю каву ___."
        answer: вранці
        options:
          - вранці
          - вночі
          - ввечері
        explanation: "07:00 is morning: вранці. Вночі and ввечері refer to other parts of the day."
      - sentence: "На годиннику 20:00. Ми вечеряємо ___."
        answer: ввечері
        options:
          - ввечері
          - вранці
          - вдень
        explanation: "20:00 is evening: ввечері. Вранці and вдень refer to other parts of the day."
      - sentence: "(09:00-17:00.) Вона працює з дев'ятої до п'ятої ___."
        answer: вдень
        options:
          - вдень
          - вночі
          - вранці
        explanation: Робочий день з дев'ятої до п'ятої - це вдень.
      - sentence: "Я обідаю о першій. Зараз друга година дня. Вони гуляють у парку ___."
        answer: після обіду
        options:
          - після обіду
          - вночі
          - вранці
        explanation: "Lunch has ended and it is two in the afternoon: після обіду. Вночі and вранці do not fit that time."
  - id: act-4
    type: fill-in
    title: Типові пари у розпорядку дня
    instruction: Обери нормативну українську форму.
    items:
      - sentence: 'Вранці я ___.'
        answer: беру душ
        options:
          - беру душ
          - бере душ
        explanation: "With я, use беру. Бере is the third-person form."
      - sentence: 'Коли я хворий, я ___.'
        answer: "п'ю ліки"
        options:
          - п'ю ліки
          - п'є ліки
        explanation: "With я, use п'ю. П'є goes with він or вона."
      - sentence: '___ зараз? — Восьма.'
        answer: Котра година
        options:
          - Котра година
          - Який час
        explanation: Для запитання про годинник уживаємо Котра година?
      - sentence: '___ в парк після обіду!'
        answer: Ходімо
        options:
          - Ходімо
          - Давайте підемо
        explanation: Ходімо! подається як готовий чанк-запрошення.
      - sentence: 'О восьмій годині я їм ___.'
        answer: сніданок
        options:
          - сніданок
          - завтрак
        explanation: Українське слово - сніданок.
      - sentence: 'Мама готує дуже ___ обід.'
        answer: смачний
        options:
          - смачний
          - вкусний
        explanation: Українське слово - смачний.
      - sentence: 'Ввечері я хочу ___.'
        answer: поїсти
        options:
          - поїсти
          - поїла
        explanation: "After хочу, use the infinitive поїсти. Поїла is a feminine past-tense form."
      - sentence: 'О сьомій я ___ і встав.'
        answer: прокинувся
        options:
          - прокинувся
          - прокинулася
        explanation: "Встав is masculine past, so pair it with прокинувся. Прокинулася is feminine."
