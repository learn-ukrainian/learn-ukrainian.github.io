---
inline:
  - id: act-1
    type: match-up
    title: Дія і час доби
    instruction: З'єднай дію з логічним часом доби.
    pairs:
      - left: прокидаюся
        right: вранці
      - left: снідаю
        right: вранці
      - left: працюю
        right: вдень
      - left: обідаю
        right: вдень
      - left: вечеряю
        right: ввечері
      - left: дивлюся фільм
        right: ввечері
      - left: лягаю спати
        right: вночі
      - left: сплю
        right: вночі
  - id: act-2
    type: fill-in
    title: Послідовність дня
    instruction: Обери слово або дію, яка логічно продовжує день.
    items:
      - sentence: "(First.) ___ я прокидаюся і вмиваюся."
        answer: Спочатку
        options:
          - Спочатку
          - Потім
          - Нарешті
        explanation: День зазвичай починається з прокидання.
      - sentence: "(I have breakfast.) Після того я ___."
        answer: снідаю
        options:
          - снідаю
          - вечеряю
          - лягаю спати
        explanation: Після ранкового вмивання логічно снідати.
      - sentence: "(I work.) Вдень я ___ в офісі."
        answer: працюю
        options:
          - працюю
          - прокидаюся
          - снідаю
        explanation: Робота в офісі логічно підходить до вдень.
      - sentence: "(I have lunch.) О першій годині я ___."
        answer: обідаю
        options:
          - обідаю
          - вечеряю
          - прокидаюся
        explanation: О першій зазвичай обідають.
      - sentence: "(Then.) ___ я читаю книгу або дивлюся фільм."
        answer: Потім
        options:
          - Потім
          - Спочатку
          - Вранці
        explanation: Потім продовжує розповідь після роботи або обіду.
      - sentence: "(Finally.) ___ я лягаю спати о дванадцятій."
        answer: Нарешті
        options:
          - Нарешті
          - Спочатку
          - Вдень
        explanation: Лягати спати - остання дія дня.
  - id: act-3
    type: fill-in
    title: Частина доби
    instruction: Обери правильну частину доби для речення.
    items:
      - sentence: "(In the morning.) Я п'ю каву ___."
        answer: вранці
        options:
          - вранці
          - вночі
          - ввечері
        explanation: Кава найчастіше підходить до ранку.
      - sentence: "(In the evening.) Ми вечеряємо ___."
        answer: ввечері
        options:
          - ввечері
          - вранці
          - вдень
        explanation: Вечеря належить до вечора.
      - sentence: "(09:00-17:00.) Вона працює з дев'ятої до п'ятої ___."
        answer: вдень
        options:
          - вдень
          - вночі
          - вранці
        explanation: Робочий день з дев'ятої до п'ятої - це вдень.
      - sentence: "(After lunch.) Вони гуляють у парку ___."
        answer: після обіду
        options:
          - після обіду
          - вночі
          - вранці
        explanation: Після обіду - природний час для прогулянки.
  - id: act-4
    type: fill-in
    title: Типові пари у розпорядку дня
    instruction: Обери нормативну українську форму.
    items:
      - sentence: 'Вранці я ___.'
        answer: беру душ
        options:
          - беру душ
          - бере душ
        explanation: "With я, use беру. Бере is the third-person form."
      - sentence: 'Коли я хворий, я ___.'
        answer: "п'ю ліки"
        options:
          - п'ю ліки
          - п'є ліки
        explanation: "With я, use п'ю. П'є goes with він or вона."
      - sentence: '___ зараз? — Восьма.'
        answer: Котра година
        options:
          - Котра година
          - Який час
        explanation: Для запитання про годинник уживаємо Котра година?
      - sentence: '___ в парк після обіду!'
        answer: Ходімо
        options:
          - Ходімо
          - Давайте підемо
        explanation: Ходімо! подається як готовий чанк-запрошення.
      - sentence: 'О восьмій годині я їм ___.'
        answer: сніданок
        options:
          - сніданок
          - завтрак
        explanation: Українське слово - сніданок.
      - sentence: 'Мама готує дуже ___ обід.'
        answer: смачний
        options:
          - смачний
          - вкусний
        explanation: Українське слово - смачний.
      - sentence: 'Ввечері я хочу ___.'
        answer: поїсти
        options:
          - поїсти
          - поїла
        explanation: "After хочу, use the infinitive поїсти. Поїла is a feminine past-tense form."
      - sentence: 'О сьомій я ___ і встав.'
        answer: прокинувся
        options:
          - прокинувся
          - прокинулася
        explanation: "Встав is masculine past, so pair it with прокинувся. Прокинулася is feminine."
