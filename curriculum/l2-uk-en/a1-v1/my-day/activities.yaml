---
inline:
  - id: act-1
    type: match-up
    title: Дія і час доби
    instruction: З'єднай дію з логічним часом доби.
    pairs:
      - left: прокидаюся
        right: вранці
      - left: снідаю
        right: вранці
      - left: працюю
        right: вдень
      - left: обідаю
        right: вдень
      - left: вечеряю
        right: ввечері
      - left: дивлюся фільм
        right: ввечері
      - left: лягаю спати
        right: вночі
      - left: сплю
        right: вночі
  - id: act-2
    type: fill-in
    title: Послідовність дня
    instruction: Обери слово або дію, яка логічно продовжує день.
    items:
      - sentence: "Я снідаю о восьмій, але ___ я прокидаюся о сьомій."
        answer: "спочатку"
        options:
          - спочатку
          - пізніше
          - після цього
        explanation: "The waking time comes before breakfast. Спочатку fits this order; пізніше and після цього would reverse it."
      - sentence: "О восьмій ранку я сідаю за стіл із тарілкою каші. Після вмивання я ___."
        answer: снідаю
        options:
          - снідаю
          - вечеряю
          - лягаю спати
        explanation: "A morning meal after washing fits снідаю. Вечеряю denotes the evening meal; лягаю спати does not fit sitting down with breakfast."
      - sentence: "З дев’ятої до п’ятої я в офісі. Увесь цей час я ___."
        answer: працюю
        options:
          - працюю
          - прокидаюся
          - снідаю
        explanation: "The full office workday fits працюю. Прокидаюся is waking, not an eight-hour activity; снідаю is a morning meal, not the whole workday."
      - sentence: "Зараз перша година дня. Я сиджу за столом із тарілкою супу. Я ___."
        answer: обідаю
        options:
          - обідаю
          - вечеряю
          - прокидаюся
        explanation: "The midday meal fits обідаю. Вечеряю denotes the evening meal, and прокидаюся is incompatible with already sitting and eating the meal."
      - sentence: "Я працюю до п’ятої, а ___ я читаю книгу о шостій."
        answer: "потім"
        options:
          - потім
          - перед цим
          - до цього
        explanation: "The second action has a later clock time. Потім or після цього puts it after the first action; перед цим and до цього would reverse the order."
      - sentence: "Я читаю книгу до одинадцятої, а ___ я лягаю спати о дванадцятій."
        answer: "нарешті"
        options:
          - нарешті
          - спочатку
          - перед цим
        explanation: "Нарешті marks the last step after the previous activity. Спочатку and перед цим would put this later clock time before it."
  - id: act-3
    type: fill-in
    title: Частина доби
    instruction: Обери правильну частину доби для речення.
    items:
      - sentence: "На годиннику 07:00. Я п'ю каву ___."
        answer: вранці
        options:
          - вранці
          - вночі
          - ввечері
        explanation: "07:00 is morning: вранці. Вночі and ввечері refer to other parts of the day."
      - sentence: "На годиннику 20:00. Ми вечеряємо ___."
        answer: ввечері
        options:
          - ввечері
          - вранці
          - вдень
        explanation: "20:00 is evening: ввечері. Вранці and вдень refer to other parts of the day."
      - sentence: "(09:00-17:00.) Вона працює з дев'ятої до п'ятої ___."
        answer: вдень
        options:
          - вдень
          - вночі
          - вранці
        explanation: Робочий день з дев'ятої до п'ятої - це вдень.
      - sentence: "Я обідаю о першій. Зараз друга година дня. Вони гуляють у парку ___."
        answer: після обіду
        options:
          - після обіду
          - вночі
          - вранці
        explanation: "Lunch has ended and it is two in the afternoon: після обіду. Вночі and вранці do not fit that time."
  - id: act-4
    type: fill-in
    title: Типові пари у розпорядку дня
    instruction: Обери нормативну українську форму.
    items:
      - sentence: 'Вранці я ___.'
        answer: беру душ
        options:
          - беру душ
          - бере душ
        explanation: "With я, use беру. Бере is the third-person form."
      - sentence: 'Коли я хворий, я ___.'
        answer: "п'ю ліки"
        options:
          - п'ю ліки
          - п'є ліки
        explanation: "With я, use п'ю. П'є goes with він or вона."
      - sentence: '___ зараз? — Восьма.'
        answer: Котра година
        options:
          - Котра година
          - Який час
        explanation: Для запитання про годинник уживаємо Котра година?
      - sentence: '___ в парк після обіду!'
        answer: Ходімо
        options:
          - Ходімо
          - Давайте підемо
        explanation: Ходімо! подається як готовий чанк-запрошення.
      - sentence: 'О восьмій годині я їм ___.'
        answer: сніданок
        options:
          - сніданок
          - завтрак
        explanation: Українське слово - сніданок.
      - sentence: 'Мама готує дуже ___ обід.'
        answer: смачний
        options:
          - смачний
          - вкусний
        explanation: Українське слово - смачний.
      - sentence: 'Ввечері я хочу ___.'
        answer: поїсти
        options:
          - поїсти
          - поїла
        explanation: "After хочу, use the infinitive поїсти. Поїла is a feminine past-tense form."
      - sentence: 'О сьомій я ___ і встав.'
        answer: прокинувся
        options:
          - прокинувся
          - прокинулася
        explanation: "Встав is masculine past, so pair it with прокинувся. Прокинулася is feminine."
