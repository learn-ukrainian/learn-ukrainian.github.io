inline:
  - id: act-1
    type: match-up
    title: Cafe line to function
    instruction: Match each cafe phrase with what it does.
    pairs:
      - left: 'Рахунок, будь ласка.'
        right: 'ask for the bill'
      - left: 'Що ви рекомендуєте?'
        right: 'ask for a recommendation'
      - left: 'Мені борщ, будь ласка.'
        right: 'order food'
      - left: 'Скільки коштує?'
        right: 'ask the price'
      - left: 'Можна карткою?'
        right: 'ask to pay by card'
      - left: 'Дуже смачно!'
        right: 'praise the food'
      - left: 'Тут вільно?'
        right: 'ask about a free seat'
      - left: 'Вам тут чи із собою?'
        right: 'ask about format'
      - left: 'Велику каву, будь ласка.'
        right: 'order a size phrase'
  - id: act-2
    type: fill-in
    title: Order with мені
    instruction: Choose the form that completes the cafe order.
    items:
      - sentence: 'Мені ___, будь ласка.'
        answer: 'каву'
        options:
          - 'каву'
          - 'кава'
          - 'каві'
        explanation: 'Кава becomes каву in an order.'
      - sentence: 'Мені ___, будь ласка.'
        answer: 'воду'
        options:
          - 'воду'
          - 'вода'
          - 'водою'
        explanation: 'Вода becomes воду.'
      - sentence: "Мені цей ___, будь ласка."
        answer: 'борщ'
        options:
          - 'борщ'
          - 'борщу'
          - 'борщем'
        explanation: "Цей requires a matching masculine inanimate accusative/nominative-shaped noun: борщ. Борщу and борщем do not agree in case with цей here."
      - sentence: "Мені цей ___, будь ласка."
        answer: 'салат'
        options:
          - 'салат'
          - 'салату'
          - 'салатом'
        explanation: "Цей selects the matching singular masculine object салат. Салату is oblique and салатом is instrumental; neither agrees with цей."
      - sentence: "Дайте, будь ласка, цей ___."
        answer: 'чай'
        options:
          - 'чай'
          - 'чаю'
          - 'чаєм'
        explanation: "Цей identifies a whole singular masculine object, selecting чай. Чаю and чаєм do not agree with цей here."
      - sentence: 'Я буду ___.'
        answer: 'піцу'
        options:
          - 'піцу'
          - 'піца'
          - 'піці'
        explanation: 'Піца becomes піцу.'
      - sentence: "Можна цей ___?"
        answer: 'хліб'
        options:
          - 'хліб'
          - 'хліба'
          - 'хлібом'
        explanation: "Цей selects хліб as the specific singular masculine object. Хліба and хлібом do not agree with цей."
      - sentence: "Мені цю ___ із собою, будь ласка."
        answer: 'маленьку каву'
        options:
          - 'маленьку каву'
          - 'маленька кава'
          - 'маленької кави'
        explanation: "Цю requires feminine accusative маленьку каву. Маленька кава is nominative and маленької кави is genitive, so neither agrees with цю."
  - id: act-3
    type: quiz
    title: What do you say?
    instruction: Choose the line that fits the cafe situation.
    items:
      - prompt: 'You want to order coffee.'
        options:
          - text: 'Мені каву, будь ласка.'
            correct: true
          - text: 'Рахунок, будь ласка.'
            correct: false
          - text: 'Що ви рекомендуєте?'
            correct: false
        explanation: 'Мені каву, будь ласка is an order.'
      - prompt: 'You want to pay.'
        options:
          - text: 'Рахунок, будь ласка.'
            correct: true
          - text: 'Можна меню?'
            correct: false
          - text: 'Це гостре?'
            correct: false
        explanation: 'Ask for the bill with рахунок.'
      - prompt: 'You want to know the price.'
        options:
          - text: 'Скільки коштує?'
            correct: true
          - text: "Це з м'ясом?"
            correct: false
          - text: 'Тут вільно?'
            correct: false
        explanation: 'Скільки коштує? asks how much it costs.'
      - prompt: 'You want a recommendation.'
        options:
          - text: 'Що ви рекомендуєте?'
            correct: true
          - text: 'Є вегетаріанське меню?'
            correct: false
          - text: 'Все було дуже смачно!'
            correct: false
        explanation: 'Рекомендуєте asks the server to recommend.'
      - prompt: 'You want to praise the food.'
        options:
          - text: 'Все було дуже смачно!'
            correct: true
          - text: 'Можна карткою?'
            correct: false
          - text: 'Без цукру.'
            correct: false
        explanation: 'This is the praise line after eating.'
      - prompt: 'You want to know whether a seat is free.'
        options:
          - text: 'Тут вільно?'
            correct: true
          - text: 'Ще одну каву, будь ласка.'
            correct: false
          - text: 'Рахунок, будь ласка.'
            correct: false
        explanation: 'Тут вільно? asks if the place is free.'
      - prompt: 'You want to know whether a dish is spicy.'
        options:
          - text: 'Це гостре?'
            correct: true
          - text: "Це з м'ясом?"
            correct: false
          - text: 'Скільки коштує?'
            correct: false
        explanation: 'Гостре means spicy here.'
      - prompt: 'You want to pay by card.'
        options:
          - text: 'Можна карткою?'
            correct: true
          - text: 'Є вегетаріанське меню?'
            correct: false
          - text: 'Що ви рекомендуєте?'
            correct: false
        explanation: 'Карткою is the card-payment phrase.'
  - id: act-4
    type: fill-in
    title: Complete the cafe dialogue
    instruction: Choose the word or phrase that fits the dialogue.
    items:
      - sentence: "Гість: Я щойно сів за стіл і хочу вибрати страву. Офіціант: Добрий день! Ось ___."
        answer: 'меню'
        options:
          - меню
          - рахунок
          - карткою
        explanation: "The guest has not chosen a dish, so меню supplies the choices. Рахунок is a bill after an order, rather than dish choices; instrumental карткою cannot be the subject of ось."
      - sentence: 'Дякую. Що ви ___?'
        answer: 'рекомендуєте'
        options:
          - 'рекомендуєте'
          - 'коштуєте'
          - 'платите'
        explanation: 'Що ви рекомендуєте? asks for advice.'
      - sentence: 'Борщ дуже ___.'
        answer: 'смачний'
        options:
          - 'смачний'
          - 'вільний'
          - 'картковий'
        explanation: 'Борщ is described as tasty.'
      - sentence: 'Добре, ___ борщ і хліб, будь ласка.'
        answer: 'мені'
        options:
          - 'мені'
          - 'я'
          - 'мене'
        explanation: 'Мені begins the order frame.'
      - sentence: 'А що будете ___?'
        answer: 'пити'
        options:
          - 'пити'
          - 'читати'
          - 'платити'
        explanation: 'The server asks what you will drink.'
      - sentence: "Офіціант: Добре, одну ___. Суп уже готовий, зараз принесу."
        answer: 'хвилинку'
        options:
          - 'хвилинку'
          - 'годину'
          - 'картку'
        explanation: "The food is ready and will be brought now, so the short wait одну хвилинку fits. Одну годину contradicts the immediate-ready context; одну картку is not a waiting interval."
workbook:
  - type: true-false
    title: Cafe culture checks
    instruction: Decide whether each statement fits the module.
    items:
      - statement: 'Рахунок, будь ласка asks for the bill.'
        answer: true
        explanation: 'Рахунок is the bill.'
      - statement: 'Вам тут чи із собою? asks whether the order is for here or to go.'
        answer: true
        explanation: 'Тут and із собою are the format answers.'
      - statement: 'Велику каву is taught here as an adjective table.'
        answer: false
        explanation: 'It is taught as one cafe phrase.'
      - statement: 'Кава на винос is the course form.'
        answer: false
        explanation: 'Use кава із собою.'
      - statement: 'Можна карткою? asks whether card payment is possible.'
        answer: true
        explanation: 'Карткою is the card-payment phrase.'
      - statement: 'Дуже смачно було! is a food praise line.'
        answer: true
        explanation: 'Use it after the meal.'
      - statement: 'Пірожене is the course word for pastry.'
        answer: false
        explanation: 'Use тістечко.'
      - statement: 'Перепрошую is a polite way to get attention.'
        answer: true
        explanation: 'It is a neutral service-scene attention getter.'
  - type: fill-in
    title: One cafe visit
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - sentence: Добрий ___! Можна меню?
        answer: день
        options:
          - день
          - дня
          - днем
        explanation: Добрий agrees with день in this greeting.
      - sentence: Що ви ___?
        answer: рекомендуєте
        options:
          - рекомендуєте
          - рекомендує
          - рекомендую
        explanation: Ви takes рекомендуєте.
      - sentence: ___ борщ і хліб, будь ласка.
        answer: Мені
        options:
          - Мені
          - Я
          - Мною
        explanation: Мені introduces the request.
      - sentence: А мені цю ___ із собою.
        answer: маленьку каву
        options:
          - маленьку каву
          - маленька кава
          - маленької кави
        explanation: Цю takes matching feminine accusative маленьку каву.
      - sentence: Я поїв і хочу розрахуватися. Дайте, будь ласка, цей ___.
        answer: рахунок
        options:
          - рахунок
          - рахунку
          - рахунком
        explanation: Цей takes the matching object рахунок.
      - sentence: Я хочу заплатити карткою. Можна ___?
        answer: карткою
        options:
          - карткою
          - картка
          - картки
        explanation: Карткою expresses the payment method.
      - sentence: Дякую, усе було дуже ___!
        answer: смачно
        options:
          - смачно
          - смачний
          - смачна
        explanation: Смачно fits the impersonal food-praise line.
      - sentence: До ___!
        answer: побачення
        options:
          - побачення
          - побаченню
          - побаченням
        explanation: До takes the genitive form побачення.
  - type: group-sort
    title: Cafe shelves
    instruction: Sort each phrase by its cafe job.
    groups:
      - name: Greeting or attention
        items:
          - Добрий день!
          - Доброго ранку!
          - Перепрошую.
      - name: Ordering
        items:
          - Мені каву, будь ласка.
          - Дайте, будь ласка, борщ.
          - Велику каву із собою.
      - name: Questions about food or price
        items:
          - Що ви рекомендуєте?
          - Скільки коштує?
          - Це гостре?
      - name: Payment or closing
        items:
          - Рахунок, будь ласка.
          - Можна карткою?
          - До побачення!
  - type: match-up
    title: Cafe repair pairs
    instruction: Match the repair form with the course cafe form.
    pairs:
      - left: счет
        right: рахунок
      - left: Мені кава із собою.
        right: Мені каву із собою.
      - left: пірожене
        right: тістечко
      - left: Дайте цей пакетиком.
        right: Дайте цей пакетик.
      - left: вкусна кава
        right: смачна кава
      - left: Можна цю соломинкою?
        right: Можна цю соломинку?
      - left: чашку кофе
        right: чашку кави
  - type: fill-in
    title: Build cafe lines
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - answer: каву
        sentence: Мені ___, будь ласка.
        options:
          - каву
          - кава
          - каві
        explanation: Use the request object каву.
      - answer: борщ
        sentence: Дайте, будь ласка, цей ___.
        options:
          - борщ
          - борщу
          - борщем
        explanation: Цей takes the matching masculine object борщ.
      - answer: воду
        sentence: Можна цю ___?
        options:
          - воду
          - вода
          - воді
        explanation: Цю takes matching feminine singular воду.
      - answer: велику каву
        sentence: Цю ___ із собою, будь ласка.
        options:
          - велику каву
          - велика кава
          - великою кавою
        explanation: Цю takes matching feminine accusative велику каву.
      - answer: рахунок
        sentence: Дайте, будь ласка, цей ___.
        options:
          - рахунок
          - рахунку
          - рахунком
        explanation: Цей takes the matching masculine object рахунок.
      - answer: карткою
        sentence: Я хочу заплатити карткою. Можна ___?
        options:
          - карткою
          - картка
          - картки
        explanation: Карткою expresses the payment method.
  - type: error-correction
    title: Repair cafe interference
    instruction: Choose the clean Ukrainian repair.
    anchor_id: repair-at-the-cafe-interference
    items:
      - sentence: Мені кава, будь ласка.
        error: кава
        answer: Мені каву, будь ласка.
        options:
          - Мені каву, будь ласка.
          - Мені кава, будь ласка.
          - Мені каві, будь ласка.
        explanation: Кава becomes каву in this order frame.
      - sentence: Можна цей рахунком?
        error: рахунком
        answer: Можна цей рахунок?
        options:
          - Можна цей рахунок?
          - Можна цей рахунком?
          - Можна цей рахунка?
        explanation: Цей takes the matching masculine object рахунок.
      - sentence: Мені кава із собою.
        error: кава
        answer: Мені каву із собою.
        options:
          - Мені каву із собою.
          - Мені кава із собою.
          - Мені каві із собою.
        explanation: Мені takes the request object каву.
      - sentence: Дайте пірожене.
        error: пірожене
        answer: Дайте тістечко.
        options:
          - Дайте тістечко.
          - Дайте пірожене.
          - Дайте тісто.
        explanation: Use тістечко.
      - sentence: Дайте цей пакетиком.
        error: пакетиком
        answer: Дайте цей пакетик.
        options:
          - Дайте цей пакетик.
          - Дайте цей пакетиком.
          - Дайте цей пакетика.
        explanation: Цей takes the matching masculine object пакетик.
      - sentence: Кава вкусна.
        error: вкусна
        answer: Кава смачна.
        options:
          - Кава смачна.
          - Кава вкусна.
          - Кава смачно.
        explanation: Use смачна with кава.
      - sentence: Можна цю соломинкою?
        error: соломинкою
        answer: Можна цю соломинку?
        options:
          - Можна цю соломинку?
          - Можна цю соломинкою?
          - Можна цю соломинка?
        explanation: Цю takes the matching feminine object соломинку.
      - sentence: Одну чашку кофе, будь ласка.
        error: кофе
        answer: Одну чашку кави, будь ласка.
        options:
          - Одну чашку кави, будь ласка.
          - Одну чашку кофе, будь ласка.
          - Одну чашка кави, будь ласка.
        explanation: Use кави in чашку кави.
