inline:
  - id: act-1
    type: quiz
    title: Де or куди?
    instruction: Choose the question that matches the sentence.
    items:
      - prompt: Я йду в банк.
        options:
          - text: Куди?
            correct: true
          - text: Де?
            correct: false
          - text: Хто?
            correct: false
        explanation: В банк gives the destination and answers куди?. The movement verb alone does not determine the place question.
      - prompt: Оксана на пошті.
        options:
          - text: Де?
            correct: true
          - text: Куди?
            correct: false
          - text: Коли?
            correct: false
        explanation: На пошті is a static location.
      - prompt: Ми їдемо у Львів.
        options:
          - text: Куди?
            correct: true
          - text: Де?
            correct: false
          - text: Що?
            correct: false
        explanation: У Львів gives the destination and answers куди?. Їдемо describes travel by transport.
      - prompt: Книжка на столі.
        options:
          - text: Де?
            correct: true
          - text: Куди?
            correct: false
          - text: Звідки?
            correct: false
        explanation: На столі answers where the book is.
      - prompt: Марко їде на вокзал.
        options:
          - text: Куди?
            correct: true
          - text: Де?
            correct: false
          - text: Який?
            correct: false
        explanation: Їде на вокзал is movement toward a place.
      - prompt: Я працюю в офісі.
        options:
          - text: Де?
            correct: true
          - text: Куди?
            correct: false
          - text: Коли?
            correct: false
        explanation: Працюю shows a static place.
      - prompt: Олена йде в аптеку.
        options:
          - text: Куди?
            correct: true
          - text: Де?
            correct: false
          - text: Хто?
            correct: false
        explanation: Йде в аптеку is movement toward a place.
      - prompt: Степан на роботі.
        options:
          - text: Де?
            correct: true
          - text: Куди?
            correct: false
          - text: Що?
            correct: false
        explanation: На роботі answers де?
  - id: act-2
    type: fill-in
    title: Static and direction phrases
    instruction: Complete each sentence with the correct place phrase.
    items:
      - sentence: "Вони йдуть ___ банк."
        answer: 'у'
        options:
          - 'у'
          - 'на'
          - 'до'
        explanation: 'The direction phrase is у банк.'
      - sentence: 'Олена йде ___ роботу.'
        answer: 'на'
        options:
          - 'на'
          - 'в'
          - 'біля'
        explanation: 'Use на роботу for going to work.'
      - sentence: 'Ми йдемо в ___.'
        answer: 'аптеку'
        options:
          - 'аптеку'
          - 'аптеці'
          - 'аптека'
        explanation: 'Куди? changes аптека to аптеку.'
      - sentence: "Вони йдуть у ___."
        answer: 'бібліотеку'
        options:
          - 'бібліотеку'
          - 'бібліотеці'
          - 'бібліотека'
        explanation: 'Куди? uses у бібліотеку.'
      - sentence: 'Я їду ___ вокзал.'
        answer: 'на'
        options:
          - 'на'
          - "до"
          - "біля"
        explanation: 'The route phrase is на вокзал.'
      - sentence: 'Марко йде ___ зупинку.'
        answer: 'на'
        options:
          - 'на'
          - 'в'
          - 'біля'
        explanation: 'Use на зупинку for going to a stop.'
      - sentence: 'Він у ___.'
        answer: 'банку'
        options:
          - 'банку'
          - 'банк'
          - 'банком'
        explanation: 'Де? uses the static phrase у банку.'
      - sentence: 'Оксана на ___.'
        answer: 'пошті'
        options:
          - 'пошті'
          - 'пошту'
          - 'пошта'
        explanation: 'Де? uses на пошті.'
      - sentence: 'Вона їде в ___.'
        answer: 'Одесу'
        options:
          - 'Одесу'
          - 'Одесі'
          - 'Одеса'
        explanation: 'Куди? changes Одеса to Одесу.'
      - sentence: 'Я працюю на ___.'
        answer: 'роботі'
        options:
          - 'роботі'
          - 'роботу'
          - 'робота'
        explanation: 'Працюю answers де?, so use на роботі.'
  - id: act-3
    type: group-sort
    title: Де? or куди? shelves
    instruction: Sort each phrase into static location or direction.
    groups:
      - name: 'Static де?'
        items:
          - 'у школі'
          - 'на роботі'
          - 'у банку'
          - 'в аптеці'
          - 'в Одесі'
      - name: 'Direction куди?'
        items:
          - 'у школу'
          - 'на роботу'
          - 'у банк'
          - 'в аптеку'
          - 'в Одесу'
  - id: act-4
    type: quiz
    title: Іти or їхати?
    instruction: Choose the movement verb that fits the sentence.
    items:
      - prompt: 'I am going to the shop on foot.'
        options:
          - text: 'Я йду в магазин.'
            correct: true
          - text: 'Я їду в магазин.'
            correct: false
          - text: 'Я в магазині.'
            correct: false
        explanation: 'On foot uses йду.'
      - prompt: 'We are going to the station by bus.'
        options:
          - text: 'Ми їдемо на вокзал.'
            correct: true
          - text: 'Ми йдемо на вокзал.'
            correct: false
          - text: 'Ми на вокзалі.'
            correct: false
        explanation: 'By bus uses їдемо.'
      - prompt: 'Oksana is going to Lviv by train.'
        options:
          - text: 'Оксана їде у Львів.'
            correct: true
          - text: 'Оксана йде у Львів.'
            correct: false
          - text: 'Оксана у Львові.'
            correct: false
        explanation: 'By train uses їде.'
      - prompt: 'Stepan is walking to the post office.'
        options:
          - text: "Степан іде на пошту."
            correct: true
          - text: 'Степан їде на пошту.'
            correct: false
          - text: 'Степан на пошті.'
            correct: false
        explanation: "Walking uses іде here. After the consonant in Степан, choose the euphonic іде form."
      - prompt: 'They are going to the park on foot.'
        options:
          - text: 'Вони йдуть у парк.'
            correct: true
          - text: 'Вони їдуть у парк.'
            correct: false
          - text: 'Вони в парку.'
            correct: false
        explanation: 'On foot uses йдуть.'
      - prompt: 'I am going to Odesa by train.'
        options:
          - text: 'Я їду в Одесу.'
            correct: true
          - text: 'Я йду в Одесу.'
            correct: false
          - text: 'Я в Одесі.'
            correct: false
        explanation: 'By train uses їду.'
workbook:
  - type: true-false
    title: Movement guardrails
    instruction: Decide whether the statement fits the lesson.
    items:
      - statement: 'Іти usually means going on foot.'
        answer: true
        explanation: 'Use іти for walking or general movement.'
      - statement: 'Їхати usually means going by transport.'
        answer: true
        explanation: 'Use їхати when a vehicle is part of the idea.'
      - statement: 'Я йду у школу answers куди?'
        answer: true
        explanation: 'It is movement toward school.'
      - statement: 'Я в школі answers куди?'
        answer: false
        explanation: 'Я в школі answers де?'
      - statement: 'Додому can answer куди?'
        answer: true
        explanation: 'Я повертаюся додому answers where to.'
      - statement: 'Kyiv is the Ukrainian English form for Київ.'
        answer: true
        explanation: 'Use Київ / Kyiv.'
  - type: fill-in
    title: Saturday errands
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - sentence: — Куди ти йдеш спочатку? — Спочатку я йду в ___.
        answer: банк
        options:
          - банк
          - банку
          - банком
        explanation: 'Куди requests a destination: в банк.'
      - sentence: — Куди ти йдеш потім? — Потім я йду на ___.
        answer: пошту
        options:
          - пошту
          - пошті
          - пошта
        explanation: 'Куди requests a destination: на пошту.'
      - sentence: — Куди ти йдеш після цього? — Після цього йду в ___.
        answer: аптеку
        options:
          - аптеку
          - аптеці
          - аптека
        explanation: 'Куди requests a destination: в аптеку.'
      - sentence: — Куди ти їдеш потім? — Потім їду на ___.
        answer: вокзал
        options:
          - вокзал
          - вокзалі
          - вокзалом
        explanation: 'Куди requests a destination: на вокзал.'
      - sentence: — Куди ти йдеш увечері? — Увечері йду ___ кафе.
        answer: в
        options:
          - в
          - із
          - без
        explanation: В кафе gives the destination requested by куди; із кафе gives an origin.
      - sentence: — Куди ти повертаєшся нарешті? — Нарешті повертаюся ___.
        answer: додому
        options:
          - додому
          - вдома
          - з дому
        explanation: Додому answers куди; вдома gives location and з дому gives origin.
  - type: odd-one-out
    title: Find the wrong route
    instruction: Choose the phrase that does not fit the pattern.
    items:
      - words:
          - 'у школу'
          - 'на роботу'
          - 'в аптеку'
          - 'у школі'
        answer: 'у школі'
        explanation: 'The first three answer куди?; у школі answers де?'
      - words:
          - 'у банку'
          - 'на роботі'
          - 'в аптеці'
          - 'в аптеку'
        answer: 'в аптеку'
        explanation: 'В аптеку is direction; the others are static locations.'
      - words:
          - 'на пошту'
          - 'на роботу'
          - 'на вокзал'
          - 'на бібліотеку'
        answer: 'на бібліотеку'
        explanation: 'Бібліотека uses у/в бібліотеку for direction.'
      - words:
          - 'в Київ'
          - 'у Львів'
          - 'в Одесу'
          - 'у Києві'
        answer: 'у Києві'
        explanation: 'У Києві is static; the others are directions.'
  - type: error-correction
    title: Repair where-to interference
    instruction: Choose the natural Ukrainian sentence.
    items:
      - sentence: — Куди ти йдеш? — Я йду в школі.
        error: школі
        correction: — Куди ти йдеш? — Я йду в школу.
        options:
          - — Куди ти йдеш? — Я йду в школу.
          - — Куди ти йдеш? — Я йду в школі.
          - — Куди ти йдеш? — Я йду школа.
        explanation: The question куди? requests a destination. A locative phrase can describe where movement happens, but it does not answer this destination question.
      - sentence: Я живу Київ.
        error: Київ
        correction: Я живу в Києві. (або у Києві)
        options:
          - Я живу в Києві. (або у Києві)
          - Я живу Київ.
          - Я живу до Києва.
        explanation: Жити answers де? and needs в/у plus locative.
      - sentence: — Куди ти йдеш? — Я йду в бібліотеці.
        error: бібліотеці
        correction: — Куди ти йдеш? — Я йду в бібліотеку.
        options:
          - — Куди ти йдеш? — Я йду в бібліотеку.
          - — Куди ти йдеш? — Я йду в бібліотеці.
          - — Куди ти йдеш? — Я йду бібліотека.
        explanation: The question куди? requests a destination. A locative phrase can describe where movement happens, but it does not answer this destination question.
      - sentence: Ми були в концерті.
        error: в
        correction: Ми були на концерті.
        options:
          - Ми були на концерті.
          - Ми були в концерті.
          - Ми були до концерту.
        explanation: The familiar event phrase is на концерті.
      - sentence: Книжка на столу.
        error: столу
        correction: Книжка на столі.
        options:
          - Книжка на столі.
          - Книжка на столу.
          - Книжка в стіл.
        explanation: Static surface location uses на столі.
      - sentence: Аптека — в аптекі.
        error: аптекі
        correction: Аптека — в аптеці.
        options:
          - Аптека — в аптеці.
          - Аптека — в аптекі.
          - Аптека — в аптеку.
        explanation: Аптека changes to в аптеці for де?
