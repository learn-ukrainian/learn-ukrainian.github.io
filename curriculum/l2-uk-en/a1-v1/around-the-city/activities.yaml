inline:
  - id: act-1
    type: fill-in
    title: Direction words
    instruction: Complete each direction line.
    items:
      - sentence: "Музей перед вами, а не ліворуч чи праворуч. Ідіть ___, до музею."
        answer: 'прямо'
        options:
          - прямо
          - наліво
          - направо
        explanation: "The museum is directly ahead, rather than to either side. Прямо follows that route; наліво and направо lead away from the stated position."
      - sentence: 'Вибачте, як ___ до музею?'
        answer: 'дістатися'
        options:
          - 'дістатися'
          - 'вдома'
          - 'живу'
        explanation: 'Як дістатися до...? asks how to get to a place.'
      - sentence: "Аптека близько. Ідіть прямо п'ять ___."
        answer: 'хвилин'
        options:
          - 'хвилин'
          - 'район'
          - 'центр'
        explanation: "П'ять хвилин пішки is a route phrase."
      - sentence: "Школа праворуч від вас. На перехресті йдіть ___, до школи."
        answer: 'направо'
        options:
          - направо
          - наліво
          - назад
        explanation: "The school is on the right. Направо gives movement toward it; наліво and назад give other directions."
      - sentence: 'Йдіть прямо, а потім ___.'
        answer: 'наліво'
        options:
          - 'наліво'
          - 'центр'
          - 'зупинка'
        explanation: 'Наліво means to the left.'
      - sentence: 'Ресторан поруч. Ідіть прямо і ___.'
        answer: 'направо'
        options:
          - 'направо'
          - 'район'
          - 'куди'
        explanation: 'Use a direction word after і.'
  - id: act-2
    type: quiz
    title: Де or куди in context
    instruction: Choose the phrase that fits the sentence.
    items:
      - prompt: Я зараз...
        options:
          - text: в парку
            correct: true
          - text: в парк
            correct: false
          - text: до парку
            correct: false
        explanation: Зараз asks де?
      - prompt: — Куди ти йдеш? — Я йду...
        options:
          - text: в магазин
            correct: true
          - text: в магазині
            correct: false
          - text: на магазині
            correct: false
        explanation: Куди requests a destination. В магазин answers it; both в магазині and на магазині are locative phrases and do not give that destination.
      - prompt: Магазин на...
        options:
          - text: вулиці
            correct: true
          - text: вулицю
            correct: false
          - text: вулиця
            correct: false
        explanation: На вулиці answers де?
      - prompt: — Куди ти їдеш потім? — Потім їду на...
        options:
          - text: роботу
            correct: true
          - text: роботі
            correct: false
          - text: робота
            correct: false
        explanation: Куди requests a destination. На роботу answers it. Роботі is a locative form here; робота is the dictionary form of the work noun.
      - prompt: Ми зараз у...
        options:
          - text: центрі
            correct: true
          - text: центр
            correct: false
          - text: центру
            correct: false
        explanation: Зараз у центрі is static.
      - prompt: — Куди вона йде? — Вона йде в...
        options:
          - text: офіс
            correct: true
          - text: офісі
            correct: false
          - text: офісу
            correct: false
        explanation: Куди requests a destination. В офіс answers it. Офісі and офісу cannot supply the requested accusative destination in this phrase.
  - id: act-3
    type: match-up
    title: City questions
    instruction: Match each question with a useful answer.
    pairs:
      - left: 'Вибачте, як дістатися до бібліотеки?'
        right: 'Ідіть прямо, потім направо.'
      - left: 'Де музей?'
        right: 'Він у центрі.'
      - left: 'Як ти дістаєшся на роботу?'
        right: 'Їду автобусом.'
      - left: 'Школа далеко?'
        right: "Ні, близько. П'ять хвилин пішки."
      - left: 'Куди ви йдете?'
        right: 'У магазин.'
      - left: 'Де ти живеш?'
        right: 'На вулиці Франка.'
  - id: act-4
    type: fill-in
    title: Daily city route
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - sentence: — Куди ти йдеш спочатку? — Спочатку я йду на ___.
        answer: зупинку
        options:
          - зупинку
          - зупинці
          - зупинка
        explanation: Куди requests the destination на зупинку.
      - sentence: Потім їду ___ до центру.
        answer: автобусом
        options:
          - автобусом
          - автобуса
          - автобусу
        explanation: Автобусом expresses the means of transport.
      - sentence: Після цього йду пішки п'ять ___.
        answer: хвилин
        options:
          - хвилин
          - хвилина
          - хвилиною
        explanation: П'ять takes хвилин.
      - sentence: Робота в офісі на ___.
        answer: площі
        options:
          - площі
          - площа
          - площею
        explanation: Use the place phrase на площі.
      - sentence: — Куди ти йдеш після роботи? — Після роботи йду в ___.
        answer: магазин
        options:
          - магазин
          - магазині
          - магазином
        explanation: Куди requests the destination в магазин.
      - sentence: — Куди ти повертаєшся потім? — Потім повертаюся ___.
        answer: додому
        options:
          - додому
          - вдома
          - з дому
        explanation: Додому answers the destination question.
  - id: act-5
    type: fill-in
    title: Close, far, or on the corner
    instruction: Complete each city location or route line.
    items:
      - sentence: "Я вдома. Аптека ___: вона на першому поверсі нашого будинку."
        answer: 'близько'
        options:
          - близько
          - далеко
          - їдьте
        explanation: "The pharmacy is in the speaker’s own building, so близько fits this scene. Далеко contradicts that location; їдьте is an imperative, not a location predicate."
      - sentence: "Я вдома, а вокзал за двадцять кілометрів від мого дому. Вокзал ___."
        answer: 'далеко'
        options:
          - далеко
          - поруч
          - їдьте
        explanation: "Twenty kilometres from home is the stated city-distance contrast: далеко fits; поруч does not. Їдьте is an imperative, not a predicate locating the station."
      - sentence: "Я вдома. Кафе ___. Воно біля мого дому."
        answer: 'поруч'
        options:
          - поруч
          - їдьте
          - далеко
        explanation: "The cafe is next to the speaker’s home and the speaker is at home, so поруч fits. Далеко contradicts that relation; їдьте is an imperative rather than a location predicate."
      - sentence: 'Бібліотека ___ розі.'
        answer: 'на'
        options:
          - 'на'
          - 'до'
          - 'автобусом'
        explanation: 'The phrase is на розі.'
      - sentence: "Банк перед вами, а не ліворуч чи праворуч. Ідіть ___, до банку."
        answer: 'прямо'
        options:
          - прямо
          - наліво
          - направо
        explanation: "The bank is directly ahead. Прямо follows the stated route; наліво and направо turn away from it."
      - sentence: 'Музей ___ центрі.'
        answer: 'у'
        options:
          - 'у'
          - 'до'
          - 'пішки'
        explanation: 'У центрі answers де?'
  - id: act-6
    type: quiz
    title: Which route question?
    instruction: Choose the question each phrase answers.
    items:
      - prompt: 'Я в парку.'
        options:
          - text: 'де?'
            correct: true
          - text: 'куди?'
            correct: false
          - text: 'як? / чим?'
            correct: false
        explanation: 'В парку is a static place.'
      - prompt: 'Я йду в парк.'
        options:
          - text: 'куди?'
            correct: true
          - text: 'де?'
            correct: false
          - text: 'як? / чим?'
            correct: false
        explanation: 'Йду в парк is movement.'
      - prompt: 'Їду автобусом.'
        options:
          - text: 'як? / чим?'
            correct: true
          - text: 'де?'
            correct: false
          - text: 'куди?'
            correct: false
        explanation: 'Автобусом tells how you travel.'
      - prompt: 'Бібліотека на розі.'
        options:
          - text: 'де?'
            correct: true
          - text: 'куди?'
            correct: false
          - text: 'як? / чим?'
            correct: false
        explanation: 'На розі is a static location.'
      - prompt: 'Їдьте на метро.'
        options:
          - text: 'як? / чим?'
            correct: true
          - text: 'де?'
            correct: false
          - text: 'куди?'
            correct: false
        explanation: 'На метро tells the transport method.'
      - prompt: 'Ідіть прямо, потім направо.'
        options:
          - text: 'що робити?'
            correct: true
          - text: 'де?'
            correct: false
          - text: 'звідки?'
            correct: false
        explanation: 'This is a route command.'
workbook:
  - type: group-sort
    title: City route shelves
    instruction: Sort each phrase by its route function.
    groups:
      - name: Where now
        items:
          - у парку
          - на площі
          - у центрі
          - на вулиці
      - name: Where to
        items:
          - в парк
          - на роботу
          - до бібліотеки
          - у магазин
      - name: How or how long
        items:
          - пішки
          - автобусом
          - на метро
          - п'ять хвилин
      - name: Direction commands
        items:
          - ідіть прямо
          - направо
          - наліво
          - їдьте
  - type: odd-one-out
    title: Find the city mismatch
    instruction: Choose the phrase that does not fit the pattern.
    items:
      - words:
          - 'в аптеці'
          - 'на площі'
          - 'у центрі'
          - 'в аптеку'
        answer: 'в аптеку'
        explanation: 'В аптеку answers куди?; the others answer де?'
      - words:
          - 'в магазин'
          - 'на роботу'
          - 'до бібліотеки'
          - 'на роботі'
        answer: 'на роботі'
        explanation: 'На роботі is static.'
      - words:
          - 'пішки'
          - 'автобусом'
          - 'на метро'
          - 'у центрі'
        answer: 'у центрі'
        explanation: 'У центрі answers де?; the others answer як? / чим?'
      - words:
          - 'ідіть прямо'
          - 'потім направо'
          - 'потім наліво'
          - 'аптека близько'
        answer: 'аптека близько'
        explanation: 'Аптека близько is a location sentence, not a command.'
  - type: true-false
    title: City route checks
    instruction: Decide whether the statement fits the city-route pattern.
    items:
      - statement: 'Я зараз у центрі answers де?'
        answer: true
        explanation: 'Зараз у центрі is a static place.'
      - statement: 'Я йду в магазині is the best direction sentence.'
        answer: false
        explanation: 'Use Я йду в магазин for куди?'
      - statement: 'Ідіть прямо is a polite route command.'
        answer: true
        explanation: 'It means go straight.'
      - statement: 'Їдьте на метро tells the transport method.'
        answer: true
        explanation: 'На метро is a fixed transport phrase.'
      - statement: 'До міста is the A1 route phrase after до.'
        answer: true
        explanation: 'Use the whole route phrase до міста.'
      - statement: '<!-- bad -->Остановка<!-- /bad --> is the course word for a transport stop.'
        answer: false
        explanation: 'Use зупинка.'
  - type: error-correction
    title: Repair city-route interference
    instruction: Choose the natural Ukrainian city sentence.
    items:
      - sentence: Я живу Київ.
        error: Київ
        correction: Я живу в Києві.
        options:
          - Я живу в Києві.
          - Я живу Київ.
          - Я живу до Києва.
        explanation: After живу, в Києві names where the speaker lives. Київ needs the locative form here; до Києва names a destination.
      - sentence: — Куди ти йдеш? — Я йду в магазині.
        error: магазині
        correction: — Куди ти йдеш? — Я йду в магазин.
        options:
          - — Куди ти йдеш? — Я йду в магазин.
          - — Куди ти йдеш? — Я йду в магазині.
          - — Куди ти йдеш? — Я йду магазин.
        explanation: The question куди? requests a destination. A locative phrase can describe where movement happens, but it does not answer this destination question.
      - sentence: Магазин на вулицю.
        error: вулицю
        correction: Магазин на вулиці.
        options:
          - Магазин на вулиці.
          - Магазин на вулицю.
          - Магазин до вулиці.
        explanation: Магазин is already there, so this answers де?
      - sentence: Я їду автобус до центру.
        error: автобус
        correction: Я їду автобусом до центру.
        options:
          - Я їду автобусом до центру.
          - Я їду автобус до центру.
          - Я їду на автобус до центрі.
        explanation: For means of travel, use автобусом.
      - sentence: Я живу у Одесі.
        error: у
        correction: Я живу в Одесі.
        options:
          - Я живу в Одесі.
          - Я живу у Одесі.
          - Я живу до Одеси.
        explanation: Use в before a vowel for милозвучність.
      - sentence: Я йду до місті.
        error: місті
        correction: Я йду до міста.
        options:
          - Я йду до міста.
          - Я йду до місті.
          - Я йду в місті.
        explanation: 'До takes genitive: міста.'
      - sentence: Як дістатися до бібліотека?
        error: бібліотека
        correction: Як дістатися до бібліотеки?
        options:
          - Як дістатися до бібліотеки?
          - Як дістатися до бібліотека?
          - Як дістатися в бібліотеці?
        explanation: Use the whole A1 route phrase до бібліотеки.
  - type: match-up
    title: Route question pairs
    instruction: Match each short city question with the answer type it needs.
    pairs:
      - left: 'Де аптека?'
        right: 'Аптека на розі.'
      - left: 'Куди ви йдете?'
        right: 'У парк.'
      - left: 'Як ти їдеш?'
        right: 'Автобусом.'
      - left: 'Як дістатися до музею?'
        right: 'Ідіть прямо.'
      - left: 'Вокзал далеко?'
        right: 'Так, їдьте на метро.'
      - left: 'Де ти живеш?'
        right: 'На вулиці Франка.'
  - type: fill-in
    title: Lviv walk route
    instruction: Choose the word or phrase that completes each independent line.
    items:
      - sentence: Ми на ___ Ринок.
        answer: площі
        options:
          - площі
          - площа
          - площею
        explanation: Use the place phrase на площі Ринок.
      - sentence: Ідемо прямо до ___.
        answer: театру
        options:
          - театру
          - театр
          - театром
        explanation: До takes the genitive form театру.
      - sentence: Театр праворуч від нас. Потім ідемо ___, до театру.
        answer: направо
        options:
          - направо
          - наліво
          - назад
        explanation: Направо follows the stated direction toward the theater on the right.
      - sentence: Парк ___. До нього лише дві хвилини пішки.
        answer: близько
        options:
          - близько
          - далеко
          - їдьте
        explanation: The stated short walk fits близько; їдьте is a command, not a location predicate.
      - sentence: Музей у ___.
        answer: центрі
        options:
          - центрі
          - центр
          - центром
        explanation: Use the place phrase у центрі.
      - sentence: — Куди ми повертаємося? — Повертаємося на ___.
        answer: площу
        options:
          - площу
          - площі
          - площа
        explanation: Куди requests the destination на площу.
