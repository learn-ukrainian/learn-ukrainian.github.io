inline:
  - id: act-1
    type: fill-in
    title: Build a dated plan
    instruction: Choose the word that completes the plan.
    items:
      - sentence: 'У ___ я буду працювати.'
        answer: 'понеділок'
        options:
          - 'понеділок'
          - 'третій'
          - 'шостій'
        explanation: 'У понеділок names the day.'
      - sentence: 'У суботу ___ я буду прибирати квартиру.'
        answer: 'зранку'
        options:
          - 'зранку'
          - 'о'
          - 'план'
        explanation: 'Зранку names the part of the day.'
      - sentence: '___ шостій ми будемо дивитися кіно.'
        answer: 'О'
        options:
          - 'О'
          - 'У'
          - 'На'
        explanation: 'Use о with clock time.'
      - sentence: 'У неділю він буде ___.'
        answer: 'відпочивати'
        options:
          - 'відпочивати'
          - 'відпочиває'
          - 'відпочивав'
        explanation: 'After буде, use the infinitive.'
      - sentence: "У п'ятницю ввечері буде ___."
        answer: 'вечірка'
        options:
          - 'вечірка'
          - "вечірку"
          - "вечіркою"
        explanation: "Вечірка is the nominative subject of буде. Вечірку is accusative and вечіркою instrumental."
  - id: act-2
    type: match-up
    title: Invitations and questions
    instruction: Match each invitation or question with its English meaning.
    pairs:
      - left: 'Ходімо в кіно!'
        right: 'Let''s go to the cinema!'
      - left: "Давай зустрінемося о п'ятій!"
        right: 'Let''s meet at five!'
      - left: 'Ти будеш вільний у суботу?'
        right: 'Will you be free on Saturday?'
      - left: 'Ходімо в кафе о шостій!'
        right: 'Let''s go to a cafe at six!'
      - left: 'Ти будеш на вечірці?'
        right: 'Will you be at the party?'
  - id: act-3
    type: quiz
    title: Planning pattern
    instruction: Choose the sentence that stays in the A1 planning pattern.
    items:
      - prompt: "— Що ти будеш робити наступної суботи? — ___"
        options:
          - text: 'У суботу о третій я буду готувати.'
            correct: true
          - text: 'У суботу о третій я готую вчора.'
            correct: false
          - text: 'У суботу о третій я готував.'
            correct: false
        explanation: "Буду готувати answers the future question. Готую вчора conflicts in time; готував answers about a past event."
      - prompt: "— У мене два квитки на фільм. — ___"
        options:
          - text: 'Ходімо в кіно!'
            correct: true
          - text: 'Я буду кіно.'
            correct: false
          - text: 'Кіно буде прибирати.'
            correct: false
        explanation: 'Ходімо is a familiar invitation phrase.'
      - prompt: "— Ходімо завтра о третій в кафе! — ___ О третій у мене іспит."
        options:
          - text: 'На жаль, не можу.'
            correct: true
          - text: 'З задоволенням!'
            correct: false
          - text: 'Звичайно буду!'
            correct: false
        explanation: 'На жаль, не можу is a polite refusal.'
      - prompt: "— ___ — Так, у суботу я не буду працювати."
        options:
          - text: 'Ти будеш вільна у суботу?'
            correct: true
          - text: 'Ти була вільна учора?'
            correct: false
          - text: 'Ти вільна о вчора?'
            correct: false
        explanation: 'Будеш вільна asks about future availability.'
  - id: act-4
    type: group-sort
    title: Sort planning phrases
    instruction: Put each phrase into the right planning group.
    groups:
      - name: 'days'
        items:
          - 'у понеділок'
          - 'у середу'
          - 'у суботу'
          - 'в неділю'
      - name: 'times'
        items:
          - 'о третій'
          - "о п'ятій"
          - 'о шостій'
          - 'ввечері'
      - name: 'invitations'
        items:
          - 'Ходімо в кіно!'
          - 'Давай зустрінемося!'
      - name: 'answers'
        items:
          - 'З задоволенням!'
          - 'На жаль, не можу.'
          - 'Звичайно буду!'
workbook:
  - type: true-false
    title: Check the weekly plan
    instruction: Decide whether each line is a clear A1 plan.
    items:
      - statement: 'У суботу я буду прибирати квартиру.'
        answer: true
        explanation: 'Буду + прибирати is correct.'
      - statement: 'У неділю ми будемо відпочивати.'
        answer: true
        explanation: 'Будемо + відпочивати is correct.'
      - statement: 'О шостій ви будете дивитеся кіно.'
        answer: false
        explanation: 'After будете, use дивитися.'
      - statement: "У п'ятницю ввечері буде вечірка."
        answer: true
        explanation: 'This is a clear scheduled event.'
      - statement: 'У середу я буду вчу українську.'
        answer: false
        explanation: 'After буду, use вчити.'
      - statement: 'Ти будеш вільний у суботу?'
        answer: true
        explanation: 'This asks about future availability.'
  - type: quiz
    title: Choose planning lines
    instruction: Choose the sentence whose words fit together.
    items:
      - prompt: Обери правильно побудоване речення.
        options:
          - text: У суботу я буду прибирати квартиру.
            correct: true
          - text: У суботу я будеш прибирати квартиру.
            correct: false
          - text: У суботу я будемо прибирати квартиру.
            correct: false
        explanation: The subject agrees with буду; будеш and будемо belong to different persons or numbers.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: О шостій ми будемо дивитися кіно.
            correct: true
          - text: О шостій ми буде дивитися кіно.
            correct: false
          - text: О шостій ми буду дивитися кіно.
            correct: false
        explanation: The subject agrees with будемо; буде and буду belong to different persons or numbers.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Ти будеш вільна у суботу?
            correct: true
          - text: Ти буду вільна у суботу?
            correct: false
          - text: Ти будуть вільна у суботу?
            correct: false
        explanation: The subject agrees with будеш; буду and будуть belong to different persons or numbers.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Давай зустрінемося о п'ятій!
            correct: true
          - text: Давай зустрінемося о п'ятого!
            correct: false
          - text: Давай зустрінемося о п'ятим!
            correct: false
        explanation: The construction takes п'ятій. The case forms п'ятого and п'ятим cannot replace it here.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: На жаль, не можу.
            correct: true
          - text: На жалю, не можу.
            correct: false
          - text: На жалем, не можу.
            correct: false
        explanation: The fixed introductory phrase is На жаль. Жалю and жалем cannot replace жаль in it.
  - type: order
    title: Put the week in order
    instruction: Arrange the days from Monday to Sunday.
    items:
      - 'У понеділок я буду працювати.'
      - 'У вівторок я буду вчити українську.'
      - 'У середу буде зустріч.'
      - 'У четвер я буду готувати.'
      - "У п'ятницю буде вечірка."
      - 'У суботу я буду прибирати.'
      - 'В неділю я буду відпочивати.'
    correct_order: [0, 1, 2, 3, 4, 5, 6]
  - type: fill-in
    title: Complete the week schedule
    instruction: Choose the future form or planning phrase.
    items:
      - sentence: "Наступного вівторка я ___ українську."
        answer: 'буду вчити'
        options:
          - 'буду вчити'
          - "будеш вчити"
          - "будемо вчити"
        explanation: "The subject я agrees with буду; будеш and будемо are other person/number forms. The infinitive remains unchanged."
      - sentence: "Наступної середи ми ___ вечерю."
        answer: 'будемо готувати'
        options:
          - 'будемо готувати'
          - "буде готувати"
          - "буду готувати"
        explanation: "The subject ми agrees with будемо; буде and буду are other person/number forms. The infinitive remains unchanged."
      - sentence: "Наступного четверга вона ___ допізна."
        answer: 'буде працювати'
        options:
          - 'буде працювати'
          - "будуть працювати"
          - "будемо працювати"
        explanation: "The subject вона agrees with буде; будуть and будемо are other person/number forms. The infinitive remains unchanged."
      - sentence: '___, не можу. У суботу я буду працювати.'
        answer: 'На жаль'
        options:
          - 'На жаль'
          - 'Мене'
          - 'Мою'
        explanation: 'На жаль, не можу is a polite refusal.'
  - type: translate
    title: Say your plans
    instruction: Choose the Ukrainian sentence that matches the English prompt.
    items:
      - source: 'On Saturday I will clean the apartment.'
        options:
          - text: 'У суботу я буду прибирати квартиру.'
            correct: true
          - text: 'У суботу я прибираю вчора.'
            correct: false
          - text: 'У суботу я прибирала учора.'
            correct: false
        explanation: 'Use буду прибирати for a future plan.'
      - source: 'At six we will watch a film.'
        options:
          - text: 'О шостій ми будемо дивитися кіно.'
            correct: true
          - text: 'О шостій ми дивилися кіно.'
            correct: false
          - text: 'О шостій ми дивимося учора.'
            correct: false
        explanation: 'Use о шостій + будемо дивитися.'
      - source: 'Will you be free on Saturday? (to a female friend)'
        options:
          - text: 'Ти будеш вільна у суботу?'
            correct: true
          - text: 'Ти була вільна у суботу?'
            correct: false
          - text: 'Ти буде вільна у суботу?'
            correct: false
        explanation: 'Ти takes будеш.'
      - source: 'Unfortunately, I cannot.'
        options:
          - text: 'На жаль, не можу.'
            correct: true
          - text: 'З задоволенням!'
            correct: false
          - text: 'Звичайно буду!'
            correct: false
        explanation: 'На жаль, не можу is the polite refusal.'
  - type: error-correction
    title: Repair plan sentences
    instruction: Keep pronouns and the intended day/time. Correct the form or preposition; use the compound future for plans.
    items:
      - sentence: 'У суботу я буду прибираю квартиру.'
        error: 'прибираю'
        correction: 'прибирати'
        explanation: 'After буду, use the infinitive прибирати.'
      - sentence: 'У неділю ми будемо відпочиваємо.'
        error: 'відпочиваємо'
        correction: 'відпочивати'
        explanation: 'After будемо, use відпочивати.'
      - sentence: 'О шостій ви будете дивитеся кіно.'
        error: 'дивитеся'
        correction: 'дивитися'
        explanation: 'After будете, use дивитися.'
      - sentence: 'Вони будуть готують на вечірку.'
        error: 'готують'
        correction: 'готувати'
        explanation: 'After будуть, use готувати.'
      - sentence: 'У середу я буду вчу українську.'
        error: 'вчу'
        correction: 'вчити'
        explanation: 'After буду, use вчити.'
      - sentence: 'Я буду роблю домашнє завдання.'
        error: 'роблю'
        correction: 'робити'
        explanation: 'After буду, use the infinitive робити.'
      - sentence: 'У понеділку я маю урок.'
        error: 'понеділку'
        correction: 'понеділок'
        explanation: 'The day-on-which expression uses у понеділок.'
      - sentence: 'На шостій ми будемо дивитися кіно.'
        error: 'На шостій'
        correction: 'О шостій'
        explanation: 'Use о with clock time: о шостій.'
