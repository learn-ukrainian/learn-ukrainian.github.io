---
inline:
  - id: act-1
    type: match-up
    title: 'Хобі: дієслово і слово'
    instruction: З'єднай дієслово з логічним словом або фразою.
    pairs:
      - left: грати
        right: у футбол
      - left: грати
        right: на гітарі
      - left: слухати
        right: музику
      - left: дивитися
        right: фільми
      - left: ходити
        right: в кіно
      - left: ходити
        right: в театр
      - left: читати
        right: книгу
      - left: малювати
        right: вдома
  - id: act-2
    type: fill-in
    title: Частота і запрошення
    instruction: Обери слово або фразу, які найкраще завершують речення.
    items:
      - sentence: "У неділю в офісі нікого немає. Я ___ працюю у неділю."
        answer: ніколи не
        options:
          - ніколи не
          - ніколи
          - ніякий
        explanation: "Use ніколи не with a negative verb: Я ніколи не працюю. Ніколи needs не here; ніякий does not fit this verb phrase."
      - sentence: 'Вона грає у теніс двічі ___.'
        answer: на тиждень
        options:
          - на тиждень
          - на тижнем
          - на тижнями
        explanation: "Двічі на тиждень means twice a week. На тиждень names the frequency period."
      - sentence: '— ___ в кіно у суботу! — Добре!'
        answer: Ходімо
        options:
          - Ходімо
          - Ходжу
          - Ходиш
        explanation: "Ходімо invites us to go together. Ходжу and ходиш describe who goes."
      - sentence: "Я люблю спорт, тому ___ граю у баскетбол."
        answer: часто
        options:
          - часто
          - частий
          - часта
        explanation: "Часто is an adverb that modifies граю. Частий and часта are adjectives."
      - sentence: "Я не маю часу, тому ___ читаю книги."
        answer: рідко
        options:
          - рідко
          - рідкий
          - рідка
        explanation: "Рідко modifies читаю. Рідкий and рідка are adjectives, so they cannot fill this gap."
      - sentence: '— Що ти робиш ___? — Відпочиваю.'
        answer: у вихідні
        options:
          - у вихідні
          - вихідні
          - у вихідних
        explanation: "У вихідні means on weekends. Here у takes the plural accusative вихідні."
  - id: act-3
    type: fill-in
    title: Прийменник у фразі
    instruction: Обери прийменник, який зберігає природну фразу.
    items:
      - sentence: 'Він грає ___ піаніно.'
        answer: на
        options:
          - на
          - у
          - в
        explanation: Для музичних інструментів уживаємо грати на.
      - sentence: 'Ми граємо ___ футбол.'
        answer: у
        options:
          - у
          - на
          - з
        explanation: Для спорту уживаємо грати у/в.
      - sentence: 'Я хочу ходити ___ концерт.'
        answer: на
        options:
          - на
          - в
          - у
        explanation: 'Природна фраза: ходити на концерт.'
      - sentence: "Ми ходимо ___ театр раз на місяць."
        answer: в
        options:
          - в
          - на
          - із
        explanation: "Ходимо ends in a vowel. Before the consonant т in театр, use в."
