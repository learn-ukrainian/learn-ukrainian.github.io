---
inline:
  - id: act-1
    type: match-up
    title: 'Хобі: українською й англійською'
    instruction: З’єднай українську фразу з її англійським перекладом. / Match each Ukrainian phrase with its English translation.
    pairs:
      - left: грати у футбол
        right: to play football
      - left: грати на гітарі
        right: to play the guitar
      - left: слухати музику
        right: to listen to music
      - left: дивитися фільми
        right: to watch films
      - left: ходити в кіно
        right: to go to the cinema
      - left: ходити в театр
        right: to go to the theatre
      - left: читати книгу
        right: to read a book
      - left: малювати вдома
        right: to draw at home
  - id: act-2
    type: fill-in
    title: Частота і запрошення
    instruction: Обери слово або фразу, які найкраще завершують речення.
    items:
      - sentence: Кожна неділя — вихідний. Я ___ працюю у неділю.
        answer: ніколи не
        options:
          - ніколи не
          - завжди
          - часто
        explanation: Every Sunday is a day off, so ніколи не fits. Завжди and часто would say there is regular Sunday work.
      - sentence: Вона грає у теніс двічі ___.
        answer: на тиждень
        options:
          - на тиждень
          - на тижнем
          - на тижнями
        explanation: Двічі на тиждень means twice a week. На тиждень names the frequency period.
      - sentence: — ___ в кіно у суботу! — Добре!
        answer: Ходімо
        options:
          - Ходімо
          - Ходжу
          - Ходиш
        explanation: Ходімо invites us to go together. Ходжу and ходиш describe who goes.
      - sentence: Я люблю спорт, тому ___ граю у баскетбол.
        answer: часто
        options:
          - часто
          - частий
          - часта
        explanation: Часто describes how frequently the action happens. Частий and часта do not complete this sentence.
      - sentence: Я не маю часу, тому ___ читаю книги.
        answer: рідко
        options:
          - рідко
          - рідкий
          - рідка
        explanation: Рідко describes how frequently the action happens. Рідкий and рідка do not complete this sentence.
      - sentence: — Що ти робиш ___? — Відпочиваю.
        answer: у вихідні
        options:
          - у вихідні
          - вихідні
          - у вихідних
        explanation: У вихідні means on weekends. Here у takes the plural accusative вихідні.
  - id: act-3
    type: fill-in
    title: Прийменник у фразі
    instruction: Обери прийменник, який зберігає природну фразу.
    items:
      - sentence: 'Він грає ___ піаніно.'
        answer: на
        options:
          - на
          - у
          - в
        explanation: Для музичних інструментів уживаємо грати на.
      - sentence: 'Ми граємо ___ футбол.'
        answer: у
        options:
          - у
          - на
          - з
        explanation: Для спорту уживаємо грати у/в.
      - sentence: 'Я хочу ходити ___ концерт.'
        answer: на
        options:
          - на
          - в
          - у
        explanation: 'Природна фраза: ходити на концерт.'
      - sentence: "Ми ходимо ___ театр раз на місяць."
        answer: в
        options:
          - в
          - на
          - із
        explanation: "Ходимо ends in a vowel. Before the consonant т in театр, use в."
