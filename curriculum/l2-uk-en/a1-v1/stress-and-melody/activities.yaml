inline:
  - id: act-1
    type: quiz
    title: Де на́голос
    instruction: Обери склад із позначеним на́голосом.
    items:
      - prompt: 'Читай: ка́ва. Де на́голос?'
        options:
          - text: перший склад
            correct: true
          - text: останній склад
            correct: false
          - text: немає наголосу
            correct: false
        explanation: У слові ка́ва на́голос на ка́.
      - prompt: 'Читай: вода́. Де на́голос?'
        options:
          - text: останній склад
            correct: true
          - text: перший склад
            correct: false
          - text: усі склади однакові
            correct: false
        explanation: У слові вода́ на́голос на да́.
      - prompt: 'Читай: столи́ця. Де на́голос?'
        options:
          - text: середній склад
            correct: true
          - text: перший склад
            correct: false
          - text: останній склад
            correct: false
        explanation: У слові столи́ця на́голос на ли́.
      - prompt: 'Молоко́: що робимо з ненаголошеними голосними?'
        options:
          - text: тримаємо кожен голосни́й чистим
            correct: true
          - text: пропускаємо перший голосни́й
            correct: false
          - text: читаємо кожне о як а
            correct: false
        explanation: У слові молоко́ ненаголошені о вимовляємо чітко. — In молоко́, keep the unstressed о sounds clear.
  - id: act-2
    type: quiz
    title: Вибір мелодики — Choose the intonation
    instruction: Обери звичну мелодику спокійного завершеного повідомлення або запитання «так/ні». — Choose the usual contour for a calm complete statement or a yes/no question.
    items:
      - prompt: Це ка́ва. — This is coffee.
        options:
          - text: спадна ↘ — falling
            correct: true
          - text: висхідна ↗ — rising
            correct: false
        explanation: Тон зазвичай знижується в кінці спокійного завершеного повідомлення. — The tone usually falls at the end of a calm complete statement.
      - prompt: Це ка́ва? — Is this coffee?
        options:
          - text: висхідна ↗ — rising
            correct: true
          - text: спадна ↘ — falling
            correct: false
        explanation: У звичайному запитанні «так/ні» тон підвищується. — The tone rises in this usual yes/no-question model.
      - prompt: Це метро́. — This is the metro.
        options:
          - text: спадна ↘ — falling
            correct: true
          - text: висхідна ↗ — rising
            correct: false
        explanation: Це спокійне завершене повідомлення. Тон зазвичай знижується. — This is a calm complete statement. The tone usually falls.
      - prompt: Тут гарно? — Is it nice here?
        options:
          - text: висхідна ↗ — rising
            correct: true
          - text: спадна ↘ — falling
            correct: false
        explanation: Це запитання «так/ні». У цій звичайній моделі тон підвищується. — This is a yes/no question. The tone rises in this usual model.
  - id: act-3
    type: quiz
    title: Швидкий контраст
    instruction: Обери коротку англійську підказку.
    items:
      - prompt: за́мок
        options:
          - text: castle
            correct: true
          - text: lock
            correct: false
        explanation: За́мок із наголосом на першому складі — castle.
      - prompt: замо́к
        options:
          - text: lock
            correct: true
          - text: castle
            correct: false
        explanation: Замо́к із наголосом на останньому складі — lock.
      - prompt: сім'я́
        options:
          - text: family
            correct: true
          - text: seed
            correct: false
        explanation: Сім'я́ з фінальним наголосом — family.
  - id: act-4
    type: fill-in
    title: Пунктуація і мелодика
    instruction: Обери розділовий знак, який відповідає реченню.
    items:
      - sentence: "Олена спокійно каже: «Це ка́ва___ Я п’ю її щодня»."
        answer: .
        options:
          - .
          - '?'
          - '!'
        explanation: "The speaker calmly states a fact. A period ends the first sentence inside the two-sentence quotation; a question or exclamation mark would change its stated purpose."
      - sentence: "Це метро́ чи апте́ка___"
        answer: '?'
        options:
          - '?'
          - .
          - '!'
        explanation: "Чи offers two alternatives in a direct question, so use a question mark. A period or exclamation mark would not mark this question."
      - sentence: "Де апте́ка___"
        answer: '?'
        options:
          - '?'
          - .
          - '!'
        explanation: "Де asks for a location, so use a question mark. A period or exclamation mark would not mark this direct question."
      - sentence: "Олена бачить квіти: «Як га́рно___»"
        answer: '!'
        options:
          - '!'
          - .
          - '?'
        explanation: "Як гарно expresses admiration in the flower scene, so use an exclamation mark. A period removes that emotion; a question mark would ask rather than admire."
      - sentence: "Марко спокійно каже: «Так, це вода́___ Вона холодна»."
        answer: .
        options:
          - .
          - '?'
          - '!'
        explanation: "The speaker calmly confirms that this is water. A period ends that first sentence inside the quotation; a question or exclamation mark changes the stated purpose."
  - id: act-5
    type: fill-in
    title: Типові пастки наголосу
    instruction: Обери нормативну форму з позначеним наголосом.
    items:
      - sentence: "Це мій ___ комп'ютер."
        answer: нови́й
        options:
          - нови́й
          - но́вий
        explanation: У слові нови́й наголос наприкінці.
      - sentence: "Мій дідусь ___."
        answer: стари́й
        options:
          - стари́й
          - ста́рий
        explanation: У слові стари́й наголос наприкінці.
      - sentence: "У мене ___ гривень."
        answer: одина́дцять
        options:
          - одина́дцять
          - о́динадцять
        explanation: Одина́дцять має наголос на -на́-.
      - sentence: "Я знаю ___ нових слів."
        answer: чотирна́дцять
        options:
          - чотирна́дцять
          - чоти́рнадцять
        explanation: Чотирна́дцять теж має наголос на -на́-.
      - sentence: "Множина слова голова́: ___."
        answer: го́лови
        options:
          - го́лови
          - голови́
        explanation: У цій словниковій парі наголос рухається.
      - sentence: "Мене звати ___."
        answer: Марі́я
        options:
          - Марі́я
          - Ма́рія
        explanation: У цьому імені наголос на рі́.
workbook:
  - type: fill-in
    title: Типові помилки наголосу
    instruction: Обери нормативну форму з позначеним наголосом.
    items:
      - sentence: "новий: ___"
        answer: нови́й
        options:
          - нови́й
          - но́вий
        explanation: У слові нови́й наголос на останній частині.
      - sentence: "старий: ___"
        answer: стари́й
        options:
          - стари́й
          - ста́рий
        explanation: У слові стари́й наголос на останній частині.
      - sentence: "одинадцять: ___"
        answer: одина́дцять
        options:
          - одина́дцять
          - о́динадцять
        explanation: Одина́дцять має наголос на -на́-.
      - sentence: "чотирнадцять: ___"
        answer: чотирна́дцять
        options:
          - чотирна́дцять
          - чоти́рнадцять
        explanation: Чотирна́дцять теж має наголос на -на́-.
      - sentence: "множина слова голова́: ___"
        answer: го́лови
        options:
          - го́лови
          - голови́
        explanation: "У цій парі наголос рухається: голова́, але го́лови."
      - sentence: "ім'я: ___"
        answer: Марі́я
        options:
          - Марі́я
          - Ма́рія
        explanation: У цьому імені наголос на рі́.
  - type: match-up
    title: На́голос змінює значення
    instruction: З'єднай наголошене слово з короткою англійською підказкою.
    pairs:
      - left: за́мок
        right: castle
      - left: замо́к
        right: lock
      - left: а́тлас
        right: atlas
      - left: атла́с
        right: satin
      - left: о́рган
        right: body organ
      - left: орга́н
        right: musical instrument
      - left: сі́м'я
        right: seed
      - left: сім'я́
        right: family
  - type: group-sort
    title: Сортуй за наголосом
    instruction: Розподіли кожне слово за позначеним наголошеним складом.
    groups:
      - label: Перший склад
        items:
          - ма́ма
          - та́то
          - ра́нок
          - ка́ва
      - label: Середній склад
        items:
          - столи́ця
          - люди́на
          - одина́дцять
          - чотирна́дцять
      - label: Останній склад
        items:
          - вода́
          - зима́
          - рука́
          - метро́
  - type: match-up
    title: Друк і зошит
    instruction: З'єднай друковане слово з підказкою в зо́шиті.
    pairs:
      - left: 'друк: ка́ва'
        right: 'зошит: на́голос на першому складі'
      - left: 'друк: вода́'
        right: 'зошит: наголошений склад да — stressed syllable да'
      - left: 'друк: молоко́'
        right: 'зошит: три чисті звуки о'
      - left: 'друк: метро́'
        right: 'зошит: наголошений склад ро — stressed syllable ро'
  - type: true-false
    title: Факти про наголос і мелодику
    instruction: Обери правда чи неправда.
    items:
      - statement: Український на́голос може бути на різних складах.
        correct: true
        explanation: На́голос вільний, тому вчи його разом із кожним словом.
      - statement: Звичайні українські тексти завжди мають позначки наголосу.
        correct: false
        explanation: Позначки наголосу є в навчальних матеріалах і словниках, а не в більшості звичайних текстів.
      - statement: У звичайному запитанні «Це вода́?» тон підвищується. — In the usual question «Це вода́?», the tone rises.
        correct: true
        explanation: Це звичайна модель запитання «так/ні». — This is the usual yes/no-question model.
      - statement: Спокійне завершене повідомлення «Це вода́.» зазвичай має висхідну мелодику. — The calm complete statement «Це вода́.» usually has rising intonation.
        correct: false
        explanation: Тон зазвичай знижується в кінці спокійного завершеного повідомлення. — The tone usually falls at the end of a calm complete statement.
  - type: translate
    title: Слова з наголосом
    instruction: Спочатку прочитай українське слово, потім обери англійську підказку.
    items:
      - source: на́голос
        options:
          - text: stress / accent
            correct: true
          - text: lock
            correct: false
          - text: water
            correct: false
        explanation: На́голос — stress / accent.
      - source: ка́ва
        options:
          - text: coffee
            correct: true
          - text: capital
            correct: false
          - text: morning
            correct: false
        explanation: Ка́ва — coffee.
      - source: вода́
        options:
          - text: water
            correct: true
          - text: photograph
            correct: false
          - text: atlas
            correct: false
        explanation: Вода́ — water.
      - source: столи́ця
        options:
          - text: capital
            correct: true
          - text: metro
            correct: false
          - text: family
            correct: false
        explanation: Столи́ця — capital.
