inline:
  - id: act-1
    type: fill-in
    title: "Complete the request"
    instruction: "Choose the word that completes each request."
    items:
      - sentence: "Олено, ти вже тут? Тоді ___ текст, будь ласка."
        answer: 'читай'
        options:
          - 'читай'
          - "читайте"
          - "книжку"
        explanation: "Explicit ти selects читай; читайте switches to ви. Книжку is a noun, not a predicate for this request."
      - sentence: "Пане Іване, ви вже готові? Тоді ___ текст, будь ласка."
        answer: 'читайте'
        options:
          - 'читайте'
          - "читай"
          - "книжку"
        explanation: "Explicit ви selects читайте; читай switches to ти. Книжку is a noun and cannot supply the missing predicate."
      - sentence: "Тарасе, ти вже готовий? Тоді ___ речення."
        answer: 'пиши'
        options:
          - 'пиши'
          - "пишіть"
          - "реченню"
        explanation: "Explicit ти selects пиши; пишіть switches to ви. Реченню is a dative noun, not the missing predicate."
      - sentence: "Студенти, ___ речення, будь ласка."
        answer: 'пишіть'
        options:
          - 'пишіть'
          - "пиши"
          - "реченню"
        explanation: "Студенти addresses several people, selecting пишіть. Пиши is singular; реченню is a dative noun, not a predicate."
      - sentence: "Маріє, ти мене чуєш? Тоді ___ мене, будь ласка."
        answer: 'слухай'
        options:
          - 'слухай'
          - "слухайте"
          - "текст"
        explanation: "Ти selects слухай; слухайте switches to ви. Текст is a noun and cannot complete the request predicate."
      - sentence: "Друзі, ___ мене, будь ласка."
        answer: 'слухайте'
        options:
          - 'слухайте'
          - "слухай"
          - "текст"
        explanation: "Друзі addresses several people, selecting слухайте. Слухай is singular; текст is a noun, not a request predicate."
      - sentence: "Пане офіціанте, ви вже тут? ___ меню, будь ласка."
        answer: 'Дайте'
        options:
          - 'Дайте'
          - "Дай"
          - "Реченню"
        explanation: "Explicit ви selects Дайте; Дай switches to ти. Реченню is a dative noun and cannot be the request predicate."
      - sentence: "Олено, ти вже готова? ___, що ти хочеш."
        answer: 'Скажи'
        options:
          - 'Скажи'
          - "Скажіть"
          - "Книжкою"
        explanation: "Explicit ти selects Скажи; Скажіть switches to ви. Книжкою is an instrumental noun and cannot introduce the content clause as its predicate."
  - id: act-2
    type: quiz
    title: Ti or vy?
    instruction: Choose the form that fits the situation.
    items:
      - prompt: "Олено, ти вже тут? Ось текст. ___"
        options:
          - text: 'Читай, будь ласка.'
            correct: true
          - text: 'Читайте, будь ласка.'
            correct: false
          - text: "Читай тексту, будь ласка."
            correct: false
        explanation: 'One friend takes the ти form читай.'
      - prompt: "Пане Іване, ви вже тут? Ось текст. ___"
        options:
          - text: 'Читайте, будь ласка.'
            correct: true
          - text: 'Читай, будь ласка.'
            correct: false
          - text: "Читайте тексту, будь ласка."
            correct: false
        explanation: 'A teacher takes polite ви.'
      - prompt: "Пане офіціанте, ви можете підійти? Ми вже поїли. ___"
        options:
          - text: 'Дайте рахунок, будь ласка.'
            correct: true
          - text: 'Дай рахунок, будь ласка.'
            correct: false
          - text: "Дайте рахунком, будь ласка."
            correct: false
        explanation: 'Use polite дайте with a server.'
      - prompt: "Тарасе, ти вже тут? Ось наш столик. ___"
        options:
          - text: 'Дай меню, будь ласка.'
            correct: true
          - text: 'Дайте меню, будь ласка.'
            correct: false
          - text: "Дай книжкою, будь ласка."
            correct: false
        explanation: 'Use дай with one close person.'
      - prompt: "Діти, ви вже готові? ___"
        options:
          - text: 'Пишіть речення.'
            correct: true
          - text: 'Пиши речення.'
            correct: false
          - text: "Пишіть реченню."
            correct: false
        explanation: 'The class takes the plural form пишіть.'
      - prompt: "Олено, ти бачиш он той будинок? ___"
        options:
          - text: 'Подивись!'
            correct: true
          - text: "Подивись будинком!"
            correct: false
          - text: "Подивись будинком, будь ласка."
            correct: false
        explanation: 'Подивись is a useful ти command.'
      - prompt: "Пане Іване, я не все почув. ___"
        options:
          - text: 'Скажіть ще раз, будь ласка.'
            correct: true
          - text: "Скажіть ще разу, будь ласка."
            correct: false
          - text: "Скажіть ще разів, будь ласка."
            correct: false
        explanation: "Ще раз expresses repetition. Разу and разів are genitive forms and cannot replace раз after ще without the required construction."
      - prompt: "Друзі, тут дуже душно. ___"
        options:
          - text: 'Відкрийте двері.'
            correct: true
          - text: 'Відкрий двері.'
            correct: false
          - text: "Відкрийте дверима."
            correct: false
        explanation: 'The team takes the plural command відкрийте.'
  - id: act-3
    type: group-sort
    title: Command shelves
    instruction: Sort the commands by social use.
    groups:
      - name: 'ти: one familiar person'
        items:
          - 'читай'
          - 'пиши'
          - 'слухай'
          - 'дай'
          - 'скажи'
          - 'іди'
      - name: 'ви: polite or plural'
        items:
          - 'читайте'
          - 'пишіть'
          - 'слухайте'
          - 'дайте'
          - 'скажіть'
          - 'ідіть'
  - id: act-4
    type: unjumble
    title: Polite request order
    instruction: Put the words in a natural order.
    items:
      - words: ['Олено', 'читай', 'будь', 'ласка']
        answer: 'Олено, читай, будь ласка.'
      - words: ['Пане', 'Іване', 'читайте', 'будь', 'ласка']
        answer: 'Пане Іване, читайте, будь ласка.'
      - words: ['Дайте', 'мені', 'меню', 'будь', 'ласка']
        answer: 'Дайте мені меню, будь ласка.'
      - words: ['Дай', 'мені', 'меню', 'будь', 'ласка']
        answer: 'Дай мені меню, будь ласка.'
      - words: ['Скажіть', 'ще', 'раз', 'будь', 'ласка']
        answer: 'Скажіть ще раз, будь ласка.'
      - words: ['Відкрийте', 'підручники', 'будь', 'ласка']
        answer: 'Відкрийте підручники, будь ласка.'
workbook:
  - type: fill-in
    title: "Address and request"
    instruction: "Choose the word that completes each request."
    items:
      - sentence: "Олено, ти вже тут? ___ мені книжку, будь ласка."
        answer: 'дай'
        options:
          - 'дай'
          - 'дайте'
          - "дає"
        explanation: "Ти matches дай. Дайте belongs to ви; дає is third-person indicative."
      - sentence: "Пане Іване, ви вже тут? Тоді ___ книжку, будь ласка."
        answer: 'дайте'
        options:
          - 'дайте'
          - 'дай'
          - "книжкою"
        explanation: "Explicit ви selects дайте. Дай switches to ти; книжкою is an instrumental noun, not the request predicate."
      - sentence: "Тарасе, ти вже готовий? ___ в кафе зі мною."
        answer: 'іди'
        options:
          - 'іди'
          - 'ідіть'
          - "іде"
        explanation: "Ти matches іди. Ідіть belongs to ви; іде is third-person indicative."
      - sentence: "Друзі, ви вже готові? Тоді ___ в кафе."
        answer: 'ідіть'
        options:
          - 'ідіть'
          - 'іди'
          - "книжку"
        explanation: "Друзі and ви identify several addressees. Ідіть agrees; іди is singular and книжку is a noun, not the missing predicate."
      - sentence: 'Маріє, ___, що ти хочеш.'
        answer: 'скажи'
        options:
          - 'скажи'
          - 'скажіть'
          - "книжкою"
        explanation: "The embedded ти identifies a familiar singular addressee, matching скажи. Скажіть switches to ви; книжкою cannot be the predicate introducing the content clause."
      - sentence: "Пані Оксано, ви мене чуєте? Тоді ___, будь ласка."
        answer: 'скажіть'
        options:
          - 'скажіть'
          - 'скажи'
          - "книжкою"
        explanation: "Explicit ви selects скажіть. Скажи switches to ти; книжкою is a noun and cannot supply the request predicate."
  - type: true-false
    title: Request checks
    instruction: Decide whether each statement fits this A1 lesson.
    items:
      - statement: 'Будь ласка makes a command or request more polite.'
        answer: true
        explanation: 'Add будь ласка for polite requests.'
      - statement: 'Читай and читайте are both useful A1 command forms.'
        answer: true
        explanation: 'Читай is ти; читайте is ви.'
      - statement: 'The active A1 target is every imperative person and number.'
        answer: false
        explanation: 'This module actively uses only ти and ви forms.'
      - statement: 'Дайте рахунок, будь ласка is a polite cafe request.'
        answer: true
        explanation: 'Use дайте with a server.'
      - statement: 'Будь ласка, читати текст is the target request form.'
        answer: false
        explanation: 'Use читай or читайте, not the infinitive.'
      - statement: 'Давай is not used here as a shortcut for building Ukrainian imperatives.'
        answer: true
        explanation: 'Use the Ukrainian command form itself.'
      - statement: 'Поставь is the Ukrainian spelling target.'
        answer: false
        explanation: 'Use постав.'
      - statement: 'Олено, прочитай, будь ласка combines address and request.'
        answer: true
        explanation: 'Address plus command plus будь ласка is a good A1 pattern.'
  - type: match-up
    title: Infinitive to request pair
    instruction: Match the infinitive with the two useful A1 request forms.
    pairs:
      - left: 'читати'
        right: 'читай / читайте'
      - left: 'писати'
        right: 'пиши / пишіть'
      - left: 'слухати'
        right: 'слухай / слухайте'
      - left: 'говорити'
        right: 'говори / говоріть'
      - left: 'дати'
        right: 'дай / дайте'
      - left: 'сказати'
        right: 'скажи / скажіть'
      - left: 'іти'
        right: 'іди / ідіть'
      - left: 'відкрити'
        right: 'відкрий / відкрийте'
  - type: unjumble
    title: Class and cafe requests
    instruction: Put each request in a natural order.
    items:
      - words: ['Відкрийте', 'підручники', 'будь', 'ласка']
        answer: 'Відкрийте підручники, будь ласка.'
      - words: ['Читайте', 'текст', 'будь', 'ласка']
        answer: 'Читайте текст, будь ласка.'
      - words: ['Пишіть', 'три', 'речення']
        answer: 'Пишіть три речення.'
      - words: ['Дайте', 'мені', 'меню', 'будь', 'ласка']
        answer: 'Дайте мені меню, будь ласка.'
      - words: ['Дайте', 'рахунок', 'будь', 'ласка']
        answer: 'Дайте рахунок, будь ласка.'
      - words: ['Скажіть', 'ще', 'раз', 'будь', 'ласка']
        answer: 'Скажіть ще раз, будь ласка.'
      - words: ['Олено', 'читай', 'текст']
        answer: 'Олено, читай текст.'
      - words: ['Тарасе', 'дай', 'меню', 'будь', 'ласка']
        answer: 'Тарасе, дай меню, будь ласка.'
  - type: match-up
    title: Repair imperative interference
    instruction: Match each learner mistake with the Ukrainian repair.
    pairs:
      - left: 'Будь ласка, читати текст.'
        right: 'Будь ласка, читай текст. / Будь ласка, читайте текст.'
      - left: 'Давай робити це зараз.'
        right: 'Робімо це зараз!'
      - left: 'Хай він працювати.'
        right: 'Хай він працює.'
      - left: 'Поставь книгу на стіл.'
        right: 'Постав книгу на стіл.'
      - left: 'Доповіди керівнику.'
        right: 'Доповідай керівнику.'
      - left: 'Читаємте разом!'
        right: 'Читаймо разом!'
  - type: error-correction
    title: Fix the request
    instruction: Correct the command or request form.
    items:
      - sentence: 'Будь ласка, читати текст.'
        error: 'читати'
        correction: 'читай'
        explanation: 'Use читай with one familiar person, or читайте for polite ви.'
      - sentence: 'Пане Іване, читати текст, будь ласка.'
        error: 'читати'
        correction: 'читайте'
        explanation: 'Use читайте for polite address.'
      - sentence: 'Давай робити це зараз.'
        error: 'Давай робити'
        correction: 'Робімо'
        explanation: 'Use the fixed recognition repair Робімо це зараз!.'
      - sentence: 'Хай він працювати.'
        error: 'працювати'
        correction: 'працює'
        explanation: 'After хай, recognize the finite verb repair.'
      - sentence: 'Поставь книгу на стіл.'
        error: 'Поставь'
        correction: 'Постав'
        explanation: 'Do not write a soft sign here.'
      - sentence: 'Доповіди керівнику.'
        error: 'Доповіди'
        correction: 'Доповідай'
        explanation: 'Recognize the fixed repair Доповідай.'
      - sentence: 'Читаємте разом!'
        error: 'Читаємте'
        correction: 'Читаймо'
        explanation: 'Use the fixed recognition repair Читаймо разом!.'
