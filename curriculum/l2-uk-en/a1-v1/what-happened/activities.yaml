inline:
  - id: act-1
    type: match-up
    title: Match the past form
    instruction: Match each subject and infinitive with the corresponding past form.
    pairs:
      - left: 'він (читати)'
        right: 'читав'
      - left: 'вона (готувати)'
        right: 'готувала'
      - left: 'воно (працювати)'
        right: 'працювало'
      - left: 'вони (говорити)'
        right: 'говорили'
      - left: 'ми (гуляти)'
        right: 'гуляли'
      - left: 'Олена (слухати)'
        right: 'слухала'
      - left: 'Тарас (писати)'
        right: 'писав'
      - left: 'друзі (дивитися)'
        right: 'дивилися'
  - id: act-2
    type: fill-in
    title: Choose the past form
    instruction: Pick the form that fits the subject.
    items:
      - sentence: 'Учора він ___ книжку.'
        answer: 'читав'
        options:
          - 'читав'
          - 'читала'
          - 'читали'
        explanation: 'Він is masculine singular, so use читав.'
      - sentence: 'Олена ___ вечерю.'
        answer: 'готувала'
        options:
          - 'готувала'
          - 'готував'
          - 'готували'
        explanation: 'Олена is feminine singular, so use готувала.'
      - sentence: 'Ми ___ в парку.'
        answer: 'гуляли'
        options:
          - 'гуляли'
          - 'гуляв'
          - 'гуляла'
        explanation: 'Ми is plural, so use гуляли.'
      - sentence: 'Вони ___ разом.'
        answer: 'працювали'
        options:
          - 'працювали'
          - 'працював'
          - 'працювало'
        explanation: 'Вони is plural, so use працювали.'
      - sentence: 'Тарас ___ фільм.'
        answer: 'дивився'
        options:
          - 'дивився'
          - 'дивилася'
          - 'дивилися'
        explanation: 'Тарас is masculine singular, so use дивився.'
      - sentence: 'Марія ___ телефоном.'
        answer: 'говорила'
        options:
          - 'говорила'
          - 'говорив'
          - 'говорили'
        explanation: 'Марія is feminine singular, so use говорила.'
  - id: act-3
    type: quiz
    title: "Choose the answer"
    instruction: "Choose the best answer."
    items:
      - prompt: 'Why can я читав and ти читав have the same ending?'
        options:
          - text: 'Because past tense marks masculine singular here.'
            correct: true
          - text: 'Because я and ти always use one ending.'
            correct: false
          - text: 'Because Ukrainian has no person forms.'
            correct: false
        explanation: "The two examples share masculine singular past читав even though я and ти are different persons. The second option falsely generalizes across all tenses; the third denies the attested Ukrainian personal present/future forms."
      - prompt: "Олена: Учора я була вдома. ___"
        options:
          - text: 'Я читала.'
            correct: true
          - text: 'Я читав.'
            correct: false
          - text: 'Я читали.'
            correct: false
        explanation: 'A female speaker uses the feminine form читала.'
      - prompt: "Олена і Тарас: ___"
        options:
          - text: 'Ми читали.'
            correct: true
          - text: 'Ми читав.'
            correct: false
          - text: 'Ми читала.'
            correct: false
        explanation: 'Plural past uses -ли.'
      - prompt: 'Which question fits Ivan?'
        options:
          - text: 'Що ти робив?'
            correct: true
          - text: 'Що ти робила?'
            correct: false
          - text: 'Що ти робило?'
            correct: false
        explanation: 'Ivan is male, so ask робив.'
  - id: act-4
    type: group-sort
    title: Sort the forms
    instruction: Sort each past-tense form by ending.
    groups:
      - name: '-в'
        items:
          - 'читав'
          - 'працював'
          - 'гуляв'
      - name: '-ла'
        items:
          - 'читала'
          - 'працювала'
          - 'гуляла'
      - name: '-ло'
        items:
          - 'читало'
          - 'працювало'
          - 'гуляло'
      - name: '-ли'
        items:
          - 'читали'
          - 'працювали'
          - 'гуляли'
workbook:
  - type: true-false
    title: Check the past form
    instruction: Decide whether each sentence uses the expected A1 past ending.
    items:
      - statement: 'Олена читала книжку.'
        answer: true
        explanation: 'Олена is feminine singular, so читала fits.'
      - statement: 'Тарас читала книжку.'
        answer: false
        explanation: 'Use Тарас читав.'
      - statement: 'Вони працювали разом.'
        answer: true
        explanation: 'Вони takes the plural form -ли.'
      - statement: 'Ми читалимо текст.'
        answer: false
        explanation: 'Do not add present endings. Use Ми читали текст.'
      - statement: 'Сонце працювало.'
        answer: true
        explanation: 'Сонце is neuter, so -ло fits.'
      - statement: 'Я буду читав завтра.'
        answer: false
        explanation: 'After буду, use the infinitive: буду читати.'
  - type: quiz
    title: Choose short past sentences
    instruction: Choose the sentence whose words fit together.
    items:
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Учора Тарас читав книжку.
            correct: true
          - text: Учора Тарас читала книжку.
            correct: false
          - text: Учора Тарас читали книжку.
            correct: false
        explanation: The stated subject requires читав; читала and читали have a different past-tense gender or number.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Олена готувала вечерю.
            correct: true
          - text: Олена готував вечерю.
            correct: false
          - text: Олена готували вечерю.
            correct: false
        explanation: The stated subject requires готувала; готував and готували have a different past-tense gender or number.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Ми гуляли в парку.
            correct: true
          - text: Ми гуляв в парку.
            correct: false
          - text: Ми гуляла в парку.
            correct: false
        explanation: The stated subject requires гуляли; гуляв and гуляла have a different past-tense gender or number.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Вони працювали разом.
            correct: true
          - text: Вони працював разом.
            correct: false
          - text: Вони працювала разом.
            correct: false
        explanation: The stated subject requires працювали; працював and працювала have a different past-tense gender or number.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Що ти робив учора?
            correct: true
          - text: Що я робили учора?
            correct: false
          - text: Що ми робив учора?
            correct: false
        explanation: The key has matching subject and verb forms. я робили and ми робив combine a singular subject with a plural verb or a plural subject with a singular verb.
      - prompt: Обери правильно побудоване речення.
        options:
          - text: Що ти робила учора?
            correct: true
          - text: Що я робили учора?
            correct: false
          - text: Що ми робила учора?
            correct: false
        explanation: The key has matching subject and verb forms. я робили and ми робила combine a singular subject with a plural verb or a plural subject with a singular verb.
  - type: match-up
    title: One subject or many?
    instruction: Match the subject with its past-tense form.
    pairs:
      - left: він
        right: читав
      - left: вона
        right: читала
      - left: воно
        right: читало
      - left: вони
        right: читали
  - type: error-correction
    title: Repair the A1 past tense
    instruction: Keep the stated speaker, subject, time words and future auxiliary. Correct the verb form or spelling.
    items:
      - sentence: 'Жінка: Я читав книжку.'
        error: 'читав'
        correction: 'читала'
        explanation: 'The stated female speaker uses читала.'
      - sentence: 'Чоловік: Я читала.'
        error: 'читала'
        correction: 'читав'
        explanation: 'A male speaker says Я читав.'
      - sentence: 'Жінка: Я читав.'
        error: 'читав'
        correction: 'читала'
        explanation: 'A female speaker says Я читала.'
      - sentence: 'Ми читалимо текст.'
        error: 'читалимо'
        correction: 'читали'
        explanation: 'Past plural is читали; do not add -мо.'
      - sentence: 'Вони читалить текст.'
        error: 'читалить'
        correction: 'читали'
        explanation: 'Past plural is читали; do not add present endings.'
      - sentence: 'Сонце встав.'
        error: 'встав'
        correction: 'встало'
        explanation: 'Сонце is neuter, so use -ло.'
      - sentence: 'Я буду читав завтра.'
        error: 'читав'
        correction: 'читати'
        explanation: 'After буду, use the infinitive читати.'
      - sentence: 'Він принісв книгу.'
        error: 'принісв'
        correction: 'приніс'
        explanation: 'The masculine past form is приніс. It does not add another -в.'
        options:
          - приніс
          - принесла
          - принесли
  - type: translate
    title: Say it in Ukrainian
    instruction: Choose the Ukrainian line that matches the English prompt.
    items:
      - source: 'Yesterday he read a book.'
        options:
          - text: 'Учора він читав книжку.'
            correct: true
          - text: 'Учора вона читала книжку.'
            correct: false
          - text: 'Учора вони читали книжку.'
            correct: false
        explanation: 'He is masculine singular, so use читав.'
      - source: 'Yesterday she cooked dinner.'
        options:
          - text: 'Учора вона готувала вечерю.'
            correct: true
          - text: 'Учора він готував вечерю.'
            correct: false
          - text: 'Учора ми готували вечерю.'
            correct: false
        explanation: 'She is feminine singular, so use готувала.'
      - source: 'We walked in the park.'
        options:
          - text: 'Ми гуляли в парку.'
            correct: true
          - text: 'Він гуляв у парку.'
            correct: false
          - text: 'Вона гуляла в парку.'
            correct: false
        explanation: 'We is plural, so use гуляли.'
      - source: 'What were you doing yesterday? (to Ivan)'
        options:
          - text: 'Що ти робив учора?'
            correct: true
          - text: 'Що ти робила учора?'
            correct: false
          - text: 'Що ми робили учора?'
            correct: false
        explanation: 'Ivan is male, so the question uses робив.'
      - source: 'What were you doing yesterday? (to Olena)'
        options:
          - text: 'Що ти робила учора?'
            correct: true
          - text: 'Що ти робив учора?'
            correct: false
          - text: 'Що вони робили учора?'
            correct: false
        explanation: 'Olena is female, so the question uses робила.'
  - type: odd-one-out
    title: Find the ending that does not fit
    instruction: Choose the form that does not belong in each set.
    items:
      - prompt: 'Forms for feminine singular'
        words:
          - 'читала'
          - 'працювала'
          - 'гуляли'
        answer: 'гуляли'
        explanation: 'Гуляли is plural, not feminine singular.'
      - prompt: 'Forms for plural'
        words:
          - 'читали'
          - 'говорили'
          - 'говорив'
        answer: 'говорив'
        explanation: 'Говорив is masculine singular.'
      - prompt: 'Forms for masculine singular'
        words:
          - 'читав'
          - 'готував'
          - 'готувала'
        answer: 'готувала'
        explanation: 'Готувала is feminine singular.'
      - prompt: 'Forms for neuter singular'
        words:
          - 'читало'
          - 'працювало'
          - 'працювали'
        answer: 'працювали'
        explanation: 'Працювали is plural.'
