module: a2-012
level: A2
sequence: 12
slug: euphony-advanced
version: 1.1.0
title: Милозвучність у складних контекстах
subtitle: Розширені правила у/в, з/із/зі та і/й у складних реченнях
focus: grammar
pedagogy: PPP
phase: A2.2 [Повний родовий відмінок]
word_target: 2000
objectives:
- Вміти правильно застосовувати чергування у/в у складних контекстах — після прийменників, на межі фраз і з відмінковими
  формами (у школі проти в університеті).
- Вміти застосовувати правила для з/із/зі при збігу приголосних та з відмінковими формами (з друзями, із задоволенням,
  зі школи, зі мною).
- Вміти застосовувати правила для і/й у складносурядних і складнопідрядних реченнях, зокрема після слів, що закінчуються
  на голосний, та перед збігом приголосних.
- Вміти без вагань будувати природні милозвучні речення, що складаються з кількох частин.
dialogue_situations:
- setting: 'Друзі планують поїздку на вихідні — домовляються, куди поїхати і як дістатися: Поїдемо в Карпати чи у Львів? —
    У Львів! Із задоволенням! Я поїду з Оленою і Тарасом. А ви зі Львова повернетесь у неділю?'
  speakers:
  - Оленка
  - Тарас
  motivation: 'Природне планування поїздки залучає всі три типи милозвучності: у/в з назвами місць, з/із/зі з людьми, і/й
    для зв''язку частин речення'
content_outline:
- section: У чи в? Складні випадки
  words: 600
  points:
  - 'Повторення базового правила рівня A1 з обома сусідніми словами: у між приголосними, в між голосними та після приголосного
    перед голосним. Після голосного перед більшістю приголосних уживаємо в; окремо перевіряємо спеціальні початки, зокрема
    в, ф, льв-.'
  - 'На початку речення перед голосним: В Україні зима холодна. Після позначеної паузи перед приголосним базова форма у, перед
    голосним в. Кома або тире не скасовує потреби перевіряти наступне слово. Зберегти дозволене початкове в перед приголосним
    і примітку Правопису про художні варіанти.'
  - 'З відмінковими формами: Вона працює в школі; Він був у школі; в університеті; в Одесі. Вибір залежить від обох сусідніх
    слів і спеціальних правил, а не від незмінного сполучення з назвою місця.'
  - 'Префіксальні дієслова на у-/в-: увійти/ввійти, обидва варіанти існують. У базовій письмовій моделі після голосного перед
    в уживаємо початкове в-: Вона ввійшла; після приголосного: Він увійшов. Увечері прийшов лишається окремим прикладом початкового
    у-. Зберегти примітки Правопису про варіанти.'
  - 'Базові письмові моделі для порівняння: у вікно перед в; в університеті перед голосним. Не перетворювати навчальні виправлення
    на заборону всіх художніх або авторських варіантів.'
- section: З, із чи зі? Правила перед збігами приголосних
  words: 600
  points:
  - 'З уживаємо перед голосним; перед приголосним враховуємо також попереднє слово. Із уживаємо перед початковими одиничними
    з, с, ц, ж, ч, ш: із задоволенням, із сестрою. Зі вживаємо перед буквосполученнями, часто з початковими з, с, ш: зі школи,
    зі снігу; також зі Львова. Зі мною має варіант зо мною. Перед деякими збігами із та зі взаємозамінні; зберегти примітку
    про ритм і мовні вподобання автора.'
  - 'З відмінковими формами та займенниками: з ним, з нею, з нами, зі мною (збіг мн-). З Києва, зі Львова (збіг Льв-).'
  - 'Контекст родового відмінка (поточний фокус A2.2): з родини, із сім''ї, зі школи. Контекст прийменників родового відмінка
    робить практику милозвучності природною.'
  - 'Порівняння з базовими письмовими моделями: зі школи; зі мною або зо мною; на початку речення з ним. Не робити висновку
    про неприродність усіх інших контекстів лише з відсутності збігу приголосних.'
- section: І чи й? У складних реченнях
  words: 500
  points:
  - 'Повторення: і між приголосними, й після голосного в переліку без паузи, якщо немає спеціального правила. Після букв й,
    я, ю, є, ї єднальні сполучники і або та: Олею і Денисом, у музеї і театрі, зі мною і Олею. Перед початковими й, я, ю,
    є, ї та при зіставленні понять уживаємо і. Застосування у складнопідрядних та складносурядних реченнях зберігається.'
  - 'Після позначеної паузи перед приголосним базова форма і: Він прийшов, і ми поїхали. Кома сама по собі не означає завжди
    і. Зберегти Вона заспівала, й усі заплакали та Ми прийшли, й урок почався як приклади з наступним голосним: правило про
    паузу перед приголосним не вимагає їх автоматично виправляти. Зберегти примітку Правопису про ритм і мовні вподобання автора.'
  - 'З однорідними підметами та додатками: хліб і масло, кава й молоко. Застосовуйте правило до кожної пари окремо.'
  - 'Особливе: та як синонім до і — та ніколи не чергується, завжди залишається та. Корисно, коли милозвучність неоднозначна:
    мама та тато.'
- section: 'Все разом: мелодійні речення'
  words: 300
  points:
  - 'Побудова речень із кількома частинами, які звучать природно: Ми поїхали у Львів із друзями й провели чудовий вихідний.'
  - 'Практика читання вголос: милозвучність стосується ЗВУКУ, а не лише правил. Читайте речення вголос і відчувайте, коли
    вони ллються, а коли спотикаються.'
  - 'Закріплення: усі три правила (у/в, з/із/зі, і/й) служать одному принципу — милозвучності. Українська мова активно уникає
    збігу приголосних і зіткнення голосних на межі слів.'
- section: Підсумок
  words: 200
  points:
  - 'Правила милозвучності запобігають складним збігам звуків на межі слів: у/в (у школі, в університеті), з/із/зі (з ним,
    із задоволенням, зі школи) та і/й/та у складних реченнях.'
  - 'Самоперевірка: Яку базову форму перед «мною» подає Правопис і який варіант із «зо» він також допускає? Що визначає вибір
    між «увійти» та «ввійти» у поданому контексті? Напишіть природне складне речення, у якому правильно використано «у/в»,
    «з/із/зі» та «і/й».'
vocabulary_hints:
  required:
  - милозвучність (euphony, melodiousness)
  - евфонія (euphony (technical term))
  - чергування (alternation)
  - голосний (vowel)
  - приголосний (consonant)
  - збіг (cluster, collision)
  - прийменник (preposition)
  - сполучник (conjunction)
  - вживати (to use, to apply)
  - складний (complex, compound)
  recommended:
  - спрощення (simplification)
  - уникати (to avoid)
  - мелодійний (melodious)
  - межа (boundary)
  - правило (rule)
activity_hints:
- type: quiz
  focus: Обрати правильний милозвучний варіант (у/в, з/із/зі, і/й) у контексті
  items: 8
- type: fill-in
  focus: Доповнити речення правильною формою прийменника або сполучника
  items: 8
- type: error-correction
  focus: 'Виправити відхилення від базової письмової моделі у повних реченнях: Я був в Львові; Вона повертається з школи;
    Брат й сестра вдома. Зберігати зміст і розділові знаки; не оголошувати і усі помилкою без попереднього контексту.'
  items: 8
- type: match-up
  focus: Зіставити варіант фрази з базовою письмовою моделлю за явно поданим контекстом; не оголошувати кожен авторський варіант
    помилкою
  items: 8
grammar:
- 'Ключова тема модуля: Милозвучність у складних контекстах — Розширені правила у/в, з/із/зі та і/й у складних реченнях'
- Вміти правильно застосовувати чергування у/в у складних контекстах — після прийменників, на межі фраз і з відмінковими
  формами (у школі проти в університеті).
- Вміти застосовувати правила для з/із/зі при збігу приголосних та з відмінковими формами (з друзями, із задоволенням,
  зі школи, зі мною).
- Вміти застосовувати правила для і/й у складносурядних і складнопідрядних реченнях, зокрема після слів, що закінчуються
  на голосний, та перед збігом приголосних.
- Вміти без вагань будувати природні милозвучні речення, що складаються з кількох частин.
register: науково-навчальний
persona:
  voice: Терплячий A2 граматичний наставник
  role: Пояснює граматику через короткі дорослі приклади, контрасти форм і контроль типових помилок.
