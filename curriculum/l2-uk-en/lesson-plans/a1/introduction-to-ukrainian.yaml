    task:
      id: personal-study-routine
      action: personalize
      context_en: You have one regular study opportunity and a specific reason to use Ukrainian. Choose a real person
        or situation that matters to you, such as speaking with a colleague or reading a familiar label.
      instruction_en: Write or say your plan in English. Choose a personal goal, a time you can use, one listening
        or speaking action and one reading or writing action. Explain how each action helps your chosen goal. You
        may use the whole-video listening preview as a resource.
      response_mode: spoken_or_written
      success_criteria_en:
      - The goal refers to a real situation chosen by the learner.
      - The plan includes an observable oral action and an observable written-language action, each connected to
        the goal.
      - The learner selects a feasible study opportunity and explains their choices in English; no Ukrainian production
        is required.
