  title: Мій план навчання
  kind: recap
  job: Make an English study plan that fits a real situation in which you want to use Ukrainian.
  rationale: The closing task uses the orientation to make a personal decision. It is a brief planning workshop,
    not a second factual lesson or a Ukrainian production test. There is no mapped v1 orientation module and no
    inherited workbook quota.
