slug: introduction-to-ukrainian
version: '1.0'
title: Українська мова
subtitle: An English orientation to the language and your own study routine
focus: Language identity, a brief literary milestone, use in Ukraine and the diaspora, the alphabet as an overview,
  and practical study choices. All explanation and responses are in English; no Ukrainian production or decoding
  is required.
objectives:
- Recognise Ukrainian as a language in its own right, in the Slavic group of the Indo-European family.
- Distinguish a milestone of the literary language from the origin of the spoken language.
- Identify Ukraine and documented diaspora contexts as places where Ukrainian is used.
- Distinguish listening and speaking from reading and writing, and choose a balanced personal learning routine.
