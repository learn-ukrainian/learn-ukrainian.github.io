    task:
      id: first-contact-integration-task
      action: personalize
      context_en: You arrive at a community event and meet someone new. Select a sourced fictional profile
        or your own details, and choose a family photo, trusted circle or acquired belonging as an optional
        conversation focus.
      instruction_en: Listen to your partner’s opening and choose an appropriate reply. Sustain a four-to-six-turn
        meeting with a name and a relevant detail, using a photo or object label when useful. Read the
        partner’s supported badge or caption and identify its intended person or object. Write a short
        follow-up message with a suitable close. Change the recipient and adapt the exchange. Use the
        complete alphabet reference for a supported name or surname.
      response_mode: spoken_or_written
      success_criteria_en:
      - A partner can identify the selected person and relevant detail.
      - The exchange contains four to six connected turns and responds to the partner.
      - The register and closing fit the chosen relationship and time.
      - The read badge or caption matches the intended person or object.
      - The written follow-up communicates a chosen detail.
      - No new word, grammatical system or letter is required.
      learner_reads:
      - ref: T-602
        words:
        - твоя мама
        - моя мама
