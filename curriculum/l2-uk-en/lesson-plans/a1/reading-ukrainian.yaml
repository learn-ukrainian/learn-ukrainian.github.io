plan_schema: 2
module: reading-ukrainian
level: a1
sequence: 2
slug: reading-ukrainian
version: '1'
title: читати
subtitle: Read words and whole short sourced sentences aloud with 25 letters
focus: 'Continue the primer sequence after position 1: hear each new sound, read its CV and VC row and decodable word, then
  read whole sourced short sentences aloud and copy models offline.'
objectives:
- Read and copy the 12 new letters in fixed primer order, and read at least one sourced decodable VESUM word with each new
  letter.
- Read whole short sourced sentences aloud after word practice, with only the 25 taught letters and without apostrophe or
  the later digraphs.
- Distinguish the two sounds represented by Г and Ґ and check Latin-shaped letters against primer sound models.
- Copy decodable printed models and write one’s own name from an existing written model in a notebook; these are offline
  practices.
connects_to:
- sounds-letters-and-hello
prerequisites:
- sounds-letters-and-hello
register: English scaffolding at A1; Ukrainian models first with English support after the model. Pronunciation is heard
  before the letter is read.
changelog:
- First position-2 plan package. The primer part-1 sequence passes over the soft sign for position 3, and all sentence-reading
  models are whole sourced sentences.
