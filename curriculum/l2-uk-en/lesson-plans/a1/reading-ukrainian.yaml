  - id: s1
    kind: teach
    teach: Hear Т from the primer, see its glyph, read its CV and VC row, then read W-101 as a whole decodable word; classify
      the new sound against the known vowel/consonant distinction and copy only the taught-letter model. After Т, recycle
      W-074 as a whole-word read and copy item; hear W-075 and W-076 only as one intact greeting chunk, never read or split
      it. The Cyrillic Т shares its shape with Latin T and the source sound [т] is the alike reading case.
