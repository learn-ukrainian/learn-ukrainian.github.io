plan_schema: 2
module: reading-ukrainian
level: a1
sequence: 2
slug: reading-ukrainian
version: '4'
title: читати
subtitle: Twelve more letters, then whole words and short sourced sentences read aloud
focus: 'Continue the primer sequence after position 1: hear each new sound, read its syllable or word row and a decodable word, then read whole
  sourced short sentences aloud and copy models offline.'
objectives:
- Read and copy the 12 new letters in fixed primer order, and read at least one sourced decodable VESUM word with each new letter.
- Read whole short sourced sentences aloud after word practice, with only the 25 taught letters and without apostrophe or the later
  digraphs.
- Distinguish the two sounds represented by Г and Ґ and check the Latin-shaped Т, Е and Х against sourced correspondences.
- Copy decodable printed models and write one’s own name from an existing written model in a notebook; these are offline practices.
connects_to:
- sounds-letters-and-hello
prerequisites:
- sounds-letters-and-hello
register: English scaffolding at A1; Ukrainian models first with English support after the model. Pronunciation is heard before the letter
  is read.
changelog:
- First position-2 plan package. The primer part-1 sequence passes over the soft sign for position 3, and all sentence-reading models are
  whole sourced sentences.
- 'Completion pass (co-author Claude Opus 5.5): every letter now has a native pronunciation video and a sourced read row (T-018 for the lesson-2
  labial, T-019 for the lesson-4 velar); the fifth letter gains the common noun W-117 and the lesson-2 labial the core noun W-118; the two-g contrast
  and the Latin-shape points are grounded in T-020 and T-021; the English-speaker description of the lesson-4 and lesson-5 consonants is recorded
  as open U-001 and not taught; W-074 is recycled in every teach lesson; each teach workbook has a quiz; the lesson-5 quiz and the recap questions
  no longer present non-decodable text as reading items.'
- 'Round 2, #8425: authorized authentic-text/planned-dialogue recap hosts; ULP notes grounding only; complete word-row admission; explicit native
  single-letter bindings; exact-row/word/sentence/name audio gaps converted to print with offline teacher modeling and scored print discrimination.
  Letters, grammar, lesson count, core vocabulary and word targets unchanged. Integrated-engine acceptance remains driver-owned.'
- 'Integration, #8425: version 3 declares source glyph engine targets with attested whole single-letter video models; unsupported composite-video
  bindings use attributed print discrimination plus offline teacher practice. Source ledger: evidence/a1/_requests/integrate-a1-p1-p3-listening.md.'
- 'Full-access plan review repair round 1, #8425: introductions precede scoring; coherent varied-key listening, source-hosted sound classification
  and find-and-repair; accurate source roles and model declarations; earlier core recycling restored. P3 recap follows D4 with one mandatory first-person
  story and questions on that same host. Word targets and module objectives unchanged; learner-state generator repair remains separately owned
  by #9487.'
