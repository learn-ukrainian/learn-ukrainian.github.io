    title: 'привіт'
    kind: teach
    job: 'Hear an informal or formal first greeting and say the appropriate memorised response aloud.'
    rationale: 'D3 chunks come first by ear as in ULP S1 lessons 1–2; do not decode their unseen letters or analyse adjective, noun, or case forms. A 210-word target gives two short Ukrainian-first models, English context support, and explicit out-loud practice without padding.'
    word_target: 210
    inventory:
      grammar: []
      vocabulary:
        core:
          - {lemma: привіт, evidence: W-074, forms: ['noun:inanim:m:v_naz']}
          - {lemma: добрий, evidence: W-075, forms: ['adj:m:v_naz:compb']}
          - {lemma: день, evidence: W-076, forms: ['noun:inanim:m:v_naz']}
        incidental: []
        recycled: []
    steps:
      - id: s1
        kind: teach
        teach: 'Play the informal peer greeting; show its Ukrainian model before the English gloss; have the learner say the response aloud as an unanalysed D3 chunk, with no letter work.'
        introduces: {letters: [], grammar: [], vocabulary: [W-074]}
        uses: {grammar: [], vocabulary: []}
        evidence: [T-002, X-001, V-001, S-003]
        practice: [a1, a2]
        needs: [video]
      - id: s2
        kind: teach
        teach: 'Contrast the formal greeting by social situation, then play and repeat it aloud as a whole D3 chunk; do not parse its words.'
        introduces: {letters: [], grammar: [], vocabulary: [W-075, W-076]}
        uses: {grammar: [], vocabulary: [W-074]}
        evidence: [T-003, V-002, S-003]
        practice: [a3, a4]
        needs: [video]
    consolidation: [a5]
    activities:
      - {id: a1, type: watch-and-repeat, placement: inline, focus: 'Hear and say the informal greeting aloud; practised offline — not machine-verified.', model: X-001}
      - {id: a2, type: quiz, placement: inline, focus: 'Select the greeting just heard in an informal exchange, using a source-hosted comprehension choice.', model: X-001}
      - {id: a3, type: watch-and-repeat, placement: inline, focus: 'Hear and say the formal greeting aloud in a new situation; practised offline — not machine-verified.', model: X-001}
      - {id: a4, type: quiz, placement: inline, focus: 'Select the greeting appropriate for a formal setting; keep the full phrase intact.'}
      - {id: a5, type: quiz, placement: workbook, focus: 'Choose the appropriate whole greeting chunk across distinct sourced situations (meeting a friend or close family from T-002, speaking with a receptionist or teacher from T-003 and ULP lesson 2); requires independent communicative decisions without spelling.'}
