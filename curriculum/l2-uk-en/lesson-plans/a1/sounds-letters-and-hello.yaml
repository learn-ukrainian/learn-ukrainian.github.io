plan_schema: 2
module: sounds-letters-and-hello
level: a1
sequence: 2
slug: sounds-letters-and-hello
version: '10.0'
title: Привіт!
subtitle: Useful spoken greetings, staged sound-letter links, stress and speech melody
focus: Adult first encounters with English scaffolding; full alphabet overview, twelve acquired letters, fixed oral
  greetings and courtesy, and supported recognition of acquired print.
objectives:
- Choose and say a suitable greeting, courtesy chunk and farewell for a real recipient.
- Distinguish hearing a sound from reading a letter, using the full alphabet as an overview while acquiring only
  the declared twelve letters.
- Recognise acquired capital/small-letter forms and read a familiar greeting after all of its letters are available.
- Use source-modelled stress and statement, question and exclamation contours in familiar speech.
connects_to:
- who-am-i
prerequisites:
- introduction-to-ukrainian
register: neutral
changelog:
- '10.0 (2026-10-30): Independently authored replacement under #8425 and A1 arc r6; supersedes the exact-byte retired
  position-1 plan without using its lesson content.'
