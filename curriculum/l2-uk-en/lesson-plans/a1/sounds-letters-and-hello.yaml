  - n: 2
    slug: sounds-and-letters
    title: 'звук і літера'
    kind: teach
    job: 'Tell an audible sound from a visible letter and recognise and copy А, О, У, И in primer order.'
    rationale: 'The primer names what one hears before what one sees, then introduces these four vowels in this order; this lesson owns the sound/letter contrast, leaving sound classes and blending for the next lesson. A 240-word target covers one explanation and four brief letter models with notebook instructions.'
    word_target: 240
    inventory:
      phonetics: {letters: [А, О, У, И], sounds: []}
      grammar:
        - {id: G-a1-001, point: 'An audible sound and a visible letter are different units, even when a letter represents that sound.', evidence: [T-001, T-006]}
      vocabulary:
        core:
          - {lemma: звук, evidence: W-077, forms: ['noun:inanim:m:v_naz:xp1']}
          - {lemma: літера, evidence: W-078, forms: ['noun:inanim:f:v_naz']}
          - {lemma: чути, evidence: W-086, forms: ['verb:imperf:inf:insert:predic']}
          - {lemma: бачити, evidence: W-087, forms: ['verb:imperf:inf']}
        incidental: []
        recycled: []
    steps:
      - id: s1
        kind: teach
        teach: 'First listen to a sound, then look at its symbol; teach the hear and see infinitives as lexical action labels and name the sound/letter distinction without asking the learner to read an untaught word or conjugate a verb.'
        introduces: {letters: [], grammar: [G-a1-001], vocabulary: [W-077, W-078, W-086, W-087]}
        uses: {grammar: [], vocabulary: []}
        evidence: [T-001, T-006, X-002]
        practice: [a1, a2]
      - id: s2
        kind: teach
        teach: 'Present А, О, У, И one at a time in primer order: hear the sound, see the letter, trace it, then copy it into a notebook.'
        introduces: {letters: [А, О, У, И], grammar: [], vocabulary: []}
        uses: {grammar: [G-a1-001], vocabulary: [W-077, W-078]}
        evidence: [T-006, T-007, T-008, T-009, S-002]
        practice: [a3, a4]
    consolidation: [a5, a6]
    activities:
      - {id: a1, type: observe, placement: inline, focus: 'Notice the primer contrast between heard sound and visible letter.', model: X-002}
      - {id: a2, type: quiz, placement: inline, focus: 'Choose whether a presented unit is heard or seen, from the primer model.', model: X-002}
      - {id: a3, type: watch-and-repeat, placement: inline, focus: 'Hear and repeat the four vowel sounds in primer order.'}
      - {id: a4, type: letter-grid, placement: inline, focus: 'Find А, О, У, И and copy each shape into a notebook; copying practised offline — not machine-verified.'}
      - {id: a5, type: quiz, placement: workbook, focus: 'Select the letter matching a replayed sound, with each choice grounded in its primer record.'}
