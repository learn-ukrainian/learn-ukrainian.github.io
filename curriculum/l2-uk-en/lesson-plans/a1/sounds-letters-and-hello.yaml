    videos:
      - {evidence: V-011, use: 'Step s1 pronunciation model for consonant В.'}
      - {evidence: V-012, use: 'Step s2 pronunciation model for consonant Л.'}
      - {evidence: V-013, use: 'Step s2 pronunciation model for consonant С.'}
