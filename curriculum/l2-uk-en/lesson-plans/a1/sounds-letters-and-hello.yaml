      - {id: a4, type: pick-syllables, placement: inline, focus: 'Select a missing syllable in a newly decodable short word.', model: X-004}
      - {id: a5, type: quiz, placement: workbook, focus: 'Select the consonant letter (В, Л, or С) matching a replayed sound, modeled on the sound-to-letter choice of lesson 2 a5.'}
