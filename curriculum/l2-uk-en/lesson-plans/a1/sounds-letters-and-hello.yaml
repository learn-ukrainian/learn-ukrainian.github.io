  title: 'звук і літера'
  kind: teach
  job: 'Tell an audible sound from a visible letter and recognise and copy А, О, У, И in primer order.'
  rationale: 'The primer names what one hears before what one sees, then introduces these four vowels in this order; this lesson owns
    the sound/letter contrast, leaving sound classes and blending for the next lesson. A 240-word target covers one explanation and
    four brief letter models with notebook instructions.'
  word_target: 240
  inventory:
    phonetics: {letters: [А, О, У, И], sounds: []}
    grammar:
    - {id: G-a1-001, point: 'An audible sound and a visible letter are different units, even when a letter represents that sound.',
      evidence: [T-001, T-006]}
    vocabulary:
      core:
      - {lemma: звук, evidence: W-077, forms: ['noun:inanim:m:v_naz:xp1']}
      - {lemma: літера, evidence: W-078, forms: ['noun:inanim:f:v_naz']}
      - {lemma: чути, evidence: W-086, forms: ['verb:imperf:inf:insert:predic']}
      - {lemma: бачити, evidence: W-087, forms: ['verb:imperf:inf']}
      incidental: []
      recycled: []
  steps:
  - id: s1
    kind: teach
    teach: 'First listen to a sound, then look at its symbol; teach the hear and see infinitives as lexical action labels and name the
      sound/letter distinction without asking the learner to read an untaught word or conjugate a verb.'
    introduces: {letters: [], grammar: [G-a1-001], vocabulary: [W-077, W-078, W-086, W-087]}
    uses: {grammar: [], vocabulary: []}
    evidence: [T-001, T-006]
    practice:
    - a1
  - id: s2
    kind: teach
    teach: 'Present А, О, У, И one at a time in primer order: hear the sound, see the letter, trace it, then copy it into a notebook.
      Replay the lesson-listed V/T single-letter target pairs before the scored items; no exact primer syllable or word audio is inferred.'
    introduces: {letters: [А, О, У, И], grammar: [], vocabulary: []}
    uses: {grammar: [G-a1-001], vocabulary: [W-077, W-078]}
    evidence: [T-006, T-007, T-008, T-009, V-004, V-005, V-006, V-007, S-002, T-022, T-023, T-024, T-025]
    practice: [a3, a4]
    needs: [video]
  - id: "s3"
    kind: practice
    teach: 'After all four vowels are introduced in s2, display the T-022 capital/small heading before a2. Ask whether the displayed
      unit is a visible letter or a heard sound, with paired English support; the teacher supplies the sound offline. Before workbook
      a6, use the same shown heading to distinguish a matching capital/small pair from a different taught vowel glyph. No audible syllable
      or vocabulary decoding is scored.'
    uses:
      grammar: []
      vocabulary: []
    evidence:
    - T-022
    practice:
    - a2
    needs:
    - quote
  consolidation: [a5, a6]
  activities:
  - {id: a1, type: observe, placement: inline, focus: 'Notice the primer contrast between heard sound and visible letter.'}
  - {id: a2, type: quiz, placement: inline, focus: 'Choose whether a presented unit is heard or seen, from the primer model. Required
      item kind: comprehension; quote host refs T-022 must be displayed before this activity, with attribution. Stem/options depend
      on the displayed print; no new source prose or premium-note quote.'}
  - {id: a3, type: watch-and-repeat, placement: inline, focus: 'Hear and repeat the four vowel sounds in primer order.'}
  - {id: a4, type: letter-grid, placement: inline, focus: 'Find А, О, У, И and copy each shape into a notebook; copying practised offline
      — not machine-verified.'}
  - {id: a5, type: quiz, placement: workbook, focus: "Select the letter matching a replayed sound, with each choice grounded in its primer record. Required item kind: listening; each item binds host {kind: video, ref: V-id} and a target_record equal to the source glyph (not the T-id); the aligned video/print-evidence pairs are: V-004/T-022, V-005/T-023, V-006/T-024, V-007/T-025. Present its video block before the item; choices are taught single glyphs, never words, sound-class labels, letter names or a whole greeting. Each dedicated single-letter recording uses segment: null for the whole letter model; independent replay remains driver-owned. The scored answer is only the supported taught glyph, never a sound-class label, English letter name, word meaning or multiword response; classification and Latin-shape discussion remain offline teaching."}
