    kind: teach
    teach: 'Introduce and play the formal V-002 greeting as the intact W-075+W-076 chunk, then contrast it with W-074 by social situation before
      a4. T-002 grounds boss/cashier boundaries; T-020 grounds the receptionist. T-021 establishes only that a teacher is a formal addressee,
      not a greeting quotation. Repeat and give the matching spoken response on X-001. ULP records remain explains-only; premium notes are never
      quoted.'
