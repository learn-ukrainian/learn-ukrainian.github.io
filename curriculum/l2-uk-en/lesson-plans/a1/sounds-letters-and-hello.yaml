plan_schema: 2
module: sounds-letters-and-hello
level: a1
sequence: 1
slug: sounds-letters-and-hello
version: '8'
title: 'звук, літера, привіт'
subtitle: 'First greetings and the first 13 letters'
focus: 'Hear and say greeting chunks, distinguish sounds from letters, and read and copy syllables and short words using the first primer letter group.'
objectives:
- 'Respond aloud to familiar and formal greeting chunks heard before their spelling is taught.'
- 'Distinguish what is heard from what is seen and distinguish vowels from consonants.'
- 'Read the 13 letters in primer order, then CV and CVC syllables and short decodable words.'
- 'Copy taught letters and words, and copy a sourced personal name or one’s own written name model into a notebook; this writing is offline practice.'
connects_to: []
prerequisites: []
register: 'English scaffolding at A1; Ukrainian models first, then English glosses.'
changelog:
  ['Position-1 plan package updated after claude-att-4 review: added dedicated practice and step for letter N in lesson 3, expanded workbook decodable words and names, resolved lesson 1 match-up overlap, sustained vowel/consonant contrast through lessons 4-6, differentiated workbook activity pairs, added affirmative particle tak for recap questions, restricted recap copying to taught letters, moved rika to incidental, and dropped misplaced model X-002 in lesson 2.', 'Position-1 plan package updated after claude-att-5 review: added decodable words and names (kosa, Pavlyk, Polina, Panas) for letters K and P in lesson 5, listed affirmative particle tak as lesson 6 incidental, recycled malyna, slyva, and Ivan in lesson 6 recap, changed lesson 3 a8 to odd-one-out to ensure distinct discriminating tasks, and added ULP lesson 2 pack records T-020 and T-021 for formal situations cited in lesson 1 a5.', 'Position-1 plan package updated after claude-att-6 review: framed formal greeting situations (boss, cashier from T-002; receptionist from T-020; teacher from T-021) dropping colleague in lesson 1 a5 and step s2; demoted kosa to incidental in lesson 5 and removed it from a7 gloss matching; dropped animal name Ava (W-095); demoted the seven proper names (Nina, Nonna, Ivan, Vova, Pavlyk, Polina, Panas) from core to incidental decoding material across lessons 3-5 and updated lesson 6 recap.', 'Round 2, #8425: earlier authentic-text/planned-dialogue hosts (superseded by the mandatory D4 story in version 5); ULP notes grounding only; complete word-row admission; explicit native single-letter bindings; exact-row/word/sentence/name audio gaps converted to print with offline teacher modeling and scored print discrimination. Letters, grammar, lesson count, core vocabulary and word targets unchanged. Integrated-engine acceptance remains driver-owned.', 'Full-access plan review repair round 1, #8425: introductions precede scoring; coherent varied-key listening, source-hosted sound classification and find-and-repair; accurate source roles and model declarations; earlier core recycling restored. P3 recap follows D4 with one mandatory first-person story and questions on that same host. Word targets and module objectives unchanged; learner-state generator repair remains separately owned by #9487.', 'Round-2 full-access review repair, #8425: mandatory first-person bilingual recap hosts before comprehension and production; source-computed varied keys, evidence-complete activity packets, explicit counting, clean public quote spans, one video per URL and source-qualified Latin claims. Word targets unchanged.', 'Step-decodability sweep: the seven Ukrainian metalanguage/action lexical records whose letters are unavailable at position 1 move to their first decodable steps in position 2. Position-1 literacy distinctions retain English scaffolding and the same objectives. W-089 uses verified decodable past chunks, never its unreadable infinitive; no grammatical system is added.', The Latin-claim sweep also removes unsupported position-1 sound equivalences and visual-trap claims; native primer/audio reading jobs remain unchanged. No new correspondence is inferred from glyph resemblance., 'Round-3 full-access review repair, #8425: single quote displays, used incidental inventories, required greeting recall, explicit print modeling, source-bound recap keys and taught-letter distractors. Word targets and objectives unchanged.', 'Round 5: resolve recorded review findings and deterministic gate hits with scoped cues, source bindings and sequencing; objectives and word targets unchanged.']
