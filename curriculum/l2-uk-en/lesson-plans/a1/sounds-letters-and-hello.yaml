  - n: 5
    slug: last-letters-and-name
    title: 'К, П, Р'
    kind: teach
    job: 'Read and copy the final three letters and short words, then copy a sourced model name from a written model into a notebook.'
    rationale: 'The primer gives К, П, Р in this order and progresses from syllable grids to short connected text and notebook copying; Р/P is another Latin-shape trap (after Н and В), while К reads alike. The B1 noun ріка is included as an incidental minimal pair with core рука to contrast the vowel sounds [і] and [у] in an otherwise identical decodable frame. Workbook practice progresses from syllable division in the previous lesson to active syllable assembly and a cumulative match-up of all taught core decodable words. A 290-word target supports the final sound rows, short-word reading, and the separate offline name-copy instruction.'
    word_target: 290
    inventory:
      phonetics: {letters: [К, П, Р], sounds: []}
      grammar: []
      vocabulary:
        core:
          - {lemma: рука, evidence: W-084, forms: ['noun:inanim:f:v_naz']}
        incidental:
          - {lemma: ріка, evidence: W-085}
        recycled: [W-079, W-080, W-081, W-082, W-083, W-089]
    steps:
      - id: s1
        kind: teach
        teach: 'Add К and П in primer order, classifying them as consonants; hear and read new CV, VC, then CVC combinations, keeping the source words inside the taught inventory.'
        introduces: {letters: [К, П], grammar: [], vocabulary: []}
        uses: {grammar: [G-a1-001, G-a1-002], vocabulary: [W-079, W-080]}
        evidence: [T-016, T-017, X-003, V-014, V-015]
        practice: [a1, a2]
        needs: [video]
      - id: s2
        kind: teach
        teach: 'Add Р and read short words, contrasting рука with the incidental minimal pair ріка, and naming the soft sound heard before І without explaining the formal palatalization system; explicitly override the Latin P-looking shape with the primer Р sound, then copy the model words and a sourced personal name model by eye into a notebook (or one’s own name from a provided model).'
        introduces: {letters: [Р], grammar: [], vocabulary: [W-084]}
        uses: {grammar: [G-a1-002], vocabulary: [W-081, W-082, W-083, W-089]}
        evidence: [T-018, X-005, V-016, S-001, S-002]
        practice: [a3, a4, a5]
        needs: [video]
    consolidation: [a6, a7]
    activities:
      - {id: a1, type: letter-grid, placement: inline, focus: 'Read and copy К and П syllable rows into a notebook; copying practised offline — not machine-verified.', model: X-003}
      - {id: a2, type: pick-syllables, placement: inline, focus: 'Pick CV or VC syllables for the new letter group.', model: X-004}
      - {id: a3, type: watch-and-repeat, placement: inline, focus: 'Hear and repeat Р before reading its Latin P-looking shape.'}
      - {id: a4, type: quiz, placement: inline, focus: 'Choose the Ukrainian sound for Р from the primer model, not the Latin-shape guess, and classify the sound as a consonant.'}
      - {id: a5, type: letter-grid, placement: inline, focus: 'Display model words and a sourced personal-name copying frame; copy both by hand, not into a keyboard; practised offline — not machine-verified.', model: X-005}
      - {id: a6, type: pick-syllables, placement: workbook, focus: 'Complete newly readable short words and names by selecting missing syllables formed with К, П, and Р; progresses from syllable division to active word completion.', model: X-004}
      - {id: a7, type: match-up, placement: workbook, focus: 'Match taught core decodable word forms (мама, малина, слива, рука) to English glosses using bound W records; drills only core decodable vocabulary.'}
    videos:
      - {evidence: V-014, use: 'Step s1 pronunciation model for consonant К.'}
      - {evidence: V-015, use: 'Step s1 pronunciation model for consonant П.'}
      - {evidence: V-016, use: 'Step s2 pronunciation model for consonant Р.'}
    practice: {vocabulary: core, stress: [], patterns: [a2, a4, a6, a7]}

  - n: 6
    slug: first-letters-recap
    title: 'повторення'
    kind: recap
    job: 'Use a short first-person bilingual story to recognise the greetings and taught words, answer Ukrainian-only questions, and copy decodable model lines written with taught letters and a model personal name offline.'
    rationale: 'ULP S1 lesson 10 supplies the first-person side-by-side review shape; this recap introduces no language system or letter and recycles previously taught word records including greetings, sound-letter terms, and vowel/consonant categories. A 170-word target keeps the story and English alignment short, leaving the production task as notebook copying rather than unsupported machine scoring.'
    word_target: 170
    inventory:
      grammar: []
      vocabulary:
        core: []
        incidental: [{lemma: повторення, evidence: W-090}]
        recycled: [W-074, W-075, W-076, W-077, W-078, W-079, W-080, W-081, W-084, W-086, W-087, W-088, W-089]
    steps:
      - id: s1
        kind: recap
        teach: 'Show a short first-person Ukrainian story beside aligned English about hearing greetings (both informal привіт and formal добрий день), distinguishing a sound (звук) from a letter (літера), distinguishing vowels (голосний) from consonants (приголосний), seeing and reading a taught word, and copying it; use only allowed W records, keep untaught verb forms as memorised forms, then ask Ukrainian-only questions about the story using known words and single letters in the form of selection choices between story words or letters, or polar intonation questions (answered with так or ні), before one offline production task: copy decodable lines written only with the 13 taught letters (e.g., with мама, малина, слива, рука) and a model personal name in a notebook.'
        uses: {grammar: [], vocabulary: [W-074, W-075, W-076, W-077, W-078, W-079, W-080, W-081, W-084, W-086, W-087, W-088, W-089]}
        evidence: [T-005, T-002, X-005, S-001, S-002]
        practice: [a1, a2, a3]
    activities:
      - {id: a1, type: observe, placement: inline, focus: 'Display the short Ukrainian-left and English-right first-person story; unscored reading support.'}
      - {id: a2, type: quiz, placement: inline, focus: 'Ask Ukrainian-only comprehension questions about the story using selection choices between story words or letters, or polar intonation questions (including answers with так or ні); score recognition only.'}
      - {id: a3, type: letter-grid, placement: inline, focus: 'Display the decodable recap lines written only with the 13 taught letters and the model name frame for one notebook production task: copy the lines and model name; practised offline — not machine-verified.', model: X-005}
    practice: {vocabulary: core, stress: [], patterns: [a2]}
