    word_target: 250
    inventory:
      phonetics: {letters: [В, Л, С], sounds: []}
      grammar: []
      vocabulary:
        core:
          - {lemma: малина, evidence: W-082, forms: ['noun:inanim:f:v_naz']}
          - {lemma: слива, evidence: W-083, forms: ['noun:inanim:f:v_naz']}
          - {lemma: писати, evidence: W-089, forms: ['verb:imperf:inf']}
          - {lemma: Іван, evidence: W-093, forms: ['noun:anim:m:v_naz:prop:fname']}
          - {lemma: Вова, evidence: W-094, forms: ['noun:anim:m:v_naz:prop:fname']}
          - {lemma: Ава, evidence: W-095, forms: ['noun:anim:f:v_naz:prop:fname']}
        incidental: []
        recycled: [W-079, W-080, W-081, W-088]
    steps:
      - id: s1
        kind: teach
        teach: 'Add В after the known letters, classifying it as a consonant; have the English reader check its primer sound rather than the Latin B shape, alongside the look-and-read-alike А, О, М examples.'
        introduces: {letters: [В], grammar: [], vocabulary: []}
        uses: {grammar: [G-a1-001, G-a1-002], vocabulary: [W-079, W-080]}
