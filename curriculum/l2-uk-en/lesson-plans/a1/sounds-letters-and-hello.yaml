    task:
      id: chosen-first-encounter
      action: select_for_context
      context_en: Choose a familiar peer or an unfamiliar receptionist, and a real time of day. Decide what would
        make the exchange useful and courteous.
      instruction_en: Speak a short encounter using the greetings, courtesy chunks and farewell you have learned.
        Make a choice for your chosen recipient and situation, and give a suitable response. Then read the familiar
