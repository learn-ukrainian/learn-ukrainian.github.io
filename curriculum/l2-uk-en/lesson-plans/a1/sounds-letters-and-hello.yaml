    rationale: 'The primer names what one hears before what one sees, then introduces these four vowels in this order; this lesson owns the sound/letter contrast, leaving sound classes and blending for the next lesson. A 240-word target covers one explanation and four brief letter models with notebook instructions.'
    word_target: 240
    inventory:
      phonetics: {letters: [А, О, У, И], sounds: []}
      grammar:
        - {id: G-a1-001, point: 'An audible sound and a visible letter are different units, even when a letter represents that sound.', evidence: [T-001, T-006]}
      vocabulary:
        core:
          - {lemma: звук, evidence: W-077, forms: ['noun:inanim:m:v_naz:xp1']}
          - {lemma: літера, evidence: W-078, forms: ['noun:inanim:f:v_naz']}
          - {lemma: чути, evidence: W-086, forms: ['verb:imperf:inf:insert:predic']}
          - {lemma: бачити, evidence: W-087, forms: ['verb:imperf:inf']}
        incidental: []
        recycled: []
    steps:
      - id: s1
        kind: teach
        teach: 'First listen to a sound, then look at its symbol; teach the hear and see infinitives as lexical action labels and name the sound/letter distinction without asking the learner to read an untaught word or conjugate a verb.'
        introduces: {letters: [], grammar: [G-a1-001], vocabulary: [W-077, W-078, W-086, W-087]}
        uses: {grammar: [], vocabulary: []}
        evidence: [T-001, T-006]
        practice: [a1, a2]
      - id: s2
        kind: teach
        teach: 'Present А, О, У, И one at a time in primer order: hear the sound, see the letter, trace it, then copy it into a notebook.'
        introduces: {letters: [А, О, У, И], grammar: [], vocabulary: []}
        uses: {grammar: [G-a1-001], vocabulary: [W-077, W-078]}
        evidence: [T-006, T-007, T-008, T-009, V-004, V-005, V-006, V-007, S-002]
        practice: [a3, a4]
        needs: [video]
    consolidation: [a5, a6]
    activities:
      - {id: a1, type: observe, placement: inline, focus: 'Notice the primer contrast between heard sound and visible letter.'}
      - {id: a2, type: quiz, placement: inline, focus: 'Choose whether a presented unit is heard or seen, from the primer model.'}
      - {id: a3, type: watch-and-repeat, placement: inline, focus: 'Hear and repeat the four vowel sounds in primer order.'}
      - {id: a4, type: letter-grid, placement: inline, focus: 'Find А, О, У, И and copy each shape into a notebook; copying practised offline — not machine-verified.'}
      - {id: a5, type: quiz, placement: workbook, focus: 'Select the letter matching a replayed sound, with each choice grounded in its primer record.'}
      - {id: a6, type: odd-one-out, placement: workbook, focus: 'Select the visible letter that does not match a repeated heard-vowel model; source-hosted comprehension, not free typing.'}
    videos:
      - {evidence: V-004, use: 'Step s2 pronunciation model for letter А.'}
      - {evidence: V-005, use: 'Step s2 pronunciation model for letter О.'}
      - {evidence: V-006, use: 'Step s2 pronunciation model for letter У.'}
      - {evidence: V-007, use: 'Step s2 pronunciation model for letter И.'}
    practice: {vocabulary: core, stress: [], patterns: [a2, a5]}

  - n: 3
    slug: vowels-and-first-syllables
    title: 'М, І, Н'
    kind: teach
    job: 'Hear the vowel/consonant contrast, keep И distinct from І, and read first CV and VC syllables with М and Н.'
    rationale: 'A first consonant makes the two sound classes concrete; the primer places М, then І, then Н and supplies syllable tables, while ULP explains И to English speakers. A 290-word target supports three focused steps for sound contrasts, syllable tables with М and Н, and offline copying.'
    word_target: 290
    inventory:
      phonetics: {letters: [М, І, Н], sounds: []}
      grammar:
        - {id: G-a1-002, point: 'Vowels and consonants are different sound classes identified by hearing before sorting their letters.', evidence: [T-001, T-010]}
        - {id: G-a1-003, point: 'The two Ukrainian vowel letters introduced here represent different sounds and are not interchangeable.', evidence: [T-004, T-009, T-011]}
      vocabulary:
        core:
          - {lemma: голосний, evidence: W-079, forms: ['noun:inanim:m:v_naz']}
          - {lemma: приголосний, evidence: W-080, forms: ['noun:inanim:m:v_naz']}
          - {lemma: мама, evidence: W-081, forms: ['noun:anim:f:v_naz']}
          - {lemma: читати, evidence: W-088, forms: ['verb:imperf:inf']}
          - {lemma: Ніна, evidence: W-091, forms: ['noun:anim:f:v_naz:prop:fname']}
          - {lemma: Нонна, evidence: W-092, forms: ['noun:anim:f:v_naz:prop:fname']}
        incidental: []
        recycled: [W-077, W-078]
    steps:
      - id: s1
        kind: teach
        teach: 'Hear vowel and consonant sounds before assigning their letters; add М after the prior four vowels, teach the read infinitive as a lexical action label, then read the primer CV and VC rows and copy a first short word.'
        introduces: {letters: [М], grammar: [G-a1-002], vocabulary: [W-079, W-080, W-081, W-088]}
        uses: {grammar: [G-a1-001], vocabulary: [W-077, W-078]}
        evidence: [T-001, T-010, X-002, X-003, V-008]
        practice: [a1, a2]
        needs: [video]
      - id: s2
        kind: teach
        teach: 'Add І after the known vowels, compare И and І by listening and by the two visible symbols, and recognise them in short syllables.'
        introduces: {letters: [І], grammar: [G-a1-003], vocabulary: []}
        uses: {grammar: [G-a1-002], vocabulary: []}
        evidence: [T-004, T-009, T-011, V-003, V-009]
        practice: [a3, a4]
        needs: [video]
      - id: s3
        kind: teach
        teach: 'Add Н, read first CV and VC syllables with Н alongside decodable names, check the Latin-looking Н shape against its Ukrainian [н] sound rather than English H, and name the second soft sound without explaining the later soft-consonant system.'
        introduces: {letters: [Н], grammar: [], vocabulary: [W-091, W-092]}
        uses: {grammar: [G-a1-001, G-a1-002], vocabulary: [W-081]}
        evidence: [T-012, T-019, X-003, V-010]
        practice: [a5, a6]
        needs: [video]
    consolidation: [a7, a8]
    activities:
      - {id: a1, type: quiz, placement: inline, focus: 'Select vowel or consonant for a sound heard in the primer model.', model: X-002}
      - {id: a2, type: letter-grid, placement: inline, focus: 'Read first М+vowel and vowel+М rows, then copy the grid and model word into a notebook; copying practised offline — not machine-verified.', model: X-003}
      - {id: a3, type: watch-and-repeat, placement: inline, focus: 'Hear and repeat distinct И and І sounds before reading their symbols.'}
      - {id: a4, type: quiz, placement: inline, focus: 'Select И or І after a source-modeled contrast, without unsupported spelling distractors.'}
      - {id: a5, type: letter-grid, placement: inline, focus: 'Read Н+vowel and vowel+Н rows on the primer syllable pattern, then copy the grid and model names into a notebook; copying practised offline — not machine-verified.', model: X-003}
      - {id: a6, type: quiz, placement: inline, focus: 'Choose the Ukrainian sound for Н from the primer model, rejecting the Latin-shape guess.'}
      - {id: a7, type: pick-syllables, placement: workbook, focus: 'Choose syllables built from the taught letters to complete the decodable word мама and model names Ніна and Нонна.', model: X-003}
      - {id: a8, type: count-syllables, placement: workbook, focus: 'Count sounded syllables in the taught decodable word and model names (мама, Ніна, Нонна), using vowels as a reading aid rather than teaching stress.'}
    videos:
      - {evidence: V-003, use: 'Step s2 listening model for the И sound before its contrast with І.'}
      - {evidence: V-008, use: 'Step s1 pronunciation model for consonant М.'}
      - {evidence: V-009, use: 'Step s2 pronunciation model for vowel І.'}
      - {evidence: V-010, use: 'Step s3 pronunciation model for consonant Н.'}
    practice: {vocabulary: core, stress: [], patterns: [a1, a4, a6, a7]}

