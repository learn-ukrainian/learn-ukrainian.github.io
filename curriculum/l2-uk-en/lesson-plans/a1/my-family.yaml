slug: my-family
version: '1.0'
title: родина
subtitle: A chosen family photo, supported labels and the apostrophe
focus: Introduce people in a chosen family photo or equivalent using supported possessive phrases Adult
  or teen situations retain English support. Private-book wording is not teaching material. Unresolved
  formula ids remain withheld from teaching and scoring.
objectives:
- Introduce selected people or a pet using supported possessive chunks.
- Acquire the five staged letters and use the apostrophe in a source-attested family word.
- Distinguish the b/p family and write meaningful supported captions.
