    task:
      id: my-chosen-circle-task
      action: personalize
      context_en: A new acquaintance asks about a photo. Choose your own photo, a fictional family or
        an equivalent trusted circle; you do not have to disclose personal relationships.
      instruction_en: Choose the people or pet you want to introduce. Say the acquired labels with the
        practised possessive chunks, then write short supported captions. Read a partner’s chosen captions
        and identify the intended people. Change one relationship or owner and adapt a label rather than
        copying the model.
      response_mode: spoken_or_written
      success_criteria_en:
      - The chosen labels identify the intended people or pet.
      - The possessive-label chunks match the intended speaker and recipient.
      - The source-attested family word keeps its apostrophe and separate pronunciation.
      - A partner can match the supported captions to the chosen photo.
      learner_reads:
      - ref: T-303
        words:
        - твоя мама
        - моя мама
