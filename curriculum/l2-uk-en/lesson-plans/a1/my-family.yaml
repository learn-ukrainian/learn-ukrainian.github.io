  title: родина
  kind: teach
  job: Identify chosen people with supported family labels and recognise the five new letters.
  rationale: A chosen family, trusted circle or fictional photo avoids assumptions about household or
    relationships. Possessives are supported label chunks here, not an agreement lesson. English explains
    the task and the source-grounded model. Spoken rehearsal precedes supported print. New words are chosen
    for this adult purpose rather than to fill a vocabulary quota; no activity prompt gives its answer,
    and choice order is shuffled.
