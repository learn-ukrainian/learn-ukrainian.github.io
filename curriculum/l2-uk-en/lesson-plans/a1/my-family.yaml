  slug: family-and-apostrophe
  title: сім’я
  kind: teach
  job: Read a familiar family word with the apostrophe and label children in a chosen family context.
  rationale: Separate pronunciation has an immediate use in a familiar family label. The source rules
    are reduced to the encountered pattern; no exhaustive spelling exceptions or line-break drills appear.
    English explains the task and the source-grounded model. Spoken rehearsal precedes supported print.
    New words are chosen for this adult purpose rather than to fill a vocabulary quota; no activity prompt
    gives its answer, and choice order is shuffled.
  inventory:
    phonetics:
      letters: &id004 []
      sounds: []
    grammar:
    - id: G-a1-020
