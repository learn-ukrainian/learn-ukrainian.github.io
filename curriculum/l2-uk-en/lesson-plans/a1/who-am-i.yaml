slug: who-am-i
version: '1.0'
title: Мене звати...
subtitle: Names, occupations, origin models, softness and syllables
focus: Introduce yourself and ask identity; common professions and origin phrases Adult or teen situations
  retain English support. Private-book wording is not teaching material. Unresolved formula ids remain
  withheld from teaching and scoring.
objectives:
- Introduce yourself or a chosen persona with a name, common profession and supported origin phrase.
- Acquire the nine declared letters and distinguish the staged hard/soft and voiced/voiceless contrasts.
- Use spoken syllables and verified stress to make a first introduction clear.
