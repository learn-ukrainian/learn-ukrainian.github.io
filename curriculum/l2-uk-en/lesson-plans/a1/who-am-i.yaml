    task:
      id: my-first-introduction-task
      action: personalize
      context_en: You are meeting a new participant at a community course. Use your own details or a sourced
        fictional profile; sharing personal information is optional.
      instruction_en: Choose a greeting, give a name and an appropriate occupation or student label, add
        the practised origin model, and choose a suitable farewell. Say the exchange with a partner, then
        write a supported name badge using acquired letters. Change the profile and repeat without copying
        a whole model.
      response_mode: spoken_or_written
      success_criteria_en:
      - The chosen name identifies the intended person.
      - The occupation and origin match the chosen profile.
      - The greeting and farewell fit the relationship.
      - A partner can distinguish the practised consonant families and stress.
      - The supported badge communicates the selected name.
      learner_reads: []
