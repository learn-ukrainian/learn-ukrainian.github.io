plan_schema: 2
module: special-signs
level: a1
sequence: 3
slug: special-signs
version: '8'
title: літери
subtitle: 'Finish the alphabet: eight remaining letters, two digraphs, the apostrophe, hard/soft sounds and dictionary order'
focus: Finish the primer letter sequence, practise each new item in source words by listening, reading aloud and notebook copying, then use the full alphabet
  table.
objectives:
- Hear hard and soft source consonant models and read and copy the held-back soft sign before the two-value vowels.
- Read and copy all eight remaining letters in primer order, both values of Я, Ю and Є, always-two-sound Ї and Щ, both joined digraphs and the apostrophe.
- Read a whole sourced apostrophe-bearing sentence aloud after all its written items are taught.
- Say sourced letter names in dictionary order, connect capital and small letters, and copy a name model or one’s own written name offline.
connects_to:
- sounds-letters-and-hello
- reading-ukrainian
prerequisites:
- sounds-letters-and-hello
- reading-ukrainian
register: Ukrainian models first with English support at A1; pronunciation before print; no free Cyrillic typing.
changelog:
  ['First position-3 v2 plan package: six primer teaching groups, a separate alphabet retrieval lesson and the required recap. The two historical unsupported records remain resolved in the provisional pack under the driver amendments.', 'Round 2, #8425: earlier authentic-text/planned-dialogue hosts (superseded by the mandatory D4 story in version 5); ULP notes grounding only; complete word-row admission; explicit native single-letter bindings; exact-row/word/sentence/name audio gaps converted to print with offline teacher modeling and scored print discrimination. Letters, grammar, lesson count, core vocabulary and word targets unchanged. Integrated-engine acceptance remains driver-owned.', 'Integration, #8425: version 3 declares source glyph engine targets with attested whole single-letter video models; unsupported composite-video bindings use attributed print discrimination plus offline teacher practice. Source ledger: evidence/a1/_requests/integrate-a1-p1-p3-listening.md.', 'Full-access plan review repair round 1, #8425: introductions precede scoring; coherent varied-key listening, source-hosted sound classification and find-and-repair; accurate source roles and model declarations; earlier core recycling restored. P3 recap follows D4 with one mandatory first-person story and questions on that same host. Word targets and module objectives unchanged; learner-state generator repair remains separately owned by #9487.', 'Round-2 full-access review repair, #8425: mandatory first-person bilingual recap hosts before comprehension and production; source-computed varied keys, evidence-complete activity packets, explicit counting, clean public quote spans, one video per URL and source-qualified Latin claims. Word targets unchanged.', 'Round-3 P3 repair, #8425: nine review findings, single quote displays, learner-facing resource purposes, bounded formal greeting, sourced fresh workbook models, personal/place-name coverage, listening concealment and a recap containing only previously modeled story/question chunks. Objectives and every word target unchanged; no engine or decision-source change.', 'Round 5: resolve recorded review findings and deterministic gate hits with scoped cues, source bindings and sequencing; objectives and word targets unchanged.']
