plan_schema: 2
module: special-signs
level: a1
sequence: 3
slug: special-signs
version: '2'
title: літери
subtitle: 'Finish the alphabet: eight remaining letters, two digraphs, the apostrophe, hard/soft sounds and dictionary order'
focus: Finish the primer letter sequence, practise each new item in source words by listening, reading aloud and notebook copying,
  then use the full alphabet table.
objectives:
- Hear hard and soft source consonant models and read and copy the held-back soft sign before the two-value vowels.
- Read and copy all eight remaining letters in primer order, both values of Я, Ю and Є, always-two-sound Ї and Щ, both joined
  digraphs and the apostrophe.
- Read a whole sourced apostrophe-bearing sentence aloud after all its written items are taught.
- Say sourced letter names in dictionary order, connect capital and small letters, and copy a name model or one’s own written name
  offline.
connects_to:
- sounds-letters-and-hello
- reading-ukrainian
prerequisites:
- sounds-letters-and-hello
- reading-ukrainian
register: Ukrainian models first with English support at A1; pronunciation before print; no free Cyrillic typing.
changelog:
- 'First position-3 v2 plan package: six primer teaching groups, a separate alphabet retrieval lesson and the required recap. The two
  historical unsupported records remain resolved in the provisional pack under the driver amendments.'
- 'Round 2, #8425: authorized authentic-text/planned-dialogue recap hosts; ULP notes grounding only; complete word-row admission; explicit
  native single-letter bindings; exact-row/word/sentence/name audio gaps converted to print with offline teacher modeling and scored
  print discrimination. Letters, grammar, lesson count, core vocabulary and word targets unchanged. Integrated-engine acceptance remains
  driver-owned.'
