  source roles and model declarations; earlier core recycling restored. P3 recap follows D4 with one mandatory first-person story and questions on that same host. Word targets
  and module objectives unchanged; learner-state generator repair remains separately owned by #9487.'
- 'Round-2 full-access review repair, #8425: mandatory first-person bilingual recap hosts before comprehension and production; source-computed varied keys, evidence-complete
  activity packets, explicit counting, clean public quote spans, one video per URL and source-qualified Latin claims. Word targets unchanged.'
- 'Round-3 P3 repair, #8425: nine review findings, single quote displays, learner-facing resource purposes, bounded formal greeting, sourced fresh workbook models, personal/place-name
