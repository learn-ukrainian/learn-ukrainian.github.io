texts:
- id: T-201
  quote: '§ 32. Приголосні тверді, м’які й пом’якшені

    § 32. ПРИГОЛОСНІ ТВЕРДІ, М’ЯКІ Й ПОМ’ЯКШЕНІ

    1. Вимовте пару слів лис — ліс і зробіть висновки на основі спостереження.

    А. Коли вимовляєте перший звук у цих словах, кінчик вашого язика торкається

    то до верхніх зубів, то до піднебіння. Переконайтеся в цьому,

    вимовивши цю пару слів кілька разів.

    Б. Зробіть висновок, як утворюється м’який приголосний, а як — твердий,

    заповнивши пропуски потрібними словами.

    Висновок. Коли кінчик язика торкається до зубів (вони тверді на дотик),

    то утворюється … звук, а коли до піднебіння (воно має м’яку поверхню), то

    … звук.

    Приголосні звуки бувають тверді й м’які. У звуковому записі (у тран-

    скрипції) м’які приголосні позначають рискою [′].

    Тверді приголосні (їх 22) М’які приголосні (їх 10)

    [д], [дз], [т], [з], [с], [ц], [л], [н], [р] [д′], [дз′], [т′], [з′], [с′], [ц′],

    [л′], [н′], [р′] та [й]

    а також: а) губні: [б], [п], [в], [м], [ф];

    б) шиплячі: [ж], [ч], [ш], [дж];

    в) [ґ], [к], [х], [г].

    –

    Губні, шиплячі, а також [ґ], [к], [х], [г] м’якими не бувають, вони мо-

    жуть бути лише частково м’якими, їх називають пом’якшеними (або

    напівпом’якшеними). Для позначення пом’якшення в транскрипції

    використовують апостроф [’]. Пом’якшеними вони стають перед:

    •

    [і]: білка [б’ілка], очі [оч’і];

    •

    [а], [у], [е], що на письмі позначені буквами я, ю, є: бюро [б’юро], кю-

    вет [к’увет].

    Зауважте!

    Тверді та м’які приголосні утворюють співвідносні пари: [д] — [д′], [т] —

    [т′], [з] — [з′] та ін. Щоб розрізняти їх, у звуковому записі використовують

    риску для позначення м’якого приголосного.

    Оскільки звук [й] завжди м’який (він твердим не буває), то й не має по-

    треби в транскрипції використовувати риску для позначення м’якості.

    75'
