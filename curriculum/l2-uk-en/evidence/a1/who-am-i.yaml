    19. ПРИГОЛОСНІ ДЗВІНКІ ТА ГЛУХІ

    Про те, які приголосні утворюємо з голосу та шуму,

    а які

    –

    лише із шуму, та про правильну вимову

    186.

    А. Прочитайте виразно слова парами. Чи однакові слова в парах

    за лексичним значенням?

    1. Хід – хіт. 2. Везти – вести. 3. Борт – порт.

    Б. Вимовте звуки, якими відрізняються слова в кожній парі. Які із цих

    звуків дзвінкі, а які – глухі?

    В. Поміркуйте про те, які звуки (дзвінкі чи глухі) утворені тільки із шуму

    (без голосу).

    Дзвінкі та глухі приголосні

    Дзвінкі приголосні – це звуки, утворені з голосу й шуму

    (з перевагою шуму).

    Глухі приголосні – це звуки, утворені тільки із шуму.

    Дзвінкі та глухі приголосні, крім [ф], утворюють пари.

    Дзвінкі б д д′ з з′ дз дз′ ж дж ґ г–

    Глухі п т т′ с с′ ц ц′ ш ч к х ф

    За межами глухих і дзвінких

    Звуки [в], [м], [н], [л], [р], [й], а також відповідні їм

    м’які [н′], [л′], [р′] не належать ні до дзвінких, ні до глухих.

    У цих звуках голос переважає над шумом.

    187. І. Прочитайте вголос слова. Знайдіть пару слів, які різняться лише

    одним звуком.

    Гриб, грип, флешка, жолудь, дзеркало, плоди, джаз,

    ґава.

    ІІ. У виділених словах замініть дзвінкі приголосні на парні їм глухі. Які

    слова утворилися?

    79'
