module: things-have-gender
level: a1
sequence: 8
slug: things-have-gender
version: '1.0'
title: Рід іменників
subtitle: Familiar belongings, noun gender and the complete singular possessive set
focus: Identify familiar belongings using noun gender and the complete singular possessive set, including
  наш, ваш, їхній Adult or teen situations retain English support. Private-book wording is not teaching
  material. Unresolved formula ids remain withheld from teaching and scoring.
objectives:
- Identify familiar belongings with sourced masculine, feminine and neuter singular noun classes.
- Use all singular-gender forms of my, your, our, polite/plural your and their.
- Use invariant his and her labels and distinguish owner meaning from noun agreement.
- Read and produce useful labels that allow another person to identify an object and its owner.
connects_to:
- what-is-it-like
prerequisites:
- checkpoint-first-contact
register: neutral
changelog:
- '1.0 (2026-10-31): Independently authored for #8425 steps 1-4 under the approved r6 arc. Plans only;
  no lesson builds.'
