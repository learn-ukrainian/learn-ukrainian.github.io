  slug: familiar-things-and-gender
  title: книжка
  kind: teach
  job: Identify familiar belongings and associate each singular noun with its sourced grammatical gender.
  rationale: A grammatical class belongs to the noun rather than to the physical object. Begin with a
    small, useful contrasting set; dictionary records settle it, so an ending is a clue rather than an
    infallible rule. English explains the task and the source-grounded model. Spoken rehearsal precedes
    supported print. New words are chosen for this adult purpose rather than to fill a vocabulary quota;
    no activity prompt gives its answer, and choice order is shuffled.
  inventory:
    phonetics:
      letters: &id001 []
      sounds: []
    grammar:
