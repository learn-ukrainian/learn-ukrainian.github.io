      id: our-shared-space-task
      action: personalize
      context_en: You and other adults share a work or study space. Choose a set of acquired objects and
        decide which belong to you, your partner, another person or a group.
      instruction_en: Read a partner’s acquired labels and return the objects to the intended owners.
        Create your own spoken or written labels for selected singular belongings. Change an owner and
        a noun, then adapt the labels. Include an invariant his/her label and an agreeing possessive label,
        and explain the choice using the noun’s sourced gender. Use the other acquired possessive families
        as needed for your chosen people.
      response_mode: spoken_or_written
      success_criteria_en:
      - The noun labels identify the intended familiar objects.
      - The possessive meaning identifies the intended owner.
      - Agreeing possessives match the possessed singular noun’s sourced gender.
      - His and her keep their form when the noun gender changes.
      - The partner can act on the labels to return an object.
      - The changed owner and noun lead to a newly chosen label rather than a copied model.
      learner_reads:
      - ref: T-702
        words:
        - мій
        - моя
        - моє
        - твій
        - твоя
        - твоє
        - наш
        - наша
        - наше
        - ваш
        - ваша
        - ваше
        - їхній
        - їхня
        - їхнє
