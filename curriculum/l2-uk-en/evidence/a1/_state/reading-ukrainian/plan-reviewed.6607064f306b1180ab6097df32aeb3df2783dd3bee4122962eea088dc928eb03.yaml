    task:
      id: my-useful-reading-route-task
      action: personalize
      context_en: You are preparing name badges and labels for a community event. Choose a sourced persona
        or your own name with the alphabet reference available.
      instruction_en: Choose useful labels, read them to a partner and place them next to the intended
        objects. Find a chosen name in an alphabetised mini-directory, match its printed and handwritten
        versions, and write the supported name and surname for a badge. Use the acquired proper-name and
        derived-word examples to check initial capitals. Explain which label you chose for your event.
      response_mode: spoken_or_written
      success_criteria_en:
      - A partner can identify the selected objects from the labels.
      - The chosen name can be found by alphabet order and spelled with letter names.
      - The printed and handwritten entries identify the same person.
      - The supported name and surname keep their capitals.
      - The source-grounded proper-name and derived-word distinction is applied.
      learner_reads:
      - ref: T-405
        words:
        - київський
      - ref: T-404
        words:
        - Україна
