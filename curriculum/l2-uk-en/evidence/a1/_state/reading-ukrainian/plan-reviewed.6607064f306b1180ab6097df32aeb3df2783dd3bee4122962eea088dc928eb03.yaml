slug: reading-ukrainian
version: '10.0'
title: Алфавіт
subtitle: Useful labels, complete letter acquisition and handwritten recognition
focus: Complete the alphabet through useful labels and short exchanges; decode unfamiliar combinations
  of taught letters Adult or teen situations retain English support. Private-book wording is not teaching
  material. Unresolved formula ids remain withheld from teaching and scoring.
objectives:
- Acquire the remaining seven letters and recognise the joined digraph sounds.
- Read useful labels and distinguish the completed consonant pairs.
- Use alphabet order, letter names, printed and handwritten forms, and supported capitalisation.
connects_to:
- first-conversations
prerequisites:
- my-family
register: neutral
