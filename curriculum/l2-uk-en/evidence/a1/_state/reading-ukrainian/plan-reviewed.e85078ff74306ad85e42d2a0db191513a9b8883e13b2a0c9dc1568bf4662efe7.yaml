  slug: whole-sentences-recap
  title: повторення
  kind: recap
  job: Hear a short first-person bilingual source story, answer Ukrainian-only questions about it by ear, read the two whole
    sourced sentences aloud, and copy decodable models plus an own-name model offline.
  rationale: The ULP review shape closes the module after all 25 letters; two whole primer sentences carry reading aloud
    and the notebook task carries writing. A 190-word target keeps the story and English alignment short while separating
    by-ear incidental language from decodable print.
  word_target: 190
  inventory:
    grammar: []
    vocabulary:
      core: []
      incidental:
      - lemma: прилетіти
        evidence: W-113
      - lemma: додому
        evidence: W-114
      - lemma: жабка
        evidence: W-115
      - lemma: ми
        evidence: W-006
      - lemma: ви
        evidence: W-007
      - lemma: не
        evidence: W-061
      - lemma: Іван
        evidence: W-093
      recycled:
      - W-074
      - W-075
      - W-076
      - W-081
      - W-101
      - W-104
      - W-109
      - W-110
      - W-118
      - W-087
  steps:
  - id: s1
    kind: recap
    teach: Open by hearing the intact W-075 and W-076 greeting chunk. Play V-004 and show the T-016 first-person story, Ukrainian
      left and English right; it opens with the whole greeting W-074, and the rest is heard as incidental language, never
      a reading or copying prompt. Ask the first three Ukrainian-only T-017 questions, whose answers are in the T-016 lines,
      by ear; questions and answer options are heard as by-ear items and never used as decoding targets, and each has a
      different correct answer. Then display EX-001 and EX-002 intact, have the learner read both aloud from print, copy
      these decodable lines, a few taught core words and the sourced W-093 name model, and write their own name from an
      already-written personal model in a notebook. The own-name task is offline and its spelling is never scored.
    uses:
      grammar: []
      vocabulary:
      - W-074
      - W-075
      - W-076
      - W-081
      - W-101
      - W-104
      - W-109
      - W-110
      - W-118
      - W-087
    evidence:
    - T-016
    - T-017
    - T-015
    - EX-001
    - EX-002
    - X-003
    - X-004
    - V-004
    practice:
    - a1
    - a2
    - a3
    - a4
    needs:
    - video
  activities:
  - id: a1
    type: observe
    placement: inline
    focus: Hear the complete first-person source sentences in V-004 while seeing their T-016 Ukrainian-left and English-right
      alignment; the story is by-ear only.
  - id: a2
    type: quiz
    placement: inline
    focus: Ask the first three Ukrainian-only T-017 questions about the heard story by ear, with heard answer options from
      T-017; each question has a different correct answer, and no item is a decoding task.
  - id: a3
    type: observe
    placement: inline
    focus: Read EX-001 and EX-002 whole aloud from print; practised offline — not machine-verified.
    model: X-003
  - id: a4
    type: letter-grid
    placement: inline
    focus: Copy EX-001 and EX-002 whole, the decodable core words W-101, W-104, W-109, W-110 and W-118, the sourced W-093
      name model, and one’s own name from an existing personal model into a notebook; practised offline — not machine-verified.
    model: X-004
  practice:
    vocabulary: core
    stress: []
    patterns:
    - a2
  videos:
  - evidence: V-004
    use: Step s1 source audio for the by-ear first-person review story.
