      and the primer, see its glyph, read its CV and VC row, then read W-101 as a whole decodable word and classify Т as
      a consonant. Т has the shape of Latin T, and T-021 shows Latin t (th) written with Т, so it is a read-alike letter.
      Once Т is known, W-074 is decodable; read it and copy it as a whole word.
    introduces:
      letters:
      - Т
      grammar: []
      vocabulary:
      - W-101
    uses:
      grammar:
      - G-a1-002
      vocabulary:
      - W-074
      - W-075
      - W-076
      - W-079
      - W-080
