    - T-001
    - X-001
    - X-004
    - V-001
    - T-021
    practice:
    - a1
    - a2
    needs:
    - video
  - id: s2
    kind: teach
    teach: Hear Е from V-005 and the primer, see its glyph, read its CV and VC rows, then read W-117 and the name W-102
      as whole decodable words and classify Е as a vowel. Е has the shape of Latin E, and T-021 shows Latin e written with
      Е in borrowed words; the learner reads it by the primer sound [е], not by an English letter name. W-102 is a name
      for decoding, not core vocabulary.
    introduces:
      letters:
      - Е
      grammar: []
      vocabulary: []
