  slug: t-and-e
  title: Т, Е
  kind: teach
  job: Read and copy Т and Е, their sound rows, and newly decodable whole words including the informal greeting.
  rationale: Two letters let the learner shift from position-1 word reading to a decodable greeting while keeping the primer
    sound-row-to-word cycle; Т is the first Latin-shaped letter here that reads alike, and Е the first that must be read by
    its primer sound. A 260-word target covers two sound rows, the whole greeting, and notebook prompts.
  word_target: 260
