    claim: "The main scored print-analysis quizzes for G-a1-005 and G-a1-007 show their own answer in the quote host, so a learner can pass them by matching symbols without applying the taught rule. search_text rr-7d26d298d2670b44943a (chunk 1-klas-bukvar-zaharijchuk-2025-1_s0100) shows that T-001 prints each word next to its scheme, e.g. 'синь [–• =]' and 'тин [–• – ]'. L1 a3 and a5 offer the options 'hard [–]' and 'soft [=]', so the last scheme symbol is the key. The same holds for L2 a4 and a6 and L3 a2, a4 and a5 (and L2 a2 with T-002/T-050): their hosts T-040, T-041, T-042, T-044 and T-045 already show [й] or ′ (e.g. [йама], [мал′а]). In the find-and-repair items (L2 a6, L3 a5) the correct option is the displayed host itself: T-045 '[ к у|й е ]' per search_text rr-492c2045418dab7dbbac. Fix: make the spelled source word the stimulus. Use the scheme or transcription as the options or as feedback after the answer, so the learner has to read ь, Я, Ю and Є from the spelling."
    evidence: { receipt: "rr-7d26d298d2670b44943a" }
    could_be_a_gate: "no"
