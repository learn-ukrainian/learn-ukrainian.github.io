  # each have a distinct job. L4 (three consonants, 360 words) runs one routine per letter. No lesson
  # crams too much, and none only repeats a neighbour's job.
  sizing: clean
  # Core їжа is A1 (query_cefr_level rr-3e3c258f356ba647dfee) and core дощ is A1 (rr-91d4f53edd00f6c0b113).
  # Primer decoding words stay incidental. P1 and P2 core words are recycled in L1 s3, L2 s3, L4 s4 and L4 a8.
  inventory: clean
  # Workbook types rotate across the 7 non-recap lessons: 8 types, and the longest same-type run is 2.
  # count-syllables in L2–L5 follows a stated progression: each new two-sound letter or digraph
  # adds no vowel nucleus. Mapped v1 module: 12 activities and 59 response opportunities
