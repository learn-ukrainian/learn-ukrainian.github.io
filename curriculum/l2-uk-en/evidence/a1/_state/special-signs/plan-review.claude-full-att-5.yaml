  # The title 'літери' is one Ukrainian word (verify_words rr-d6e4a5ccc82e49086e2b: літера, noun, plural nominative).
  # The subtitle, focus, objectives, jobs, rationales, teach texts, activity focuses, video uses and
  # dialogue fields are each one language. English sentences quote Ukrainian only for the item being taught.
  title_describes_job: clean
  # 'eight remaining letters' matches scope sidecar letters.count 8. 'two digraphs' (дж, дз) is not a sidecar inventory count.
  title_quantities: clean
  # verify_words rr-d6e4a5ccc82e49086e2b: 26 of 26 quoted forms (літери, алфавіт, повторення, тин, день,
  # мільярд, маля, кує, квітує, синє, моє, їжа, юрта, люпин, радію, дзиґа, дзюрчить, джміль, джем,
  # пюре, п'ю, пір'я, м'яч, пір'їна, Марія, мої) have marker-free analyses in the lesson sense
  # (кує and квітує: verb present 3rd person singular; радію: verb present 1st person singular;
  # дзиґа: inanimate feminine noun). The wrong fill-in completions (пю, піря, мяч, пірїна, п'юре) are
  # confirmed nonwords: verify_words rr-155506c01319fc24dabb.
  quoted_forms: clean
  sequencing:
    - F-2
    - F-5
