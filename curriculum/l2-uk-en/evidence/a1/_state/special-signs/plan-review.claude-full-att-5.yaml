  # activity count does not drop. Response opportunities are not available at plan stage; that is
  # a gap in the evidence, not a finding.
  activities:
    - F-1
    - F-4
  # Confirmed: Pravopys 2019 §49.1 (query_pravopys rr-b2fb9c55e2d8e7da9841), §50.1 and §50.6
  # (rr-4b0e8d86d42bf9a1db5e), and the T-001 quote (search_text rr-7d26d298d2670b44943a).
  evidence_fit:
