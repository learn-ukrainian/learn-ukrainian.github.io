findings:
  - id: F-01
    status: active
    locations:
      - lesson: 2
        step: s1
        quote: "Observe that stressed vowels carry a stress mark (´) as in мама"
    dimension: learner_fit
    severity: MAJOR
    claim: >-
      The printed stress example requires мама before М is acquired in lesson
      3. The full-alphabet survey is an overview, not acquisition of every
      sound-letter correspondence. This conflicts with the accepted staged
      reading rule that printed words follow their constituent letters.
      search_text, owned-oho-a1-workbook_f1_p0019_c0001, confirms the source
      example; it does not establish its suitability before this learner knows
      М. Retain oral stress noticing here and place the written whole-word
      example after its letters are acquired.
    evidence:
      receipt: "rr-11b5cb15637344e0ae53"
    could_be_a_gate: "no"

  - id: F-02
    status: active
    locations:
      - lesson: 1
        activity: a1
        quote: "responding aloud to prompt situations in both informal and formal registers"
    dimension: activity
    severity: MAJOR
    claim: >-
      Activity a1 is the practice for s1, but it requires formal-register
      responses before s2 teaches the formal greeting. The defect is the
      activity's semantic demand at that point, not its mechanical linkage.
      search_text, ulp-1-00-lesson-notes_l0002_w001, identifies formal greetings
      as the subsequent teaching slice. Scope the first response practice to
      the informal material, then require formal responses after s2.
    evidence:
      receipt: "rr-c1b60e4c92dadacaa844"
    could_be_a_gate: "no"

