      - lesson: 4
        activity: a2
        quote: "Identify the personal pronoun with vowel letter Я among single-syllable vowel letters."
    dimension: activity
    severity: MAJOR
    claim: >-
      These workbook operations are reasonable supplementary recognition tasks,
      but they do not test their lessons' central phonetic and reading jobs.
      Case matching does not demonstrate hearing vowel/consonant differences
      or the planned vowel contrast. Identifying the pronoun does not demonstrate
