  - id: F-03
    status: active
    locations: []
    scope:
      lesson: 2
    dimension: plan_defect
    severity: MAJOR
    claim: >-
      No lesson plans the position's required stress and intonation work.
      Accepted r6(d) additionally assigns an overview of six vowel sounds and
      stressed versus unstressed vowels here. Teaching five vowel letters and
      contrasting two sounds does not accomplish those auditory jobs; hearing
      greeting recordings alone does not specify the intended prosodic learning.
      search_text at owned-oho-a1-workbook_f1_p0019_c0001 explicitly states
      "Ukrainian has six vowel sounds" and presents stressed and unstressed
      vowels. Restore the accepted listening and speaking progression with
      appropriate pack evidence. Hearing the sixth vowel need not move its
      written-letter mastery from the approved later position. The Standard
      ownership is taken from the supplied arc; its original lines were not
      independently recovered.
    evidence:
      receipt: "rr-8715dc51bb82e0b47277"

  - id: F-04
    status: active
    locations:
      - lesson: 5
        quote: "Consolidate greetings and the 12 taught letters through practical interaction and reading."
    dimension: learner_fit
    severity: MAJOR
    claim: >-
      The separate recap lesson has insufficient distinct work to justify its
      separation: it repeats greeting selection, reads familiar names and sorts
      already taught vocabulary. Its useful contextual closing task could close
      the preceding instructional lesson. Accepted r6(e) specifically adopts
      embedded recap and communicative integration for positions 2–3 to preserve
      conversational teaching capacity. search_text at
      1-klas-bukvar-zaharijchuk-2025-1_s0058 confirms the familiar name-reading
      model, "Іван Вова Ніна Нонна"; the plan does not develop that model into
      a broader standalone recap job. Integrate the practical closure and
      allocate teaching capacity to the omitted accepted duties. This is a
      judgement about distinct learner work, not a word, activity or time quota.
    evidence:
      receipt: "rr-a25f3d27ed4207d6807a"

  - id: F-05
    status: active
    locations:
      - lesson: 3
        activity: a2
        quote: "Complete names and family words by supplying the missing initial syllable with В, М, or Н."
    dimension: activity
    severity: MAJOR
    claim: >-
      The completion operation cannot fairly realize its named targets.
      W-091 is Ніна and W-093 is Іван, but the supplied options are ма, на
      and ва: none can supply either name's missing beginning as requested.
      inspect_words confirms the clean nominative name forms at VESUM entries
      239577 and 151545. Repair the blanks, targets and choices together around
      the intended reading operation. This concerns answerability, not the
      script-owned type allowlist or practice-linkage checks.
    evidence:
      receipt: "rr-241e813fab53b15a1f9b"

