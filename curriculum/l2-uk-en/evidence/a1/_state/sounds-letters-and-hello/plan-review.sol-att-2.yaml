  - id: F-02
    status: active
    locations:
      - lesson: 1
        activity: a2
        quote: "Polite time-of-day greeting: Good day"
      - lesson: 5
        activity: a3
        quote: "Polite expression of gratitude: Thank you"
      - lesson: 5
        step: s2
        quote: "Select the appropriate greeting for informal and formal situations"
    dimension: activity
    severity: MAJOR
    claim: >-
      Both quizzes permit success through English category labels and English
      answers without recognising or retrieving a Ukrainian greeting or response.
      Consequently the recap's register-selection criterion can also be satisfied
      through this bypass. English instructions are appropriate here, but the
      assessed response must process taught Ukrainian, through supported audio or
      eligible print. The cited model provides that distinction: search_text,
      ulp-1-00-lesson-notes_l0001_w005, returns "What do you say if I say to you:"
      followed by a Ukrainian greeting prompt. Retain the contextual choices
      while replacing the answer-revealing English response options.
    evidence:
      receipt: "rr-8385f952ed3eb5beb803"

