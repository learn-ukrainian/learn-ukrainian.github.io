    locations:
      - lesson: 1
        step: s2
        quote: "Copy the formal greeting into your notebook as supported writing practice."
    dimension: learner_fit
    severity: MAJOR
    claim: >-
      This writing instruction precedes every acquired letter in the supplied
      learner state and the plan. It conflicts with accepted arc revision r6's
      distinction between early oral chunks and printed words whose constituent
      letters have been introduced. Even this module does not acquire every
      letter in the formal greeting. search_text,
      ulp-1-00-lesson-notes_l0002_w002, returns "До́брий день!" as the intact
      greeting. Keep its early treatment oral and place supported copying on
      print whose letters have already been introduced.
