    dimension: recap
    severity: MAJOR
    claim: "Lesson 6 s1 ties the first-person narrator (W-099) to her own copied word W-081, and a2 scores that tie. The same step limits the story to the 13 taught letters, which excludes я. Ukrainian past-tense forms do not mark person: the cited grade-4 rule says they change by number and, in the singular, by gender. So the narrator's own action can only be written as a third-person self-reference ('Поліна писала …') or as a subjectless 'писала', which leaves the person unclear. Either breaks the first-person narration that D4 requires, and the narrator question then depends on the English column or the speaker label. The job cannot be reached from the learner state. Fix: keep 'ми писали' as the first-person frame and tie the three copied words to other actors instead of the narrator."
    evidence: { receipt: "rr-890708b7cb14aa163e23" }
    could_be_a_gate: "no"
