activities:
- id: a1
  instruction: Imagine your friend greeting you. Play only the short informal excerpt, repeat the whole greeting, then replay
    it and give the same greeting back aloud. Practise offline; your speech is not machine-verified.
  items:
  - explanation: Reply with the same informal greeting as one memorised chunk.
    note: Listen before using the written model.
    video: V-001
    word: Привіт!
- id: a2
  instruction: Compare the peer exchange with the printed model above and choose the whole greeting.
  items:
  - correct: 0
    explanation: Both peers use the same informal greeting with each other.
    host:
      kind: dialogue
    kind: comprehension
    option_why:
    - This is the informal greeting used in both turns of the peer exchange.
    - This is the separate formal model, which neither peer uses in the exchange.
    options:
    - 'Привіт!

      Hi!'
    - 'Добрий день!

      Hello!'
    question: Which greeting do the two peers exchange?
  - correct: 1
    explanation: Use the formal model when greeting your teacher.
    host:
      kind: quote
      ref: T-040
    kind: comprehension
    option_why:
    - This is the informal peer greeting, rather than the greeting in the printed model.
    - This matches the printed model and the formal greeting introduced for this situation.
    options:
    - 'Привіт!

      Hi!'
    - 'Добрий день!

      Hello!'
    question: You meet your teacher; which complete greeting matches the printed model above?
- id: a3
  instruction: Imagine a receptionist greeting you. Play only the short formal excerpt, repeat the complete greeting, then
    replay it and give the same greeting back aloud. Practise offline; your speech is not machine-verified.
  items:
  - explanation: Reply with the complete formal greeting practised in the recording.
    note: Keep the two words together as one greeting.
    video: V-002
    word: Добрий день!
- id: a4
  instruction: Find the greeting that needs changing and choose the formal model as its repair.
  items:
  - correct: 0
    explanation: Choose the formal greeting for a cashier rather than the familiar-peer greeting.
    host:
      kind: quote
      ref: T-040
    kind: comprehension
    option_why:
    - This is the formal model taught for greeting a cashier.
    - This repeats the informal greeting that needs changing in this situation.
    options:
    - 'Добрий день!

      Hello!'
    - 'Привіт!

      Hi!'
    question: A customer greets a cashier with {{uk:Привіт!}}. Which greeting from the printed model repairs this choice?
  - correct: 1
    explanation: Change to the complete formal greeting in this situation.
    host:
      kind: quote
      ref: T-040
    kind: comprehension
    option_why:
    - This keeps the informal greeting instead of repairing the choice for a boss.
    - This is the formal model taught for greeting a boss.
    options:
    - 'Привіт!

      Hi!'
    - 'Добрий день!

      Hello!'
    question: An employee greets a boss with {{uk:Привіт!}}. Which greeting from the printed model repairs this choice?
- id: a5
  instruction: Use the peer exchange or the printed model to choose a greeting for each new situation. Say your answer aloud
    after choosing.
  items:
  - correct: 1
    explanation: Transfer the informal peer exchange to meeting a friend.
    host:
      kind: dialogue
    kind: comprehension
    option_why:
    - This is the separate formal model rather than the greeting exchanged by the peers.
    - This follows the informal greeting used by both peers.
    options:
    - 'Добрий день!

      Hello!'
    - 'Привіт!

      Hi!'
    question: You meet a friend outside class; which greeting follows the peer exchange?
  - correct: 0
    explanation: Greet the receptionist with the complete formal model.
    host:
      kind: quote
      ref: T-040
    kind: comprehension
    option_why:
    - This matches the printed model and the formal greeting practised for a receptionist.
    - This is the familiar-peer greeting rather than the formal model for this meeting.
    options:
    - 'Добрий день!

      Hello!'
    - 'Привіт!

      Hi!'
    question: You arrive at a hotel reception desk; which greeting matches the printed formal model?
  - correct: 1
    explanation: Choose the formal greeting for this workplace relationship.
    host:
      kind: quote
      ref: T-040
    kind: comprehension
    option_why:
    - This is the informal greeting taught for familiar peers rather than a boss.
    - This matches the printed model and the formal greeting taught for a boss.
    options:
    - 'Привіт!

      Hi!'
    - 'Добрий день!

      Hello!'
    question: You meet your boss at work; which greeting matches the printed formal model?
  - correct: 0
    explanation: Use the same complete formal greeting in this shop situation.
    host:
      kind: quote
      ref: T-040
    kind: comprehension
    option_why:
    - This matches the printed model and the formal greeting taught for a cashier.
    - This is the informal peer greeting rather than the model for greeting a cashier.
    options:
    - 'Добрий день!

      Hello!'
    - 'Привіт!

      Hi!'
    question: You greet a cashier at a shop counter; which greeting matches the printed formal model?
  - correct: 1
    explanation: The teacher is the formal addressee in this situation.
    host:
      kind: quote
      ref: T-040
    kind: comprehension
    option_why:
    - This is the informal peer greeting rather than the model introduced for a teacher.
    - This matches the printed model and the formal greeting introduced for a teacher.
    options:
    - 'Привіт!

      Hi!'
    - 'Добрий день!

      Hello!'
    question: You greet your teacher before class; which greeting matches the printed formal model?
consolidation:
  activities:
  - a5
  lead_in: Try the new situations, then give each chosen greeting aloud.
