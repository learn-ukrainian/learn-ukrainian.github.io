    kind: prose
    text: '{{uk:Привіт}} is the informal greeting for a friend or a peer. Meet it by listening first. Listen to the short
      recording, repeat the whole greeting, then imagine a friend greeting you. Give the same greeting back aloud before looking
      again. You are practising a first spoken response, without reading individual letters.'
  - kind: activity
    ref: a1
  id: s1
- blocks:
  - kind: video
    ref: V-002
  - explains:
    - T-002
    - T-003
    - T-020
    - T-021
    - T-041
    - S-003
    kind: prose
    text: '{{uk:Добрий день}} is the greeting for the formal situations here. Keep the two words together when you repeat
      it. You can use this greeting at any time of day. Imagine arriving at a hotel reception desk and greeting the receptionist.
      A teacher is also a formal addressee. With a boss or cashier, choose this greeting instead of the informal peer greeting.
      Listen, repeat, and say the matching response aloud.'
  - kind: activity
    ref: a3
  id: s2
- blocks:
  - kind: quote
    ref: T-040
  id: s3
- blocks:
  - explains:
    - T-035
    - T-002
    kind: prose
    text: Two friends meet at the classroom entrance. Read their exchange with the English support below; you do not need
      to work out their names letter by letter.
  - kind: dialogue
  - explains:
    - T-040
    - T-041
    - T-021
    - T-020
    - T-002
    - T-003
    kind: prose
    text: Compare the peer exchange with the printed greeting above. The printed greeting gives you the spelling, rather than
      a teacher speaking. The formal situations are greeting a teacher, receptionist, boss or cashier. The formal greeting
      works at any time of day. Replay both short recordings, then choose for each situation.
  - kind: video
    ref: V-001
  - kind: video
    ref: V-002
