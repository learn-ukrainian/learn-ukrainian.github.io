activities:
- id: a1
  instruction: Play the short greeting. Repeat it aloud, then play it again and give the matching response before looking.
    This is offline speaking practice; your speech is not machine-verified.
  items:
  - explanation: Imagine a friend greeting you and say the same greeting back aloud.
    video: V-001
    word: привіт
- id: a2
  instruction: Choose the greeting that matches the exchange or the printed card in each situation.
  items:
  - correct: 1
    explanation: Match the greeting to the friend exchange.
    host:
      kind: dialogue
    kind: comprehension
    option_why:
    - This greeting belongs to the separate formal situation, rather than the peer exchange.
    - This greeting matches the informal exchange between friends.
    options:
    - 'Добрий день!

      Say this greeting.'
    - 'Привіт!

      Say this greeting.'
    question: Two friends greet each other at the classroom entrance. Which greeting do they exchange?
  - correct: 0
