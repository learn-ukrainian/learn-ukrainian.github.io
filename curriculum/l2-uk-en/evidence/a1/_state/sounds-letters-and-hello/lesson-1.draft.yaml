lesson:
  module: a1/sounds-letters-and-hello
  n: 1
status: ok
steps:
- blocks:
  - kind: video
    lead_in: Listen to the short greeting excerpt first.
    ref: V-001
    target_record: W-074
  - en:
    - An informal greeting for a friend.
    kind: bilingual
    uk:
    - '{{gloss:W-074}}!'
  - explains:
    - T-002
    - X-001
    - S-003
    kind: prose
    text: Imagine meeting a friend at the classroom entrance. This is the informal greeting for that situation. Listen again,
      then say the whole greeting aloud. Learn it by ear as one chunk; the written model is support, not a letter-reading
      task. When your friend greets you, give the same greeting back.
  - kind: activity
    ref: a1
  id: s1
- blocks:
  - kind: video
    lead_in: Listen to the short formal greeting excerpt.
    ref: V-002
    target_record: W-075
  - en:
    - A formal greeting for this new situation.
    kind: bilingual
    uk:
    - '{{gloss:W-075}} {{gloss:W-076}}!'
  - explains:
    - T-002
    - T-003
    - T-020
    - T-021
    - T-041
    - S-003
    - X-001
    kind: prose
    text: Imagine arriving at a hotel reception desk. Use this whole formal greeting with the receptionist. It also fits greeting
      a teacher. Unlike the informal peer greeting, this is the model to choose for a boss or cashier. You can use it at any
      time of day. Listen, repeat both words together, and respond aloud with the same complete greeting.
  - kind: activity
    ref: a3
  id: s2
  lead_in: Now try a different meeting.
- blocks:
  - kind: quote
    ref: T-040
  - explains:
    - T-040
    kind: prose
    text: This greeting appears in a textbook list of polite words. The quotation supplies its printed spelling; it does not
      show a teacher speaking. Keep the whole shape in view without decoding individual letters.
  id: s3
  lead_in: Next, look at the printed model.
- blocks:
  - kind: video
    lead_in: Replay the informal greeting excerpt before meeting the two peers.
    ref: V-001
    target_record: W-074
  - explains:
    - T-035
    - T-002
    - T-003
    - T-020
    - T-021
    - T-040
    - T-041
    - V-002
    kind: prose
    text: Two peers meet here. Follow their short exchange with the paired English support, then take either part aloud. Their
      greeting remains informal. Compare it with the formal recording and the printed model above. For the next choices, imagine
      greeting a friend, teacher, receptionist, boss or cashier. Choose a whole greeting for the stated relationship, without
      reading names letter by letter.
  - kind: dialogue
  - kind: activity
    ref: a2
  - kind: activity
    ref: a4
  id: s4
  lead_in: Return to the classroom entrance.
