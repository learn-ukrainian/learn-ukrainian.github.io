  instruction: Use each source model to decide whether the indicated part shows letters or represents a sound.
  items:
  - correct: 0
    explanation: The seeing part presents the capital and small letter shapes.
    host:
      kind: quote
      ref: T-006
    kind: comprehension
    option_why:
    - Letters is correct because the model presents two visible shapes after its seeing cue.
    - A sound is incorrect because the sound representation appears separately inside brackets.
    options:
    - Letters
    - A sound
    question: What does {{uk:А, а}} show after the seeing cue?
  - correct: 1
    explanation: The brackets mark the written representation of the sound.
    host:
      kind: quote
      ref: T-006
    kind: comprehension
    option_why:
    - Letters is incorrect because the capital and small letter shapes appear in the seeing part.
    - A sound is correct because the hearing part represents it inside square brackets.
    options:
    - Letters
    - A sound
    question: What does {{uk:[а]}} represent after the hearing cue?
  - correct: 1
    explanation: Both visible shapes belong to the letter shown in the seeing part.
