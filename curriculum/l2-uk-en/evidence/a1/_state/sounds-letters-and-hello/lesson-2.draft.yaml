status: ok
steps:
- blocks:
  - kind: video
    lead_in: Listen to the short informal greeting excerpt, then respond aloud after the model.
    ref: V-001
    target_record: W-074
  - kind: video
    lead_in: Listen to the short formal greeting excerpt, then respond aloud after the model.
    ref: V-002
    target_record: W-075
  - explains:
    - T-001
    - T-006
    - V-001
    - V-002
    kind: prose
    text: Keep both greetings whole. You do not need to read their spellings today. Now listen to your teacher make one sound
      before looking at its written shape. You hear a sound; you see a letter. A letter represents a sound, but the printed
      shape itself is silent. Say the sound again, then point to the shape your teacher shows. Notice which part you hear
      and which part you see.
  - kind: activity
    ref: a1
  id: s1
- blocks:
  - kind: video
    ref: V-004
    target_record: А
  - explains:
    - T-006
    - V-004
    - T-022
    - S-002
    kind: prose
    text: Listen to the model for {{uk:А}} first. Repeat the sound, then look at the capital and small shapes. Trace each
      shape with a finger. Copy both into your notebook, looking back at the model as you write.
  - kind: video
    ref: V-005
    target_record: О
  - explains:
    - T-007
    - V-005
    - T-023
    - S-002
    kind: prose
    text: Next comes {{uk:О}}. Hear the model before repeating it. Look at the capital and small shapes, then trace them.
      Copy both beside your first pair. Compare your copies with the printed shapes before moving on.
  - kind: video
    ref: V-006
    target_record: У
  - explains:
    - T-008
    - V-006
    - T-024
    - S-002
    kind: prose
    text: Now meet {{uk:У}}. Listen, repeat, and then look at its two written shapes. Trace each one slowly. Copy the capital
      and small letter into your notebook, leaving enough space to see each shape clearly.
  - kind: video
    ref: V-007
    target_record: И
  - explains:
    - T-009
    - V-007
    - T-025
    - S-002
    kind: prose
    text: Finally, meet {{uk:И}}. Hear the model and repeat after it. Look at both written shapes, trace each one, and copy
      them. Return to the recording if you want another model before saying the sound again.
  - kind: activity
    ref: a3
  - kind: activity
    ref: a4
  id: s2
- blocks:
  - explains:
    - T-006
    - T-007
    - T-008
    - T-009
    - T-022
    - T-023
    - T-024
    - T-025
    - V-004
    - V-005
    - V-006
    - V-007
    kind: prose
    text: Listen again before the next questions. In the printed models that follow, the seeing cue introduces letter shapes.
      The hearing cue introduces a sound written inside square brackets. Those brackets show how the sound is represented
      on the page; they are not a recording. Compare the two parts of each model. You will choose whether the part shown in
      the question represents a letter or a sound.
  - kind: video
    ref: V-004
    target_record: А
  - kind: video
    ref: V-005
    target_record: О
  - kind: video
    ref: V-006
    target_record: У
  - kind: video
    ref: V-007
    target_record: И
  id: s3
- blocks:
  - explains:
    - T-006
    - T-007
    - T-008
    - T-009
    - T-022
    - T-023
    - T-024
    - T-025
    kind: prose
    text: Look at each complete model before answering. Use the shapes and brackets to tell the two parts apart. Then check
      the four capital and small letter pairs before the final practice. Keep your notebook nearby for another copy of any
      shape you want to practise.
  - kind: quote
    ref: T-006
  - kind: quote
    ref: T-007
  - kind: quote
    ref: T-008
  - kind: quote
    ref: T-009
