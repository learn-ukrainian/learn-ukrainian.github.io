findings:
  - id: F-01
    status: active
    locations:
      - lesson: 2
        step: s1
        quote: "Observe orally that stressed vowels are pronounced with greater prominence, while unstressed vowels [е] and [и] tend to merge slightly."
      - lesson: 2
        step: s2
        quote: "Practice statement, question, and exclamation intonation contours with emotional expressiveness."
      - lesson: 2
        activity: a2
        quote: "Match vowel sounds to their articulatory descriptions and letter representations."
    dimension: activity
    severity: MAJOR
    claim: >-
      The planned response task does not exercise the stress and intonation
      work assigned to this lesson. Vowel-to-description matching can succeed
      without identifying a stressed syllable, hearing the stressed/unstressed
      contrast, or producing distinguishable speech contours. The prose says
      to practise contours, but supplies no corresponding activity focus or
      source-bounded speech model for that performance. Later activities and
      the recap do not close this gap. This is practice adequacy under R-27,
      not an activity-count requirement. search_text, T-050 /
      owned-oho-a1-workbook_f1_p0020_c0001, demonstrates distinct response
      operations: “place a stress mark (´) on the correct vowel in each word”
      and “Record yourself saying each question.”
    evidence:
      receipt: "rr-566029d25de820bc9692"
    could_be_a_gate: "no"

  - id: F-02
    status: active
    locations:
      - lesson: 5
        step: s2
        quote: "Decode and pronounce familiar names aloud using all twelve taught letters"
    dimension: plan_defect
    severity: MAJOR
    claim: >-
      This success criterion cannot be demonstrated by the approved task's
      reading material. Its permitted print consists of the four names
      already read in lesson 3; it supplies no name containing Е, П, Р, Т
      or Я. Saying a memorised greeting does not demonstrate decoding those
      letters. The contextual greeting choice is useful, but completion of
      this task cannot establish the reading performance its criterion
      promises. This concerns the meaning and observability of task success,
      not the declared inventory's mechanically checked coverage.
      search_text, T-019 /
      1-klas-bukvar-zaharijchuk-2025-1_s0058, confirms the source list:
      “Іван Вова Ніна Нонна”.
    evidence:
      receipt: "rr-e7664b13d43566d8863f"
    could_be_a_gate: "no"
