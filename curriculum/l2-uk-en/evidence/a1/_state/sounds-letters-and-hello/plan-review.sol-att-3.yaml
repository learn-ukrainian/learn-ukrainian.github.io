findings:
  - id: F-01
    status: active
    locations:
      - lesson: 1
        activity: a2
        quote: "Match social situations to appropriate Ukrainian greetings heard in audio recordings."
      - lesson: 5
        step: s2
        quote: "Distinguish informal from formal greetings, read the decodable names aloud, and write them in your notebook."
    dimension: activity
    severity: MAJOR
    claim: >-
      The planned practice does not demonstrate the promised ability to give an
      appropriate formal greeting aloud. Lesson 1's explicit speaking activity
      covers the informal greeting; its formal practice is matching. The closing
      task requires names to be spoken but asks only for greeting discrimination.
      This also limits the closing task's fulfilment of the module's oral job.
      search_text, ulp-1-00-lesson-notes_l0001_w005, supplies the response model
      "What do you say if I say to you:". Extend an existing oral routine to require
      learners to choose and say a taught greeting in both social contexts, and
      make that outcome observable in the recap. No additional activity count
      is required.
    evidence:
      receipt: "rr-36501cae4b576aefc7c7"
    could_be_a_gate: "no"

  - id: F-02
    status: active
    locations:
      - lesson: 2
        step: s1
        quote: "Ukrainian phonetics features six basic vowel sounds ([а], [о], [у], [е], [и], [і]). Observe stressed vowels which sound clear and prolonged, versus unstressed vowels."
    dimension: evidence_gap
    severity: MAJOR
    claim: >-
      The cited pack excerpts do not ground this combined teaching point.
      T-001 distinguishes sound classes, the individual letter records model
      isolated correspondences, and T-046 presents the alphabet. They do not
      explain the six-sound system or the stressed/unstressed contrast.
      search_text, owned-oho-a1-workbook_f1_p0019_c0001, provides an adult
      pedagogical source stating "Ukrainian has six vowel sounds" and explaining
      stress and unstressed vowel pronunciation. The pack-builder must add
      appropriate quoted evidence and the plan must cite it. The particular
      assertion "clear and prolonged" also needs explicit support before the
      writer is required to teach it.
    evidence:
      receipt: "rr-b0cc031e350091fef826"
    could_be_a_gate: "no"

  - id: F-03
    status: active
    locations:
      - lesson: 3
        step: s1
        quote: "Consonants М and Н: read syllables ма, мо, ме, ми, мі and на, но, не, ни, ні; read мама, Ніна, Нонна."
      - lesson: 4
        step: s1
        quote: "Read syllables with П, Р, Т (па, по, пе, пи, пі; та, то, те, ти, ті; ра, ро, ре, ри, рі) and decodable family noun тато."
    dimension: learner_fit
    severity: MAJOR
    claim: >-
      The instructional literacy strand remains organised around syllable grids,
      family words and primer names, without the adult survival framing required
      by accepted arc revision r6 section (g). The community-members context
      appears only in the closing task. The words and names themselves are
      attested; the defect is their pedagogical role and framing.
      search_text, owned-oho-a1-workbook_f1_p0020_c0001, integrates early vowel
      work with a city task: "You are in the city looking for different things."
      Reframe the instructional reading and pronunciation tasks around a
      sourced adult/teen use, retaining syllables as pronunciation and rhythm
      aids. Additional lexical evidence, where needed, belongs to the pack-builder.
    evidence:
      receipt: "rr-eff3df3e59867ddc7085"
    could_be_a_gate: "no"

