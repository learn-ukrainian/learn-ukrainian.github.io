    severity: MAJOR
    claim: "Lesson 2 a2 is the only scored check of the lesson's sound-versus-letter job, and it cannot discriminate. Its only host is T-022 'А а', a grade-5 Zabolotnyi alphabet heading (5-klas-ukrmova-zabolotnyi-2023_s0001), not the primer that the focus names. The displayed unit is always print, so the heard-or-seen question has one possible key; step s3 concedes that the sound is supplied offline by a teacher. The primer model pairs a seen letter with a bracketed heard sound on every vowel page. search_text over 1-klas-bukvar-zaharijchuk-2025-1 returns 'Бачу У, у. Чую [у].' (chunk _s0036, the T-008 pattern), and T-006 is the same pattern for А. Hosting a2 on T-006 to T-009 would make both 'seen' and 'heard' real keys. Workbook a6 has the same narrowing: every item is anchored to the single T-022 pair, even though T-023 to T-025 are aligned. Fix in the plan; regeneration alone cannot repair it."
    evidence: { receipt: "rr-ae4ad3a88abe43a12c96" }
    expected: "Бачу У, у. Чую [у]."
    could_be_a_gate: "no"
