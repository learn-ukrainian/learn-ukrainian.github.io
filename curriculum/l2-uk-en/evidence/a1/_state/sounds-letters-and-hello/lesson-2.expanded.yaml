  text: Keep both greetings whole. You do not need to read their spellings today. Now listen to your teacher make one sound
    before looking at its written shape. You hear a sound; you see a letter. A letter represents a sound, but the printed
    shape itself is silent. Say the sound again, then point to the shape your teacher shows. Notice which part you hear and
    which part you see.
