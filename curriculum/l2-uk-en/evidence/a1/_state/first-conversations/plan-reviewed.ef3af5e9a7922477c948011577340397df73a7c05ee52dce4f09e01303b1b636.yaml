plan_schema: 2
module: first-conversations
level: a1
sequence: 6
slug: first-conversations
version: '1.0'
title: Дуже приємно!
subtitle: Purposeful first conversations and appropriate endings
focus: Sustain a scaffolded 4-6-turn conversation with greetings, Добраніч, personal data, family and
  belongings; practise stressed/unstressed [е], [и] Adult or teen situations retain English support. Private-book
  wording is not teaching material. Unresolved formula ids remain withheld from teaching and scoring.
objectives:
- Sustain and adapt a scaffolded four-to-six-turn exchange in formal and informal contexts.
- Combine acquired identity, family and belonging labels with sourced status and courtesy chunks.
- Practise stressed and unstressed e/i, then read and write a supported short message.
connects_to:
- checkpoint-first-contact
prerequisites:
- reading-ukrainian
register: neutral
changelog:
- '1.0 (2026-10-31): Independently authored for #8425 steps 1-4 under the approved r6 arc. Plans only;
  no lesson builds.'
