    task:
      id: my-purposeful-first-conversation-task
      action: personalize
      context_en: You meet an adult course participant or receive a brief message from a peer. Choose
        the person, purpose and whether it is daytime or night-time.
      instruction_en: Create a four-to-six-turn exchange using an appropriate greeting, a personal or
        fictional detail, a response and a purposeful close. Include a family label or an acquired belonging
        label where it serves your chosen situation. Listen to a partner’s version and respond to its
        meaning. Then write a supported short message changing the recipient or time of day.
      response_mode: spoken_or_written
      success_criteria_en:
      - The exchange has four to six connected turns with a clear purpose.
      - The chosen register fits the recipient.
      - The reply responds to the partner’s actual detail.
      - The closing fits the selected time and context.
      - The supported message communicates a chosen detail without copying a whole model.
      - The two vowel families and familiar stress remain intelligible.
      learner_reads:
      - ref: T-502
        words:
        - Привіт!
        - Добрий день!
        - До побачення!
