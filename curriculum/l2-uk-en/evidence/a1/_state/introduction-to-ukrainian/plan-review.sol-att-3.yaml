        quote: "Apply the taught study method and alphabet overview to select your daily oral and written practice routine."
    dimension: activity
    severity: MAJOR
    claim: >-
      The module promises that learners will distinguish speech sounds,
      non-speech sounds, gestures, and letters, but its planned response
      operations do not elicit that distinction. The alphabet quiz tests
      factual recall, the workbook tests study-habit advice, and the recap
      instruction requests a routine. Merely listing sound discrimination
      among the recap criteria does not supply an observable discrimination
      task. The source model in search_text,
      2-klas-ukrmova-bolshakova-2019-1_s0027, explicitly asks learners to
      distinguish hearing/speaking from seeing/writing. Revise a planned
      activity or the recap action to elicit the promised distinction using
      supported examples, without requiring acquired letters or adding
      activities to meet a quota.
    expected: |-
      Розглянь малюнки. Коли діти чують і вимовляють звуки мови,
      а коли вони бачать і пишуть букви? Розіграй діалоги.
    evidence:
