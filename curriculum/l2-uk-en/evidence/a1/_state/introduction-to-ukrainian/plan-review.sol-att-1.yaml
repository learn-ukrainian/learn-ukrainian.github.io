  - id: F-02
    status: active
    locations:
      - lesson: 2
        step: s2
        quote: "Practical closing task: establish your personal study goals and understand sound-before-letter progression."
      - lesson: 2
        step: s2
        quote: "Review the alphabet structure and note down your daily practice routine."
      - lesson: 2
        activity: a2
        quote: "Identify the study habit that contradicts the sound-before-letter progression."
    dimension: plan_defect
    severity: MAJOR
    claim: >-
      The closing task has useful personalization, but its study-method
      prerequisite has not been taught. Earlier steps cover language context
      and alphabet structure; distinguishing sounds from written letters
      does not explain a practice routine or sound-before-letter progression.
      Consequently s2 asks the learner to understand that progression for
      the first time inside the recap, while a2 tests it. This also affects
      sequencing and breaks the accepted requirement that the recap apply
      previously taught material. Teach the study method explicitly before
      the recap, then have the learner select and explain a personal routine
      using that guidance. This serves the existing lesson job without
      adding vocabulary or an activity quota. Supporting pedagogy:
      search_text, owned-oho-a1-workbook_f1_p0012_c0001, receipt
      rr-623bea3c088587d44340, states "The exercises are varied and progressive"
      and "When working with the \naudio, repeat after the speaker as much as possible."
      These provide concrete practice guidance that can inform the missing
      teaching stage.
    evidence:
      receipt: "rr-623bea3c088587d44340"
    could_be_a_gate: "no"
