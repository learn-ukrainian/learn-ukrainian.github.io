    difficulty for each). The sources give each Ukrainian sound (primer "Чую [ж]" lines, T-010 to T-014) and a native pronunciation
    video per letter (V-003, V-010 to V-013), and T-021 shows only that English h is written х in some borrowed words; no
    textbook record describes these five sounds for an English speaker, so the plan teaches them by the native model and states
    no English comparison.
