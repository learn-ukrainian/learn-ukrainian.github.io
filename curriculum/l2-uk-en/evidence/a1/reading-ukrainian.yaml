texts:
- id: T-401
  quote: 'Алфавіт

    На письмі звуки позначаємо буквами.

    Сукупність букв, розташованих у встановленому для

    певної мови порядку, називають алфавітом (азбукою, абет-

    кою). В українському алфавіті 33 букви.

    За алфавітом розміщують слова у словниках, складають

    списки, каталоги, довідники тощо.

    Зверніть увагу!

    Звуки ми чуємо й вимовляємо, а букви бачимо й пишемо­ .

    195. І. СИТУАЦІЯ. Уявіть, що в бібліотеці треба розмістити в алфа-

    вітному порядку книжки вказаних авторів й авторок. Запишіть, у якій

    послідовності ви розмістили б книжки. Скористайтеся алфавітом,

    уміщеним на форзаці.

    Шевченко Тарас, Нестайко

    Всеволод, Павленко Марина,

    Стельмах Ярослав, Франко Іван,

    Костенко Ліна, Симоненко Ва-

    силь, Гуцало Євген, Вінгранов-

    ський Микола, Воронина Леся.

    ІІ. Визначте, з яких звуків складаються виділені імена, та назвіть

    букви, якими позначено на письмі ці звуки.

    196. І. Поміркуйте: 1) для чого потрібно знати алфавіт; 2) чи є, на вашу

    думку, в алфавіті букви, без яких можна обійтися?

    ІІ. Пригадайте 5–8 імен героїв улюблених мультфільмів. Запишіть ці

    імена за алфавітом.

    197. СИТУАЦІЯ. Уявіть свій візит до лікаря-

    окуліста, щоб перевірити зір. Для визначення

    гостроти зору використовують спеціальні та-

    блиці, на яких зображено букви різного роз-

    міру. Лікар пропонує вам сісти на певній

    відстані від таб­ лиці й назвати букви, які ви

    бачите. Назвіть ці букви.

    83'
  sha256: f7ee0b86d1593f11149728f93a8ae266b58c09f93b1c84d0ad1df918be594669
