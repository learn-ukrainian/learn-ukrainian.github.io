unsupported:
- claim: An English-speaker description of the sounds Ж, Ш, Ч, Х and Й (an English sound comparison or a typical English-reader
    difficulty for each). The sources give each Ukrainian sound (primer "Чую [ж]" lines, T-010 to T-014) and a native pronunciation
    video per letter (V-003, V-010 to V-013), and T-021 shows only that English h is written х in some borrowed words; no
    textbook record describes these five sounds for an English speaker, so the plan teaches them by the native model and states
    no English comparison.
  id: U-001
  resolved_by: 'Not taught as an English-comparison claim, because no source supports one. The five letters are taught from
    the native audio models instead: Ж by V-012, Ш by V-013, Ч by V-010, Х by V-011 and Й by V-003 (Ukrainian Lessons "Ukrainian
    Alphabet: How to pronounce <letter> in Ukrainian").'
