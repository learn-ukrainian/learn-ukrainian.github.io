- id: T-002
  quote: "between a receptionist and a guest.\n                                                                 The most typical\
    \ greeting that you can use at any\n                                                                 time of the day is:\n\
    \n                                                                                      До́брий день!\n  – До́брого ра́нку!\n\
    \  – До́брого ра́нку!                                             Here are some other options for the morning (before\n\
    \  – У вас все до́бре?                                            noon), evening (when it’s almost or completely\n  –\
    \ Так, все чудо́во.                                            dark), and time when people go to sleep:\n  – Га́рного\
    \ дня!                                                   До́брого ра́нку! — Good morning!\n  – Дя́кую, і вам.        \
    \                                          До́брий день! = Добри́день — Hi!\n  – До поба́чення!                      \
    \                            (Good day!)\n  – До поба́чення!                                                  До́брий\
    \ ве́чір! — Good evening!\n                                                                    Добра́ніч! = На добра́ніч!\
    \ — Good night!"
