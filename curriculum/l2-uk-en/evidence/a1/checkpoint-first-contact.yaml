- id: T-601
  quote: 'РОЗВИТОК

    МОВЛЕННЯ

    § 3

    СКЛАДАННЯ ДІАЛОГІВ

    ВІДПОВІДНО ДО

    СИТУАЦІЇ СПІЛКУВАННЯ

    1. Складіть і розіграйте діалог у трьох групах із використанням етикетних

    формул (по п’ять-шість реплік).

    1-ша група — вітання з адміністратором спортклубу та з’ясування

    основ­ них правил поводження в залі.

    2-га група — знайомство з однолітками в таборі відпочинку й розмова

    про плани на літо.

    3-тя група — пропозиція допомогти літній людині з важким пакунком

    біля супермаркету.

    Етикетні формули

    вітання знайомство допомога

    Привіт! Вітаю! Доброго

    ранку! Добрий

    день! Добрий вечір!

    Бувай (бувайте)! До

    побачення! Моє вам

    шанування! Скільки

    літ! Вітаннячко!

    Дозвольте представитися.

    Хочу познайомити вас із … .

    Дуже приємно.

    Як тебе (вас) звати?

    Приємно було познайомитися.

    Як ся маєш? Як ваші справи?

    Чим я можу вам допомогти?

    Ви мені дуже допомогли.

    Будьте ласкаві … .

    Якщо ваша ласка … .

    Радий (рада) вам допомогти!

    2. Складіть і розіграйте в парах діалог за однією із ситуацій (безпека спіл-

    кування).

    1. вам телефонує незнайома людина й просить сказати, де працюють

    ваші батьки й коли повертаються з роботи додому.

    2. вам написала в інстаграмі незнайома людина про те, що ви виграли

    приз (мобільний телефон) і треба прийти за вказаною адресою, щоб забрати

    його.

    3. Розглянувши комікс, складіть і розіграйте діалог у парах (усно). Вико-

    ристайте по три-чотири репліки до кожного сюжету.

    8'
