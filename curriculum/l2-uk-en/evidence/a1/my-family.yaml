- id: T-304
  quote: '2. Що цікавого щодо займенників ви помітили в реченнях?

    3. Якому стилю властиві такі речення? Поміркуйте чому.

    Присвійні займенники

    Присвійні (від присвоїти) займенники вказують на

    належність когось або чогось певній особі, вони спів-

    відносяться з особовими займенниками.

    Особові Присвійні Особові Присвійні

    я

    мій, моя, моє,

    мої ми

    наш, наша,

    наше, наші

    ти твій, твоя,

    твоє, твої ви ваш, ваша,

    ваше, ваші

    він, воно,

    вона його, її вони їхній, їхня,

    їхнє, їхні

    До будь-якої особи: свій, своя, своє, свої

    Присвійні займенники змінюються за відмінками,

    родами та числами.

    Чол. рід Однина Множина

    Жін. рід Серед. рід

    Н. мій моя мій мої

    Р. мого

    ́ моєї мого ́ моїх

    Д. моє

    ́му моїй моє ́му моїм

    Зн. мій, мого ́ мою мій, мого мої, моїх

    Ор. мої м моєю мої м моїми

    М. ́

    ́

    (на) моє

    му,

    на мої м (на) моїй (на) моє

    му,

    на мої м (на) моїх

