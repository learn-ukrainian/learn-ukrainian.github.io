- id: T-301
  quote: '§ 57–58. Апостроф

    § 57–58. АПОСТРОФ

    1. Чітко вимовте слова та виконайте завдання.

    бур..як бур..ян

    А. В. У якому із цих слів виділена буквосполука передає тверду, роздільну

    вимову, а в якому — м’яку, злиту?

    Яке із цих слів треба писати з апострофом?

    Апостроф позначає роздільну вимову твердих приголосних із такими

    звукосполученнями: [йа], [йу], [йе], [йі] (на письмі — букви я, ю, є, ї).

    Порівняйте пари слів: бюро — б’ю, пюре — п’ю, свято — зв’язок.

    бур’ян [бурйан], подвір’я,

    пір’їна

    Апостроф пишемо перед я, ю, є, ї

    після б, п, в, м, ф б’єш, п’ю, в’ялий, сім’я, солов’ї

    після р при роздільній вимові (чути

    [й])

    після префіксів, що закінчуються на

    приголосний

    від’їхати, роз’яснити,

    АЛЕ: заїхати, пояснити

    після першої частини, що закінчуєть-

    ся на приголосний (у складних словах)

    дит’ясла, Мін’юст

    у слові Лук’ян і похідних Апостроф не пишемо перед я, ю, є, ї

    Лук’янченко, Лук’янчук,

    станція метро «Лук’янівська»

    після б, п, в, м, ф, якщо перед ними

    стоїть кореневий приголосний, крім р

    після р при злитій (м’якій) вимові свято, духмяний, різьбяр,

    АЛЕ: зв’язок, черв’як

    буряк [бур′ак], рюмка

    Зауважте!

    Перей йо апостроф не пишемо: зйомка, Воробйов, серйозний.

    Також апостроф не пишемо в російських назвах міст і прізвищах після

    губного перед я, ю, є при злитій вимові: Вязьма, Мягков, Рєпін.

    131'
