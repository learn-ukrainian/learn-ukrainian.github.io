request_schema: 1
level: a1
words:
  # Personal pronouns
  - lemma: я
    pos: noun
    want: new
    note: "closed class: personal pronoun (1st pers sing); basic speaker reference"
  - lemma: ти
    pos: noun
    want: new
    note: "closed class: personal pronoun (2nd pers sing); base-layer item (position 43 please-do-this teaches imperative contrast in ти/ви forms, not the pronoun)"
  - lemma: він
    pos: noun
    want: new
    note: "closed class: personal pronoun (3rd pers masc sing); taught at position 8 (things-have-gender)"
  - lemma: вона
    pos: noun
    want: new
    note: "closed class: personal pronoun (3rd pers fem sing); taught at position 8 (things-have-gender)"
  - lemma: воно
    pos: noun
    want: new
    note: "closed class: personal pronoun (3rd pers neut sing); taught at position 8 (things-have-gender)"
  - lemma: ми
    pos: noun
    want: new
    note: "closed class: personal pronoun (1st pers plur); basic plural reference"
  - lemma: ви
    pos: noun
    want: new
    note: "closed class: personal pronoun (2nd pers plur/polite); base-layer item (position 43 please-do-this teaches imperative contrast in ти/ви forms, not the pronoun)"
  - lemma: вони
    pos: noun
    want: new
    note: "closed class: personal pronoun (3rd pers plur); taught at position 13 (many-things)"
  - lemma: себе
    pos: noun
    want: new
    note: "closed class: reflexive pronoun (lemma for себе/собі/собою); basic reference"

  # Possessive pronouns
  - lemma: мій
    pos: adj
    want: new
    note: "closed class: possessive pronoun (1st pers sing); taught at position 8 (things-have-gender)"
  - lemma: твій
    pos: adj
    want: new
    note: "closed class: possessive pronoun (2nd pers sing); taught at position 8 (things-have-gender)"
  - lemma: свій
    pos: adj
    want: new
    note: "closed class: reflexive possessive pronoun; basic possessive reference"
  - lemma: наш
    pos: adj
    want: new
    note: "closed class: possessive pronoun (1st pers plur); basic possessive reference"
  - lemma: ваш
    pos: adj
    want: new
    note: "closed class: possessive pronoun (2nd pers plur); basic possessive reference"
  - lemma: їхній
    pos: adj
    want: new
    note: "closed class: possessive pronoun (3rd pers plur); basic possessive reference"

  # Demonstrative pronouns
  - lemma: цей
    pos: adj
    want: new
    note: "closed class: demonstrative pronoun (proximal); taught at position 12 (this-and-that)"
  - lemma: той
    pos: adj
    want: new
    note: "closed class: demonstrative pronoun (distal); taught at position 12 (this-and-that)"

  # Prepositions and euphonic partners
