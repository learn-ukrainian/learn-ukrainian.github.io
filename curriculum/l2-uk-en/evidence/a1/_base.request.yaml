  # Particles and euphonic adverbs
  - lemma: не
    pos: part
    want: new
    note: "closed class: negative particle; taught at position 19 (questions: negate)"
  - lemma: ні
    pos: part
    want: new
    note: "closed class: negative/responsive particle; taught at position 19 (questions: negate)"
  - lemma: же
    pos: part
    want: new
    note: "closed class: emphatic particle"
  - lemma: ж
