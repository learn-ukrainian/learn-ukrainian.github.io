  - lemma: підо
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of під"
  - lemma: над
    pos: prep
    want: new
    note: "closed class: preposition; spatial preposition"
  - lemma: наді
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of над"
  - lemma: надо
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of над"
  - lemma: перед
    pos: prep
    want: new
    note: "closed class: preposition; spatial and temporal preposition"
  - lemma: переді
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of перед"
  - lemma: передо
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of перед"
  - lemma: після
    pos: prep
    want: new
    note: "closed class: preposition; taught at position 23 (days-and-months) and position 25 (my-day)"
