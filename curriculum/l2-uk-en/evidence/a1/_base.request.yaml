  # ві: VESUM prep:arch, not A1.
  - lemma: у
    pos: prep
    want: new
    note: "closed class: preposition; taught at position 28 (euphony) and position 29 (where-is-it)"
  - lemma: в
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of у; taught at position 28 (euphony) and position 29 (where-is-it)"
  - lemma: уві
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of у"
  - lemma: з
    pos: prep
    want: new
    note: "closed class: preposition; taught at position 28 (euphony) and position 34 (where-from)"
  - lemma: із
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of з; taught at position 28 (euphony) and position 34 (where-from)"
  - lemma: зі
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of з; taught at position 28 (euphony) and position 34 (where-from)"
  - lemma: зо
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of з; taught at position 28 (euphony)"
  - lemma: на
    pos: prep
    want: new
    note: "closed class: preposition; taught at position 29 (where-is-it)"
  - lemma: до
    pos: prep
    want: new
    note: "closed class: preposition; taught at position 31 (where-to)"
  - lemma: від
    pos: prep
    want: new
    note: "closed class: preposition; taught at position 34 (where-from)"
  - lemma: од
    pos: prep
    want: new
    note: "closed class: preposition, euphonic partner of від; taught at position 34 (where-from)"
  - lemma: для
    pos: prep
    want: new
    note: "closed class: preposition; relational preposition of purpose/beneficiary"
  - lemma: без
    pos: prep
    want: new
    note: "closed class: preposition; met at position 36 (food-and-drink) and position 38 (at-the-cafe)"
  - lemma: за
    pos: prep
    want: new
    note: "closed class: preposition; relational preposition"
  - lemma: під
    pos: prep
