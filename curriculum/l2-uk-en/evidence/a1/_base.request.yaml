  - lemma: й
    pos: conj
    want: new
    note: "closed class: coordinating conjunction, euphonic partner of і; taught at position 28 (euphony) and position 44 (linking-ideas)"
  - lemma: та
    pos: conj
    want: new
    note: "closed class: coordinating conjunction, semantic/euphonic partner of і; taught at position 44 (linking-ideas)"
  - lemma: а
    pos: conj
    want: new
    note: "closed class: coordinating conjunction (adversative); taught at position 44 (linking-ideas)"
  - lemma: але
