  text: '      утворення родових форм присвійних займенників: мій, моя, моє; твій,

    твоя, твоє; наш, наша, наше; ваш, ваша, ваше, їхній, їхня, їхнє;'
texts:
- id: T-001
  quote: "So, here are the typical endings of three noun\ngenders:                                                       \
    \               Чо́рну ка́ву, будь ла́ска.\n masculine\n                   -consonant      чай, телефо́н\n gender\n  \
    \                                                                           Вам тут чи з собою?\n feminine\n         \
    \          -а, -я          ка́ва, вода́                   If they ask you the question above in Ukraine, it\n gender\n\
    \                                                                  means if you want your drink or dish to have at the\n\
    \ neuter                                                           place (тут) or to go (з собою). Try it:\n         \
    \          -о, -е          пи́во, со́нце (sun)"
  sha256: 512c82d0ba72d9a58744127e36a434072b984d4772d1de6ef0886fa6c7b7c22d
  source:
