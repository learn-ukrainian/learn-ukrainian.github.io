- id: T-703
  quote: '§ 91

    ОСОБЛИВОСТІ ВИЗНАЧЕН-

    НЯ РОЗРЯДУ ЗАЙМЕННИКІВ

    його, її, їх — їхній

    1. Прочитайте словосполучення в колонках і виконайте завдання.

    знайди його

    зачекай її

    його відповідь

    її пенал

    А. Б. У якій колонці займенники відповідають на питання чий? чия? та озна-

    чають належність комусь?

    Доведіть, що займенники першої колонки особові, а другої — присвійні.

    Особові займенники 3-ї особи однини він, вона, воно у формі родового

    відмінка його, її можуть набувати значення присвійних. Порівняймо:

    покликати (кого?) його, не помітити (кого?) її — це особові займенники;

    пісня (чия?) його, зачіска (чия?) її — це присвійні займенники.

    Особовий займенник 3-ї особи множини вони у формі родового та знахідного

    відмінків має форму їх: немає (кого? чого?) їх, знайшли (кого?

    що?) їх. Присвійний займенник, що вказує на належність предмета

    3-й особі, має форму їхній (їхня, їхнє, їхні): відгук (чий?) їхній.

    Зауважте!

    Займенник їхній завжди вживаємо з іменником.

    2. Згрупуйте словосполучення за розрядами займенників у дві колонки:

    1) особові; 2) присвійні (письмово).

    Його автомобіль, помітити його, їхні ефіри, зібрати їх, зустріти її, її

    флешка, їхньої поради, купити їх, її привітати.

    3. Запишіть речення, уживаючи займенники з дужок у потрібній формі.

    1. Усі (він) люблять, усі (він) чекають, а хто подивиться — кожний скривиться

    (Нар. тв.). 2. Річка котилася й котилася, (вона) невгамовна погоня

    заворожувала (Є. Гуцало). 3. «Пригоди Котигорошка та (він) друзів» — серіал,

    створений на основі українських казок (З інтернету). 4. Звуки бувають

    усякі, тільки треба вміти (вони) слухати (Ю. Смолич). 5. Квітка ясенець,

    але ще в давні часи українці називали (вона) неопалимою купиною

    (С. Плачинда). 6. На вулиці було багато дітей. Усюди чулися (вони) голоси

    (З інтернету).

    А. Надпишіть над кожною утвореною формою займенника розряд за зна-

    ченням.

    Б. Визначте, якими членами речення є ці займенники. Підкресліть їх.

    178'
