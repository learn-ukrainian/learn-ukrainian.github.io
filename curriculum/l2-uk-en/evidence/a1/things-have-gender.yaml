- id: T-002
  quote: "In the table below, you will find all Ukrainian possessive pronouns and their forms.\n\n                       \
    \                    Присвійні займенники\n                                           Possessive pronouns in Ukrainian\n\
    \n                                     Masculine               Feminine                 Neuter             Plural\n\n\
    \             my                          мій                    моя́                   моє́              мої́\n\n   \
    \          your (sing.)               твій                    твоя́                  твоє́             твої́\n\n     \
    \        his                                                           його́\n\n             her                     \
    \                                        її́\n\n             its                                                     \
    \      його́\n\n             our                        наш                     на́ша                 на́ше          \
    \    на́ші\n\n             your (pl.)                 ваш                     ва́ша                 ва́ше            \
    \  ва́ші\n\n             their                      ї́хній"
  sha256: 60041cb3c25568af765d3f6b5a8f24f71b90d2dd42707d8c9e8f14e23017a6e2
