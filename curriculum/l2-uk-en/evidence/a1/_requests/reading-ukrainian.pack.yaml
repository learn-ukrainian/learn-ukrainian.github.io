  - id: T-005
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0096}
    span: {first_words: 'З з', last_words: 'Зи-ма в лі-сі.'}
    supports: 'Primer part 1 printed page 98: З sound and first decodable word зима.'
  - id: T-006
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0104}
    span: {first_words: 'Б б', last_words: 'б у з о к'}
    supports: 'Primer part 1 printed page 106: Б sound and letters for білка and бузок before the reading passage.'
  - id: T-007
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0003}
    span: {first_words: 'Г г', last_words: 'іг'}
    supports: 'Primer part 2 printed page 4: Г glyph and sound [г], distinct from the next page group for Ґ.'
  - id: T-008
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0005}
    span: {first_words: 'Що тобі відомо', last_words: 'гарбуз по городу»?'}
    supports: 'Primer part 2 printed page 6: whole decodable word гарбуз in the reading-page prompt.'
  - id: T-009
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0007}
    span: {first_words: 'Бачу Ґ, ґ (ґе).', last_words: 'ґрати ґава ґрунт'}
    supports: 'Primer part 2 printed page 8: Ґ sound [ґ] contrasted with Г and decodable ґава; ґедзик is excluded by дз.'
  - id: T-010
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0011}
    span: {first_words: 'Ч ч Бачу Ч', last_words: 'че твер'}
    supports: 'Primer part 2 printed page 12: Ч sound, CV rows and decodable plural чоботи in the word-building row.'
  - id: T-011
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0015}
    span: {first_words: 'Й й', last_words: 'чай- гай- чай-'}
    supports: 'Primer part 2 printed page 16: Й sound, final-letter reading pattern and чай.'
  - id: T-012
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0019}
    span: {first_words: 'Х х', last_words: 'х м і л ь'}
    supports: 'Primer part 2 printed page 20: Х glyph and [х], with decodable хліб; ь word withheld.'
  - id: T-013
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0023}
    span: {first_words: 'Ж ж', last_words: "Ж\nаж\nож\nуж\nиж\nіж"}
    supports: 'Primer part 2 printed page 24: Ж sound and decodable жито.'
  - id: T-014
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0027}
    span: {first_words: 'Ш ш', last_words: "Ш\nаш\nош\nуш\nиш\nіш"}
    supports: 'Primer part 2 printed page 28: Ш sound and spelling of комиш in its key-word row.'
  - id: T-015
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0029}
    span: {first_words: 'Прочитай речення.', last_words: '— Ви не бачили жабок?'}
    supports: 'Primer part 2 printed page 30: whole short sentences for reading aloud, not recomposed fragments.'
  - id: T-016
    source: {table: textbooks, chunk_id: ulp-1-00-lesson-notes_l0010_w001}
    span: {first_words: 'Here is my story about', last_words: 'My mom is also a teacher. A literature teacher.'}
    supports: 'ULP Season 1 lesson 10: short first-person recap story aligned with English.'
  - id: T-017
    source: {table: textbooks, chunk_id: ulp-1-00-lesson-notes_l0010_w002}
    span: {first_words: 'Запитання — questions', last_words: '7.    Так, у тебе є дві бабусі. Вони пенсіонерки.'}
    supports: 'ULP Season 1 lesson 10: whole Ukrainian-only recap questions and source answers, including open questions and an affirmative response.'
  - id: T-018
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0105}
    span: {first_words: 'Прочитай слова. Скільки', last_words: 'над'}
    supports: 'Primer part 1 printed page 107: the Б-page read list of short decodable words, including зуб.'
  - id: T-019
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0021}
    span: {first_words: '-хи', last_words: 'горох'}
    supports: 'Primer part 2 printed page 22: Х syllables and a read list of decodable Х words after the Х key-word page.'
  - id: T-020
    source: {table: textbooks, chunk_id: antonenko-davydovych-yak-my-hovorymo_p147}
    span: {first_words: 'В українській мові є два різні звуки', last_words: 'літерами г (h) і ґ (g).'}
    supports: 'Antonenko-Davydovych, Як ми говоримо, p. 147: Ukrainian has two different sounds, similar to Latin h and g, written г and ґ; the reader must not give г the g reading.'
  - id: T-021
    source: {table: textbooks, chunk_id: uni-ukrmova-orthography-strokal-2021_s0431}
    span: {first_words: 'Сполучення Lе', last_words: 'теóрія.'}
    supports: 'Strokal, orthography manual p. 233, § 21: Latin e is written е, Latin t (th) is written т, Latin g and h are written г (ґ for an imitated g), and English h is written х in some words; the Latin-shaped Е, Т and Х are checked against these correspondences.'
exercises:
  - id: X-001
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0084}
    span: {first_words: "та\nто\nту\nти\nті", last_words: "ат\nот\nут\nит\nіт"}
    pattern: 'Read a new consonant in CV and VC rows, then read a short decodable word and copy the model offline.'
  - id: X-002
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0007}
    span: {first_words: 'грати кава грім', last_words: 'ґрати ґава ґрунт'}
    pattern: 'Compare Г and Ґ in displayed word pairs, then select the written word matching the heard sound.'
  - id: X-003
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0029}
    span: {first_words: 'Прочитай речення.', last_words: '— Ви не бачили жабок?'}
    pattern: 'Read whole short sourced sentences aloud, then answer a source-hosted comprehension question.'
  - id: X-004
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0077}
    span: {first_words: 'Перепиши в зошит.', last_words: 'Панас ловив лини.'}
    pattern: 'Copy a printed model into a notebook; fresh tasks restrict models to the 25 taught letters.'
  - id: X-005
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-2_s0027}
    span: {first_words: '«Збери» слова', last_words: 'на склади слово, у якому дві'}
    pattern: 'Assemble a decodable written word from known letters; vary the workbook decision from sound selection.'
