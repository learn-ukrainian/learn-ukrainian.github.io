unsupported:
- claim: An English-speaker description of the sounds Ж, Ш, Ч, Х and Й (an English
    sound comparison or a typical English-reader difficulty for each). The sources
    give each Ukrainian sound (primer "Чую [ж]" lines, T-010 to T-014) and a native
    pronunciation video per letter (V-003, V-010 to V-013), and T-021 shows only that
    English h is written х in some borrowed words; no textbook record describes these
    five sounds for an English speaker, so the plan teaches them by the native model
    and states no English comparison.
  id: U-001
  resolved_by: 'Not taught as an English-comparison claim, because no source supports
    one. The five letters are taught from the native audio models instead: Ж by V-012,
    Ш by V-013, Ч by V-010, Х by V-011 and Й by V-003 (Ukrainian Lessons "Ukrainian
    Alphabet: How to pronounce <letter> in Ukrainian").'
  searches:
  - query: regex pleasure|measure|vision|shop|church|cheese|Bach|loch|boy|yes|like
      the English|pronounced like|sounds like near Ж Ш Ч Х Й Г
    tool: sqlite textbooks (source_file ulp-1..6-00-lesson-notes, anna-ohoiko-1000-words-2nd-ed,
      anna-ohoiko-500-verbs, pohribnyi-ukrainska-literaturna-vymova-1992, private-teacher-lessons-a)
  - query: regex ʃ|ʒ|tʃ|[x]|[j]|ɦ|zh|kh|sh|ch|voiced|voiceless|дзвінк|глух
    tool: sqlite textbooks (ulp, anna-ohoiko, private-teacher)
  - query: like the English | as in the English | in English words | English sound
      | Latin letter | English g | English h | [h] | [g]
    tool: sqlite textbooks (all subjects)
  - query: шиплячі | [ж] | [ш] | [ч] | [х] | [й] | глотков | задньоязик (hits are
      OCR-garbled and give no English comparison)
    tool: sqlite textbooks (pohribnyi-ukrainska-literaturna-vymova-1992)
  - query: titles Pronunciation|Alphabet|How to pronounce; text pleasure|shop|church|Bach|loch|boy|yes
      (the per-letter video transcripts hold only example words; the talkukrainian
      alphabet table of English equivalents is not in the stored text; external_articles
      is not a T- source table)
    tool: sqlite external_articles (ulp_youtube, ukrainianlessons.com, talkukrainian.com,
      opentext.ku.edu)
  - query: вимова звуків ж ш ч х й для англомовних
    tool: mcp sources search_sources
  - query: text like %ronunciation% (Pronunciation Trainer sections cover only the
      sound и, soft consonants, rolled Р and question words; none covers Ж, Ш, Ч,
      Х or Й)
    tool: sqlite textbooks (source_file ulp-1..6-00-lesson-notes)
