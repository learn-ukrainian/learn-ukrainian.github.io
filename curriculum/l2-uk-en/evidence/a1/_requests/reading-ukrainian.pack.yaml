module: a1/reading-ukrainian
texts:
  - id: T-001
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0084}
    span: {first_words: 'Т т', last_words: '— На .'}
    supports: 'Primer part 1 printed page 86: Т sound, CV and VC rows, and a syllabified first word.'
  - id: T-002
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0088}
    span: {first_words: 'Е е Бачу Е', last_words: 'При-ле-ті-ли , , .'}
