  - id: T-003
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0091}
    span: {first_words: 'Евеліна дивилася', last_words: 'білі сніжинки.'}
    supports: 'Primer part 1 printed page 93: decodable personal name for Е, used only as decoding material.'
  - id: T-004
    source: {table: textbooks, chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0092}
    span: {first_words: 'Д д', last_words: 'дро-ва'}
