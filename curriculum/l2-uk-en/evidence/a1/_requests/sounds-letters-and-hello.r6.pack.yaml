  span:
    first_words: На письмі звуки
    last_words: В українському алфавіті 33 букви.
  supports: Sound and letter are different units; the alphabet overview shows 33 letters without claiming
    acquired decoding.
- id: T-102
  source:
    table: textbooks
    chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0012
  span:
    first_words: 'Мовні звуки: голосні та приголосні'
    last_words: Який у тебе сьогодні настрій? Вибери.
  supports: Begin with hearing and saying a sound, then connect it with its visible letter; adapt the
    operation to adult communication.
- id: T-103
  source:
    table: textbooks
    chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0069
  span:
    first_words: Вимову одного
    last_words: називають наголошеним,
  supports: Stress is audible prominence; first model it by ear, and display stress marking only after
    the target word is decodable.
- id: T-104
  source:
    table: textbooks
    chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0134
  span:
    first_words: 403. А. Прочитайте
    last_words: питальних.
  supports: The same spoken material can convey a statement or question through its contour; no sentence
    analysis is taught.
- id: T-105
  source:
    table: textbooks
    chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0136
  span:
    first_words: Окличні речення виражають
    last_words: речення ставимо знак оклику.
  supports: An exclamation conveys emotion with a distinct speech contour; the plan uses already familiar
    greetings rather than the source's literary sentences.
- id: T-106
  source:
    table: textbooks
    chunk_id: 8-klas-ukrmova-avramenko-2025_s0104
  span:
    first_words: Успішному діалогові
    last_words: 'прощання: Добрий день! Щиро дякую! До побачення!'
  supports: A useful exchange has a greeting, a purpose and a farewell, with courtesy appropriate to the
    relationship.
