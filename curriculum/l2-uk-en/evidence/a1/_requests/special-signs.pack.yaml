    searches:
      - {tool: 'sources.search_text', query: 'Ф English; Ф Latin; Ф латинська (subject ukrmova); Ф схожа (subject bukvar); Cyrillic alphabet; ф f (source_file uni-ukrmova-orthography-strokal-2021). Returned material did not establish the required visual look-alike point.'}
      - {tool: 'sources.search_sources', query: 'літера Ф латинська F схожість (track a1). No supporting visual-comparison teaching record identified.'}
      - {tool: 'sources.get_chunk_context', query: '1-klas-bukvar-zaharijchuk-2025-2_s0059; 5-klas-ukrmova-zabolotnyi-2023_s0001; uni-ukrmova-orthography-strokal-2021_s0431. Native-letter, alphabet and transliteration evidence respectively; no visual look-alike statement.'}
      - {tool: 'read-only corpus query: textbooks', query: 'ULP seasons 1-6 and anna-ohoiko-*; regex look.like|similar.*letter|same.*letter|Latin.*letter|Cyrillic.*letter|letter.*English|Greek in chunks containing Ф or ф. Candidate passages concerned English lessons, letters as correspondence, Greek culture or generic Cyrillic learning, not the visual shape of Ф.'}
      - {tool: 'sources.search_external', query: 'alphabet, channel ulp_youtube. Per-letter pronunciation transcripts retrieved; they do not supply a T- or X- visual-comparison record.'}
