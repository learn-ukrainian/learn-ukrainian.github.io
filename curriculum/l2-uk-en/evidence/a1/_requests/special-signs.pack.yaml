    claim: 'The required Standard alphabet citation at canonical newline-numbered lines 571-572 cannot be built correctly by this base. S-001 requested 571-572 but contains a blank line and the heading for Catalog V instead of the alphabet requirement. The canonical file hash is 29d24350576a94ae702ddfa291c96c2406e2b29a081216b590b65a772f973fac. scripts/curriculum/evidence/sources.py get_standard_lines() uses str.splitlines(), which also treats the file form-feed page breaks as line separators. S-001 is retained as diagnostic evidence of the incorrect extraction, not as alphabet coverage. The request does not substitute another range; correcting the helper is outside this packet owned paths.'
    searches:
      - {tool: 'nl -ba on canonical Standard text', query: 'docs/l2-uk-en/UKRAINIAN-STATE-STANDARD-2024.txt:571-572 contains section 4.1.1 on the Ukrainian alphabet, printed and handwritten letters, uppercase and lowercase letters.'}
      - {tool: 'read-only canonical text comparison', query: 'read_text().split(newline) versus read_text().splitlines() at one-based indices 571-572: the first gives the alphabet requirement; the second gives a blank line and the Catalog V heading.'}
      - {tool: 'read-only source inspection', query: 'scripts/curriculum/evidence/sources.py:992-997 get_standard_lines() calls content.splitlines(); build-pack writes the resulting wrong slice into S-001 and pack-verify confirms that same slice.'}
