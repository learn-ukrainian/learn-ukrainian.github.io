- id: T-002
  quote: "The basic informal “Hi!” in Ukrainian is:\nfriends in Shevchenko park in Ки́їв; we had\nsome ice cream — моро́зиво.\
    \ Here is how our                                             Приві́т!\nconversations started:                       \
    \                 We use this word very often to greet our friends,\n                                                \
    \              close family, and people we work with without any\n                                                   \
    \           superiority between.\n   Анна: Приві́т!                                             You do not usually say\
    \ Приві́т! to your boss or a\n                                                              cashier."
  sha256: 76143aba6f44c7f1dcf13ac8272f9253f681738dd3c3323de088190aaea944b8
