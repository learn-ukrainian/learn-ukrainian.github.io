texts:
- id: T-101
  quote: 'На письмі звуки позначаємо буквами.

    Сукупність букв, розташованих у встановленому для

    певної мови порядку, називають алфавітом (азбукою, абет-

    кою). В українському алфавіті 33 букви.'
  sha256: bd613df3f806a03de3b47139b2364a1ee69ef484f27a23f507725bb5f618ebd2
  source:
    author: zabolotnyi
    chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0062
    file: 5-klas-ukrmova-zabolotnyi-2023
    grade: '5'
    kind: textbook
    page: 86
    row_sha256: 5d17fe32ef3fdc0d31a28d84f995bac352ce6b7f9ca47cdc1c742a8a016caf50
    section_id: 38992
  supports: Sound and letter are different units; the alphabet overview shows 33 letters without claiming acquired decoding.
- id: T-102
  quote: 'Мовні звуки: голосні та приголосні

    Вимов перший звук у словах — назвах предметів.

    Який це звук? Голосний звук позначаємо так: [•].

    [ • ] [ • ]

    Вимов перший звук у словах — назвах предме-

    тів. Який це звук? Приголосний звук позначає-

    мо так: [–].

    [ – ] [ – ] [ – ]

    [ – ]

    Вимов голосні звуки в словах — назвах предме-

    тів.

    Вимов приголосні звуки в словах — назвах

    предметів.

    Який у тебе сьогодні настрій? Вибери.'
  sha256: ce6ced60129acbab50e73f9e4852775b8874d16ce765ddd090e547834fbd159a
  source:
    author: zaharijchuk
    chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0012
