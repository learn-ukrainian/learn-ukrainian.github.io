- id: T-004
  quote: "Here are the three piece of advice I gave during\n                                                             \
    \     4.    вій – вий –\nthe podcast for learning how to pronounce и:\n 1. In the English language, we can compare the\
    \                   5.    рив – рів –\n    и sound to the short i in words like a bit, a                 6.    він – він\
    \ +\n    little. In Ukrainian, it is very similar but a little\n                                                     \
    \             7.    дим – дім –\n    longer and deeper:\n                                                            \
    \      8.    мій – мий –\n                    оди́н три ми\n 2. My second suggestion is to think about и as\n    the sound\
    \ between і and у. Say iii and try to"
