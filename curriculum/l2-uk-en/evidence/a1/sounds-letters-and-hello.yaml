  items_sample:
  - '2. Визначте етикетні формули ділового спілкування (усно).

    Вітання: Привіт! Доброго ранку! Вітаннячко! Добрий день!

    Подяка: Вельми вдячний! Щиро дякую! Красненько дякую!

    Прощання: До побачення! Бувайте! Щасливо! На все добре!'
  pattern: Choose a greeting, thanks or farewell for a real interlocutor; adapt the school setting to an adult peer or receptionist.
