    grade: '5'
    kind: textbook
    page: 168
    row_sha256: a0025c7561cc84d35d2556e8558e0b22ceb4516f256a42bf91ae00405371582b
    section_id: 39066
  supports: An exclamation conveys emotion with a distinct speech contour; the plan uses already familiar greetings rather
    than the source's literary sentences.
- id: T-106
  quote: 'Успішному діалогові сприяє використання етикетних формул, а саме: вітання, дяки, прощання: Добрий день! Щиро дякую!
    До побачення!'
