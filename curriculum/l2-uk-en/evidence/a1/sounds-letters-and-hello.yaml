    page: 15
    row_sha256: 08b94515e5a3c8c8eb7f716c0e4c7002803687a510c51e45e516145108792741
    section_id: 12963
  supports: Begin with hearing and saying a sound, then connect it with its visible letter; adapt the operation to adult communication.
- id: T-103
  quote: 'Вимову одного зі складів з більшою силою голосу нази-

    вають наголосом.

    Склад, на який падає наголос, називають наголошеним,'
  sha256: 6747dccfc9b5491671fd95949035b75c6675b88332815090890d5cdf217668af
  source:
    author: zabolotnyi
    chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0069
