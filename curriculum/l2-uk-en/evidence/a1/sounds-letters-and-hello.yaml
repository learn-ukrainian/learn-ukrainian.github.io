- id: T-005
  quote: "Here is my story about я і моя́ сім’я́ from the lesson.\n\n                                          Я і моя сім’я\n\
    Приві́т! Як спра́ви? У ме́не — чудо́во. Мене́ зва́ти Hi! How are you? I am great. My name is Anna\nА́нна Ого́йко, я вчи́телька\
