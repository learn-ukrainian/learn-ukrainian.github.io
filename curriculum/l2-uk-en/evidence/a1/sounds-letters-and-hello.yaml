    decodable.
- id: T-104
  quote: '403. А. Прочитайте речення вголос з відповідною

    інтонацією. Від чого вона залежить?

    1. Діти читають сучасні художні твори.

    2. Діти читають сучасні художні твори?

    3. Діти, читайте сучасні художні твори.

    Б. У якому реченні розповідають про читання, у якому – закликають

    читати, а в якому – запитують про читання?

    В. Зробіть висновок про те, чим розповідні речення відрізняються від

    питальних.'
  sha256: 89ebfb29362aa8f49545eb3993ccf11e9a88ab0aa64a38971b7239c7afdfa279
  source:
    author: zabolotnyi
    chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0134
    file: 5-klas-ukrmova-zabolotnyi-2023
    grade: '5'
    kind: textbook
    page: 166
    row_sha256: c08f53195545178c64911796118d0c86a492441611e24284bbab4ddee4958d45
    section_id: 39064
  supports: The same spoken material can convey a statement or question through its contour; no sentence analysis is taught.
- id: T-105
  quote: 'Окличні речення виражають сильні емоції – радість,

    здивування, захоплення, біль, сум, відчай, страх, обурення

    тощо. НАПРИКЛАД: 1. Яка розкішна цьогоріч зима! Стільки

    снігу намело!.. (Дара Корній). 2. Вода?! Вода!

    –

    закричав

    Остап.

    –

    Дарино, вода! (Т. Поставна).

    В усному мовленні окличні речення вимовляємо з оклич-

    ною інтонацією, тон підвищуємо на початку й у кінці речення.

    На письмі в кінці окличного речення ставимо знак оклику.'
  sha256: 6d103fcc6edb1a7282d84dd4a86804b581fd39ab513a140147e124486254ba78
  source:
    author: zabolotnyi
    chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0136
