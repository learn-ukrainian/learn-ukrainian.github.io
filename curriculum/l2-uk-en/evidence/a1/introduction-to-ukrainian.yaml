    row_sha256: 5d17fe32ef3fdc0d31a28d84f995bac352ce6b7f9ca47cdc1c742a8a016caf50
    section_id: 38992
  supports: An alphabet is an ordered set of letters; Ukrainian has 33. The overview creates no acquired letter inventory.
- id: T-005
  quote: Звуки ми чуємо й вимовляємо, а букви бачимо й пишемо­ .
  sha256: 41ac561f36a54a234ab6d29b093244f2708657a2620dafa4c610e35d63cb739e
  source:
