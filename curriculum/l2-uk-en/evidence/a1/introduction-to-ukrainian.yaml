- id: T-002
  quote: 'Дорогий першокласнику!

    Дорога першокласнице!

    Перед тобою перший підручник з української

    мови. Перегорни сторінки, розглянь, що на них зобра-

    жено. Ти побачиш багато малюнків, букв, текстів. Учи-

    телька / учитель тобі допоможе в цьому розібратися.

    Працюючи з книжкою, ти розкажеш про себе, свою

    родину'
  sha256: 95852b27160b9c819d6910f7c4720f8d4ae5b02847e7b6530cde7b2ad6a71668
