- id: T-003
  quote: 'Звуки. Немовні звуки. Жести

    Відтвори звуки потяга, який наближається до

    хлопчика й навпаки.

    Мова без слів (жести)'
  sha256: 6742bc020216f35134887e75b6e70164b0af01f330e4f00ec738153295ba8951
