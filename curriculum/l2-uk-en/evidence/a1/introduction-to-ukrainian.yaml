texts:
- id: T-001
  quote: 'Українська мова належить до слов''янської групи індоєвропейської родини мов

    (східнослов''янська підгрупа).'
  sha256: a6ca4a22eba633589937ecfedae061e2d475a8ea5cd3fe7d09c0aad9b20e1e87
  source:
    author: haluzynska
    chunk_id: uni-ukrmova-prof-haluzynska-2006_s0007
    file: uni-ukrmova-prof-haluzynska-2006
    grade: university
    kind: textbook
    page: 5
    row_sha256: 0d904f4392e6858a37d0dd537f9e874b26047d755f4d873f2ad6ea80ba0b97ea
    section_id: 52532
  supports: Ukrainian is a Slavic language in the Indo-European family; this is language identity, not a comparison with Russian.
- id: T-002
  quote: '1798 рік – початок нової української літературної

    мови

    Виходять друком перші 3 частини “Енеїди”

    І.П.Котляревського. І.Котляревський –

    зачинатель нової української

    літературної мови, який ввів до літератури

    багату, колоритну, співучу народну мову'
  sha256: 484dccc76058644f60a483ae18e3804de2dfa57872f80a4546cf0b0867ff2293
  source:
    author: haluzynska
    chunk_id: uni-ukrmova-prof-haluzynska-2006_s0009
    file: uni-ukrmova-prof-haluzynska-2006
    grade: university
    kind: textbook
    page: 6
    row_sha256: 23f28caff074e2461c983da1a61f083e7ce8c67457b6849a79b73891fcd461bf
    section_id: 52533
  supports: The 1798 publication of the first three parts of Kotliarevskyi's Eneida is a milestone of the new literary language,
    not the birth of spoken Ukrainian.
- id: T-003
  quote: "Це передусім праці Юрія Жлук- \nтенка, професора Київського університету ім. Тараса Шевченка, \n«Українсько-англійські\
    \ міжмовні відносини. Українська мова у США \nі Канаді» (1964), «Мовні контакти» (1966), в яких автор аналізував \nбілінгвізм\
    \ українців у англомовному світі, інтерференційні впливи \nанглійської мови на українську на різних структурних рівнях\
    \ мови."
  sha256: 8440973b231bd9e94a371ae0428de46ebd891568506b11a533ed00f2e1e3d2ea
  source:
    author: masenko
    chunk_id: uni-ukrmova-sociolinguistics-masenko-2010_s0030
    file: uni-ukrmova-sociolinguistics-masenko-2010
    grade: university
    kind: textbook
    page: 18
    row_sha256: 73fe2b115c0f2f0df7521e8f7e8b03c5b9aac1cd8e3254f89ac025c99b5acabb
    section_id: 53873
  supports: Ukrainian is also used in diaspora communities, with the United States and Canada as documented examples; no current
    population statistics.
- id: T-004
  quote: 'На письмі звуки позначаємо буквами.

    Сукупність букв, розташованих у встановленому для

    певної мови порядку, називають алфавітом (азбукою, абет-

    кою). В українському алфавіті 33 букви.'
  sha256: bd613df3f806a03de3b47139b2364a1ee69ef484f27a23f507725bb5f618ebd2
  source:
    author: zabolotnyi
    chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0062
