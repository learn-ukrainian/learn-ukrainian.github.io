  text: '      попрощатися: До побачення. Добраніч. Бувай;'
- file_sha256: 29d24350576a94ae702ddfa291c96c2406e2b29a081216b590b65a772f973fac
  id: S-002
  lines: 239-243
  text: "      1.1.1.2. Особа розуміє:\n      короткі репліки стислого діалогу, що стосуються основних потреб\nповсякденного\
    \ життя;\n      короткі монологічні висловлювання визначеної тематики (див. Каталог А\nта Каталог Б), сформульовані літературною\
    \ мовою."
- file_sha256: 29d24350576a94ae702ddfa291c96c2406e2b29a081216b590b65a772f973fac
  id: S-003
  lines: 268-270
  text: "      1.1.2.2. Діалогічне мовлення:\n      прості запитання й відповіді щодо особистих даних (інформація про себе,\n\
    адреса, робота, сім’я);"
- file_sha256: 29d24350576a94ae702ddfa291c96c2406e2b29a081216b590b65a772f973fac
  id: S-004
  lines: 410-432
  text: "     1.4.1.2.1. Особа розуміє прості висловлювання співрозмовника в межах\nмінімального переліку мовленнєвих ситуацій\
    \ (див. Каталог А та Каталог Б),\nякщо співрозмовник висловлюється повільно, досить чітко, повторює і\nперефразовує свої\
    \ висловлювання.\n\n      1.4.1.2.2. Особа вміє:\n      адекватно, відповідно до норм мовленнєвого етикету реагувати на\n\
    репліки співрозмовника;\n      брати участь у простому діалозі, виражаючи комунікативні наміри в\nмежах мінімального набору\
    \ мовленнєвих ситуацій (див. Каталог Б);\n      вживати стандартні мовні формули привітання, прощання, подяки,\nвибачення\
    \ і побажання;\n      відрекомендувати себе, розповісти про себе, свою сім’ю, хобі, навчання\nчи роботу (хто я, хто він\
    \ / вона?; яке моє, його / її ім’я?; яка моя, його / її\nнаціональність, рідна країна і мова?), а також про свій дім,\
    \ своє місто й рідну\nкраїну;\n      відповідати на прості запитання про особу, об’єкт, місце чи ознаку і\nставити елементарні\
    \ запитання;\n      висловити елементарні прохання: Дайте, будь ласка. Скажіть, будь\nласка.\n\n      1.4.2. Типи текстів:\n\
    \      простий діалог (4 – 6 реплік) у межах мінімального переліку мовленнєвих"
- file_sha256: 29d24350576a94ae702ddfa291c96c2406e2b29a081216b590b65a772f973fac
  id: S-005
  lines: 578-579
  text: '     вимова голосних у наголошеній і ненаголошеній позиціях. Вимова

    ненаголошених [е], [и]: с[еи]стра, в[еи]черя, в[ие]делка, з[ие]ма;'
texts:
- id: T-001
  quote: "Інна: Приві́т!\n   Анна: Як спра́ви?                                          It is easy to pronounce /pryvít/ —\
    \ just smile when\n   Інна: Чудо́во! Ра́да тебе́ ба́чити.                        you say it! :)\n   Анна: Я теж.\n   Інна:\
    \ А у те́бе як спра́ви?                                   How are you? — Як справи?\n   Анна: До́бре."
  sha256: 12054c26e86928449f6ccd3c42aa3354f673eb8a2f8e1e5daf71a29df85e5def
