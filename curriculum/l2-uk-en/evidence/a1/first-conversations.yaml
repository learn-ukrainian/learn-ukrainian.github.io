texts:
- id: T-501
  quote: '230. А. Вимовте вголос слова, звертаючи увагу на місце наголосу.

    зима

    зимонька

    височ¾нь

    високо

    озеро

    озер

    Б. Простежте, чи чітко й виразно звучать голосні [е], [и] у словах пер-

    шої колонки. А другої?

    В. Зробіть висновок про особливості вимови звуків [е], [и] в наголоше-

    них і ненаголошених складах.

    Чітка вимова

    Усі наголошені голосні вимовляємо чітко й виразно.

    Голосні [а], [у], [і] вимовляємо чітко й у ненаголошених

    складах. НАПРИКЛАД: [мал′унок], [ос′ін′], [меду].

    Наближення до іншого звука

    Ненаголошений [о] перед складом з наголошеним [у]

    вимовляємо з наближенням до [у]. НАПРИКЛАД: [зоузул′а],

    [моутуз­ ка].

    Ненаголошений [е] вимовляємо з наближенням до [и].

    НАПРИКЛАД: [зеирно].

    Ненаголошений [и] вимовляємо з наближенням до [е].

    НАПРИКЛАД: [зиема].

    Проте в закінченнях слів ненаголошені [е], [и] звучать

    виразно: [море], [мами].

    Довідником правильної вимови є орфоепічний словник.

    231. Прочитайте вголос речення, правильно вимовляючи голосні зву-

    ки. Запишіть фонетичною транскрипцією виділені слова. Поясніть ви-

    мову наголошених і ненаголошених голосних у них.

    1. Тобі, голубко, хоч води напиться (Л. Костенко).

    2. Кришталевії джерела до весни укрила крига (С. Фоменко).

    3. Слухайтесь мене, то вас лихо не мине (Нар. творчість).

    Букви е, и

    Написання букв е, и в КОРЕНЯХ слів можна перевірити

    наголосом. Для цього потрібно змінити слово або дібрати

    до нього спільнокореневе так, щоб ненаголошений [е] або

    [и] став наголошеним. НАПРИКЛАД: великий, бо велич.

    Якщо написання сумнівного голосного не можна переві-

    рити наголосом, то користуємося такими правилами:

    97'
