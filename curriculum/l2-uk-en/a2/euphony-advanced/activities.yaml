inline:
- id: act-1
  type: quiz
  title: Послухайте сусідні звуки
  instruction: Оберіть базовий письмовий варіант для поданого контексту. Переліки читаємо без додаткової паузи й без зіставлення.
    Авторські варіанти тут не оцінюємо.
  items:
  - question: Ми їдемо ___ Львів.
    options:
    - у
    - в
    - й
    correct: 0
    explanation: Перед збігом Льв- природніше у.
  - question: Вони були ___ Одесі.
    options:
    - в
    - у
    - із
    correct: 0
    explanation: Перед голосним о природніше в.
  - question: Я працюю ___ школі.
    options:
    - у
    - в
    - й
    correct: 1
    explanation: 'Працюю закінчується на голосний; перед шк- у цьому контексті базова письмова форма в: Я працюю в школі.'
  - question: Він навчається ___ університеті.
    options:
    - в
    - у
    - і
    correct: 0
    explanation: У університеті звучить важко, тому в університеті.
  - question: Я піду ___ Олею.
    options:
    - з
    - зі
    - із
    correct: 0
    explanation: Перед голосним достатньо короткого з.
  - question: Вона прийшла ___ школи.
    options:
    - зі
    - з
    - й
    correct: 0
    explanation: Перед буквосполученням шк- базова модель зі школи. Це не заборона всіх інших авторських варіантів.
  - question: Це Марко ___ Денис.
    options:
    - й
    - з
    - у
    correct: 0
    explanation: Марко закінчується на голосний; у звичайному переліку без паузи перед наступним приголосним базова форма
      й.
  - question: Це Олена ___ Тарас.
    options:
    - й
    - з
    - в
    correct: 0
    explanation: Олена закінчується на голосний; у звичайному переліку без паузи перед наступним приголосним базова форма
      й.
- id: act-2
  type: fill-in
  title: З, із чи зі?
  instruction: Оберіть базову письмову форму прийменника з у поданому контексті. Враховуйте слово перед пропуском і слово
    після нього.
  items:
  - sentence: Я повертаюся ___ школи.
    answer: зі
    options:
    - зі
    - з
    - й
    explanation: Перед шк- уживаємо зі.
  - sentence: Вона їде ___ Львова.
    answer: зі
    options:
    - зі
    - з
    - й
    explanation: Зі Львова звучить плавніше через збіг Льв-.
  - sentence: Ми говорили ___ Оленою.
    answer: з
    options:
    - з
    - зі
    - із
    explanation: Перед голосним о коротке з звучить природно.
  - sentence: Він повернувся ___ школи.
    answer: зі
    options:
    - зі
    - з
    - й
    explanation: Перед шк- природно зі.
  - sentence: Ти йдеш ___ мною?
    answer: зі
    options:
    - зі
    - з
    - і
    explanation: Перед мною використовуємо базову модель зі мною. Правопис також подає зо мною; цього варіанта тут немає.
  - sentence: Вона прийшла ___ університету.
    answer: з
    options:
    - з
    - зі
    - із
    explanation: Перед голосним у достатньо з.
  - sentence: Ми зробили це ___ задоволенням.
    answer: із
    options:
    - із
    - з
    - у
    explanation: Перед початковою з у слові задоволенням базова письмова форма із. Ключ не встановлює заборони з в усіх контекстах.
  - sentence: Новини ___ Києва.
    answer: з
    options:
    - з
    - зі
    - із
    explanation: З Києва звучить нормально.
- id: act-3
  type: match-up
  title: Варіант і базова модель
  instruction: Зіставте варіант ліворуч із базовою письмовою моделлю праворуч. Коротку прийменникову фразу читаємо як початок
    речення, перелік без паузи й без зіставлення. Ліва колонка не означає, що кожен варіант заборонений у всіх текстах.
  pairs:
  - left: в Львові
    right: у Львові
  - left: у Одесі
    right: в Одесі
  - left: з школи
    right: зі школи
  - left: з мною
    right: зі мною
  - left: із Оленою
    right: з Оленою
  - left: брат й сестра
    right: брат і сестра
  - left: мама і тато
    right: мама й тато
  - left: у університеті
    right: в університеті
- id: act-4
  type: group-sort
  title: Яке правило працює?
  instruction: Розсортуйте фрази за типом милозвучності.
  groups:
  - label: у/в
    items:
    - у Львові
    - в Одесі
    - у школі
    - в університеті
  - label: з/із/зі
    items:
    - з Олею
    - із сестрою
    - зі школи
    - зі мною
  - label: і/й
    items:
    - брат і сестра
    - мама й тато
    - Олена й Тарас
    - Марко й Денис
workbook:
- type: true-false
  title: Перевірка милозвучності
  instruction: Позначте, чи відповідає фраза базовій письмовій моделі уроку. Фрази без попередніх слів читаємо як початок
    речення; кому читаємо як паузу. Авторські варіанти тут не оцінюємо.
  items:
  - statement: Вона дивиться у вікно.
    correct: true
    explanation: Перед початковою в у слові вікно базова форма у незалежно від кінця попереднього слова.
  - statement: у Одесі
    correct: false
    explanation: 'На початку речення перед голосним О базова форма в: В Одесі.'
  - statement: зі школи
    correct: true
    explanation: Перед шк- уживаємо зі.
  - statement: зі ним
    correct: false
    explanation: 'На початку речення перед одиничною н базова форма з: З ним. Це не заборона авторських варіантів у всіх контекстах.'
  - statement: з Оленою
    correct: true
    explanation: Перед голосним о достатньо з.
  - statement: з мною
    correct: false
    explanation: Базова модель зі мною; Правопис також подає зо мною. Тут оцінюємо задану модель, а не всі можливі контексти
      з мною.
  - statement: мама й тато
    correct: true
    explanation: Після голосного часто природно й.
  - statement: Він прийшов, й ми почали.
    correct: false
    explanation: 'Після позначеної комою паузи перед приголосним м у слові ми базова форма і: Він прийшов, і ми почали.'
- type: fill-in
  title: Один маршрут
  instruction: Оберіть базову письмову форму в поданому контексті. Переліки читаємо без додаткової паузи й без зіставлення,
    кому як паузу. Авторські варіанти тут не оцінюємо.
  items:
  - sentence: Вона ___ в аудиторію.
    answer: ввійшла
    options:
    - ввійшла
    - увійшла
    - й
    explanation: 'Вона закінчується на голосний. Перед наступною в у цій формі дієслова базове початкове в-: Вона ввійшла
      в аудиторію. Увійшла є словниковим варіантом, але тут тренуємо подану письмову модель.'
  - sentence: Потім ми будемо ___ Одесі.
    answer: в
    options:
    - в
    - у
    - і
    explanation: В Одесі уникає зіткнення голосних.
  - sentence: Я поїду ___ сестрою.
    answer: із
    options:
    - із
    - і
    - в
    explanation: Перед одиничною с у слові сестрою базова письмова форма із.
  - sentence: Вона повертається ___ школи.
    answer: зі
    options:
    - зі
    - з
    - в
    explanation: Зі школи - природна форма.
  - sentence: Ми знаємо, що Олена ___ Степан купили квитки.
    answer: й
    options:
    - й
    - з
    - у
    explanation: Олена закінчується на голосний а; перед початковими ст у слові Степан у цьому переліку без паузи базова форма
      й. Що приєднує підрядну частину, а й поєднує імена всередині неї.
  - sentence: Ми прийшли, ___ каса вже працювала.
    answer: і
    options:
    - і
    - й
    - у
    explanation: Після позначеної комою паузи перед приголосним к у слові каса базова форма і.
  - sentence: Вони живуть ___ університеті.
    answer: в
    options:
    - в
    - у
    - з
    explanation: В університеті звучить краще, ніж у університеті.
  - sentence: Ми купили хліб ___ масло.
    answer: і
    options:
    - і
    - й
    - з
    explanation: Хліб закінчується на приголосний б, масло починається на приголосний м. Між ними базова форма і. Хліб і масло
      називають те, що ми купили.
- type: error-correction
  title: Виправте за правилом
  instruction: Оберіть виправлення за базовими письмовими правилами уроку. Збережіть зміст і розділові знаки речення. Кому
    читаємо як паузу.
  items:
  - sentence: Я був в Львові.
    error: в Львові
    correction: Я був у Львові.
    options:
    - Я був у Львові.
    - Я був в Львові.
    explanation: Перед збігом Льв- природніше у.
  - sentence: Ми жили у Одесі.
    error: у Одесі
    correction: Ми жили в Одесі.
    options:
    - Ми жили в Одесі.
    - Ми жили у Одесі.
    explanation: Перед голосним о природніше в.
  - sentence: Вона повертається з школи.
    error: з школи
    correction: Вона повертається зі школи.
    options:
    - Вона повертається зі школи.
    - Вона повертається з школи.
    explanation: Перед шк- допомагає форма зі.
  - sentence: Ти підеш з мною?
    error: з мною
    correction: Ти підеш зі мною?
    options:
    - Ти підеш зі мною?
    - Ти підеш з мною?
    explanation: Базова модель зі мною; можливий також варіант зо мною. Знак питання зберігаємо.
  - sentence: Ми говорили із Оленою.
    error: із Оленою
    correction: Ми говорили з Оленою.
    options:
    - Ми говорили з Оленою.
    - Ми говорили із Оленою.
    explanation: Перед голосним достатньо короткого з.
  - sentence: Ми знаємо, що брат й сестра вдома.
    error: й
    correction: Ми знаємо, що брат і сестра вдома.
    options:
    - Ми знаємо, що брат і сестра вдома.
    - Ми знаємо, що брат й сестра вдома.
    explanation: У підрядній частині брат і сестра маємо і між приголосними т та с. Що приєднує цю частину до Ми знаємо; кому
      перед що зберігаємо.
  - sentence: Олена й Юрій купили квитки.
    error: й
    correction: Олена і Юрій купили квитки.
    options:
    - Олена і Юрій купили квитки.
    - Олена й Юрій купили квитки.
    explanation: Перед словом Юрій, яке починається з Ю, базова форма і. Звичайне правило й після голосного тут не застосовуємо.
  - sentence: Ми прийшли, й каса вже працювала.
    error: й
    correction: Ми прийшли, і каса вже працювала.
    options:
    - Ми прийшли, і каса вже працювала.
    - Ми прийшли, й каса вже працювала.
    explanation: Після позначеної комою паузи перед приголосним к у слові каса базова форма і.
- type: unjumble
  title: Складіть плавне речення
  instruction: Поставте слова в природний порядок.
  items:
  - words:
    - Ми
    - їдемо
    - у
    - Львів
    answer: Ми їдемо у Львів.
  - words:
    - Вона
    - живе
    - в
    - Одесі
    answer: Вона живе в Одесі.
  - words:
    - Я
    - повертаюся
    - зі
    - школи
    answer: Я повертаюся зі школи.
  - words:
    - Денис
    - і
    - сестра
    - вдома
    answer: Денис і сестра вдома.
  - words:
    - Олена
    - й
    - Тарас
    - біля
    - вокзалу
    answer: Олена й Тарас біля вокзалу.
  - words:
    - Ми
    - говорили
    - з
    - Олею
    answer: Ми говорили з Олею.
  - words:
    - Він
    - прийшов
    - із
    - сестрою
    answer: Він прийшов із сестрою.
  - words:
    - Вона
    - прийшла
    - зі
    - мною
    answer: Вона прийшла зі мною.
- type: quiz
  title: Маршрут без спотикання
  instruction: Оберіть речення за базовими письмовими правилами уроку. Короткі відповіді читаємо як початок речення, переліки
    без додаткової паузи й без зіставлення, кому як паузу.
  items:
  - question: Куди ви їдете?
    options:
    - У Львів і в Одесу.
    - В Львів і у Одесу.
    - Й Львів та у Одесу.
    correct: 0
    explanation: У Львів, але в Одесу.
  - question: З ким вона прийшла?
    options:
    - З Олею і Денисом.
    - Із Олею і Денисом.
    - Зі Олею й Денисом.
    correct: 0
    explanation: Перед голосним О використовуємо з. Після кінцевої ю у слові Олею єднальний сполучник у базовій моделі і або
      та; серед поданих відповідей підходить перша.
  - question: Звідки він повернувся?
    options:
    - Зі школи.
    - З школи.
    - І школи.
    correct: 0
    explanation: Перед шк- природне зі.
  - question: Що було, коли ми прийшли?
    options:
    - Ми прийшли, і каса вже працювала.
    - Ми прийшли, й каса вже працювала.
    - Ми прийшли, в каса вже працювала.
    correct: 0
    explanation: Після позначеної комою паузи перед приголосним к у слові каса базова форма і.
  - question: Де вони були?
    options:
    - У школі, в університеті й на курсах.
    - В школі, у університеті і на курсах.
    - Й школі, із університеті та курсах.
    correct: 0
    explanation: У школі відповідає початковій моделі; в університеті стоїть перед голосним; й на курсах стоїть після голосного.
      У другій відповіді змінюємо у університеті на в університеті; початкове В школі саме по собі дозволене.
  - question: Як сказати про сестру?
    options:
    - Із сестрою.
    - І сестрою.
    - В сестрою.
    correct: 0
    explanation: Перед одиничною с у слові сестрою базова письмова форма із. Інші авторські варіанти оцінюють у їхньому контексті.
  - question: Як сказати про нього?
    options:
    - З ним.
    - Й ним.
    - В ним.
    correct: 0
    explanation: На початку речення перед одиничною н базова форма з. Цей ключ не забороняє із ним в іншому контексті.
  - question: Як почати речення?
    options:
    - У Львові сьогодні тепло.
    - В Львові сьогодні тепло.
    - Й Львові сьогодні тепло.
    correct: 0
    explanation: Перед Льв- на початку речення природне у.
