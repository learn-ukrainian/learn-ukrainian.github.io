- id: act-w306
  type: quiz
  title: Офіці́йні да́ні та зверта́ння — Official data and forms of address
  instruction: Ви́знач пра́вильну на́зву елеме́нта офіці́йного і́мені. — Determine the correct name for the component of an official name.
  items:
  - prompt: «Окса́на» в докуме́нті — це... — "Окса́на" in a document is...
    options:
    - text: ім'я́
      correct: true
    - text: прі́звище
      correct: false
    - text: по ба́тькові
      correct: false
    explanation: Окса́на — це вла́сне ім'я́ (given name). — Oksana is a given name.
  - prompt: «Васи́лівна» в офіці́йному зверта́нні — це... — "Васи́лівна" in a formal address is...
    options:
    - text: по ба́тькові
      correct: true
    - text: ім'я́
      correct: false
    - text: прі́звище
      correct: false
    explanation: Васи́лівна — це фо́рма по ба́тькові. — Vasylivna is a patronymic form.
  - prompt: «Ковале́нко» в анке́ті — це... — "Ковале́нко" on a form is...
    options:
    - text: прі́звище
      correct: true
    - text: ім'я́
      correct: false
    - text: по ба́тькові
      correct: false
    explanation: Ковале́нко — украї́нське прі́звище. — Kovalenko is a Ukrainian surname.
  - prompt: Яка́ фо́рма по ба́тькові пра́вильна для дочки́ Петра́? — Which patronymic form is correct for Petro's daughter?
    options:
