inline:
- id: act-301
  type: quiz
  title: Запита́ння до сіме́йних фо́то — Questions for family photos
  instruction: Обери́ пра́вильну ві́дповідь або́ запита́ння для розмо́ви про фотогра́фії. — Choose the correct answer or question for a conversation about photos.
  items:
  - prompt: Ти хо́чеш спита́ти, хто зобра́жений на зні́мку. — You want to ask who is in the photo.
    options:
    - text: Хто це на фо́то?
      correct: true
    - text: Що це на фо́то?
      correct: false
    - text: Де це на фо́то?
      correct: false
    explanation: Пита́ння «Хто це?» вжива́ємо про люде́й. — The question "Хто це?" is used for people.
  - prompt: Ти запи́туєш дру́га, чи це йо́го ма́ма. — You ask a friend whether this is his mom.
    options:
    - text: Чи це твоя́ ма́ма?
      correct: true
    - text: Чи це твій ма́ма?
      correct: false
    - text: Чи це твоє́ ма́ма?
      correct: false
    explanation: Ма́ма — жіно́чого ро́ду, тому́ вжива́ємо твоя́. — "Ма́ма" is feminine, therefore we use "твоя́".
  - prompt: Ти пока́зуєш на бра́та й ка́жеш йо́го ім'я́. — You point to your brother and say his name.
    options:
    - text: Це мій брат. Йо́го зва́ти Ко́ля.
      correct: true
    - text: Це мій брат. Її зва́ти Ко́ля.
      correct: false
    - text: Це мій брат. Мій зва́ти Ко́ля.
      correct: false
    explanation: Для чолові́ка (бра́та) вжива́ємо займе́нник йо́го. — For a man (brother) we use the pronoun "йо́го".
  - prompt: Ти пока́зуєш на сестру́ й ка́жеш її ім'я́. — You point to your sister and say her name.
    options:
    - text: Це моя́ сестра́. Її зва́ти Катя́.
      correct: true
    - text: Це моя́ сестра́. Йо́го зва́ти Катя́.
      correct: false
    - text: Це моя́ сестра́. Їх зва́ти Катя́.
      correct: false
    explanation: Для жінки́ (се́стри) вжива́ємо займе́нник її. — For a woman (sister) we use the pronoun "її".
  - prompt: Ти пока́зуєш мі́сто на світли́ні. — You point to a city in the photo.
    options:
    - text: Це моє́ рі́дне мі́сто.
      correct: true
    - text: Це мій рі́дне мі́сто.
      correct: false
    - text: Це моя́ рі́дне мі́сто.
      correct: false
    explanation: Мі́сто — сере́днього ро́ду, тому́ вжива́ємо моє́. — "Мі́сто" is neuter, therefore we use "моє́".
  - prompt: Ти запи́туєш про спі́льні сіме́йні зні́мки. — You ask about shared family photos.
    options:
    - text: Де твої́ сіме́йні фотогра́фії?
      correct: true
    - text: Де твій сіме́йні фотогра́фії?
      correct: false
    - text: Де твоя́ сіме́йні фотогра́фії?
      correct: false
    explanation: Фотогра́фії — множина́, тому́ вжива́ємо твої́. — "Фотогра́фії" is plural, therefore we use "твої́".
- id: act-302
  type: fill-in
  title: Твій, твоя́, твоє́ чи твої́? — Твій, твоя́, твоє́, or твої́?
  instruction: Встав пра́вильну фо́рму займе́нника до ко́жного іме́нника. — Insert the correct form of the pronoun for each noun.
  items:
  - sentence: Це ___ ма́ма на фотогра́фії?
    answer: твоя́
    options:
    - твоя́
    - твій
    - твоє́
    - твої́
    explanation: Ма́ма — жіно́чого ро́ду, тому́ твоя́. — "Ма́ма" is feminine, therefore "твоя́".
  - sentence: Ось ___ діду́сь Васи́ль.
    answer: твій
    options:
    - твій
    - твоя́
    - твоє́
    - твої́
    explanation: Діду́сь — чолові́чого ро́ду, тому́ твій. — "Діду́сь" is masculine, therefore "твій".
  - sentence: Це ___ рі́дне мі́сто?
    answer: твоє́
    options:
    - твоє́
    - твій
    - твоя́
    - твої́
    explanation: Мі́сто — сере́днього ро́ду, тому́ твоє́. — "Мі́сто" is neuter, therefore "твоє́".
  - sentence: Де ___ сіме́йні зні́мки?
    answer: твої́
    options:
    - твої́
    - твій
    - твоя́
    - твоє́
    explanation: Зні́мки — множина́, тому́ твої́. — "Зні́мки" is plural, therefore "твої́".
  - sentence: Це ___ сестра́ Оле́на?
    answer: твоя́
    options:
    - твоя́
    - твій
    - твоє́
    - твої́
    explanation: Сестра́ — жіно́чого ро́ду, тому́ твоя́. — "Сестра́" is feminine, therefore "твоя́".
  - sentence: Це ___ прі́звище в зо́шиті?
    answer: твоє́
    options:
    - твоє́
    - твій
    - твоя́
    - твої́
    explanation: Прі́звище — сере́днього ро́ду, тому́ твоє́. — "Прі́звище" is neuter, therefore "твоє́".
- id: act-303
  type: match-up
  title: Пі́дписи до фотогра́фій — Photo captions
  instruction: З'єдна́й пі́дпис під фотогра́фією з йо́го зна́ченням. — Match the photo caption with its meaning.
  pairs:
  - left: Хто це?
    right: запита́ння про люди́ну на зні́мку — question about a person in the photo
  - left: Це моя́ сім'я́.
    right: предста́влення роди́ни — introducing family
  - left: Йо́го зва́ти Ко́ля.
    right: ім'я́ бра́та або́ та́та — name of a brother or dad
  - left: Її зва́ти Катя́.
    right: ім'я́ се́стри або́ мами́ — name of a sister or mom
  - left: Це моє́ мі́сто.
    right: на́зва насе́леного пу́нкту — name of a locality / city
  - left: Чи це твій діду́сь?
    right: уто́чнення про дідуся́ — clarification about grandfather
- id: act-304
  type: true-false
  title: Слу́хаємо та перевіря́ємо — Listen and check
  instruction: Ви́знач, чи тве́рдження є пра́вильним згі́дно з пра́вилами украї́нської мо́ви. — Determine whether the statement is correct according to the rules of Ukrainian.
  items:
  - statement: Сло́во «мі́сто» сере́днього ро́ду, тому́ пра́вильно сказа́ти «моє́ мі́сто». — The word "мі́сто" is neuter, so it is correct to say "моє́ мі́сто".
    correct: true
    explanation: Мі́сто закі́нчується на -о і є іме́нником сере́днього ро́ду. — "Мі́сто" ends in -о and is a neuter noun.
  - statement: Фо́рми «йо́го» та «її» змі́нюються за рода́ми іме́нників, як «мій» і «моя́». — The forms "йо́го" and "її" change by noun gender, like "мій" and "моя́".
    correct: false
    explanation: Фо́рми «йо́го» та «її» в ро́лі присві́йних слів є незмі́нними. — The forms "йо́го" and "її" as possessives are invariable.
  - statement: Пита́ння «Чи це твоя́ бабу́ся?» вимага́є ві́дповіді «так» або́ «ні». — The question "Чи це твоя́ бабу́ся?" requires a "yes" or "no" answer.
    correct: true
    explanation: Ча́стка «чи» на поча́тку утво́рює зага́льне запита́ння. — The particle "чи" at the beginning forms a general yes/no question.
  - statement: Зі сло́вом «сестра́» мо́жна вжи́ти займе́нник «твій». — With the word "сестра́" one can use the pronoun "твій".
    correct: false
    explanation: Сестра́ — жіно́чого ро́ду, тому́ потрі́бно каза́ти «твоя́ сестра́». — "Сестра́" is feminine, so one must say "твоя́ сестра́".
  - statement: У сло́ві «сім'я́» обов'язко́во пи́шеться апостро́ф. — In the word "сім'я́" an apostrophe is required.
    correct: true
    explanation: Апостро́ф ста́виться пі́сля «м» пере́д «я». — The apostrophe is placed after "м" before "я".
  - statement: Сло́во «батьки́» вжива́ється в множині́, тому́ пра́вильно каза́ти «твої́ батьки́». — The word "батьки́" is used in the plural, so it is correct to say "твої́ батьки́".
    correct: true
    explanation: Батьки́ — фо́рма множи́ни, що узго́джується із займе́нником «твої́». — "Батьки́" is a plural form agreeing with the pronoun "твої́".
- id: act-305
  type: odd-one-out
  title: Зна́йди за́йве сло́во — Find the odd word out
  instruction: Обери́ одне́ сло́во, яке́ не підхо́дить до гру́пи за ро́дом або́ зна́ченням. — Choose the one word that does not fit the group by gender or meaning.
  items:
  - options:
    - text: ма́ма
      correct: false
    - text: сестра́
      correct: false
    - text: бабу́ся
      correct: false
    - text: брат
      correct: true
    explanation: Брат — чолові́чого ро́ду, а ма́ма, сестра́ й бабу́ся — жіно́чого. — "Брат" is masculine, while "ма́ма", "сестра́", and "бабу́ся" are feminine.
  - options:
    - text: та́то
      correct: false
    - text: діду́сь
      correct: false
    - text: син
      correct: false
    - text: дочка́
      correct: true
    explanation: Дочка́ — жіно́чого ро́ду, тоді́ як і́нші слова́ познача́ють чоловікі́в. — "Дочка́" is feminine, whereas the other words refer to men.
  - options:
    - text: твій
      correct: false
    - text: мій
      correct: false
    - text: наш
      correct: false
    - text: твоя́
      correct: true
    explanation: Твоя́ — жіно́чого ро́ду, тоді́ як і́нші фо́рми — чолові́чого. — "Твоя́" is feminine, whereas the other forms are masculine.
  - options:
    - text: моє́
      correct: false
    - text: твоє́
      correct: false
    - text: мі́сто
      correct: false
    - text: мої́
      correct: true
    explanation: Мої́ — фо́рма множи́ни, а і́нші слова́ пов'я́зані із сере́днім ро́дом. — "Мої́" is plural, while the other words relate to neuter gender.
  - options:
    - text: ім'я́
      correct: false
    - text: прі́звище
      correct: false
    - text: по ба́тькові
      correct: false
    - text: зо́шит
      correct: true
    explanation: Зо́шит — навча́льний предме́т, а ре́шта — складники́ по́вного і́мені люди́ни. — "Зо́шит" is a school item, while the rest are components of a person's full name.
  - options:
    - text: оди́н
      correct: false
    - text: два
      correct: false
    - text: брат
      correct: true
    - text: дві
      correct: false
    explanation: Брат — це іме́нник, тоді́ як і́нші слова́ є числі́вниками. — "Брат" is a noun, whereas the other words are numerals.
workbook:
- id: act-w4
  type: match-up
  title: По́вне ім'я́ як сигна́л — Full name components
  instruction: З'єдна́й части́ну форма́льного і́мені з підка́зкою. Це ті́льки впізнава́ння. — Match the component of a formal name with the hint (recognition only).
  pairs:
  - left: ім'я́
    right: Марі́я — first name
  - left: прі́звище
    right: Ковале́нко — surname
  - left: по ба́тькові
    right: Васи́лівна — patronymic
  - left: До́брий день, Марі́є Васи́лівно!
    right: форма́льне зверта́ння — formal address
- id: act-w301
  type: group-sort
  title: Йо́го чи її? — Йо́го (his) or її (her)?
  instruction: Розпо́діли ре́чення за тим, чи стосу́ється ро́зповідь чолові́ка (йо́го) або́ жінки́ (її). — Sort sentences by whether they refer to a man (йо́го / his) or a woman (її / her).
  groups:
  - label: йо́го (his)
    items:
    - Це мій брат. Йо́го зва́ти Бо́гдан.
    - Це мій та́то. Йо́го зва́ти Євге́н.
    - Це мій діду́сь. Йо́го роди́на у Льво́ві.
    - Це мій син. Йо́го зо́шит тут.
  - label: її (her)
    items:
    - Це моя́ сестра́. Її зва́ти Оле́на.
    - Це моя́ ма́ма. Її зва́ти Мари́на.
    - Це моя́ бабу́ся. Її зва́ти Тетя́на.
    - Це моя́ дочка́. Її фо́то на столі́.
- id: act-w302
  type: fill-in
  title: Роди́нні пі́дписи в зо́шиті — Family captions in the notebook
  instruction: Встав пра́вильне сло́во для пі́дпису під сіме́йними світли́нами. — Insert the correct word to caption family photographs.
  items:
  - sentence: Ось ___ роди́на на фотогра́фії.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    - мої́
    explanation: Роди́на — жіно́чого ро́ду. — "Роди́на" is feminine.
  - sentence: Це ___ діду́сь і бабу́ся.
    answer: мої́
    options:
    - мої́
    - мій
    - моя́
    - моє́
    explanation: Діду́сь і бабу́ся ра́зом — множина́ (вони́). — Grandfather and grandmother together are plural (вони́).
  - sentence: Чи це ___ брат Ко́ля?
    answer: твій
    options:
    - твій
    - твоя́
    - твоє́
    - твої́
    explanation: Брат — чолові́чого ро́ду. — "Брат" is masculine.
  - sentence: Це моє́ рі́дне ___ Полта́ва.
    answer: мі́сто
    options:
    - мі́сто
    - зо́шит
    - ба́тько
    - брат
    explanation: Полта́ва — це мі́сто. — Poltava is a city.
  - sentence: Це моя́ ті́тка. ___ зва́ти Окса́на.
    answer: Її
    options:
    - Її
    - Йо́го
    - Він
    - Мій
    explanation: Ті́тка — жі́нка, тому́ вжива́ємо її. — An aunt is a woman, therefore we use "її".
  - sentence: Це мій дя́дько. ___ зва́ти Тара́с.
    answer: Йо́го
    options:
    - Йо́го
    - Її
    - Вона́
    - Моя́
    explanation: Дя́дько — чолові́к, тому́ вжива́ємо йо́го. — An uncle is a man, therefore we use "йо́го".
- id: act-w303
  type: unjumble
  title: Скла́ди ре́чення з фотогра́фій — Build sentences from photos
  instruction: Розста́в слова́ у пра́вильному поря́дку, щоб утвори́ти ре́чення. — Arrange words in the correct order to form a sentence.
  items:
  - scrambled:
    - моя́
    - Це
    - сім'я́
    - фотогра́фії
    - на
    answer: Це моя́ сім'я́ на фотогра́фії.
    hint: This is my family in the photo.
  - scrambled:
    - є
    - тебе́
    - У
    - сестра́
    - чи
    - брат
    answer: У тебе́ є брат чи сестра́?
    hint: Do you have a brother or a sister?
  - scrambled:
    - зва́ти
    - Йо́го
    - Дени́с
    - брат
    - мій
    - Це
    answer: Це мій брат. Йо́го зва́ти Дени́с.
    hint: This is my brother. His name is Denys.
  - scrambled:
    - рі́дне
    - Це
    - Львів
    - моє́
    - мі́сто
    answer: Це моє́ рі́дне мі́сто Львів.
    hint: This is my hometown Lviv.
  - scrambled:
    - Тетя́на
    - Її
    - Це
    - бабу́ся
    - моя́
    - зва́ти
    answer: Це моя́ бабу́ся. Її зва́ти Тетя́на.
    hint: This is my grandmother. Her name is Tetiana.
  - scrambled:
    - твій
    - Чи
    - це
    - на
    - діду́сь
    - фо́то
    answer: Чи це твій діду́сь на фо́то?
    hint: Is this your grandfather in the photo?
- id: act-w304
  type: error-correction
  title: Випра́в помилки́ в пі́дписах — Correct errors in captions
  instruction: Зна́йди та випра́в поми́лку в узго́дженні або́ слововжива́нні. — Find and correct the error in agreement or word choice.
  items:
  - sentence: Це мій сестра́ Катя́.
    error: мій сестра́
    correction: моя́ сестра́
    options:
    - моя́ сестра́
    - мій сестра́
    explanation: Сестра́ — жіно́чого ро́ду, тому́ потрі́бно каза́ти «моя́ сестра́». — "Сестра́" is feminine, so one must say "моя́ сестра́".
  - sentence: Це моє́ батьки́ на зні́мку.
    error: моє́ батьки́
    correction: мої́ батьки́
    options:
    - мої́ батьки́
    - моє́ батьки́
    explanation: Батьки́ — множина́, тому́ вжива́ємо «мої́ батьки́». — "Батьки́" is plural, therefore we use "мої́ батьки́".
  - sentence: Як її зва́ти? Йо́го зва́ти Окса́на.
    error: Йо́го зва́ти Окса́на
    correction: Її зва́ти Окса́на
    options:
    - Її зва́ти Окса́на
    - Йо́го зва́ти Окса́на
    explanation: Окса́на — жіно́че ім'я́, тому́ займе́нник «її». — Oksana is a woman's name, so the pronoun is "її".
  - sentence: Це твій мі́сто Ха́рків?
    error: твій мі́сто
    correction: твоє́ мі́сто
    options:
    - твоє́ мі́сто
    - твій мі́сто
    explanation: Мі́сто — сере́днього ро́ду, тому́ «твоє́ мі́сто». — "Мі́сто" is neuter, therefore "твоє́ мі́сто".
  - sentence: Це мій брат. Її звуть Іва́н.
