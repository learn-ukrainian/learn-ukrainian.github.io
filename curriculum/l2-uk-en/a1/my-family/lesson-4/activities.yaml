inline:
- id: act-401
  type: quiz
  title: Швидка́ переві́рка ре́чень
  instruction: Обери́ пра́вильний украї́нський рядо́к для роди́нної розмо́ви про фо́то.
  items:
  - prompt: Ти пока́зуєш фо́то своє́ї мами́ дру́гові.
    options:
    - text: Це моя́ ма́ма.
      correct: true
    - text: Це мій ма́ма.
      correct: false
    - text: Це моє́ ма́ма.
      correct: false
    explanation: Ма́ма — жіно́чого ро́ду, тому́ вжива́ємо моя́.
  - prompt: Ти запи́туєш дру́га про бра́та.
    options:
    - text: У тебе́ є брат?
      correct: true
    - text: У мене́ є брат?
      correct: false
    - text: Це є твій брат?
      correct: false
    explanation: У тебе́ є...? — приро́дне запита́ння про ная́вність ро́дича.
  - prompt: Ти ка́жеш, що ма́єш двох сесте́р.
    options:
    - text: У мене́ є дві се́стри.
      correct: true
    - text: У мене́ є два се́стри.
      correct: false
    - text: У мене́ є одна́ се́стри.
      correct: false
    explanation: Зі сло́вом се́стри (жіно́чий рід) вжива́ємо дві.
  - prompt: Ти представля́єш свого́ ста́ршого бра́та.
    options:
    - text: Це мій ста́рший брат.
      correct: true
    - text: Це моя́ ста́рший брат.
      correct: false
    - text: Це моє́ ста́рший брат.
      correct: false
    explanation: Брат — чолові́чого ро́ду, тому́ мій ста́рший брат.
  - prompt: Ти розповіда́єш про профе́сію мами́.
    options:
    - text: Моя́ ма́ма — вчи́телька.
      correct: true
    - text: Мій ма́ма — вчи́телька.
      correct: false
    - text: Моя́ ма́ма є вчи́телька.
      correct: false
    explanation: В украї́нській мо́ві зв'я́зка є зазвича́й опуска́ється в тепе́рішньому
      ча́сі.
  - prompt: Ти представля́єш усі́х свої́х ро́дичів на фо́то.
    options:
    - text: Це всі мої́ ро́дичі.
      correct: true
    - text: Це всі мій ро́дичі.
      correct: false
    - text: Це всі моя́ ро́дичі.
      correct: false
    explanation: Ро́дичі — множина́, тому́ вжива́ємо мої́.
- id: act-402
  type: match-up
  title: Роди́нні зв'я́зки
  instruction: З'єдна́й украї́нське сло́во з йо́го зна́ченням.
  pairs:
  - left: дя́дько
    right: брат мами́ або́ та́та
  - left: ті́тка
    right: сестра́ мами́ або́ та́та
  - left: дружи́на
    right: жі́нка у шлю́бі
  - left: чолові́к
    right: чолові́к у шлю́бі
  - left: дити́на
    right: мале́нький син або́ до́нька
  - left: моло́дший брат
    right: брат, яки́й ме́нший за ві́ком
  - left: ста́рший брат
    right: брат, яки́й бі́льший за ві́ком
  - left: одру́жений
    right: чолові́к, яки́й ма́є дружи́ну
- id: act-403
  type: true-false
  title: Переві́рка розумі́ння розмо́ви
  instruction: Позна́ч, чи тве́рдження пра́вильне (Так) чи непра́вильне (Ні).
  items:
  - statement: Да́ша пока́зує Андрі́ю фотогра́фії свої́х ро́дичів.
    correct: true
    explanation: Да́ша пока́зує фотогра́фії своє́ї роди́ни.
  - statement: Бо́гдан — це діду́сь Да́ші.
    correct: false
    explanation: Бо́гдан — це дя́дько Да́ші.
  - statement: Окса́на — це ті́тка Да́ші.
    correct: true
    explanation: Окса́на — це ті́тка Да́ші на фо́то.
  - statement: Ста́рший брат Макси́м уже́ одру́жений.
    correct: true
    explanation: Да́ша ка́же, що Макси́м уже́ одру́жений.
  - statement: Дружи́на Макси́ма працю́є інжене́ром.
    correct: false
    explanation: Дружи́на Макси́ма — вчи́телька; інжене́ром працю́є чолові́к Да́ші.
  - statement: Да́ша та її чолові́к працю́ють у мі́сті.
    correct: true
    explanation: 'Да́ша ка́же: Ми працю́ємо тут, у на́шому мі́сті.'
- id: act-404
  type: fill-in
  title: Скла́ди ро́зповідь про сім'ю́
  instruction: Обери́ пра́вильне сло́во для ко́жного рядка́ ро́зповіді.
  items:
  - sentence: Мене́ ___ Марко́.
    answer: зва́ти
    options:
    - зва́ти
    - ім'я́
    - прі́звище
    explanation: Мене́ зва́ти... — приро́дна моде́ль знайо́мства.
  - sentence: Це моя́ ___ на фотогра́фії.
    answer: роди́на
    options:
    - роди́на
    - ро́дичі
    - батьки́
    explanation: Сло́во роди́на жіно́чого ро́ду в однині́ підхо́дить до моя́.
  - sentence: Моя́ ма́ма — ___.
    answer: вчи́телька
    options:
    - вчи́телька
    - працюва́ти
    - інжене́р
    explanation: Вчи́телька — жіно́чий рід профе́сії.
  - sentence: Мій та́то — ___.
    answer: інжене́р
    options:
    - інжене́р
    - вчи́телька
    - дити́на
    explanation: Інжене́р — на́зва профе́сії та́та.
  - sentence: У мене́ є ___ брат Тара́с.
    answer: моло́дший
    options:
    - моло́дший
    - одру́жений
    - дружи́на
    explanation: Моло́дший узго́джується зі сло́вом брат.
  - sentence: Мій ста́рший брат уже́ ___.
    answer: одру́жений
    options:
    - одру́жений
    - моло́дший
    - ті́льки
    explanation: Одру́жений означа́є, що чолові́к ма́є дружи́ну.
- id: act-405
  type: odd-one-out
  title: За́йве сло́во в роди́нному колі́
  instruction: Обери́ сло́во, яке́ не підхо́дить до гру́пи за змі́стом або́ грамати́чним ро́дом.
  items:
  - words:
    - ма́ма
    - сестра́
    - ті́тка
    - дя́дько
    answer: дя́дько
    correct: 3
    explanation: Дя́дько — чолові́чого ро́ду, а ма́ма, сестра́, ті́тка — жіно́чого.
  - words:
    - та́то
    - брат
    - син
    - дружи́на
    answer: дружи́на
    correct: 3
    explanation: Дружи́на — жіно́чого ро́ду, а та́то, брат, син — чолові́чого.
  - words:
    - вчи́телька
    - інжене́р
    - лі́карка
    - мі́сто
    answer: мі́сто
    correct: 3
    explanation: Мі́сто — насе́лений пункт, і́нші слова́ — профе́сії люде́й.
  - words:
    - оди́н
    - одна́
    - два
    - дити́на
    answer: дити́на
    correct: 3
    explanation: Дити́на — іме́нник, і́нші слова́ — числі́вники.
  - words:
    - моло́дший
    - ста́рший
    - одру́жений
    - працюва́ти
    answer: працюва́ти
    correct: 3
    explanation: Працюва́ти — дієсло́во, і́нші слова́ — прикме́тники.
  - words:
    - батьки́
    - ро́дичі
    - се́стри
    - чолові́к
    answer: чолові́к
    correct: 3
    explanation: Чолові́к — сло́во в однині́, і́нші слова́ — у множині́.
workbook:
- id: act-w5
  type: fill-in
  title: Допо́вни фотодіало́г
  instruction: Обери́ пропу́щене сло́во з роди́нної розмо́ви.
  items:
  - sentence: Це ___ сім'я́ на фотогра́фії.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Сім'я́ — жіно́чого ро́ду.
  - sentence: ___ це? Це мій та́то.
    answer: Хто
    options:
    - Хто
    - Що
    - Де
    explanation: Для люди́ни вжива́й хто.
  - sentence: Це моя́ сестра́. ___ зва́ти Катя́.
    answer: Її
    options:
    - Її
    - Йо́го
    - Вони́
    explanation: Її підхо́дить до се́стри.
  - sentence: Це мій брат. ___ зва́ти Ко́ля.
    answer: Йо́го
    options:
    - Йо́го
    - Її
    - Вона́
    explanation: Йо́го підхо́дить до бра́та.
  - sentence: А це ___ бабу́ся?
    answer: твоя́
    options:
    - твоя́
    - твій
    - твоє́
    explanation: Бабу́ся — жіно́чого ро́ду.
- id: act-w6
  type: translate
  title: Швидка́ переві́рка роди́нної ле́ксики
  instruction: Обери́ англі́йське зна́чення.
  items:
  - source: сім'я́
    options:
    - text: family, close household
      correct: true
    - text: surname
      correct: false
    - text: profession
      correct: false
    explanation: Сім'я́ — сло́во для близько́ї роди́ни.
  - source: роди́на
    options:
    - text: family or kin
      correct: true
    - text: only one parent
      correct: false
    - text: first name
      correct: false
    explanation: Роди́на ча́сто звучи́ть ши́рше, ніж сім'я́.
  - source: У мене́ є брат.
    options:
    - text: I have a brother.
      correct: true
    - text: You have a brother.
      correct: false
    - text: This is my brother.
      correct: false
    explanation: У мене́ є... — блок, щоб сказа́ти, що щось або́ хтось є в мене́.
  - source: Це моя́ сестра́.
    options:
    - text: This is my sister.
      correct: true
    - text: This is my brother.
      correct: false
    - text: This is her sister.
      correct: false
    explanation: Моя́ узго́джується зі сло́вом сестра́.
  - source: Це мій та́то.
    options:
    - text: This is my dad.
      correct: true
    - text: This is my mom.
      correct: false
    - text: Do you have a brother?
      correct: false
    explanation: Мій узго́джується зі сло́вом та́то.
- id: act-w401
  type: fill-in
  title: Нові́ слова́ про ро́дичів
  instruction: Обери́ пропу́щене сло́во про роди́ну.
  items:
  - sentence: Це мій ___, брат мого́ та́та.
    answer: дя́дько
    options:
    - дя́дько
    - ті́тка
    - дити́на
    explanation: Дя́дько — брат батькі́в.
  - sentence: Це моя́ ___, сестра́ моє́ї мами́.
    answer: ті́тка
    options:
    - ті́тка
    - дя́дько
    - чолові́к
    explanation: Ті́тка — сестра́ батькі́в.
  - sentence: Моя́ ___ — чудо́ва вчи́телька.
    answer: дружи́на
    options:
    - дружи́на
    - чолові́к
    - брат
    explanation: Дружи́на — жіно́чий рід (wife).
  - sentence: Мій ___ працю́є в ліка́рні.
    answer: чолові́к
    options:
    - чолові́к
    - дружи́на
    - сестра́
    explanation: Чолові́к — чолові́чий рід (husband).
  - sentence: У них ще зо́всім мале́нька ___.
    answer: дити́на
    options:
    - дити́на
    - ро́дичі
    - батьки́
    explanation: Дити́на — це малю́к (child).
  - sentence: На свя́то зібра́лися всі на́ші ___.
    answer: ро́дичі
    options:
    - ро́дичі
    - дити́на
    - дя́дько
    explanation: Ро́дичі — множина́ (relatives).
- id: act-w402
  type: group-sort
  title: Чолові́чий рід, жіно́чий рід чи множина́?
  instruction: Розпо́діли слова́ про роди́ну та профе́сії за грамати́чним ро́дом або́ число́м.
  groups:
  - label: чолові́чий рід
    items:
    - дя́дько
    - чолові́к
    - інжене́р
    - син
  - label: жіно́чий рід
    items:
    - ті́тка
    - дружи́на
    - вчи́телька
    - дочка́
  - label: множина́
    items:
    - ро́дичі
    - батьки́
    - се́стри
    - брати́
- id: act-w403
  type: match-up
  title: Хто ко́му хто?
  instruction: З'єдна́й роди́нне запита́ння з пра́вильною ві́дповіддю.
  pairs:
  - left: Хто таки́й дя́дько?
    right: Це брат мами́ або́ та́та.
  - left: Хто та́ка ті́тка?
    right: Це сестра́ мами́ або́ та́та.
  - left: Хто та́ка дружи́на?
    right: Це замі́жня жі́нка для свого́ чолові́ка.
  - left: Хто таки́й чолові́к?
    right: Це одру́жений партне́р для своє́ї дружи́ни.
  - left: Хто такі́ ро́дичі?
    right: Це всі близькі́ лю́ди з вели́кої роди́ни.
  - left: Хто таки́й інжене́р?
    right: Це профе́сія мого́ та́та.
- id: act-w404
  type: unjumble
  title: Скла́ди ре́чення про роди́ну
  instruction: Розста́в слова́ у пра́вильному поря́дку, щоб утвори́ти ре́чення.
  items:
  - words:
    - Це
    - мій
    - ста́рший
    - брат.
    answer: Це мій ста́рший брат.
  - words:
    - Моя́
    - дружи́на
    - —
    - вчи́телька.
    answer: Моя́ дружи́на — вчи́телька.
  - words:
    - Мій
    - чолові́к
    - —
    - інжене́р.
    answer: Мій чолові́к — інжене́р.
  - words:
    - У
    - мене́
    - ве́лика
    - роди́на.
    answer: У мене́ ве́лика роди́на.
  - words:
    - Це
    - мої́
    - улю́блені
    - ро́дичі.
    answer: Це мої́ улю́блені ро́дичі.
  - words:
    - Мій
    - брат
    - уже́
    - одру́жений.
    answer: Мій брат уже́ одру́жений.

