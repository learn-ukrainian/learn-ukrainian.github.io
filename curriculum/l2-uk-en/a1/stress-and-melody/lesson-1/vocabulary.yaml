- lemma: на́голос
  translation: word stress / accent
  pos: noun
  usage: На́голос в украї́нській мо́ві є ві́льним.
- lemma: склад
  translation: syllable
  pos: noun
  usage: У сло́ві ка́ва є два склади́.
- lemma: наголо́шений
  translation: stressed
  pos: adjective
  usage: Наголо́шений склад звучи́ть до́вше.
- lemma: ненаголо́шений
  translation: unstressed
  pos: adjective
  usage: Ненаголо́шений голосни́й [о] залиша́ється чи́стим.
- lemma: голосний
  translation: vowel
  pos: adjective / noun
  usage: Голосни́й звук форму́є основу скла́ду.
- lemma: сло́во
  translation: word
  pos: noun
  usage: Ко́жне сло́во ма́є свій на́голос.
- lemma: замок
  translation: castle (за́мок) / door lock (замо́к)
  pos: noun
  usage: Старови́нний за́мок і наді́йний замо́к.
- lemma: атлас
  translation: atlas, maps (а́тлас) / satin fabric (атла́с)
  pos: noun
  usage: Географі́чний а́тлас і су́кня з атла́су.
- lemma: орга́н
  translation: body organ (о́рган) / pipe organ (орга́н)
  pos: noun
  usage: Се́рце — це о́рган, а в собо́рі гра́є орга́н.
- lemma: сім'я
  translation: family (сім'я́) / seed (сі́м'я)
  pos: noun
  usage: На́ша сім'я́ дру́жня, а птахи́ їдя́ть сі́м'я.
- lemma: молоко
  translation: milk
  pos: noun
  usage: Сві́же молоко́ ма́є три чи́сті зву́ки [о].
- lemma: бо́рошно
  translation: flour
  pos: noun
  usage: З бі́лого бо́рошна печу́ть сві́жий хліб.
- lemma: ранок
  translation: morning
  pos: noun
  usage: До́брого ра́нку всім дру́зям!
- lemma: бу́ква
  translation: letter (written character)
  pos: noun
  usage: Бу́ква познача́є звук на письмі́.
- lemma: лі́тера
  translation: letter (written character, synonym of бу́ква)
  pos: noun
  usage: Лі́тера О за́вжди звучи́ть чи́сто.
- lemma: столи́ця
  translation: capital city
  pos: noun
  usage: Ки́їв — це прекра́сна столи́ця Украї́ни.
- lemma: кава
  translation: coffee
  pos: noun
  usage: Ура́нці ми п'ємо́ смачну́ ка́ву.
- lemma: вода
  translation: water
  pos: noun
  usage: Чи́ста вода́ тече́ в рі́чці.
- lemma: кафе
  translation: cafe
  pos: noun
  usage: Ми йдемо́ в зати́шне кафе́.
- lemma: мама
  translation: mother / mom
  pos: noun
  usage: Ма́ма чита́є кни́гу.
- lemma: тато
  translation: father / dad
  pos: noun
  usage: Та́то працю́є в мі́сті.
- lemma: книга
  translation: book
  pos: noun
  usage: Ця ціка́ва кни́га лежи́ть на столі́.
