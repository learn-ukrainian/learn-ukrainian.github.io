inline:
- id: act-2
  type: quiz
  title: "Ви́бір мело́дики — Selecting sentence melody"
  instruction: "Обери́ пе́ршу моде́ль мело́дики ре́чення."
  items:
  - prompt: "Це ка́ва."
    options:
    - text: "спадна́ ↘"
      correct: true
    - text: "висхідна́ ↗"
      correct: false
    explanation: "Тве́рдження ма́є спадну́ мело́дику."
  - prompt: "Це ка́ва?"
    options:
    - text: "висхідна́ ↗"
      correct: true
    - text: "спадна́ ↘"
      correct: false
    explanation: "Так/ні пита́ння ма́є висхідну́ мело́дику."
  - prompt: "Де метро́?"
    options:
    - text: "спадна́ ↘"
      correct: true
    - text: "висхідна́ ↗"
      correct: false
    explanation: "Пита́ння з де на A1 ма́є спадну́ мело́дику."
  - prompt: "Як га́рно!"
    options:
    - text: "сильні́ша спадна́ ↘↘"
      correct: true
    - text: "висхідна́ ↗"
      correct: false
    explanation: "О́клик ма́є сильні́шу спадну́ мело́дику."
  - prompt: "Марко́ вдо́ма."
    options:
    - text: "спадна́ ↘"
      correct: true
    - text: "висхідна́ ↗"
      correct: false
    explanation: "Розповідне́ ре́чення-тве́рдження заве́ршується спокі́йним спа́дом то́ну."
  - prompt: "Марко́ вдо́ма?"
    options:
    - text: "висхідна́ ↗"
      correct: true
    - text: "спадна́ ↘"
      correct: false
    explanation: "Зага́льне пита́ння так/ні ма́є різки́й підйо́м то́ну на ключово́му сло́ві."

- id: act-303
  type: group-sort
  title: "Висхідна́ ↗ чи спадна́ ↘ інтона́ція — Rising or falling intonation"
  instruction: "Розподілі́ть запита́ння за ї́хньою інтонаці́йною моде́ллю."
  groups:
  - label: "Висхідна́ інтона́ція ↗ (зага́льні пита́ння так/ні)"
    items:
    - "Це апте́ка? ↗"
    - "Марко́ вдо́ма? ↗"
    - "Це метро́? ↗"
  - label: "Спадна́ інтона́ція ↘ (пита́льні слова́ хто, що, де, коли́, як)"
    items:
    - "Де метро́? ↘"
    - "Як спра́ви? ↘"
    - "Що це? ↘"

- id: act-304
  type: match-up
  title: "Мовленнє́ва фо́рмула та інтона́ція — Formula and intonation"
  instruction: "З'єдна́йте мовленнє́ву фо́рмулу з її́ інтонаці́йним ко́нтуром."
  pairs:
  - left: "Приві́т! ↘↘"
    right: "warm informal greeting (expressive rise-fall)"
  - left: "До́брий день! ↘"
    right: "polite formal greeting (calm descent)"
  - left: "Як спра́ви? ↘"
    right: "inquiry with question word (falling)"
  - left: "Це апте́ка? ↗"
    right: "yes/no question (sharp rise on key word)"
  - left: "Дя́кую! ↘↘"
    right: "expression of thanks (emotional high-fall)"
  - left: "До поба́чення! ↘"
    right: "polite farewell (smooth gentle fall)"

- id: act-4
  type: fill-in
  title: "Пунктуа́ція і мело́дика — Punctuation and melody"
  instruction: "Обери́ розділо́вий знак, яки́й відповіда́є ре́ченню."
  items:
  - sentence: "Це ка́ва___"
    answer: "."
    options:
    - "."
    - "?"
    - "!"
    explanation: "Тве́рдження ма́є кра́пку й спадну́ мело́дику."
  - sentence: "Це метро́___"
    answer: "?"
    options:
    - "?"
    - "."
    - "!"
    explanation: "Так/ні пита́ння ма́є знак пита́ння й висхідну́ мело́дику."
  - sentence: "Де апте́ка___"
    answer: "?"
    options:
    - "?"
    - "."
    - "!"
    explanation: "Де ро́бить це пита́нням, але́ мело́дика спадна́."
  - sentence: "Як га́рно___"
    answer: "!"
    options:
    - "!"
    - "?"
    - "."
    explanation: "Це о́клик."
  - sentence: "Так, це вода́___"
    answer: "."
    options:
    - "."
    - "?"
    - "!"
    explanation: "Це тве́рдження."
  - sentence: "Приві́т усі́м дру́зям___"
    answer: "!"
    options:
    - "!"
    - "."
    - "?"
    explanation: "Емоці́йне віта́ння познача́ється зна́ком о́клику."

workbook:
- id: act-w301
  type: quiz
  title: "Пита́льні слова́ та інтона́ція — Question words and intonation"
  instruction: "Обері́ть прави́льну ві́дповідь про мело́дику запита́нь."
  items:
  - prompt: "Яка́ інтона́ція власти́ва запита́нню «Де метро́?»"
    options:
    - text: "спадна́ ↘ (бо ре́чення почина́ється з пита́льного слова́ «де»)"
      correct: true
    - text: "висхідна́ ↗"
      correct: false
    - text: "рі́вна без змін"
      correct: false
    explanation: "Пита́льні слова́ несу́ть логі́чний на́голос, тому́ в кінці́ го́лос зни́жується."
  - prompt: "Чому́ запита́ння «Хто це?» ма́є спадну́ мело́дику ↘?"
    options:
    - text: "пита́льне сло́во «хто» стої́ть на поча́тку і вже ви́ділене логі́чним на́голосом"
      correct: true
    - text: "це пра́вило ді́є ті́льки для слова́ «хто»"
      correct: false
    - text: "бо це розповідне́ ре́чення"
      correct: false
    explanation: "Будь-яке пита́ння з пита́льним сло́вом ма́є спадни́й кіне́ць ре́чення."
  - prompt: "Яка́ мело́дика власти́ва запита́нню «Коли́ уро́к?»"
    options:
    - text: "спадна́ ↘"
      correct: true
    - text: "висхідна́ ↗"
      correct: false
    - text: "си́льна спадна́ ↘↘"
      correct: false
    explanation: "«Коли́» — це пита́льне сло́во, тому́ го́лос спада́є."
  - prompt: "Чому́ запита́ння «Це метро́?» вимага́є висхідно́ї інтона́ції ↗?"
    options:
    - text: "це зага́льне пита́ння (так/ні) без пита́льного слова́"
      correct: true
    - text: "че́рез ная́вність слова́ «метро́»"
      correct: false
    - text: "че́рез знак о́клику"
      correct: false
    explanation: "Зага́льні пита́ння так/ні обов'язко́во підви́щують тон наприкінці́."
  - prompt: "Яка́ інтона́ція у зустрі́чному пита́нні «А в тебе́?»"
    options:
    - text: "висхідна́ ↗ (із підви́щенням на займе́ннику)"
      correct: true
    - text: "спадна́ ↘"
      correct: false
    - text: "си́льна спадна́ ↘↘"
      correct: false
    explanation: "Зустрі́чне пита́ння до співрозмо́вника ма́є висхідни́й ко́нтур."
  - prompt: "Яка́ мело́дика запита́ння «Що це?»"
    options:
    - text: "спадна́ ↘"
      correct: true
    - text: "висхідна́ ↗"
      correct: false
    - text: "си́льна спадна́ ↘↘"
      correct: false
    explanation: "Пита́льне сло́во «що» зумо́влює спадну́ інтона́цію в кінці́."

- id: act-w302
  type: true-false
  title: "Тве́рдження про украї́нську інтона́цію — Statements on Ukrainian intonation"
  instruction: "Обері́ть пра́вда чи непра́вда."
  items:
  - statement: "Тве́рдження в украї́нській мо́ві зазвича́й ма́ють спадну́ інтона́цію ↘."
    correct: true
    explanation: "Го́лос спокі́йно зни́жується до кінця́ розповідно́го ре́чення."
  - statement: "Запита́ння з пита́льними слова́ми (хто, що, де, як) ма́ють висхідну́ інтона́цію на кінці́."
    correct: false
    explanation: "Пита́ння з пита́льними слова́ми ма́ють спадни́й інтонаці́йний ко́нтур."
  - statement: "Зага́льні запита́ння (так/ні) вимага́ють різко́го підви́щення то́ну на ключово́му сло́ві ↗."
    correct: true
    explanation: "Без змі́ни поря́дку слів са́ме висхідни́й тон утво́рює так/ні пита́ння."
  - statement: "Окли́чні віта́ння та подя́ки ма́ють вира́зну емоці́йну спадну́ інтона́цію ↘↘."
    correct: true
    explanation: "Висо́кий пік наголо́шеного скла́ду шви́дко перехо́дить у вира́зний спад."
  - statement: "Розділо́ві зна́ки (. ? !) на письмі́ підка́зують інтонаці́йний малю́нок ре́чення."
    correct: true
    explanation: "Пунктуа́ція є но́тним за́писом для людсько́го го́лосу."
  - statement: "Логі́чний на́голос виділя́є найважливі́ше сло́во в ре́ченні."
    correct: true
    explanation: "Логі́чний на́голос спрямо́вує ува́гу співрозмо́вника на головну́ ду́мку."

- id: act-w303
  type: error-correction
  title: "Ви́правлення інтонаці́йного зна́ка або́ на́голосу — Correcting intonation marks"
  instruction: "Знайді́ть і ви́правте поми́лку в ко́жному ре́ченні."
  items:
  - sentence: "Це апте́ка. ↗"
    error: "."
    answer: "?"
    options:
    - "?"
    - "."
    explanation: "Висхідна́ інтона́ція ↗ вка́зує на запита́ння, тому́ потрі́бен знак «?»."
  - sentence: "Марко́ вдо́ма? ↘"
    error: "?"
    answer: "."
    options:
    - "."
    - "?"
    explanation: "Спадна́ інтона́ція ↘ заве́ршує тве́рдження, тому́ ста́вимо кра́пку."
  - sentence: "Де метро́. ↘"
    error: "."
    answer: "?"
    options:
    - "?"
    - "."
    explanation: "Ре́чення з пита́льним сло́вом «де» потребу́є зна́ка пита́ння «?»."
  - sentence: "При́віт! Як спра́ви?"
    error: "При́віт"
    answer: "Приві́т"
    options:
    - "Приві́т"
    - "При́віт"
    explanation: "У віта́нні «Приві́т!» на́голос па́дає на дру́гий склад: При-ві́т!"
  - sentence: "У мене́ все чу́дово."
    error: "чу́дово"
    answer: "чудо́во"
    options:
    - "чудо́во"
    - "чу́дово"
    explanation: "Пра́вильний на́голос у сло́ві: «чудо́во»."
  - sentence: "До побаче́ння!"
    error: "побаче́ння"
    answer: "поба́чення"
    options:
    - "поба́чення"
    - "побаче́ння"
    explanation: "Пра́вильний на́голос: «поба́чення» з на́голосом на скла́ді -ба́-."

- id: act-w304
  type: unjumble
  title: "Склада́ння ре́плік із інтона́цією — Unjumble with intonation"
  instruction: "Розташу́йте слова́ та зна́ки у пра́вильному поря́дку."
  items:
  - sentence: "Приві́т! Як спра́ви? ↘"
    words:
    - "Приві́т!"
    - "Як"
    - "спра́ви?"
    - "↘"
  - sentence: "Дя́кую, у мене́ все чудо́во! ↘↘"
    words:
    - "Дя́кую,"
    - "у"
    - "мене́"
    - "все"
    - "чудо́во!"
    - "↘↘"
  - sentence: "Це нова́ апте́ка? ↗"
    words:
    - "Це"
    - "нова́"
    - "апте́ка?"
    - "↗"
  - sentence: "Так, це нова́ апте́ка. ↘"
    words:
    - "Так,"
    - "це"
    - "нова́"
    - "апте́ка."
    - "↘"
  - sentence: "Де ста́нція метро́? ↘"
    words:
    - "Де"
    - "ста́нція"
    - "метро́?"
    - "↘"
  - sentence: "До поба́чення! На все до́бре! ↘"
    words:
    - "До"
    - "поба́чення!"
    - "На"
    - "все"
    - "до́бре!"
    - "↘"

- id: act-w305
  type: match-up
  title: "Запита́ння та логі́чна ві́дповідь — Question and logical answer"
  instruction: "З'єдна́йте запита́ння з приро́дною інтонаці́йною ві́дповіддю."
  pairs:
  - left: "Як спра́ви? ↘"
    right: "Чудо́во, дя́кую! ↘↘"
  - left: "Це ка́ва? ↗"
    right: "Так, це гаря́ча ка́ва. ↘"
  - left: "Де апте́ка? ↘"
    right: "Ось апте́ка по́руч. ↘"
  - left: "Хто це? ↘"
    right: "Це Тара́с і Окса́на. ↘"
  - left: "А в тебе́? ↗"
    right: "У мене́ теж усе́ до́бре. ↘"
  - left: "Що це? ↘"
    right: "Це наш нови́й буди́нок. ↘"

- id: act-w306
  type: translate
  title: "Перекла́д інтонаці́йних ре́плік — Translating conversational replies"
  instruction: "Обері́ть то́чний англі́йський перекла́д ре́пліки."
  items:
  - source: "Приві́т! Як спра́ви? ↘"
    options:
    - text: "Hi! How are things?"
      correct: true
    - text: "Goodbye! All the best!"
      correct: false
    - text: "Where is the pharmacy?"
      correct: false
    explanation: "Приві́т! Як спра́ви? — Hi! How are things?"
  - source: "Дя́кую, у мене́ все чудо́во! ↘↘"
    options:
    - text: "Thank you, everything is wonderful with me!"
      correct: true
    - text: "Please, this is hot coffee."
      correct: false
    - text: "Is this the new metro station?"
      correct: false
    explanation: "Дя́кую, чудо́во! — Thank you, wonderful!"
  - source: "Це метро́? ↗"
    options:
    - text: "Is this the metro?"
      correct: true
    - text: "Where is the metro?"
      correct: false
    - text: "This is the metro."
      correct: false
    explanation: "Висхідни́й тон познача́є пита́ння так/ні."
  - source: "Так, це ста́нція метро́. ↘"
    options:
    - text: "Yes, this is the metro station."
      correct: true
    - text: "Is this the metro station?"
      correct: false
    - text: "Where is the station?"
      correct: false
    explanation: "Спадна́ інтона́ція впе́вненого стве́рдження."
  - source: "Де апте́ка? ↘"
    options:
    - text: "Where is the pharmacy?"
      correct: true
    - text: "Is this a pharmacy?"
      correct: false
    - text: "Here is the pharmacy."
      correct: false
    explanation: "Де — where."
  - source: "До поба́чення! На все до́бре! ↘"
    options:
    - text: "Goodbye! All the best!"
      correct: true
    - text: "Good morning! How are you?"
      correct: false
    - text: "Thank you very much!"
      correct: false
    explanation: "Етике́тне проща́ння."
