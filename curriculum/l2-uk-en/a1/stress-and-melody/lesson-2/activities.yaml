inline:
- id: act-202
  type: quiz
  title: "Числі́вники на -на́дцять — Numerals on -на́дцять"
  instruction: "Обері́ть пра́вильну фо́рму на́голосу для числі́вників."
  items:
  - prompt: "Де на́голос у сло́ві «одина́дцять»?"
    options:
    - text: "на скла́ді -на́-"
      correct: true
    - text: "на пе́ршому скла́ді"
      correct: false
    - text: "на оста́нньому скла́ді"
      correct: false
    explanation: "У числі́вниках 11–19 на́голос за́вжди па́дає на склад -на́-."
  - prompt: "Де на́голос у сло́ві «чотирна́дцять»?"
    options:
    - text: "на скла́ді -на́-"
      correct: true
    - text: "на пе́ршому скла́ді"
      correct: false
    - text: "на оста́нньому скла́ді"
      correct: false
    explanation: "У сло́ві «чотирна́дцять» на́голос па́дає на склад -на́-."
  - prompt: "Де на́голос у сло́ві «двана́дцять»?"
    options:
    - text: "на скла́ді -на́-"
      correct: true
    - text: "на пе́ршому скла́ді"
      correct: false
    - text: "на оста́нньому скла́ді"
      correct: false
    explanation: "У сло́ві «двана́дцять» наголо́шений склад -на́-."
  - prompt: "Де на́голос у сло́ві «трина́дцять»?"
    options:
    - text: "на скла́ді -на́-"
      correct: true
    - text: "на пе́ршому скла́ді"
      correct: false
    - text: "на оста́нньому скла́ді"
      correct: false
    explanation: "У сло́ві «трина́дцять» наголо́шений склад -на́-."
  - prompt: "Де на́голос у сло́ві «п'ятна́дцять»?"
    options:
    - text: "на скла́ді -на́-"
      correct: true
    - text: "на пе́ршому скла́ді"
      correct: false
    - text: "на оста́нньому скла́ді"
      correct: false
    explanation: "У сло́ві «п'ятна́дцять» на́голос па́дає на склад -на́-."
  - prompt: "Де на́голос у сло́ві «шістна́дцять»?"
    options:
    - text: "на скла́ді -на́-"
      correct: true
    - text: "на пе́ршому скла́ді"
      correct: false
    - text: "на оста́нньому скла́ді"
      correct: false
    explanation: "У сло́ві «шістна́дцять» наголо́шений склад -на́-."

- id: act-203
  type: match-up
  title: "Прикме́тники з кінце́вим на́голосом — Adjectives with end stress"
  instruction: "З'єдна́йте украї́нський прикме́тник із йо́го зна́ченням."
  pairs:
  - left: "нови́й"
    right: "new"
  - left: "стари́й"
    right: "old"
  - left: "мали́й"
    right: "small / young"
  - left: "прости́й"
    right: "simple / plain"
  - left: "важки́й"
    right: "heavy / difficult"
  - left: "сухи́й"
    right: "dry"

- id: act-204
  type: group-sort
  title: "Рухо́мий на́голос: Однина́ чи множина́ — Mobile stress: Singular or plural"
  instruction: "Розподілі́ть слова́ за грамати́чною фо́рмою та на́голосом."
  groups:
  - label: "Однина́ (на́голос на кінці́)"
    items:
    - "голова́"
    - "рука́"
    - "село́"
  - label: "Множина́ (на́голос змісти́вся на поча́ток)"
    items:
    - "го́лови"
    - "ру́ки"
    - "се́ла"

- id: act-5
  type: fill-in
  title: "Типо́ві па́стки на́голосу — Typical stress traps"
  instruction: "Обери́ нормати́вну фо́рму з позна́ченим на́голосом."
  items:
  - sentence: "Це мій ___ комп'ю́тер."
    answer: "нови́й"
    options:
    - "нови́й"
    - "но́вий"
    explanation: "У сло́ві нови́й на́голос наприкінці́."
  - sentence: "Мій діду́сь ___."
    answer: "стари́й"
    options:
    - "стари́й"
    - "ста́рий"
    explanation: "У сло́ві стари́й на́голос наприкінці́."
  - sentence: "У мене́ ___ гри́вень."
    answer: "одина́дцять"
    options:
    - "одина́дцять"
    - "о́динадцять"
    explanation: "Одина́дцять ма́є на́голос на -на́-."
  - sentence: "Я зна́ю ___ нови́х слів."
    answer: "чотирна́дцять"
    options:
    - "чотирна́дцять"
    - "чоти́рнадцять"
    explanation: "Чотирна́дцять теж ма́є на́голос на -на́-."
  - sentence: "Множина́ слова́ голова́: ___."
    answer: "го́лови"
    options:
    - "го́лови"
    - "голови́"
    explanation: "У цій словнико́вій па́рі на́голос ру́хається."
  - sentence: "Мене́ зва́ти ___."
    answer: "Марі́я"
    options:
    - "Марі́я"
    - "Ма́рія"
    explanation: "У цьо́му і́мені на́голос на рі́."

workbook:
- id: act-w1
  type: fill-in
  title: "Типо́ві поми́лки на́голосу — Typical stress errors"
  instruction: "Обери́ нормати́вну фо́рму з позна́ченим на́голосом."
  items:
  - sentence: "новий: ___"
    answer: "нови́й"
    options:
    - "нови́й"
    - "но́вий"
    explanation: "У сло́ві нови́й на́голос на оста́нній части́ні."
  - sentence: "стари́й чи ста́рий: ___"
    answer: "стари́й"
    options:
    - "стари́й"
    - "ста́рий"
    explanation: "У сло́ві стари́й на́голос на оста́нній части́ні."
  - sentence: "одина́дцять чи о́динадцять: ___"
    answer: "одина́дцять"
    options:
    - "одина́дцять"
    - "о́динадцять"
    explanation: "Одина́дцять ма́є на́голос на -на́-."
  - sentence: "чотирна́дцять чи чоти́рнадцять: ___"
    answer: "чотирна́дцять"
    options:
    - "чотирна́дцять"
    - "чоти́рнадцять"
    explanation: "Чотирна́дцять теж ма́є на́голос на -на́-."
  - sentence: "множина́ слова́ голова́: ___"
    answer: "го́лови"
    options:
    - "го́лови"
    - "голови́"
    explanation: "У цій па́рі на́голос ру́хається: голова́, але́ го́лови."
  - sentence: "ім'я́: ___"
    answer: "Марі́я"
    options:
    - "Марі́я"
    - "Ма́рія"
    explanation: "У цьо́му і́мені на́голос на рі́."

- id: act-w202
  type: match-up
  title: "Па́ри однина́ та множина́ — Singular and plural pairs"
  instruction: "З'єдна́йте фо́рму однини́ з фо́рмою множини́."
  pairs:
  - left: "голова́"
    right: "го́лови"
  - left: "рука́"
    right: "ру́ки"
  - left: "село́"
    right: "се́ла"
  - left: "зима́"
    right: "зими́"
  - left: "гора́"
    right: "го́ри"
  - left: "вода́"
    right: "во́ди"

- id: act-w203
  type: error-correction
  title: "Подола́ння L2-пасто́к на́голосу — Overcoming L2 stress traps"
  instruction: "Знайді́ть і ви́правте помилко́вий на́голос у ко́жному ре́ченні."
  items:
  - sentence: "У мене́ є о́динадцять зо́шитів."
    error: "о́динадцять"
    answer: "одина́дцять"
    options:
    - "одина́дцять"
    - "о́динадцять"
    explanation: "У числі́вниках 11–19 на́голос па́дає на склад -на́-."
  - sentence: "Ось наш но́вий буди́нок."
    error: "но́вий"
    answer: "нови́й"
    options:
    - "нови́й"
    - "но́вий"
    explanation: "В украї́нській мо́ві пра́вильно «нови́й» із кінце́вим на́голосом."
  - sentence: "Ма́рія чита́є ціка́ву кни́гу."
    error: "Ма́рія"
    answer: "Марі́я"
    options:
    - "Марі́я"
    - "Ма́рія"
    explanation: "В і́мені «Марі́я» на́голос за́вжди па́дає на голосну́ і."
  - sentence: "Школя́р ми́є брудні́ рука́ пі́сля са́ду."
    error: "рука́"
    answer: "ру́ки"
    options:
    - "ру́ки"
    - "рука́"
    explanation: "Для двох рук потрі́бна фо́рма множини́: «ру́ки»."
  - sentence: "Там стої́ть ста́рий за́мок."
    error: "ста́рий"
    answer: "стари́й"
    options:
    - "стари́й"
    - "ста́рий"
    explanation: "Прикме́тник «стари́й» ма́є на́голос на кінці́."
  - sentence: "Навко́ло розки́нулися краси́ві село́."
    error: "село́"
    answer: "се́ла"
    options:
    - "се́ла"
    - "село́"
    explanation: "Фо́рма множини́ — «се́ла» з на́голосом на пе́ршому скла́ді."

- id: act-w204
  type: true-false
  title: "Тве́рдження про числі́вники та прикме́тники — Facts on numerals and adjectives"
  instruction: "Обері́ть пра́вда чи непра́вда."
  items:
  - statement: "У числі́вниках 11–19 на́голос за́вжди па́дає на склад -на́-."
    correct: true
    explanation: "Це залі́зне пра́вило украї́нської орфое́пії: «одина́дцять», «чотирна́дцять»."
  - statement: "В украї́нській мо́ві прикме́тники «новий» і «старий» ма́ють на́голос на пе́ршому скла́ді."
    correct: false
    explanation: "Нормати́вні фо́рми ма́ють кінце́вий на́голос: «нови́й», «стари́й»."
  - statement: "Жіно́чі імена́ «Марія» та «Софія» зберіга́ють на́голос на лі́тері і."
    correct: true
    explanation: "В украї́нській вимо́ві: «Марі́я», «Софі́я»."
  - statement: "При утво́ренні множини́ від слів «голова́» та «рука» на́голос перехо́дить на пе́рший склад."
    correct: true
    explanation: "Однина́: «голова́», «рука́» — множина́: «го́лови», «ру́ки»."
  - statement: "Числі́вник «14» украї́нською вимовля́ється як «чотирна́дцять»."
    correct: false
    explanation: "Нормати́вна вимо́ва: «чотирна́дцять» з на́голосом на -на́-."
  - statement: "Рухо́мий на́голос допомага́є розрізня́ти грамати́чні фо́рми слів."
    correct: true
    explanation: "На́голос є грамати́чним ма́ркером фо́рми однини́ та множини́."

- id: act-w205
  type: unjumble
  title: "Склада́ння ре́чень із числі́вниками — Sentence unjumble with numerals"
  instruction: "Розташу́йте слова́ у пра́вильному поря́дку, щоб утвори́ти ре́чення."
  items:
  - sentence: "Це мій нови́й буди́нок."
    words:
    - "Це"
    - "мій"
    - "нови́й"
    - "буди́нок."
  - sentence: "У мене́ є одина́дцять гри́вень."
    words:
    - "У"
    - "мене́"
    - "є"
    - "одина́дцять"
    - "гри́вень."
  - sentence: "Марі́я чита́є чотирна́дцять сторіно́к."
    words:
    - "Марі́я"
    - "чита́є"
    - "чотирна́дцять"
    - "сторіно́к."
  - sentence: "Там росте́ стари́й ліс."
    words:
    - "Там"
    - "росте́"
    - "стари́й"
    - "ліс."
  - sentence: "Софі́я ми́є чи́сті ру́ки."
    words:
    - "Софі́я"
    - "ми́є"
    - "чи́сті"
    - "ру́ки."
  - sentence: "Навко́ло лежа́ть зеле́ні се́ла."
    words:
    - "Навко́ло"
    - "лежа́ть"
    - "зеле́ні"
    - "се́ла."

- id: act-w206
  type: translate
  title: "Перекла́д ре́чень — Sentence translation"
  instruction: "Обері́ть то́чний англі́йський перекла́д ре́чення."
  items:
  - source: "Це мій нови́й буди́нок."
    options:
    - text: "This is my new house."
      correct: true
    - text: "This is my old house."
      correct: false
    - text: "This is a small village."
      correct: false
    explanation: "Нови́й буди́нок — new house."
  - source: "У мене́ є одина́дцять гри́вень."
    options:
    - text: "I have eleven hryvnias."
      correct: true
    - text: "I have fourteen hryvnias."
      correct: false
    - text: "I have twelve hryvnias."
      correct: false
    explanation: "Одина́дцять — eleven."
  - source: "Марі́я ми́є чи́сті ру́ки."
    options:
    - text: "Mariia washes clean hands."
      correct: true
    - text: "Sofiia reads fourteen books."
      correct: false
    - text: "Mariia has an old castle."
      correct: false
    explanation: "Марі́я — Mariia, ру́ки — hands."
  - source: "Там стої́ть стари́й за́мок."
    options:
    - text: "An old castle stands there."
      correct: true
    - text: "A new lock hangs there."
      correct: false
    - text: "An ancient forest is there."
      correct: false
    explanation: "Стари́й за́мок — old castle."
  - source: "Ось украї́нські се́ла."
    options:
    - text: "Here are Ukrainian villages."
      correct: true
    - text: "Here is one Ukrainian village."
      correct: false
    - text: "Here are Ukrainian mountains."
      correct: false
    explanation: "Се́ла — villages (plural)."
  - source: "Квито́к кошту́є чотирна́дцять гри́вень."
    options:
    - text: "The ticket costs fourteen hryvnias."
      correct: true
    - text: "The ticket costs eleven hryvnias."
      correct: false
    - text: "The book costs twenty hryvnias."
      correct: false
    explanation: "Чотирна́дцять — fourteen."
