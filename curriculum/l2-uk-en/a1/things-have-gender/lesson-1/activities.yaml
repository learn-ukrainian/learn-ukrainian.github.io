inline:
- id: act-1
  type: quiz
  title: Хто чи що? — Who or what?
  instruction: Обери́ пита́ння або́ займе́нник, що підхо́дить до іме́нника. — Choose
    the question or pronoun that fits the noun.
  items:
  - prompt: та́то (dad)
    options:
    - text: Хто це?
      correct: true
    - text: Що це?
      correct: false
    - text: Воно́?
      correct: false
    explanation: Та́то — це на́зва люди́ни, тому́ запи́туємо «Хто це?». — "Та́то" is
      a person word, so ask "Хто це?".
  - prompt: стіл (table)
    options:
    - text: Що це?
      correct: true
    - text: Хто це?
      correct: false
    - text: Вона́?
      correct: false
    explanation: Стіл — це на́зва предме́та, тому́ запи́туємо «Що це?». — "Стіл" is
      a thing word, so ask "Що це?".
  - prompt: сестра́ (sister)
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Сестра́ — жіно́чого ро́ду (вона́). — "Сестра́" is feminine (вона́).
  - prompt: брат (brother)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Брат — чолові́чого ро́ду (він). — "Брат" is masculine (він).
  - prompt: кни́га (book)
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Кни́га — жіно́чого ро́ду (вона́). — "Кни́га" is feminine (вона́).
  - prompt: вікно́ (window)
    options:
    - text: воно́
      correct: true
    - text: вона́
      correct: false
    - text: він
      correct: false
    explanation: Вікно́ — сере́днього ро́ду (воно́). — "Вікно́" is neuter (воно́).
- id: act-2
  type: group-sort
  title: Сорту́й слова́ за ро́дом — Sort the words by gender
  instruction: 'Розподілі́ть іме́нники за ро́дом: він, вона́ чи воно́. — Sort each
    noun by its safest A1 gender phrase.'
  groups:
  - label: він / мій (masculine)
    items:
    - стіл
    - та́то
    - ба́тько
    - соба́ка
  - label: вона́ / моя́ (feminine)
    items:
    - кни́га
    - сестра́
    - ма́ма
  - label: воно́ / моє́ (neuter)
    items:
    - вікно́
    - мі́сто
- id: act-5
  type: quiz
  title: Закі́нчення підка́зує рід — The ending hints at the gender
  instruction: Обери́ прави́льний рід за закі́нченням іме́нника. — Choose the usual
    gender signal from the noun ending.
  items:
  - prompt: стіл закі́нчується на при́голосний. — "Стіл" ends in a consonant.
    options:
    - text: він / мій
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: Чітке́ закі́нчення на при́голосний — це звича́йно чолові́чий рід
      (він / мій). — A clear consonant ending is usually masculine.
  - prompt: брат закі́нчується на при́голосний. — "Брат" ends in a consonant.
    options:
    - text: він / мій
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: «Брат» закі́нчується на при́голосний і є чолові́чим ро́дом (він /
      мій). — "Брат" ends in a consonant and is masculine.
  - prompt: кни́га закі́нчується на -а. — "Кни́га" ends in -а.
    options:
    - text: вона́ / моя́
      correct: true
    - text: він / мій
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: Чітке́ закі́нчення на -а — це звича́йно жіно́чий рід (вона́ / моя́).
      — A clear -а ending is usually feminine.
  - prompt: сестра́ закі́нчується на -а. — "Сестра́" ends in -а.
    options:
    - text: вона́ / моя́
      correct: true
    - text: він / мій
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: «Сестра́» закі́нчується на -а і є жіно́чим ро́дом (вона́ / моя́).
      — "Сестра́" ends in -а and is feminine.
  - prompt: вікно́ закі́нчується на -о. — "Вікно́" ends in -о.
    options:
    - text: воно́ / моє́
      correct: true
    - text: він / мій
      correct: false
    - text: вона́ / моя́
      correct: false
    explanation: Чітке́ закі́нчення на -о — це звича́йно сере́дній рід (воно́ / моє́).
      — A clear -о ending is usually neuter.
  - prompt: мі́сто закі́нчується на -о. — "Мі́сто" ends in -о.
    options:
    - text: воно́ / моє́
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: він / мій
      correct: false
    explanation: «Мі́сто» закі́нчується на -о і є сере́днім ро́дом (воно́ / моє́).
      — "Мі́сто" ends in -о and is neuter.
- id: act-3
  type: quiz
  title: Він, вона́ чи воно́? — Masculine, feminine, or neuter?
  instruction: Обери́ украї́нський займе́нник для переві́рки ро́ду. — Choose the Ukrainian
    gender-test word.
  items:
  - prompt: стіл (table)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Стіл закі́нчується на при́голосний і нале́жить до чолові́чого ро́ду.
      — "Стіл" ends in a consonant and is masculine.
  - prompt: кни́га (book)
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Кни́га закі́нчується на -а і нале́жить до жіно́чого ро́ду. — "Кни́га"
      ends in -а and is feminine.
  - prompt: вікно́ (window)
    options:
    - text: воно́
      correct: true
    - text: він
      correct: false
    - text: вона́
      correct: false
    explanation: Вікно́ закі́нчується на -о і нале́жить до сере́днього ро́ду. — "Вікно́"
      ends in -о and is neuter.
  - prompt: ба́тько (father)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Ба́тько — чолові́чого ро́ду, бо назива́є чолові́ка. — "Ба́тько" is
      masculine because it names a male person.
  - prompt: сестра́ (sister)
    options:
    - text: вона́
      correct: true
    - text: воно́
      correct: false
    - text: він
      correct: false
    explanation: Сестра́ нале́жить до жіно́чого ро́ду. — "Сестра́" is feminine.
  - prompt: мі́сто (city)
    options:
    - text: воно́
      correct: true
    - text: вона́
      correct: false
    - text: він
      correct: false
    explanation: Мі́сто закі́нчується на -о і нале́жить до сере́днього ро́ду. — "Мі́сто"
      is neuter.
  - prompt: та́то (dad)
    options:
    - text: він
      correct: true
    - text: воно́
      correct: false
    - text: вона́
      correct: false
    explanation: Та́то — чолові́чого ро́ду, бо назива́є чолові́ка. — "Та́то" is masculine
      because it names a male person.
  - prompt: Мико́ла (Mykola - male name)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Мико́ла — чолові́че ім'я́. — "Мико́ла" is a masculine name.
workbook:
- id: act-w1
  type: group-sort
  title: Сорту́й за ро́дом — Sort by gender
  instruction: Розподілі́ть іме́нники за озна́кою ро́ду. — Sort each noun by its A1
    gender signal.
  groups:
  - label: він / мій (masculine)
    items:
    - стіл
    - та́то
    - ба́тько
    - брат
  - label: вона́ / моя́ (feminine)
    items:
    - кни́га
    - сестра́
    - ма́ма
  - label: воно́ / моє́ (neuter)
    items:
    - вікно́
    - мі́сто
- id: act-101
  type: true-false
  title: Пра́вда чи ні? — True or false?
  instruction: Ви́значте, чи пра́вильне тве́рдження про рід іме́нника. — Decide whether
    the statement about the gender of the noun is correct.
  statements:
  - statement: «Стіл» — це іме́нник чолові́чого ро́ду (він). — "Стіл" is a masculine
      noun (він).
    correct: true
    explanation: Стіл закі́нчується на при́голосний і є чолові́чим ро́дом. — "Стіл"
      ends in a consonant and is masculine.
  - statement: «Кни́га» — це іме́нник чолові́чого ро́ду (він). — "Кни́га" is a masculine
      noun (він).
    correct: false
    explanation: Кни́га закі́нчується на -а і нале́жить до жіно́чого ро́ду. — "Кни́га"
      ends in -а and is feminine.
  - statement: «Вікно́» — це іме́нник сере́днього ро́ду (воно́). — "Вікно́" is a neuter
      noun (воно́).
    correct: true
    explanation: Вікно́ закі́нчується на -о і є сере́днім ро́дом. — "Вікно́" ends
      in -о and is neuter.
  - statement: «Та́то» — це іме́нник жіно́чого ро́ду (вона́). — "Та́то" is a feminine
      noun (вона́).
    correct: false
    explanation: Та́то назива́є чолові́ка, тому́ це чолові́чий рід (він). — "Та́то"
      names a male person, so it is masculine (він).
  - statement: «Мі́сто» — це іме́нник сере́днього ро́ду (воно́). — "Мі́сто" is a neuter
      noun (воно́).
    correct: true
    explanation: Мі́сто закі́нчується на -о і є сере́днім ро́дом. — "Мі́сто" ends
      in -о and is neuter.
  - statement: «Ба́тько» — це іме́нник чолові́чого ро́ду (він). — "Ба́тько" is a masculine
      noun (він).
    correct: true
    explanation: Ба́тько назива́є чолові́ка, тому́ це чолові́чий рід (він). — "Ба́тько"
      names a male person, so it is masculine (він).
- id: act-102
  type: quiz
  title: Він, вона́ чи воно́? — Masculine, feminine, or neuter?
  instruction: Ви́беріть прави́льний займе́нник для ко́жного іме́нника. — Choose the
    correct pronoun for each noun.
  items:
  - prompt: стіл — table
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Стіл — чолові́чий рід (він). — "Стіл" is masculine (він).
  - prompt: кни́га — book
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Кни́га — жіно́чий рід (вона́). — "Кни́га" is feminine (вона́).
  - prompt: вікно́ — window
    options:
    - text: воно́
      correct: true
    - text: він
      correct: false
    - text: вона́
      correct: false
    explanation: Вікно́ — сере́дній рід (воно́). — "Вікно́" is neuter (воно́).
  - prompt: та́то — dad
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Та́то — чолові́чий рід (він). — "Та́то" is masculine (він).
  - prompt: ма́ма — mom
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Ма́ма — жіно́чий рід (вона́). — "Ма́ма" is feminine (вона́).
  - prompt: мі́сто — city
    options:
    - text: воно́
      correct: true
    - text: він
      correct: false
    - text: вона́
      correct: false
    explanation: Мі́сто — сере́дній рід (воно́). — "Мі́сто" is neuter (воно́).
- id: act-103
  type: fill-in
  title: Вста́вте мій, моя́ чи моє́ — Fill in мій, моя́, or моє́
  instruction: Ви́беріть прави́льний присві́йний займе́нник до ко́жного іме́нника.
    — Choose the correct possessive pronoun for each noun.
  items:
  - sentence: Це ___ стіл.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
    explanation: Стіл — чолові́чий рід, тому́ «мій стіл». — "Стіл" is masculine, therefore
      "мій стіл".
  - sentence: Це ___ кни́га.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Кни́га — жіно́чий рід, тому́ «моя́ кни́га». — "Кни́га" is feminine,
      therefore "моя́ кни́га".
  - sentence: Це ___ вікно́.
    answer: моє́
    options:
    - моє́
    - мій
    - моя́
    explanation: Вікно́ — сере́дній рід, тому́ «моє́ вікно́». — "Вікно́" is neuter,
      therefore "моє́ вікно́".
  - sentence: Це ___ та́то.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
    explanation: Та́то — чолові́к, тому́ «мій та́то». — "Та́то" is male, therefore
      "мій та́то".
  - sentence: Це ___ ма́ма.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Ма́ма — жі́нка, тому́ «моя́ ма́ма». — "Ма́ма" is female, therefore
      "моя́ ма́ма".
  - sentence: Це ___ мі́сто.
    answer: моє́
    options:
    - моє́
    - мій
    - моя́
    explanation: Мі́сто — сере́дній рід, тому́ «моє́ мі́сто». — "Мі́сто" is neuter,
      therefore "моє́ мі́сто".
- id: act-104
  type: unjumble
  title: Складі́ть ре́чення — Build the sentence
  instruction: Розташу́йте слова́ у прави́льному поря́дку, щоб утвори́ти ре́чення.
    — Put the words in the correct order to form a sentence.
  words:
  - words:
    - Це
    - мій
    - стіл
    answer: Це мій стіл.
    hint: This is my table.
  - words:
    - Це
    - моя́
    - кни́га
    answer: Це моя́ кни́га.
    hint: This is my book.
  - words:
    - Це
    - моє́
    - вікно́
    answer: Це моє́ вікно́.
    hint: This is my window.
  - words:
    - Ось
    - мій
    - та́то
    answer: Ось мій та́то.
    hint: Here is my dad.
  - words:
    - Ось
    - моя́
    - ма́ма
    answer: Ось моя́ ма́ма.
    hint: Here is my mom.
  - words:
    - Це
    - моє́
    - мі́сто
    answer: Це моє́ мі́сто.
    hint: This is my city.
- id: act-105
  type: translate
  bonus: true
  title: 'Бо́нус: перекладі́ть ре́чення — Bonus: translate the sentences'
  instruction: Перекладі́ть ре́чення з англі́йської мо́ви на украї́нську. — Translate
    the sentences from English into Ukrainian.
  items:
  - sentence: This is my table.
    answer: Це мій стіл.
    explanation: Стіл — чолові́чий рід (Це мій стіл). — "Стіл" is masculine (Це мій
      стіл).
  - sentence: This is my book.
    answer: Це моя́ кни́га.
    explanation: Кни́га — жіно́чий рід (Це моя́ кни́га). — "Кни́га" is feminine (Це
      моя́ кни́га).
  - sentence: This is my window.
    answer: Це моє́ вікно́.
    explanation: Вікно́ — сере́дній рід (Це моє́ вікно́). — "Вікно́" is neuter (Це
      моє́ вікно́).
  - sentence: My brother is here.
    answer: Мій брат тут.
    explanation: Брат — чолові́чий рід (Мій брат тут). — "Брат" is masculine (Мій
      брат тут).
  - sentence: My mother is there.
    answer: Моя́ ма́ма там.
    explanation: Ма́ма — жіно́чий рід (Моя́ ма́ма там). — "Ма́ма" is feminine (Моя́
      ма́ма там).
  - sentence: This is my city.
    answer: Це моє́ мі́сто.
    explanation: Мі́сто — сере́дній рід (Це моє́ мі́сто). — "Мі́сто" is neuter (Це
      моє́ мі́сто).
