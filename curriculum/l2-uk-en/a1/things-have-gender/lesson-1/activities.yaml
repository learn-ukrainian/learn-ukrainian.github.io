inline:
- id: act-1
  type: quiz
  title: Хто чи що? — Who or what?
  instruction: Choose the question or pronoun that fits the noun.
  items:
  - prompt: та́то
    options:
    - text: Хто це?
      correct: true
    - text: Що це?
      correct: false
    - text: Воно́?
      correct: false
    explanation: Та́то is a person word, so ask Хто це?
  - prompt: стіл
    options:
    - text: Що це?
      correct: true
    - text: Хто це?
      correct: false
    - text: Вона́?
      correct: false
    explanation: Стіл is a thing word, so ask Що це?
  - prompt: сестра́
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Сестра́ is feminine.
  - prompt: брат
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Брат is masculine.
  - prompt: кни́га
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Кни́га is feminine.
  - prompt: вікно́
    options:
    - text: воно́
      correct: true
    - text: вона́
      correct: false
    - text: він
      correct: false
    explanation: Вікно́ is neuter.
- id: act-2
  type: group-sort
  title: Сорту́й слова́ за ро́дом — Sort the words by gender
  instruction: Sort each noun by its safest A1 gender phrase.
  groups:
  - label: він / мій
    items:
    - стіл
    - та́то
    - ба́тько
    - соба́ка
  - label: вона́ / моя́
    items:
    - кни́га
    - сестра́
    - ма́ма
  - label: воно́ / моє́
    items:
    - вікно́
    - мі́сто
- id: act-5
  type: quiz
  title: Закі́нчення підка́зує рід — The ending hints at the gender
  instruction: Choose the usual gender signal from the noun ending.
  items:
  - prompt: стіл закі́нчується на при́голосний.
    options:
    - text: він / мій
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: A clear consonant ending is usually masculine.
  - prompt: брат закі́нчується на при́голосний.
    options:
    - text: він / мій
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: Брат ends in a consonant and is masculine.
  - prompt: кни́га закі́нчується на -а.
    options:
    - text: вона́ / моя́
      correct: true
    - text: він / мій
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: A clear -а ending is usually feminine.
  - prompt: сестра́ закі́нчується на -а.
    options:
    - text: вона́ / моя́
      correct: true
    - text: він / мій
      correct: false
    - text: воно́ / моє́
      correct: false
    explanation: Сестра́ ends in -а and is feminine.
  - prompt: вікно́ закі́нчується на -о.
    options:
    - text: воно́ / моє́
      correct: true
    - text: він / мій
      correct: false
    - text: вона́ / моя́
      correct: false
    explanation: A clear -о ending is usually neuter.
  - prompt: мі́сто закі́нчується на -о.
    options:
    - text: воно́ / моє́
      correct: true
    - text: вона́ / моя́
      correct: false
    - text: він / мій
      correct: false
    explanation: Мі́сто ends in -о and is neuter.
- id: act-3
  type: quiz
  title: Він, вона́ чи воно́? — Masculine, feminine, or neuter?
  instruction: Choose the Ukrainian gender-test word.
  items:
  - prompt: стіл
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Стіл ends in a consonant and is masculine.
  - prompt: кни́га
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Кни́га is feminine.
  - prompt: вікно́
    options:
    - text: воно́
      correct: true
    - text: він
      correct: false
    - text: вона́
      correct: false
    explanation: Вікно́ is neuter.
  - prompt: ба́тько
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Ба́тько is masculine because it names a male person.
  - prompt: сестра́
    options:
    - text: вона́
      correct: true
    - text: воно́
      correct: false
    - text: він
      correct: false
    explanation: Сестра́ is feminine.
  - prompt: мі́сто
    options:
    - text: воно́
      correct: true
    - text: вона́
      correct: false
    - text: він
      correct: false
    explanation: Мі́сто is neuter.
  - prompt: та́то
    options:
    - text: він
      correct: true
    - text: воно́
      correct: false
    - text: вона́
      correct: false
    explanation: Та́то is masculine because it names a male person.
  - prompt: Мико́ла
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Мико́ла is a masculine name.
workbook:
- type: group-sort
  title: Сорту́й за ро́дом — Sort by gender
  instruction: Sort each noun by its A1 gender signal.
  groups:
  - label: він / мій
    items:
    - стіл
    - та́то
    - ба́тько
    - брат
  - label: вона́ / моя́
    items:
    - кни́га
    - сестра́
    - ма́ма
  - label: воно́ / моє́
    items:
    - вікно́
    - мі́сто
  id: act-w1
- id: act-101
  type: true-false
  title: Пра́вда чи ні? — True or false?
  instruction: Ви́значте, чи пра́вильне тве́рдження про рід іме́нника. —
    Decide whether the statement about the gender of the noun is correct.
  statements:
  - statement: «Стіл» — це іме́нник чолові́чого ро́ду (він).
    correct: true
  - statement: «Кни́га» — це іме́нник чолові́чого ро́ду (він).
    correct: false
  - statement: «Вікно́» — це іме́нник сере́днього ро́ду (воно́).
    correct: true
  - statement: «Та́то» — це іме́нник жіно́чого ро́ду (вона́).
    correct: false
  - statement: «Мі́сто» — це іме́нник сере́днього ро́ду (воно́).
    correct: true
  - statement: «Ба́тько» — це іме́нник чолові́чого ро́ду (він).
    correct: true
- id: act-102
  type: quiz
  title: Він, вона́ чи воно́? — Masculine, feminine, or neuter?
  instruction: Ви́беріть прави́льний займе́нник для ко́жного іме́нника. — Choose the correct pronoun for each noun.
  items:
  - prompt: стіл
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
  - prompt: кни́га
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
  - prompt: вікно́
    options:
    - text: воно́
      correct: true
    - text: він
      correct: false
    - text: вона́
      correct: false
  - prompt: та́то
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
  - prompt: ма́ма
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
  - prompt: мі́сто
    options:
    - text: воно́
      correct: true
    - text: він
      correct: false
    - text: вона́
      correct: false
- id: act-103
  type: fill-in
  title: Вста́вте мій, моя́ чи моє́ — Fill in мій, моя́, or моє́
  instruction: Ви́беріть прави́льний присві́йний займе́нник до ко́жного іме́нника. —
    Choose the correct possessive pronoun for each noun.
  items:
  - sentence: Це ___ стіл.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
  - sentence: Це ___ кни́га.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
  - sentence: Це ___ вікно́.
    answer: моє́
    options:
    - моє́
    - мій
    - моя́
  - sentence: Це ___ та́то.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
  - sentence: Це ___ ма́ма.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
  - sentence: Це ___ мі́сто.
    answer: моє́
    options:
    - моє́
    - мій
    - моя́
- id: act-104
  type: unjumble
  title: Складі́ть ре́чення — Build the sentence
  instruction: Розташу́йте слова́ у прави́льному поря́дку, щоб утвори́ти ре́чення. —
    Put the words in the correct order to form a sentence.
  words:
  - words:
    - Це
    - мій
    - стіл
    answer: Це мій стіл.
  - words:
    - Це
    - моя́
    - кни́га
    answer: Це моя́ кни́га.
  - words:
    - Це
    - моє́
    - вікно́
    answer: Це моє́ вікно́.
  - words:
    - Ось
    - мій
    - та́то
    answer: Ось мій та́то.
  - words:
    - Ось
    - моя́
    - ма́ма
    answer: Ось моя́ ма́ма.
  - words:
    - Це
    - моє́
    - мі́сто
    answer: Це моє́ мі́сто.
- id: act-105
  type: translate
  bonus: true
  title: 'Бо́нус: перекладі́ть ре́чення — Bonus: translate the sentences'
  instruction: Перекладі́ть ре́чення з англі́йської мо́ви на украї́нську. —
    Translate the sentences from English into Ukrainian.
  items:
  - sentence: This is my table.
    answer: Це мій стіл.
  - sentence: This is my book.
    answer: Це моя́ кни́га.
  - sentence: This is my window.
    answer: Це моє́ вікно́.
  - sentence: My brother is here.
    answer: Мій брат тут.
  - sentence: My mother is there.
    answer: Моя́ ма́ма там.
  - sentence: This is my city.
    answer: Це моє́ мі́сто.
