inline:
- id: act-9
  type: quiz
  title: Фо́рми профе́сій — Profession forms
  instruction: Обери́ приро́дну фо́рму профе́сії. — Choose the natural profession form.
  items:
  - prompt: She is a teacher.
    options:
    - text: Вона́ вчи́телька.
      correct: true
    - text: Вона́ вчи́тель.
      correct: false
    - text: Воно́ вчи́телька.
      correct: false
    explanation: Вжива́йте жіно́чу фо́рму профе́сії для жі́нки (вчи́телька). — Use the feminine profession form for a woman.
  - prompt: She is a doctor.
    options:
    - text: Вона́ лі́карка.
      correct: true
    - text: Вона́ лі́кар.
      correct: false
    - text: Він лі́карка.
      correct: false
    explanation: Лі́карка — це жіно́ча фо́рма профе́сії. — "Лі́карка" is the feminine form.
  - prompt: He is a student.
    options:
    - text: Він студе́нт.
      correct: true
    - text: Він студе́нтка.
      correct: false
    - text: Вона́ студе́нт.
      correct: false
    explanation: Студе́нт — це чолові́ча фо́рма. — "Студе́нт" is the masculine form.
  - prompt: She is an actor.
    options:
    - text: Вона́ акто́рка.
      correct: true
    - text: Вона́ акто́р.
      correct: false
    - text: Воно́ акто́рка.
      correct: false
    explanation: Акто́рка — це жіно́ча фо́рма профе́сії. — "Акто́рка" is the feminine profession form.
- id: act-301
  type: match-up
  title: Чолові́чі та жіно́чі фо́рми профе́сій — Masculine and feminine profession forms
  instruction: 'З''єдна́йте чолові́чу фо́рму профе́сії з відпові́дною жіно́чою фо́рмою
    (зберіга́йте початко́ву лі́теру: вчи́тель → вчи́телька, учи́тель → учи́телька). —
    Match the masculine profession form with the corresponding feminine
    form (keep the initial letter: вчи́тель → вчи́телька, учи́тель →
    учи́телька).'
  pairs:
  - left: студе́нт
    right: студе́нтка
  - left: вчи́тель
    right: вчи́телька
  - left: учи́тель
    right: учи́телька
  - left: лі́кар
    right: лі́карка
  - left: акто́р
    right: акто́рка
  - left: співа́к
    right: співа́чка
- id: act-302
  type: fill-in
  title: Він чи вона́ для люде́й — He or she for people
  instruction: 'Вста́вте прави́льний займе́нник: він чи вона́. — Insert the correct pronoun: він or вона́.'
  items:
  - sentence: Мико́ла — чолові́к. ___ студе́нт.
    answer: Він
    options:
    - Він
    - Вона́
    explanation: Мико́ла — чолові́к, тому́ вжива́ємо «він». — "Мико́ла" is male, so use "він".
  - sentence: Окса́на — жі́нка. ___ лі́карка.
    answer: Вона́
    options:
    - Вона́
    - Він
    explanation: Окса́на — жі́нка, тому́ вжива́ємо «вона́». — "Окса́на" is female, so use "вона́".
  - sentence: Павло́ — вчи́тель. ___ тут.
    answer: Він
    options:
    - Він
    - Вона́
    explanation: Павло́ — чолові́к, тому́ вжива́ємо «він». — "Павло́" is male, so use "він".
  - sentence: Марі́я — співа́чка. ___ там.
    answer: Вона́
    options:
    - Вона́
    - Він
    explanation: Марі́я — жі́нка, тому́ вжива́ємо «вона́». — "Марі́я" is female, so use "вона́".
  - sentence: Ілля́ — акто́р. ___ працю́є.
    answer: Він
    options:
    - Він
    - Вона́
    explanation: Ілля́ — чолові́к, тому́ вжива́ємо «він». — "Ілля́" is male, so use "він".
  - sentence: Оле́на — вчи́телька. ___ працю́є.
    answer: Вона́
    options:
    - Вона́
    - Він
    explanation: Оле́на — жі́нка, тому́ вжива́ємо «вона́». — "Оле́на" is female, so use "вона́".
- id: act-303
  type: true-false
  title: 'Пра́вда чи ні: чолові́чі імена́ та ви́нятки — True or false: masculine names and exceptions'
  instruction: Ви́значте, чи прави́льне тве́рдження про рід слів. —
    Decide whether the statement about word gender is correct.
  statements:
  - statement: Ім'я́ «Мико́ла» — це він. — The name "Мико́ла" is masculine (він).
    correct: true
    explanation: Мико́ла — чолові́че ім'я́ (він). — "Мико́ла" is a male name (він).
  - statement: Ім'я́ «Павло́» — це воно́. — The name "Павло́" is neuter (воно́).
    correct: false
    explanation: Павло́ — чолові́че ім'я́ (він), а не воно́. — "Павло́" is a male name (він), not neuter.
  - statement: Сло́во «дя́дько» — це він. — The word "дя́дько" is masculine (він).
    correct: true
    explanation: Дя́дько — це чолові́к (він). — "Дя́дько" names a male person (він).
  - statement: Сло́во «соба́ка» в украї́нській мо́ві — це вона́. — The word "соба́ка" in Ukrainian is feminine (вона́).
    correct: false
    explanation: Соба́ка в украї́нській мо́ві — чолові́чого ро́ду (він / мій соба́ка). — "Соба́ка" in Ukrainian is masculine (він / мій соба́ка).
  - statement: Для жі́нки-лі́каря вжива́ємо фо́рму «лі́карка». — For a female doctor we use the form "лі́карка".
    correct: true
    explanation: Лі́карка — приро́дна жіно́ча фо́рма в украї́нській мо́ві. — "Лі́карка" is the natural feminine form in Ukrainian.
  - statement: Сло́во «та́то» — це він. — The word "та́то" is masculine (він).
    correct: true
    explanation: Та́то — чолові́чий рід (він). — "Та́то" is masculine (він).
workbook:
- id: act-w4
  type: error-correction
  title: Ви́прав па́стки ро́ду — Fix the gender traps
  instruction: Обері́ть прави́льне украї́нське ре́чення. — Choose the safer Ukrainian sentence.
  items:
  - sentence: Мій кни́га, мій ру́чка (якщо́ гово́рить чолові́к).
    error: Мій кни́га, мій ру́чка (якщо́ гово́рить чолові́к).
    correction: Моя́ кни́га, моя́ ру́чка.
    options:
    - Моя́ кни́га, моя́ ру́чка.
    - Мій кни́га, мій ру́чка.
    explanation: Присві́йний займе́нник узго́джується з іме́нником (кни́га, ру́чка), а не з мо́вцем. — The possessive follows the nouns кни́га and ру́чка, not the speaker.
  - sentence: Мій кни́га тут.
    error: Мій кни́га тут.
    correction: Моя́ кни́га тут.
    options:
    - Моя́ кни́га тут.
    - Мій кни́га тут.
    explanation: Кни́га — жіно́чий рід, тому́ «моя́ кни́га». — "Кни́га" is feminine, so use "моя́".
  - sentence: Мій ру́чка там.
    error: Мій ру́чка там.
    correction: Моя́ ру́чка там.
    options:
    - Моя́ ру́чка там.
    - Мій ру́чка там.
    explanation: Ру́чка — жіно́чий рід, тому́ «моя́ ру́чка». — "Ру́чка" is feminine, so use "моя́".
  - sentence: Де стіл? — Воно́ там. (Where is the table? — It is there.)
    error: Де стіл? — Воно́ там. (Where is the table? — It is there.)
    correction: Де стіл? — Він там.
    options:
    - Де стіл? — Він там.
    - Де стіл? — Воно́ там.
    explanation: Стіл — чолові́чий рід, тому́ вжива́ємо «він». — "Стіл" is masculine, so the pronoun is він.
  - sentence: Це моя́ та́то.
    error: Це моя́ та́то.
    correction: Це мій та́то.
    options:
    - Це мій та́то.
    - Це моя́ та́то.
    explanation: Та́то — чолові́к, тому́ «мій та́то». — "Та́то" is masculine.
  - sentence: Вона́ Мико́ла.
    error: Вона́ Мико́ла.
    correction: Він Мико́ла.
    options:
    - Він Мико́ла.
    - Вона́ Мико́ла.
    explanation: Мико́ла — чолові́че ім'я́, тому́ «він». — "Мико́ла" is a masculine name.
  - sentence: Моя́ соба́ка ду́же га́рна.
    error: Моя́ соба́ка ду́же га́рна.
    correction: Мій соба́ка ду́же га́рний.
    options:
    - Мій соба́ка ду́же га́рний.
    - Моя́ соба́ка ду́же га́рна.
    explanation: 'Соба́ка в украї́нській мо́ві — чолові́чого ро́ду: «мій соба́ка». — "Соба́ка" is masculine in Ukrainian; memorize "мій соба́ка".'
  - sentence: Я є студе́нт.
    error: Я є студе́нт.
    correction: Я студе́нт.
    options:
    - Я студе́нт.
    - Я є студе́нт.
    explanation: 'У тепе́рішньому ча́сі дієсло́во-зв''я́зка звича́йно опуска́ється: «Я студе́нт». — Present identity normally omits "є".'
  - sentence: Моє́ ім'я́ є Джон.
    error: Моє́ ім'я́ є Джон.
    correction: Мене́ зва́ти Джон.
    options:
    - Мене́ зва́ти Джон.
    - Моє́ ім'я́ є Джон.
    explanation: 'Приро́дний ви́раз для знайо́мства: «Мене́ зва́ти...». — "Мене́ зва́ти..." is the safe name phrase.'
- id: act-w5
  type: quiz
  title: Переві́рка ро́ду — Gender check
  instruction: Обері́ть прави́льний займе́нник для переві́рки ро́ду. — Choose the Ukrainian gender-test word. These are diagnostic props,
    not new active vocabulary.
  items:
  - prompt: Яки́й у мене́ си́льний біль у плечі́! — What severe pain I have in my shoulder!
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Біль в украї́нській мо́ві — чолові́чого ро́ду (він). — "Біль" is masculine in Ukrainian.
  - prompt: Украї́нський степ широ́кий і ві́тряний. — The Ukrainian steppe is wide and windy.
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Степ в украї́нській мо́ві — чолові́чого ро́ду (він). — "Степ" is masculine in Ukrainian.
  - prompt: Цей ро́зпис на стіні́ — робо́та украї́нського худо́жника. — This mural on the wall is the work of a Ukrainian artist.
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Ро́зпис в украї́нській мо́ві — чолові́чого ро́ду (він). — "Ро́зпис" is masculine in Ukrainian.
  - prompt: Да́вній літо́пис розповіда́є про Ки́ївську Русь. — An ancient chronicle tells about Kyivan Rus.
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Літо́пис в украї́нській мо́ві — чолові́чого ро́ду (він). — "Літо́пис" is masculine in Ukrainian.
  - prompt: 'Кни́жне / урочи́сте: у дале́ку путь. — Bookish / solemn: on a long journey.'
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Путь у цьо́му ви́разі — жіно́чого ро́ду (вона́). — "Путь" is feminine in this diagnostic expression.
- id: act-304
  type: group-sort
  title: 'Розподілі́ть слова́: він чи вона́ — Sort the words: він or вона́'
  instruction: 'Розподілі́ть профе́сії та імена́ за ро́дом: він чи вона́. —
    Sort the professions and names by gender: він or вона́.'
  groups:
  - label: він (чолові́чий рід / masculine)
    items:
    - студе́нт
    - вчи́тель
    - лі́кар
    - Мико́ла
    - Ілля́
    - дя́дько
  - label: вона́ (жіно́чий рід / feminine)
    items:
    - студе́нтка
    - вчи́телька
    - лі́карка
    - акто́рка
    - співа́чка
    - Окса́на
- id: act-305
  type: unjumble
  title: Складі́ть ре́чення з профе́сіями — Build sentences with professions
  instruction: Розташу́йте слова́, щоб утвори́ти прави́льне ре́чення. — Arrange the words to form a correct sentence.
  words:
  - words:
    - Вона́
    - моя́
    - вчи́телька
    answer: Вона́ моя́ вчи́телька.
    hint: She is my teacher.
  - words:
    - Він
    - мій
    - лі́кар
    answer: Він мій лі́кар.
    hint: He is my doctor.
  - words:
    - Це
    - мій
    - соба́ка
    answer: Це мій соба́ка.
    hint: This is my dog.
  - words:
    - Це
    - мій
    - дя́дько
    answer: Це мій дя́дько.
    hint: This is my uncle.
  - words:
    - Він
    - акто́р
    - а
    - вона́
    - акто́рка
    answer: Він акто́р, а вона́ акто́рка.
    hint: He is an actor, and she is an actress.
  - words:
    - Мене́
    - зва́ти
    - Мико́ла
    answer: Мене́ зва́ти Мико́ла.
    hint: My name is Mykola.
- id: act-306
  type: odd-one-out
  title: За́йве сло́во за ро́дом — Odd word out by gender
  instruction: Знайді́ть одне́ за́йве сло́во за грамати́чним ро́дом. — Find the one odd word out by grammatical gender.
  items:
  - words:
    - вчи́телька
    - лі́карка
    - студе́нтка
    - студе́нт
    answer: студе́нт
    explanation: Студе́нт — чолові́ча фо́рма, і́нші — жіно́чі. — "Студе́нт" is masculine; the others are feminine.
  - words:
    - акто́р
    - співа́к
    - лі́кар
    - акто́рка
    answer: акто́рка
    explanation: Акто́рка — жіно́ча фо́рма, і́нші — чолові́чі. — "Акто́рка" is feminine; the others are masculine.
  - words:
    - Мико́ла
    - Ілля́
    - Павло́
    - Окса́на
    answer: Окса́на
    explanation: Окса́на — жіно́че ім'я́, і́нші — чолові́чі. — "Окса́на" is a female name; the others are male names.
  - words:
    - та́то
    - ба́тько
    - дя́дько
    - ма́ма
    answer: ма́ма
    explanation: Ма́ма — жіно́чий рід, і́нші — чолові́чий. — "Ма́ма" is feminine; the others are masculine.
  - words:
    - стіл
    - телефо́н
    - зо́шит
    - кни́га
    answer: кни́га
    explanation: Кни́га — жіно́чий рід, і́нші — чолові́чий. — "Кни́га" is feminine; the others are masculine.
  - words:
    - вікно́
    - лі́жко
    - фо́то
    - ла́мпа
    answer: ла́мпа
    explanation: Ла́мпа — жіно́чий рід, і́нші — сере́дній. — "Ла́мпа" is feminine; the others are neuter.
- id: act-307
  type: translate
  bonus: true
  title: 'Бо́нус: перекладі́ть про люде́й і ре́чі — Bonus: translate about people and things'
  instruction: 'Перекладі́ть ре́чення з англі́йської мо́ви на украї́нську. —
    Translate the sentences from English into Ukrainian.'
  items:
  - sentence: She is a teacher (vchytelka).
    answer: Вона́ вчи́телька.
    explanation: Вчи́телька — жіно́ча фо́рма профе́сії (Вона́ вчи́телька). — "Вчи́телька" is the feminine profession form.
  - sentence: He is a doctor.
    answer: Він лі́кар.
    explanation: Лі́кар — чолові́ча фо́рма профе́сії (Він лі́кар). — "Лі́кар" is the masculine profession form.
  - sentence: My dog is handsome.
    answer: Мій соба́ка га́рний.
    explanation: Соба́ка — чолові́чий рід (Мій соба́ка га́рний). — "Соба́ка" is masculine in Ukrainian.
  - sentence: This is my uncle.
    answer: Це мій дя́дько.
    explanation: Дя́дько — чолові́чий рід (Це мій дя́дько). — "Дя́дько" is masculine.
  - sentence: My name is John.
    answer: Мене́ зва́ти Джон.
    explanation: 'Приро́дна фра́за: «Мене́ зва́ти...». — Natural phrase: "Мене́ зва́ти...".'
  - sentence: She is a student.
    answer: Вона́ студе́нтка.
    explanation: Студе́нтка — жіно́ча фо́рма (Вона́ студе́нтка). — "Студе́нтка" is the feminine form.
