inline:
- id: act-4
  type: fill-in
  title: Мій предме́т — My object
  instruction: Обері́ть мій, моя́ чи моє́. — Choose мій, моя́, or моє́.
  items:
  - sentence: Це ___ стіл.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
    explanation: Стіл — чолові́чий рід (Це мій стіл). — "Стіл" is masculine (Це мій стіл).
  - sentence: Це ___ кни́га.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Кни́га — жіно́чий рід (Це моя́ кни́га). — "Кни́га" is feminine (Це моя́ кни́га).
  - sentence: Це ___ вікно́.
    answer: моє́
    options:
    - моє́
    - мій
    - моя́
    explanation: Вікно́ — сере́дній рід (Це моє́ вікно́). — "Вікно́" is neuter (Це моє́ вікно́).
  - sentence: Це ___ кімна́та.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Кімна́та — жіно́чий рід (Це моя́ кімна́та). — "Кімна́та" is feminine (Це моя́ кімна́та).
  - sentence: Це ___ лі́жко.
    answer: моє́
    options:
    - моє́
    - моя́
    - мій
    explanation: Лі́жко — сере́дній рід (Це моє́ лі́жко). — "Лі́жко" is neuter (Це моє́ лі́жко).
  - sentence: Це ___ телефо́н.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
    explanation: Телефо́н — чолові́чий рід (Це мій телефо́н). — "Телефо́н" is masculine (Це мій телефо́н).
  - sentence: Це ___ ру́чка.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Ру́чка — жіно́чий рід (Це моя́ ру́чка). — "Ру́чка" is feminine (Це моя́ ру́чка).
  - sentence: Це ___ фо́то.
    answer: моє́
    options:
    - моє́
    - моя́
    - мій
    explanation: Фо́то — сере́дній рід (Це моє́ фо́то). — "Фо́то" is neuter (Це моє́ фо́то).
- id: act-201
  type: quiz
  title: Рід рече́й навко́ло — The gender of things around us
  instruction: Обері́ть прави́льний займе́нник (він, вона́ чи воно́) для ко́жного
    предме́та. — Choose the correct pronoun (він, вона́, or воно́) for each object.
  items:
  - prompt: стіле́ць (chair)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Стіле́ць — чолові́чий рід (він). — "Стіле́ць" is masculine (він).
  - prompt: ла́мпа (lamp)
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Ла́мпа — жіно́чий рід (вона́). — "Ла́мпа" is feminine (вона́).
  - prompt: лі́жко (bed)
    options:
    - text: воно́
      correct: true
    - text: вона́
      correct: false
    - text: він
      correct: false
    explanation: Лі́жко — сере́дній рід (воно́). — "Лі́жко" is neuter (воно́).
  - prompt: телефо́н (phone)
    options:
    - text: він
      correct: true
    - text: вона́
      correct: false
    - text: воно́
      correct: false
    explanation: Телефо́н — чолові́чий рід (він). — "Телефо́н" is masculine (він).
  - prompt: су́мка (bag)
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: воно́
      correct: false
    explanation: Су́мка — жіно́чий рід (вона́). — "Су́мка" is feminine (вона́).
  - prompt: дзе́ркало (mirror)
    options:
    - text: воно́
      correct: true
    - text: він
      correct: false
    - text: вона́
      correct: false
    explanation: Дзе́ркало — сере́дній рід (воно́). — "Дзе́ркало" is neuter (воно́).
- id: act-202
  type: observe
  title: Порівня́йте предме́ти та рід — Compare the objects and their gender
  instruction: Зверні́ть ува́гу на поєдна́ння іме́нника та присві́йного займе́нника. —
    Notice how the noun and the possessive pronoun pair up.
  pairs:
  - left: стіле́ць (при́голосний / consonant)
    right: мій стіле́ць (він / masculine)
  - left: су́мка (закі́нчення -а / ending -а)
    right: моя́ су́мка (вона́ / feminine)
  - left: лі́жко (закі́нчення -о / ending -о)
    right: моє́ лі́жко (воно́ / neuter)
  - left: телефо́н (при́голосний / consonant)
    right: мій телефо́н (він / masculine)
  - left: ла́мпа (закі́нчення -а / ending -а)
    right: моя́ ла́мпа (вона́ / feminine)
  - left: дзе́ркало (закі́нчення -о / ending -о)
    right: моє́ дзе́ркало (воно́ / neuter)
- id: act-203
  type: true-false
  title: 'Пра́вда чи ні: ре́чі в кімна́ті й су́мці — True or false: things in the room and bag'
  instruction: Ви́значте, чи пра́вильно вка́зано рід предме́та. —
    Decide whether the gender of the object is stated correctly.
  statements:
  - statement: Сло́во «стіл» — це він. — The word "стіл" is masculine (він).
    correct: true
    explanation: Стіл — чолові́чий рід (він). — "Стіл" is masculine (він).
  - statement: Сло́во «ла́мпа» — це воно́. — The word "ла́мпа" is neuter (воно́).
    correct: false
    explanation: Ла́мпа — жіно́чий рід (вона́), бо закі́нчується на -а. — "Ла́мпа" is feminine (вона́).
  - statement: Сло́во «лі́жко» — це воно́. — The word "лі́жко" is neuter (воно́).
    correct: true
    explanation: Лі́жко — сере́дній рід (воно́), бо закі́нчується на -о. — "Лі́жко" is neuter (воно́).
  - statement: Сло́во «су́мка» — це вона́. — The word "су́мка" is feminine (вона́).
    correct: true
    explanation: Су́мка — жіно́чий рід (вона́), бо закі́нчується на -а. — "Су́мка" is feminine (вона́).
  - statement: Сло́во «телефо́н» — це вона́. — The word "телефо́н" is feminine (вона́).
    correct: false
    explanation: Телефо́н — чолові́чий рід (він), бо закі́нчується на при́голосний. — "Телефо́н" is masculine (він).
  - statement: Сло́во «дзе́ркало» — це воно́. — The word "дзе́ркало" is neuter (воно́).
    correct: true
    explanation: Дзе́ркало — сере́дній рід (воно́), бо закі́нчується на -о. — "Дзе́ркало" is neuter (воно́).
workbook:
- id: act-w2
  type: match-up
  title: Слова́ для кімна́ти й су́мки — Words for the room and bag
  instruction: З'єдна́йте украї́нський іме́нник з англі́йським перекла́дом. — Match each Ukrainian noun with its English cue.
  pairs:
  - left: стіл
    right: table
  - left: кни́га
    right: book
  - left: вікно́
    right: window
  - left: кімна́та
    right: room
  - left: лі́жко
    right: bed
  - left: телефо́н
    right: phone
  - left: ру́чка
    right: pen
  - left: зо́шит
    right: notebook
- id: act-w3
  type: fill-in
  title: У мене́ є предме́ти — I have objects
  instruction: Допо́вніть ре́чення про предме́ти. — Complete the object sentence.
  items:
  - sentence: ___ мене́ є стіл.
    answer: У
    options:
    - У
    - Це
    - Хто
    explanation: Констру́кція «У мене́ є...» — фра́за «у мене є». — "У мене́ є..." is the I-have phrase.
  - sentence: У мене́ ___ кни́га.
    answer: є
    options:
    - є
    - зва́ти
    - моя́
    explanation: Фра́за «У мене́ є...» вжива́ється ра́зом. — "У мене́ є..." stays as one phrase.
  - sentence: У ___ є телефо́н?
    answer: тебе́
    options:
    - тебе́
    - мене́
    - мій
    explanation: Запита́ння «У тебе́ є...?» зверта́ється до одніє́ї люди́ни. — "У тебе́ є...?" asks one familiar person.
  - sentence: У мене́ є ___.
    answer: вікно́
    options:
    - вікно́
    - він
    - моя́
    explanation: Вікно́ — іме́нник пі́сля «У мене́ є». — "Вікно́" is an object noun after "У мене́ є".
  - sentence: Де стіл? ___ тут.
    answer: Він
    options:
    - Він
    - Вона́
    - Воно́
    explanation: Стіл — чолові́чий рід, тому́ вжива́ємо «він». — "Стіл" is masculine, so use "він".
  - sentence: Де кни́га? ___ тут.
    answer: Вона́
    options:
    - Вона́
    - Він
    - Воно́
    explanation: Кни́га — жіно́чий рід, тому́ вжива́ємо «вона́». — "Кни́га" is feminine, so use "вона́".
  - sentence: Де вікно́? ___ там.
    answer: Воно́
    options:
    - Воно́
    - Вона́
    - Він
    explanation: Вікно́ — сере́дній рід, тому́ вжива́ємо «воно́». — "Вікно́" is neuter, so use "воно́".
- id: act-204
  type: group-sort
  title: Сорту́й ре́чі в кімна́ті й су́мці — Sort the things in the room and bag
  instruction: 'Розподілі́ть предме́ти за ро́дом: він, вона́ чи воно́. —
    Sort the objects by gender: він, вона́, or воно́.'
  groups:
  - label: він / мій (masculine)
    items:
    - стіле́ць
    - телефо́н
    - комп'ю́тер
    - ключ
    - зо́шит
  - label: вона́ / моя́ (feminine)
    items:
    - кімна́та
    - ла́мпа
    - су́мка
    - ру́чка
    - стіна́
  - label: воно́ / моє́ (neuter)
    items:
    - лі́жко
    - крі́сло
    - дзе́ркало
    - фо́то
- id: act-205
  type: unjumble
  title: Складі́ть ре́чення з «У мене́ є» — Build sentences with «У мене́ є»
  instruction: Складі́ть слова́ у прави́льному поря́дку. — Arrange the words in the correct order.
  words:
  - words:
    - У
    - мене́
    - є
    - стіл
    answer: У мене́ є стіл.
    hint: I have a table.
  - words:
    - У
    - тебе́
    - є
    - ла́мпа
    answer: У тебе́ є ла́мпа?
    hint: Do you have a lamp?
  - words:
    - У
    - мене́
    - є
    - су́мка
    answer: У мене́ є су́мка.
    hint: I have a bag.
  - words:
    - У
    - тебе́
    - є
    - телефо́н
    answer: У тебе́ є телефо́н?
    hint: Do you have a phone?
  - words:
    - У
    - мене́
    - є
    - лі́жко
    answer: У мене́ є лі́жко.
    hint: I have a bed.
  - words:
    - У
    - тебе́
    - є
    - зо́шит
    answer: У тебе́ є зо́шит?
    hint: Do you have a notebook?
- id: act-206
  type: odd-one-out
  title: За́йве сло́во за ро́дом — Odd word out by gender
  instruction: Знайді́ть одне́ сло́во, яке́ відрізня́ється за грамати́чним ро́дом. —
    Find the one word that differs in grammatical gender.
  items:
  - words:
    - стіл
    - телефо́н
    - зо́шит
    - кни́га
    answer: кни́га
    explanation: Кни́га — жіно́чий рід, і́нші — чолові́чий. — "Кни́га" is feminine; the others are masculine.
  - words:
    - ла́мпа
    - су́мка
    - ру́чка
    - лі́жко
    answer: лі́жко
    explanation: Лі́жко — сере́дній рід, і́нші — жіно́чий. — "Лі́жко" is neuter; the others are feminine.
  - words:
    - вікно́
    - дзе́ркало
    - крі́сло
    - стіле́ць
    answer: стіле́ць
    explanation: Стіле́ць — чолові́чий рід, і́нші — сере́дній. — "Стіле́ць" is masculine; the others are neuter.
  - words:
    - ключ
    - комп'ю́тер
    - стіл
    - стіна́
    answer: стіна́
    explanation: Стіна́ — жіно́чий рід, і́нші — чолові́чий. — "Стіна́" is feminine; the others are masculine.
  - words:
    - кімна́та
    - стіна́
    - су́мка
    - фо́то
    answer: фо́то
    explanation: Фо́то — сере́дній рід, і́нші — жіно́чий. — "Фо́то" is neuter; the others are feminine.
  - words:
    - лі́жко
    - вікно́
    - фо́то
    - зо́шит
    answer: зо́шит
    explanation: Зо́шит — чолові́чий рід, і́нші — сере́дній. — "Зо́шит" is masculine; the others are neuter.
- id: act-207
  type: translate
  bonus: true
  title: 'Бо́нус: перекладі́ть про ре́чі — Bonus: translate about things'
  instruction: Перекладі́ть ре́чення на украї́нську мо́ву. — Translate the sentences into Ukrainian.
  items:
  - sentence: I have a table and a bed.
    answer: У мене́ є стіл і лі́жко.
    explanation: Стіл — чолові́чий рід, лі́жко — сере́дній рід. — "Стіл" is masculine, "лі́жко" is neuter.
  - sentence: Do you (informal) have a phone?
    answer: У тебе́ є телефо́н?
    explanation: Телефо́н — чолові́чий рід (він). — "Телефо́н" is masculine.
  - sentence: This is my bag.
    answer: Це моя́ су́мка.
    explanation: Су́мка — жіно́чий рід (моя́ су́мка). — "Су́мка" is feminine.
  - sentence: Where is the mirror?
    answer: Де дзе́ркало?
    explanation: Дзе́ркало — сере́дній рід (воно́). — "Дзе́ркало" is neuter.
  - sentence: Here is my armchair.
    answer: Ось моє́ крі́сло.
    explanation: Крі́сло — сере́дній рід (моє́ крі́сло). — "Крі́сло" is neuter.
  - sentence: My room is here.
    answer: Моя́ кімна́та тут.
    explanation: Кімна́та — жіно́чий рід (моя́ кімна́та). — "Кімна́та" is feminine.
