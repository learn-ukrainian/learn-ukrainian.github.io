- id: act-w202
  type: fill-in
  title: Fill in the missing letter
  instruction: Complete each word with the correct letter from today's lesson.
  questions:
  - sentence: де__ (soft sign completes the word day)
    answer: нь
  - sentence: __у́дзик (hard g letter)
    answer: ґ
  - sentence: __ора́ (Ukrainian h-like sound)
    answer: г
  - sentence: __у́ка (two merged consonant sounds [шч])
    answer: щ
  - sentence: __жа́к (always two sounds [йі])
    answer: ї
  - sentence: ім__я́ (separation mark)
    answer: ''''
- id: act-w203
  type: match-up
  title: Stress pairs meaning
  instruction: Match each stressed word to its correct English definition.
  pairs:
  - left: за́мок (stress on first syllable)
    right: castle
  - left: замо́к (stress on second syllable)
    right: lock
  - left: бра́ти (stress on first syllable)
    right: brothers
  - left: брати́ (stress on second syllable)
    right: to take
  - left: ма́ма (stress on first syllable)
    right: mother
  - left: та́то (stress on first syllable)
    right: father
- id: act-w204
  type: true-false
  title: Rules of sounds and letters
  instruction: Decide whether each statement is true or false.
  questions:
  - statement: Every syllable in Ukrainian must have a vowel sound.
    is_true: true
    explanation: Vowels are the heart of syllables; a word has as many syllables as
      vowel sounds.
  - statement: The soft sign Ь has its own independent vowel sound.
    is_true: false
    explanation: Ь never has a sound of its own; it only softens the preceding consonant.
  - statement: 'The letter Ї always represents two sounds: [й] + [і].'
    is_true: true
    explanation: Ї is consistently pronounced [йі].
  - statement: Ukrainian unstressed O is reduced to an A sound.
    is_true: false
    explanation: Ukrainian O is always clean [о], even when unstressed.
  - statement: Changing stress in Ukrainian can change the meaning of a word.
    is_true: true
    explanation: For example, за́мок is castle, but замо́к is lock.
  - statement: The letter Щ represents a single simple sound.
    is_true: false
    explanation: 'Щ always represents two consonant sounds merged: [шч].'
- id: act-w205
