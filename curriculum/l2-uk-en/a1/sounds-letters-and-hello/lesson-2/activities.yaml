- id: act-2-inline-stress
  type: quiz
  title: Stress and meaning
  instruction: Choose the correct answer about Ukrainian stress.
  items:
  - prompt: What is Ukrainian stress (на́голос)?
    options:
    - text: Pronouncing one syllable with greater vocal force
      correct: true
    - text: A silent letter written at the end of a word
      correct: false
    - text: An apostrophe that separates letters
      correct: false
    explanation: Ukrainian stress (на́голос) gives extra vocal force and prominence
      to one syllable.
  - prompt: What does за́мок mean with stress on the first syllable?
    options:
    - text: Castle
      correct: true
    - text: Door lock
      correct: false
    - text: Milk
      correct: false
    explanation: За́мок (stress on the first syllable) means castle.
  - prompt: What does замо́к mean with stress on the second syllable?
    options:
    - text: Door lock
      correct: true
    - text: Castle
      correct: false
    - text: Brother
      correct: false
    explanation: Замо́к (stress on the second syllable) means lock.
  - prompt: Which syllable is stressed in the word молоко́?
    options:
    - text: The third syllable (-ко́)
      correct: true
    - text: The first syllable (мо-)
      correct: false
    - text: The second syllable (-ло-)
      correct: false
    explanation: In молоко́, the stress falls on the final syllable (-ко́).
  - prompt: How should unstressed о be pronounced in Ukrainian?
    options:
    - text: As a clean, rounded [о] sound
      correct: true
    - text: Reduced to an English-style [а] sound
      correct: false
    - text: As a completely silent vowel
      correct: false
    explanation: Ukrainian unstressed о never reduces to [а]; each о stays clean and
      rounded.
  - prompt: Can shifting the stress change the meaning of a Ukrainian word?
    options:
    - text: Yes, stress can distinguish different words or grammatical forms
      correct: true
    - text: No, stress never affects the meaning in Ukrainian
      correct: false
    - text: Only in words borrowed from English
      correct: false
    explanation: Ukrainian stress is free and phonemic; shifting stress can change
      the meaning entirely (e.g., за́мок vs замо́к).
workbook:
- id: act-4
  type: quiz
  title: Find the useful letters
  instruction: Choose the letter or sign that matches the clue.
  items:
  - question: Which letter is the hard g sound?
    options:
    - Ґ
    - Г
    - Ї
    correct: 0
    explanation: Ґ is the hard g sound; Г is the Ukrainian h-like sound.
  - question: Which letter is always [йі]?
    options:
    - Ї
    - І
    - И
    correct: 0
    explanation: Ї is always [йі]. І is the plain [і] vowel.
  - question: Which sign has no sound of its own?
    options:
    - Ь
    - Й
    - Я
    correct: 0
    explanation: Ь is the soft sign; it changes the previous consonant.
  - question: Which letter is the clean [о] sound in молоко́?
    options:
    - О
    - А
    - У
    correct: 0
    explanation: Ukrainian О stays clean in молоко́.
  - question: In Приві́т, which two letters mark different vowel sounds?
    options:
    - И and І
    - О and У
    - А and Е
    correct: 0
    explanation: Приві́т contains both И [и] and І [і].
- id: act-2-wb-group-sort
  type: group-sort
  title: Letter or sign function
  instruction: Sort each item by whether it represents an independent sound or acts
    as a modifier.
  groups:
  - label: Represents an independent sound
    items:
    - Г
    - Ґ
    - Щ
    - М
  - label: Modifier or phonetic feature without an independent sound
    items:
    - Ь
    - ''''
    - на́голос
    - склад
- id: act-2-wb-stress-meaning
  type: match-up
  title: Word pairs distinguished by stress
  instruction: Match each stressed form to its correct meaning.
  pairs:
  - left: за́мок
    right: castle (stress on first syllable)
  - left: замо́к
    right: lock (stress on second syllable)
  - left: бра́ти
    right: to take (stress on first syllable)
  - left: брати́
    right: brothers (stress on second syllable)
  - left: ма́ма
    right: mother (stress on first syllable)
  - left: молоко́
    right: milk (stress on third syllable)
- id: act-2-wb-true-false
  type: true-false
  title: Syllables and stress facts
  instruction: Determine whether each statement is true or false.
  items:
  - statement: Every Ukrainian syllable must have a vowel sound.
    correct: true
    explanation: A vowel sound is the core of every syllable in Ukrainian.
  - statement: The soft sign Ь has its own independent vowel sound.
    correct: false
    explanation: Ь has no sound of its own; it only softens the preceding consonant.
  - statement: In Ukrainian, the number of syllables in a word equals the number of
      vowel sounds.
    correct: true
    explanation: Ukrainian school grammar establishes that a word has as many syllables
      as it has vowel sounds.
  - statement: Ukrainian stress always falls strictly on the first syllable of every
      word.
    correct: false
    explanation: Ukrainian stress is free and mobile; it can fall on any syllable.
  - statement: The letter Ґ represents a hard [g] sound, distinct from the h-like
      Г.
    correct: true
    explanation: Ґ is the hard [g] sound, whereas Г is the voiced pharyngeal [ɦ].
  - statement: The letter Щ represents two sounds pronounced together as [шч].
    correct: true
    explanation: 'Щ is always a combination of two sounds: [ш] + [ч].'
- id: act-2-wb-syllable-quiz
  type: quiz
  title: Syllables in practice
  instruction: Choose the correct answer about Ukrainian syllables.
  items:
  - prompt: How many syllables does the word день have?
    options:
    - text: 1 syllable
      correct: true
    - text: 2 syllables
      correct: false
    - text: 3 syllables
      correct: false
    explanation: День has only one vowel sound [е], so it has exactly one syllable.
  - prompt: How many syllables does the word молоко́ have?
    options:
    - text: 3 syllables
      correct: true
    - text: 2 syllables
      correct: false
    - text: 1 syllable
      correct: false
    explanation: 'Молоко́ has three vowel sounds [о], giving it three syllables: мо-ло-ко́.'
  - prompt: What is an open syllable in Ukrainian?
    options:
    - text: A syllable that ends in a vowel sound
      correct: true
    - text: A syllable that ends in a consonant sound
      correct: false
    - text: A syllable with no vowels
      correct: false
    explanation: An open syllable ends in a vowel sound, such as мо- in мо-ло-ко́.
  - prompt: What is a closed syllable in Ukrainian?
    options:
    - text: A syllable that ends in a consonant sound
      correct: true
    - text: A syllable that ends in a vowel sound
      correct: false
    - text: A syllable that has two stress marks
      correct: false
    explanation: A closed syllable ends in a consonant sound, such as день or віт
      in Приві́т.
  - prompt: Which syllable carries the stress in Приві́т?
    options:
    - text: The second syllable (-ві́т)
      correct: true
    - text: The first syllable (При-)
      correct: false
    - text: Neither syllable
      correct: false
    explanation: 'In Приві́т, the stress is on the second syllable: При-ві́т.'
  - prompt: Why does Ь not create an additional syllable in день?
    options:
    - text: Because Ь is a sign without a vowel sound
      correct: true
    - text: Because syllables only count consonants
      correct: false
    - text: Because день is an irregular foreign word
      correct: false
    explanation: Syllables are formed by vowel sounds; Ь has no sound and only modifies
      the consonant.
- id: act-2-wb-fill-in
  type: fill-in
  title: Phonetic terms
  instruction: Complete each statement with the correct Ukrainian term or symbol.
  items:
  - sentence: The Ukrainian word for syllable is ____.
    options:
    - склад
    - на́голос
    - лі́тера
    answer: склад
    explanation: Склад means syllable in Ukrainian.
  - sentence: The Ukrainian sign that has no sound of its own is ____.
    options:
    - ь
    - г
    - а
    answer: ь
    explanation: The soft sign ь (м'яки́й знак) has no sound of its own.
  - sentence: The mark indicating which syllable is strongest is the ____.
    options:
    - на́голос
    - склад
    - лі́тера
    answer: на́голос
    explanation: На́голос is the stress mark that indicates the prominent syllable.
  - sentence: The Ukrainian letter representing the hard g sound is ____.
    options:
    - ґ
    - г
    - х
    answer: ґ
    explanation: Ґ is the hard [g] sound, while Г is the h-like sound.
  - sentence: The Ukrainian letter that always represents the two sounds [шч] is ____.
    options:
    - щ
    - ч
    - ш
    answer: щ
    explanation: Щ always represents the two sounds [шч] together.
  - sentence: The separation mark in Ukrainian is called an ____.
    options:
    - апо́строф
    - на́голос
    - склад
    answer: апо́строф
    explanation: The separation mark is the апо́строф (apostrophe).
