inline:
- id: act-3
  type: quiz
  title: Приголосні́ зву́ки — Consonant sounds
  instruction: Обері́ть пра́вильне тве́рдження про при́голосні зву́ки. — Choose the correct statement about consonant sounds.
  items:
  - prompt: Що ство́рюють о́ргани мо́влення під час ви́мови при́голосних? — What do speech organs create when pronouncing consonants?
    options:
    - text: Перешко́ду
      correct: true
    - text: Порожне́чу
      correct: false
    - text: Му́зику
      correct: false
    explanation: При́голосні зву́ки тво́ряться з перешко́дою в ро́ті (гу́би, зу́би, язи́к).
  - prompt: Яки́м зна́ком у звукови́х схе́мах познача́ють тверди́й при́голосний? — What symbol marks a hard consonant in diagrams?
    options:
    - text: Ри́скою [—]
      correct: true
    - text: Круже́чком [●]
      correct: false
    - text: Хре́стиком
      correct: false
    explanation: Тверди́й при́голосний познача́ють одніє́ю ри́скою [—].
  - prompt: Яки́й о́рган мо́влення бере́ уча́сть у тво́ренні зву́ка [м]? — What speech organ forms the sound [м]?
    options:
    - text: Гу́би
      correct: true
    - text: Зу́би
      correct: false
    - text: Лише́ язи́к
      correct: false
    explanation: Звук [м] — це губни́й сона́нт, де гу́би щі́льно сту́лені.
  - prompt: До якого́ ти́пу при́голосних нале́жать зву́ки [м] та [л]? — What type of consonants are [м] and [л]?
    options:
    - text: Сона́нти
      correct: true
    - text: Шумні́ глухі́
      correct: false
    - text: Шипля́чі
      correct: false
    explanation: '[м] та [л] — соно́рні при́голосні зву́ки.'
  - prompt: Чи мо́жна утвори́ти склад без голосно́го зву́ка? — Can you make a syllable without a vowel sound?
    options:
    - text: Ні, голосни́й звук є ядро́м скла́ду
      correct: true
    - text: Так, за́вжди
      correct: false
    - text: Лише́ в коро́тких слова́х
      correct: false
    explanation: Ко́жен украї́нський склад обов'язко́во мі́стить голосни́й звук.
  - prompt: Скі́льки лі́тер у сло́ві «ма́ма»? — How many letters are in the word мама?
    options:
    - text: Чоти́ри лі́тери
      correct: true
    - text: Дві лі́тери
      correct: false
    - text: Три лі́тери
      correct: false
    explanation: У сло́ві ма́ма чоти́ри лі́тери (м, а, м, а).

- id: act-201
  type: watch-and-repeat
  title: "Диві́ться та повто́рюйте: М, Л — Watch and repeat: М, Л"
  instruction: "Подиві́ться коро́тке ві́део про вимо́ву лі́тер (джерело́: А́нна Ого́йко / source: Anna Ohoiko, Ukrainian Lessons) та повторі́ть уго́лос."
  items:
  - video: https://www.youtube.com/watch?v=Ez95H4ibuJo
    letter: М
    word: ма́ма
    sound: '[м]'
    note: Сту́лені гу́би, го́лос вихо́дить крізь ніс — Closed lips, nasal airflow.
  - video: https://www.youtube.com/watch?v=v6-3Xg52Buk
    letter: Л
    word: лом
    sound: '[л]'
    note: Кі́нчик язика́ торка́ється ве́рхніх зубі́в — Tongue tip touches upper teeth.
  - video: https://www.youtube.com/watch?v=Ez95H4ibuJo
    letter: МА
    word: ма
    sound: '[ма]'
    note: Відкри́тий склад — Open syllable blend.
  - video: https://www.youtube.com/watch?v=Ez95H4ibuJo
    letter: МУ
    word: му
    sound: '[му]'
    note: Злиття́ сона́нта [м] та [у] — Blend of sonorant [m] and [u].
  - video: https://www.youtube.com/watch?v=v6-3Xg52Buk
    letter: ЛА
    word: ла
    sound: '[ла]'
    note: Тверди́й склад — Hard open syllable.
  - video: https://www.youtube.com/watch?v=v6-3Xg52Buk
    letter: ЛО
    word: ло
    sound: '[ло]'
    note: Чи́сте [о] після [л] — Pure [o] after [l].

- id: act-202
  type: count-syllables
  title: Пораху́йте склади́ — Count syllables
  instruction: Ви́значте кі́лькість складі́в у ко́жному сло́ві за золоти́м пра́вилом. — Count the syllables using the golden rule.
  maxCount: 3
  items:
  - word: ма́ма
    correct: 2
    translation: mother
  - word: ма́ло
    correct: 2
    translation: little, few
  - word: мала́
    correct: 2
    translation: small
  - word: мул
    correct: 1
    translation: silt
  - word: лом
    correct: 1
    translation: crowbar
  - word: о́ко
    correct: 2
    translation: eye

- id: act-203
  type: fill-in
  title: Пе́рші склади́ та слова́ — First syllables and words
  instruction: Допо́вніть склади́ або́ слова́ відпові́дними лі́терами. — Complete the syllables or words with appropriate letters.
  items:
  - sentence: Скла́вши м та а, ма́ємо склад ___а.
    answer: м
    options:
    - м
    - л
    - о
    explanation: Склад ма утво́рюється з лі́тер м та а.
  - sentence: Сло́во «ма́___а» озна́чає найдоро́жчу люди́ну.
    answer: м
    options:
    - м
    - л
    - у
    explanation: Сло́во ма́ма пи́шеться з двома́ бу́квами м.
  - sentence: Скла́вши л та о, ма́ємо склад ___о.
    answer: л
    options:
    - л
    - м
    - а
    explanation: Склад ло склада́ється з лі́тер л та о.
  - sentence: У сло́ві «м___ло» на́голос па́дає на пе́рший склад.
    answer: а
    options:
    - а
    - у
    - о
    explanation: Сло́во ма́ло означа́є «небага́то».
  - sentence: У сло́ві «мал___» на́голос па́дає на дру́гий склад.
    answer: а
    options:
    - а
    - о
    - у
    explanation: Сло́во мала́ — це прикме́тник жіно́чого ро́ду.
  - sentence: Сло́во «м___л» склада́ється з трьох лі́тер і одного́ скла́ду.
    answer: у
    options:
    - у
    - а
    - о
    explanation: Сло́во мул ма́є голосни́й звук у.

workbook:
- id: act-4
  type: quiz
  title: Будо́ва скла́ду та слова́ — Syllable and word structure
  instruction: Обері́ть пра́вильну відпо́відь. — Choose the correct answer.
  items:
  - prompt: Скі́льки складі́в у сло́ві ма́ма? — How many syllables in мама?
    options:
    - text: два
      correct: true
    - text: три
      correct: false
    - text: оди́н
      correct: false
    explanation: Два склади́ (ма-ма), бо два голосни́х зву́ки.
  - prompt: Як назива́ється склад, що закі́нчується на голосни́й звук? — What is a syllable ending in a vowel called?
    options:
    - text: відкри́тий
      correct: true
    - text: закри́тий
      correct: false
    - text: соно́рний
      correct: false
    explanation: Відкри́тий склад закі́нчується на голосни́й звук.
  - prompt: До якого́ ти́пу нале́жить склад «ам»? — What type is the syllable ам?
    options:
    - text: закри́тий зворо́тний
      correct: true
    - text: відкри́тий прями́й
      correct: false
    - text: глухи́й
      correct: false
    explanation: Склад ам закі́нчується на при́голосний, о́тже він закри́тий.
  - prompt: Скі́льки голосни́х зву́ків у сло́ві «лом»? — How many vowel sounds in лом?
    options:
    - text: оди́н
      correct: true
    - text: два
      correct: false
    - text: три
      correct: false
    explanation: У сло́ві лом оди́н голосни́й звук [о].
  - prompt: Яка́ звукова́ схе́ма сло́ва «ма́ма»? — What is the phonetic diagram of мама?
    options:
    - text: '[— ● — ●]'
      correct: true
    - text: '[● — ● —]'
      correct: false
    - text: '[— — ● ●]'
      correct: false
    explanation: Схе́ма сло́ва ма́ма — при́голосний, голосни́й, при́голосний, голосни́й.
  - prompt: Чим відрізня́ються слова́ «ма́ло» та «мала́»? — How do мало and мала differ?
    options:
    - text: на́голосом та зна́ченням
      correct: true
    - text: кі́лькістю лі́тер
      correct: false
    - text: зву́ком [м]
      correct: false
    explanation: "На́голос міня́є зна́чення: ма́ло (прислі́вник) та мала́ (прикме́тник)."

- id: act-204
  type: divide-words
  title: Поділі́ть слова́ на склади́ — Divide words into syllables
  instruction: Поділі́ть пода́ні слова́ дефі́сом на склади́. — Divide the words into syllables using a hyphen.
  items:
  - word: мама
    answer: ма-ма
  - word: мало
    answer: ма-ло
  - word: мала
    answer: ма-ла
  - word: мул
    answer: мул
  - word: лом
    answer: лом
  - word: око
    answer: о-ко

- id: act-205
  type: true-false
  title: "Пра́вда чи непра́вда: При́голосні та склади́ — True or False: Consonants and syllables"
  instruction: Ви́значте, чи є тве́рдження пра́вильним. — Determine if the statement is true.
  items:
  - statement: У сло́ві сті́льки складі́в, скі́льки в ньо́му голосни́х зву́ків.
    answer: true
    explanation: Це золоте́ пра́вило украї́нського складопо́ділу.
  - statement: Бу́ква М познача́є голосни́й звук.
    answer: false
    explanation: М — це при́голосна бу́ква (сона́нт).
  - statement: Склад «ма» є відкри́тим скла́дом.
    answer: true
    explanation: Склад ма закі́нчується на голосни́й звук [а].
  - statement: Сло́во «лом» ма́є два склади́.
    answer: false
    explanation: У сло́ві лом оди́н голосни́й звук [о], о́тже оди́н склад.
  - statement: У сло́ві «ма́ма» на́голос па́дає на пе́рший склад.
    answer: true
    explanation: Пра́вильний на́голос — ма́ма.
  - statement: Зву́ки [м] та [л] утво́рюються з перешко́дою в ро́ті.
    answer: true
    explanation: При́голосні зву́ки за́вжди тво́ряться з перешко́дою.

- id: act-206
  type: match-up
  title: З'єдна́йте склади́ у слова́ — Combine syllables into words
  instruction: З'єдна́йте части́ни слів та ї́хні зна́чення. — Combine parts of words and their meanings.
  pairs:
  - left: ма́-
    right: -ма (ма́ма)
  - left: ма-
    right: -ло (ма́ло)
  - left: ла-
    right: -па (ла́па)
  - left: му-
    right: -л (мул)
  - left: ло-
    right: -м (лом)
  - left: склад
    right: части́на сло́ва

- id: act-207
  type: fill-in
  title: Вста́вте пропу́щену бу́кву — Insert the missing letter
  instruction: Впиші́ть пропу́щену лі́теру в слова́. — Fill in the missing letter in the words.
  items:
  - sentence: Пе́рше сло́во дити́ни — ___а́ма.
    answer: м
    options:
    - м
    - л
    - о
    explanation: Сло́во ма́ма почина́ється з лі́тери м.
  - sentence: У лі́сі ду́же ___а́ло зву́ків.
    answer: м
    options:
    - м
    - л
    - у
    explanation: Сло́во ма́ло пи́шеться з лі́терою м.
  - sentence: Дити́на ще ___ала́.
    answer: м
    options:
    - м
    - л
    - а
    explanation: Сло́во мала́ пи́шеться з лі́терою м.
  - sentence: На бе́резі рі́чки є чорни́й ___ул.
    answer: м
    options:
    - м
    - л
    - о
    explanation: Сло́во мул озна́чає о́сад на дні.
  - sentence: Стари́й залі́зний ___ом лежи́ть у дворі́.
    answer: л
    options:
    - л
    - м
    - у
    explanation: Сло́во лом почина́ється з лі́тери л.
  - sentence: Відкри́тий склад закі́нчується на ___олосни́й звук.
    answer: г
    options:
    - г
    - п
    - м
    explanation: Відкри́тий склад закі́нчується на голосни́й звук.

- id: act-208
  type: odd-one-out
  title: За́йве поня́ття — Odd one out
  instruction: Знайді́ть за́йве сло́во або́ звук у ко́жній гру́пі. — Find the odd word or sound in each group.
  items:
  - words:
    - '[м]'
    - '[л]'
    - '[а]'
    - '[н]'
    correct: 2
    explanation: '[а] — це голосни́й звук, а ре́шта — при́голосні.'
  - words:
    - ма
    - ла
    - ло
    - ам
    correct: 3
    explanation: ам — це закри́тий склад, а ре́шта — відкри́ті склади́.
  - words:
    - ма́ма
    - ма́ло
    - мала́
    - лом
    correct: 3
    explanation: лом ма́є оди́н склад, а ре́шта слів — два склади́.
  - words:
    - ам
    - ом
    - ум
    - ма
    correct: 3
    explanation: ма — це відкри́тий прями́й склад, а ре́шта — закри́ті зворо́тні.
  - words:
    - М
    - Л
    - А
    - С
    correct: 2
    explanation: А — голосна́ бу́ква, а ре́шта — при́голосні.
  - words:
    - мул
    - лом
    - сом
    - ма́ма
    correct: 3
    explanation: ма́ма — двоскладо́ве сло́во, а ре́шта — односкладо́ві.
