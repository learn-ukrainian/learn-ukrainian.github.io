    right: 'Two consonant sounds merged: [шч]'
  - left: Ь
    right: 'Soft sign: softens preceding consonant, no sound alone'
  - left: Ї
    right: 'Always two sounds: [йі]'
  - left: ''' (апо́строф)'
    right: 'Separation mark: keeps consonant hard'
