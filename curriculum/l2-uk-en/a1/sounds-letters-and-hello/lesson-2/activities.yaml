  title: False friends vs familiar letters
  instruction: Match each letter to its correct sound description.
  pairs:
  - left: В (false friend)
    right: Sounds like English V, not B
  - left: Н (false friend)
    right: Sounds like English N, not H
  - left: Р (false friend)
    right: Sounds like rolled R, not P
  - left: С (false friend)
    right: Sounds like English S, not C
  - left: У (false friend)
    right: Sounds like [u], not English Y
  - left: Х (false friend)
    right: Sounds like throaty [kh], not English X
- id: act-204
  type: quiz
  title: Mastering word stress
  instruction: Select the correct stressed syllable or meaning for each question.
  items:
  - question: Which syllable is stressed in молоко́?
    options:
    - Third syllable (ко)
    - First syllable (мо)
    - Second syllable (ло)
    correct: 0
    explanation: 'In молоко́, the stress is on the final syllable: ко.'
  - question: What does за́мок mean (stress on the first syllable)?
    options:
    - Castle
    - Lock
    - Key
    correct: 0
    explanation: За́мок means castle. With stress on the second syllable, замо́к means
      lock.
  - question: What does замо́к mean (stress on the second syllable)?
    options:
    - Lock
    - Castle
    - House
    correct: 0
    explanation: Замо́к means lock.
  - question: Which syllable carries stress in the greeting До́брий день?
    options:
    - First syllable of До́брий
    - Second syllable of До́брий
    - Word день
    correct: 0
    explanation: 'In До́брий, stress falls on the first syllable: До́-.'
  - question: Which syllable carries stress in the greeting До́брого ра́нку?
    options:
    - First syllable of both words
    - Last syllable of both words
    - Second syllable of both words
    correct: 0
    explanation: Both До́брого and ра́нку are stressed on their first syllable.
  - question: What happens to unstressed [о] in Ukrainian words like молоко́?
    options:
    - It stays a clean [о]
    - It turns into [а]
    - It becomes silent
    correct: 0
    explanation: 'Ukrainian vowels do not reduce: unstressed [о] stays clearly pronounced
      as [о].'
workbook:
- id: act-4
  type: quiz
  title: Find the useful letters
  instruction: Choose the letter or sign that matches the clue.
  items:
  - question: Which letter is the hard g sound?
    options:
    - Ґ
    - Г
    - Ї
    correct: 0
    explanation: Ґ is the hard g sound; Г is the Ukrainian h-like sound.
  - question: Which letter is always [йі]?
    options:
    - Ї
    - І
    - И
    correct: 0
    explanation: Ї is always [йі]. І is the plain [і] vowel.
  - question: Which sign has no sound of its own?
    options:
    - Ь
    - Й
    - Я
    correct: 0
    explanation: Ь is the soft sign; it changes the previous consonant.
  - question: Which letter is the clean [о] sound in молоко́?
    options:
    - О
    - А
    - У
    correct: 0
    explanation: Ukrainian О stays clean in молоко́.
  - question: In Приві́т, which two letters mark different vowel sounds?
    options:
    - И and І
    - О and У
    - А and Е
    correct: 0
    explanation: Приві́т contains both И [и] and І [і].
