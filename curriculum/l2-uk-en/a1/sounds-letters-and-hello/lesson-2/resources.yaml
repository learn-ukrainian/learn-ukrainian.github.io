- title: Большако́ва, буква́р 1 клас, p. 24
  role: textbook
  chunk_id: 1-klas-bukvar-bolshakova-2018-1_s0023
  notes: 'Plan reference: голосні́/при́голосні че́рез вірші́. «При́голосні деренча́ть і
    тихе́нько шелестя́ть...»'
- title: Захарійчук, буква́р 1 клас (НУШ 2025), p. 13
  role: textbook
  chunk_id: 1-klas-bukvar-zaharijchuk-2025-1_s0002
  notes: 'Plan reference: [•] для голосни́х, [–] для при́голосних, [=] для м''яки́х при́голосних.'
- title: Заболо́тний 5 клас, p. 90
  role: textbook
  chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0066
  notes: «Склад – це части́на слова́, я́ку вимовля́ють одни́м по́штовхом види́хуваного пові́тря.
    У сло́ві сті́льки скла́дів, скі́льки в ньому голосни́х зву́ків.»
- title: Авра́менко 5 клас, p. 88
  role: textbook
  chunk_id: 5-klas-ukrmova-avramenko-2022_s0089
  notes: '«На́голос — це поси́лена вимо́ва одно́го зі скла́дів... Зна́чення окре́мих слів
    зале́жить від на́голосу: за́мок і за́мок.»'
- title: Погрібни́й 1992, p. 11
  role: textbook
  chunk_id: pohribnyi-ukrainska-literaturna-vymova-1992_p11
  notes: «Дзвінкі́ шу́мні при́голосні в кінці́ слова́ та в кінці́ скла́ду пере́д глухи́м при́голосним
    в украї́нській літерату́рній мо́ві вимовля́ються дзві́нко.»
