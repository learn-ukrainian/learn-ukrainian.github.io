  - source: ма́сло
    options:
    - text: butter
      correct: true
    - text: salo
      correct: false
    - text: resin
      correct: false
    explanation: "«Ма́сло» is butter."
  - source: са́ло
    options:
    - text: salo (cured fatback)
      correct: true
