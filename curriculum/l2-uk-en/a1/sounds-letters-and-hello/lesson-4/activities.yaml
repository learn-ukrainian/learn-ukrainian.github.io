- id: act-407
  type: fill-in
  title: "Чита́ння ре́чень — Reading practice fill-in"
  instruction: "Вста́вте пра́вильне сло́во за змі́стом ре́чення. — Fill in the word that fits the context."
  items:
  - sentence: "Он золоти́й широ́кий ___."
    answer: лан
    options:
    - лан
    - лом
    - сом
    explanation: "«Лан» means field."
  - sentence: "У рі́чці пла́ває вели́кий ___."
    answer: сом
    options:
    - сом
    - сон
    - сам
    explanation: "«Сом» is catfish."
  - sentence: "Он лети́ть мала́ ___."
    answer: оса́
    options:
    - оса́
    - сосна́
    - смола́
    explanation: "«Оса́» is wasp."
  - sentence: "У лі́сі росте́ стара́ ___."
    answer: сосна́
    options:
    - сосна́
    - оса́
    - ма́сло
    explanation: "«Сосна́» is pine tree."
  - sentence: "Ма́ма там стої́ть ___."
    answer: сама́
    options:
    - сама́
    - са́ма
    - ма́ло
    explanation: "«Сама́» means alone / by herself."
  - sentence: "На столі́ лежи́ть сві́же ___ і са́ло."
    answer: ма́сло
    options:
    - ма́сло
    - смола́
    - оса́
    explanation: "«Ма́сло» means butter."
