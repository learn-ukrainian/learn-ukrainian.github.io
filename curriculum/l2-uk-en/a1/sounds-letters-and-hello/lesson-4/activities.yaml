- id: act-10
  type: error-correction
  title: "Фонети́чні та орфографі́чні па́стки — Phonetic and spelling traps"
  instruction: "Знайді́ть поми́лку та обері́ть прави́льний варіа́нт. — Identify the mistake and choose the correct form."
  items:
  - sentence: "У лі́сі росте́ висо́ка сасна́."
    error: сасна́
    answer: сосна́
    options:
    - сосна́
    - сасна́
    - сосно́
    explanation: "Ukrainian unstressed о does not reduce to а: «сосна́»."
  - sentence: "На хліб нама́зали сві́же масло́."
    error: масло́
    answer: ма́сло
    options:
    - ма́сло
    - масло́
    - маслі́
    explanation: "The stress in butter is on the first syllable: «ма́сло»."
  - sentence: "Он лети́ть мала оса́."
    error: мала
    answer: мала́
    options:
    - мала́
    - ма́ла
    - ма́ло
    explanation: "The feminine adjective for small is stressed on the end: «мала́»."
  - sentence: "Він з'їв сало́ з хлі́бом."
    error: сало́
    answer: са́ло
    options:
    - са́ло
    - сало́
    - са́ла
    explanation: "Salo is stressed on the first syllable: «са́ло»."
  - sentence: "Оле́г гукну́в: «Ма́ма, ходи́ сюди́!»."
    error: Ма́ма
    answer: Ма́мо
    options:
    - Ма́мо
    - Ма́ма
    - Мала́
    explanation: "Direct address requires the vocative form: «Ма́мо!»."
  - sentence: "На корі́ сосни́ ви́ступила смала́."
    error: смала́
    answer: смола́
    options:
    - смола́
    - смала́
    - смо́ла
    explanation: "Unstressed о remains pure: «смола́»."

- id: act-405
  type: group-sort
  title: "Класифіка́ція за на́голосом — Sort by stress position"
  instruction: "Розподілі́ть слова́ зале́жно від того́, на яки́й склад па́дає на́голос. — Sort the words by stress: first syllable or second syllable."
