inline:
- id: act-6
  type: true-false
  title: "Переві́рка знань семи́ лі́тер — Seven-letter safety check"
  instruction: "Ви́значте, чи твер́дження пра́вильне. — Decide whether each statement is true or false."
  items:
  - statement: "In Ukrainian, moving the stress mark can change the meaning of a word."
    answer: true
    explanation: "Stress is phonemic in Ukrainian: «ма́ло» (few) vs «мала́» (small)."
  - statement: "The vocative form to directly address mother is «Ма́мо!»."
    answer: true
    explanation: "Ukrainian uses the vocative case for direct address: «Ма́мо!»."
  - statement: "The Ukrainian unstressed [о] sound is pronounced as [а], like in Russian."
    answer: false
    explanation: "Ukrainian has no akanye: unstressed [о] stays pure and rounded."
  - statement: "The word «ма́сло» means butter in Ukrainian."
    answer: true
    explanation: "«Ма́сло» means butter."
  - statement: "The word «са́ло» is stressed on the second syllable: «сало́»."
    answer: false
    explanation: "«Са́ло» is stressed on the first syllable: «са́-ло»."
  - statement: "In Ukrainian, the letter Н represents a nasal sonorant sound."
    answer: true
    explanation: "Letter Н represents [n], a nasal sonorant."

- id: act-401
  type: quiz
  title: "Си́ла на́голосу — The power of stress"
  instruction: "Обері́ть пра́вильне зна́чення ви́діленого сло́ва. — Choose the correct meaning for the highlighted word."
  items:
  - prompt: "What does «ма́ло» mean with stress on the first syllable?"
    options:
    - text: "Little / few (adverb)"
      correct: true
    - text: "Small / little (feminine adjective)"
      correct: false
    - text: "Mother"
      correct: false
    explanation: "«Ма́ло» with stress on the first syllable is an adverb meaning little or few."
  - prompt: "What does «мала́» mean with stress on the second syllable?"
    options:
    - text: "Small / little (feminine adjective)"
      correct: true
    - text: "Little / few (adverb)"
      correct: false
    - text: "Catfish"
      correct: false
    explanation: "«Мала́» with stress on the second syllable is a feminine adjective (e.g. «мала́ оса́»)."
  - prompt: "In the sentence «Ма́ма сама́.», what does «сама́» mean?"
    options:
    - text: "Alone / by herself"
      correct: true
    - text: "The very"
      correct: false
    - text: "Together"
      correct: false
    explanation: "«Сама́» with stress on the second syllable means alone or by oneself."
  - prompt: "In the phrase «Он мала́ оса́.», which word carries stress on its final syllable?"
    options:
    - text: Both мала́ and оса́
      correct: true
    - text: Only он
      correct: false
    - text: Neither word
      correct: false
    explanation: "Both «мала́» and «оса́» carry stress on the final -а́."
  - prompt: "How many vowel sounds are there in the word «ма́сло»?"
    options:
    - text: '2'
      correct: true
    - text: '3'
      correct: false
    - text: '1'
      correct: false
    explanation: "«Ма́сло» has two vowels ([а] and [о]) and therefore two syllables."
  - prompt: "What happens to the vowels in «ма́сло» when spoken aloud?"
    options:
    - text: "Both [а] and [о] are pronounced clearly and distinctly"
      correct: true
    - text: "The final [о] becomes [а]"
      correct: false
    - text: "The vowel [а] is silent"
      correct: false
    explanation: "Ukrainian preserves pure vowel quality without reduction."

- id: act-402
  type: fill-in
  title: "Кли́чний відмі́нок: Зверта́ння — Vocative address"
  instruction: "Обері́ть пра́вильне сло́во для зверта́ння. — Choose the correct word for direct address."
  items:
  - sentence: "___, подиви́ся сюди́!"
    answer: Ма́мо
    options:
    - Ма́мо
    - Ма́ма
    - Ма́сло
    explanation: "Use the vocative «Ма́мо!» when addressing mother directly."
  - sentence: "___! Он росте́ висо́ка сосна́!"
    answer: Ма́мо
    options:
    - Ма́мо
    - Ма́ма
    - Мала́
    explanation: "Direct call uses «Ма́мо!»."
  - sentence: "Он іде́ на́ша ___."
    answer: ма́ма
    options:
    - ма́ма
    - ма́мо
    - мала́
    explanation: "Stating who is coming uses the nominative «ма́ма»."
  - sentence: "Оле́г гука́є: «___!»."
    answer: Ма́мо
    options:
    - Ма́мо
    - Ма́ма
    - Ма́ло
    explanation: "Calling out requires the vocative form «Ма́мо!»."
  - sentence: "Там стої́ть на́ша до́бра ___."
    answer: ма́ма
    options:
    - ма́ма
    - ма́мо
    - сама́
    explanation: "Subject of sentence is nominative «ма́ма»."
  - sentence: "«___, он сом у рі́чці!» — сказа́в Марко́."
    answer: Ма́мо
    options:
    - Ма́мо
    - Ма́ма
    - Са́ло
    explanation: "Calling mother directly requires «Ма́мо!»."

- id: act-403
  type: match-up
  title: "Побуто́ві слова́ та приро́да — Everyday and nature words"
  instruction: "З'єдна́йте украї́нське сло́во з його́ зна́ченням. — Match the Ukrainian word to its meaning."
  pairs:
  - left: ма́сло
    right: butter
  - left: са́ло
    right: salo (cured fatback)
  - left: смола́
    right: tree resin / pitch
  - left: сосна́
    right: pine tree
  - left: оса́
    right: wasp
  - left: лан
    right: field

- id: act-404
  type: quiz
  title: "Розумі́ння мікроте́кстів — Reading comprehension"
  instruction: "Да́йте ві́дповідь на запита́ння до те́кстів. — Answer the question based on the reading texts."
  items:
  - prompt: "In Text 1, what is pointed out near the pine tree?"
    options:
    - text: "A field, a catfish, and a wasp"
      correct: true
    - text: "A car and a house"
      correct: false
    - text: "Milk and bread"
      correct: false
    explanation: "Text 1 lists «сосна́», «лан», «сом», and «оса́»."
  - prompt: "In Text 2, who is outdoors alone?"
    options:
    - text: "Mother («Ма́ма сама́.»)"
      correct: true
    - text: "Oleh"
      correct: false
    - text: "Marko"
      correct: false
    explanation: "The text states: «Ма́ма сама́.»."
  - prompt: "What foods are mentioned in Text 2?"
    options:
    - text: "Butter and salo («ма́сло», «са́ло»)"
      correct: true
    - text: "Apples and honey"
      correct: false
    - text: "Fish and soup"
      correct: false
    explanation: "Text 2 mentions «ма́сло» and «са́ло»."
  - prompt: "What pointer word is used to direct attention in both texts?"
    options:
    - text: он
      correct: true
    - text: ми
      correct: false
    - text: як
      correct: false
    explanation: "«Он» points out objects in view («Он сосна́», «Он ма́ма»)."
  - prompt: "How does the speaker address mother in Text 2?"
    options:
    - text: Ма́мо!
      correct: true
    - text: Ма́ма!
      correct: false
    - text: Мала́!
      correct: false
    explanation: "The speaker calls: «Ма́мо! Он сосна́!»."
  - prompt: "What is the size of the wasp in Text 1?"
    options:
    - text: "Small («Оса́ мала́.»)"
      correct: true
    - text: "Large"
      correct: false
    - text: "Enormous"
      correct: false
    explanation: "The text says: «Оса́ мала́.»."

workbook:
- id: act-8
  type: match-up
  title: "Сім лі́тер та їхні зву́ки — Seven letters and their sounds"
  instruction: "З'єдна́йте лі́теру з її́ звуково́ю характери́стикою. — Match the letter with its phonetic property."
  pairs:
  - left: А
    right: "відкри́тий голосни́й [а] — open vowel [a]"
  - left: О
    right: "окру́глений голосни́й [о] — rounded vowel [o]"
  - left: У
    right: "лабіалізо́ваний голосни́й [у] — pursed vowel [u]"
  - left: М
    right: "губни́й носови́й сона́нт [м] — bilabial nasal sonorant [m]"
  - left: Л
    right: "бокови́й сона́нт [л] — lateral sonorant [l]"
  - left: С
    right: "глухи́й свистя́чий при́голосний [с] — voiceless sibilant [s]"

- id: act-9
  type: translate
  title: "Пере́клад слів мо́дуля — Module vocabulary translation"
  instruction: "Обері́ть пра́вильний англі́йський пере́клад. — Choose the correct English translation."
  items:
  - source: ма́ма
    options:
