inline:
- id: act-301
  type: watch-and-repeat
  title: "Диві́ться та повто́рюйте: С, Н — Watch and repeat: С, Н"
  instruction: "Подиві́ться коро́тке ві́део про вимо́ву лі́тер (джерело́: А́нна Ого́йко / source: Anna Ohoiko, Ukrainian Lessons) та повторі́ть уго́лос."
  items:
  - letter: С
    word: сон
    sound: '[с]'
    video: https://www.youtube.com/watch?v=7UsFBgSL91E
    note: "Глухи́й свистя́чий при́голосний — Voiceless sibilant consonant."
  - letter: Н
    word: ніс
    sound: '[н]'
    video: https://www.youtube.com/watch?v=vNUfiKHPYaU
    note: "Тверди́й носови́й сона́нт — Hard nasal sonorant."
  - letter: СА
    word: сам
    sound: '[са]'
    video: https://www.youtube.com/watch?v=7UsFBgSL91E
    note: "Злиття́ зву́ків [с] та [а] — Syllable blend of [s] and [a]."
  - letter: СО
    word: сом
    sound: '[со]'
    video: https://www.youtube.com/watch?v=7UsFBgSL91E
    note: "Чи́сте окру́глене [о] після [с] — Pure rounded [o] after [s]."
  - letter: НА
    word: нас
    sound: '[на]'
    video: https://www.youtube.com/watch?v=vNUfiKHPYaU
    note: "Злиття́ зву́ків [н] та [а] — Syllable blend of [n] and [a]."
  - letter: НО
    word: сон
    sound: '[но]'
    video: https://www.youtube.com/watch?v=vNUfiKHPYaU
    note: "Злиття́ зву́ків [н] та [о] — Syllable blend of [n] and [o]."

- id: act-5
  type: match-up
  title: "Слова́ та зна́чення — Words and meanings"
  instruction: "З'єдна́йте украї́нське сло́во з його́ англі́йським пере́кладом. — Match the Ukrainian word to its English translation."
  pairs:
  - left: сон
    right: sleep / dream
  - left: сом
    right: catfish
  - left: сам
    right: alone / by oneself (m)
  - left: лан
    right: field
  - left: оса́
    right: wasp
  - left: сосна́
    right: pine tree

- id: act-302
  type: quiz
  title: "Будо́ва скла́ду CVC та зву́ки — Syllable structure and sounds"
  instruction: "Обері́ть пра́вильну ві́дповідь. — Choose the correct answer."
  items:
  - prompt: "What is a closed syllable (закри́тий склад) in Ukrainian?"
    options:
    - text: "A syllable that ends in a consonant sound"
      correct: true
    - text: "A syllable that has no vowels"
      correct: false
    - text: "A syllable that is stressed"
      correct: false
    explanation: "A closed syllable (закри́тий склад) ends with a consonant sound, such as [сон] or [лан]."
  - prompt: "Which of the following words consists of a single closed syllable (CVC)?"
    options:
    - text: сон
      correct: true
    - text: оса́
      correct: false
    - text: ма́ма
      correct: false
    explanation: "«Сон» is a single CVC syllable: consonant [с] + vowel [о] + consonant [н]."
  - prompt: "What phonetic type of consonant is the letter С?"
    options:
    - text: "A voiceless sibilant consonant (глухи́й свистя́чий)"
      correct: true
    - text: "A nasal sonorant consonant"
      correct: false
    - text: "A voiced plosive consonant"
      correct: false
    explanation: "Letter С represents [s], a voiceless dental sibilant consonant."
  - prompt: "What phonetic type of consonant is the letter Н?"
    options:
    - text: "A nasal sonorant consonant (носови́й сона́нт)"
      correct: true
    - text: "A voiceless sibilant consonant"
      correct: false
    - text: "A rounded vowel sound"
      correct: false
    explanation: "Letter Н represents [n], an airflow-through-the-nose sonorant consonant."
  - prompt: "In the word «сосна́», how is the unstressed «о» pronounced?"
    options:
    - text: "As a pure, clear [o] without reduction to [a]"
      correct: true
    - text: "As [a], exactly like Russian akanye"
      correct: false
    - text: "It is completely silent"
      correct: false
    explanation: "Ukrainian unstressed «о» is never reduced to «а»; it remains clean and rounded."
  - prompt: "What does the pointing word «он» mean?"
    options:
    - text: "There / over there (pointing out an object in view)"
      correct: true
    - text: "Here (in my hand)"
      correct: false
    - text: "Goodbye"
      correct: false
    explanation: "«Он» is a pointing particle meaning 'there / yonder' (e.g. «Он сосна́»)."

- id: act-303
  type: fill-in
  title: "Вста́вте пропу́щене сло́во — Fill in the missing word"
  instruction: "Обері́ть пра́вильне сло́во для ко́жного ре́чення. — Choose the correct word for each sentence."
  items:
  - sentence: "У рі́чці пла́ває вели́кий ___."
    answer: сом
    options:
    - сом
    - сон
    - оса́
    explanation: "Сом is a catfish living in water."
  - sentence: "Ти́хий нічни́й ___."
    answer: сон
    options:
    - сон
    - сом
    - лан
    explanation: "Сон means sleep or dream."
  - sentence: "Він стої́ть там ___."
    answer: сам
    options:
    - сам
    - сом
    - сон
    explanation: "Сам means alone or by oneself."
  - sentence: "Он золоти́й широ́кий ___."
    answer: лан
    options:
    - лан
    - сон
    - сом
    explanation: "Лан means a wide field."
  - sentence: "Над кві́ткою лети́ть ___."
    answer: оса́
    options:
    - оса́
    - сосна́
    - ма́ма
    explanation: "Оса́ is a flying wasp."
  - sentence: "У лі́сі росте́ висо́ка ___."
    answer: сосна́
    options:
    - сосна́
    - оса́
    - лан
    explanation: "Сосна́ is a pine tree growing in the forest."

- id: act-304
  type: true-false
  title: "Пра́вда чи непра́вда? — True or false?"
  instruction: "Ви́значте, чи твер́дження пра́вильне. — Decide whether each statement is true or false."
  items:
  - statement: "Letter С represents the voiceless sibilant sound [s]."
    answer: true
    explanation: "С corresponds to [s], a voiceless sibilant sound."
  - statement: "The word «сосна́» consists of two syllables: closed [сос-] and open [-на́]."
    answer: true
    explanation: "Сос-на́ has two syllables: CVC + CV."
  - statement: "In Ukrainian, unstressed «о» in «сосна́» turns into «а»."
    answer: false
    explanation: "Ukrainian has no akanye; unstressed [o] remains rounded and clear."
  - statement: "In standard Ukrainian, the common word for the celestial moon is «сон»."
    answer: false
    explanation: "«Сон» means sleep or dream; the moon is «мі́сяць»."
  - statement: "The word «он» is used to point to something at a distance."
    answer: true
    explanation: "«Он» is a pointing particle meaning 'yonder / over there'."
  - statement: "Letter Н represents a nasal sonorant sound [n]."
    answer: true
    explanation: "Н is a nasal sonorant [n]."

workbook:
- id: act-7
  type: group-sort
  title: "Класифіка́ція слів за структу́рою — Word structure sort"
  instruction: "Розподілі́ть слова́ за структу́рою: односкладо́ві CVC чи двоскладо́ві. — Sort the words by structure: single CVC syllable or two syllables."
  groups:
  - label: "CVC (один закри́тий склад)"
    items:
    - сон
    - сом
    - сам
    - лан
    - мул
    - лом
  - label: "Двоскладо́ві слова́"
    items:
    - оса́
    - сосна́
    - ма́ма
    - ма́ло
    - мала́

- id: act-305
  type: match-up
  title: "Слова́-помічники́ та зна́чення — Helper words and meanings"
  instruction: "З'єдна́йте украї́нське сло́во з англі́йським зна́ченням. — Match each helper word or noun with its meaning."
  pairs:
  - left: он
    right: there / over there (pointing)
  - left: нас
    right: us (genitive / accusative)
  - left: нам
    right: to us (dative)
  - left: ніс
    right: nose
  - left: лан
    right: field
  - left: сом
    right: catfish

- id: act-306
  type: unjumble
  title: "Утворі́ть слова́ з лі́тер та складі́в — Build words from letters and syllables"
  instruction: "Розташу́йте елеме́нти у пра́вильному поря́дку, щоб утвори́ти сло́во. — Put elements in the correct order to form the word."
  items:
  - answer: сон
    words:
    - с
    - о
    - н
  - answer: сом
    words:
    - с
    - о
    - м
  - answer: сам
    words:
    - с
    - а
    - м
  - answer: лан
    words:
    - л
    - а
    - н
  - answer: оса
    words:
    - о
    - с
    - а
  - answer: сосна
    words:
    - с
    - о
    - с
    - н
    - а

- id: act-307
  type: fill-in
  title: "Ре́чення зі слова́ми-помічника́ми — Sentences with helper words"
  instruction: "Вста́вте пра́вильне сло́во. — Fill in the correct word."
  items:
  - sentence: "___ сосна́ і лан."
    answer: Он
    options:
    - Он
    - Нам
    - Нас
    explanation: "«Он» points out objects in view."
  - sentence: "Він чека́є ___."
    answer: нас
    options:
    - нас
    - нам
    - он
    explanation: "«Чека́є нас» — waits for us."
  - sentence: "Він допомага́є ___."
    answer: нам
    options:
    - нам
    - нас
    - он
    explanation: "«Допомага́є нам» — helps us."
  - sentence: "Он лети́ть ___."
    answer: оса́
    options:
    - оса́
    - лан
    - сом
    explanation: "«Лети́ть оса́» — the wasp is flying."
  - sentence: "Он пливе́ ___."
    answer: сом
    options:
    - сом
    - сон
    - лан
    explanation: "«Пливе́ сом» — the catfish is swimming."
  - sentence: "Це мій спокі́йний ___."
    answer: сон
    options:
    - сон
    - сом
    - сам
    explanation: "«Спокі́йний сон» — peaceful sleep."

- id: act-308
  type: error-correction
  title: "Ви́правте поми́лку у сло́ві — Correct the spelling mistake"
  instruction: "Знайді́ть поми́лку у ви́діленому сло́ві та ви́беріть пра́вильний варіа́нт. — Find the error in the underlined word and choose the correct form."
  items:
  - sentence: "У лі́сі росте́ сасна́."
    error: сасна́
    answer: сосна́
    options:
    - сосна́
    - сасна́
    - сусна́
    explanation: "Ukrainian has no akanye: unstressed o remains clear in сосна́."
  - sentence: "У рі́чці пла́ває вели́кий сон."
    error: сон
    answer: сом
    options:
    - сом
    - сон
    - сам
    explanation: "The fish is сом (catfish), not сон (dream)."
  - sentence: "Він стої́ть там сом."
    error: сом
    answer: сам
    options:
    - сам
    - сом
    - сон
    explanation: "Alone / by oneself is сам."
  - sentence: "Он зеле́ний лон."
    error: лон
    answer: лан
    options:
    - лан
    - лон
    - лун
    explanation: "The field is лан, not лон."
  - sentence: "Он лети́ть аса́."
    error: аса́
    answer: оса́
    options:
    - оса́
    - аса́
    - уса́
    explanation: "Wasp is оса́."
  - sentence: "Він кли́че нос."
    error: нос
    answer: нас
    options:
    - нас
    - нос
    - ніс
    explanation: "He calls us is «нас»."

