  type: unjumble
  title: "Утворі́ть слова́ з лі́тер та складі́в — Build words from letters and syllables"
  instruction: "Розташу́йте елеме́нти у пра́вильному поря́дку, щоб утвори́ти сло́во. — Put elements in the correct order to form the word."
  items:
