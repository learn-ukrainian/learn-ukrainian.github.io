- id: act-305
  type: match-up
  title: "Слова́-помічники́ та зна́чення — Helper words and meanings"
  instruction: "З'єдна́йте украї́нське сло́во з англі́йським зна́ченням. — Match each helper word or noun with its meaning."
  pairs:
  - left: "он — over there"
    right: "он (у по́лі зо́ру) — over there (in view)"
  - left: "нас — us"
    right: "нас (про нас) — us (about us)"
  - left: "нам — to us"
    right: "нам (для нас) — to us (for us)"
