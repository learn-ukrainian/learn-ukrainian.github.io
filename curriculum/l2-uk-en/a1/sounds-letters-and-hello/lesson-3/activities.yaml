  type: group-sort
  title: "Класифіка́ція слів за структу́рою — Word structure sort"
  instruction: "Розподілі́ть слова́ за структу́рою: односкладо́ві CVC чи двоскладо́ві. — Sort the words by structure: single CVC syllable or two syllables."
  groups:
