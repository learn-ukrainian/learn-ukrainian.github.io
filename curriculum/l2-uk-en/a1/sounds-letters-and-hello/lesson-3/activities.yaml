inline:
- id: act-3-in-1
  type: quiz
  title: 'Euphony choices: У vs В and І vs Й'
  instruction: Choose the smoother Ukrainian form.
  items:
  - prompt: Which phrase flows smoothly between vowels and consonants?
    options:
    - text: Ході́мо в кіно́
      correct: true
    - text: Ході́мо у кіно́
      correct: false
    - text: Ході́мо й кіно́
      correct: false
    explanation: After a vowel (Ході́мо), use 'в' before a consonant (кіно́) to maintain
      smooth alternation.
  - prompt: How should a phrase begin before a consonant cluster like 'шк-'?
    options:
    - text: У шко́лі
      correct: true
    - text: В шко́лі
      correct: false
    - text: Й шко́лі
      correct: false
    explanation: At the start of a phrase before consonants (шко́лі), 'у' provides
      a smooth opening.
  - prompt: Which connector fits smoothly between two consonants in 'брат ___ сестра́'?
    options:
    - text: і
      correct: true
    - text: й
      correct: false
    - text: в
      correct: false
    explanation: Between consonants (брат and сестра́), use 'і' to prevent an awkward
      consonant cluster.
  - prompt: 'Which connector links two names ending and beginning with vowels: ''Марко́
      ___ А́нна''?'
    options:
    - text: й
      correct: true
    - text: у
      correct: false
    - text: в
      correct: false
    explanation: Between vowels (Марко́ and А́нна), short 'й' provides a graceful
      glide.
  - prompt: Before a city name beginning with 'Льв-', which preposition avoids a collision
      of consonants?
    options:
    - text: у Льво́ві
      correct: true
    - text: в Льво́ві
      correct: false
    - text: й Льво́ві
      correct: false
    explanation: Before 'льв-', Ukrainian always uses 'у' to avoid a heavy cluster
      of consonants.
  - prompt: What is the primary reason Ukrainian alternates У/В and І/Й?
    options:
    - text: To create smooth sound flow (милозву́чність) and avoid awkward clusters
      correct: true
    - text: To show grammatical past tense
      correct: false
    - text: To distinguish masculine and feminine nouns
      correct: false
    explanation: Милозву́чність (euphony) ensures that Ukrainian sounds melodious
      and easy to pronounce.
- id: act-3-in-2
  type: match-up
  title: Greeting to time and register
  instruction: Match each Ukrainian greeting to its situation.
  pairs:
  - left: Приві́т!
    right: Informal greeting for friends and peers
  - left: До́брого ра́нку!
    right: Morning greeting until noon
  - left: До́брий день!
    right: Neutral daytime greeting for any audience
  - left: До́брий ве́чір!
    right: Evening greeting after dark
  - left: До поба́чення!
    right: Formal/neutral farewell when leaving
  - left: На все до́бре!
    right: Warm farewell wishing all the best
- id: act-5
  type: fill-in
  title: First conversations
  instruction: Choose the phrase that completes the line.
  items:
  - sentence: ____! Як спра́ви?
    answer: Приві́т
    options:
    - Приві́т
    - Молоко́
    - Лі́тера
    explanation: Приві́т is the friendly everyday greeting used with friends and classmates.
  - sentence: ____. А у тебе́?
    answer: До́бре
    options:
    - До́бре
    - День
    - Звук
    explanation: До́бре (fine/well) is a natural positive response to Як спра́ви?
  - sentence: Як тебе́ ____?
    answer: зва́ти
    options:
    - зва́ти
    - до́бре
    - день
    explanation: The question Як тебе́ зва́ти? asks for someone's name.
  - sentence: Мене́ ____ А́нна.
    answer: зва́ти
    options:
    - зва́ти
    - спра́ви
    - звук
    explanation: Мене́ зва́ти... means 'My name is...'.
  - sentence: До ____!
    answer: поба́чення
    options:
    - поба́чення
    - тебе́
    - ма́ма
    explanation: До поба́чення is the standard farewell expression for Goodbye.
  - sentence: На все ____!
    answer: до́бре
    options:
    - до́бре
    - лі́тера
    - звук
    explanation: На все до́бре means 'All the best' when parting.
- id: act-3-in-3
  type: true-false
  title: Etiquette and speech habits check
  instruction: Choose true or false for each statement.
  items:
  - statement: A female speaker says 'Ра́да тебе́ ба́чити' to say 'Glad to see you'.
    correct: true
    explanation: 'Ukrainian adjectives agree with speaker gender: a woman says ''Ра́да'',
      a man says ''Ра́дий''.'
  - statement: In 'До́брого ра́нку', the unstressed 'о' sounds should be pronounced
      like English 'uh' or Russian 'a'.
    correct: false
    explanation: In Ukrainian, every 'о' remains clear and rounded [о], whether stressed
      or unstressed.
  - statement: After 'Як тебе́ зва́ти?', the correct reciprocal question is 'А тебе́?'.
    correct: true
    explanation: '''А тебе́?'' matches ''Як тебе́ зва́ти?''. ''А у тебе́?'' is only
      used after ''Як спра́ви?''.'
  - statement: '''Приві́т!'' is suitable for addressing an unfamiliar official or
      store clerk.'
    correct: false
    explanation: '''Приві́т!'' is informal; use ''До́брий день!'' in neutral or formal
      situations.'
  - statement: 'The word ''Приві́т'' has two vowel sounds: [и] and [і].'
    correct: true
    explanation: '''Приві́т'' contains vowel sounds [и] and [і], along with four consonants.'
  - statement: In Ukrainian, stress is marked on the second syllable of 'Приві́т'.
    correct: true
    explanation: 'The stress falls on the syllable ''-ві́т'': При-ві́т.'
- id: act-3-in-4
  type: match-up
  title: Question and response pairs
  instruction: Match each question or opener to its natural conversational response.
  pairs:
  - left: Як спра́ви?
    right: До́бре. А у тебе́?
  - left: Як тебе́ зва́ти?
    right: Мене́ зва́ти Марко́. А тебе́?
  - left: До́брий день!
    right: До́брий день!
  - left: До поба́чення!
    right: До поба́чення! На все до́бре!
  - left: Ра́дий тебе́ ба́чити!
    right: Я теж!
  - left: До́брого ра́нку!
    right: До́брого ра́нку!
workbook:
- id: act-7
  type: group-sort
  title: Vowel or consonant sound?
  instruction: Sort the sounds, not the letters.
  groups:
  - label: Vowel sounds
    items:
    - '[а]'
    - '[о]'
    - '[у]'
    - '[е]'
    - '[и]'
    - '[і]'
  - label: Consonant sounds
    items:
    - '[п]'
    - '[р]'
    - '[в]'
    - '[т]'
    - '[м]'
    - '[н]'
    - '[к]'
    - '[с]'
- id: act-3-wb-1
  type: match-up
  title: Ukrainian phrases to English meanings
  instruction: Match each Ukrainian phrase to its English meaning.
  pairs:
  - left: Як спра́ви?
    right: How are you?
  - left: Чудо́во.
    right: Great / wonderful.
  - left: Норма́льно.
    right: Okay / normal.
  - left: Як тебе́ зва́ти?
    right: What is your name?
  - left: Мене́ зва́ти ...
    right: My name is ...
  - left: На все до́бре!
    right: All the best!
- id: act-3-wb-2
  type: fill-in
  title: 'Euphony: insert У or В'
  instruction: Choose У or В to make the phrase euphonic.
  items:
  - sentence: Вона́ живе́ ____ Ки́єві.
    answer: в
    options:
    - в
    - у
    explanation: After a vowel (живе́) before a single consonant, 'в' provides smooth
      alternation.
  - sentence: Марко́ зайшо́в ____ дім.
    answer: у
    options:
    - у
    - в
    explanation: Between consonants (зайшо́в and дім), 'у' prevents three consonants
      in a row.
  - sentence: ____ шко́лі луна́є дзво́ник.
    answer: У
    options:
    - У
    - В
    explanation: At the start of a sentence before consonant cluster 'шк-', 'У' is
      required.
  - sentence: Дру́зі зустрі́лися ____ Льво́ві.
    answer: у
    options:
    - у
    - в
    explanation: Before 'Льв-', always use 'у' to avoid an unpronounceable consonant
      cluster.
  - sentence: Ді́ти гуля́ють ____ саду́.
    answer: в
    options:
    - в
    - у
    explanation: After a vowel (гуля́ють) before a consonant (саду́), 'в' is the smoother
      choice.
  - sentence: Вчи́телька ____ кла́сі.
    answer: у
    options:
    - у
    - в
    explanation: Before the cluster 'кл-', 'у' prevents a heavy pile-up of consonants.
- id: act-3-wb-3
  type: quiz
  title: 'Reciprocal etiquette: А тебе́ vs А у тебе́'
  instruction: Choose the correct phrase for each dialogue situation.
  items:
  - prompt: 'Marko asks Sofia: ''Як спра́ви?'' Sofia answers: ''До́бре. ______?'''
    options:
    - text: А у тебе́?
      correct: true
    - text: А тебе́?
      correct: false
    - text: До поба́чення
      correct: false
    explanation: After 'Як спра́ви?', the reciprocal asking about the other person's
      state is 'А у тебе́?'.
  - prompt: 'Marko asks: ''Як тебе́ зва́ти?'' Sofia answers: ''Мене́ зва́ти Софі́я.
      ______?'''
    options:
    - text: А тебе́?
      correct: true
    - text: А у тебе́?
      correct: false
    - text: Як спра́ви?
      correct: false
    explanation: After 'Як тебе́ зва́ти?', the reciprocal asking for the name is 'А
      тебе́?' (short for 'А тебе́ як зва́ти?').
  - prompt: A male speaker greets a friend he hasn't seen in a while. What does he
      say?
    options:
    - text: Ра́дий тебе́ ба́чити.
      correct: true
    - text: Ра́да тебе́ ба́чити.
      correct: false
    - text: До́брого ра́нку.
      correct: false
    explanation: 'A male speaker uses the masculine adjective ending: ''Ра́дий''.'
  - prompt: A female speaker greets a friend she hasn't seen in a while. What does
      she say?
    options:
    - text: Ра́да тебе́ ба́чити.
      correct: true
    - text: Ра́дий тебе́ ба́чити.
      correct: false
    - text: Норма́льно.
      correct: false
    explanation: 'A female speaker uses the feminine adjective ending: ''Ра́да''.'
  - prompt: Which phrase literally means 'How are matters / things with you?'
    options:
    - text: Як спра́ви?
      correct: true
    - text: Як тебе́ зва́ти?
      correct: false
    - text: На все до́бре!
      correct: false
    explanation: Спра́ви means affairs, matters, or things; 'Як спра́ви?' asks how
      things are going.
  - prompt: Which farewell phrase means 'All the best!'?
    options:
    - text: На все до́бре!
      correct: true
    - text: До́брий ве́чір!
      correct: false
    - text: До́брого ра́нку!
      correct: false
    explanation: '''На все до́бре!'' is a warm parting phrase wishing all the best.'
- id: act-3-wb-4
  type: translate
  title: Translate conversational formulas
  instruction: Choose the correct English translation for each Ukrainian phrase.
  items:
  - source: До́брий день!
    options:
    - text: Hello! / Good day!
      correct: true
    - text: Good morning!
      correct: false
    - text: Good evening!
      correct: false
    explanation: До́брий день is the neutral daytime greeting.
  - source: До́брого ра́нку!
    options:
    - text: Good morning!
      correct: true
    - text: Goodbye!
      correct: false
    - text: All the best!
      correct: false
    explanation: Ра́нок means morning, so До́брого ра́нку means Good morning.
  - source: До́брий ве́чір!
    options:
    - text: Good evening!
      correct: true
    - text: Good morning!
      correct: false
    - text: Fine.
      correct: false
    explanation: Ве́чір means evening, so До́брий ве́чір means Good evening.
  - source: До поба́чення!
    options:
    - text: Goodbye!
      correct: true
    - text: Hi!
      correct: false
    - text: How are you?
      correct: false
    explanation: До поба́чення is the standard farewell expression.
  - source: Чудо́во.
    options:
    - text: Great / wonderful.
      correct: true
    - text: Okay / normal.
      correct: false
    - text: Fine / good.
      correct: false
    explanation: 'Чудо́во expresses high enthusiasm: great or wonderful.'
  - source: Мене́ зва́ти А́нна.
    options:
    - text: My name is Anna.
      correct: true
    - text: What is your name?
      correct: false
    - text: Glad to see you.
      correct: false
    explanation: Мене́ зва́ти... is the formula for stating your name.
- id: act-3-wb-5
  type: group-sort
  title: Greetings vs Farewells and Responses
  instruction: Sort the phrases into Greetings or Farewells & Responses.
  groups:
  - label: Greetings (Віта́ння)
    items:
    - Приві́т!
    - До́брого ра́нку!
    - До́брий день!
    - До́брий ве́чір!
    - Ра́дий тебе́ ба́чити!
    - Ра́да тебе́ ба́чити!
  - label: Farewells & Responses (Проща́ння та ві́дповіді)
    items:
    - До поба́чення!
    - На все до́бре!
    - До́бре.
    - Чудо́во.
    - Норма́льно.
    - А у тебе́?
- id: act-3-wb-6
  type: fill-in
  title: Dialogue completion practice
  instruction: Select the phrase that accurately completes the dialogue.
  items:
  - sentence: — До́брий день! — До́брий ____!
    answer: день
    options:
    - день
    - ве́чір
    - ра́нок
    explanation: When someone greets you with 'До́брий день!', the standard response
      is 'До́брий день!'.
  - sentence: — Як спра́ви? — ____, дя́кую.
    answer: До́бре
    options:
    - До́бре
    - Приві́т
    - Зва́ти
    explanation: '''До́бре'' is a natural answer to ''Як спра́ви?''.'
  - sentence: — Як тебе́ зва́ти? — ____ зва́ти Марко́.
    answer: Мене́
    options:
    - Мене́
    - Тебе́
    - До́бре
    explanation: '''Мене́ зва́ти...'' means ''My name is...''.'
  - sentence: — Мене́ зва́ти Софі́я. А ____? — Мене́ зва́ти Марко́.
    answer: тебе́
    options:
    - тебе́
    - у тебе́
    - спра́ви
    explanation: In a name exchange, reciprocate with 'А тебе́?' (short for 'А тебе́
      як зва́ти?').
  - sentence: — До поба́чення! — На все ____!
    answer: до́бре
    options:
    - до́бре
    - ве́чір
    - чудо́во
    explanation: '''На все до́бре!'' is a warm farewell formula.'
  - sentence: 'Окса́на ка́же: «____ тебе́ ба́чити!»'
    answer: Ра́да
    options:
    - Ра́да
    - Ра́дий
    - До́бре
    explanation: Oksana is female, so she uses the feminine form 'Ра́да'.
