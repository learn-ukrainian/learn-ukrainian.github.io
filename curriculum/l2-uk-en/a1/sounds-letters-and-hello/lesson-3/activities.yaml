inline:
- id: act-301
  type: watch-and-repeat
  title: "Диві́ться та повто́рюйте: С, Н — Watch and repeat: С, Н"
  instruction: "Подиві́ться коро́тке ві́део про вимо́ву лі́тер (джерело́: А́нна Ого́йко / source: Anna Ohoiko, Ukrainian Lessons) та повторі́ть уго́лос. — Watch a short video on pronouncing the letters (source: Anna Ohoiko, Ukrainian Lessons) and repeat aloud."
  items:
  - letter: С
    video: https://www.youtube.com/watch?v=7UsFBgSL91E
    word: сон — sleep
    sound: '[с]'
    note: "Глухи́й свистя́чий при́голосний — Voiceless sibilant consonant."
  - letter: Н
    video: https://www.youtube.com/watch?v=vNUfiKHPYaU
    word: ніс — nose
    sound: '[н]'
    note: "Тверди́й носови́й сона́нт — Hard nasal sonorant."
  - letter: СА
    video: https://www.youtube.com/watch?v=7UsFBgSL91E
    word: сам — alone
    sound: '[са]'
    note: "Злиття́ зву́ків [с] та [а] — Syllable blend of [s] and [a]."
  - letter: СО
    video: https://www.youtube.com/watch?v=7UsFBgSL91E
    word: сом — catfish
    sound: '[со]'
    note: "Чи́сте окру́глене [о] пі́сля [с] — Pure rounded [o] after [s]."
  - letter: НА
    video: https://www.youtube.com/watch?v=vNUfiKHPYaU
    word: нас — us
    sound: '[на]'
    note: "Злиття́ зву́ків [н] та [а] — Syllable blend of [n] and [a]."
  - letter: НО
    video: https://www.youtube.com/watch?v=vNUfiKHPYaU
    word: сон — sleep
    sound: '[но]'
    note: "Злиття́ зву́ків [н] та [о] — Syllable blend of [n] and [o]."

- id: act-5
  type: match-up
  title: "Слова́ та зна́чення — Words and meanings"
  instruction: "З'єдна́йте украї́нське сло́во з йо́го англі́йським пере́кладом. — Match the Ukrainian word to its English translation."
  pairs:
  - left: "сон — sleep / dream"
    right: "сон (стан сну) — sleep (state of sleep)"
  - left: "сом — catfish"
    right: "сом (вели́ка ри́ба) — catfish (large fish)"
  - left: "сам — alone (m)"
    right: "сам (оди́н) — alone (by oneself)"
  - left: "лан — field"
    right: "лан (вели́ке по́ле) — field (large field)"
  - left: "оса́ — wasp"
    right: "оса́ (кома́ха) — wasp (insect)"
  - left: "сосна́ — pine tree"
    right: "сосна́ (де́рево) — pine tree (tree)"

- id: act-302
  type: quiz
  title: "Будо́ва скла́ду CVC та зву́ки — Syllable structure and sounds"
  instruction: "Обері́ть пра́вильну ві́дповідь. — Choose the correct answer."
  items:
  - prompt: "Що таке́ закри́тий склад в украї́нській мо́ві? — What is a closed syllable in Ukrainian?"
    options:
    - text: "Склад, що закі́нчується на при́голосний звук — A syllable that ends in a consonant sound"
      correct: true
    - text: "Склад без голосни́х зву́ків — A syllable that has no vowels"
      correct: false
    - text: "Склад, на яки́й па́дає на́голос — A syllable that is stressed"
      correct: false
    explanation: "Закри́тий склад закі́нчується на при́голосний звук (сон, лан). — A closed syllable ends with a consonant sound, such as сон or лан."
  - prompt: "Яке́ з цих слів склада́ється з одного́ закри́того скла́ду (CVC)? — Which of these words consists of a single closed syllable (CVC)?"
    options:
    - text: "сон — sleep"
      correct: true
    - text: "оса́ — wasp"
      correct: false
    - text: "ма́ма — mom"
      correct: false
    explanation: "Сло́во «сон» — це оди́н склад CVC (при́голосний [с] + голосни́й [о] + при́голосний [н]). — «Сон» is a single CVC syllable: consonant [s] + vowel [o] + consonant [n]."
  - prompt: "До яко́го ти́пу при́голосних нале́жить бу́ква С? — What phonetic type of consonant is the letter С?"
    options:
    - text: "Глухи́й свистя́чий при́голосний — A voiceless sibilant consonant"
      correct: true
    - text: "Носови́й соно́рний при́голосний — A nasal sonorant consonant"
      correct: false
    - text: "Дзвінки́й проривни́й при́голосний — A voiced plosive consonant"
      correct: false
    explanation: "Бу́ква С познача́є глухи́й свистя́чий звук [с]. — Letter С represents [s], a voiceless dental sibilant consonant."
  - prompt: "До яко́го ти́пу при́голосних нале́жить бу́ква Н? — What phonetic type of consonant is the letter Н?"
    options:
    - text: "Носови́й соно́рний при́голосний — A nasal sonorant consonant"
      correct: true
    - text: "Глухи́й свистя́чий при́голосний — A voiceless sibilant consonant"
      correct: false
    - text: "Окру́глений голосни́й звук — A rounded vowel sound"
      correct: false
    explanation: "Бу́ква Н познача́є носови́й сона́нт [н]. — Letter Н represents [n], an airflow-through-the-nose sonorant consonant."
  - prompt: "Як вимовля́ється ненаголо́шений [о] у сло́ві «сосна́»? — In the word «сосна́», how is the unstressed «о» pronounced?"
    options:
    - text: "Як чи́стий [о] без реду́кції до [а] — As a pure, clear [o] without reduction to [a]"
      correct: true
    - text: "Як звук [а] — As [a], with vowel reduction"
      correct: false
    - text: "Він зо́всім не вимовля́ється — It is completely silent"
      correct: false
    explanation: "В украї́нській мо́ві ненаголо́шений [о] за́вжди залиша́ється чи́стим [о]. — Ukrainian unstressed «о» is never reduced to «а»; it remains clean and rounded."
  - prompt: "Що означа́є вказівне́ сло́во «он»? — What does the pointing word «он» mean?"
    options:
    - text: "Он / ген там (пока́зує на предме́т) — There / over there (pointing out an object in view)"
      correct: true
    - text: "Тут (у руці́) — Here (in my hand)"
      correct: false
    - text: "До поба́чення — Goodbye"
      correct: false
    explanation: "Ча́стка «он» пока́зує на предме́т у по́лі зо́ру. — «Он» is a pointing particle meaning 'there / yonder'."

- id: act-303
  type: fill-in
  title: "Вста́вте пропу́щене сло́во — Fill in the missing word"
  instruction: "Обері́ть пра́вильне сло́во для ко́жного ре́чення. — Choose the correct word for each sentence."
  items:
  - sentence: "У рі́чці пла́ває вели́кий ___. — In the river swims a big ___."
    answer: сом
    options:
    - сом
    - сон
    - оса́
    explanation: "Сом — це ри́ба, яка́ живе́ у воді́. — Сом is a catfish living in water."
  - sentence: "Ти́хий нічни́й ___. — Quiet nightly ___."
    answer: сон
    options:
    - сон
    - сом
    - лан
    explanation: "Сон означа́є стан сну або́ сновиді́ння. — Сон means sleep or dream."
  - sentence: "Він стої́ть там ___. — He stands there ___."
    answer: сам
    options:
    - сам
    - сом
    - сон
    explanation: "Сам означа́є «само́тній» або́ «без і́нших». — Сам means alone or by oneself."
  - sentence: "Он золоти́й широ́кий ___. — Over there is a golden wide ___."
    answer: лан
    options:
    - лан
    - сон
    - сом
    explanation: "Лан означа́є вели́ке по́ле. — Лан means a wide field."
  - sentence: "Над кві́ткою лети́ть ___. — Above the flower flies a ___."
    answer: оса́
    options:
    - оса́
    - сосна́
    - ма́ма
    explanation: "Оса́ — це кома́ха, що літа́є. — Оса́ is a flying wasp."
  - sentence: "У лі́сі росте́ висо́ка ___. — In the forest grows a tall ___."
    answer: сосна́
    options:
    - сосна́
    - оса́
    - лан
    explanation: "Сосна́ — це хво́йне де́рево. — Сосна́ is a pine tree growing in the forest."

- id: act-304
  type: true-false
  title: "Пра́вда чи непра́вда? — True or false?"
  instruction: "Ви́значте, чи тве́рдження пра́вильне. — Decide whether each statement is true or false."
  items:
  - statement: "Бу́ква С познача́є глухи́й свистя́чий звук [с]. — Letter С represents the voiceless sibilant sound [s]."
    answer: true
    explanation: "С познача́є глухи́й свистя́чий звук [с]. — С corresponds to [s], a voiceless sibilant sound."
  - statement: "Сло́во «сосна́» ма́є два склади́: закри́тий [сос-] та відкри́тий [-на́]. — The word «сосна́» consists of two syllables: closed [сос-] and open [-на́]."
    answer: true
    explanation: "Сос-на́ ма́є два склади́ (CVC + CV). — Сос-на́ has two syllables: CVC + CV."
  - statement: "В украї́нській мо́ві ненаголо́шений [о] у сло́ві «сосна́» перетво́рюється на [а]. — In Ukrainian, unstressed «о» in «сосна́» turns into «а»."
    answer: false
    explanation: "В украї́нській мо́ві нема́є реду́кції [о] на [а]. — Ukrainian has no vowel reduction; unstressed [o] remains rounded and clear."
  - statement: "В украї́нській мо́ві сло́во «сон» означа́є нічне́ світи́ло на не́бі. — In Ukrainian, the word «сон» means the celestial body in the sky."
    answer: false
    explanation: "«Сон» означа́є стан сну; нічне́ світи́ло — це «мі́сяць». — «Сон» means sleep or dream; the moon is «мі́сяць»."
  - statement: "Сло́во «он» вжива́ється для вка́зування на предме́т удалині́. — The word «он» is used to point to something at a distance."
    answer: true
    explanation: "«Он» — це вказівна́ ча́стка. — «Он» is a pointing particle meaning 'yonder / over there'."
  - statement: "Бу́ква Н познача́є носови́й сона́нт [н]. — Letter Н represents a nasal sonorant sound [n]."
    answer: true
    explanation: "Н — це носови́й соно́рний при́голосний. — Н is a nasal sonorant [n]."

workbook:
