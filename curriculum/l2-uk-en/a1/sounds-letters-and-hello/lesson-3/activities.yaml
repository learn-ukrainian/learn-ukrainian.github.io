- id: act-307
  type: fill-in
  title: "Ре́чення зі слова́ми-помічника́ми — Sentences with helper words"
  instruction: "Вста́вте пра́вильне сло́во. — Fill in the correct word."
  items:
  - sentence: "___ сосна́ і лан. — ___ are a pine tree and a field."
    answer: Он
    options:
    - Он
    - Нам
    - Нас
    explanation: "«Он» вка́зує на об'є́кти в по́лі зо́ру. — «Он» points out objects in view."
  - sentence: "Він чека́є ___. — He waits for ___."
    answer: нас
    options:
    - нас
    - нам
    - он
    explanation: "«Чека́є нас» — waits for us."
  - sentence: "Він допомага́є ___. — He helps ___."
    answer: нам
    options:
    - нам
    - нас
    - он
    explanation: "«Допомага́є нам» — helps us."
  - sentence: "Он лети́ть ___. — Look, a ___ is flying."
    answer: оса́
    options:
    - оса́
    - лан
    - сом
    explanation: "«Лети́ть оса́» — the wasp is flying."
  - sentence: "Он пливе́ ___. — Look, a ___ is swimming."
    answer: сом
    options:
    - сом
    - сон
    - лан
    explanation: "«Пливе́ сом» — the catfish is swimming."
  - sentence: "Це мій спокі́йний ___. — This is my peaceful ___."
    answer: сон
    options:
    - сон
    - сом
    - сам
    explanation: "«Спокі́йний сон» — peaceful sleep."

- id: act-308
  type: error-correction
  title: "Ви́правте поми́лку у сло́ві — Correct the spelling mistake"
  instruction: "Знайді́ть поми́лку у ви́діленому сло́ві та ви́беріть пра́вильний варіа́нт. — Find the error in the underlined word and choose the correct form."
  items:
  - sentence: "У лі́сі росте́ сасна́. — A pine tree grows in the forest."
    error: сасна́
    answer: сосна́
    options:
    - сосна́
    - сасна́
    - сусна́
    explanation: "В украї́нській мо́ві ненаголо́шений [о] залиша́ється чи́стим [о] у сло́ві сосна́. — Unstressed o remains clear in сосна́ without reduction."
  - sentence: "У рі́чці пла́ває вели́кий сон. — A large dream swims in the river."
    error: сон
    answer: сом
    options:
    - сом
    - сон
    - сам
    explanation: "Ри́ба — це сом, а не сон. — The fish is сом (catfish), not сон (dream)."
  - sentence: "Він стої́ть там сом. — He stands there catfish."
    error: сом
    answer: сам
    options:
    - сам
    - сом
    - сон
    explanation: "Само́тньо — це сам. — Alone / by oneself is сам."
  - sentence: "Он зеле́ний лон. — Over there is a green lon."
    error: лон
    answer: лан
    options:
    - лан
    - лон
    - лун
    explanation: "По́ле — це лан, а не лон. — The field is лан, not лон."
  - sentence: "Он лети́ть аса́. — Look, an asa is flying."
    error: аса́
    answer: оса́
    options:
    - оса́
    - аса́
    - уса́
    explanation: "Кома́ха — це оса́. — The wasp is оса́."
  - sentence: "Він кли́че нос. — He calls nos."
    error: нос
    answer: нас
    options:
    - нас
    - нос
    - ніс
    explanation: "Він кли́че нас. — He calls us is «нас»."

