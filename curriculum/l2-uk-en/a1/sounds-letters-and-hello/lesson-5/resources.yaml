- title: Заболо́тний 5 клас, с. 86
  role: textbook
  chunk_id: 5-klas-ukrmova-zabolotnyi-2023_s0062
  notes: «Зву́ки ми чу́ємо й вимовля́ємо, а бу́кви ба́чимо й пи́шемо.» 33 бу́кви в украї́нському
    алфаві́ті.
- title: Авра́менко 5 клас, с. 73
  role: textbook
  chunk_id: 5-klas-ukrmova-avramenko-2022_s0074
  notes: 38 зву́ків (6 голосни́х і 32 при́голосних); зву́ки мо́ви вивча́є фоне́тика; проривни́й
    звук [ґ] та горта́нний [г].
- title: Вашуленко 2 клас, с. 6
  role: textbook
  chunk_id: 2-klas-ukrmova-vashulenko-2019-1_s0004
  notes: Бу́кви ми ба́чимо, чита́ємо і пи́шемо. Поя́снення, чому́ непра́вильно каза́ти «голосні́
    бу́кви».
- title: Кравцо́ва 4 клас, с. 5
  role: textbook
  chunk_id: 4-klas-ukrayinska-mova-kravtsova-2021-1_s0003
  notes: Дзвінкі́ при́голосні зву́ки в кінці́ слова́ та скла́ду пере́д глухи́м вимовля́ємо
    дзві́нко.
- title: Большако́ва, буква́р 1 клас, с. 24
  role: textbook
  chunk_id: 1-klas-bukvar-bolshakova-2018-1_s0023
  notes: 'Голосні́ зву́ки утво́рюються лише́ за допомо́гою го́лосу: «Ле́гко вимовля́ються,
    ве́село співа́ються!»'
