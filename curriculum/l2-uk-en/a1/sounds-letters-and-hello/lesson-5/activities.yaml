- id: act-w504
  type: quiz
  title: Phonics and pronunciation safety check
  instruction: Choose the safer habit for Ukrainian pronunciation and orthography.
  items:
  - prompt: How should you pronounce unstressed о in the word молоко́?
    options:
    - text: Three clear, rounded [о] sounds, never turning into [а]
      correct: true
    - text: The first two should blur into a weak [а]
      correct: false
    - text: Silent [о] before consonants
      correct: false
    explanation: Ukrainian maintains pure unstressed [о].
  - prompt: What is the key difference between [и] and [і]?
    options:
    - text: '[и] is a relaxed, open vowel; [і] is a high, smiling vowel'
      correct: true
    - text: '[и] is only found in foreign borrowings'
      correct: false
    - text: '[і] is silent after soft consonants'
      correct: false
    explanation: Ukrainian distinguishes relaxed [и] from smiling [і].
  - prompt: Why does Ukrainian have 38 sounds but only 33 letters?
    options:
    - text: Some letters represent two sounds, some consonants have soft pairs, and
        ь has no sound
      correct: true
    - text: Five letters are never used in modern speech
      correct: false
    - text: Ukrainian borrowed extra sounds without making letters
      correct: false
    explanation: Letters and sounds are distinct; multiple phonetic realities map
      to 33 letters.
  - prompt: What should you do with voiced consonants at the end of words like сад
      or дуб?
    options:
    - text: Keep them voiced to the very end
      correct: true
    - text: Devoice them into [сат] and [дуп]
      correct: false
    - text: Drop the final consonant
      correct: false
    explanation: Ukrainian literary pronunciation does not devoice final voiced consonants.
  - prompt: What is the function of the soft sign (ь) in the word день?
    options:
    - text: It softens the preceding consonant [н] and adds no vowel
      correct: true
    - text: It adds a tiny extra syllable
      correct: false
    - text: It makes the word plural
      correct: false
    explanation: ь has no independent sound; it only softens the consonant before
      it.
  - prompt: Which reciprocal question is appropriate after «Як тебе́ зва́ти?»?
    options:
    - text: А тебе́?
      correct: true
    - text: А у тебе́?
      correct: false
    - text: А про тебе́?
      correct: false
    explanation: Use «А тебе́?» for names, and «А у тебе́?» for state/wellbeing.
- id: act-w505
  type: true-false
  title: Comprehensive module facts
  instruction: Choose true or false for each statement.
  items:
  - statement: Every Ukrainian syllable (склад) must contain a vowel sound.
    correct: true
    explanation: Vowels give syllables their voice.
  - statement: In Ukrainian, the alphabet order starts with А and ends with Я.
    correct: true
    explanation: А is the first letter; Я is the 33rd letter.
  - statement: The phrase «На все до́бре!» is used when greeting someone in the morning.
    correct: false
    explanation: «На все до́бре!» is a farewell phrase meaning "All the best!".
  - statement: 'Ukrainian has six basic vowel sounds: [а], [о], [у], [е], [и], [і].'
    correct: true
    explanation: These are the six vowel sounds of Ukrainian.
  - statement: The word Приві́т has four consonant sounds and two vowel sounds.
    correct: true
    explanation: 'П-р-и-в-і-т: four consonants ([п], [р], [в], [т]) and two vowels
      ([и], [і]).'
  - statement: You can use «Приві́т!» in any formal business meeting without hesitation.
    correct: false
    explanation: Приві́т is informal; use «До́брий день!» in neutral or formal situations.
