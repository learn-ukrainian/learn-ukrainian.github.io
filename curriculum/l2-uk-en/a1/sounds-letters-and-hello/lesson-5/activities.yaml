inline:
- id: act-501
  type: quiz
  title: Sound, letter, or syllable?
  instruction: Choose the correct answer.
  items:
  - prompt: What is a звук in Ukrainian phonetics?
    options:
    - text: A sound that we hear and speak
      correct: true
    - text: A letter that we see and write
      correct: false
    - text: A punctuation mark
      correct: false
    explanation: A звук belongs to hearing and speaking.
  - prompt: What is a лі́тера?
    options:
    - text: A letter that we see and write
      correct: true
    - text: A spoken sound
      correct: false
    - text: A syllable unit
      correct: false
    explanation: A лі́тера is a visual symbol for a sound.
  - prompt: How many letters and sounds are in standard Ukrainian?
    options:
    - text: 33 letters and 38 sounds
      correct: true
    - text: 38 letters and 33 sounds
      correct: false
    - text: 33 letters and 33 sounds
      correct: false
    explanation: The alphabet has 33 letters, while speech uses 38 sounds.
  - prompt: Can we say «голосна́ лі́тера»?
    options:
    - text: No, sounds are vowels or consonants; letters only mark them
      correct: true
    - text: Yes, letters are vowels themselves
      correct: false
    - text: Only in cursive script
      correct: false
    explanation: Sounds are голосні́ or при́голосні. Letters merely represent them.
  - prompt: What must every Ukrainian склад (syllable) contain?
    options:
    - text: A vowel sound
      correct: true
    - text: An apostrophe
      correct: false
    - text: A soft sign
      correct: false
    explanation: Every syllable is built around a vowel sound.
  - prompt: What does the soft sign (ь) do in Ukrainian?
    options:
    - text: It has no sound of its own and softens the preceding consonant
      correct: true
    - text: It adds an extra vowel sound
      correct: false
    - text: It lengthens the word
      correct: false
    explanation: М'яки́й знак has no voice of its own and only softens the preceding
      consonant.
- id: act-502
  type: match-up
  title: Everyday greetings and phrases
  instruction: Match each Ukrainian phrase with its communicative use.
  pairs:
  - left: Приві́т!
    right: Informal "Hi!" for friends and family
  - left: До́брий день!
    right: Neutral "Hello! / Good day!" for daytime
  - left: До́брого ра́нку!
    right: '"Good morning!" for morning hours'
  - left: До́брий ве́чір!
    right: '"Good evening!" for evening hours'
  - left: До поба́чення!
    right: Standard "Goodbye!" when leaving
  - left: На все до́бре!
    right: Warm "All the best!" friendly parting
- id: act-503
  type: fill-in
  title: Completing conversational exchanges
  instruction: Choose the correct word or phrase to complete each line.
  items:
  - sentence: — Приві́т! Як ____?
    answer: спра́ви
    options:
    - спра́ви
    - лі́тери
    - зву́ки
  - sentence: — ____! А у тебе́?
    answer: До́бре
    options:
    - До́бре
    - Дім
    - Сон
  - sentence: — Як тебе́ ____?
    answer: зва́ти
    options:
    - зва́ти
    - ма́ма
    - та́то
  - sentence: — ____ зва́ти Софі́я. А тебе́?
    answer: Мене́
    options:
    - Мене́
    - Тебе́
    - О́ко
  - sentence: — До ____, Ма́рку!
    answer: поба́чення
    options:
    - поба́чення
    - ра́нку
    - ве́чора
  - sentence: — На все ____, Софі́є!
    answer: до́бре
    options:
    - до́бре
    - день
    - звук
- id: act-504
  type: group-sort
  title: Vowel sounds and consonant sounds
  instruction: Sort each sound into vowels or consonants.
  groups:
  - label: Голосні́ зву́ки (Vowel sounds)
    items:
    - '[а]'
    - '[о]'
    - '[у]'
    - '[е]'
  - label: При́голосні зву́ки (Consonant sounds)
    items:
    - '[п]'
    - '[м]'
    - '[т]'
    - '[к]'
- id: act-505
  type: true-false
  title: Final phonetic and language check
  instruction: Choose true or false for each statement.
  items:
  - statement: In Ukrainian, unstressed [о] in молоко́ stays clean and round, never
      blurring into [а].
    correct: true
    explanation: Ukrainian maintains pure unstressed [о] without vowel reduction.
  - statement: The letters И and І represent the exact same sound in Ukrainian.
    correct: false
    explanation: И represents relaxed [и], while І represents smiling, narrow [і].
  - statement: Ukrainian voiced consonants at the end of words should not be devoiced.
    correct: true
    explanation: Keep final voiced consonants voiced in standard Ukrainian (e.g. дуб,
      сад, гриб).
  - statement: Ukrainian stress (на́голос) can sometimes distinguish word meaning,
      as in за́мок vs замо́к.
    correct: true
    explanation: Ukrainian stress is free and mobile, and it distinguishes words.
  - statement: The letter Ґ is a soft h-like sound, while Г is a hard explosive g.
    correct: false
    explanation: Г is the h-like sound [ɦ], while Ґ is the hard explosive [g].
  - statement: A female speaker says «Ра́да тебе́ ба́чити», while a male speaker says
      «Ра́дий тебе́ ба́чити».
    correct: true
    explanation: Ukrainian adjective and past-tense forms reflect the speaker's gender.
workbook:
- id: act-9
  type: translate
  title: Phrase meanings
  instruction: Choose the English meaning.
  items:
  - source: Приві́т!
    options:
    - text: Hi!
      correct: true
    - text: Goodbye!
      correct: false
    - text: What is your name?
      correct: false
    explanation: Приві́т is the informal everyday greeting.
  - source: До́брий день!
    options:
    - text: Hello! / Good day!
      correct: true
    - text: Milk!
      correct: false
    - text: And you?
      correct: false
    explanation: До́брий день is the neutral daytime greeting.
  - source: До́брого ра́нку!
    options:
    - text: Good morning!
      correct: true
    - text: Good evening!
      correct: false
    - text: My name is Anna.  # source: ULP
      correct: false
    explanation: Ра́нок means morning, so До́брого ра́нку is Good morning.
  - source: До́брий ве́чір!
    options:
    - text: Good evening!
      correct: true
    - text: Good morning!
      correct: false
    - text: Fine.
      correct: false
    explanation: Ве́чір means evening, so До́брий ве́чір is Good evening.
  - source: Як спра́ви?
    options:
    - text: How are you?
      correct: true
    - text: Goodbye!
      correct: false
    - text: Letter
      correct: false
    explanation: Як спра́ви? asks how someone is doing.
  - source: До поба́чення!
    options:
    - text: Goodbye!
      correct: true
    - text: Hi!
      correct: false
    - text: Sound
      correct: false
    explanation: До поба́чення is the leaving phrase Goodbye.
  - source: Ра́да тебе́ ба́чити.
    options:
    - text: Glad to see you. (female speaker)
      correct: true
    - text: What is your name?
      correct: false
    - text: Good evening!
      correct: false
    explanation: Ра́да is the form a female speaker uses in this phrase.
- id: act-10
  type: error-correction
  title: Pronunciation traps
  instruction: Choose the safer Ukrainian habit.
  items:
  - sentence: Do not call А, О, У голосни́ми лі́терами.
    error: голосни́ми лі́терами
    correction: лі́терами, що познача́ють голосні́ зву́ки
    options:
    - лі́терами, що познача́ють голосні́ зву́ки
    - при́голосними лі́терами
    explanation: 'Safer habit: sounds are голосні́ or при́голосні. Letters represent
      sounds, so call А, О, У letters that mark vowel sounds.'
  - sentence: Do not say м[а]ло́ко for молоко́.
    error: м[а]ло́ко
    correction: молоко́
    options:
    - молоко́
    - ка́ва
    - молоко
    explanation: 'Safer habit: keep Ukrainian о clean. Say молоко́ with three clear
      о sounds: мо-ло-ко.'
  - sentence: Do not add a tiny sound after день.
    error: add a tiny sound after день
    correction: soften н, then stop
    options:
    - soften н, then stop
    - add і after нь
    explanation: 'Safer habit: ь has no sound of its own. In день, soften н and stop;
      do not add a tiny vowel after it.'
  - sentence: Do not treat Ї as a softening letter.
    error: treat Ї as a softening letter
    correction: read Ї as [йі]
    options:
    - read Ї as [йі]
    - read Ї as plain [і]
    explanation: 'Safer habit: Ї is not a softening letter. Read it as [йі] every
      time.'
  - sentence: Do not make one fixed glad phrase for every speaker.
    error: one fixed glad phrase
    correction: Ра́дий тебе́ ба́чити / Ра́да тебе́ ба́чити
    options:
    - Ра́дий тебе́ ба́чити / Ра́да тебе́ ба́чити
    - Ра́дий тебе́ ба́чити for everyone
    explanation: 'Safer habit: match the phrase to the speaker. A male speaker says
      Ра́дий тебе́ ба́чити; a female speaker says Ра́да тебе́ ба́чити.'
