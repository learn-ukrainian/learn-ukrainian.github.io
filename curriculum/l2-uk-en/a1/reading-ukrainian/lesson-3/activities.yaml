inline:
- id: act-3
  type: divide-words
  title: "Поділі́ть слова́ на склади́ — Divide words into syllables"
  instruction: "Введі́ть сло́во, розділи́вши його́ на склади́ че́рез пробі́л."
  items:
  - word: та́то
    answer: та́ то
  - word: па́ста
    answer: па́с та
  - word: ка́рта
    answer: ка́р та
  - word: гора́
    answer: го ра́
  - word: горо́д
    answer: го ро́д
  - word: поті́к
    answer: по ті́к

- id: act-221
  type: watch-and-repeat
  title: "Диві́ться та повто́рюйте: Бу́кви П, Т, Г, Ґ — Watch and repeat: Letters П, Т, Г, Ґ"
  instruction: "Подиві́ться коро́тке ві́део про вимо́ву лі́тери (джерело́: А́нна Ого́йко / source: Anna Ohoiko, Ukrainian Lessons) та повторі́ть уго́лос."
  items:
  - letter: П
    word: парк
    video: https://www.youtube.com/watch?v=JksSjjxyW5Y
  - letter: Т
    word: торт
    video: https://www.youtube.com/watch?v=m-jcLR_gK0k
  - letter: Г
    word: гора́
    video: https://www.youtube.com/watch?v=gVnclpSI0DU
  - letter: Ґ
    word: ґа́ва
    video: https://www.youtube.com/watch?v=gNjHqjTW9WQ
  - letter: Б
    word: брат
    video: https://www.youtube.com/watch?v=V1hxBE_JbGg
  - letter: Д
    word: друг
    video: https://www.youtube.com/watch?v=g4Bh-lqzd48

- id: act-222
  type: count-syllables
  title: "Раху́йте склади́: Геогра́фія та побу́т — Count syllables: Geography and everyday life"
  instruction: "Пораху́йте голосні́ зву́ки у сло́ві. Кі́лькість голосни́х дорі́внює кі́лькості складів."
  maxCount: 5
  items:
  - word: парк
    correct: 1
  - word: торт
    correct: 1
  - word: та́то
    correct: 2
  - word: гора́
    correct: 2
  - word: Дніпро́
    correct: 2
  - word: Полта́ва
    correct: 3

- id: act-223
  type: match-up
  title: "Зна́чення слів: Мініма́льні па́ри — Word meanings: Minimal pairs"
  instruction: "З'єдна́йте украї́нське сло́во з його́ зна́ченням."
  pairs:
  - left: кит
    right: whale
  - left: кіт
    right: cat
  - left: та́то
    right: dad / father
  - left: брат
    right: brother
  - left: друг
    right: friend
  - left: гриб
    right: mushroom

workbook:
- id: act-w3
  type: true-false
  title: "Пра́вда чи непра́вда: Бу́кви П, Т, Г, Ґ — True or False: Letters П, Т, Г, Ґ"
  instruction: "Ви́значте, чи є тве́рдження пра́вильним."
  items:
  - statement: "Бу́ква Г познача́є фаринга́льний щіли́нний звук [ɦ]."
    correct: true
    explanation: "Украї́нський звук [г] утво́рюється гли́боко в горта́ні."
  - statement: "Бу́ква Ґ познача́є вибухови́й задньоязико́вий звук [ɡ]."
    correct: true
    explanation: "Бу́ква Ґ вимовля́ється як вибухови́й звук [ɡ] у сло́ві «ґа́ва»."
  - statement: "Слова́ «кит» і «кіт» означа́ють одне́ й те са́ме."
    correct: false
    explanation: "«Кит» — це whale, а «кіт» — це cat."
  - statement: "У сло́ві «Полта́ва» три склади́."
    correct: true
    explanation: "У сло́ві «Полта́ва» три голосни́х зву́ки, то́му три склади́."
  - statement: "Бу́ква П є дзвінки́м зву́ком."
    correct: false
    explanation: "Бу́ква П познача́є глухи́й проривни́й звук."
  - statement: "Сло́во «ґрунт» ма́є оди́н склад."
    correct: true
    explanation: "У сло́ві «ґрунт» оди́н голосни́й [у], отже́ оди́н склад."

- id: act-w221
  type: quiz
  title: "Факти про зву́ки П, Т, Г, Ґ — Facts about sounds П, Т, Г, Ґ"
  instruction: "Обері́ть одну́ прави́льну ві́дповідь."
  items:
  - prompt: "Яка́ бу́ква є глухо́ю па́рою до Б?"
    options:
    - text: "Бу́ква П"
      correct: true
    - text: "Бу́ква Т"
      correct: false
    - text: "Бу́ква К"
      correct: false
    explanation: "Глухи́й парний звук до [б] — це [п]."
  - prompt: "Чим відрізня́ються бу́кви Г і Ґ?"
    options:
    - text: "Г — фаринга́льний щіли́нний [ɦ], а Ґ — вибухови́й [ɡ]"
      correct: true
    - text: "Г — це голосни́й, а Ґ — при́голосний"
      correct: false
    - text: "Між ни́ми нема́є жо́дної різни́ці"
      correct: false
    explanation: "Г вимовля́ється гли́боко й м'я́ко [ɦ], а Ґ — вибухо́во [ɡ]."
  - prompt: "Скі́льки складів у на́зві мі́ста «Дніпро́»?"
    options:
    - text: "Два склади́: Дні-про́"
      correct: true
    - text: "Оди́н склад"
      correct: false
    - text: "Три склади́"
      correct: false
    explanation: "У сло́ві «Дніпро́» два голосни́х [і] та [о], отже́ два склади́."
  - prompt: "Що означа́є сло́во «ґа́ва»?"
    options:
    - text: "Crow (птах)"
      correct: true
    - text: "Coffee (напі́й)"
      correct: false
    - text: "Mountain (гора́)"
      correct: false
    explanation: "«Ґа́ва» — це птах (crow); не плу́тайте з ка́вою."
  - prompt: "Яке́ сло́во ма́є закри́тий склад?"
    options:
    - text: "парк"
      correct: true
    - text: "гора́"
      correct: false
    - text: "вода́"
      correct: false
    explanation: "Сло́во «парк» закінчу́ється на при́голосний і є закри́тим скла́дом."
  - prompt: "Що означа́є ви́раз «Вона́ ра́да»?"
    options:
    - text: "She is glad"
      correct: true
    - text: "She is at home"
      correct: false
    - text: "She is alone"
      correct: false
    explanation: "«Ра́да» — це коро́тка фо́рма ста́ну (glad)."

- id: act-w222
  type: group-sort
  title: "Розподілі́ть слова́ за початко́вою бу́квою — Sort words by initial letter"
  instruction: "Розподілі́ть слова́ за початко́вим при́голосним."
  groups:
  - name: "Слова́ на бу́кву П"
    items:
    - парк
    - па́ста
    - поті́к
  - name: "Слова́ на бу́кву Т"
    items:
    - та́то
    - торт
  - name: "Слова́ на бу́кву Г"
    items:
    - гора́
    - горо́д
    - гриб

- id: act-w223
  type: odd-one-out
  title: "За́йве сло́во за звуково́ю будо́вою — Odd word out"
  instruction: "Знайді́ть за́йве сло́во в ко́жному рядку́."
  items:
  - words:
    - гора́
    - горо́д
    - гриб
    - ґа́ва
    correct: 3
    explanation: "Сло́во «ґа́ва» почина́ється з лі́тери Ґ, а ре́шта — з Г."
  - words:
    - та́то
    - па́ста
    - ка́рта
    - торт
    correct: 3
    explanation: "Сло́во «торт» односкладо́ве, а ре́шта — двоскладо́ві."
  - words:
    - Дніпро́
    - Полта́ва
    - парк
    - брат
    correct: 1
    explanation: "Сло́во «Полта́ва» має три склади́, а ре́шта — один або́ два."
  - words:
    - кит
    - кіт
    - гриб
    - гора́
    correct: 3
    explanation: "Сло́во «гора́» двоскладо́ве, а ре́шта слів — односкладо́ві."
  - words:
    - брат
    - друг
    - та́то
    - ґрунт
    correct: 2
    explanation: "Сло́во «та́то» двоскладо́ве, а ре́шта слів мають по одному́ скла́ду."
  - words:
    - поті́к
    - па́ста
    - парк
    - та́то
    correct: 3
    explanation: "Сло́во «та́то» почина́ється з Т, а ре́шта слів — з П."

- id: act-w224
  type: fill-in
  title: "Вста́вте пропу́щену лі́теру — Fill in the missing letter"
  instruction: "Обері́ть прави́льну лі́теру на мі́сці про́пуску ___ ."
  items:
  - sentence: "Тут ___а́то."
    options:
    - т
    - п
    - г
    answer: т
    explanation: "Сло́во «та́то» почина́ється з лі́тери т."
  - sentence: "Он ___арк."
    options:
    - п
    - т
    - б
    answer: п
    explanation: "Сло́во «парк» почина́ється з лі́тери п."
  - sentence: "Он ___ора́."
    options:
    - г
    - ґ
    - к
    answer: г
    explanation: "Сло́во «гора́» почина́ється з лі́тери г."
  - sentence: "Он ___а́ва."
    options:
    - ґ
    - г
    - к
    answer: ґ
    explanation: "Сло́во «ґа́ва» (crow) пи́шеться з лі́терою ґ."
  - sentence: "Он ___ніпро́."
    options:
    - д
    - т
    - п
    answer: д
    explanation: "Сло́во «Дніпро́» почина́ється з лі́тери д."
  - sentence: "Вона́ ___а́да."
    options:
    - р
    - п
    - т
    answer: р
    explanation: "Сло́во «ра́да» почина́ється з лі́тери р."

- id: act-w225
  type: unjumble
  title: "Склади́ сло́во з лі́тер — Unjumble the word"
  instruction: "Поста́вте лі́тери в прави́льному поря́дку, щоб утвори́ти сло́во."
  items:
  - letters:
    - п
    - а
    - р
    - к
    answer: парк
  - letters:
    - т
    - о
    - р
    - т
    answer: торт
  - letters:
    - б
    - р
    - а
    - т
    answer: брат
  - letters:
    - д
    - р
    - у
    - г
    answer: друг
  - letters:
    - к
    - і
    - т
    answer: кіт
  - letters:
    - к
    - и
    - т
    answer: кит
