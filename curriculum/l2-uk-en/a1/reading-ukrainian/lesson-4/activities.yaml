inline:
- id: act-4
  type: error-correction
  title: "Па́стки чита́ння: Безпе́чні украї́нські зви́чки — Reading traps: Safer Ukrainian habits"
  instruction: "Знайді́ть і ви́правте поми́лку в ко́жному ре́ченні. — Find and fix the error in each sentence."
  items:
  - sentence: "Он се́ло. — Over there is a village."
    error: "се́ло"
    answer: "село́ (village)"
    options:
    - "село́ (village)"
    - "се́ло (village)"
    explanation: "У сло́ві «село́» на́голос па́дає на дру́гий склад: се-ло́. Наголо́шувати пе́рший склад («се́ло») — помилко́вий на́голос. — In the word «село́» the stress falls on the second syllable: се-ло́. Stressing the first syllable («се́ло») is a misplaced stress."
  - sentence: "Он наш дуп. — Over there is our oak."
    error: "дуп"
    answer: "дуб (oak)"
    options:
    - "дуб (oak)"
    - "дуп (oak)"
    explanation: "В украї́нській мо́ві кінце́ве «б» у сло́ві «дуб» звучи́ть як [б], а не [п]; написа́ння «дуп» із лі́терою «п» — поми́лка. — In Ukrainian, final «б» in «дуб» sounds like «б», not «п»; writing «дуп» with letter «п» is misspelled."
  - sentence: "Он ка́са. — Over there is porridge."
    error: "ка́са"
    answer: "ка́ша (porridge)"
    options:
    - "ка́ша (porridge)"
    - "ка́са (cash register)"
    explanation: "У сло́ві «ка́ша» (porridge) звучи́ть тверди́й звук [ш], а не [с] («ка́са» означа́є cash register). — In «ка́ша» (porridge) we use the firm \"sh\" sound [ш], not [с] («ка́са» means cash register)."
  - sentence: "Он ха́та і дім. — Over there is a cottage and smoke."
    error: "дім"
    answer: "дим (smoke)"
    options:
    - "дим (smoke)"
    - "дім (house)"
    explanation: "«Ха́та і дим»: «дим» — це smoke з розсла́бленим [и], а «дім» — це house з посмі́хненим [і]. — «Ха́та і дим»: «дим» is smoke with relaxed \"ih\" [и], while «дім» is house with smiling \"ee\" [і]."
  - sentence: "При́віт! Он наш дім. — Hi! Over there is our house."
    error: "При́віт"
    answer: "Приві́т (Hi!)"
    options:
    - "Приві́т (Hi!)"
    - "При́віт (Hi!)"
    explanation: "У віта́нні «Приві́т!» на́голос па́дає на дру́гий склад: При-ві́т! Наголо́шувати пе́рший склад («При́віт») — помилко́вий на́голос. — In the greeting «Приві́т!» the stress is on the second syllable: При-ві́т! Stressing the first syllable («При́віт») is a misplaced stress."
  - sentence: "Доброго́ ра́нку! — Good morning!"
    error: "Доброго́"
    answer: "До́брого (Good)"
    options:
    - "До́брого (Good)"
    - "Доброго́ (Good)"
    explanation: "У сло́ві «До́брого» на́голос па́дає на пе́рший склад: До́б-ро-го. Наголо́шувати оста́нній склад («Доброго́») — помилко́вий на́голос. — In «До́брого» the stress is on the first syllable: До́б-ро-го. Stressing the final syllable («Доброго́») is a misplaced stress."

- id: act-231
  type: watch-and-repeat
  title: "Диві́ться та повто́рюйте: Бу́кви Е, З, Ж, Ш, Х — Watch and repeat: Letters Е, З, Ж, Ш, Х"
  instruction: "Подиві́ться коро́тке ві́део про вимо́ву лі́тери (джерело́: А́нна Ого́йко / source: Anna Ohoiko, Ukrainian Lessons) та повторі́ть уго́лос. — Watch a short video on pronouncing the letter (source: Anna Ohoiko, Ukrainian Lessons) and repeat aloud."
  items:
  - letter: Е
    word: "леле́ка — stork"
    video: https://www.youtube.com/watch?v=KFlsroBW0dk
  - letter: З
    word: "зуб — tooth"
    video: https://www.youtube.com/watch?v=BhASNxitC1A
  - letter: Ж
    word: "жа́ба — frog"
    video: https://www.youtube.com/watch?v=dIrGVcqPwqM
  - letter: Ш
    word: "шко́ла — school"
    video: https://www.youtube.com/watch?v=1D-6MIw3OXY
  - letter: Х
    word: "хліб — bread"
    video: https://www.youtube.com/watch?v=vpr58zJSJKc
  - letter: С
    word: "село́ — village"
    video: https://www.youtube.com/watch?v=7UsFBgSL91E

- id: act-232
  type: divide-words
  title: "Поділі́ть слова́ на склади́ — Divide words into syllables"
  instruction: "Введі́ть сло́во, розділи́вши його́ на склади́ (уда́ри сло́ва) че́рез пробі́л. — Enter the word divided into syllables with a space."
  items:
  - word: леле́ка
    answer: "ле ле́ ка"
    hint: "леле́ка — stork"
  - word: жа́ба
    answer: "жа́ ба"
    hint: "жа́ба — frog"
  - word: ка́ша
    answer: "ка́ ша"
    hint: "ка́ша — porridge"
  - word: ти́ша
    answer: "ти́ ша"
    hint: "ти́ша — quiet / silence"
  - word: ха́та
    answer: "ха́ та"
    hint: "ха́та — house / cottage"
  - word: шко́ла
    answer: "шко́ ла"
    hint: "шко́ла — school"

- id: act-233
  type: match-up
  title: "Зна́чення слів та віта́нь — Meanings of words and greetings"
  instruction: "З'єдна́йте украї́нське сло́во або́ віта́ння з його́ перекла́дом. — Match the Ukrainian word or greeting with its translation."
  pairs:
  - left: "Приві́т!"
    right: "Hi! / Hello! (informal)"
  - left: "До́брого ра́нку!"
    right: "Good morning! (universal morning greeting)"
  - left: "ха́та"
    right: "traditional house / cottage"
  - left: "шко́ла"
    right: "school"
  - left: "ка́ша"
    right: "porridge"
  - left: "хліб"
    right: "bread"

