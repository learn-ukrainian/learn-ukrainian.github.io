- id: act-w231
  type: quiz
  title: "Факти про бу́кви Е, З, Ж, Ш, Х — Facts about letters Е, З, Ж, Ш, Х"
  instruction: "Обері́ть одну́ прави́льну ві́дповідь. — Choose the one correct answer."
  items:
  - prompt: "Яка́ особли́вість украї́нських зву́ків Ж та Ш у слова́х цьо́го уро́ку? — How are Ukrainian Ж and Ш pronounced in this lesson's words?"
    options:
    - text: "Вони́ лиша́ються тверди́ми: «zh» і «sh» (не пом'я́кшуються) — They stay hard: “zh” and “sh” (do not go soft)"
      correct: true
    - text: "Вони́ за́вжди м'які́ — They are always soft"
      correct: false
    - text: "Вони́ вимовля́ються як голосні́ — They are pronounced as vowels"
      correct: false
    explanation: "У прикла́дах цьо́го уро́ку (жа́ба, ка́ша, ти́ша, шко́ла) ж і ш лиша́ються тверди́ми «zh» та «sh». — In this lesson's examples (жа́ба, ка́ша, ти́ша, шко́ла), ж and ш stay hard “zh” and “sh”."
  - prompt: "Скі́льки складів (уда́рів) у сло́ві «Приві́т»? — How many syllables (beats) does «Приві́т» have?"
    options:
    - text: "Два склади́: При-ві́т — Two beats / syllables: При-ві́т"
      correct: true
    - text: "Оди́н склад — One beat / syllable"
      correct: false
    - text: "Три склади́ — Three beats / syllables"
      correct: false
    explanation: "Раху́ємо голосні́: [и] та [і] — два голосни́х, отже́ два склади́ (уда́ри): При-ві́т. — Count the vowels: [и] and [і] — two vowels mean two beats (syllables): При-ві́т."
  - prompt: "Як звучи́ть кінце́вий звук у сло́ві «хліб»? — How does the final sound in «хліб» sound?"
    options:
    - text: "Звучи́ть як [б], а не [п] — Sounds like [б], not [п]"
      correct: true
    - text: "Звучи́ть глу́хо як [п] — Sounds voiceless like [п]"
      correct: false
    - text: "Не вимовля́ється вза́галі — Is not pronounced at all"
      correct: false
    explanation: "Кінце́вий звук «б» у сло́ві «хліб» (як і в «дуб») звучи́ть чі́тко як [б], а не [п]. — Final «б» in «хліб» (just like in «дуб») still sounds like «б», not «п»."
  - prompt: "Скі́льки складів у сло́ві «леле́ка»? — How many syllables (beats) does «леле́ка» have?"
    options:
    - text: "Три склади́: ле-ле́-ка — Three beats / syllables: ле-ле́-ка"
      correct: true
    - text: "Два склади́ — Two beats / syllables"
      correct: false
    - text: "Чоти́ри склади́ — Four beats / syllables"
      correct: false
    explanation: "Раху́ємо голосні́: е, е, а — три голосни́х, то́му три уда́ри (склади́). — Count the vowels: е, е, а — three vowels, so three beats (syllables)."
  - prompt: "Коли́ вжива́ється віта́ння «До́брого ра́нку!»? — When is the greeting «До́брого ра́нку!» used?"
    options:
    - text: "Ура́нці при зу́стрічі з будь-ки́м — In the morning when greeting anyone"
      correct: true
    - text: "Лише́ уве́чері — Only in the evening"
      correct: false
    - text: "Лише́ при проща́нні — Only when saying goodbye"
      correct: false
    explanation: "«До́брого ра́нку!» — це універса́льне ра́нішнє віта́ння. — «До́брого ра́нку!» is Ukraine's universal morning greeting."
  - prompt: "Який звук познача́є бу́ква Х? — What sound does the letter Х represent?"
    options:
    - text: "М'яки́й глухи́й звук [х] (як у сло́ві Bach або loch) — Soft throat-hiss [x] (like in Bach or Scottish loch)"
      correct: true
    - text: "Дзвінки́й звук [ґ] (як у сло́ві go) — Hard g sound [g] (like in go)"
      correct: false
    - text: "Дрижа́чий звук [р] (як у сло́ві run) — Rolled sound [r]"
      correct: false
    explanation: "Бу́ква Х познача́є м'яки́й по́дих/горлови́й звук [х], як у шотла́ндському «loch» чи німе́цькому «Bach». — The letter Х represents a voiceless throat sound [x], like in Scottish «loch» or German «Bach»."

- id: act-w232
  type: group-sort
  title: "Розподілі́ть слова́ за при́голосними зву́ками — Sort words by consonants"
  instruction: "Розподілі́ть слова́ за катего́ріями при́голосних зву́ків. — Sort the words into categories of consonant sounds."
  groups:
  - name: "Тверді́ шипля́чі Ж, Ш — Firm “zh” and “sh”"
    items:
    - "жа́ба (frog)"
    - "шко́ла (school)"
    - "ка́ша (porridge)"
    - "ти́ша (quiet / silence)"
  - name: "М'яки́й горлови́й по́дих Х — Soft throat-hiss Х"
    items:
    - "хліб (bread)"
    - "ха́та (cottage)"
  - name: "Дзвінки́й свист З — Buzzing Z"
    items:
    - "зуб (tooth)"
    - "зеле́на (green)"

- id: act-w233
  type: true-false
  title: "Пра́вда чи непра́вда: Зву́ки та віта́ння — True or False: Sounds and greetings"
  instruction: "Ви́значте, чи є тве́рдження пра́вильним. — Decide whether the statement is true or false."
  items:
  - statement: "У слова́х «жа́ба», «ка́ша» та «ти́ша» бу́кви ж і ш лиша́ються тверди́ми: «zh» і «sh». — In «жа́ба», «ка́ша», and «ти́ша», letters ж and ш stay “zh” and “sh”."
    correct: true
    explanation: "Пра́вильно: пе́ред голосними́ [а], [и] шипля́чі зву́ки вимовля́ються твердо́. — Correct: ж and ш stay “zh” and “sh” before vowels like а, о, у, е, и."
  - statement: "Сло́во «Приві́т!» склада́ється лише́ з лі́тер, які́ ви вже ви́вчили. — The word «Приві́т!» consists only of letters you have already learned."
    correct: true
    explanation: "Пра́вильно: усі́ лі́тери П, Р, И, В, І, Т уже опано́вано. — Correct: all letters П, Р, И, В, І, Т have been learned."
  - statement: "Украї́нський голосни́й [е] після при́голосних ма́є звук «й» (як [йе]). — Ukrainian vowel [е] after consonants has a “y” glide (like [ye])."
    correct: false
    explanation: "Непра́вильно: в украї́нській мо́ві [е] — чи́стий і відкри́тий звук без «й» (се-ло́, не́-бо). — False: in Ukrainian, [е] is a clean, open vowel with no “y”-glide (се-ло́, не́-бо)."
  - statement: "Сло́во «хліб» ма́є два склади́ (два уда́ри). — The word «хліб» has two syllables (two beats)."
    correct: false
    explanation: "Непра́вильно: у сло́ві «хліб» оди́н голосни́й [і], то́му оди́н склад (оди́н уда́р). — False: «хліб» has one vowel [і], so it has only one syllable (beat)."
  - statement: "Бу́ква З є дзвінко́ю па́рою до глухо́го зву́ка С. — The letter З is the voiced partner of the voiceless sound С."
    correct: true
    explanation: "Пра́вильно: З — дзвінки́й звук [z], а С — глухи́й звук [s]. — Correct: З is voiced [z], and С is voiceless [s]."
  - statement: "У сло́ві «село́» на́голос стої́ть на дру́гому скла́ді (се-ло́). — In the word «село́» the stress is on the second syllable (се-ло́)."
    correct: true
    explanation: "Пра́вильно: на́голос па́дає на о: се-ло́. — Correct: the stress falls on о: се-ло́."

- id: act-w234
  type: fill-in
  title: "Вста́вте пропу́щену лі́теру — Fill in the missing letter"
  instruction: "Обері́ть прави́льну лі́теру на мі́сці про́пуску ___ . — Choose the correct letter to fill in the blank ___ ."
  items:
  - sentence: "___риві́т! — Hi!"
    options:
    - П
    - Т
    - Б
    answer: П
    explanation: "Віта́ння «Приві́т» почина́ється з лі́тери П: «Приві́т!». — The greeting «Приві́т» starts with the letter П: «Приві́т!»."
  - sentence: "До́брого ___а́нку! — Good morning!"
    options:
    - р
    - к
    - с
    answer: р
    explanation: "Сло́во «ра́нку» почина́ється з лі́тери р: «До́брого ра́нку!». — The word «ра́нку» starts with the letter р: «До́брого ра́нку!»."
  - sentence: "Он жа́___а. — Over there is a frog."
    options:
    - б
    - п
    - в
    answer: б
    explanation: "Сло́во «жа́ба» (frog) пи́шеться з лі́терою б. — The word «жа́ба» (frog) is spelled with the letter б."
  - sentence: "Он ка́___а. — Over there is porridge."
    options:
    - ш
    - ж
    - с
    answer: ш
    explanation: "Сло́во «ка́ша» (porridge) ма́є звук ш: «ка́ша». — The word «ка́ша» (porridge) has the sound ш: «ка́ша»."
  - sentence: "У нас х___іб. — We have bread."
    options:
    - л
    - м
    - н
    answer: л
    explanation: "Сло́во «хліб» (bread) пи́шеться з лі́терою л: «хліб». — The word «хліб» (bread) is spelled with the letter л: «хліб»."
  - sentence: "Он ха́___а. — Over there is a cottage."
    options:
    - т
    - п
    - к
    answer: т
    explanation: "Сло́во «ха́та» (cottage) пи́шеться з лі́терою т: «ха́та». — The word «ха́та» (cottage) is spelled with the letter т: «ха́та»."

- id: act-w235
  type: unjumble
  title: "Склади́ сло́во з лі́тер — Unjumble the word"
  instruction: "Поста́вте лі́тери в прави́льному поря́дку, щоб утвори́ти сло́во. — Arrange the letters in the correct order to form the word."
  items:
  - letters:
    - х
    - л
    - і
    - б
