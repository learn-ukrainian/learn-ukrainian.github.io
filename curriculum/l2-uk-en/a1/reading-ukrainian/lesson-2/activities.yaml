inline:
- id: act-2
  type: match-up
  title: "Роль лі́тер та пра́вила ви́мови — Letter roles and pronunciation rules"
  instruction: "З'єдна́йте бу́кву або́ сло́во з відпові́дним фонети́чним пра́вилом."
  pairs:
  - left: Б
    right: "дзвінки́й губни́й звук [b]"
  - left: Д
    right: "дзвінки́й передньоязико́вий звук [d]"
  - left: В
    right: "губни́й сона́нт [v]"
  - left: І
    right: "голосни́й звук [i], що пом'я́кшує при́голосний"
  - left: дуб
    right: "кінце́вий звук [б] ніко́ли не оглу́шується"
  - left: сад
    right: "кінце́вий звук [д] звучи́ть дзвінко́"

- id: act-211
  type: watch-and-repeat
  title: "Диві́ться та повто́рюйте: Бу́кви Б, В, Д, І — Watch and repeat: Letters Б, В, Д, І"
  instruction: "Подиві́ться коро́тке ві́део про вимо́ву лі́тери (джерело́: А́нна Ого́йко / source: Anna Ohoiko, Ukrainian Lessons) та повторі́ть уго́лос."
  items:
  - letter: Б
    word: дуб
    video: https://www.youtube.com/watch?v=V1hxBE_JbGg
  - letter: В
    word: вода́
    video: https://www.youtube.com/watch?v=aFcvYfvQ2X4
  - letter: Д
    word: дім
    video: https://www.youtube.com/watch?v=g4Bh-lqzd48
  - letter: І
    word: ліс
    video: https://www.youtube.com/watch?v=Z9TH0H4ShGo
  - letter: И
    word: дим
    video: https://www.youtube.com/watch?v=W-1rCu0indE
  - letter: Р
    word: рука́
    video: https://www.youtube.com/watch?v=fMGsQ5KPQgg

- id: act-212
  type: match-up
  title: "Мініма́льні па́ри: И про́ти І — Minimal pairs: И versus І"
  instruction: "З'єдна́йте украї́нське сло́во з його́ зна́ченням англі́йською мо́вою."
  pairs:
  - left: дим
    right: smoke
  - left: дім
    right: house / home
  - left: лис
    right: fox
  - left: ліс
    right: forest
  - left: бик
    right: bull
  - left: бік
    right: side

- id: act-213
  type: divide-words
  title: "Поділі́ть слова́ на склади́ — Divide words into syllables"
  instruction: "Введі́ть сло́во, розділи́вши його́ на склади́ че́рез пробі́л."
  items:
  - word: вода́
    answer: во да́
  - word: ри́ба
    answer: ри́ ба
  - word: соба́ка
    answer: со ба́ ка
  - word: нові́
    answer: но ві́
  - word: оди́н
    answer: о ди́н
  - word: самі́
    answer: са мі́

workbook:
- id: act-w2
  type: odd-one-out
  title: "За́йве сло́во за фонети́чною озна́кою — Odd word out by phonetic trait"
  instruction: "Знайді́ть у ко́жному рядку́ сло́во, яке́ відрізня́ється за звуко́вою будо́вою."
  items:
  - words:
    - дім
    - ліс
    - дід
    - дим
    correct: 3
    explanation: "Сло́во «дим» ма́є голосни́й [и], а ре́шта слів ма́ють звук [і]."
  - words:
    - лис
    - бик
    - ри́ба
    - бік
    correct: 3
    explanation: "Сло́во «бік» ма́є м'яки́й при́голосний пе́ред [і], а ре́шта слів ма́ють [и]."
  - words:
    - дуб
    - сад
    - дід
    - соба́ка
    correct: 3
    explanation: "Сло́во «соба́ка» ма́є три склади́, а ре́шта — односкладо́ві слова́."
  - words:
    - вода́
    - ри́ба
    - нові́
    - ліс
    correct: 3
    explanation: "Сло́во «ліс» ма́є оди́н склад, а ре́шта слів — два склади́."
  - words:
    - він
    - вона́
    - вони́
    - сад
    correct: 3
    explanation: "Сло́во «сад» — це іме́нник, а ре́шта слів — займе́нники."
  - words:
    - два
    - оди́н
    - дім
    - дуб
    correct: 1
    explanation: "Сло́во «оди́н» двоскладо́ве, а ре́шта слів мають по одному́ скла́ду."

- id: act-w211
  type: quiz
  title: "Факти про бу́кви Б, В, Д, І — Facts about letters Б, В, Д, І"
  instruction: "Обері́ть одну́ прави́льну ві́дповідь."
  items:
  - prompt: "Чи оглу́шуються дзвінкі́ при́голосні в кінці́ слів в украї́нській мо́ві?"
    options:
    - text: "Ні, ніко́ли: дуб звучи́ть як [дуб]"
      correct: true
    - text: "Так, за́вжди: дуб звучи́ть як [дуп]"
      correct: false
    - text: "Лише́ у ві́ршах"
      correct: false
    explanation: "В украї́нській мо́ві дзвінкі́ при́голосні зберіга́ють дзвінкі́сть у кінці́ слів."
  - prompt: "Яку́ ді́ю ма́є голосни́й [і] на попере́дній при́голосний?"
    options:
    - text: "Пом'я́кшує його́"
      correct: true
    - text: "Ро́бить його́ тверди́м"
      correct: false
    - text: "Подо́вжує його́"
      correct: false
    explanation: "Голосни́й [і] пом'я́кшує попере́дній при́голосний звук."
  - prompt: "Яка́ різни́ця між слова́ми «дим» і «дім»?"
    options:
    - text: "«Дим» — це smoke, а «дім» — це house"
      correct: true
    - text: "Це одна́кові слова́ з рі́зним напи́сом"
      correct: false
    - text: "«Дим» означа́є forest"
      correct: false
    explanation: "Зву́ки [и] та [і] розрізня́ють зна́чення слів: дим (smoke) vs дім (house)."
  - prompt: "Як познача́ється м'яки́й при́голосний у шкільни́х схе́мах?"
    options:
    - text: "Двома́ горизонта́льними ри́сками [=]"
      correct: true
    - text: "Одніє́ю ри́скою [—]"
      correct: false
    - text: "Круже́чком [●]"
      correct: false
    explanation: "М'яки́й при́голосний познача́ється двома́ ри́сками [=]."
  - prompt: "Скі́льки складів у сло́ві «соба́ка»?"
    options:
    - text: "Три склади́: со-ба́-ка"
      correct: true
    - text: "Два склади́"
      correct: false
    - text: "Чоти́ри склади́"
      correct: false
    explanation: "У сло́ві «соба́ка» три голосни́х зву́ки [о], [а], [а], то́му три склади́."
  - prompt: "Що означа́є фра́за «Вони́ самі́»?"
    options:
    - text: "They are alone / by themselves"
      correct: true
    - text: "He is at home"
      correct: false
    - text: "We have water"
      correct: false
    explanation: "«Вони́ самі́» означа́є, що вони́ перебува́ють на самоті́."

- id: act-w212
  type: group-sort
  title: "Розподілі́ть слова́ з [и] та [і] — Sort words with [и] and [і]"
  instruction: "Розподілі́ть слова́ за ная́вністю зву́ка [и] або́ [і]."
  groups:
  - name: "Слова́ зі зву́ком [и]"
    items:
    - дим
    - лис
    - бик
    - ри́ба
    - оди́н
    - вони́
  - name: "Слова́ зі зву́ком [і]"
    items:
    - дім
    - ліс
    - бік
    - дід
    - нові́
    - самі́

- id: act-w213
  type: true-false
  title: "Пра́вда чи непра́вда: Фоне́тика бу́кв Б, В, Д, І — True or False: Phonetics of Б, В, Д, І"
  instruction: "Ви́значте, чи є тве́рдження пра́вильним."
  items:
  - statement: "Сло́во «сад» вимовля́ється з кінце́вим дзвінким зву́ком [д]."
    correct: true
    explanation: "В украї́нській мо́ві нема́є оглу́шення дзвінких у кінці́ слів."
  - statement: "Бу́ква І ро́бить попере́дній при́голосний тверди́м."
    correct: false
    explanation: "Бу́ква І пом'я́кшує попере́дній при́голосний звук."
  - statement: "Слова́ «лис» і «ліс» ма́ють однако́ве зна́чення."
    correct: false
    explanation: "«Лис» — це твари́на (fox), а «ліс» — це дере́ва (forest)."
  - statement: "У сло́ві «вода́» два склади́."
    correct: true
    explanation: "У сло́ві «вода́» два голосни́х [о] та [а], отже́ два склади́."
  - statement: "Бу́ква В нале́жить до сона́нтів."
    correct: true
    explanation: "Бу́ква В познача́є губни́й сона́нт."
  - statement: "У сло́ві «дід» оби́два зву́ки [д] вимовля́ються дзвінко́."
    correct: true
    explanation: "Оби́два зву́ки [д] дзвінкі́, причо́му пе́рший — м'яки́й."

- id: act-w214
  type: fill-in
  title: "Вста́вте пропу́щену лі́теру — Fill in the missing letter"
  instruction: "Обері́ть прави́льну лі́теру на мі́сці про́пуску ___ ."
  items:
  - sentence: "Он д___м."
    options:
    - і
    - и
    - а
    answer: і
    explanation: "Сло́во «дім» (house) пи́шеться з лі́терою і."
  - sentence: "Он л___с."
    options:
    - і
    - и
    - у
    answer: і
    explanation: "Сло́во «ліс» (forest) пи́шеться з лі́терою і."
  - sentence: "Он д___б."
    options:
    - у
    - о
    - а
    answer: у
    explanation: "Сло́во «дуб» ма́є голосни́й [у]."
  - sentence: "Он с___д."
    options:
    - а
    - о
    - у
    answer: а
    explanation: "Сло́во «сад» ма́є голосни́й [а]."
  - sentence: "Він с___м."
    options:
    - а
    - о
    - у
    answer: а
    explanation: "Сло́во «сам» пи́шеться з лі́терою а."
  - sentence: "Вона́ сам___."
    options:
    - а́
    - о
    - у
    answer: а́
    explanation: "Сло́во «сама́» закінчу́ється на наголо́шений голосни́й [а]."

- id: act-w215
  type: unjumble
  title: "Склади́ сло́во з лі́тер — Unjumble the word"
  instruction: "Поста́вте лі́тери в прави́льному поря́дку, щоб утвори́ти сло́во."
  items:
  - letters:
    - д
    - і
    - м
    answer: дім
  - letters:
    - л
    - і
    - с
    answer: ліс
  - letters:
    - д
    - у
    - б
    answer: дуб
  - letters:
    - с
    - а
    - д
    answer: сад
  - letters:
    - д
    - і
    - д
    answer: дід
  - letters:
    - б
    - и
    - к
    answer: бик
