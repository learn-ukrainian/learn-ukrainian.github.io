inline:
- id: act-traps-match
  type: match-up
  title: Пра́вило для ко́жної па́стки
  instruction: З'єдна́й сло́во або́ знак із пра́вилом безпе́чного чита́ння.
  pairs:
  - left: джерело́
    right: чита́й [дж] як оди́н зли́тий звук
  - left: день
    right: м'яки́й знак пом'я́кшує при́голосний [нʲ]
  - left: сім'я́
    right: 'апостро́ф розділя́є зву́ки: [сім] і [йа]'
  - left: Украї́на
    right: лі́тера ї за́вжди дає́ два зву́ки [йі]
  - left: молоко́
    right: ко́жен звук [о] звучи́ть чі́тко й відкри́то
  - left: дзе́ркало
    right: чита́й [дз] як оди́н зли́тий звук
- id: act-traps-quiz
  type: quiz
  title: Переві́рка чита́цьких пасто́к
  instruction: Обери́ пра́вильне поя́снення для по́даного сло́ва.
  items:
  - prompt: Як пра́вильно чита́ти буквосполучення «дж» у сло́ві джерело́?
    options:
    - text: Як оди́н зли́тий звук [дж]
      correct: true
    - text: Як два окре́мі зву́ки [д] і [ж]
      correct: false
    explanation: Буквосполучення «дж» у ко́рені познача́є оди́н зли́тий звук.
  - prompt: Я́ку роль відіграє́ знак м'я́кшення у сло́ві день?
    options:
    - text: Пом'я́кшує попере́дній звук [н]
      correct: true
    - text: Познача́є окре́мий голосни́й звук
      correct: false
    explanation: Ь не ма́є вла́сного зву́ка, він пом'я́кшує попере́дній при́голосний.
  - prompt: Як пра́вильно прочита́ти сло́во сім'я́ че́рез апостро́ф?
    options:
    - text: 'Розді́льно: тверди́й [м] + [йа]'
      correct: true
    - text: 'М''я́ко ра́зом: [сіма]'
      correct: false
    explanation: 'Апостро́ф вимага́є розді́льної вимо́ви: тверди́й при́голосний і йото́ваний
      голосни́й [йа].'
  - prompt: Чому́ лі́теру ї у сло́ві Украї́на не мо́жна чита́ти як просте́ [і]?
    options:
    - text: Бо ї за́вжди познача́є два зву́ки [йі]
      correct: true
    - text: Бо ї пом'я́кшує попере́дній звук
      correct: false
    explanation: 'Лі́тера Ї в украї́нській мо́ві за́вжди познача́є два зву́ки: [й] та [і].'
  - prompt: Як звучи́ть ненаголо́шене «о» в украї́нському сло́ві молоко́?
    options:
    - text: Залиша́ється чи́стим і вира́зним зву́ком [о]
      correct: true
    - text: Перетво́рюється на нечітке́ [а]
      correct: false
    explanation: В украї́нській мо́ві ненаголо́шене «о» ні́коли не перетво́рюється на [а].
  - prompt: Як чита́ємо буквосполучення «дз» у сло́ві дзе́ркало?
    options:
    - text: Як оди́н зли́тий звук [дз]
      correct: true
    - text: Як окре́мі зву́ки [д] та [з]
      correct: false
    explanation: Буквосполучення «дз» чита́ється як оди́н неподі́льний зли́тий звук.
- id: act-traps-tf
  type: true-false
  title: Тве́рдження про пастки́ чита́ння
  instruction: Ви́знач, чи є тве́рдження пра́вильним.
  items:
  - statement: У сло́ві «молоко́» всі три зву́ки [о] звуча́ть чі́тко.
    correct: true
    explanation: В украї́нській мо́ві нема́є а́кання.
  - statement: Буквосполучення «дж» у сло́ві «джерело́» вимовля́ємо як два розді́льні
      зву́ки.
    correct: false
    explanation: ДЖ познача́є оди́н зли́тий звук.
  - statement: Лі́тера «ї» в сло́ві «Украї́на» познача́є два зву́ки [йі].
    correct: true
    explanation: Лі́тера Ї за́вжди познача́є два зву́ки.
  - statement: М'яки́й знак познача́є окре́мий голосни́й звук.
    correct: false
    explanation: Ь не ма́є вла́сного зву́ка.
  - statement: Апостро́ф вимага́є твердо́ї вимо́ви при́голосного пе́ред я, ю, є, ї.
    correct: true
    explanation: При́голосний пе́ред апостро́фом залиша́ється тверди́м.
  - statement: Буквосполучення «дз» у сло́ві «дзе́ркало» познача́є оди́н зли́тий звук.
    correct: true
    explanation: ДЗ вимовля́ється як оди́н неподі́льний звук.
- id: act-notebook-match
  type: match-up
  title: Друк і рукопи́сні фо́рми
  instruction: З'єдна́й друко́ване сло́во з йо́го о́писом або́ рукопи́сною озна́кою.
  pairs:
  - left: 'друк: день'
    right: 'зо́шит: сло́во з кінце́вим зна́ком м''я́кшення'
  - left: 'друк: Киї́в'
    right: 'зо́шит: сло́во з двома́ крапка́ми над ї'
  - left: 'друк: джерело́'
    right: 'зо́шит: сло́во зі зли́тим буквосполученням дж'
  - left: 'друк: сім''я́'
    right: 'зо́шит: сло́во з розді́льним апостро́фом'
  - left: 'друк: о́сінь'
    right: 'зо́шит: сло́во з двома́ м''яки́ми при́голосними'
  - left: 'друк: дзе́ркало'
    right: 'зо́шит: сло́во зі зли́тим буквосполученням дз'
- id: act-reading-check
  type: true-false
  title: Пра́вила самопереві́рки чита́ння
  instruction: Ви́знач, чи є тве́рдження пра́вильним.
  items:
  - statement: Знак м'я́кшення (ь) ні́коли не ма́є вла́сного зву́ка.
    correct: true
    explanation: Ь лише́ пока́зує м'я́кість попере́днього при́голосного.
  - statement: У сло́ві джерело́ буквосполучення дж вимовля́ємо як два розді́льні зву́ки.
    correct: false
    explanation: ДЖ у ко́рені слова́ чита́ємо як оди́н зли́тий звук.
  - statement: Апостро́ф вка́зує на розді́льну вимо́ву твердо́го при́голосного пе́ред я,
      ю, є, ї.
    correct: true
    explanation: Апостро́ф зберіга́є тве́рдість при́голосного і розділя́є йо́го з насту́пним
      йото́ваним.
  - statement: Лі́тера ї і́ноді познача́є оди́н звук пі́сля м'яко́го при́голосного.
    correct: false
    explanation: Лі́тера Ї за́вжди познача́є два зву́ки [йі] і ні́коли не пом'я́кшує.
  - statement: В украї́нській мо́ві всі ненаголо́шені зву́ки [о] чита́ються чі́тко.
    correct: true
    explanation: Украї́нське [о] ні́коли не зазнає́ а́кання й звучи́ть чі́тко.
  - statement: Пе́ред чита́нням сло́ва кори́сно порахува́ти голосні́ зву́ки.
    correct: true
    explanation: Скі́льки в сло́ві голосни́х зву́ків — сті́льки й скла́дів.
workbook:
- id: act-4
  type: error-correction
  title: Пастки́ чита́ння
  instruction: Обери́ безпе́чнішу украї́нську чита́цьку зви́чку.
  items:
  - sentence: Не чита́й молоко́ як малоко.
    error: малоко
    correction: молоко́
    options:
    - молоко́
    - нечітке́ о
    explanation: Украї́нське о залиша́ється чи́стим; чита́й молоко́ у три відкри́ті уда́ри.
  - sentence: Не чита́й дж у сло́ві джерело́ як д плюс ж.
    error: д плюс ж
    correction: оди́н зли́тий звук
    options:
    - оди́н зли́тий звук
    - д плюс ж
    explanation: ДЖ чита́ємо як оди́н зли́тий звук у слова́х як джерело́.
  - sentence: Украї́на — не чита́й ї як просте́ і.
    error: просте́ і
    correction: '[йі]'
    options:
    - '[йі]'
    - '[і]'
    explanation: Ї за́вжди чита́ємо як [йі].
  - sentence: День — не тре́ба дода́ти голосни́й пі́сля нь.
    error: дода́ти голосни́й
    correction: пом'якши́ти н і зупини́тися
    options:
    - пом'якши́ти н і зупини́тися
    - дода́ти і пі́сля нь
    explanation: Ь не ма́є вла́сного зву́ка; він м'якши́ть попере́дній при́голосний.
- id: act-w3
  type: true-false
  title: Фа́кти про чита́ння
  instruction: Обери́ пра́вда чи непра́вда.
  items:
  - statement: Ко́жен украї́нський склад ма́є голосни́й звук.
    correct: true
    explanation: Голосни́й звук — центр скла́ду.
  - statement: Ї і́ноді м'якши́ть попере́дній при́голосний.
    correct: false
    explanation: Ї за́вжди чита́ємо як [йі].
  - statement: У молоко́ звук о залиша́ється чи́стим.
    correct: true
    explanation: Не перетво́рюй о на нечітки́й голосни́й.
  - statement: ДЖ і ДЗ чита́ємо як зли́ті одини́ці.
    correct: true
    explanation: ДЖ і ДЗ чита́ємо як зли́ті одини́ці.
- id: act-w4
  type: match-up
  title: Друк і зо́шит
  instruction: З'єдна́й друко́ване сло́во з підка́зкою в зо́шиті.
  pairs:
  - left: 'друк: ма́ма'
    right: 'зо́шит: ма́ма'
  - left: 'друк: молоко́'
    right: 'зо́шит: молоко́'
  - left: 'друк: день'
    right: 'зо́шит: сло́во з кінце́вим ь'
  - left: 'друк: Киї́в'
    right: 'зо́шит: сло́во з ї'
  - left: 'друк: ву́лиця'
    right: 'зо́шит: трискладо́ве сло́во про мі́сто'
- id: act-wb-group
  type: group-sort
  title: Розпо́діл слів за фонети́чною озна́кою
  instruction: Розпо́діли сло́ва за ї́хньою ключово́ю фонети́чною озна́кою.
  groups:
  - label: Знак м'я́кшення (ь)
    items:
    - день
    - о́сінь
    - ба́тько
  - label: Зли́ті зву́ки (дж, дз)
    items:
    - джерело́
    - дзе́ркало
  - label: Лі́тера ї або́ апостро́ф
    items:
    - Киї́в
    - Украї́на
    - сім'я́
- id: act-wb-quiz
  type: quiz
  title: Чита́цькі пра́вила на пра́ктиці
  instruction: Обери́ пра́вильну ві́дповідь на запита́ння про чита́ння слів.
  items:
  - prompt: Скі́льки зву́ків познача́є лі́тера ї у сло́ві Киї́в?
    options:
    - text: два зву́ки [йі]
      correct: true
    - text: оди́н звук [і]
      correct: false
    explanation: 'Лі́тера Ї за́вжди познача́є два зву́ки: [й] та [і].'
  - prompt: Яки́й при́голосний є м'яки́м у сло́ві ба́тько?
    options:
    - text: звук [тʲ]
      correct: true
    - text: звук [к]
      correct: false
    explanation: 'Знак м''я́кшення пі́сля лі́тери т пом''я́кшує са́ме її: [батʲко].'
  - prompt: Як вимовля́ємо буквосполучення дж у сло́ві джерело́?
    options:
    - text: як оди́н неподі́льний зли́тий звук
      correct: true
    - text: як два розді́льні зву́ки
      correct: false
    explanation: У корене́вих слова́х буквосполучення «дж» є єди́ним зву́ком.
  - prompt: Що вка́зує на розді́льну вимо́ву в сло́ві сім'я́?
    options:
    - text: апостро́ф
      correct: true
    - text: знак м'я́кшення
      correct: false
    explanation: Апостро́ф вка́зує на розді́льну тверду́ вимо́ву пе́ред йото́ваним.
  - prompt: Яки́й кінце́вий при́голосний є м'яки́м у сло́ві вчи́тель?
    options:
    - text: звук [лʲ]
      correct: true
    - text: звук [ч]
      correct: false
    explanation: М'яки́й знак у кінці́ сло́ва вчи́тель пом'я́кшує звук [л].
  - prompt: Скі́льки скла́дів ма́є сло́во дзе́ркало?
    options:
    - text: три скла́ди
      correct: true
    - text: чоти́ри скла́ди
      correct: false
    explanation: У сло́ві дзе́ркало три голосні́ [е, а, о], о́тже, три скла́ди.
- id: act-wb-odd
  type: odd-one-out
  title: За́йве сло́во за звуково́ю озна́кою
  instruction: Обери́ сло́во, яке́ відрізня́ється від і́нших за вка́заною фонети́чною озна́кою.
  items:
  - words:
    - день
    - о́сінь
    - вчи́тель
    - ма́ма
    answer: ма́ма
    explanation: Ма́ма не ма́є зна́ка м'я́кшення, тоді́ як і́нші три слова́ закі́нчуються
      м'яки́м зна́ком.
  - words:
    - джерело́
    - дзе́ркало
    - дзвін
    - молоко́
    answer: молоко́
    explanation: Молоко́ не мі́стить буквосполучень дж чи дз.
  - words:
    - Киї́в
    - Украї́на
    - ї́жа
    - ба́тько
    answer: ба́тько
    explanation: Ба́тько не ма́є лі́тери ї.
  - words:
    - сім'я́
    - м'я́со
    - п'ять
    - вода́
    answer: вода́
    explanation: Вода́ пи́шеться без апостро́фа.
  - words:
    - молоко́
    - столи́ця
    - ка́ша
    - день
    answer: день
    explanation: День — односкладо́ве сло́во, а і́нші ма́ють два або́ три скла́ди.
  - words:
    - ба́тько
    - о́сінь
    - день
    - джерело́
    answer: джерело́
    explanation: Джерело́ не ма́є зна́ка м'я́кшення.
- id: act-wb-fill
  type: fill-in
  title: Встав пра́вильну лі́теру або́ знак
  instruction: Встав пропу́щену лі́теру або́ графі́чний знак у сло́во.
  items:
  - sentence: Сього́дні га́рний де__ь.
    options:
    - н
    - нь
    answer: нь
    explanation: 'У сло́ві день у кінці́ пи́шемо знак м''я́кшення: день.'
  - sentence: У лі́сі б'є холо́дне __ерело.
    options:
    - дж
    - ж
    answer: дж
    explanation: Сло́во джерело́ почина́ється зі зли́того зву́ка, що познача́ється буквосполученням
      дж.
  - sentence: Це дру́жна сім__я.
    options:
    - ''''
    - ь
    answer: ''''
    explanation: У сло́ві сім'я́ ста́вимо апостро́ф для розді́льної вимо́ви.
  - sentence: Золота́ о́сі__ь наста́ла.
    options:
    - н
    - нь
    answer: нь
    explanation: Сло́во о́сінь закі́нчується м'яки́м зна́ком.
  - sentence: У кімна́ті виси́ть вели́ке __еркало.
    options:
    - дз
    - з
    answer: дз
    explanation: Сло́во дзе́ркало почина́ється з буквосполучення дз.
  - sentence: Мі́сто Ки__в — столи́ця Украї́ни.
    options:
    - ї
    - і
    answer: ї
    explanation: У на́зві Киї́в пи́шемо лі́теру ї, я́ка за́вжди дає́ два зву́ки [йі].
