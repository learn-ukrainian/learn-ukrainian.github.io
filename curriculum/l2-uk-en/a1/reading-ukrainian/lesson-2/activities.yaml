inline:
- id: act-2
  type: match-up
  title: "Роль лі́тер та пра́вила ви́мови — Letter roles and pronunciation rules"
  instruction: "З'єдна́йте бу́кву або́ сло́во з відпові́дним пра́вилом. — Match the letter or word with its pronunciation rule."
  pairs:
  - left: "Б — Letter Б"
    right: "дзвінки́й звук [b] — voiced b"
  - left: "Д — Letter Д"
    right: "дзвінки́й звук [d] — voiced d"
  - left: "В — Letter В"
    right: "губни́й звук [v] — labial v"
  - left: "І — Letter І"
    right: "голосна́ «ee», що пом'я́кшує при́голосний — vowel \"ee\", softens preceding consonant"
  - left: "дуб — oak tree"
    right: "кінце́вий звук [б] звучи́ть як [б], а не [п] — final б sounds like б, not п"
  - left: "сад — garden"
    right: "кінце́вий звук [д] звучи́ть як [д], а не [т] — final д sounds like д, not т"

- id: act-211
  type: watch-and-repeat
  title: "Диві́ться та повто́рюйте: Бу́кви Б, В, Д, І — Watch and repeat: Letters Б, В, Д, І"
  instruction: "Подиві́ться коро́тке ві́део про вимо́ву лі́тери (джерело́: А́нна Ого́йко / source: Anna Ohoiko, Ukrainian Lessons) та повторі́ть уго́лос. — Watch a short video on pronouncing the letter (source: Anna Ohoiko, Ukrainian Lessons) and repeat aloud."
  items:
  - letter: Б
    word: "дуб — oak tree"
    video: https://www.youtube.com/watch?v=V1hxBE_JbGg
  - letter: В
    word: "вода́ — water"
    video: https://www.youtube.com/watch?v=aFcvYfvQ2X4
  - letter: Д
    word: "дім — house / home"
    video: https://www.youtube.com/watch?v=g4Bh-lqzd48
  - letter: І
    word: "ліс — forest / woods"
    video: https://www.youtube.com/watch?v=Z9TH0H4ShGo
  - letter: И
    word: "дим — smoke"
    video: https://www.youtube.com/watch?v=W-1rCu0indE
  - letter: Р
    word: "рука́ — hand / arm"
    video: https://www.youtube.com/watch?v=fMGsQ5KPQgg

- id: act-212
  type: match-up
  title: "Мініма́льні па́ри: И про́ти І — Minimal pairs: И versus І"
  instruction: "З'єдна́йте украї́нське сло́во з його́ зна́ченням англі́йською мо́вою. — Match the Ukrainian word with its English meaning."
  pairs:
  - left: "дим — dym"
    right: "smoke (relax tongue for «ih»)"
  - left: "дім — dim"
    right: "house / home (smile for «ee»)"
  - left: "лис — lys"
    right: "fox (male)"
  - left: "ліс — lis"
    right: "forest / woods"
  - left: "бик — byk"
    right: "bull"
  - left: "бік — bik"
    right: "side / flank"

- id: act-213
  type: divide-words
  title: "Поділі́ть слова́ на склади́ — Divide words into syllables"
  instruction: "Введі́ть сло́во, розділи́вши його́ на склади́ че́рез пробі́л. — Enter the word divided into syllables with a space."
  items:
  - word: вода́
    answer: "во да́"
    hint: "вода́ — water"
  - word: ри́ба
    answer: "ри́ ба"
    hint: "ри́ба — fish"
  - word: соба́ка
    answer: "со ба́ ка"
    hint: "соба́ка — dog"
  - word: нові́
    answer: "но ві́"
    hint: "нові́ — new (plural)"
  - word: оди́н
    answer: "о ди́н"
    hint: "оди́н — one"
  - word: самі́
    answer: "са мі́"
    hint: "самі́ — alone / by themselves (plural)"

workbook:
- id: act-w2
  type: odd-one-out
  title: "За́йве сло́во за фонети́чною озна́кою — Odd word out by phonetic trait"
  instruction: "Знайді́ть у ко́жному рядку́ сло́во, яке́ відрізня́ється за звуко́вою будо́вою. — Find the word in each row that differs by sound structure."
  items:
  - words:
    - "дім — house"
    - "ліс — forest"
    - "дід — grandfather"
    - "дим — smoke"
    correct: 3
    explanation: "Сло́во «дим» ма́є звук [и] (ih), а ре́шта слів ма́ють звук [і] (ee). — The word «дим» has [и] (ih), while the others have [і] (ee)."
  - words:
    - "лис — fox"
    - "бик — bull"
    - "ри́ба — fish"
    - "бік — side"
    correct: 3
    explanation: "Сло́во «бік» ма́є м'яки́й при́голосний пе́ред [і], а ре́шта слів ма́ють [и]. — «бік» has a softened consonant before [і], while the rest have [и]."
  - words:
    - "дуб — oak tree"
    - "сад — garden"
    - "дід — grandfather"
    - "соба́ка — dog"
    correct: 3
    explanation: "Сло́во «соба́ка» ма́є три склади́, а ре́шта — односкладо́ві слова́. — «соба́ка» has three syllables, while the rest are single-syllable."
  - words:
    - "вода́ — water"
    - "ри́ба — fish"
    - "нові́ — new"
    - "ліс — forest"
    correct: 3
    explanation: "Сло́во «ліс» ма́є оди́н склад, а ре́шта слів — два склади́. — «ліс» has one syllable, while the other words have two."
  - words:
    - "він — he"
    - "вона́ — she"
    - "вони́ — they"
    - "сад — garden"
    correct: 3
    explanation: "Сло́во «сад» — це іме́нник, а ре́шта слів — займе́нники. — «сад» is a noun, while the rest are pronouns."
  - words:
    - "два — two"
    - "оди́н — one"
    - "дім — house"
    - "дуб — oak tree"
    correct: 1
    explanation: "Сло́во «оди́н» двоскладо́ве, а ре́шта слів мають по одному́ скла́ду. — «оди́н» has two syllables, while the other words have one."

- id: act-w211
  type: quiz
  title: "Факти про бу́кви Б, В, Д, І — Facts about letters Б, В, Д, І"
  instruction: "Обері́ть одну́ прави́льну ві́дповідь. — Choose one correct answer."
  items:
  - prompt: "Чи оглу́шуються дзвінкі́ при́голосні в кінці́ слів в украї́нській мо́ві? — Do voiced consonants devoice at the end of words in Ukrainian?"
    options:
    - text: "Ні: дуб звучи́ть як [дуб], а не [дуп] — No: дуб sounds like б, not п"
      correct: true
    - text: "Так: дуб звучи́ть як [дуп] — Yes: дуб sounds like дуп"
      correct: false
    - text: "Лише́ у ві́ршах — Only in poems"
      correct: false
    explanation: "В украї́нській мо́ві дзвінкі́ при́голосні зберіга́ють дзвінкі́сть у кінці́ слів: дуб звучи́ть із [б]. — In Ukrainian, voiced consonants stay voiced: дуб ends in [б], not [п]."
  - prompt: "Яку́ ді́ю ма́є голосна́ І на попере́дній при́голосний? — What effect does the vowel І have on the preceding consonant?"
    options:
    - text: "Пом'я́кшує його́ — Softens it"
      correct: true
    - text: "Ро́бить його́ тверди́м — Makes it hard"
      correct: false
    - text: "Подо́вжує його́ — Lengthens it"
      correct: false
    explanation: "Голосна́ І пом'я́кшує попере́дній при́голосний звук. — The vowel І softens the preceding consonant sound."
  - prompt: "Яка́ різни́ця між слова́ми «дим» і «дім»? — What is the difference between the words \"дим\" and \"дім\"?"
    options:
    - text: "«Дим» — це smoke, а «дім» — це house — «Дим» is smoke, while «дім» is house"
      correct: true
    - text: "Це одна́кові слова́ з рі́зним напи́сом — They are identical words with different spellings"
      correct: false
    - text: "«Дим» означа́є forest — «Дим» means forest"
      correct: false
    explanation: "Зву́ки [и] та [і] розрізня́ють зна́чення слів: дим (smoke) vs дім (house). — The vowels distinguish meaning: дим (smoke, relaxed 'ih') vs дім (house, smiling 'ee')."
  - prompt: "Як познача́ється м'яки́й при́голосний у шкільни́х схе́мах? — How is a soft consonant marked in Ukrainian school schemes?"
    options:
    - text: "Двома́ горизонта́льними ри́сками [=] — With two horizontal bars [=]"
      correct: true
    - text: "Одніє́ю ри́скою [—] — With one bar [—]"
      correct: false
    - text: "Круже́чком [●] — With a circle [●]"
      correct: false
    explanation: "М'яки́й при́голосний познача́ється двома́ ри́сками [=]. — A soft consonant is marked with a double bar [=]."
  - prompt: "Скі́льки складів у сло́ві «соба́ка»? — How many syllables are in the word \"соба́ка\"?"
    options:
    - text: "Три склади́: со-ба́-ка — Three syllables: со-ба́-ка"
      correct: true
    - text: "Два склади́ — Two syllables"
      correct: false
    - text: "Чоти́ри склади́ — Four syllables"
      correct: false
    explanation: "У сло́ві «соба́ка» три голосни́х зву́ки [о], [а], [а], то́му три склади́. — In «соба́ка» there are three vowel sounds [о], [а], [а], so three syllables."
  - prompt: "Що означа́є фра́за «Вони́ самі́»? — What does the phrase \"Вони́ самі́\" mean?"
    options:
    - text: "They are alone / by themselves"
      correct: true
    - text: "He is at home"
      correct: false
    - text: "We have water"
      correct: false
    explanation: "«Вони́ самі́» означа́є, що вони́ перебува́ють на самоті́. — «Вони́ самі́» means they are alone / by themselves."

- id: act-w212
  type: group-sort
  title: "Розподілі́ть слова́ з [и] та [і] — Sort words with [и] and [і]"
  instruction: "Розподілі́ть слова́ за ная́вністю зву́ка [и] або́ [і]. — Sort words by the vowel sound [и] or [і]."
  groups:
  - name: "Слова́ зі зву́ком [и] (ih) — Words with sound [и] (ih)"
    items:
    - "дим (smoke)"
    - "лис (fox)"
    - "бик (bull)"
    - "ри́ба (fish)"
    - "оди́н (one)"
    - "вони́ (they)"
  - name: "Слова́ зі зву́ком [і] (ee) — Words with sound [і] (ee)"
    items:
    - "дім (house)"
    - "ліс (forest)"
    - "бік (side)"
    - "дід (grandfather)"
    - "нові́ (new)"
    - "самі́ (alone)"

- id: act-w213
  type: true-false
  title: "Пра́вда чи непра́вда: Фоне́тика бу́кв Б, В, Д, І — True or False: Phonetics of Б, В, Д, І"
  instruction: "Ви́значте, чи є тве́рдження пра́вильним. — Determine whether the statement is true or false."
  items:
  - statement: "Сло́во «сад» вимовля́ється з кінце́вим дзвінким [д], а не [т]. — The word \"сад\" is pronounced with final voiced [д], not [т]."
    correct: true
    explanation: "В украї́нській мо́ві нема́є оглу́шення дзвінких у кінці́ слів: [сад]. — In Ukrainian there is no final devoicing: [сад], not [сат]."
  - statement: "Бу́ква І ро́бить попере́дній при́голосний тверди́м. — The letter І makes the preceding consonant hard."
    correct: false
    explanation: "Бу́ква І пом'я́кшує попере́дній при́голосний звук. — The letter І softens the preceding consonant sound."
  - statement: "Слова́ «лис» і «ліс» ма́ють однако́ве зна́чення. — The words \"лис\" and \"ліс\" have the same meaning."
    correct: false
    explanation: "«Лис» — це твари́на (fox), а «ліс» — це дере́ва (forest). — «Лис» means fox, while «ліс» means forest."
  - statement: "У сло́ві «вода́» два склади́. — In the word \"вода́\" there are two syllables."
    correct: true
    explanation: "У сло́ві «вода́» два голосни́х [о] та [а], отже́ два склади́. — In «вода́» there are two vowels [о] and [а], hence two syllables."
  - statement: "Бу́ква В нале́жить до сона́нтів. — The letter В belongs to sonorants."
    correct: true
    explanation: "Бу́ква В познача́є губни́й сона́нт. — The letter В represents a labial sonorant sound."
  - statement: "У сло́ві «дід» оби́два зву́ки [д] вимовля́ються дзвінко́. — In the word \"дід\", both [д] sounds are voiced."
    correct: true
    explanation: "Оби́два зву́ки [д] дзвінкі́, кінце́вий не оглу́шується на [т]. — Both [д] sounds are voiced; the final one does not devoice to [т]."

- id: act-w214
  type: fill-in
  title: "Вста́вте пропу́щену лі́теру — Fill in the missing letter"
  instruction: "Обері́ть прави́льну лі́теру на мі́сці про́пуску ___ . — Choose the correct letter for the blank ___ ."
  items:
  - sentence: "Он д___м. — Over there is a house."
    options:
    - і
    - и
    - а
    answer: і
    explanation: "Сло́во «дім» (house) пи́шеться з лі́терою і. — The word «дім» (house) is written with the letter і."
  - sentence: "Он л___с. — Over there is a forest."
    options:
    - і
    - и
    - у
    answer: і
    explanation: "Сло́во «ліс» (forest) пи́шеться з лі́терою і. — The word «ліс» (forest) is written with the letter і."
  - sentence: "Он д___б. — Over there is an oak tree."
    options:
    - у
    - о
    - а
    answer: у
    explanation: "Сло́во «дуб» (oak) ма́є голосни́й [у]. — The word «дуб» has the vowel [у]."
  - sentence: "Он с___д. — Over there is a garden."
    options:
    - а
    - о
    - у
    answer: а
    explanation: "Сло́во «сад» (garden) ма́є голосни́й [а]. — The word «сад» has the vowel [а]."
  - sentence: "Він с___м. — He is alone."
    options:
    - а
    - о
    - у
    answer: а
    explanation: "Сло́во «сам» (alone) пи́шеться з лі́терою а. — The word «сам» is written with the letter а."
  - sentence: "Вона́ сам___. — She is alone."
    options:
    - а́
    - о
    - у
    answer: а́
    explanation: "Сло́во «сама́» (alone, fem.) закінчу́ється на наголо́шений [а]. — The word «сама́» ends in stressed [а]."

- id: act-w215
  type: unjumble
  title: "Склади́ сло́во з лі́тер — Unjumble the word"
  instruction: "Поста́вте лі́тери в прави́льному поря́дку, щоб утвори́ти сло́во. — Arrange the letters in the correct order to form the word."
  items:
  - letters:
    - д
    - і
    - м
    answer: дім
    hint: "дім — house / home"
  - letters:
    - л
    - і
    - с
    answer: ліс
    hint: "ліс — forest / woods"
  - letters:
    - д
    - у
    - б
    answer: дуб
    hint: "дуб — oak tree"
  - letters:
    - с
    - а
    - д
    answer: сад
    hint: "сад — garden"
  - letters:
    - д
    - і
    - д
    answer: дід
    hint: "дід — grandfather"
  - letters:
    - б
    - и
    - к
    answer: бик
    hint: "бик — bull"
