inline:
- id: act-1
  type: count-syllables
  title: "Раху́йте склади́ — Count syllables"
  instruction: "Пораху́йте голосні́ зву́ки у сло́ві. Кі́лькість голосни́х дорі́внює кі́лькості складі́в."
  maxCount: 5
  items:
  - word: рак
    correct: 1
  - word: мак
    correct: 1
  - word: рука́
    correct: 2
  - word: со́рок
    correct: 2
  - word: си́ла
    correct: 2
  - word: молоко́
    correct: 3

- id: act-201
  type: watch-and-repeat
  title: "Диві́ться та повто́рюйте: Бу́кви К, И, Р — Watch and repeat: Letters К, И, Р"
  instruction: "Подиві́ться коро́тке ві́део про вимо́ву лі́тери (джерело́: А́нна Ого́йко / source: Anna Ohoiko, Ukrainian Lessons) та повторі́ть уго́лос."
  items:
  - letter: К
    word: рука́
    video: https://www.youtube.com/watch?v=J7sGEI4-xJo
  - letter: И
    word: си́ла
    video: https://www.youtube.com/watch?v=W-1rCu0indE
  - letter: Р
    word: рак
    video: https://www.youtube.com/watch?v=fMGsQ5KPQgg
  - letter: А
    word: ма́ма
    video: https://www.youtube.com/watch?v=hvB3VpcR3ZE
  - letter: О
    word: со́рок
    video: https://www.youtube.com/watch?v=gJFxRIPRZbI
  - letter: У
    word: кума́
    video: https://www.youtube.com/watch?v=VB1O6PmtYRU

- id: act-202
  type: match-up
  title: "З'єдна́йте склади́ у слова́ — Join syllables into words"
  instruction: "З'єдна́йте пе́рший склад із дру́гим, щоб утвори́ти знайо́ме сло́во."
  pairs:
  - left: ру
    right: ка́ (рука́)
  - left: си́
    right: ла (си́ла)
  - left: ко
    right: ра́ (кора́)
  - left: со́
    right: рок (со́рок)
  - left: ку
    right: ма́ (кума́)
  - left: ри́
    right: нок (ри́нок)

- id: act-203
  type: divide-words
  title: "Поділі́ть слова́ на склади́ — Divide words into syllables"
  instruction: "Введі́ть сло́во, розділи́вши його́ на склади́ че́рез пробі́л."
  items:
  - word: рука́
    answer: ру ка́
  - word: со́рок
    answer: со́ рок
  - word: си́ла
    answer: си́ ла
  - word: ри́нок
    answer: ри́ нок
  - word: кора́
    answer: ко ра́
  - word: молоко́
    answer: мо ло ко́

workbook:
- id: act-w1
  type: group-sort
  title: "Розподілі́ть за кі́лькістю складів — Sort by syllable count"
  instruction: "Розподілі́ть слова́ за кі́лькістю складів."
  groups:
  - name: "Оди́н склад"
    items:
    - рак
    - мак
    - кран
    - син
    - смак
    - кум
  - name: "Два склади́"
    items:
    - рука́
    - со́рок
    - си́ла
    - кора́
    - нора́
    - кума́
  - name: "Три склади́"
    items:
    - молоко́

- id: act-w201
  type: quiz
  title: "Факти про склади́ та зву́ки — Facts about syllables and sounds"
  instruction: "Обері́ть одну́ прави́льну ві́дповідь."
  items:
  - prompt: "Як порахува́ти склади́ в украї́нському сло́ві?"
    options:
    - text: "Порахува́ти голосні́ зву́ки"
      correct: true
    - text: "Порахува́ти при́голосні зву́ки"
      correct: false
    - text: "Порахува́ти всі бу́кви"
      correct: false
    explanation: "У сло́ві сті́льки складів, скі́льки в ньо́му голосних зву́ків."
  - prompt: "Скі́льки складі́в у сло́ві «со́рок»?"
    options:
    - text: "Два склади́"
      correct: true
    - text: "Оди́н склад"
      correct: false
    - text: "Три склади́"
      correct: false
    explanation: "У сло́ві «со́рок» два голосни́х зву́ки [о], то́му два склади́."
  - prompt: "Який голосни́й звук познача́є лі́тера И?"
    options:
    - text: "Ненапру́жений передні́й звук [и]"
      correct: true
    - text: "Задньоязико́вий звук [у]"
      correct: false
    - text: "Лабіалізо́ваний звук [о]"
      correct: false
    explanation: "Бу́ква И познача́є чи́стий ненапру́жений голосни́й звук [и]."
  - prompt: "Який звук познача́є бу́ква Р?"
    options:
    - text: "Дрижа́чий сона́нт [r]"
      correct: true
    - text: "Глухи́й проривни́й [k]"
      correct: false
    - text: "Носови́й сона́нт [m]"
      correct: false
    explanation: "Бу́ква Р познача́є язико́вий дрижа́чий сона́нт [r]."
  - prompt: "Що пока́зує кінестети́чний тест підборі́ддя?"
    options:
    - text: "Ко́жен рух підборі́ддя вниз відпові́дає голосно́му зву́ку й скла́ду"
      correct: true
    - text: "Він пока́зує наголо́шений при́голосний"
      correct: false
    - text: "Він вимі́рює си́лу го́лосу"
      correct: false
    explanation: "Ще́лепа опу́скається під час тво́рення голосних зву́ків."
  - prompt: "Чи є слова́ «бу́ква» та «лі́тера» сино́німами?"
    options:
    - text: "Так, це то́чні сино́німи для графі́чного зна́ка"
      correct: true
    - text: "Ні, бу́ква — це звук, а лі́тера — знак"
      correct: false
    - text: "Ні, це зовсі́м рі́зні поня́ття"
      correct: false
    explanation: "Оби́два те́рміни станда́ртні в украї́нській осві́ті та познача́ють графем́у."

- id: act-w202
  type: odd-one-out
  title: "За́йве сло́во за кі́лькістю складів — Odd word out by syllable count"
  instruction: "Знайді́ть у ко́жному рядку́ сло́во, яке́ ма́є і́ншу кі́лькість складів."
  items:
  - words:
    - рак
    - мак
    - рука́
    - син
    correct: 2
    explanation: "Сло́во «рука́» ма́є два склади́, а ре́шта слів — оди́н склад."
  - words:
    - со́рок
    - си́ла
    - кора́
    - кран
    correct: 3
    explanation: "Сло́во «кран» односкладо́ве, а ре́шта — двоскладо́ві."
  - words:
    - молоко́
    - рука́
    - нора́
    - кума́
    correct: 0
    explanation: "Сло́во «молоко́» ма́є три склади́, а ре́шта — два склади́."
  - words:
    - смак
    - ри́нок
    - син
    - кум
    correct: 1
    explanation: "Сло́во «ри́нок» ма́є два склади́, а ре́шта слів — оди́н склад."
  - words:
    - кума́
    - сукно́
    - коса́
    - рак
    correct: 3
    explanation: "Сло́во «рак» ма́є оди́н склад, а ре́шта слів — два склади́."
  - words:
    - син
    - кран
    - рак
    - сосна́
    correct: 3
    explanation: "Сло́во «сосна́» ма́є два склади́, а і́нші слова́ — оди́н склад."

- id: act-w203
  type: true-false
  title: "Пра́вда чи непра́вда: Зву́ки та склади́ — True or False: Sounds and syllables"
  instruction: "Ви́значте, чи пра́вильне тве́рдження."
  items:
  - statement: "У ко́жному украї́нському скла́ді обов'язко́во є голосни́й звук."
    correct: true
    explanation: "Голосни́й звук — це верхови́на й осно́ва ко́жного скла́ду."
  - statement: "У сло́ві «со́рок» три склади́."
    correct: false
    explanation: "У сло́ві «со́рок» два голосни́х зву́ки [о], то́му в ньо́му два склади́."
  - statement: "Звук [и] нале́жить до шести́ голосних зву́ків украї́нської мо́ви."
    correct: true
    explanation: "В украї́нській мо́ві шість голосних зву́ків, і [и] — оди́н із них."
  - statement: "Бу́ква К познача́є сона́нт."
    correct: false
    explanation: "Бу́ква К познача́є глухи́й проривни́й звук [k], а сона́нт познача́є Р."
  - statement: "Слова́ «бу́ква» та «лі́тера» є сино́німами в украї́нській мо́ві."
    correct: true
    explanation: "Оби́два слова́ станда́ртні й означа́ють графі́чний знак для зву́ка."
  - statement: "Кі́лькість складів у сло́ві зале́жить від кі́лькості при́голосних."
    correct: false
    explanation: "Кі́лькість складів зале́жить ви́ключно від кі́лькості голосних."

- id: act-w204
  type: fill-in
  title: "Встав пропу́щену лі́теру — Fill in the missing letter"
  instruction: "Обері́ть прави́льну лі́теру на мі́сці про́пуску ___ ."
  items:
  - sentence: "Он ___ука́."
    options:
    - р
    - к
    - м
    answer: р
    explanation: "Сло́во «рука́» почина́ється з лі́тери р."
  - sentence: "Он со́___ок."
    options:
    - р
    - к
    - с
    answer: р
    explanation: "Сло́во «со́рок» ма́є лі́теру р у дру́гому скла́ді."
  - sentence: "У нас с___ла."
    options:
    - и
    - у
    - а
    answer: и
    explanation: "Сло́во «си́ла» ма́є голосни́й звук [и]."
  - sentence: "Он ___и́нок."
    options:
    - р
    - к
    - н
    answer: р
    explanation: "Сло́во «ри́нок» почина́ється з лі́тери р."
  - sentence: "Он ко___а́ сосни́."
    options:
    - р
    - к
    - м
    answer: р
    explanation: "Сло́во «кора́» ма́є лі́теру р."
  - sentence: "У нас с___ак."
    options:
    - м
    - н
    - р
    answer: м
    explanation: "Сло́во «смак» ма́є сона́нт м."

- id: act-w205
  type: unjumble
  title: "Склади́ сло́во з лі́тер — Unjumble the word"
  instruction: "Поста́вте лі́тери в прави́льному поря́дку, щоб утвори́ти сло́во."
  items:
  - letters:
    - р
    - а
    - к
    answer: рак
  - letters:
    - м
    - а
    - к
    answer: мак
  - letters:
    - к
    - р
    - а
    - н
    answer: кран
  - letters:
    - с
    - и
    - н
    answer: син
  - letters:
    - к
    - у
    - м
    answer: кум
  - letters:
    - с
    - м
    - а
    - к
    answer: смак
