inline:
- id: act-301
  type: quiz
  title: Яке́ пита́льне сло́во обра́ти?
  instruction: Обері́ть пра́вильне пита́льне сло́во для ко́жного іме́нника.
  items:
  - prompt: нова́ ла́мпа
    options:
    - text: Я́ка?
      correct: true
    - text: Яки́й?
      correct: false
    - text: Яке́?
      correct: false
    explanation: Ла́мпа — іме́нник жіно́чого ро́ду, тому́ ста́вимо запита́ння «Я́ка?».
  - prompt: чи́стий стіл
    options:
    - text: Яки́й?
      correct: true
    - text: Я́ка?
      correct: false
    - text: Які́?
      correct: false
    explanation: Стіл — іме́нник чолові́чого ро́ду, тому́ пита́ємо «Яки́й?».
  - prompt: старе́ лі́жко
    options:
    - text: Яке́?
      correct: true
    - text: Я́ка?
      correct: false
    - text: Яки́й?
      correct: false
    explanation: Лі́жко — іме́нник сере́днього ро́ду, тому́ пита́ємо «Яке́?».
  - prompt: ціка́ві кни́ги
    options:
    - text: Які́?
      correct: true
    - text: Яке́?
      correct: false
    - text: Яки́й?
      correct: false
    explanation: Кни́ги — це множина́, тому́ вжива́ємо «Які́?».
  - prompt: га́рне вікно́
    options:
    - text: Яке́?
      correct: true
    - text: Яки́й?
      correct: false
    - text: Я́ка?
      correct: false
    explanation: Вікно́ — іме́нник сере́днього ро́ду, пита́ємо «Яке́?».
  - prompt: смачни́й суп
    options:
    - text: Яки́й?
      correct: true
    - text: Я́ка?
      correct: false
    - text: Яке́?
      correct: false
    explanation: Суп — іме́нник чолові́чого ро́ду, тому́ пита́ємо «Яки́й?».
- id: act-302
  type: fill-in
  title: Добері́ть пра́вильне закі́нчення
  instruction: Допо́вніть прикме́тник закі́нченням, узго́дженим із ро́дом іме́нника.
  items:
  - sentence: У мене́ є нов__ стіл.
    options:
    - ий
    - а
    - е
    answer: ий
    explanation: Стіл — чолові́чий рід, тому́ нови́й стіл.
  - sentence: Це ду́же гарн__ листі́вка.
    options:
    - а
    - ий
    - е
    answer: а
    explanation: Листі́вка — жіно́чий рід, тому́ га́рна листі́вка.
  - sentence: На столі́ лежи́ть стар__ фо́то.
    options:
    - е
    - ий
    - а
    answer: е
    explanation: Фо́то — сере́дній рід, тому́ старе́ фо́то.
  - sentence: Моя́ кімна́та мале́нька, ___ сві́тла.
    options:
    - але́
    - яки́й
    - я́ка
    answer: але́
    explanation: Сполу́чник але́ вка́зує на протиста́влення чи уто́чнення.
  - sentence: Це нов__ і кори́сний а́тлас.
    options:
    - ий
    - а
    - е
    answer: ий
    explanation: А́тлас — чолові́чий рід, тому́ нови́й а́тлас.
  - sentence: Тут стої́ть стар__ ла́мпа.
    options:
    - а
    - ий
    - е
    answer: а
    explanation: Ла́мпа — жіно́чий рід, тому́ стара́ ла́мпа.
- id: act-303
  type: match-up
  title: Поєдна́йте о́знаку з предме́том
  instruction: З'єдна́йте прикме́тник із відпові́дним іме́нником за ро́дом.
  pairs:
  - left: смачни́й
    right: суп
  - left: ціка́ва
    right: кни́га
  - left: чи́сте
    right: вікно́
  - left: стара́
    right: ла́мпа
  - left: нови́й
    right: стіл
  - left: га́рне
    right: фо́то
- id: act-304
  type: group-sort
  title: Сортува́ння словосполу́чень за ро́дом
  instruction: Розподілі́ть фра́зи за грамати́чним ро́дом іме́нника.
  groups:
  - label: Чолові́чий рід (він)
    items:
    - смачни́й суп
    - нови́й телефо́н
    - ціка́вий а́тлас
  - label: Жіно́чий рід (во́на)
    items:
    - стара́ ла́мпа
    - га́рна листі́вка
    - чи́ста кімна́та
  - label: Сере́дній рід (воно́)
    items:
    - чи́сте вікно́
    - старе́ фо́то
    - вели́ке лі́жко
- id: act-305
  type: true-false
  title: Переві́рка грамати́чних пра́вил
  instruction: Ви́значте, чи пра́вильне тве́рдження.
  items:
  - statement: Іме́нник жіно́чого ро́ду «ла́мпа» вжива́ється з прикме́тником «стара́».
    answer: true
    explanation: 'Ла́мпа жіно́чого ро́ду, тому́ закі́нчення -а: стара́ ла́мпа.'
  - statement: Для іме́нника «суп» пита́льним сло́вом є «Я́ка?».
    answer: false
    explanation: Суп — чолові́чий рід, пра́вильне пита́ння — «Яки́й?».
  - statement: Фра́за «Кни́га ціка́ва» в украї́нській мо́ві вжива́ється без дієслова́ «є».
    answer: true
    explanation: В описо́вих констру́кціях тепе́рішнього ча́су дієсло́во «є» зазвича́й опуска́ють.
  - statement: Прикме́тник «чи́сте» узго́джується з іме́нником «стіл».
    answer: false
    explanation: Стіл чолові́чого ро́ду, тре́ба сказа́ти «чи́стий стіл».
  - statement: У множині́ для всіх трьох роді́в у називно́му відмі́нку вжива́ємо закі́нчення
      -і.
    answer: true
    explanation: 'У початко́вому ку́рсі A1 множина́ ма́є спі́льне закі́нчення -і: нові́ столи́,
      нові́ кни́ги, нові́ фо́то.'
  - statement: Словосполу́чення «га́рне фо́то» узго́джене пра́вильно.
    answer: true
    explanation: Фо́то сере́днього ро́ду, тому́ закі́нчення -е є нормати́вним.
workbook:
- id: act-w5
  type: translate
  title: Обери́ украї́нський рядо́к
  instruction: Choose the Ukrainian sentence that matches the English cue.
  items:
  - source: My room is small but nice.
    options:
    - text: Моя́ кімна́та мале́нька, але́ га́рна.
      correct: true
    - text: Мій кімна́та мале́нький, але́ га́рний.
      correct: false
    - text: Моє́ кімна́та мале́ньке, але́ га́рне.
      correct: false
    explanation: Кімна́та is feminine.
  - source: The table is new and clean.
    options:
    - text: Стіл нови́й і чи́стий.
      correct: true
    - text: Стіл нова́ і чи́ста.
      correct: false
    - text: Стіл нове́ і чи́сте.
      correct: false
    explanation: Стіл is masculine.
  - source: The photo is old.
    options:
    - text: Фо́то старе́.
      correct: true
    - text: Фо́то стара́.
      correct: false
    - text: Фо́то стари́й.
      correct: false
    explanation: Фо́то is neuter in this lesson.
  - source: A cheap postcard
    options:
    - text: деше́ва листі́вка
      correct: true
    - text: деше́вий листі́вка
      correct: false
    - text: деше́ве листі́вка
      correct: false
    explanation: Листі́вка is feminine.
  - source: Good afternoon.
    options:
    - text: До́брий день.
      correct: true
    - text: До́бра день.
      correct: false
    - text: До́бре день.
      correct: false
    explanation: День is masculine, so the greeting is До́брий день.
  - source: The books are interesting.
    options:
    - text: Кни́ги ціка́ві.
      correct: true
    - text: Кни́ги ціка́ва.
      correct: false
    - text: Кни́ги ціка́ве.
      correct: false
    explanation: Plural phrases use ціка́ві.
- id: act-w6
  type: true-false
  title: Швидка́ переві́рка
  instruction: Decide if the statement is right.
  items:
  - statement: Стіл нови́й.
    answer: true
    explanation: Стіл is masculine, so нови́й is correct.
  - statement: Кни́га нове́.
    answer: false
    explanation: Кни́га is feminine; say Кни́га нова́.
  - statement: Вікно́ чи́сте.
    answer: true
    explanation: Вікно́ is neuter.
  - statement: Яки́й кімна́та?
    answer: false
    explanation: Кімна́та is feminine; ask Я́ка кімна́та?
  - statement: Кімна́та мале́нька, але́ га́рна.
    answer: true
    explanation: Both adjectives agree with кімна́та.
  - statement: 'В украї́нській мо́жна описа́ти річ без є: Кни́га ціка́ва.'
    answer: true
    explanation: This no-є present-tense frame is normal.
- id: act-w301
  type: fill-in
  title: Закрі́плення закі́нчень
  instruction: Вста́вте пра́вильну фо́рму прикме́тника.
  items:
  - sentence: Сергі́й ду́же ___ хло́пчик.
    options:
    - розу́мний
    - розу́мна
    - розу́мне
    answer: розу́мний
    explanation: Хло́пчик — чолові́чий рід.
  - sentence: Тара́с і́ноді ___, але́ він стара́ється.
    options:
    - ліни́вий
    - ліни́ва
    - ліни́ве
    answer: ліни́вий
    explanation: Тара́с — чолові́чий рід.
  - sentence: Це ___ при́клад у зо́шиті.
    options:
    - пра́вильний
    - пра́вильна
    - пра́вильне
    answer: пра́вильний
    explanation: При́клад — чолові́чий рід.
  - sentence: На столі́ стої́ть ___ ла́мпа.
    options:
    - стара́
    - стари́й
    - старе́
    answer: стара́
    explanation: Ла́мпа — жіно́чий рід.
  - sentence: Це ___ і чи́стий стіл.
    options:
    - нови́й
    - нова́
    - нове́
    answer: нови́й
    explanation: Стіл — чолові́чий рід.
  - sentence: У кімна́ті є ___ і га́рне вікно́.
    options:
    - чи́сте
    - чи́стий
    - чи́ста
    answer: чи́сте
    explanation: Вікно́ — сере́дній рід.
- id: act-w302
  type: match-up
  title: 'Анто́німи: протиле́жні о́знаки'
  instruction: З'єдна́йте прикме́тники-анто́німи.
  pairs:
  - left: нови́й
    right: стари́й
  - left: вели́кий
    right: мале́нький
  - left: чи́стий
    right: брудни́й
  - left: дороги́й
    right: деше́вий
  - left: сві́тлий
    right: те́мний
  - left: га́рний
    right: пога́ний
- id: act-w303
  type: group-sort
  title: Групува́ння за запита́нням
  instruction: Розподілі́ть фра́зи за запита́нням, на яке́ во́ни відповіда́ють.
  groups:
  - label: Яки́й?
    items:
    - розу́мний уче́нь
    - пра́вильний ви́бір
    - смачни́й чай
  - label: Я́ка?
    items:
    - ціка́ва істо́рія
    - чи́ста ча́шка
    - стара́ ла́мпа
  - label: Яке́?
    items:
    - га́рне мі́сто
    - чи́сте вікно́
    - нове́ лі́жко
- id: act-w304
  type: quiz
  title: Приро́дні ре́чення в украї́нській мо́ві
  instruction: Обері́ть приро́дний варіа́нт ре́чення.
  items:
  - prompt: The atlas is old but interesting.
    options:
    - text: А́тлас стари́й, але́ ціка́вий.
      correct: true
    - text: А́тлас є стари́й, але́ ціка́вий.
      correct: false
    - text: А́тлас стара́, але́ ціка́ва.
      correct: false
    explanation: В украї́нській мо́ві дієсло́во «є» опуска́ється, а прикме́тники узго́джуються
      з а́тлас (чолові́чий рід).
  - prompt: The room is clean and bright.
    options:
    - text: Кімна́та чи́ста і сві́тла.
      correct: true
    - text: Кімна́та чи́стий і сві́тлий.
      correct: false
    - text: Кімна́та є чи́ста.
      correct: false
    explanation: 'Кімна́та — жіно́чий рід: чи́ста і сві́тла.'
  - prompt: I have a new table and an old lamp.
    options:
    - text: У мене́ є нови́й стіл і стара́ ла́мпа.
      correct: true
    - text: У мене́ є нова́ стіл і стари́й ла́мпа.
      correct: false
    - text: У мене́ нови́й стіл і старе́ ла́мпа.
      correct: false
    explanation: Стіл чолові́чого ро́ду (нови́й), а ла́мпа — жіно́чого (стара́).
  - prompt: What is the bed like?
    options:
    - text: Яке́ лі́жко?
      correct: true
    - text: Яки́й лі́жко?
      correct: false
    - text: Я́ка лі́жко?
      correct: false
    explanation: 'Лі́жко сере́днього ро́ду: Яке́ лі́жко?'
  - prompt: This is a very tasty soup.
    options:
    - text: Це ду́же смачни́й суп.
      correct: true
    - text: Це ду́же смачне́ суп.
      correct: false
    - text: Це ду́же смачна́ суп.
      correct: false
    explanation: Суп чолові́чого ро́ду, вжива́ємо смачни́й.
  - prompt: The postcards are cheap.
    options:
    - text: Листі́вки деше́ві.
      correct: true
    - text: Листі́вки деше́ва.
      correct: false
    - text: Листі́вки деше́вий.
      correct: false
    explanation: 'Листі́вки — множина́, тому́ закі́нчення -і: деше́ві.'
- id: act-w305
  type: unjumble
  title: Складі́ть ре́чення зі слів
  instruction: Розташу́йте слова́ у пра́вильній послідо́вності, щоб утвори́ти ре́чення.
  items:
  - words:
    - Це
    - моя́
    - мале́нька
    - кімна́та.
    answer: Це моя́ мале́нька кімна́та.
  - words:
    - Стіл
    - нови́й,
    - а
    - стіле́ць
    - стари́й.
    answer: Стіл нови́й, а стіле́ць стари́й.
  - words:
    - У
    - мене́
    - є
    - ціка́ва
    - кни́га.
    answer: У мене́ є ціка́ва кни́га.
  - words:
    - Вікно́
    - вели́ке
    - і
    - чи́сте.
    answer: Вікно́ вели́ке і чи́сте.
  - words:
    - А́тлас
    - стари́й,
    - але́
    - ду́же
    - кори́сний.
    answer: А́тлас стари́й, але́ ду́же кори́сний.
  - words:
    - Це
    - ду́же
    - смачни́й
    - суп.
    answer: Це ду́же смачни́й суп.
