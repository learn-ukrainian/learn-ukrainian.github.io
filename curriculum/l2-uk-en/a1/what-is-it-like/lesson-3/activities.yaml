inline:
- id: act-301
  type: match-up
  title: Узго́дження прикме́тників — Adjective agreement
  instruction: З'єдна́йте прикме́тник із відповідним іме́нником за ро́дом. —
    Match the adjective with the matching noun by gender.
  pairs:
  - left: ціка́вий
    right: атлас
  - left: ціка́ва
    right: кни́га
  - left: ціка́ве
    right: фо́то
  - left: смачни́й
    right: суп
  - left: чи́ста
    right: кімна́та
  - left: чи́сте
    right: вікно́
- id: act-302
  type: fill-in
  title: Фо́рми прикме́тників — Adjective forms
  instruction: Обері́ть правильне закі́нчення або́ сло́во для ко́жного речення. —
    Choose the correct ending or word for each sentence.
  items:
  - sentence: У мене́ є нов__ стіл.
    answer: ий
    options:
    - ий
    - а
    - е
    explanation: Стіл — чолові́чий рід, тому́ нови́й стіл.
  - sentence: Це ду́же гарн__ листі́вка.
    answer: а
    options:
    - а
    - ий
    - е
    explanation: Листі́вка — жіно́чий рід, тому́ га́рна листі́вка.
  - sentence: На столі́ лежи́ть стар__ фо́то.
    answer: е
    options:
    - е
    - ий
    - а
    explanation: Фо́то — сере́дній рід, тому́ старе́ фо́то.
  - sentence: Моя́ кімна́та мале́нька, ___ сві́тла.
    answer: але́
    options:
    - але́
    - яки́й
    - яка
    explanation: Сполу́чник але́ вка́зує на протиста́влення чи уто́чнення.
  - sentence: Це нов__ і ко́ри́сний атлас.
    answer: ий
    options:
    - ий
    - а
    - е
    explanation: Атлас — чолові́чий рід, тому́ нови́й атлас.
  - sentence: Тут стої́ть стар__ ла́мпа.
    answer: а
    options:
    - а
    - ий
    - е
    explanation: Ла́мпа — жіно́чий рід, тому́ стара́ ла́мпа.
- id: act-303
  type: group-sort
  title: Розпо́діл за родами — Sorting by genders
  instruction: Розподілі́ть словосполу́чення за родами іме́нників. — Sort the phrases by noun gender.
  groups:
  - label: Чолові́чий рід (Він)
    items:
    - смачни́й суп
    - правильний приклад
  - label: Жіно́чий рід (Вона́)
    items:
    - ціка́ва кни́га
    - стара́ ла́мпа
  - label: Сере́дній рід (Воно́)
    items:
    - чи́сте вікно́
    - га́рне фо́то
- id: act-304
  type: quiz
  title: Обери́ то́чний о́пис — Choose the accurate description
  instruction: Обері́ть правильний варіа́нт о́пису предме́та. — Choose the correct description of the object.
  items:
  - prompt: Яки́й атлас?
    options:
    - text: нови́й атлас
      correct: true
    - text: нова́ атлас
      correct: false
    - text: нове́ атлас
      correct: false
    explanation: Атлас — іме́нник чолові́чого ро́ду.
  - prompt: Яка кімна́та?
    options:
    - text: чи́ста кімна́та
      correct: true
    - text: чи́стий кімна́та
      correct: false
    - text: чи́сте кімна́та
      correct: false
    explanation: Кімна́та — іме́нник жіно́чого ро́ду.
  - prompt: Яке́ вікно́?
    options:
    - text: вели́ке вікно́
      correct: true
    - text: вели́кий вікно́
      correct: false
    - text: вели́ка вікно́
      correct: false
    explanation: Вікно́ — іме́нник сере́днього ро́ду.
  - prompt: Яки́й суп?
    options:
    - text: смачни́й суп
      correct: true
    - text: смачна́ суп
      correct: false
    - text: смачне́ суп
      correct: false
    explanation: Суп — іме́нник чолові́чого ро́ду.
  - prompt: Яка листі́вка?
    options:
    - text: га́рна листі́вка
      correct: true
    - text: га́рний листі́вка
      correct: false
    - text: га́рне листі́вка
      correct: false
    explanation: Листі́вка — іме́нник жіно́чого ро́ду.
  - prompt: Яке́ фо́то?
    options:
    - text: ціка́ве фо́то
      correct: true
    - text: ціка́вий фо́то
      correct: false
    - text: ціка́ва фо́то
      correct: false
    explanation: Фо́то — іме́нник сере́днього ро́ду.
- id: act-305
  type: odd-one-out
  title: Знайди́ за́йве — Find the odd one out
  instruction: Знайді́ть словосполу́чення, яке́ відрізня́ється за грамати́чним ро́дом. —
    Find the phrase that differs in grammatical gender.
  items:
  - options:
    - text: ціка́ва кни́га
      correct: false
    - text: чи́ста кімна́та
      correct: false
    - text: смачни́й суп
      correct: true
    - text: стара́ ла́мпа
      correct: false
    explanation: Смачни́й суп — чолові́чий рід, і́нші словосполу́чення — жіно́чого ро́ду.
  - options:
    - text: нови́й стіл
      correct: false
    - text: вели́кий плака́т
      correct: false
    - text: стари́й атлас
      correct: false
    - text: чи́сте вікно́
      correct: true
    explanation: Чи́сте вікно́ — сере́дній рід, і́нші словосполу́чення — чолові́чого ро́ду.
  - options:
    - text: га́рне фо́то
      correct: false
    - text: вели́ке лі́жко
      correct: false
    - text: нова́ листі́вка
      correct: true
    - text: чи́сте дзе́ркало
      correct: false
    explanation: Нова́ листі́вка — жіно́чий рід, і́нші словосполу́чення — сере́днього ро́ду.
  - options:
    - text: розу́мний хло́пчик
      correct: false
    - text: ліни́вий у́чень
      correct: false
    - text: правильний приклад
      correct: false
    - text: акти́вна жі́нка
      correct: true
    explanation: Акти́вна жі́нка — жіно́чий рід, і́нші словосполу́чення — чолові́чого ро́ду.
  - options:
    - text: чи́ста кімна́та
      correct: false
    - text: стара́ ла́мпа
      correct: false
    - text: нови́й телефо́н
      correct: true
    - text: га́рна листі́вка
      correct: false
    explanation: Но́вий телефо́н — чолові́чий рід, і́нші словосполу́чення — жіно́чого ро́ду.
  - options:
    - text: старе́ лі́жко
      correct: false
    - text: нови́й атлас
      correct: true
    - text: ціка́ве фо́то
      correct: false
    - text: вели́ке вікно́
      correct: false
    explanation: Но́вий атлас — чолові́чий рід, і́нші словосполу́чення — сере́днього ро́ду.
workbook:
- id: act-w5
  type: translate
  title: Обери́ украї́нський рядо́к — Choose the Ukrainian line
  instruction: Choose the Ukrainian sentence that matches the English cue.
  items:
  - source: My room is small but nice.
    options:
    - text: Моя́ кімна́та мале́нька, але́ га́рна.
      correct: true
    - text: Мій кімна́та мале́нький, але́ га́рний.
      correct: false
    - text: Моє́ кімна́та мале́ньке, але́ га́рне.
      correct: false
    explanation: Кімна́та is feminine.
  - source: The table is new and clean.
    options:
    - text: Стіл нови́й і чи́стий.
      correct: true
    - text: Стіл нова́ і чи́ста.
      correct: false
    - text: Стіл нове́ і чи́сте.
      correct: false
    explanation: Стіл is masculine.
  - source: The photo is old.
    options:
    - text: Фо́то старе́.
      correct: true
    - text: Фо́то стара́.
      correct: false
    - text: Фо́то стари́й.
      correct: false
    explanation: Фо́то is neuter in this lesson.
  - source: A cheap postcard
    options:
    - text: деше́ва листі́вка
      correct: true
    - text: деше́вий листі́вка
      correct: false
    - text: деше́ве листі́вка
      correct: false
    explanation: Листі́вка is feminine.
  - source: Good afternoon.
    options:
    - text: До́брий день.
      correct: true
    - text: До́бра день.
      correct: false
    - text: До́бре день.
      correct: false
    explanation: День is masculine, so the greeting is До́брий день.
  - source: The books are interesting.
    options:
    - text: Кни́ги ціка́ві.
      correct: true
    - text: Кни́ги ціка́ва.
      correct: false
    - text: Кни́ги ціка́ве.
      correct: false
    explanation: Plural phrases use ціка́ві.
- id: act-w6
  type: true-false
  title: Швидка́ пере́ві́рка — Quick check
  instruction: Decide if the statement is right.
  items:
  - statement: Стіл нови́й.
    answer: true
    explanation: Стіл is masculine, so нови́й is correct.
  - statement: Кни́га нове́.
    answer: false
    explanation: Кни́га is feminine; say Кни́га нова́.
  - statement: Вікно́ чи́сте.
    answer: true
    explanation: Вікно́ is neuter.
  - statement: Яки́й кімна́та?
    answer: false
    explanation: Кімна́та is feminine; ask Яка кімна́та?
  - statement: Кімна́та мале́нька, але́ га́рна.
    answer: true
    explanation: Both adjectives agree with кімна́та.
  - statement: 'В украї́нській мо́жна описа́ти річ без є: Кни́га ціка́ва.'
    answer: true
    explanation: This no-є present-tense frame is normal.
- id: act-w301
  type: fill-in
  title: Закрі́плення закі́нчень — Practicing the endings
  instruction: Вста́вте правильну фо́рму прикме́тника. — Insert the correct adjective form.
  items:
  - sentence: Сергі́й ду́же ___ хло́пчик.
    answer: розу́мний
    options:
    - розу́мний
    - розу́мна
    - розу́мне
    explanation: Хло́пчик — чолові́чий рід.
  - sentence: Тара́с і́ноді ___, але́ він стара́ється.
    answer: ліни́вий
    options:
    - ліни́вий
    - ліни́ва
    - ліни́ве
    explanation: Тара́с — чолові́чий рід.
  - sentence: Це ___ приклад у зо́шиті.
    answer: правильний
    options:
    - правильний
    - правильна
    - правильне
    explanation: Приклад — чолові́чий рід.
  - sentence: На столі́ стої́ть ___ ла́мпа.
    answer: стара́
    options:
    - стара́
    - стари́й
    - старе́
    explanation: Ла́мпа — жіно́чий рід.
  - sentence: Це ___ і чи́стий стіл.
    answer: нови́й
    options:
    - нови́й
    - нова́
    - нове́
    explanation: Стіл — чолові́чий рід.
  - sentence: У кімна́ті є ___ і га́рне вікно́.
    answer: чи́сте
    options:
    - чи́сте
    - чи́стий
    - чи́ста
    explanation: Вікно́ — сере́дній рід.
- id: act-w302
  type: unjumble
  title: Склади речення — Build the sentence
  instruction: Розста́вте слова́ у правильному поря́дку, щоб утвори́ти речення. —
    Put the words in the correct order to form a sentence.
  items:
  - words:
    - Це
    - моя́
    - мале́нька
    - кімна́та.
    sentence: Це моя́ мале́нька кімна́та.
    explanation: Це моя́ мале́нька кімна́та.
  - words:
    - Стіл
    - нови́й
    - і
    - чи́стий.
    sentence: Стіл нови́й і чи́стий.
    explanation: Стіл нови́й і чи́стий.
  - words:
    - У
    - мене́
    - є
    - стара́
    - ла́мпа.
    sentence: У мене́ є стара́ ла́мпа.
    explanation: У мене́ є стара́ ла́мпа.
  - words:
    - Це
    - ду́же
    - ціка́ва
    - кни́га.
    sentence: Це ду́же ціка́ва кни́га.
    explanation: Це ду́же ціка́ва кни́га.
  - words:
    - Стіл
    - нови́й,
    - а
    - стіле́ць
    - стари́й.
    sentence: Стіл нови́й, а стіле́ць стари́й.
    explanation: Стіл нови́й, а стіле́ць стари́й.
  - words:
    - Кімна́та
    - мале́нька,
    - але́
    - га́рна.
    sentence: Кімна́та мале́нька, але́ га́рна.
    explanation: Кімна́та мале́нька, але́ га́рна.
- id: act-w303
  type: match-up
  title: Іме́нник та озна́ка — Noun and quality
  instruction: Поєдна́йте предме́т із відповідним о́писом. — Match the object with the matching description.
  pairs:
  - left: нови́й стіл
    right: чи́стий
  - left: мале́нька кімна́та
    right: сві́тла
  - left: вели́ке вікно́
    right: чи́сте
  - left: стари́й атлас
    right: ко́ри́сний
  - left: гаря́чий суп
    right: смачни́й
  - left: нова́ кни́га
    right: ціка́ва
- id: act-w304
  type: error-correction
  title: Ви́прав помилки́ в ро́дах — Fix the gender mistakes
  instruction: Знайді́ть і ви́правте по́ми́лку в узго́дженні ро́ду. — Find and fix the gender agreement mistake.
  items:
  - sentence: Це нова́ атлас.
    error: нова́
    answer: нови́й
    options:
    - нови́й
    - нова́
    - нове́
    explanation: Атлас — чолові́чий рід, тому́ нови́й атлас.
  - sentence: У мене́ є ціка́вий кни́га.
    error: ціка́вий
    answer: ціка́ва
    options:
    - ціка́ва
    - ціка́вий
    - ціка́ве
    explanation: Кни́га — жіно́чий рід, тому́ ціка́ва кни́га.
  - sentence: Тут стої́ть стари́й ла́мпа.
    error: стари́й
    answer: стара́
    options:
    - стара́
    - стари́й
    - старе́
    explanation: Ла́мпа — жіно́чий рід, тому́ стара́ ла́мпа.
  - sentence: Це га́рний фо́то.
    error: га́рний
    answer: га́рне
    options:
    - га́рне
    - га́рний
    - га́рна
    explanation: Фо́то — сере́дній рід, тому́ га́рне фо́то.
  - sentence: Стіл нова́ і чи́ста.
    error: нова́ і чи́ста
    answer: нови́й і чи́стий
    options:
    - нови́й і чи́стий
    - нова́ і чи́ста
    - нове́ і чи́сте
    explanation: Стіл — чолові́чий рід.
  - sentence: Вікно́ вели́кий і сві́тлий.
    error: вели́кий і сві́тлий
    answer: вели́ке і сві́тле
    options:
    - вели́ке і сві́тле
    - вели́кий і сві́тлий
    - вели́ка і сві́тла
    explanation: Вікно́ — сере́дній рід.
- id: act-w305
  type: group-sort
  title: Сортува́ння за озна́ками — Sorting by qualities
  instruction: Розподілі́ть прикме́тники за гру́пами озна́к. — Sort the adjectives into groups of qualities.
  groups:
  - label: Розмір і вік
    items:
    - вели́кий
    - мале́нький
    - стари́й
  - label: Я́кість і оці́нка
    items:
    - га́рний
    - пога́ний
    - смачни́й
  - label: Сві́тло і стан
    items:
    - чи́стий
    - сві́тлий
    - те́мний
