    options:
    - text: Стіл нови́й, але́ лі́жко старе́.
      correct: true
    - text: Стіл нова́, але́ лі́жко стара́.
      correct: false
    - text: Стіл нове́, але́ лі́жко стари́й.
      correct: false
    explanation: Стіл — чолові́чий рід (нови́й), а лі́жко — сере́дній рід (старе́).
  - source: The postcard is cheap.
    options:
    - text: Листі́вка деше́ва.
      correct: true
    - text: Листі́вка деше́вий.
      correct: false
    - text: Листі́вка деше́ве.
      correct: false
    explanation: Листі́вка — жіно́чий рід (деше́ва).
  - source: The window is clean.
    options:
    - text: Вікно́ чи́сте.
      correct: true
    - text: Вікно́ чи́стий.
      correct: false
    - text: Вікно́ чи́ста.
      correct: false
    explanation: Вікно́ — сере́дній рід (чи́сте).
  - source: A dirty mirror
    options:
    - text: брудне́ дзе́ркало
      correct: true
    - text: брудни́й дзе́ркало
      correct: false
