  - words:
    - А́тлас
    - стари́й
    - але́
    - кори́сний
    answer: А́тлас стари́й, але́ кори́сний.
  - words:
    - Ця
    - листі́вка
    - мале́нька
    - але́
    - га́рна
    answer: Ця листі́вка мале́нька, але́ га́рна.
  - words:
    - Нови́й
    - плака́т
    - вели́кий
    - і
    - деше́вий
    answer: Нови́й плака́т вели́кий і деше́вий.
- id: act-w205
  type: translate
  title: Пере́клад украї́нською
  instruction: Обері́ть пра́вильний украї́нський пере́клад для ре́чення англі́йською мо́вою.
  items:
  - source: The room is small but nice.
    options:
    - text: Кімна́та мале́нька, але́ га́рна.
      correct: true
    - text: Кімна́та мале́нький, але́ га́рний.
      correct: false
    - text: Кімна́та мале́ньке, але́ га́рне.
      correct: false
    explanation: 'Кімна́та — жіно́чий рід: мале́нька, але́ га́рна.'
  - source: The table is new and clean.
    options:
    - text: Стіл нови́й і чи́стий.
      correct: true
    - text: Стіл нова́ і чи́ста.
      correct: false
    - text: Стіл нове́ і чи́сте.
      correct: false
    explanation: 'Стіл — чолові́чий рід: нови́й і чи́стий.'
  - source: The window is big.
    options:
    - text: Вікно́ вели́ке.
      correct: true
    - text: Вікно́ вели́кий.
      correct: false
    - text: Вікно́ ве́лика.
      correct: false
    explanation: 'Вікно́ — сере́дній рід: вели́ке.'
  - source: A cheap postcard
    options:
    - text: деше́ва листі́вка
      correct: true
    - text: деше́вий листі́вка
      correct: false
    - text: деше́ве листі́вка
      correct: false
    explanation: 'Листі́вка — жіно́чий рід: деше́ва листі́вка.'
