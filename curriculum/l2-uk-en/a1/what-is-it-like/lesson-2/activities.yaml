inline:
- id: act-4
  type: match-up
  title: Поєдна́й протиле́жності
  instruction: Match each adjective with its opposite.
  pairs:
  - left: вели́кий
    right: мале́нький
  - left: нови́й
    right: стари́й
  - left: га́рний
    right: пога́ний
  - left: чи́стий
    right: брудни́й
  - left: дороги́й
    right: деше́вий
  - left: сві́тлий
    right: те́мний
- id: act-201
  type: fill-in
  title: Сполу́чники і, а, але́
  instruction: Обері́ть пра́вильний сполу́чник для ко́жного ре́чення.
  items:
  - sentence: Стіл нови́й, ___ стіле́ць стари́й.
    answer: а
    options:
    - а
    - і
    - але́
    explanation: Сполу́чник а використо́вується для протиста́влення двох предме́тів.
  - sentence: Кімна́та ве́лика ___ сві́тла.
    answer: і
    options:
    - і
    - а
    - але́
    explanation: Сполу́чник і поє́днує дві рівнозна́чні о́знаки.
  - sentence: А́тлас стари́й, ___ кори́сний.
    answer: але́
    options:
    - але́
    - і
    - а
    explanation: Сполу́чник але́ додає́ уто́чнення або́ обме́ження.
  - sentence: Кни́га доро́га, ___ листі́вка деше́ва.
    answer: а
    options:
    - а
    - і
    - але́
    explanation: 'Тут протиставля́ються дві рі́зні ре́чі: кни́га та листі́вка.'
  - sentence: Вікно́ вели́ке ___ чи́сте.
    answer: і
    options:
    - і
    - а
    - але́
    explanation: Сполу́чник і поє́днує рівнозна́чні власти́вості ві́кна.
  - sentence: Плака́т вели́кий, ___ деше́вий.
    answer: але́
    options:
    - але́
    - а
    - і
    explanation: Сполу́чник але́ вка́зує на несподі́вану о́знаку (вели́кий, проте́ деше́вий).
- id: act-204
  type: group-sort
  title: Протиле́жні о́знаки
  instruction: Розподілі́ть прикме́тники за темати́чними гру́пами о́знак.
  groups:
  - label: Ро́змір та вік
    items:
    - вели́кий
    - мале́нький
    - нови́й
    - стари́й
  - label: Я́кість та чистота́
    items:
    - га́рний
    - пога́ний
    - чи́стий
    - брудни́й
  - label: Ціна́ та сві́тло
    items:
    - дороги́й
    - деше́вий
    - сві́тлий
    - те́мний
- id: act-202
  type: quiz
  title: Яки́й це предме́т?
  instruction: Обері́ть пра́вильну фо́рму прикме́тника для узго́дження з іме́нником.
  items:
  - prompt: стіл (нови́й / нова́ / нове́)
    options:
    - text: нови́й стіл
      correct: true
    - text: нова́ стіл
      correct: false
    - text: нове́ стіл
      correct: false
    explanation: Стіл — іме́нник чолові́чого ро́ду, тому́ вжива́ємо нови́й.
  - prompt: кімна́та (сві́тлий / сві́тла / сві́тле)
    options:
    - text: сві́тла кімна́та
      correct: true
    - text: сві́тлий кімна́та
      correct: false
    - text: сві́тле кімна́та
      correct: false
    explanation: 'Кімна́та — жіно́чий рід, тому́ закі́нчення -а: сві́тла.'
  - prompt: вікно́ (чи́стий / чи́ста / чи́сте)
    options:
    - text: чи́сте вікно́
      correct: true
    - text: чи́стий вікно́
      correct: false
    - text: чи́ста вікно́
      correct: false
    explanation: Вікно́ — сере́дній рід, тому́ вжива́ємо чи́сте.
  - prompt: листі́вка (деше́вий / деше́ва / деше́ве)
    options:
    - text: деше́ва листі́вка
      correct: true
    - text: деше́вий листі́вка
      correct: false
    - text: деше́ве листі́вка
      correct: false
    explanation: Листі́вка — жіно́чий рід, тому́ вжива́ємо деше́ва.
  - prompt: телефо́н (дороги́й / доро́га / дороге́)
    options:
    - text: дороги́й телефо́н
      correct: true
    - text: доро́га телефо́н
      correct: false
    - text: дороге́ телефо́н
      correct: false
    explanation: Телефо́н — чолові́чий рід, тому́ вжива́ємо дороги́й.
  - prompt: дзе́ркало (брудни́й / брудна́ / брудне́)
    options:
    - text: брудне́ дзе́ркало
      correct: true
    - text: брудни́й дзе́ркало
      correct: false
    - text: брудна́ дзе́ркало
      correct: false
    explanation: Дзе́ркало — сере́дній рід, тому́ вжива́ємо брудне́.
- id: act-203
  type: true-false
  title: Пра́вда чи ні?
  instruction: Ви́значте, чи пра́вильне тве́рдження про о́знаки предме́тів.
  items:
  - statement: Анто́нім до слова́ «вели́кий» — це «мале́нький».
    answer: true
    explanation: Вели́кий і мале́нький — це антонімі́чна па́ра за ро́зміром.
  - statement: Анто́нім до слова́ «нови́й» — це «чи́стий».
    answer: false
    explanation: Анто́нім до слова́ нови́й — це стари́й.
  - statement: Сполу́чник «а» поє́днує одна́кові о́знаки, а не протиставля́є ре́чі.
    answer: false
    explanation: Сполу́чник а використо́вується саме́ для протиста́влення.
  - statement: У ре́ченні «Стіл нови́й і чи́стий» сполу́чник «і» поє́днує дві о́знаки стола́.
    answer: true
    explanation: Сполу́чник і поє́днує дві рівнозна́чні характери́стики одно́го предме́та.
  - statement: 'Украї́нською мо́вою приро́дно сказа́ти: «Цей суп ду́же смачни́й».'
    answer: true
    explanation: Смачни́й — це нормати́вне украї́нське сло́во за́мість ка́льки вкусний.
  - statement: 'В украї́нській мо́ві обов''язково каза́ти: «Він є до́брий студе́нт».'
    answer: false
    explanation: 'У тепе́рішньому ча́сі дієсло́во є зазвича́й опуска́ється: Він до́брий
      студе́нт.'
workbook:
- id: act-w3
  type: error-correction
  title: Випра́в узго́дження прикме́тників
  instruction: Fix the adjective or sentence frame.
  items:
  - sentence: Він є до́брий студе́нт.
    error: Він є до́брий студе́нт.
    answer: Він до́брий студе́нт.
    options:
    - Він до́брий студе́нт.
    - Він до́бра студе́нт.
    - Він є до́бра студе́нт.
    explanation: In this present-tense frame, Ukrainian normally omits є.
  - sentence: Це га́рна хло́пець.
    error: Це га́рна хло́пець.
    answer: Це га́рний хло́пець.
    options:
    - Це га́рний хло́пець.
    - Це га́рне хло́пець.
    - Це га́рна хло́пець.
    explanation: Хло́пець is masculine.
  - sentence: Яки́й твоє́ ім'я́?
    error: Яки́й твоє́ ім'я́?
    answer: 'Яке́ твоє́ ім''я? (або́: Як тебе́ зва́ти?)'
    options:
    - 'Яке́ твоє́ ім''я? (або́: Як тебе́ зва́ти?)'
    - Я́ка твоє́ ім'я́?
    - Яки́й твоє́ ім'я́?
    explanation: Ім'я́ is neuter; in real introductions, use Як тебе́ зва́ти?
  - sentence: Це ціка́вий кни́га.
    error: Це ціка́вий кни́га.
    answer: Це ціка́ва кни́га.
    options:
    - Це ціка́ва кни́га.
    - Це ціка́вий кни́га.
    - Це ціка́ве кни́га.
    explanation: Кни́га is feminine, so use ціка́ва.
  - sentence: Моя́ ка́ва смачни́й.
    error: Моя́ ка́ва смачни́й.
    answer: Моя́ ка́ва смачна́.
    options:
    - Моя́ ка́ва смачна́.
    - Моя́ ка́ва смачни́й.
    - Моя́ ка́ва смачне́.
    explanation: Ка́ва is feminine, so use смачна́.
  - sentence: Це мій нови́й ру́чка.
    error: Це мій нови́й ру́чка.
    answer: Це моя́ нова́ ру́чка.
    options:
    - Це моя́ нова́ ру́чка.
    - Це мій нови́й ру́чка.
    - Це моє́ нове́ ру́чка.
    explanation: Ру́чка is feminine, so use моя́ and нова́.
- id: act-w4
  type: fill-in
  title: Випра́в прикме́тникові пастки́
  instruction: Choose the standard Ukrainian adjective.
  items:
  - sentence: Цей суп ду́же ___.
    answer: смачни́й
    options:
    - смачни́й
    - вкусний
    explanation: Use смачни́й for tasty.
  - sentence: У мене́ є ___ оліве́ць.
    answer: жо́втий
    options:
    - жо́втий
    - жолтий
    explanation: Use жо́втий.
  - sentence: У сусі́дки ___ кіт.
    answer: чо́рний
    options:
    - чо́рний
    - черний
    explanation: Use чо́рний.
  - sentence: Пра́пор ___, а не бі́лий.
    answer: черво́ний
    options:
    - черво́ний
    - кра́сний
    explanation: Use черво́ний for red in ordinary modern Ukrainian.
  - sentence: Це ___ фільм.
    answer: пога́ний
    options:
    - пога́ний
    - плохи́й
    explanation: Use пога́ний.
  - sentence: Це ___ ві́дповідь на запита́ння.
    answer: пра́вильна
    options:
    - пра́вильна
    - ві́рна
    explanation: Use пра́вильна ві́дповідь for a correct answer.
  - sentence: Дай мені́, будь ла́ска, ___ оліве́ць.
    answer: будь-яки́й
    options:
    - будь-яки́й
    - лю́бий
    explanation: Use the standard Ukrainian form for any.
  - sentence: Сергі́й — ___ хло́пчик.
    answer: розу́мний
    options:
    - розу́мний
    - умний
    explanation: Use розу́мний.
  - sentence: Тара́с — ___ уче́нь.
    answer: ліни́вий
    options:
    - ліни́вий
    - ленивий
    explanation: Use ліни́вий.
- id: act-w201
  type: match-up
  title: З'єдна́й анто́німи
  instruction: З'єдна́йте прикме́тники з протиле́жним зна́ченням.
  pairs:
  - left: нови́й
    right: стари́й
  - left: вели́кий
    right: мале́нький
  - left: чи́стий
    right: брудни́й
  - left: га́рний
    right: пога́ний
  - left: дороги́й
    right: деше́вий
  - left: сві́тлий
    right: те́мний
- id: act-w202
  type: fill-in
  title: Встав пра́вильний сполу́чник
  instruction: Вста́вте і, а або́ але́ відпові́дно до змі́сту ре́чення.
  items:
  - sentence: Кімна́та мале́нька, ___ га́рна.
    answer: але́
    options:
    - але́
    - і
    - а
    explanation: 'Сполу́чник але́ вка́зує на обме́ження: кімна́та мале́нька, проте́ га́рна.'
  - sentence: Стіл нови́й, ___ стіле́ць стари́й.
    answer: а
    options:
    - а
    - і
    - але́
    explanation: Сполу́чник а протиставля́є два предме́ти.
  - sentence: Вікно́ чи́сте ___ вели́ке.
    answer: і
    options:
    - і
    - а
    - але́
    explanation: Сполу́чник і поє́днує дві о́знаки ві́кна.
  - sentence: Кни́га нова́ ___ ціка́ва.
    answer: і
    options:
    - і
    - а
    - але́
    explanation: Сполу́чник і поє́днує рівнозна́чні о́знаки кни́ги.
  - sentence: Плака́т вели́кий, ___ деше́вий.
    answer: але́
    options:
    - але́
    - і
    - а
    explanation: Але́ передає́ контра́ст між вели́ким ро́зміром і низько́ю ціно́ю.
  - sentence: А́тлас дороги́й, ___ листі́вка деше́ва.
    answer: а
    options:
    - а
    - і
    - але́
    explanation: Сполу́чник а протиставля́є а́тлас і листі́вку.
- id: act-w203
  type: quiz
  title: Обери́ то́чний о́пис
  instruction: Ви́беріть грамати́чно пра́вильне ре́чення без за́йвих слів.
  items:
  - prompt: The room is bright.
    options:
    - text: Кімна́та сві́тла.
      correct: true
    - text: Кімна́та є сві́тла.
      correct: false
    - text: Кімна́та сві́тлий.
      correct: false
    explanation: 'У тепе́рішньому ча́сі дієсло́во є опуска́ється, а прикме́тник узго́джується
      в роді: сві́тла.'
  - prompt: The chair is old.
    options:
    - text: Стіле́ць стари́й.
      correct: true
    - text: Стіле́ць стара́.
      correct: false
    - text: Стіле́ць є стари́й.
      correct: false
    explanation: 'Стіле́ць — чолові́чий рід: стіле́ць стари́й.'
  - prompt: The postcard is cheap.
    options:
    - text: Листі́вка деше́ва.
      correct: true
    - text: Листі́вка деше́вий.
      correct: false
    - text: Листі́вка деше́ве.
      correct: false
    explanation: 'Листі́вка — жіно́чий рід: деше́ва.'
  - prompt: The phone is expensive.
    options:
    - text: Телефо́н дороги́й.
      correct: true
    - text: Телефо́н доро́га.
      correct: false
    - text: Телефо́н дороге́.
      correct: false
    explanation: 'Телефо́н — чолові́чий рід: дороги́й.'
  - prompt: The mirror is clean.
    options:
    - text: Дзе́ркало чи́сте.
      correct: true
    - text: Дзе́ркало чи́стий.
      correct: false
    - text: Дзе́ркало чи́ста.
      correct: false
    explanation: 'Дзе́ркало — сере́дній рід: чи́сте.'
  - prompt: The poster is big.
    options:
    - text: Плака́т вели́кий.
      correct: true
    - text: Плака́т ве́лика.
      correct: false
    - text: Плака́т вели́ке.
      correct: false
    explanation: 'Плака́т — чолові́чий рід: вели́кий.'
- id: act-w204
  type: unjumble
  title: Скла́ди ре́чення
  instruction: Розташу́йте слова́ у пра́вильному поря́дку, щоб утвори́ти ре́чення.
  words:
  - words:
    - Моя́
    - кімна́та
    - ве́лика
    - і
    - сві́тла
    answer: Моя́ кімна́та ве́лика і сві́тла.
  - words:
    - Стіл
    - нови́й
    - а
