inline:
- id: act-4
  type: match-up
  title: Поєдна́й протиле́жності
  instruction: Match each adjective with its opposite.
  pairs:
  - left: вели́кий
    right: мале́нький
  - left: нови́й
    right: стари́й
  - left: га́рний
    right: пога́ний
  - left: чи́стий
    right: брудни́й
  - left: дороги́й
    right: деше́вий
  - left: сві́тлий
    right: те́мний
- id: act-201
  type: fill-in
  title: Сполу́чники і, а, але́
  instruction: Обері́ть правильний сполу́чник для ко́жного речення.
  items:
  - sentence: Стіл нови́й, ___ стіле́ць стари́й.
    answer: а
    options:
    - а
    - і
    - але́
    explanation: Сполу́чник а використо́вується для протиста́влення двох предме́тів.
  - sentence: Кімна́та вели́ка ___ сві́тла.
    answer: і
    options:
    - і
    - а
    - але́
    explanation: Сполу́чник і поє́днує дві рівнозна́чні озна́ки.
  - sentence: Атлас стари́й, ___ ко́ри́сний.
    answer: але́
    options:
    - але́
    - і
    - а
    explanation: Сполу́чник але́ додає́ уто́чнення або́ обме́ження.
  - sentence: Кни́га доро́га, ___ листі́вка деше́ва.
    answer: а
    options:
    - а
    - і
    - але́
    explanation: 'Тут протиставля́ються дві рі́зні ре́чі: кни́га та листі́вка.'
  - sentence: Вікно́ вели́ке ___ чи́сте.
    answer: і
    options:
    - і
    - а
    - але́
    explanation: Сполу́чник і поє́днує рівнозна́чні власти́вості вікна́.
  - sentence: Плака́т вели́кий, ___ деше́вий.
    answer: але́
    options:
    - але́
    - а
    - і
    explanation: Сполу́чник але́ вка́зує на несподі́вану озна́ку (вели́кий, проте́ деше́вий).
- id: act-204
  type: group-sort
  title: Протиле́жні озна́ки
  instruction: Розподілі́ть прикме́тники за темати́чними гру́пами озна́к.
  groups:
  - label: Розмір та вік
    items:
    - вели́кий
    - мале́нький
    - нови́й
    - стари́й
  - label: Я́кість та чистота́
    items:
    - га́рний
    - пога́ний
    - чи́стий
    - брудни́й
  - label: Ціна́ та сві́тло
    items:
    - дороги́й
    - деше́вий
    - сві́тлий
    - те́мний
- id: act-202
  type: quiz
  title: Яки́й це предме́т?
  instruction: Обері́ть правильну фо́рму прикме́тника для узго́дження з іме́нником.
  items:
  - prompt: стіл (нови́й / нова́ / нове́)
    options:
    - text: нови́й стіл
      correct: true
    - text: нова́ стіл
      correct: false
    - text: нове́ стіл
      correct: false
    explanation: Стіл — чолові́чий рід, тому́ нови́й стіл.
  - prompt: кімна́та (сві́тлий / сві́тла / сві́тле)
    options:
    - text: сві́тла кімна́та
      correct: true
    - text: сві́тлий кімна́та
      correct: false
    - text: сві́тле кімна́та
      correct: false
    explanation: Кімна́та — жіно́чий рід, тому́ сві́тла кімна́та.
  - prompt: вікно́ (чи́стий / чи́ста / чи́сте)
    options:
    - text: чи́сте вікно́
      correct: true
    - text: чи́стий вікно́
      correct: false
    - text: чи́ста вікно́
      correct: false
    explanation: Вікно́ — сере́дній рід, тому́ чи́сте вікно́.
  - prompt: листі́вка (га́рний / га́рна / га́рне)
    options:
    - text: га́рна листі́вка
      correct: true
    - text: га́рний листі́вка
      correct: false
    - text: га́рне листі́вка
      correct: false
    explanation: Листі́вка — жіно́чий рід, тому́ га́рна листі́вка.
  - prompt: плака́т (дороги́й / дорога́ / дороге́)
    options:
    - text: дороги́й плака́т
      correct: true
    - text: дорога́ плака́т
      correct: false
    - text: дороге́ плака́т
      correct: false
    explanation: Плака́т — чолові́чий рід, тому́ дороги́й плака́т.
  - prompt: лі́жко (зру́чний / зру́чна / зру́чне)
    options:
    - text: зру́чне лі́жко
      correct: true
    - text: зру́чний лі́жко
      correct: false
    - text: зру́чна лі́жко
      correct: false
    explanation: Лі́жко — сере́дній рід, тому́ зру́чне лі́жко.
- id: act-203
  type: true-false
  title: Пра́вда чи ні?
  instruction: Ви́значте, чи правильне тве́рдження про о́пис предме́тів.
  statements:
  - statement: В украї́нській мо́ві прикме́тник узго́джується з іме́нником у роді.
    answer: true
    explanation: Прикме́тник за́вжди́ ма́є той самий рід, що й іме́нник.
  - statement: Для поєдна́ння двох озна́к використо́вують сполу́чник і.
    answer: true
    explanation: 'Сполу́чник і поє́днує рівнозна́чні озна́ки: нови́й і чи́стий.'
  - statement: Нормати́вна фо́рма для позна́чення смаку́ — це вкусний суп.
    answer: false
    explanation: Нормати́вна фо́рма — смачни́й суп. Сло́во вкусний є ка́лькою.
  - statement: Для протиста́влення двох предме́тів підхо́дить сполу́чник а.
    answer: true
    explanation: Стіл нови́й, а стіле́ць стари́й.
  - statement: 'У тепе́рішньому ча́сі обов''язково тре́ба писа́ти: Він є до́брий студе́нт.'
    answer: false
    explanation: 'В украї́нській мо́ві дієсло́во є зазвича́й опуска́ється: Він до́брий студе́нт.'
  - statement: Сло́во правильна ві́дповідь — це нормати́вне украї́нське словосполу́чення.
    answer: true
    explanation: Правильна ві́дповідь — це правильний ви́слів за́мість ка́льки ві́рна ві́дповідь.
workbook:
- id: act-w3
  type: error-correction
  title: Ви́прав узго́дження прикме́тників
  instruction: Fix the adjective or sentence frame.
  items:
  - sentence: Він є до́брий студе́нт.
    error: Він є до́брий студе́нт.
    answer: Він до́брий студе́нт.
    options:
    - Він до́брий студе́нт.
    - Він до́бра студе́нт.
    - Він є до́бра студе́нт.
    explanation: In this present-tense frame, Ukrainian normally omits є.
  - sentence: Це га́рна хло́пець.
    error: Це га́рна хло́пець.
    answer: Це га́рний хло́пець.
    options:
    - Це га́рний хло́пець.
    - Це га́рне хло́пець.
    - Це га́рна хло́пець.
    explanation: Хло́пець is masculine.
  - sentence: Яки́й твоє́ ім'я́?
    error: Яки́й твоє́ ім'я́?
    answer: 'Яке́ твоє́ ім''я? (або́: Як тебе́ зва́ти?)'
    options:
    - 'Яке́ твоє́ ім''я? (або́: Як тебе́ зва́ти?)'
    - Яка твоє́ ім'я́?
    - Яки́й твоє́ ім'я́?
    explanation: Ім'я́ is neuter; in real introductions, use Як тебе́ зва́ти?
  - sentence: Це ціка́вий кни́га.
    error: Це ціка́вий кни́га.
    answer: Це ціка́ва кни́га.
    options:
    - Це ціка́ва кни́га.
    - Це ціка́вий кни́га.
    - Це ціка́ве кни́га.
    explanation: Кни́га is feminine, so use ціка́ва.
  - sentence: Моя́ ка́ва смачни́й.
    error: Моя́ ка́ва смачни́й.
    answer: Моя́ ка́ва смачна́.
    options:
    - Моя́ ка́ва смачна́.
    - Моя́ ка́ва смачни́й.
    - Моя́ ка́ва смачне́.
    explanation: Ка́ва is feminine, so use смачна́.
  - sentence: Це мій нови́й ру́чка.
    error: Це мій нови́й ру́чка.
    answer: Це моя́ нова́ ру́чка.
    options:
    - Це моя́ нова́ ру́чка.
    - Це мій нови́й ру́чка.
    - Це моє́ нове́ ру́чка.
    explanation: Ру́чка is feminine, so use моя́ and нова́.
- id: act-w4
  type: fill-in
  title: Ви́прав прикметнико́ві пастки́
  instruction: Choose the standard Ukrainian adjective.
  items:
  - sentence: Цей суп ду́же ___.
    answer: смачни́й
    options:
    - смачни́й
    - вкусний
    explanation: Use смачни́й for tasty.
  - sentence: У мене́ є ___ оліве́ць.
    answer: жо́втий
    options:
    - жо́втий
    - жолтий
    explanation: Use жо́втий.
  - sentence: У сусі́дки ___ кіт.
    answer: чо́рний
    options:
    - чо́рний
    - черний
    explanation: Use чо́рний.
  - sentence: Пра́пор ___, а не бі́лий.
    answer: черво́ний
    options:
    - черво́ний
    - кра́сний
    explanation: Use черво́ний for red in ordinary modern Ukrainian.
  - sentence: Це ___ фільм.
    answer: пога́ний
    options:
    - пога́ний
    - плохи́й
    explanation: Use пога́ний.
  - sentence: Це ___ ві́дповідь на запита́ння.
    answer: правильна
    options:
    - правильна
    - ві́рна
    explanation: Use правильна ві́дповідь for a correct answer.
  - sentence: Дай мені́, будь ла́ска, ___ оліве́ць.
    answer: будь-яки́й
    options:
    - будь-яки́й
    - лю́бий
    explanation: Use the standard Ukrainian form for any.
  - sentence: Сергі́й — ___ хло́пчик.
    answer: розу́мний
    options:
    - розу́мний
    - умний
    explanation: Use розу́мний.
  - sentence: Тара́с — ___ у́чень.
    answer: ліни́вий
    options:
    - ліни́вий
    - ленивий
    explanation: Use ліни́вий.
- id: act-w201
  type: match-up
  title: З'єдна́й анто́німи
  instruction: З'єдна́йте прикме́тники з ї́хніми протиле́жностями.
  pairs:
  - left: мале́нький
    right: вели́кий
  - left: стари́й
    right: нови́й
  - left: пога́ний
    right: га́рний
  - left: брудни́й
    right: чи́стий
  - left: деше́вий
    right: дороги́й
  - left: те́мний
    right: сві́тлий
- id: act-w202
  type: fill-in
  title: Встав правильний сполу́чник
  instruction: Допо́вніть речення сполу́чником і, а або́ але́.
  items:
  - sentence: Стіл нови́й, ___ стіле́ць стари́й.
    answer: а
    options:
    - а
    - і
    - але́
    explanation: Контра́ст між двома́ предме́тами передає́ться сполу́чником а.
  - sentence: Кімна́та мале́нька, ___ га́рна.
    answer: але́
    options:
    - але́
    - і
    - а
    explanation: 'Сполу́чник але́ вка́зує на обме́ження: кімна́та хоч і мале́нька, проте́
      га́рна.'
  - sentence: Вікно́ вели́ке ___ чи́сте.
    answer: і
    options:
    - і
    - а
    - але́
    explanation: Сполу́чник і поє́днує дві позити́вні характери́стики.
  - sentence: Кни́га доро́га, ___ листі́вка деше́ва.
    answer: а
    options:
    - а
    - і
    - але́
    explanation: Протиста́влення ціни́ кни́ги та листі́вки.
  - sentence: Плака́т вели́кий, ___ деше́вий.
    answer: але́
    options:
    - але́
    - а
    - і
    explanation: Сполу́чник але́ підкре́слює контра́ст між розміром та низько́ю ціно́ю.
  - sentence: Кімна́та вели́ка ___ сві́тла.
    answer: і
    options:
    - і
    - а
    - але́
    explanation: Поєдна́ння двох рівнозна́чних озна́к кімна́ти.
- id: act-w203
  type: quiz
  title: Обери́ то́чний о́пис
  instruction: Обері́ть правильну фо́рму прикме́тника для речення.
  items:
  - prompt: Це ___ стіл.
    options:
    - text: чи́стий
      correct: true
    - text: чи́ста
      correct: false
    - text: чи́сте
      correct: false
    explanation: Стіл — чолові́чий рід, закі́нчення -ий.
  - prompt: Це ___ кімна́та.
    options:
    - text: сві́тла
      correct: true
    - text: сві́тлий
      correct: false
    - text: сві́тле
      correct: false
    explanation: Кімна́та — жіно́чий рід, закі́нчення -а.
  - prompt: Це ___ вікно́.
    options:
    - text: чи́сте
      correct: true
    - text: чи́стий
      correct: false
    - text: чи́ста
      correct: false
    explanation: Вікно́ — сере́дній рід, закі́нчення -е.
  - prompt: Це ___ листі́вка.
    options:
    - text: деше́ва
      correct: true
    - text: деше́вий
      correct: false
    - text: деше́ве
      correct: false
    explanation: Листі́вка — жіно́чий рід, закі́нчення -а.
  - prompt: Це ___ плака́т.
    options:
    - text: дороги́й
      correct: true
    - text: доро́га
      correct: false
    - text: дороге́
      correct: false
    explanation: Плака́т — чолові́чий рід, закі́нчення -ий.
  - prompt: Це ___ ре́чі.
    options:
    - text: га́рні
      correct: true
    - text: га́рний
      correct: false
    - text: га́рна
      correct: false
    explanation: Ре́чі — множина́, закі́нчення -і.
- id: act-w204
  type: unjumble
  title: Склади речення
  instruction: Розташу́йте слова́ у правильному поря́дку, щоб утвори́ти речення.
  items:
  - words:
    - Стіл
    - нови́й
    - і
    - чи́стий.
    answer: Стіл нови́й і чи́стий.
    explanation: Стіл нови́й і чи́стий — послідо́вний о́пис предме́та.
  - words:
    - Кімна́та
    - мале́нька,
    - але́
    - сві́тла.
    answer: Кімна́та мале́нька, але́ сві́тла.
    explanation: Сполу́чник але́ вжива́ється з ко́мою.
  - words:
    - Вікно́
    - вели́ке
    - і
    - чи́сте.
    answer: Вікно́ вели́ке і чи́сте.
    explanation: Поєдна́ння озна́к вікна́ че́рез сполу́чник і.
  - words:
    - Кни́га
    - дорога́,
    - а
    - листі́вка
    - деше́ва.
    answer: Кни́га доро́га, а листі́вка деше́ва.
    explanation: Протиста́влення кни́ги та листі́вки зі сполу́чником а.
  - words:
    - Плака́т
    - вели́кий,
    - але́
    - деше́вий.
    answer: Плака́т вели́кий, але́ деше́вий.
    explanation: Протиста́влення двох озна́к плака́та че́рез але́.
  - words:
    - Це
    - моя́
    - нова́
    - кімна́та.
    answer: Це моя́ нова́ кімна́та.
    explanation: Поря́док слів у про́сто́му описо́вому реченні.
- id: act-w205
  type: translate
  title: 'Бо́нус: переклад украї́нською'
  instruction: Обері́ть правильний украї́нський переклад для англі́йського речення.
  items:
  - source: The room is big and bright.
    options:
    - text: Кімна́та вели́ка і сві́тла.
      correct: true
    - text: Кімна́та вели́кий і сві́тлий.
      correct: false
    - text: Кімна́та вели́ке і сві́тле.
      correct: false
