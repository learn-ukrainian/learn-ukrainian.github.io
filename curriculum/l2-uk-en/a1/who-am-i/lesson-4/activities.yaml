inline:
- id: act-401
  type: match-up
  title: Запита́ння та ві́дповіді пі́дсумку
  instruction: З'єдна́й запита́ння знайо́мства з відпові́дною ре́плікою.
  pairs:
  - left: Як тебе́ зва́ти?
    right: Мене́ зва́ти Марко́.
  - left: Як вас зва́ти?
    right: Мене́ зва́ти Окса́на Петрі́вна.
  - left: Зві́дки ти?
    right: Я з Украї́ни, з Ки́єва.
  - left: Хто це?
    right: Це Андрі́й. Він — студе́нт.
  - left: Що це?
    right: Це ка́ва.
  - left: Ду́же приє́мно!
    right: Мені́ та́кож!
- id: act-402
  type: quiz
  title: Фо́рмули знайо́мства та ро́лі
  instruction: Обери́ пра́вильну украї́нську ре́пліку для ко́жної ситуа́ції.
  items:
  - prompt: Ти знайо́мишся з рове́сником і назива́єш своє́ ім'я́.
    options:
    - text: Мене́ зва́ти Тара́с.
      correct: true
    - text: Я є Тара́с.
      correct: false
    - text: Моє́ ім'я́ є Тара́с.
      correct: false
    explanation: Мене́ зва́ти... — нормати́вна украї́нська фо́рмула знайо́мства.
  - prompt: Рове́сник запита́в твоє́ ім'я́. Ти відпові́в і поверта́єш запита́ння.
    options:
    - text: А тебе́?
      correct: true
    - text: А у тебе́?
      correct: false
    - text: А твій?
      correct: false
    explanation: А тебе́? — коро́ткий приро́дний е́хо-патерн без скла́дних форм.
  - prompt: Ти поверта́єш запита́ння викладаче́ві або́ незнайо́мому доро́слому.
    options:
    - text: А вас?
      correct: true
    - text: А тебе́?
      correct: false
    - text: А ви?
      correct: false
    explanation: А вас? — вві́члива фо́рма пове́рнення запита́ння про ім'я́.
  - prompt: Ти представля́єш жі́нку, я́ка працю́є лі́каркою.
    options:
    - text: Вона́ — лі́карка.
      correct: true
    - text: Вона́ — лі́кар.
      correct: false
    - text: Вона́ є лі́кар.
      correct: false
    explanation: Лі́карка — станда́ртна фо́рма фемініти́ва в украї́нській мо́ві.
  - prompt: Ти ка́жеш, що друг ро́дом зі Льво́ва.
    options:
    - text: Він зі Льво́ва.
      correct: true
    - text: Він з Льво́ва.
      correct: false
    - text: Він від Льво́ва.
      correct: false
    explanation: Пере́д збі́гом при́голосних [льв] ужива́ємо прийме́нник зі.
  - prompt: Ти представля́єш свою́ дружи́ну Марі́ю.
    options:
    - text: Це моя́ дружи́на.
      correct: true
    - text: Це моя́ ма́ма.
      correct: false
    - text: Це моя́ по́друга.
      correct: false
    explanation: Дружи́на — пито́ме літерату́рне украї́нське сло́во.
- id: act-403
  type: fill-in
  title: Підсу́мковий діало́г знайо́мства
  instruction: Встав пра́вильне сло́во або́ фра́зу в ре́пліки розмо́ви.
  items:
  - sentence: — Приві́т! Як ___ зва́ти?
    answer: тебе́
    options:
    - тебе́
    - вас
    - це
    explanation: Приві́т сигналізу́є про неформа́льний регі́стр.
  - sentence: — ___ зва́ти Марко́.
    answer: Мене́
    options:
    - Мене́
    - Я
    - Мій
    explanation: Мене́ зва́ти — ці́лісний мовленнє́вий блок.
  - sentence: — Ду́же ___!
    answer: приє́мно
    options:
    - приє́мно
    - та́кож
    - зві́дки
    explanation: Ду́же приє́мно — традиці́йна фо́рмула вві́чливості пі́сля о́бміну імена́ми.
  - sentence: — Зві́дки ти? — Я ___ Кана́ди.
    answer: з
    options:
    - з
    - зі
    - із-під
    explanation: Пере́д одина́рним при́голосним [к] ужива́ємо прийме́нник з.
  - sentence: — А я ___ Льво́ва.
    answer: зі
    options:
    - зі
    - з
    - із
    explanation: Пере́д збі́гом при́голосних ужива́ємо варіа́нт зі.
  - sentence: — Окса́на — ___. Вона́ працю́є в шко́лі.
    answer: вчи́телька
    options:
    - вчи́телька
    - вчи́тель
    - вчи́ти
    explanation: Вчи́телька — станда́ртна на́зва профе́сії для жінки́.
- id: act-404
  type: group-sort
  title: 'Катего́рії слів: хто це чи що це?'
  instruction: 'Розпо́діли слова́ за запита́ннями: лю́ди (Хто це?) чи неісто́ти й на́зви
    (Що це?).'
  groups:
  - label: Хто це?
    items:
    - студе́нтка
    - вчи́телька
    - лі́кар
    - інжене́р
    - по́друга
    - украї́нець
  - label: Що це?
    items:
    - ка́ва
    - Ки́їв
    - Львів
    - Кана́да
    - Украї́на
    - прі́звище
- id: act-405
  type: true-false
  title: Пра́вила украї́нського знайо́мства
  instruction: Ви́знач, чи тве́рдження про украї́нське мо́влення є пра́вильним.
  statements:
  - statement: У ре́ченні «Я — студе́нт» дієсло́во «є» зазвича́й опуска́ється в тепе́рішньому
      ча́сі.
    is_true: true
    explanation: В украї́нській мо́ві тепе́рішня іденти́чність буду́ється без дієслова́-зв'я́зки.
  - statement: Для вві́чливого пове́рнення запита́ння про ім'я́ рове́снику вжива́ємо констру́кцію
      «А у тебе́?».
    is_true: false
    explanation: Нормати́вний чанк для пе́ршого конта́кту — «А тебе́?».
  - statement: Пере́д на́звою міста́ Львів ужива́ємо прийме́нник «зі» для милозву́чності.
    is_true: true
    explanation: Фо́рма «зі» поле́гшує вимо́ву пере́д збі́гом при́голосних.
  - statement: Для позна́чення профе́сії жінки́ станда́ртною фо́рмою є фемініти́в (лі́карка,
      інжене́рка).
    is_true: true
    explanation: Украї́нська мо́ва ма́є розви́нену систе́му фемініти́вів.
  - statement: Вві́чливе зверта́ння до вчи́теля або́ незнайо́мого доро́слого потребу́є займе́нника
      «ти».
    is_true: false
    explanation: До ста́рших і незнайо́мих доро́слих зверта́ємося на «ви».
  - statement: Приро́дною украї́нською на́звою дружи́ни є сло́во «дружи́на», а не руси́зм
      «жена».
    is_true: true
    explanation: «Дружи́на» — літерату́рна пито́ма фо́рма.
workbook:
- id: act-w5
  type: fill-in
  title: Обери́ украї́нську но́рму
  instruction: Запо́вни ре́чення украї́нським ви́бором.
  items:
  - sentence: Це моя́ ___ Марі́я.
    answer: дружи́на
    options:
    - дружи́на
    - жена
    explanation: Дружи́на — приро́дний украї́нський ви́бір для жінки́ в шлю́бі.
  - sentence: ___, як вас зва́ти?
    answer: Ви́бачте
    options:
    - Ви́бачте
    - Ізвиніть
    explanation: Ви́бачте і проба́чте — безпе́чні украї́нські ви́бори.
  - sentence: ___, ду́же приє́мно!
    answer: Дя́кую
    options:
    - Дя́кую
    - Спасібо
    explanation: Дя́кую і спаси́бі — безпе́чні украї́нські ви́бори.
  - sentence: Мені́ ___ приє́мно.
    answer: теж
    options:
    - теж
    - тоже
    explanation: Теж і та́кож — безпе́чні украї́нські ви́бори.
  - sentence: 'Окса́на — ___. '
    answer: інжене́рка
    options:
    - інжене́рка
    - інжене́р
    explanation: Для жінки́ вжива́й фемініти́в, коли́ украї́нська фо́рма існу́є.
  - sentence: Це мій ___.
    answer: лі́кар
    options:
    - лі́кар
    - врач
    explanation: Лі́кар — украї́нська фо́рма; врач — росі́йське сло́во.
- id: act-w6
  type: translate
  title: Ле́ксика знайо́мства
  instruction: Обери́ англі́йське зна́чення.
  items:
  - source: Мене́ зва́ти...
    options:
    - text: My name is...
      correct: true
    - text: Where are you from?
      correct: false
    - text: This is...
      correct: false
    explanation: Мене́ зва́ти... — блок для і́мені.
  - source: Як тебе́ зва́ти?
    options:
    - text: What is your name? informal
      correct: true
    - text: Who is this?
      correct: false
    - text: I am from Ukraine.
      correct: false
    explanation: Тебе́ познача́є неформа́льну ве́рсію.
  - source: Як вас зва́ти?
    options:
    - text: What is your name? formal
      correct: true
    - text: And yours? informal
      correct: false
    - text: This is Kyiv.
      correct: false
    explanation: Вас познача́є форма́льну ве́рсію.
  - source: Ду́же приє́мно!
    options:
    - text: Pleased to meet you!
      correct: true
    - text: Goodbye!
      correct: false
    - text: Where from?
      correct: false
    explanation: Ду́же приє́мно вві́чливо заве́ршує предста́влення.
  - source: Зві́дки ти?
    options:
    - text: Where are you from? informal
      correct: true
    - text: What is this?
      correct: false
    - text: I am a student.
      correct: false
    explanation: Зві́дки пита́є про похо́дження.
  - source: Я — студе́нтка.
    options:
    - text: I am a female student.
      correct: true
    - text: She is a doctor.
      correct: false
    - text: My name is...
      correct: false
    explanation: Студе́нтка — жіно́ча фо́рма.
- id: act-w401
  type: error-correction
  title: Випра́в помилки́ в ре́ченнях знайо́мства
  instruction: Зна́йди поми́лку та обери́ пра́вильний нормати́вний варіа́нт.
  items:
  - sentence: Моє́ ім'я́ є Тара́с.
    error: Моє́ ім'я́ є Тара́с.
    correction: Мене́ зва́ти Тара́с.
    options:
    - Мене́ зва́ти Тара́с.
    - Моє́ ім'я́ є Тара́с.
    explanation: В украї́нській мо́ві кажи́ «Мене́ зва́ти...» за́мість ка́льки з англі́йської.
  - sentence: Я є студе́нтка.
    error: Я є студе́нтка.
    correction: Я — студе́нтка.
    options:
    - Я — студе́нтка.
    - Я є студе́нтка.
    explanation: Дієсло́во «є» опуска́ється при ви́значенні профе́сії чи ста́тусу.
  - sentence: Оле́на — лі́кар.
    error: Оле́на — лі́кар.
    correction: Оле́на — лі́карка.
    options:
    - Оле́на — лі́карка.
    - Оле́на — лі́кар.
    explanation: Для жіно́к в украї́нській мо́ві станда́ртом є фемініти́в.
  - sentence: Мене́ зва́ти Петро́. А у вас?
    error: А у вас?
    correction: А вас?
    options:
    - А вас?
    - А у вас?
    explanation: Е́хо-патерн пі́сля запита́ння про ім'я́ — «А вас?» без прийме́нника «у».
  - sentence: Він з Льво́ва.
    error: з Льво́ва
    correction: зі Льво́ва
    options:
    - зі Льво́ва
    - з Льво́ва
    explanation: Пере́д збі́гом при́голосних ужива́ємо евфоні́чну фо́рму «зі».
  - sentence: Ізвиніть, як вас зва́ти?
    error: Ізвиніть
    correction: Ви́бачте
    options:
    - Ви́бачте
    - Ізвиніть
    explanation: «Ви́бачте» та «проба́чте» — нормати́вні фо́рми вві́чливості.
- id: act-w402
  type: match-up
  title: Чолові́чі та жіно́чі фо́рми профе́сій і націона́льностей
  instruction: З'єдна́й чолові́чу фо́рму зі станда́ртною жіно́чою фо́рмою.
  pairs:
  - left: лі́кар
    right: лі́карка
  - left: вчи́тель
    right: вчи́телька
  - left: програмі́ст
    right: програмі́стка
  - left: інжене́р
    right: інжене́рка
  - left: украї́нець
    right: украї́нка
  - left: канаді́єць
    right: кана́дка
- id: act-w403
  type: order
  title: Послідо́вність пе́ршої розмо́ви
  instruction: Розста́в ре́пліки діало́гу в пра́вильному логі́чному поря́дку.
  items:
  - Приві́т! Як тебе́ зва́ти?
  - Мене́ зва́ти Марко́. А тебе́?
  - Мене́ зва́ти Окса́на. Ду́же приє́мно!
  - Мені́ теж! Зві́дки ти?
  - Я з Украї́ни. А ти?
  - Я з Кана́ди. До поба́чення!
  correct_order:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
- id: act-w404
  type: fill-in
  title: 'Ви́бір прийме́нника: з чи зі?'
  instruction: Встав пра́вильний прийме́нник похо́дження до ко́жної географі́чної на́зви.
  items:
  - sentence: Софі́я приї́хала ___ Ки́єва.
    answer: з
    options:
    - з
    - зі
    explanation: Пере́д одина́рним при́голосним [к] ужива́ємо «з».
  - sentence: Андрі́й ро́дом ___ Льво́ва.
    answer: зі
    options:
    - зі
    - з
    explanation: Пере́д збі́гом при́голосних [льв] ужива́ємо «зі».
  - sentence: Марко́ прилеті́в ___ Кана́ди.
    answer: з
    options:
    - з
    - зі
    explanation: Пере́д при́голосним [к] ужива́ємо «з».
  - sentence: Джон приї́хав ___ Шта́тів.
    answer: зі
    options:
    - зі
    - з
    explanation: Пере́д збі́гом при́голосних [шт] ужива́ємо «зі».
  - sentence: Оле́на ро́дом ___ Оде́си.
    answer: з
    options:
    - з
    - зі
    explanation: Пере́д голосни́м [о] ужива́ємо «з».
  - sentence: Лу́кас прибу́в ___ Німе́ччини.
    answer: з
    options:
    - з
    - зі
    explanation: Пере́д при́голосним [н] ужива́ємо «з».
- id: act-w405
  type: quiz
  title: Підсу́мковий тест пе́ршого конта́кту
  instruction: Обери́ пра́вильний варіа́нт ві́дповіді для ко́жної ситуа́ції спілкува́ння.
  items:
  - prompt: Як пра́вильно запита́ти ім'я́ рове́сника на ку́рсах?
    options:
    - text: Як тебе́ зва́ти?
      correct: true
    - text: Як вас зва́ти?
      correct: false
    - text: Хто це?
      correct: false
    explanation: До одно́го рове́сника зверта́ємося на «ти» (тебе́).
  - prompt: Я́ка ві́дповідь на запита́ння «Зві́дки ви?» є грамати́чно пра́вильною?
    options:
    - text: Я з Украї́ни.
      correct: true
    - text: Я є від Украї́ни.
      correct: false
    - text: Я в Украї́ні.
      correct: false
    explanation: Похо́дження познача́ємо констру́кцією «Я з...» без дієслова́ «є».
  - prompt: Як че́мно відповісти́ на ре́пліку «Ду́же приє́мно!»?
    options:
    - text: Мені́ та́кож!
      correct: true
    - text: Дя́кую, па́па.
      correct: false
    - text: Зві́дки ти?
      correct: false
    explanation: «Мені́ та́кож!» або́ «Мені́ теж!» висло́влює взає́мну вві́чливість.
  - prompt: Яке́ ре́чення пра́вильно назива́є фах жінки́?
    options:
    - text: Окса́на — інжене́рка.
      correct: true
    - text: Окса́на є інжене́р.
      correct: false
    - text: Окса́на — врач.
      correct: false
    explanation: «Інжене́рка» — літерату́рний фемініти́в без дієслова́ «є».
  - prompt: Як коре́ктно вказа́ти на свого́ ба́тька при знайо́мстві?
    options:
    - text: Це мій та́то.
      correct: true
    - text: Воно́ мій та́то.
      correct: false
    - text: Це мій па́па.
      correct: false
    explanation: «Це мій та́то» — нейтра́льна та безпе́чна украї́нська фо́рмула.
  - prompt: Яке́ сло́во вжива́ється для ви́бачення в літерату́рній украї́нській мо́ві?
    options:
