inline:
- id: act-3
  type: match-up
  title: Це / хто / що
  instruction: З'єдна́й украї́нський рядо́к із йо́го робо́тою.
  pairs:
  - left: Це Андрі́й.
    right: предста́вити люди́ну
  - left: Це Окса́на.
    right: предста́вити і́ншу люди́ну
  - left: Хто це?
    right: запита́ти про люди́ну
  - left: Що це?
    right: запита́ти про річ
  - left: Це ка́ва.
    right: назва́ти річ
- id: act-201
  type: quiz
  title: Хто це чи що це?
  instruction: Обери́ пра́вильне запита́ння для ко́жної ситуа́ції.
  items:
  - prompt: 'Ти ба́чиш на столі́ ча́шку: Це ка́ва.'
    options:
    - text: Що це?
      correct: true
    - text: Хто це?
      correct: false
    explanation: Для неживи́х предме́тів ужива́й Що це?.
  - prompt: 'Ти пока́зуєш на фо́то дру́га: Це Андрі́й.'
    options:
    - text: Хто це?
      correct: true
    - text: Що це?
      correct: false
    explanation: Для люде́й ужива́й Хто це?.
  - prompt: 'Ти пока́зуєш на нову́ одноку́рсницю: Це Окса́на.'
    options:
    - text: Хто це?
      correct: true
    - text: Що це?
      correct: false
    explanation: Для люде́й запи́туй Хто це?.
  - prompt: 'Ти ба́чиш фо́то міста́: Це Ки́їв.'
    options:
    - text: Що це?
      correct: true
    - text: Хто це?
      correct: false
    explanation: Для міст і рече́й запи́туй Що це?.
  - prompt: 'Ти пока́зуєш на свого́ ба́тька: Це мій та́то.'
    options:
    - text: Хто це?
      correct: true
    - text: Що це?
      correct: false
    explanation: Та́то — люди́на, тому́ запи́туємо Хто це?.
  - prompt: 'Ти пока́зуєш на свою́ по́другу: Це моя́ по́друга.'
    options:
    - text: Хто це?
      correct: true
    - text: Що це?
      correct: false
    explanation: По́друга — люди́на, тому́ запи́туємо Хто це?.
- id: act-4
  type: quiz
  title: Обери́ займе́нник
  instruction: Обери́ займе́нник для украї́нської ситуа́ції.
  items:
  - prompt: Мо́вець гово́рить про себе́.
    options:
    - text: я
      correct: true
    - text: ти
      correct: false
    - text: вони́
      correct: false
    explanation: Я — це мо́вець.
  - prompt: Оди́н друг або́ близьки́й одноку́рсник.
    options:
    - text: ти
      correct: true
    - text: ви
      correct: false
    - text: він
      correct: false
    explanation: Ти — оди́н неформа́льний співрозмо́вник.
  - prompt: Оди́н незнайо́мий доро́слий або́ форма́льна ситуа́ція.
    options:
    - text: ви
      correct: true
    - text: ти
      correct: false
    - text: вона́
      correct: false
    explanation: Ви — форма́льно до одніє́ї люди́ни, а та́кож множина́.
  - prompt: Жі́нка або́ дівчи́на вже ві́дома в розмо́ві.
    options:
    - text: вона́
      correct: true
    - text: він
      correct: false
    - text: я
      correct: false
    explanation: Вона́ вка́зує на жі́нку або́ дівчи́ну.
- id: act-202
  type: match-up
  title: Особо́ві займе́нники
  instruction: З'єдна́й займе́нник із йо́го зна́ченням у розмо́ві.
  pairs:
  - left: я
    right: мо́вець про себе́
  - left: ти
    right: оди́н близьки́й друг
  - left: він
    right: знайо́мий чолові́к
  - left: вона́
    right: знайо́ма жі́нка
  - left: ми
    right: гру́па ра́зом із мо́вцем
  - left: ви
    right: виклада́ч або́ незнайо́мий доро́слий
  - left: вони́
    right: і́нші лю́ди у множині́
- id: act-203
  type: fill-in
  title: 'Він чи вона́: профе́сії'
  instruction: Обери́ пра́вильну чолові́чу або́ жіно́чу фо́рму профе́сії.
  items:
  - sentence: Окса́на працю́є в ліка́рні. Вона́ — ___.
    answer: лі́карка
    options:
    - лі́карка
    - лі́кар
    explanation: 'Для жінки́ вжива́й станда́ртну жіно́чу фо́рму: лі́карка.'
  - sentence: Тара́с навча́ється в університе́ті. Він — ___.
    answer: студе́нт
    options:
    - студе́нт
    - студе́нтка
    explanation: 'Для чолові́ка вжива́й чолові́чу фо́рму: студе́нт.'
  - sentence: Марі́я виклада́є в шко́лі. Вона́ — ___.
    answer: вчи́телька
    options:
    - вчи́телька
    - вчи́тель
    explanation: 'Для жінки́ вжива́й жіно́чу фо́рму: вчи́телька.'
  - sentence: Марко́ ство́рює комп'ю́терні про́грами. Він — ___.
    answer: програмі́ст
    options:
    - програмі́ст
    - програмі́стка
    explanation: 'Для чолові́ка вжива́й чолові́чу фо́рму: програмі́ст.'
  - sentence: Софі́я проєкту́є мости́. Вона́ — ___.
    answer: інжене́рка
    options:
    - інжене́рка
    - інжене́р
    explanation: 'Для жінки́ вжива́й станда́ртну жіно́чу фо́рму: інжене́рка.'
  - sentence: Андрі́й народи́вся в Украї́ні. Він — ___.
    answer: украї́нець
    options:
    - украї́нець
    - украї́нка
    explanation: 'Для чолові́ка вжива́й фо́рму: украї́нець.'
workbook:
- id: act-w2
  type: match-up
  title: Пари́ профе́сій
  instruction: З'єдна́й чолові́чу і жіно́чу фо́рму профе́сії.
  pairs:
  - left: студе́нт
    right: студе́нтка
  - left: вчи́тель
    right: вчи́телька
  - left: лі́кар
    right: лі́карка
  - left: програмі́ст
    right: програмі́стка
  - left: інжене́р
    right: інжене́рка
  - left: украї́нець
    right: украї́нка
  - left: канаді́єць
    right: кана́дка
  - left: америка́нець
    right: америка́нка
- id: act-w3
  type: group-sort
  title: Неформа́льно чи форма́льно
  instruction: Розклади́ фра́зи за ситуа́цією.
  groups:
  - label: Неформа́льно
    items:
    - Як тебе́ зва́ти?
    - А тебе́?
    - Зві́дки ти?
  - label: Форма́льно
    items:
    - Як вас зва́ти?
    - А вас?
    - Зві́дки ви?
- id: act-w201
  type: group-sort
  title: 'Чолові́чий та жіно́чий рід: лю́ди'
  instruction: Розпо́діли слова́ на чолові́чі та жіно́чі фо́рми.
  groups:
  - label: Чолові́ча фо́рма
    items:
    - студе́нт
    - вчи́тель
    - лі́кар
    - програмі́ст
  - label: Жіно́ча фо́рма
    items:
    - студе́нтка
    - вчи́телька
    - лі́карка
    - програмі́стка
- id: act-w202
  type: fill-in
  title: Ре́чення про себе́ та і́нших
  instruction: Встав пра́вильне сло́во в ре́чення.
  items:
  - sentence: Це Андрі́й. ___ зі Льво́ва.
    answer: Він
    options:
    - Він
    - Вона́
    - Воно́
    explanation: Андрі́й — чолові́к, тому́ вжива́ємо Він.
  - sentence: Це Окса́на. ___ — лі́карка.
    answer: Вона́
    options:
    - Вона́
    - Він
    - Вони́
    explanation: Окса́на — жі́нка, тому́ вжива́ємо Вона́.
  - sentence: Я навча́юся в університе́ті. Я — ___.
    answer: студе́нт
    options:
    - студе́нт
    - ка́ва
    - Ки́їв
    explanation: Студе́нт — на́зва ро́лі люди́ни.
  - sentence: Це моя́ ма́ма. Вона́ — ___.
    answer: вчи́телька
    options:
    - вчи́телька
    - вчи́тель
    - та́то
    explanation: Ма́ма — жі́нка, тому́ вжива́ємо фо́рму вчи́телька.
  - sentence: Це Андрі́й і Тара́с. ___ — студе́нти.
    answer: Вони́
    options:
    - Вони́
    - Він
    - Вона́
    explanation: Про кілько́х люде́й гово́римо Вони́.
  - sentence: ___ це? Це ка́ва.
    answer: Що
    options:
    - Що
    - Хто
    - Як
    explanation: Ка́ва — це річ, тому́ запи́туємо Що це?.
- id: act-w203
  type: translate
  title: Зна́чення ре́чень іденти́чності
  instruction: Обери́ пра́вильний англі́йський пере́клад.
  items:
  - source: Це ка́ва.
    options:
    - text: This is coffee.
      correct: true
    - text: Who is this?
      correct: false
    - text: What is this?
      correct: false
    explanation: Це ка́ва означа́є This is coffee.
  - source: Хто це?
    options:
    - text: Who is this?
      correct: true
    - text: What is this?
      correct: false
    - text: This is Andrii.
      correct: false
    explanation: Хто це? запи́тує про люди́ну.
  - source: Що це?
    options:
    - text: What is this?
      correct: true
    - text: Who is this?
      correct: false
    - text: This is coffee.
      correct: false
    explanation: Що це? запи́тує про річ.
  - source: Я — студе́нт.
    options:
    - text: I am a male student.
      correct: true
    - text: She is a doctor.
      correct: false
    - text: He is a teacher.
      correct: false
    explanation: Я — студе́нт гово́рить хло́пець або́ чолові́к про себе́.
  - source: Вона́ — лі́карка.
    options:
    - text: She is a doctor.
      correct: true
    - text: He is a doctor.
      correct: false
    - text: I am a student.
      correct: false
    explanation: Вона́ — лі́карка назива́є профе́сію жінки́.
  - source: Це мій та́то.
    options:
    - text: This is my dad.
      correct: true
    - text: This is my mom.
      correct: false
    - text: This is my friend.
      correct: false
    explanation: Це мій та́то представля́є ба́тька.
- id: act-w204
  type: error-correction
  title: Випра́в помилки́ в іденти́чності
  instruction: Обери́ пра́вильне украї́нське ре́чення за́мість помилко́вого.
  items:
  - sentence: Я є студе́нтка.
    error: Я є студе́нтка.
    correction: Я — студе́нтка.
    options:
    - Я — студе́нтка.
    - Я є студе́нтка.
    explanation: 'У тепе́рішньому ча́сі дієсло́во «є» пропуска́ється: Я — студе́нтка.'
  - sentence: Окса́на — лі́кар.
    error: Окса́на — лі́кар.
    correction: Окса́на — лі́карка.
    options:
    - Окса́на — лі́карка.
    - Окса́на — лі́кар.
    explanation: 'Для жінки́ вжива́й станда́ртний фемініти́в: лі́карка.'
  - sentence: Воно́ мій та́то.
    error: Воно́ мій та́то.
    correction: Це мій та́то.
    options:
    - Це мій та́то.
    - Воно́ мій та́то.
    explanation: Для вказівки́ на люди́ну вжива́й вказівне́ сло́во «це».
  - sentence: Це хто?
    error: Це хто?
    correction: Хто це?
    options:
    - Хто це?
    - Це хто?
    explanation: 'Пита́льне сло́во в украї́нській мо́ві ста́виться на поча́тку: Хто це?.'
  - sentence: Це що?
    error: Це що?
    correction: Що це?
    options:
    - Що це?
    - Це що?
    explanation: 'Пита́льне сло́во ста́виться на поча́тку ре́чення: Що це?.'
  - sentence: Софі́я — інжене́р.
    error: Софі́я — інжене́р.
    correction: Софі́я — інжене́рка.
    options:
    - Софі́я — інжене́рка.
    - Софі́я — інжене́р.
    explanation: 'Для жінки́ вжива́й фо́рму жіно́чого ро́ду: інжене́рка.'
- id: act-w205
  type: match-up
  title: Ре́чення іденти́чності
  instruction: З'єдна́й ре́чення з осо́бою, я́ка про себе́ гово́рить або́ про я́ку гово́рять.
  pairs:
  - left: Я — студе́нтка.
    right: дівчи́на про своє́ навча́ння
  - left: Він — лі́кар.
    right: про знайо́мого лі́каря-чолові́ка
  - left: Вона́ — лі́карка.
    right: про знайо́му лі́карку-жі́нку
  - left: Ми — студе́нти.
    right: гру́па молоді́ про себе́
  - left: Він — інжене́р.
    right: про знайо́мого інжене́ра-чолові́ка
  - left: Вона́ — інжене́рка.
    right: про знайо́му інжене́рку-жі́нку
