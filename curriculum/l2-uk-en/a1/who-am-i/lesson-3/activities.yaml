inline:
- id: act-301
  type: match-up
  title: Пита́ння і ві́дповіді про похо́дження
  instruction: З'єдна́й запита́ння про похо́дження з пра́вильною ві́дповіддю.
  pairs:
  - left: Зві́дки ти?
    right: Я з Украї́ни.
  - left: Зві́дки ви?
    right: Я з Кана́ди.
  - left: Ви з Украї́ни?
    right: Так, я з Ки́єва.
  - left: Хто це?
    right: Це Окса́на, вона́ з Оде́си.
  - left: Як тебе́ зва́ти?
    right: Мене́ зва́ти Марко́.
  - left: Як вас зва́ти?
    right: Мене́ зва́ти Петро́.
- id: act-302
  type: fill-in
  title: З чи зі? Краї́ни та міста́
  instruction: Обери́ пра́вильний прийме́нник (з чи зі) для ко́жного міста́ або́ краї́ни.
  items:
  - sentence: Я ___ Украї́ни.
    answer: з
    options:
    - з
    - зі
    explanation: 'Пере́д голосни́м [у] вжива́ємо з: з Украї́ни.'
  - sentence: Марко́ приї́хав ___ Кана́ди.
    answer: з
    options:
    - з
    - зі
    explanation: 'Пере́д одни́м при́голосним [к] вжива́ємо з: з Кана́ди.'
  - sentence: Андрі́й ___ Льво́ва.
    answer: зі
    options:
    - зі
    - з
    explanation: 'Пере́д збі́гом при́голосних [льв] для милозву́чності вжива́ємо зі: зі
      Льво́ва.'
  - sentence: Мій друг ___ Шта́тів.
    answer: зі
    options:
    - зі
    - з
    explanation: 'Пере́д збі́гом при́голосних [шт] вжива́ємо зі: зі Шта́тів.'
  - sentence: Софі́я ро́дом ___ Ки́єва.
    answer: з
    options:
    - з
    - зі
    explanation: 'Пере́д одини́чним при́голосним [к] ужива́ємо з: з Ки́єва.'
  - sentence: Окса́на ___ Оде́си.
    answer: з
    options:
    - з
    - зі
    explanation: 'Пере́д голосни́м [о] вжива́ємо з: з Оде́си.'
- id: act-303
  type: quiz
  title: 'Форма́льно чи неформа́льно: похо́дження'
  instruction: Обери́ відпові́дну ре́пліку для ко́жної ситуа́ції спілкува́ння.
  items:
  - prompt: Ти знайо́мишся з нови́м одноку́рсником і хо́чеш дізна́тися, зві́дки він.
    options:
    - text: Зві́дки ти?
      correct: true
    - text: Зві́дки ви?
      correct: false
    explanation: 'До одноку́рсника або́ рове́сника зверта́ємося на ти: Зві́дки ти?.'
  - prompt: Ти запи́туєш профе́сора в університе́ті про йо́го рі́дне мі́сто.
    options:
    - text: Зві́дки ви?
      correct: true
    - text: Зві́дки ти?
      correct: false
    explanation: 'До викладача́ або́ незнайо́мої ста́ршої люди́ни зверта́ємося на ви: Зві́дки
      ви?.'
  - prompt: Співрозмо́вник запита́в тебе́ «Зві́дки ти?». Як вві́чливо поверну́ти пита́ння
      рове́снику?
    options:
    - text: Я з Ки́єва. А ти?
      correct: true
    - text: Я з Ки́єва. А ви?
      correct: false
    explanation: У неформа́льній розмо́ві поверта́ємо пита́ння че́рез А ти?.
  - prompt: Виклада́ч запита́в «Ви з Украї́ни?». Як відповісти́ стве́рдно?
    options:
    - text: Так, я з Украї́ни.
      correct: true
    - text: Ні, я з Кана́ди.
      correct: false
    explanation: Так, я з Украї́ни підтве́рджує похо́дження з Украї́ни.
  - prompt: Ти представля́єш чолові́ка і назива́єш йо́го мі́сто.
    options:
    - text: Це Андрі́й. Він зі Льво́ва.
      correct: true
    - text: Це Андрі́й. Вона́ зі Льво́ва.
      correct: false
    explanation: 'Для чолові́ка вжива́ємо займе́нник він: Він зі Льво́ва.'
  - prompt: Ти представля́єш жі́нку і назива́єш її́ мі́сто.
    options:
    - text: Це Окса́на. Вона́ з Оде́си.
      correct: true
    - text: Це Окса́на. Він з Оде́си.
      correct: false
    explanation: 'Для жінки́ вжива́ємо займе́нник вона́: Вона́ з Оде́си.'
- id: act-304
  type: true-false
  title: Слу́хай і перевіря́й фа́кти
  instruction: Ви́знач, чи тве́рдження є пра́вильним (Пра́вда), чи хи́бним (Непра́вда).
  items:
  - statement: У фра́зах «з Украї́ни» та «з Ки́єва» вжива́ється прийме́нник «з».
    correct: true
    explanation: Пере́д голосни́ми та бі́льшістю при́голосних ужива́ємо прийме́нник з.
  - statement: 'Пере́д сло́вом «Льво́ва» пра́вильно вжива́ти прийме́нник «зі»: зі Льво́ва.'
    correct: true
    explanation: Збіг при́голосних [льв] вимага́є фо́рми зі для милозву́чності.
  - statement: Сло́во «прі́звище» означа́є особи́сте ім'я́ люди́ни.
    correct: false
    explanation: Прі́звище означа́є родове́ ім'я́ (surname), а не особи́сте ім'я́.
  - statement: Сло́во «дружи́на» — це нормати́вна украї́нська на́зва замі́жньої жінки́.
    correct: true
    explanation: Дружи́на — пито́ме украї́нське сло́во для замі́жньої жінки́.
  - statement: Фо́рма «зі Шта́тів» є непра́вильною в украї́нській мо́ві.
    correct: false
    explanation: Фо́рма зі Шта́тів є пра́вильною і милозву́чною че́рез збіг при́голосних
      [шт].
  - statement: Запита́ння «Зві́дки ти?» використо́вується у форма́льному спілкува́нні з
      профе́сором.
    correct: false
    explanation: 'З профе́сором ужива́ємо фо́рму поша́ни: Зві́дки ви?.'
- id: act-305
  type: match-up
  title: 'Ка́ртка знайо́мства: поля́ та зна́чення'
  instruction: З'єдна́й катего́рію анке́ти з відпові́дним за́писом.
  pairs:
  - left: Ім'я́
    right: Софі́я
  - left: Прі́звище
    right: Шевче́нко
  - left: Краї́на
    right: Украї́на
  - left: Мі́сто
    right: Ки́їв
  - left: Профе́сія
    right: лі́карка
  - left: Роди́на
    right: дружи́на
workbook:
- id: act-w4
  type: fill-in
  title: Допо́вни діало́г
  instruction: Обери́ фра́зу, я́ка заве́ршує рядо́к пе́ршого знайо́мства.
  items:
  - sentence: Приві́т! Як ___ зва́ти?
    answer: тебе́
    options:
    - тебе́
    - вас
    - це
    explanation: Приві́т пока́зує неформа́льну ситуа́цію з рове́сником.
  - sentence: Мене́ ___ Оле́на.
    answer: зва́ти
    options:
    - зва́ти
    - це
    - з
    explanation: Мене́ зва́ти... — блок для і́мені.
  - sentence: Мене́ зва́ти Марко́. ___ тебе́?
    answer: А
    options:
    - А
    - Хто
    - Що
    explanation: А тебе́? поверта́є пита́ння.
  - sentence: До́брий день! Як ___ зва́ти?
    answer: вас
    options:
    - вас
    - тебе́
    - я
    explanation: До́брий день пасу́є до форма́льної ве́рсії тут.
  - sentence: Ду́же ___!
    answer: приє́мно
    options:
    - приє́мно
    - Ки́їв
    - студе́нтка
    explanation: Ду́же приє́мно звучи́ть пі́сля о́бміну імена́ми.
  - sentence: ___ ти? Я з Кана́ди.
    answer: Зві́дки
    options:
    - Зві́дки
    - Хто
    - Що
    explanation: Зві́дки пита́є, зві́дки люди́на.
- id: act-w301
  type: match-up
  title: Міста́ та краї́ни
  instruction: З'єдна́й на́зву міста́ з краї́ною або́ о́писом розташува́ння.
  pairs:
  - left: Ки́їв
    right: столи́ця Украї́ни
  - left: Львів
    right: мі́сто на захо́ді Украї́ни
  - left: Оде́са
    right: мі́сто на пі́вдні Украї́ни
  - left: Торо́нто
    right: мі́сто в Кана́ді
  - left: Берлі́н
    right: мі́сто в Німе́ччині
  - left: Нью-Йорк
    right: мі́сто в Шта́тах
- id: act-w302
  type: group-sort
  title: Прийме́нник з чи зі
  instruction: Розпо́діли фра́зи за прийме́нником, яки́й у них ужива́ється.
  groups:
  - label: Прийме́нник з
    items:
    - з Украї́ни
    - з Кана́ди
    - з Німе́ччини
    - з Ки́єва
    - з Оде́си
  - label: Прийме́нник зі
    items:
    - зі Льво́ва
    - зі Шта́тів
- id: act-w303
  type: fill-in
  title: 'Фо́рмули знайо́мства: то́чний ви́бір'
  instruction: Обери́ прави́льне украї́нське сло́во для ко́жного ре́чення.
  items:
  - sentence: Це моя́ ___, Мари́на.
    answer: дружи́на
    options:
    - дружи́на
    - ка́ва
    explanation: Дружи́на — станда́ртне украї́нське сло́во.
  - sentence: Це мій ___, він лі́кар.
    answer: та́то
    options:
    - та́то
    - мі́сто
    explanation: Та́то — нейтра́льний початко́вий ви́бір для роди́ни.
  - sentence: ___, як вас зва́ти?
    answer: Ви́бачте
    options:
    - Ви́бачте
    - Дя́кую
    explanation: Ви́бачте — нормати́вна фо́рма зверта́ння.
  - sentence: Ду́же приє́мно! — Мені́ ___ приє́мно.
    answer: теж
    options:
    - теж
    - так
    explanation: Теж і та́кож — пито́мі украї́нські прислі́вники.
  - sentence: Ду́же дя́кую! — ___!
    answer: Будь ла́ска
    options:
    - Будь ла́ска
    - До поба́чення
    explanation: Будь ла́ска — украї́нська ві́дповідь на подя́ку.
  - sentence: Моє́ ___ — Шевче́нко.
    answer: прі́звище
    options:
    - прі́звище
    - краї́на
    explanation: Прі́звище означа́є родове́ ім'я́.
- id: act-w304
  type: translate
  title: Пере́клад ви́разів про похо́дження
  instruction: Обери́ пра́вильний англі́йський пере́клад для ко́жної украї́нської фра́зи.
  items:
  - source: Зві́дки ти?
    options:
    - text: Where are you from? informal
      correct: true
    - text: What is your name?
      correct: false
    - text: Who is this?
      correct: false
    explanation: Зві́дки ти? запи́тує про похо́дження рове́сника.
  - source: Я з Украї́ни.
    options:
    - text: I am from Ukraine.
      correct: true
    - text: I am from Canada.
      correct: false
    - text: I am a student.
      correct: false
    explanation: Я з Украї́ни означа́є I am from Ukraine.
  - source: Він зі Льво́ва.
    options:
    - text: He is from Lviv.
      correct: true
    - text: She is from Kyiv.
      correct: false
    - text: He is a doctor.
      correct: false
    explanation: Він зі Льво́ва вка́зує на мі́сто похо́дження чолові́ка.
  - source: Моє́ прі́звище — Ме́льник.
    options:
    - text: My surname is Melnyk.
      correct: true
    - text: My name is Melnyk.
      correct: false
    - text: My friend is Melnyk.
      correct: false
    explanation: Прі́звище переклада́ється як surname або́ last name.
  - source: Це моя́ дружи́на.
    options:
    - text: This is my wife.
      correct: true
    - text: This is my friend.
      correct: false
    - text: This is my mom.
      correct: false
    explanation: Дружи́на означа́є wife.
  - source: Я зі Шта́тів.
    options:
    - text: I am from the States.
      correct: true
    - text: I am from Germany.
      correct: false
    - text: I am from Odesa.
      correct: false
    explanation: Я зі Шта́тів означа́є I am from the States.
- id: act-w305
  type: error-correction
  title: Випра́в помилки́ у фра́зах похо́дження
  instruction: Обери́ пра́вильний нормати́вний варіа́нт ре́чення.
  items:
  - sentence: Я із Кана́ди.
    error: Я із Кана́ди.
    correction: Я з Кана́ди.
    options:
    - Я з Кана́ди.
    - Я із Кана́ди.
    explanation: 'Пере́д при́голосним [к] ужива́ємо прийме́нник з: Я з Кана́ди.'
  - sentence: Він з Льво́ва.
    error: Він з Льво́ва.
    correction: Він зі Льво́ва.
    options:
    - Він зі Льво́ва.
    - Він з Льво́ва.
    explanation: 'Пере́д збі́гом при́голосних [льв] ужива́ємо зі: Він зі Льво́ва.'
  - sentence: Це моя́ жена.
    error: Це моя́ жена.
    correction: Це моя́ дружи́на.
    options:
    - Це моя́ дружи́на.
    - Це моя́ жена.
    explanation: В украї́нській мо́ві вжива́ємо дружи́на.
  - sentence: Моя́ фамі́лія Ковале́нко.
    error: Моя́ фамі́лія Ковале́нко.
    correction: Моє́ прі́звище Ковале́нко.
    options:
    - Моє́ прі́звище Ковале́нко.
    - Моя́ фамі́лія Ковале́нко.
    explanation: 'Украї́нською мо́вою родове́ ім''я́ — це прі́звище (сере́дній рід: моє́
      прі́звище).'
  - sentence: Ізвиніть, зві́дки ви?
    error: Ізвиніть, зві́дки ви?
    correction: Ви́бачте, зві́дки ви?
    options:
    - Ви́бачте, зві́дки ви?
    - Ізвиніть, зві́дки ви?
    explanation: Ви́бачте або́ проба́чте — пра́вильні украї́нські фо́рми ви́бачення.
  - sentence: Мені́ тоже приє́мно.
    error: Мені́ тоже приє́мно.
    correction: Мені́ теж приє́мно.
    options:
    - Мені́ теж приє́мно.
    - Мені́ тоже приє́мно.
    explanation: В украї́нській мо́ві вжива́ємо теж або́ та́кож.
- id: act-w306
  type: quiz
  title: Пі́дсумок знайо́мства та похо́дження
  instruction: Обери́ пра́вильну ві́дповідь на запита́ння про мо́вні пра́вила знайо́мства.
  items:
  - prompt: Яке́ запита́ння слід поста́вити незнайо́мому доро́слому про краї́ну похо́дження?
    options:
    - text: Зві́дки ви?
      correct: true
    - text: Зві́дки ти?
      correct: false
    - text: Хто це?
      correct: false
    explanation: Для вві́чливого зверта́ння використо́вуємо Зві́дки ви?.
  - prompt: Як пра́вильно сказа́ти «I am from Germany» украї́нською мо́вою?
    options:
    - text: Я з Німе́ччини.
      correct: true
    - text: Я з Кана́ди.
      correct: false
    - text: Я з Ки́єва.
      correct: false
    explanation: Я з Німе́ччини переклада́ється як I am from Germany.
  - prompt: Чому́ ми гово́римо «зі Льво́ва», але́ «з Ки́єва»?
    options:
    - text: Че́рез збіг при́голосних [льв] для милозву́чності вжива́ємо «зі».
      correct: true
    - text: Це зале́жить від ро́зміру міста́.
      correct: false
    - text: Львів — це жіно́чий рід.
      correct: false
    explanation: Фо́рма зі вжива́ється для уни́кнення важко́го збі́гу при́голосних зву́ків.
  - prompt: Яке́ сло́во є пра́вильним украї́нським те́рміном для роди́нного і́мені (surname)?
    options:
    - text: прі́звище
      correct: true
    - text: фамі́лія
      correct: false
    - text: ім'я́
      correct: false
    explanation: Прі́звище — літерату́рне украї́нське сло́во.
  - prompt: Яки́й займе́нник узго́джується зі сло́вом «прі́звище»?
    options:
    - text: моє́ прі́звище
      correct: true
    - text: мій прі́звище
      correct: false
    - text: моя́ прі́звище
      correct: false
    explanation: Прі́звище — іме́нник сере́днього ро́ду, тому́ моє́ прі́звище.
  - prompt: 'Як пра́вильно відреагува́ти на предста́влення дружи́ни: «Це моя́ дружи́на Мари́на»?'
    options:
