inline:
- id: act-1
  type: quiz
  title: Ти чи ви?
  instruction: Обери́ фра́зу для ситуа́ції.
  items:
  - prompt: Ти знайо́мишся з одноку́рсником свого́ ві́ку.
    options:
    - text: Як тебе́ зва́ти?
      correct: true
    - text: Як вас зва́ти?
      correct: false
    explanation: З одни́м знайо́мим або́ рі́вним співрозмо́вником ужива́й тебе́.
  - prompt: Ти знайо́мишся з незнайо́мим доро́слим на орієнта́ції.
    options:
    - text: Як вас зва́ти?
      correct: true
    - text: Як тебе́ зва́ти?
      correct: false
    explanation: З незнайо́мим доро́слим або́ у форма́льній ситуа́ції ужива́й вас.
  - prompt: Одноку́рсник пита́є твоє́ ім'я́. Ти відповіда́єш і поверта́єш пита́ння.
    options:
    - text: Мене́ зва́ти Оле́на. А тебе́?
      correct: true
    - text: Мене́ зва́ти Оле́на. А вас?
      correct: false
    explanation: Рі́вна ситуа́ція залиша́ється неформа́льною.
  - prompt: Виклада́ч пита́є твоє́ ім'я́. Ти відповіда́єш і поверта́єш пита́ння.
    options:
    - text: Мене́ зва́ти Петро́. А вас?
      correct: true
    - text: Мене́ зва́ти Петро́. А тебе́?
      correct: false
    explanation: З викладаче́м ситуа́ція залиша́ється форма́льною.
- id: act-101
  type: match-up
  title: Ре́пліка та ві́дповідь
  instruction: З'єдна́й ре́пліку пе́ршого мо́вця з влу́чною ві́дповіддю співрозмо́вника.
  pairs:
  - left: Приві́т! Як тебе́ зва́ти?
    right: Мене́ зва́ти Марко́.
  - left: Мене́ зва́ти Оле́на. А тебе́?
    right: Мене́ зва́ти Марко́. Ду́же приє́мно!
  - left: До́брий день! Як вас зва́ти?
    right: Мене́ зва́ти Петро́.
  - left: Ду́же приє́мно!
    right: Мені́ та́кож.
  - left: Це Андрі́й. Він зі Льво́ва.
    right: Ду́же приє́мно. А хто це?
  - left: Ви з Украї́ни?
    right: Так, я з Ки́єва.
- id: act-102
  type: quiz
  title: Ре́пліки в розмо́ві
  instruction: Обери́ влу́чну ре́пліку для ко́жної ситуа́ції.
  items:
  - prompt: 'Співрозмо́вник сказа́в: «Приві́т! Як тебе́ зва́ти?». Що ти відповіда́єш?'
    options:
    - text: Мене́ зва́ти Оле́на. А тебе́?
      correct: true
    - text: Це ка́ва.
      correct: false
    - text: До поба́чення!
      correct: false
    explanation: На запита́ння про ім'я́ відповіда́й «Мене́ зва́ти...» і вві́чливо поверта́й
      запита́ння.
  - prompt: 'Виклада́ч на зу́стрічі запи́тує: «До́брий день! Як вас зва́ти?». Твоя́ ві́дповідь:'
    options:
    - text: Мене́ зва́ти Петро́. А вас?
      correct: true
    - text: Приві́т! А тебе́?
      correct: false
    - text: Я зі Льво́ва.
      correct: false
    explanation: У форма́льній розмо́ві вжива́й «А вас?».
  - prompt: 'Співрозмо́вник ка́же: «Ду́же приє́мно!». Я́ка вві́члива ві́дповідь?'
    options:
    - text: Мені́ та́кож.
      correct: true
    - text: Як тебе́ зва́ти?
      correct: false
    - text: Зві́дки ти?
      correct: false
    explanation: «Мені́ та́кож» або́ «Ду́же приє́мно!» — приро́дна ві́дповідь на вві́чливе
      знайо́мство.
  - prompt: Ти хо́чеш вві́чливо привіта́тися з викладаче́м уде́нь. Що сказа́ти?
    options:
    - text: До́брий день!
      correct: true
    - text: Приві́т!
      correct: false
    - text: До поба́чення!
      correct: false
    explanation: «До́брий день!» — вві́чливе де́нне віта́ння.
  - prompt: Ти віта́єшся з рове́сником у готе́лі. Що сказа́ти?
    options:
    - text: Приві́т!
      correct: true
    - text: До́брий день, па́не!
      correct: false
    - text: Як вас зва́ти?
      correct: false
    explanation: «Приві́т!» — неви́мушене віта́ння з одно́літком.
  - prompt: 'Ти хо́чеш перепита́ти ім''я́ дру́га пі́сля то́го, як назва́в своє́:'
    options:
    - text: А тебе́?
      correct: true
    - text: А у тебе́?
      correct: false
    - text: Хто це?
      correct: false
    explanation: Коро́тка фо́рма відлу́ння — «А тебе́?», без прийме́нника «у».
- id: act-2
  type: fill-in
  title: Скла́ди ім'я́
  instruction: Обери́ пропу́щене сло́во або́ фра́зу.
  items:
  - sentence: ___ зва́ти Марко́.
    answer: Мене́
    options:
    - Мене́
    - Ти
    - Це
    explanation: Мене́ зва́ти... — ці́лий блок для предста́влення і́мені.
  - sentence: Як ___ зва́ти?
    answer: тебе́
    options:
    - тебе́
    - я
    - він
    explanation: Як тебе́ зва́ти? — неформа́льне пита́ння.
  - prompt: "Як вас зва́ти?"
    sentence: Як ___ зва́ти?
    answer: вас
    options:
    - вас
    - во́на
    - ми
    explanation: Як вас зва́ти? — форма́льне або́ множи́нне пита́ння.
  - sentence: Ду́же ___!
    answer: приє́мно
    options:
    - приє́мно
    - студе́нт
    - зві́дки
    explanation: Ду́же приє́мно звучи́ть пі́сля о́бміну імена́ми.
  - sentence: Мене́ зва́ти Оле́на. А ___?
    answer: тебе́
    options:
    - тебе́
    - Ки́їв
    - це
    explanation: А тебе́? неформа́льно поверта́є пита́ння.
- id: act-104
  type: fill-in
  title: Діало́ги знайо́мства
  instruction: Встав пропу́щені слова́ у ре́пліки розмо́ви.
  items:
  - sentence: — Приві́т! Як ___ зва́ти? — Мене́ зва́ти Марко́.
    answer: тебе́
    options:
    - тебе́
    - вас
    - це
    explanation: «Приві́т!» пока́зує неформа́льну розмо́ву, тому́ вжива́ємо «тебе́».
  - sentence: — До́брий день! Як ___ зва́ти? — Мене́ зва́ти Петро́.
    answer: вас
    options:
    - вас
    - тебе́
    - хто
    explanation: «До́брий день!» пока́зує пова́жне зверта́ння, тому́ вжива́ємо «вас».
  - sentence: — Мене́ зва́ти Оле́на. ___ тебе́? — Мене́ зва́ти Марко́.
    answer: А
    options:
    - А
    - Хто
    - Що
    explanation: «А тебе́?» — коро́тке е́хо-пове́рнення запита́ння.
  - sentence: — Мене́ зва́ти Софі́я. ___ вас? — Мене́ зва́ти Петро́.
    answer: А
    options:
    - А
    - Де
    - Як
    explanation: «А вас?» — вві́чливе е́хо-пове́рнення запита́ння.
  - sentence: — Ду́же приє́мно! — Мені́ ___!
    answer: та́кож
    options:
    - та́кож
    - приві́т
    - хто
    explanation: «Мені́ та́кож!» — вві́члива ві́дповідь на «Ду́же приє́мно!».
  - sentence: — Ви́бачте, як вас зва́ти? — ___ зва́ти Ната́лка.
    answer: Мене́
    options:
    - Мене́
    - Я
    - Ти
    explanation: «Мене́ зва́ти...» — гото́ва констру́кція для предста́влення себе́.
workbook:
- id: act-w1
  type: error-correction
  title: Обери́ украї́нське ре́чення
  anchor_id: fix-common-l2-traps
  instruction: Обери́ безпе́чніший украї́нський рядо́к про іденти́чність.
  items:
  - sentence: Я є студе́нт.
    error: Я є студе́нт.
    correction: Я студе́нт.
    options:
    - Я студе́нт.
    - Я є студе́нт.
    explanation: У тепе́рішній іденти́чності кажи́ Я студе́нт або́ Я — студе́нт.
  - sentence: Моє́ ім'я́ є Джон.
    error: Моє́ ім'я́ є Джон.
    correction: Мене́ зва́ти Джон.
    options:
    - Мене́ зва́ти Джон.
    - Моє́ ім'я́ є Джон.
    explanation: Мене́ зва́ти... — часто́тна моде́ль пе́ршого предста́влення.
  - sentence: Мене́ зва́ти Марко́. А у тебе́?
    error: А у тебе́?
    correction: А тебе́?
    options:
    - А тебе́?
    - А у тебе́?
    explanation: На A1 ужива́й коро́ткий відлу́нний блок А тебе́?; фо́рму з у вивча́тимемо
      пізні́ше.
  - sentence: Окса́на ка́же, "Я (жі́нка) лі́кар."
    error: Я (жі́нка) лі́кар.
    correction: Я лі́карка.
    options:
    - Я лі́карка.
    - Я (жі́нка) лі́кар.
    explanation: Лі́карка — станда́ртна жіно́ча фо́рма для жінки́, я́ка працю́є лі́карем.
  - sentence: Воно́ мій та́то.
    error: Воно́
    correction: Це мій та́то.
    options:
    - Це мій та́то.
    - Воно́ мій та́то.
    explanation: Для пе́ршого назива́ння люди́ни вжива́й це; він можли́ве пі́сля цього́.
  - sentence: Приві́т, па́не профе́соре!
    error: Приві́т
    correction: До́брий день, па́не профе́соре!
    options:
    - До́брий день, па́не профе́соре!
    - Приві́т, па́не профе́соре!
    explanation: З профе́сором або́ незнайо́мим доро́слим ужива́й До́брий день.
- id: act-w101
  type: match-up
  title: Вві́чливі фра́зи
  instruction: З'єдна́й англі́йський ви́раз із пра́вильним украї́нським відпові́дником.
  pairs:
  - left: What is your name? (informal)
    right: Як тебе́ зва́ти?
  - left: What is your name? (formal)
    right: Як вас зва́ти?
  - left: My name is...
    right: Мене́ зва́ти...
  - left: And yours? (informal)
    right: А тебе́?
  - left: And yours? (formal)
    right: А вас?
  - left: Pleased to meet you!
    right: Ду́же приє́мно!
- id: act-w102
  type: group-sort
  title: Регі́стри знайо́мства
  instruction: Розпо́діли фра́зи за рі́внем вві́чливості.
  groups:
  - label: Неформа́льно (рове́сники, дру́зі)
    items:
    - Приві́т!
    - Як тебе́ зва́ти?
    - А тебе́?
  - label: Форма́льно (викладачі́, незнайо́мі лю́ди)
    items:
    - До́брий день!
    - Як вас зва́ти?
    - А вас?
- id: act-w103
  type: quiz
  title: Обери́ доре́чний ви́раз
  instruction: Обери́ найкра́щу фра́зу для ко́жної мовленнє́вої ситуа́ції.
  items:
  - prompt: 'Ти знайо́мишся з нови́м одноку́рсником в університе́ті:'
    options:
    - text: Приві́т! Як тебе́ зва́ти?
      correct: true
    - text: До́брий день, па́не профе́соре!
      correct: false
    explanation: 'З рове́сником та одноку́рсником ужива́й неви́мушене «ти»: «Як тебе́ зва́ти?».'
  - prompt: 'Ти віта́єшся з викладаче́м на ка́федрі:'
    options:
    - text: До́брий день! Як вас зва́ти?
      correct: true
    - text: Приві́т! Як тебе́ зва́ти?
      correct: false
    explanation: З викладаче́м за́вжди дотри́муємося форма́льного то́ну на «ви».
  - prompt: 'Співрозмо́вник відпові́в: «Ду́же приє́мно!». Що ти ска́жеш?'
    options:
    - text: Мені́ та́кож.
      correct: true
    - text: Як тебе́ зва́ти?
      correct: false
    explanation: «Мені́ та́кож.» — вві́члива взає́мна ві́дповідь.
  - prompt: 'Ти ненаро́ком зачепи́в люди́ну в аудито́рії й перепро́шуєш:'
    options:
    - text: Ви́бачте!
      correct: true
    - text: Будь ла́ска!
      correct: false
    explanation: «Ви́бачте» або́ «проба́чте» — пито́мі фо́рми ви́бачення.
  - prompt: 'Ти щи́ро дя́куєш за кори́сну пора́ду:'
    options:
    - text: Дя́кую!
      correct: true
    - text: До поба́чення!
      correct: false
    explanation: «Дя́кую» та «спаси́бі» — нормати́вні слова́ подя́ки.
  - prompt: 'Ти назва́в своє́ ім''я́ рове́сникові й хо́чеш дізна́тися йо́го ім''я́:'
    options:
    - text: А тебе́?
      correct: true
    - text: А у тебе́?
      correct: false
    explanation: «А тебе́?» — чи́стий ви́раз-відлу́ння без за́йвого прийме́нника «у».
- id: act-w104
  type: true-false
  title: Мо́вні фа́кти про знайо́мство
  instruction: Ви́знач, чи правди́ве ко́жне тве́рдження про украї́нське знайо́мство.
  statements:
  - statement: В украї́нській мо́ві фра́за «Мене́ зва́ти...» вжива́ється без дієслова́ «є».
    correct: true
    explanation: В украї́нській мо́ві дієсло́во-зв'я́зка «є» у цій констру́кції не потрі́бне.
  - statement: Фра́за «А тебе́?» — це вві́чливе пове́рнення запита́ння дру́гові чи рове́снику.
    correct: true
    explanation: «А тебе́?» неформа́льно поверта́є що́йно поста́влене запита́ння.
  - statement: Фо́рму «Як вас зва́ти?» вжива́ють лише́ тоді́, коли́ зверта́ються до діте́й.
    correct: false
    explanation: «Як вас зва́ти?» — це пова́жне зверта́ння до доро́слої люди́ни або́ гру́пи
      люде́й.
  - statement: Фра́за «А у тебе́?» є обов'язко́вим станда́ртом пе́ршого знайо́мства на рі́вні
      A1.
    correct: false
    explanation: На A1 вжива́ють прями́й е́хо-патерн «А тебе́?», уника́ючи прийменнико́вих
      форм.
  - statement: Сло́во «Приві́т!» підхо́дить для офіці́йної бе́сіди з дека́ном факульте́ту.
    correct: false
    explanation: Для офіці́йного зверта́ння використо́вують «До́брий день!».
  - statement: Ви́рази «дя́кую» та «спаси́бі» є пито́мими нормати́вними слова́ми подя́ки.
    correct: true
    explanation: Оби́два слова́ є нормати́вними в суча́сній украї́нській літерату́рній мо́ві.
- id: act-w105
  type: translate
  title: Пере́клад ключови́х ви́разів
  instruction: Обери́ пра́вильний украї́нський пере́клад для англі́йської фра́зи.
  items:
  - source: My name is Olena.
    options:
    - text: Мене́ зва́ти Оле́на.
      correct: true
    - text: Як тебе́ зва́ти?
      correct: false
    - text: Це Оле́на.
      correct: false
    explanation: «Мене́ зва́ти...» означа́є «My name is...».
  - source: What is your name? (informal)
    options:
    - text: Як тебе́ зва́ти?
      correct: true
    - text: Як вас зва́ти?
      correct: false
    - text: Зві́дки ти?
      correct: false
    explanation: Неформа́льне зверта́ння — «Як тебе́ зва́ти?».
  - source: What is your name? (formal)
    options:
    - text: Як вас зва́ти?
      correct: true
    - text: Як тебе́ зва́ти?
      correct: false
    - text: А вас?
      correct: false
    explanation: Форма́льне зверта́ння — «Як вас зва́ти?».
  - source: Pleased to meet you!
    options:
    - text: Ду́же приє́мно!
      correct: true
    - text: До́брий день!
      correct: false
    - text: До поба́чення!
      correct: false
    explanation: «Ду́же приє́мно!» переклада́ється як «Pleased to meet you!».
  - source: And yours? (informal)
    options:
    - text: А тебе́?
      correct: true
    - text: А вас?
      correct: false
    - text: Хто це?
      correct: false
    explanation: «А тебе́?» — неформа́льне е́хо-запита́ння.
  - source: Good afternoon!
    options:
    - text: До́брий день!
      correct: true
    - text: Приві́т!
      correct: false
    - text: Дя́кую!
      correct: false
    explanation: «До́брий день!» — вві́чливе де́нне привіта́ння.
- id: act-w106
  type: fill-in
  title: Обери́ нормати́вну фо́рму
  instruction: Запо́вни про́пуск пито́мим украї́нським сло́вом.
  items:
  - sentence: ___, як вас зва́ти?
    answer: Ви́бачте
    options:
    - Ви́бачте
    - Дя́кую
    explanation: «Ви́бачте» або́ «проба́чте» — нормати́вні фо́рми зверта́ння.
  - sentence: Ду́же приє́мно! — Мені́ ___!
    answer: теж
    options:
    - теж
    - так
    explanation: «Теж» або́ «та́кож» — пито́мі украї́нські відпові́дники.
  - sentence: Щи́ро ___ за розмо́ву!
    answer: дя́кую
    options:
    - дя́кую
    - приві́т
    explanation: «Дя́кую» або́ «спаси́бі» — нормати́вні слова́ подя́ки.
  - sentence: Мене́ зва́ти Марко́. ___ тебе́?
    answer: А
    options:
    - А
    - Чи
    explanation: На рі́вні A1 вжива́ємо безпе́чний зворо́т «А тебе́?».
  - sentence: ___, як ва́ші спра́ви?
    answer: Проба́чте
    options:
    - Проба́чте
    - До поба́чення
    explanation: «Проба́чте» — пито́ма украї́нська фо́рма ви́бачення.
  - sentence: Мене́ зва́ти Софі́я, і мені́ ___ приє́мно.
    answer: та́кож
    options:
    - та́кож
    - так
    explanation: «Та́кож» — пра́вильна літерату́рна фо́рма.
