    - та́то
    - сестра́
- id: act-w305
  type: unjumble
  title: Скла́ди ре́чення
  instruction: Розста́в слова́ у пра́вильному поря́дку, щоб утвори́ти ре́чення.
  items:
  - answer: Мене́ зва́ти Бо́гдан.
    words:
