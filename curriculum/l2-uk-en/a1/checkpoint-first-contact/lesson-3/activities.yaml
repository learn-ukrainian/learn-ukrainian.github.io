  - answer: Я з міста́ Дніпро́.
    words:
    - міста́
    - Я
    - Дніпро́.
    - з
  - answer: Моя́ профе́сія — вчи́телька.
    words:
    - вчи́телька.
    - Моя́
    - —
    - профе́сія
  - answer: Мені́ за́раз два́дцять рокі́в.
    words:
    - два́дцять
    - Мені́
    - рокі́в.
    - за́раз
  - answer: У мене́ є брат.
    words:
    - є
    - У
    - брат.
    - мене́
  - answer: Ду́же приє́мно познайо́митися.
    words:
    - познайо́митися.
    - Ду́же
    - приє́мно
