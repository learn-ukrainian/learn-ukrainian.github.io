inline:
- id: act-301
  type: quiz
  title: Підсумковий тест знань
  instruction: Обери правильний український рядок для кожної ситуації.
  items:
  - prompt: Як коректно запитати ім'я ровесника?
    options:
    - text: Як тебе звати?
      correct: true
    - text: Як твоє ім'я є?
      correct: false
    - text: Хто твоє звати?
      correct: false
    explanation: Стандартне запитання про ім'я до ровесника — Як тебе звати?
  - prompt: Як правильно назвати своє прізвище?
    options:
    - text: Моє прізвище Коваленко.
      correct: true
    - text: Моя фамілія Коваленко.
      correct: false
    - text: Я прізвище Коваленко.
      correct: false
    explanation: Прізвище — нейтральне та нормативне українське слово для родового
      імені.
  - prompt: Як повідомити про своє походження?
    options:
    - text: Я з Києва.
      correct: true
    - text: Я є від Києва.
      correct: false
    - text: Мене з Києва.
      correct: false
    explanation: Походження позначають конструкцією Я з... (або зі...).
  - prompt: Як природно сказати про свій фах або роль?
    options:
    - text: Я студент.
      correct: true
    - text: Я є студент.
      correct: false
    - text: Мене є студент.
      correct: false
    explanation: В українській мові дієслово «є» зазвичай опускають у теперішньому
      часі при позначенні статусу.
  - prompt: Як правильно вказати свій вік?
    options:
    - text: Мені 20 років.
      correct: true
    - text: Я маю 20 років.
      correct: false
    - text: Я є 20 років.
      correct: false
    explanation: 'Для віку вживають форму давального відмінка займенника: Мені ...
      років.'
  - prompt: Як ввічливо сказати «Nice to meet you» у відповідь на знайомство?
    options:
    - text: Дуже приємно!
      correct: true
    - text: Будь ласка!
      correct: false
    - text: До побачення!
      correct: false
    explanation: Дуже приємно — усталена формула ввічливості під час знайомства.
  - prompt: Яка відповідь підходить до репліки «Дуже приємно»?
    options:
    - text: Мені теж.
      correct: true
    - text: Я теж студент.
      correct: false
    - text: Мене звати.
      correct: false
    explanation: Мені теж означає взаємність ввічливості.
  - prompt: Як правильно сказати про наявність сестри?
    options:
    - text: У мене є сестра.
      correct: true
    - text: Я маю одна сестра.
      correct: false
    - text: Моя сестра є в мене.
      correct: false
    explanation: У мене є... — базовий конструктор наявності родичів.
- id: act-302
  type: fill-in
  title: Монолог самопрезентації
  instruction: Доповни текст випускної розповіді про себе потрібними словами.
  items:
  - sentence: ___ день! Мене звати Богдан.
    answer: Добрий
    options:
    - Добрий
    - Бувай
    - Фамілія
    explanation: Добрий день — стандартне ввічливе привітання.
  - sentence: Моє ___ Коваленко.
    answer: прізвище
    options:
    - прізвище
    - ім'я
    - звати
    explanation: Прізвище означає родове найменування.
  - sentence: Я ___ України, з міста Дніпро.
    answer: з
    options:
    - з
    - у
    - на
    explanation: Конструкція Я з... виражає походження.
  - sentence: Зараз я ___ університету.
    answer: студент
    options:
    - студент
    - є студент
    - звати
    explanation: В українському реченні теперішнього часу не додають є.
  - sentence: ___ 20 років.
    answer: Мені
    options:
    - Мені
    - Я маю
    - Мене
    explanation: Вік подається конструкцією Мені ... років.
  - sentence: У мене ___ брат і сестра.
    answer: є
    options:
    - є
    - звати
    - це
    explanation: Конструкція У мене є... позначає наявність рідних.
  - sentence: Мій ___ — інженер.
    answer: тато
    options:
    - тато
    - мама
    - сестра
    explanation: Тато — чоловічого роду, узгоджується із займенником мій.
  - sentence: Дуже приємно ___!
    answer: познайомитися
    options:
    - познайомитися
    - походження
    - професія
    explanation: Дуже приємно познайомитися — ввічливе завершення самопрезентації.
- id: act-303
  type: match-up
  title: Питання та репліки знайомства
  instruction: З'єднай запитання чи репліку з відповідною реакцією співрозмовника.
  pairs:
  - left: Як тебе звати?
    right: Мене звати Олена.
  - left: Звідки ти?
    right: Я з Канади.
  - left: Хто ти за фахом?
    right: Я майбутня вчителька.
  - left: Скільки тобі років?
    right: Мені 20 років.
  - left: У тебе є брати чи сестри?
    right: Так, у мене є брат.
  - left: Як звати твого брата?
    right: Його звати Назар.
  - left: Дуже приємно познайомитися!
    right: Мені теж дуже приємно!
  - left: До побачення!
    right: На все добре!
- id: act-304
  type: true-false
  title: Нормативне мовлення проти кальок
  instruction: Визнач, чи речення відповідає правилам української мови (Правда), чи
    містить кальку (Неправда).
  statements:
  - statement: Речення «Мене звати Максим» є нормативним для знайомства.
    correct: true
    explanation: Мене звати... — нормативна українська конструкція для імені.
  - statement: Речення «Моє ім'я є Максим» є природною українською фразою.
    correct: false
    explanation: Фраза «Моє ім'я є...» — буквальна калька з англійської.
  - statement: Фраза «Я студент» вживається без зв'язки «є».
    correct: true
    explanation: В українській мові дієслово «є» опускається при визначенні статусу.
  - statement: Конструкція «Я маю 20 років» є стандартною в українській мові.
    correct: false
    explanation: Нормативна форма позначення віку — «Мені 20 років».
  - statement: Слово «прізвище» є офіційним та стандартним для родового імені.
    correct: true
    explanation: Прізвище — нормативне українське слово (на відміну від «фамілія»).
  - statement: Конструкція «У мене є сестра» правильно передає наявність рідних.
    correct: true
    explanation: У мене є... — стандартний зворот для позначення родинних зв'язків.
workbook:
- id: act-w3
  type: fill-in
  title: Етикет у чаті
  instruction: Доповни коротку розмову в чаті курсу.
  items:
  - sentence: ___! Мене звати Ліна.
    answer: Привіт
    options:
    - Привіт
    - Пока
    - Прізвище
    explanation: Привіт відкриває неформальний чат.
  - sentence: Я ___ Одеси.
    answer: з
    options:
    - з
    - є
    - моя
    explanation: Я з... подає походження.
  - sentence: Привіт, ___!
    answer: Ліно
    options:
    - Ліно
    - Ліна
    - Ліну
    explanation: Ліно — клична форма прямого звертання.
  - sentence: Дуже ___!
    answer: приємно
    options:
    - приємно
    - професія
    - знайомство
    explanation: Дуже приємно — ввічлива відповідь під час першого знайомства.
  - sentence: Мені ___.
    answer: теж
    options:
    - теж
    - звати
    - професія
    explanation: Мені теж означає взаємну відповідь.
- id: act-w301
  type: match-up
  title: Українські поняття та їх значення
  instruction: З'єднай українське поняття з його англійським перекладом.
  pairs:
  - left: ім'я
    right: first name
  - left: прізвище
    right: surname
  - left: походження
    right: origin
  - left: професія
    right: profession
  - left: родина
    right: family
  - left: знайомство
    right: introduction / acquaintance
  - left: Дуже приємно
    right: very nice to meet you
  - left: До побачення
    right: goodbye
- id: act-w302
  type: quiz
  title: Граматичні форми першого контакту
  instruction: Обери правильну граматичну форму для заповнення речення.
  items:
  - prompt: 'Обери правильний присвійний займенник: «Це ___ брат».'
    options:
    - text: мій
      correct: true
    - text: моя
      correct: false
    - text: моє
      correct: false
    explanation: Брат — іменник чоловічого роду, тому вживаємо мій.
  - prompt: 'Обери правильний присвійний займенник: «Це ___ мама».'
    options:
    - text: моя
      correct: true
    - text: мій
      correct: false
    - text: мої
      correct: false
    explanation: Мама — іменник жіночого роду, тому вживаємо моя.
  - prompt: 'Обери правильний присвійний займенник: «Це ___ прізвище».'
    options:
    - text: моє
      correct: true
    - text: моя
      correct: false
    - text: мій
      correct: false
    explanation: Прізвище — іменник середнього роду, тому вживаємо моє.
  - prompt: 'Обери правильний присвійний займенник: «Це ___ батьки».'
    options:
    - text: мої
      correct: true
    - text: моє
      correct: false
    - text: мій
      correct: false
    explanation: Батьки — іменник у множині, тому вживаємо мої.
  - prompt: Як сказати про ім'я брата (він)?
    options:
    - text: Його звати Назар.
      correct: true
    - text: Її звати Назар.
      correct: false
    - text: Мене звати Назар.
      correct: false
    explanation: Для особи чоловічого роду використовуємо займенник його.
  - prompt: Як сказати про ім'я сестри (вона)?
    options:
    - text: Її звати Ірина.
      correct: true
    - text: Його звати Ірина.
      correct: false
    - text: Мені звати Ірина.
      correct: false
    explanation: Для особи жіночого роду використовуємо займенник її.
  - prompt: Яке звертання є правильною кличною формою до Богдана?
    options:
    - text: Богдане!
      correct: true
    - text: Богдан!
      correct: false
    - text: Богдану!
      correct: false
    explanation: Богдане — клична форма для звертання до Богдана.
  - prompt: Яке звертання є правильною кличною формою до Соломії?
    options:
    - text: Соломіє!
      correct: true
    - text: Соломія!
      correct: false
    - text: Соломію!
      correct: false
    explanation: Соломіє — клична форма для звертання до Соломії.
- id: act-w303
  type: fill-in
  title: Практика формул ввічливості
  instruction: Доповни діалоги потрібними словами ввічливості.
  items:
  - sentence: — Привіт! Мене звати Тарас. — ___, Тарасе!
    answer: Привіт
    options:
    - Привіт
    - До побачення
    - Років
    explanation: Привіт — дружня відповідь на привітання.
  - sentence: — Дуже приємно познайомитися! — Мені ___!
    answer: теж
    options:
    - теж
    - звати
    - привіт
    explanation: Мені теж виражає взаємність.
  - sentence: — Звідки ти? — Я ___ Львова.
    answer: зі
    options:
    - зі
    - в
    - на
    explanation: Зі вживається перед збігом приголосних (зі Львова).
  - sentence: — Дякую за допомогу! — ___ ласка!
    answer: Будь
    options:
    - Будь
    - Дуже
    - Привіт
    explanation: Будь ласка — стандартна формула ввічливості у відповідь на подяку.
  - sentence: — До ___! — На все добре!
    answer: побачення
    options:
    - побачення
    - приємно
    - походження
    explanation: До побачення — усталене ввічливе прощання.
  - sentence: — Ти студентка? — Так, я ___.
    answer: студентка
    options:
    - студентка
    - є студентка
    - був
    explanation: Відповідь зберігає граматичний рід та структуру без є.
  - sentence: — Скільки тобі років? — ___ 20 років.
    answer: Мені
    options:
    - Мені
    - Я
    - Мене
    explanation: Мені ... років — нормативна конструкція для віку.
  - sentence: — У тебе є сестра? — Так, у мене ___ сестра.
    answer: є
    options:
    - є
    - це
    - ім'я
    explanation: Конструкція У мене є... стверджує наявність.
- id: act-w304
  type: group-sort
  title: Тематичні групи
  instruction: Розподіли вирази та слова за темами спілкування.
  groups:
  - name: Привітання та прощання
    items:
    - Добрий день
    - До побачення
    - Привіт
  - name: Професія та статус
    items:
    - студент
    - вчителька
    - інженер
  - name: Члени родини
    items:
    - мама
    - тато
    - сестра
- id: act-w305
  type: unjumble
  title: Склади речення
  instruction: Розстав слова у правильному порядку, щоб утворити речення.
  items:
  - answer: Мене звати Богдан.
    words:
    - звати
    - Мене
    - Богдан.
  - answer: Я з міста Дніпро.
    words:
    - міста
    - Я
    - Дніпро.
    - з
  - answer: Моя професія — вчителька.
    words:
    - вчителька.
    - Моя
    - —
    - професія
  - answer: Мені зараз двадцять років.
    words:
    - двадцять
    - Мені
    - років.
    - зараз
  - answer: У мене є брат.
    words:
    - є
    - У
    - брат.
    - мене
  - answer: Дуже приємно познайомитися.
    words:
    - познайомитися.
    - Дуже
    - приємно
