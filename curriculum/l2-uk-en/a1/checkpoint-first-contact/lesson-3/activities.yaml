inline:
- id: act-301
  type: quiz
  title: Підсу́мковий тест знань
  instruction: Обери́ пра́вильний украї́нський рядо́к для ко́жної ситуа́ції.
  items:
  - prompt: Як коре́ктно запита́ти ім'я́ рове́сника?
    options:
    - text: Як тебе́ зва́ти?
      correct: true
    - text: Як твоє́ ім'я́ є?
      correct: false
    - text: Хто твоє́ зва́ти?
      correct: false
    explanation: Станда́ртне запита́ння про ім'я́ до рове́сника — Як тебе́ зва́ти?
  - prompt: Як пра́вильно назва́ти своє́ прі́звище?
    options:
    - text: Моє́ прі́звище Ковале́нко.
      correct: true
    - text: Моя́ фамі́лія Ковале́нко.
      correct: false
    - text: Я прі́звище Ковале́нко.
      correct: false
    explanation: Прі́звище — нейтра́льне та нормати́вне украї́нське сло́во для родово́го
      і́мені.
  - prompt: Як повідо́мити про своє́ похо́дження?
    options:
    - text: Я з Ки́єва.
      correct: true
    - text: Я є від Ки́єва.
      correct: false
    - text: Мене́ з Ки́єва.
      correct: false
    explanation: Похо́дження познача́ють констру́кцією Я з... (або́ зі...).
  - prompt: Як приро́дно сказа́ти про свій фах або́ роль?
    options:
    - text: Я студе́нт.
      correct: true
    - text: Я є студе́нт.
      correct: false
    - text: Мене́ є студе́нт.
      correct: false
    explanation: В украї́нській мо́ві дієсло́во «є» зазвича́й опуска́ють у тепе́рішньому
      ча́сі при позна́ченні ста́тусу.
  - prompt: Як пра́вильно вказа́ти свій вік?
    options:
    - text: Мені́ 20 рокі́в.
      correct: true
    - text: Я маю́ 20 рокі́в.
      correct: false
    - text: Я є 20 рокі́в.
      correct: false
    explanation: 'Для ві́ку вжива́ють фо́рму дава́льного відмі́нка займе́нника: Мені́ ...
      рокі́в.'
  - prompt: Як вві́чливо сказа́ти «Nice to meet you» у ві́дповідь на знайо́мство?
    options:
    - text: Ду́же приє́мно!
      correct: true
    - text: Будь ла́ска!
      correct: false
    - text: До поба́чення!
      correct: false
    explanation: Ду́же приє́мно — уста́лена фо́рмула вві́чливості під час знайо́мства.
  - prompt: Я́ка ві́дповідь підхо́дить до ре́пліки «Ду́же приє́мно»?
    options:
    - text: Мені́ теж.
      correct: true
    - text: Я теж студе́нт.
      correct: false
    - text: Мене́ зва́ти.
      correct: false
    explanation: Мені́ теж означа́є взає́мність вві́чливості.
  - prompt: Як пра́вильно сказа́ти про ная́вність се́стри?
    options:
    - text: У мене́ є сестра́.
      correct: true
    - text: Я маю́ одна́ сестра́.
      correct: false
    - text: Моя́ сестра́ є в мене́.
      correct: false
    explanation: У мене́ є... — ба́зовий констру́ктор ная́вності ро́дичів.
- id: act-302
  type: fill-in
  title: Моноло́г самопрезентації
  instruction: Допо́вни текст випускно́ї ро́зповіді про себе́ потрі́бними слова́ми.
  items:
  - sentence: ___ день! Мене́ зва́ти Бо́гдан.
    answer: До́брий
    options:
    - До́брий
    - Бува́й
    - Фамі́лія
    explanation: До́брий день — станда́ртне вві́чливе привіта́ння.
  - sentence: Моє́ ___ Ковале́нко.
    answer: прі́звище
    options:
    - прі́звище
    - ім'я́
    - зва́ти
    explanation: Прі́звище означа́є родове́ найменува́ння.
  - sentence: Я ___ Украї́ни, з міста́ Дніпро́.
    answer: з
    options:
    - з
    - у
    - на
    explanation: Констру́кція Я з... виража́є похо́дження.
  - sentence: За́раз я ___ університе́ту.
    answer: студе́нт
    options:
    - студе́нт
    - є студе́нт
    - зва́ти
    explanation: В украї́нському ре́ченні тепе́рішнього ча́су не додаю́ть є.
  - sentence: ___ 20 рокі́в.
    answer: Мені́
    options:
    - Мені́
    - Я маю́
    - Мене́
    explanation: Вік подає́ться констру́кцією Мені́ ... рокі́в.
  - sentence: У мене́ ___ брат і сестра́.
    answer: є
    options:
    - є
    - зва́ти
    - це
    explanation: Констру́кція У мене́ є... познача́є ная́вність рі́дних.
  - sentence: Мій ___ — інжене́р.
    answer: та́то
    options:
    - та́то
    - ма́ма
    - сестра́
    explanation: Та́то — чолові́чого ро́ду, узго́джується із займе́нником мій.
  - sentence: Ду́же приє́мно ___!
    answer: познайо́митися
    options:
    - познайо́митися
    - похо́дження
    - профе́сія
    explanation: Ду́же приє́мно познайо́митися — вві́чливе заве́ршення самопрезентації.
- id: act-303
  type: match-up
  title: Пита́ння та ре́пліки знайо́мства
  instruction: З'єдна́й запита́ння чи ре́пліку з відпові́дною реа́кцією співрозмо́вника.
  pairs:
  - left: Як тебе́ зва́ти?
    right: Мене́ зва́ти Оле́на.
  - left: Зві́дки ти?
    right: Я з Кана́ди.
  - left: Хто ти за фа́хом?
    right: Я майбу́тня вчи́телька.
  - left: Скі́льки тобі́ рокі́в?
    right: Мені́ 20 рокі́в.
  - left: У тебе́ є брати́ чи се́стри?
    right: Так, у мене́ є брат.
  - left: Як зва́ти твого́ бра́та?
    right: Йо́го зва́ти Наза́р.
  - left: Ду́же приє́мно познайо́митися!
    right: Мені́ теж ду́же приє́мно!
  - left: До поба́чення!
    right: На все до́бре!
- id: act-304
  type: true-false
  title: Нормати́вне мо́влення про́ти ка́льок
  instruction: Ви́знач, чи ре́чення відповіда́є пра́вилам украї́нської мо́ви (Пра́вда), чи
    мі́стить ка́льку (Непра́вда).
  statements:
  - statement: Ре́чення «Мене́ зва́ти Макси́м» є нормати́вним для знайо́мства.
    correct: true
    explanation: Мене́ зва́ти... — нормати́вна украї́нська констру́кція для і́мені.
  - statement: Ре́чення «Моє́ ім'я́ є Макси́м» є приро́дною украї́нською фра́зою.
    correct: false
    explanation: Фра́за «Моє́ ім'я́ є...» — буква́льна ка́лька з англі́йської.
  - statement: Фра́за «Я студе́нт» вжива́ється без зв'я́зки «є».
    correct: true
    explanation: В украї́нській мо́ві дієсло́во «є» опуска́ється при ви́значенні ста́тусу.
  - statement: Констру́кція «Я маю́ 20 рокі́в» є станда́ртною в украї́нській мо́ві.
    correct: false
    explanation: Нормати́вна фо́рма позна́чення ві́ку — «Мені́ 20 рокі́в».
  - statement: Сло́во «прі́звище» є офіці́йним та станда́ртним для родово́го і́мені.
    correct: true
    explanation: Прі́звище — нормати́вне украї́нське сло́во (на відмі́ну від «фамі́лія»).
  - statement: Констру́кція «У мене́ є сестра́» пра́вильно передає́ ная́вність рі́дних.
    correct: true
    explanation: У мене́ є... — станда́ртний зворо́т для позна́чення роди́нних зв'я́зків.
workbook:
- id: act-w3
  type: fill-in
  title: Етике́т у ча́ті
  instruction: Допо́вни коро́тку розмо́ву в ча́ті ку́рсу.
  items:
  - sentence: ___! Мене́ зва́ти Лі́на.
    answer: Приві́т
    options:
    - Приві́т
    - Пока
    - Прі́звище
    explanation: Приві́т відкрива́є неформа́льний чат.
  - sentence: Я ___ Оде́си.
    answer: з
    options:
    - з
    - є
    - моя́
    explanation: Я з... подає́ похо́дження.
  - sentence: Приві́т, ___!
    answer: Лі́но
    options:
    - Лі́но
    - Лі́на
    - Лі́ну
    explanation: Лі́но — кли́чна фо́рма прямо́го зверта́ння.
  - sentence: Ду́же ___!
    answer: приє́мно
    options:
    - приє́мно
    - профе́сія
    - знайо́мство
    explanation: Ду́же приє́мно — вві́члива ві́дповідь під час пе́ршого знайо́мства.
  - sentence: Мені́ ___.
    answer: теж
    options:
    - теж
    - зва́ти
    - профе́сія
    explanation: Мені́ теж означа́є взає́мну ві́дповідь.
- id: act-w301
  type: match-up
  title: Украї́нські поня́ття та їх зна́чення
  instruction: З'єдна́й украї́нське поня́ття з йо́го англі́йським пере́кладом.
  pairs:
  - left: ім'я́
    right: first name
  - left: прі́звище
    right: surname
  - left: похо́дження
    right: origin
  - left: профе́сія
    right: profession
  - left: роди́на
    right: family
  - left: знайо́мство
    right: introduction / acquaintance
  - left: Ду́же приє́мно
    right: very nice to meet you
  - left: До поба́чення
    right: goodbye
- id: act-w302
  type: quiz
  title: Грамати́чні фо́рми пе́ршого конта́кту
  instruction: Обери́ пра́вильну грамати́чну фо́рму для запо́внення ре́чення.
  items:
  - prompt: 'Обери́ пра́вильний присві́йний займе́нник: «Це ___ брат».'
    options:
    - text: мій
      correct: true
    - text: моя́
      correct: false
    - text: моє́
      correct: false
    explanation: Брат — іме́нник чолові́чого ро́ду, тому́ вжива́ємо мій.
  - prompt: 'Обери́ пра́вильний присві́йний займе́нник: «Це ___ ма́ма».'
    options:
    - text: моя́
      correct: true
    - text: мій
      correct: false
    - text: мої́
      correct: false
    explanation: Ма́ма — іме́нник жіно́чого ро́ду, тому́ вжива́ємо моя́.
  - prompt: 'Обери́ пра́вильний присві́йний займе́нник: «Це ___ прі́звище».'
    options:
    - text: моє́
      correct: true
    - text: моя́
      correct: false
    - text: мій
      correct: false
    explanation: Прі́звище — іме́нник сере́днього ро́ду, тому́ вжива́ємо моє́.
  - prompt: 'Обери́ пра́вильний присві́йний займе́нник: «Це ___ батьки́».'
    options:
    - text: мої́
      correct: true
    - text: моє́
      correct: false
    - text: мій
      correct: false
    explanation: Батьки́ — іме́нник у множині́, тому́ вжива́ємо мої́.
  - prompt: Як сказа́ти про ім'я́ бра́та (він)?
    options:
    - text: Йо́го зва́ти Наза́р.
      correct: true
    - text: Її зва́ти Наза́р.
      correct: false
    - text: Мене́ зва́ти Наза́р.
      correct: false
    explanation: Для осо́би чолові́чого ро́ду використо́вуємо займе́нник йо́го.
  - prompt: Як сказа́ти про ім'я́ се́стри (во́на)?
    options:
    - text: Її зва́ти Іри́на.
      correct: true
    - text: Йо́го зва́ти Іри́на.
      correct: false
    - text: Мені́ зва́ти Іри́на.
      correct: false
    explanation: Для осо́би жіно́чого ро́ду використо́вуємо займе́нник її.
  - prompt: Яке́ зверта́ння є пра́вильною кли́чною фо́рмою до Богда́на?
    options:
    - text: Бо́гдане!
      correct: true
    - text: Бо́гдан!
      correct: false
    - text: Бо́гдану!
      correct: false
    explanation: Бо́гдане — кли́чна фо́рма для зверта́ння до Богда́на.
  - prompt: Яке́ зверта́ння є пра́вильною кли́чною фо́рмою до Соломі́ї?
    options:
    - text: Соломі́є!
      correct: true
    - text: Соломі́я!
      correct: false
    - text: Соломі́ю!
      correct: false
    explanation: Соломі́є — кли́чна фо́рма для зверта́ння до Соломі́ї.
- id: act-w303
  type: fill-in
  title: Пра́ктика фо́рмул вві́чливості
  instruction: Допо́вни діало́ги потрі́бними слова́ми вві́чливості.
  items:
  - sentence: — Приві́т! Мене́ зва́ти Тара́с. — ___, Тара́се!
    answer: Приві́т
    options:
    - Приві́т
    - До поба́чення
    - Рокі́в
    explanation: Приві́т — дру́жня ві́дповідь на привіта́ння.
  - sentence: — Ду́же приє́мно познайо́митися! — Мені́ ___!
    answer: теж
    options:
    - теж
    - зва́ти
    - приві́т
    explanation: Мені́ теж виража́є взає́мність.
  - sentence: — Зві́дки ти? — Я ___ Льво́ва.
    answer: зі
    options:
    - зі
    - в
    - на
    explanation: Зі вжива́ється пере́д збі́гом при́голосних (зі Льво́ва).
  - sentence: — Дя́кую за допомо́гу! — ___ ла́ска!
    answer: Будь
    options:
    - Будь
    - Ду́же
    - Приві́т
    explanation: Будь ла́ска — станда́ртна фо́рмула вві́чливості у ві́дповідь на подя́ку.
  - sentence: — До ___! — На все до́бре!
    answer: поба́чення
    options:
    - поба́чення
    - приє́мно
    - похо́дження
    explanation: До поба́чення — уста́лене вві́чливе проща́ння.
  - sentence: — Ти студе́нтка? — Так, я ___.
    answer: студе́нтка
    options:
    - студе́нтка
    - є студе́нтка
    - був
    explanation: Ві́дповідь зберіга́є грамати́чний рід та структу́ру без є.
  - sentence: — Скі́льки тобі́ рокі́в? — ___ 20 рокі́в.
    answer: Мені́
    options:
    - Мені́
    - Я
    - Мене́
    explanation: Мені́ ... рокі́в — нормати́вна констру́кція для ві́ку.
  - sentence: — У тебе́ є сестра́? — Так, у мене́ ___ сестра́.
    answer: є
    options:
    - є
    - це
    - ім'я́
    explanation: Констру́кція У мене́ є... стве́рджує ная́вність.
- id: act-w304
  type: group-sort
  title: Темати́чні гру́пи
  instruction: Розпо́діли ви́рази та слова́ за те́мами спілкува́ння.
  groups:
  - name: Привіта́ння та проща́ння
