inline:
- id: act-1
  type: quiz
  title: Гото́вність до знайо́мства
  instruction: Обери́ безпе́чний украї́нський рядо́к для ситуа́ції.
  items:
  - prompt: Ти віта́єш рове́сника на поча́тку заня́ття.
    options:
    - text: Приві́т!
      correct: true
    - text: До поба́чення!
      correct: false
    - text: Мені́ теж.
      correct: false
    explanation: Приві́т — неформа́льне привіта́ння для рове́сника.
  - prompt: Ти нейтра́льно віта́єш викладача́ або́ адміністра́тора.
    options:
    - text: До́брий день!
      correct: true
    - text: Бува́й!
      correct: false
    - text: Мене́ зва́ти!
      correct: false
    explanation: До́брий день — безпе́чне нейтра́льне форма́льне привіта́ння.
  - prompt: Ти назива́єш своє́ ім'я́.
    options:
    - text: Мене́ зва́ти Оле́на.
      correct: true
    - text: Моє́ ім'я́ є Оле́на.
      correct: false
    - text: Я зва́ти Оле́на.
      correct: false
    explanation: Мене́ зва́ти... — головни́й блок для і́мені.
  - prompt: Ти ка́жеш, що ти студе́нт.
    options:
    - text: Я студе́нт.
      correct: true
    - text: Я є студе́нт.
      correct: false
    - text: Мене́ студе́нт.
      correct: false
    explanation: У тако́му ре́ченні украї́нська зазвича́й не додає́ є.
  - prompt: Ти ка́жеш свій вік.
    options:
    - text: Мені́ 20 рокі́в.
      correct: true
    - text: Я маю́ 20 рокі́в.
      correct: false
    - text: Я 20 роки́.
      correct: false
    explanation: Вік подаємо́ бло́ком Мені́ ... рокі́в.
  - prompt: Скі́льки лі́тер в украї́нській абе́тці?
    options:
    - text: '33'
      correct: true
    - text: '38'
      correct: false
    - text: '32'
      correct: false
    explanation: Украї́нська абе́тка ма́є 33 лі́тери.
  - prompt: Скі́льки зву́ків в украї́нській мо́ві?
    options:
    - text: '38'
      correct: true
    - text: '33'
      correct: false
    - text: '10'
      correct: false
    explanation: У ба́зовому підраху́нку ку́рсу украї́нська ма́є 38 зву́ків.
  - prompt: Що ро́бить м'яки́й знак у сло́ві день?
    options:
    - text: Пом'я́кшує попере́дній при́голосний.
      correct: true
    - text: Познача́є окре́мий голосни́й звук.
      correct: false
    - text: Замі́нює апостро́ф.
      correct: false
    explanation: Ь не ма́є вла́сного зву́ка; він пом'я́кшує попере́дній при́голосний.
  - prompt: Яке́ написа́ння з апостро́фом пра́вильне?
    options:
    - text: сі́м'я
      correct: true
    - text: сімя
      correct: false
    - text: сімья
      correct: false
    explanation: Ви́вчений роди́нний при́клад пи́шемо сі́м'я.
  - prompt: Де позначе́но на́голос?
    options:
    - text: Приві́т
      correct: true
    - text: Приві́т
      correct: false
    - text: Прівіт
      correct: false
    explanation: По́значка над голосно́ю пока́зує наголо́шений склад.
  - prompt: Ти додає́ш одну́ роди́нну фра́зу.
    options:
    - text: У мене́ є ма́ма і та́то.
      correct: true
    - text: Мене́ є ма́ма і та́то.
      correct: false
    - text: Я зва́ти ма́ма і та́то.
      correct: false
    explanation: У мене́ є... — безпе́чний блок для роди́ни.
  - prompt: Ти вві́чливо заве́ршуєш пе́рше знайо́мство.
    options:
    - text: Ду́же приє́мно. До поба́чення!
      correct: true
    - text: Ду́же прі́звище. Приві́т!
      correct: false
    - text: Зві́дки ти? Мені́ теж!
      correct: false
    explanation: Ду́же приє́мно і До поба́чення заве́ршують розмо́ву.
- id: act-2
  type: match-up
  title: Пита́ння і ві́дповіді
  instruction: З'єдна́й пита́ння з приро́дною ві́дповіддю.
  pairs:
  - left: Як тебе́ зва́ти?
    right: Мене́ зва́ти Бо́гдан.
  - left: Зві́дки ти?
    right: Я з Дніпра́.
  - left: Ти студе́нтка?
    right: Так, я студе́нтка.
  - left: У тебе́ є брат?
    right: Так, у мене́ є брат.
  - left: Як її зва́ти?
    right: Її зва́ти Іри́на.
  - left: Це твоя́ ма́ма?
    right: Так, це моя́ ма́ма.
  - left: Скі́льки тобі́ рокі́в?
    right: Мені́ 20 рокі́в.
  - left: Ду́же приє́мно.
    right: Мені́ теж.
- id: act-3
  type: fill-in
  title: Допо́вни текст
  instruction: Обери́ пропу́щене сло́во або́ блок у самопрезентації.
  items:
  - sentence: Приві́т! ___ зва́ти Марко́.
    answer: Мене́
    options:
    - Мене́
    - Моє́
    - Мій
    explanation: Мене́ зва́ти... — безпе́чний блок для і́мені.
  - sentence: Моє́ ___ Ковале́нко.
    answer: прі́звище
    options:
    - прі́звище
    - фамі́лія
    - профе́сія
    explanation: Прі́звище — станда́ртне украї́нське сло́во для родово́го і́мені.
  - sentence: Я ___ Ки́єва.
    answer: з
    options:
    - з
    - у
    - це
    explanation: Я з... дає́ похо́дження.
  - sentence: Я ___.
    answer: студе́нт
    options:
    - студе́нт
    - є студе́нт
    - мене́ студе́нт
    explanation: Ре́чення A1 про іденти́чність не потребу́є є.
  - sentence: ___ 20 рокі́в.
    answer: Мені́
    options:
    - Мені́
    - Я маю́
    - Мене́
    explanation: Вік подаємо́ бло́ком Мені́ ... рокі́в.
  - sentence: У мене́ ___ сестра́.
    answer: є
    options:
    - є
    - зва́ти
    - з
    explanation: У мене́ є... — блок, щоб сказа́ти, що хтось або́ щось є в мене́.
  - sentence: Це ___ ма́ма.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Ма́ма — жіно́чого ро́ду, тому́ моя́.
  - sentence: Ду́же ___ познайо́митися!
    answer: приє́мно
    options:
    - приє́мно
    - прі́звище
    - зва́ти
    explanation: Ду́же приє́мно познайо́митися заве́ршує знайо́мство.
- id: act-4
  type: quiz
  title: Випра́в A1.1 пастки́
  instruction: Обери́ нормати́вну украї́нську фо́рму.
  items:
  - prompt: Предста́влення і́мені
    options:
    - text: Мене́ зва́ти Джон.
      correct: true
    - text: Моє́ ім'я́ є Джон.
      correct: false
    explanation: Украї́нська представля́є ім'я́ че́рез Мене́ зва́ти...
  - prompt: Ре́чення іденти́чності
    options:
    - text: Я студе́нт.
      correct: true
    - text: Я є студе́нт.
      correct: false
    explanation: Тепе́рішня іденти́чність зазвича́й не додає́ є.
  - prompt: Ре́чення про вік
    options:
    - text: Мені́ 20 рокі́в.
      correct: true
    - text: Я маю́ 20 рокі́в.
      correct: false
    explanation: Вік подаємо́ бло́ком Мені́ ... рокі́в.
  - prompt: Пряме́ зверта́ння
    options:
    - text: Приві́т, Макси́ме!
      correct: true
    - text: Приві́т, Макси́м!
      correct: false
    explanation: Пряме́ зверта́ння ма́є кли́чну фо́рму в безпе́чному при́кладі.
  - prompt: Безпе́чне привіта́ння
    options:
    - text: До́брий день! Мене́ зва́ти Окса́на.
      correct: true
    - text: Здра́стуйте! Мене́ зва́ти Окса́на.
      correct: false
    explanation: До́брий день — безпе́чне станда́ртне привіта́ння.
  - prompt: Прі́звище
    options:
    - text: Моє́ прі́звище Сміт.
      correct: true
    - text: Моя́ фамі́лія Сміт.
      correct: false
    explanation: Прі́звище — станда́ртне украї́нське сло́во.
  - prompt: Проща́ння
    options:
    - text: До поба́чення!
      correct: true
    - text: Пока!
      correct: false
    explanation: До поба́чення — безпе́чне станда́ртне проща́ння.
  - prompt: Зви́чка до ро́ду іме́нника
    options:
    - text: Ви́вчення слова́ ра́зом із йо́го ро́дом
      correct: true
    - text: Ігнорува́ння ро́ду іме́нника
      correct: false
    explanation: Запам'ято́вуй украї́нський іме́нник ра́зом із підка́зками ро́ду.
workbook:
- id: act-w1
  type: quiz
  title: Швидки́й пере́клад
  instruction: Обери́ англі́йське зна́чення ко́жного украї́нського рядка́.
  items:
  - prompt: Мене́ зва́ти Оле́на.
    options:
    - text: My name is Olena.
      correct: true
    - text: I am from Olena.
      correct: false
    - text: Olena is my surname.
      correct: false
    explanation: Мене́ зва́ти... назива́є ім'я́.
  - prompt: Моє́ прі́звище Ме́льник.
    options:
    - text: My surname is Melnyk.
      correct: true
    - text: My profession is Melnyk.
      correct: false
    - text: My family is Melnyk.
      correct: false
    explanation: Прі́звище означа́є родове́ ім'я́.
  - prompt: Я з Кана́ди.
    options:
    - text: I am from Canada.
      correct: true
    - text: I am in Canada.
      correct: false
    - text: I have Canada.
      correct: false
    explanation: Я з... подає́ похо́дження.
  - prompt: Я студе́нтка.
    options:
    - text: I am a female student.
      correct: true
    - text: I have a student.
      correct: false
    - text: My name is student.
      correct: false
    explanation: У цьому́ ре́ченні іденти́чність ви́ражена іме́нником без є.
  - prompt: У мене́ є сестра́.
    options:
    - text: I have a sister.
      correct: true
    - text: You have a sister.
      correct: false
    - text: This is my sister.
      correct: false
    explanation: У мене́ є... — блок для ная́вності.
  - prompt: Мені́ теж.
    options:
    - text: Me too.
      correct: true
    - text: Nice to meet you.
      correct: false
    - text: Goodbye.
      correct: false
    explanation: Мені́ теж дає́ взає́мну ві́дповідь.
- id: act-w4
  type: match-up
  title: Пита́ння та ї́хнє зна́чення
  instruction: З'єдна́й украї́нське запита́ння з йо́го зна́ченням англі́йською.
  pairs:
  - left: Як тебе́ зва́ти?
    right: What is your name?
  - left: Зві́дки ти?
    right: Where are you from?
  - left: Ти студе́нт?
    right: Are you a student?
  - left: Скі́льки тобі́ рокі́в?
    right: How old are you?
  - left: У тебе́ є брат?
    right: Do you have a brother?
  - left: Хто це?
    right: Who is this?
- id: act-w5
  type: group-sort
  title: Рід іме́нників
  instruction: Розпо́діли іме́нники за грамати́чним ро́дом.
  groups:
  - name: Чолові́чий рід (він)
    items:
    - студе́нт
    - інжене́р
    - брат
  - name: Жіно́чий рід (во́на)
    items:
    - студе́нтка
    - вчи́телька
    - сестра́
  - name: Сере́дній рід (воно́)
    items:
    - мі́сто
    - прі́звище
    - ім'я́
- id: act-w6
  type: fill-in
  title: Присві́йні займе́нники
  instruction: Обери́ пра́вильну фо́рму присві́йного займе́нника.
  items:
  - sentence: Це ___ брат. Він інжене́р.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
    explanation: Брат — іме́нник чолові́чого ро́ду, тому́ вжива́ємо мій.
  - sentence: Це ___ сестра́. Во́на студе́нтка.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Сестра́ — іме́нник жіно́чого ро́ду, тому́ вжива́ємо моя́.
  - sentence: Це ___ мі́сто. Я тут живу́.
    answer: моє́
    options:
    - моє́
    - мій
    - моя́
    explanation: Мі́сто — іме́нник сере́днього ро́ду, тому́ вжива́ємо моє́.
  - sentence: Це ___ ма́ма. Во́на вчи́телька.
    answer: моя́
    options:
    - моя́
    - мій
    - мої́
    explanation: Ма́ма — жіно́чого ро́ду, тому́ вжива́ємо моя́.
  - sentence: Це ___ батьки́. Во́ни вдо́ма.
    answer: мої́
    options:
    - мої́
    - мій
    - моє́
    explanation: Батьки́ — множина́, тому́ вжива́ємо мої́.
  - sentence: Це ___ ім'я́. Воно́ коро́тке.
    answer: моє́
    options:
    - моє́
    - моя́
    - мій
    explanation: Ім'я́ — іме́нник сере́днього ро́ду, тому́ вжива́ємо моє́.
- id: act-w7
  type: unjumble
  title: Скла́ди ре́чення
  instruction: Розста́в слова́ у пра́вильному поря́дку, щоб утвори́ти приро́дне украї́нське
    ре́чення.
  items:
  - words:
    - Мене́
    - зва́ти
    - Оле́на.
    answer: Мене́ зва́ти Оле́на.
  - words:
    - Я
    - студе́нт
    - у
    - Ки́єві.
    answer: Я студе́нт у Ки́єві.
  - words:
    - У
    - мене́
    - є
    - сестра́.
    answer: У мене́ є сестра́.
  - words:
    - Моє́
    - прі́звище
    - Ковале́нко.
    answer: Моє́ прі́звище Ковале́нко.
  - words:
    - Я
    - з
    - Дніпра́.
    answer: Я з Дніпра́.
  - words:
    - Ду́же
    - приє́мно
    - познайо́митися.
    answer: Ду́же приє́мно познайо́митися.
- id: act-w8
  type: true-false
  title: Пра́вда чи непра́вда про знайо́мство
  instruction: Ви́знач, чи тве́рдження про украї́нське мо́влення пра́вильне.
  items:
  - statement: Для предста́влення вла́сного і́мені приро́дно каза́ти «Мене́ зва́ти...».
    correct: true
    explanation: Констру́кція «Мене́ зва́ти...» є станда́ртною та приро́дною для украї́нської
      мо́ви.
  - statement: У ре́ченні «Я студе́нт» обов'язко́во тре́ба писа́ти сло́во «є».
    correct: false
    explanation: В украї́нській мо́ві дієсло́во «бу́ти» у тепе́рішньому ча́сі зазвича́й не
      вжива́ється в таки́х ре́ченнях.
  - statement: Пита́ння «Зві́дки ти?» вжива́ють, щоб дізна́тися про похо́дження співрозмо́вника.
    correct: true
    explanation: «Зві́дки ти?» означа́є «Where are you from?» і запи́тує про похо́дження.
  - statement: Вік в украї́нській мо́ві познача́ють фра́зою «Я маю́ 20 рокі́в».
    correct: false
    explanation: Приро́дний ви́раз — «Мені́ 20 рокі́в» з дава́льним відмі́нком («мені́»).
  - statement: 'Сло́во «прі́звище» нале́жить до сере́днього ро́ду: «моє́ прі́звище».'
    correct: true
    explanation: «Прі́звище» закі́нчується на -е і є іме́нником сере́днього ро́ду.
  - statement: Фра́за «Бува́й!» є форма́льним віта́нням для розмо́ви з викладаче́м.
    correct: false
    explanation: «Бува́й!» — це неформа́льне проща́ння для дру́зів або́ рове́сників.
- id: act-w9
  type: anagram
  title: 'Анагра́ми: пе́рші слова́'
  instruction: Скла́ди украї́нське сло́во з переплу́таних лі́тер.
  items:
  - scrambled: в, і, т, п, и, р
    answer: приві́т
    hint: Неформа́льне привіта́ння
  - scrambled: т, с, е, с, р, а
    answer: сестра́
    hint: Член роди́ни
  - scrambled: я, с, і, м, '
    answer: сі́м'я
    hint: Близькі́ ро́дичі
  - scrambled: т, с, д, н, е, у, т
    answer: студе́нт
    hint: Люди́на, я́ка навча́ється
  - scrambled: б, р, т, а
    answer: брат
    hint: Член роди́ни
  - scrambled: м, с, т, о, і
    answer: мі́сто
    hint: Киї́в, Львів або́ Дніпро́
