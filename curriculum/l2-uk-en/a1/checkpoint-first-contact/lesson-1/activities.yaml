inline:
- id: act-1
  type: quiz
  title: Гото́вність до знайо́мства · Readiness for Introductions
  instruction: Обери́ безпе́чний украї́нський рядо́к для ситуа́ції · Choose the safe Ukrainian line for the situation.
  items:
  - prompt: Ти віта́єш рове́сника на поча́тку заня́ття.
    options:
    - text: Приві́т!
      correct: true
    - text: До поба́чення!
      correct: false
    - text: Мені́ теж.
      correct: false
    explanation: Приві́т — неформа́льне привіта́ння для рове́сника.
  - prompt: Ти нейтра́льно віта́єш викладача́ або́ адміністра́тора.
    options:
    - text: До́брий день!
      correct: true
    - text: Бува́й!
      correct: false
    - text: Мене́ зва́ти!
      correct: false
    explanation: До́брий день — безпе́чне нейтра́льне форма́льне привіта́ння.
  - prompt: Ти назива́єш своє́ ім'я́.
    options:
    - text: Мене́ зва́ти Оле́на.
      correct: true
    - text: Моє́ ім'я́ є Оле́на.
      correct: false
    - text: Я зва́ти Оле́на.
      correct: false
    explanation: Мене́ зва́ти... — головни́й бло́к для і́мені.
  - prompt: Ти ка́жеш, що ти студе́нт.
    options:
    - text: Я студе́нт.
      correct: true
    - text: Я є студе́нт.
      correct: false
    - text: Мене́ студе́нт.
      correct: false
    explanation: У тако́му ре́ченні украї́нська зазвича́й не додає́ є.
  - prompt: Ти ка́жеш свій ві́к.
    options:
    - text: Мені́ 20 ро́ків.
      correct: true
    - text: Я ма́ю 20 ро́ків.
      correct: false
    - text: Я 20 ро́ки.
      correct: false
    explanation: Ві́к подаємо́ бло́ком Мені́ ... ро́ків.
  - prompt: Скі́льки лі́тер в украї́нській абе́тці?
    options:
    - text: '33'
      correct: true
    - text: '38'
      correct: false
    - text: '32'
      correct: false
    explanation: Украї́нська абе́тка ма́є 33 лі́тери.
  - prompt: Скі́льки зву́ків в украї́нській мо́ві?
    options:
    - text: '38'
      correct: true
    - text: '33'
      correct: false
    - text: '10'
      correct: false
    explanation: У ба́зовому підраху́нку ку́рсу украї́нська ма́є 38 зву́ків.
  - prompt: Що ро́бить м'яки́й зна́к у сло́ві день?
    options:
    - text: Пом'я́кшує попере́дній при́голосний.
      correct: true
    - text: Познача́є окре́мий голосни́й зву́к.
      correct: false
    - text: Замі́нює апо́строф.
      correct: false
    explanation: Ь не ма́є вла́сного зву́ка; він пом'я́кшує попере́дній при́голосний.
  - prompt: Яке́ написа́ння з апо́строфом пра́вильне?
    options:
    - text: сім'я́
      correct: true
    - text: сімя
      correct: false
    - text: сімья
      correct: false
    explanation: Ви́вчений роди́нний при́клад пи́шемо сім'я́.
  - prompt: Де позна́чено на́голос?
    options:
    - text: Приві́т
      correct: true
    - text: Привіт
      correct: false
    - text: Прівіт
      correct: false
    explanation: По́значка над голосно́ю пока́зує наголо́шений скла́д.
  - prompt: Ти додає́ш одну́ роди́нну фра́зу.
    options:
    - text: У мене́ є ма́ма і та́то.
      correct: true
    - text: Мене́ є ма́ма і та́то.
      correct: false
    - text: Я зва́ти ма́ма і та́то.
      correct: false
    explanation: У мене́ є... — безпе́чний бло́к для роди́ни.
  - prompt: Ти вві́чливо заве́ршуєш пе́рше знайо́мство.
    options:
    - text: Ду́же приє́мно. До поба́чення!
      correct: true
    - text: Ду́же прі́звище. Приві́т!
      correct: false
    - text: Зві́дки ти? Мені́ теж!
      correct: false
    explanation: Ду́же приє́мно і До поба́чення заве́ршують розмо́ву.
- id: act-2
  type: match-up
  title: Пита́ння і ві́дповіді · Questions & Answers
  instruction: З'єдна́й пита́ння з приро́дною ві́дповіддю · Connect the question to a natural response.
  pairs:
  - left: Як тебе́ зва́ти?
    right: Мене́ зва́ти Богда́н.
  - left: Зві́дки ти?
    right: Я з Дніпра́.
  - left: Ти студе́нтка?
    right: Так, я студе́нтка.
  - left: У тебе́ є брат?
    right: Так, у мене́ є брат.
  - left: Як її́ зва́ти?
    right: Її́ зва́ти Іри́на.
  - left: Це твоя́ ма́ма?
    right: Так, це моя́ ма́ма.
  - left: Скі́льки тобі́ ро́ків?
    right: Мені́ 20 ро́ків.
  - left: Ду́же приє́мно.
    right: Мені́ теж.
- id: act-3
  type: fill-in
  title: Допо́вни те́кст · Complete the Text
  instruction: Обери́ пропу́щене сло́во або́ бло́к у знайо́мстві · Select the missing word or phrase in the introduction.
  items:
  - sentence: Приві́т! ___ зва́ти Марко́.
    answer: Мене́
    options:
    - Мене́
    - Моє́
    - Мій
    explanation: Мене́ зва́ти... — безпе́чний бло́к для і́мені.
  - sentence: Моє́ ___ Ковале́нко.
    answer: прі́звище
    options:
    - прі́звище
    - фамі́лія
    - профе́сія
    explanation: Прі́звище — станда́ртне украї́нське сло́во для родо́вого і́мені.
  - sentence: Я ___ Ки́єва.
    answer: з
    options:
    - з
    - у
    - це
    explanation: Я з... дає́ похо́дження.
  - sentence: Я ___.
    answer: студе́нт
    options:
    - студе́нт
    - є студе́нт
    - мене́ студе́нт
    explanation: Ре́чення A1 про іденти́чність не потребу́є є.
  - sentence: ___ 20 ро́ків.
    answer: Мені́
    options:
    - Мені́
    - Я ма́ю
    - Мене́
    explanation: Ві́к подаємо́ бло́ком Мені́ ... ро́ків.
  - sentence: У мене́ ___ сестра́.
    answer: є
    options:
    - є
    - зва́ти
    - з
    explanation: У мене́ є... — бло́к, щоб сказа́ти, що хто́сь або́ що́сь є в мене́.
  - sentence: Це ___ ма́ма.
    answer: моя́
    options:
    - моя́
    - мій
    - моє́
    explanation: Ма́ма — жіно́чого ро́ду, тому́ моя́.
  - sentence: Ду́же ___ познайо́митися!
    answer: приє́мно
    options:
    - приє́мно
    - прі́звище
    - зва́ти
    explanation: Ду́же приє́мно познайо́митися заве́ршує знайо́мство.
- id: act-4
  type: quiz
  title: Ви́прав A1.1 па́стки · Avoid A1.1 Traps
  instruction: Обери́ нормати́вну украї́нську фо́рму · Choose the standard Ukrainian phrasing.
  items:
  - prompt: Предста́влення і́мені
    options:
    - text: Мене́ зва́ти Джон.
      correct: true
    - text: Моє́ ім'я́ є Джон.
      correct: false
    explanation: Украї́нська представля́є ім'я́ че́рез Мене́ зва́ти...
  - prompt: Ре́чення іденти́чності
    options:
    - text: Я студе́нт.
      correct: true
    - text: Я є студе́нт.
      correct: false
    explanation: Тепе́рішня іденти́чність зазвича́й не додає́ є.
  - prompt: Ре́чення про вік
    options:
    - text: Мені́ 20 ро́ків.
      correct: true
    - text: Я ма́ю 20 ро́ків.
      correct: false
    explanation: Ві́к подаємо́ бло́ком Мені́ ... ро́ків.
  - prompt: Пряме́ зверта́ння
    options:
    - text: Приві́т, Макси́ме!
      correct: true
    - text: Приві́т, Макси́м!
      correct: false
    explanation: Пряме́ зверта́ння ма́є кли́чну фо́рму в безпе́чному при́кладі.
  - prompt: Безпе́чне привіта́ння
    options:
    - text: До́брий день! Мене́ зва́ти Окса́на.
      correct: true
    - text: Здра́стуйте! Мене́ зва́ти Окса́на.
      correct: false
    explanation: До́брий день — безпе́чне станда́ртне привіта́ння.
  - prompt: Прі́звище
    options:
    - text: Моє́ прі́звище Сміт.
      correct: true
    - text: Моя́ фамі́лія Сміт.
      correct: false
    explanation: Прі́звище — станда́ртне украї́нське сло́во.
  - prompt: Проща́ння
    options:
    - text: До поба́чення!
      correct: true
    - text: Пока!
      correct: false
    explanation: До поба́чення — безпе́чне станда́ртне проща́ння.
  - prompt: Зви́чка до ро́ду іме́нника
    options:
    - text: Ви́вчення слова́ ра́зом із йо́го ро́дом
      correct: true
    - text: Ігнорува́ння ро́ду іме́нника
      correct: false
    explanation: Запам'ято́вуй украї́нський іме́нник ра́зом із підка́зками ро́ду.
workbook:
- id: act-w1
  type: quiz
  title: Швидки́й пере́клад · Quick Translation
  instruction: Обери́ англі́йське зна́чення ко́жного украї́нського рядка́ · Select the English meaning of each Ukrainian line.
  items:
  - prompt: Мене́ зва́ти Оле́на.
    options:
    - text: My name is Olena.
      correct: true
    - text: I am from Olena.
      correct: false
    - text: Olena is my surname.
      correct: false
    explanation: Мене́ зва́ти... назива́є ім'я́.
  - prompt: Моє́ прі́звище Ме́льник.
    options:
    - text: My surname is Melnyk.
      correct: true
    - text: My profession is Melnyk.
      correct: false
    - text: My family is Melnyk.
      correct: false
    explanation: Прі́звище означа́є родове́ ім'я́.
  - prompt: Я з Кана́ди.
    options:
    - text: I am from Canada.
      correct: true
    - text: I am in Canada.
      correct: false
    - text: I have Canada.
      correct: false
    explanation: Я з... подає́ похо́дження.
  - prompt: Я студе́нтка.
    options:
    - text: I am a female student.
      correct: true
    - text: I have a student.
      correct: false
    - text: My name is student.
      correct: false
    explanation: У цьо́му ре́ченні іденти́чність ви́ражена іме́нником без є.
  - prompt: У мене́ є сестра́.
    options:
    - text: I have a sister.
      correct: true
    - text: You have a sister.
      correct: false
    - text: This is my sister.
      correct: false
    explanation: У мене́ є... — бло́к для ная́вності.
  - prompt: Мені́ теж.
    options:
    - text: Me too.
      correct: true
    - text: Nice to meet you.
      correct: false
    - text: Goodbye.
      correct: false
    explanation: Мені́ теж дає́ взає́мну ві́дповідь.
- id: act-w101
  type: match-up
  title: Зву́ки та лі́тери · Sounds & Letters
  instruction: З'єдна́й украї́нську лі́теру або́ зна́к із фонети́чним пра́вилом · Match the Ukrainian letter or mark with its rule.
  pairs:
  - left: Ь (м'яки́й зна́к)
    right: пом'я́кшує попере́дній при́голосний (softens preceding consonant)
  - left: "' (апо́строф)"
    right: розділя́є тверди́й при́голосний і йото́вану (separates consonant and iotated vowel)
  - left: Ї
    right: за́вжди познача́є два́ зву́ки [йі] (always two sounds [yi])
  - left: Є
    right: на поча́тку сло́ва познача́є [йе] (represents [ye] at word start)
  - left: І
    right: чи́стий голосни́й зву́к [i] (clean vowel sound [i])
  - left: И
    right: розсла́блений голосни́й зву́к [ɪ] (relaxed vowel sound [ɪ])
  - left: Ґ
    right: тверди́й проривни́й зву́к [g] (hard plosive sound [g])
- id: act-w102
  type: true-false
  title: Пра́вила пе́ршого конта́кту · First Contact Rules
  instruction: Ви́знач, чи пра́вильне тве́рдження про украї́нську мо́ву · Determine if each statement is true or false.
  statements:
  - statement: 'Украї́нське ре́чення «Я студе́нт» зазвича́й не потребу́є дієсло́ва «є» · The sentence "Я студе́нт" does not use "є".'
    correct: true
    explanation: 'У тепе́рішньому ча́сі в ре́ченнях іденти́чності дієсло́во-зв''я́зка опуска́ється.'
  - statement: 'Для офіці́йного предста́влення прі́звища вжива́ють сло́во «фамі́лія» · The word "фамі́лія" is standard for official surnames.'
    correct: false
    explanation: 'Станда́ртне украї́нське сло́во для родо́вого і́мені — «прі́звище».'
  - statement: 'Ві́к украї́нською виража́ють бло́ком «Мені́ ... ро́ків», а не «Я ма́ю ... ро́ків» · Age uses "Мені́ ... рокі́в", not "Я маю́".'
    correct: true
    explanation: '«Мені́ ... ро́ків» — приро́дна украї́нська констру́кція для ві́ку.'
  - statement: 'Фо́рма «Приві́т!» підхо́дить для зверта́ння до викладача́ · "Приві́т!" is appropriate for addressing a teacher.'
    correct: false
    explanation: '«Приві́т!» — неформа́льне віта́ння; для викладача́ кажи́ «До́брий день!».'
  - statement: 'У сло́ві «сім''я́» апо́строф розділя́є лі́тери «м» та «я» · In the word «сім''я́», the apostrophe separates «м» and «я».'
    correct: true
    explanation: 'Апо́строф пи́шеться пі́сля губни́х при́голосних пе́ред йото́ваними.'
  - statement: 'На запита́ння «Як тебе́ зва́ти?» станда́ртна ві́дповідь — «Мене́ зва́ти...» · The answer to "Як тебе́ зва́ти?" is "Мене́ зва́ти...".'
    correct: true
    explanation: '«Мене́ зва́ти...» — головни́й комунікати́вний бло́к для назви́ і́мені.'
- id: act-w103
  type: fill-in
  title: Особо́ві фо́рми та іденти́чність · Pronouns & Identity
  instruction: Обери́ пра́вильне сло́во або́ бло́к · Choose the correct word or form.
  items:
  - sentence: Приві́т! ___ зва́ти Тара́с · Hi! My name is Taras.
    answer: Мене́
    options:
    - Мене́
    - Моє́
    - Мій
    explanation: «Мене́ зва́ти...» — станда́ртний ви́раз для і́мені.
  - sentence: Я ___. Моя́ майбу́тня профе́сія — інжене́р · I am a student. My future profession is engineer.
    answer: студе́нт
    options:
    - студе́нт
    - є студе́нт
    - мене́ студе́нт
    explanation: Украї́нська не додає́ «є» в прості́ ре́чення іденти́чності.
  - sentence: ___ з Терно́поля · I am from Ternopil.
    answer: Я
    options:
    - Я
    - Мене́
    - Мені́
    explanation: «Я з...» познача́є похо́дження мо́вця.
  - sentence: Це моя́ сестра́. ___ зва́ти Іри́на · This is my sister. Her name is Iryna.
    answer: Її́
    options:
    - Її́
    - Йо́го
    - Вона́
    explanation: «Її́ зва́ти...» вжива́ємо для жіно́чого ро́ду.
  - sentence: Це мій брат. ___ зва́ти Наза́р · This is my brother. His name is Nazar.
    answer: Йо́го
    options:
    - Йо́го
    - Її́
    - Він
    explanation: «Йо́го зва́ти...» вжива́ємо для чолові́чого ро́ду.
  - sentence: Моє́ ___ — Ме́льник · My surname is Melnyk.
    answer: прі́звище
    options:
    - прі́звище
    - фамі́лія
    - ім'я́
    explanation: Сло́во «прі́звище» — станда́ртна на́зва родо́вого і́мені.
- id: act-w104
  type: group-sort
  title: Рід присві́йних слі́в · Gender of Possessive Words
  instruction: Розподіли́ слова́ за фо́рмами «мій» та «моя́» · Sort words by "мій" (masculine) and "моя́" (feminine).
  groups:
  - name: Мій (Masculine)
    items:
    - брат
    - та́то
    - інжене́р
  - name: Моя́ (Feminine)
    items:
    - ма́ма
    - сестра́
    - вчи́телька
- id: act-w105
  type: unjumble
  title: Склади́ безпе́чні ре́чення · Unjumble Safe Sentences
  instruction: Розташу́й слова́ у пра́вильному поря́дку · Arrange words to make natural sentences.
  items:
  - sentence: Мене́ зва́ти Марко́.
    words:
    - Мене́
    - зва́ти
    - Марко́.
  - sentence: Моє́ прі́звище Ковале́нко.
    words:
    - Моє́
    - прі́звище
    - Ковале́нко.
  - sentence: Я студе́нт із Ки́єва.
    words:
    - Я
    - студе́нт
    - із
    - Ки́єва.
  - sentence: Моя́ ма́ма — вчи́телька.
    words:
    - Моя́
    - ма́ма
    - —
    - вчи́телька.
  - sentence: Мій та́то — інжене́р.
    words:
    - Мій
