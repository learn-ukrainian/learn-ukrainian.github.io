# Lesson 1 review vocabulary: Reading, pronunciation, and core grammar frames
- lemma: ім'я́
  translation: first name
  pos: noun
  usage: Моє́ ім'я́ Оле́на.
- lemma: прі́звище
  translation: surname
  pos: noun
  usage: Моє́ прі́звище Ме́льник.
- lemma: Мене́ зва́ти
  translation: my name is
  pos: phrase
  usage: Мене́ зва́ти Бо́гдан.
- lemma: Як тебе́ зва́ти?
  translation: what is your name? informal
  pos: phrase
  usage: Як тебе́ зва́ти?
- lemma: Зві́дки ти?
  translation: where are you from? informal
  pos: phrase
  usage: Зві́дки ти?
- lemma: Я з
  translation: I am from
  pos: phrase
  usage: Я з Кана́ди.
- lemma: Мені́ 20 рокі́в
  translation: I am 20 years old
  pos: phrase
  usage: Мені́ 20 рокі́в.
- lemma: У мене́ є
  translation: I have
  pos: phrase
  usage: У мене́ є сестра́.
- lemma: студе́нт
  translation: male student
  pos: noun
  usage: Я студе́нт.
- lemma: вчи́телька
  translation: female teacher
  pos: noun
  usage: Вона́ вчи́телька.
- lemma: інжене́р
  translation: engineer
  pos: noun
  usage: Мій та́то — інжене́р.
- lemma: мій
  translation: my, masculine
  pos: pronoun
  usage: Це мій брат.
- lemma: моя́
  translation: my, feminine
  pos: pronoun
  usage: Це моя́ ма́ма.
- lemma: моє́
  translation: my, neuter
  pos: pronoun
  usage: Це моє́ прі́звище.
- lemma: мої́
  translation: my, plural
  pos: pronoun
  usage: Це мої́ батьки́.
