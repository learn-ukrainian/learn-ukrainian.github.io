# Lesson 2 review vocabulary: Dialogues, introductions, and spoken exchanges
- lemma: знайо́мство
  translation: acquaintance / introduction
  pos: noun
  usage: Це пе́рше знайо́мство.
- lemma: познайо́митися
  translation: to meet / get acquainted
  pos: verb
  usage: Ду́же приє́мно познайо́митися!
- lemma: профе́сія
  translation: profession
  pos: noun
  usage: Моя́ профе́сія — вчи́телька.
- lemma: націона́льність
  translation: nationality
  pos: noun
  usage: Моя́ націона́льність — кана́дка.
- lemma: похо́дження
  translation: origin
  pos: noun
  usage: Похо́дження відповіда́є на пита́ння Зві́дки ти?
- lemma: Віта́ю
  translation: hello / greetings
  pos: interjection
  usage: Віта́ю! Мене́ зва́ти Оле́на.
- lemma: Ду́же приє́мно
  translation: very nice to meet you
  pos: phrase
  usage: Ду́же приє́мно!
- lemma: Мені́ теж
  translation: me too
  pos: phrase
  usage: Мені́ теж.
- lemma: У тебе́ є
  translation: do you have / you have
  pos: phrase
  usage: У тебе́ є брат?
- lemma: студе́нтка
  translation: female student
  pos: noun
  usage: Я студе́нтка.
- lemma: украї́нка
  translation: Ukrainian woman
  pos: noun
  usage: Оле́на — украї́нка.
- lemma: кана́дка
  translation: Canadian woman
  pos: noun
  usage: Оле́на — кана́дка.
- lemma: брат
  translation: brother
  pos: noun
  usage: У мене́ є брат.
- lemma: сестра́
  translation: sister
  pos: noun
  usage: У мене́ є сестра́.
- lemma: йо́го
  translation: his / him
  pos: pronoun
  usage: Йо́го зва́ти Наза́р.
- lemma: її́
  translation: her
  pos: pronoun
  usage: Її́ зва́ти Іри́на.
