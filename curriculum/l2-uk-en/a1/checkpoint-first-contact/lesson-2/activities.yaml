inline:
- id: act-5
  type: fill-in
  title: Про́пуски в діало́зі
  instruction: Допо́вни діало́г на мо́вних ку́рсах.
  items:
  - sentence: ___! Мене́ зва́ти Бо́гдан.
    answer: Приві́т
    options:
    - Приві́т
    - Прі́звище
    - Рокі́в
    explanation: Приві́т відкрива́є розмо́ву рове́сників.
  - sentence: Приві́т, ___! Мене́ зва́ти Соломі́я.
    answer: Бо́гдане
    options:
    - Бо́гдане
    - Бо́гдан
    - Богда́на
    explanation: Бо́гдане — кли́чна фо́рма прямо́го зверта́ння.
  - sentence: Ду́же приє́мно, ___.
    answer: Соломі́є
    options:
    - Соломі́є
    - Соломі́я
    - Соломі́ю
    explanation: Соломі́є — кли́чна фо́рма прямо́го зверта́ння.
  - sentence: ___ ти? Я з Дніпра́.
    answer: Зві́дки
    options:
    - Зві́дки
    - Хто
    - Де
    explanation: Зві́дки ти? пита́є, зві́дки люди́на.
  - sentence: Моя́ майбу́тня ___ — вчи́телька.
    answer: профе́сія
    options:
    - профе́сія
    - прі́звище
    - знайо́мство
    explanation: Профе́сія назива́є фах або́ заня́ття.
  - sentence: У мене́ є сестра́. ___ зва́ти Іри́на.
    answer: Її
    options:
    - Її
    - Йо́го
    - Я
    explanation: Її підхо́дить до се́стри.
  - sentence: У мене́ є брат. ___ зва́ти Наза́р.
    answer: Йо́го
    options:
    - Йо́го
    - Її
    - Во́на
    explanation: Йо́го підхо́дить до бра́та.
  - sentence: Ду́же приє́мно ___!
    answer: познайо́митися
    options:
    - познайо́митися
    - похо́дження
    - допомогти́
    explanation: Ду́же приє́мно познайо́митися заве́ршує пе́ршу зу́стріч.
- id: act-201
  type: match-up
  title: Ре́пліки знайо́мства
  instruction: З'єдна́й запита́ння або́ ре́пліку з приро́дною ві́дповіддю у студе́нтській
    розмо́ві.
  pairs:
  - left: Приві́т! Мене́ зва́ти Бо́гдан.
    right: Приві́т, Бо́гдане! Мене́ зва́ти Соломі́я.
  - left: Ду́же приє́мно, Соломі́є.
    right: Мені́ теж. Зві́дки ти?
  - left: Я з Дніпра́. А ти?
    right: Я з Терно́поля.
  - left: Ти студе́нтка?
    right: Так, моя́ майбу́тня профе́сія — вчи́телька.
  - left: У тебе́ є брати́ чи се́стри?
    right: Так, у мене́ є сестра́ і брат.
  - left: Ду́же приє́мно познайо́митися.
    right: Мені́ теж. До поба́чення!
  - left: Як зва́ти твою́ сестру́?
    right: Її зва́ти Іри́на.
  - left: Як зва́ти твого́ бра́та?
    right: Йо́го зва́ти Наза́р.
- id: act-6
  type: quiz
  title: Поря́док знайо́мства
  instruction: Обери́ насту́пний рядо́к у розмо́ві.
  items:
  - prompt: 'Пе́рший рядо́к: Приві́т! Мене́ зва́ти Бо́гдан.'
    options:
    - text: Приві́т, Бо́гдане! Мене́ зва́ти Соломі́я.
      correct: true
    - text: До поба́чення!
      correct: false
    - text: Мені́ 20 рокі́в.
      correct: false
    explanation: І́нша люди́на відповіда́є привіта́нням та і́менем.
  - prompt: 'Рядо́к: Ду́же приє́мно, Соломі́є.'
    options:
    - text: Мені́ теж. Зві́дки ти?
      correct: true
    - text: Моє́ ім'я́ є Соломі́я.
      correct: false
    - text: Моя́ фамі́лія Сміт.
      correct: false
    explanation: Мені́ теж дає́ взає́мну ві́дповідь і ру́хає розмо́ву да́лі.
  - prompt: 'Рядо́к: Я з Дніпра́. А ти?'
    options:
    - text: Я з Терно́поля.
      correct: true
    - text: Йо́го зва́ти Наза́р.
      correct: false
    - text: Це мій брат.
      correct: false
    explanation: А ти? поверта́є пита́ння про похо́дження.
  - prompt: 'Рядо́к: У мене́ є брат.'
    options:
    - text: Ду́же приє́мно. До поба́чення!
      correct: true
    - text: Моє́ ім'я́ є брат.
      correct: false
    - text: Я маю́ брат рокі́в.
      correct: false
    explanation: Пі́сля роди́нного рядка́ пасу́є вві́чливе заве́ршення.
- id: act-202
  type: true-false
  title: Ка́ртка знайо́мства та мо́вний етике́т
  instruction: Ви́знач, чи тве́рдження про знайо́мство та запо́внення картки́ є пра́вильним.
  statements:
  - statement: У пе́ршій розмо́ві з рове́сником на ку́рсах приро́дно вжива́ти «ти».
    is_true: true
    explanation: Студе́нтський конте́кст передбача́є рівнопра́вний ти-регі́стр.
  - statement: У ка́ртці для родово́го і́мені вжива́ють сло́во «фамі́лія».
    is_true: false
    explanation: Нормати́вне украї́нське сло́во — «прі́звище».
  - statement: Фра́за «Мені́ теж» є вві́чливою ві́дповіддю на «Ду́же приє́мно».
    is_true: true
    explanation: «Мені́ теж» виража́є взає́мність.
  - statement: Фо́рма зверта́ння до Богда́на — «Приві́т, Бо́гдан!» без змі́ни закі́нчення.
    is_true: false
    explanation: 'В украї́нській мо́ві використо́вують кли́чну фо́рму: «Бо́гдане!».'
  - statement: У ві́дповідь на пита́ння про вік украї́нською ка́жуть «Я маю́ 20 рокі́в».
    is_true: false
    explanation: 'Нормати́вна моде́ль: «Мені́ 20 рокі́в».'
  - statement: Констру́кція «У мене́ є...» підхо́дить для ро́зповіді про рі́дних.
    is_true: true
    explanation: «У мене́ є сестра́ / брат» — безпе́чна моде́ль володі́ння.
  - statement: Пі́сля запита́ння «Зві́дки ти?» доре́чно відповісти́ «Я з Дніпра́».
    is_true: true
    explanation: «Я з...» виража́є похо́дження.
workbook:
- id: act-w2
  type: match-up
  title: Ка́рта ле́ксики
  instruction: З'єдна́й украї́нське контро́льне сло́во з англі́йською підка́зкою.
  pairs:
  - left: ім'я́
    right: first name
  - left: прі́звище
    right: surname
  - left: знайо́мство
    right: acquaintance or introduction
  - left: профе́сія
    right: profession
  - left: націона́льність
    right: nationality
  - left: похо́дження
    right: origin
  - left: Ду́же приє́мно
    right: very nice to meet you
  - left: Мені́ теж
    right: me too
- id: act-w201
  type: fill-in
  title: 'Випускна́ промо́ва: запо́вни про́пуски'
  instruction: Встав пра́вильне сло́во у ро́зповідь Оле́ни про себе́.
  items:
  - sentence: Приві́т! Мене́ ___ Оле́на.
    answer: зва́ти
    options:
    - зва́ти
    - прі́звище
    - маю́
    explanation: Мене́ зва́ти... — зви́чний блок для і́мені.
  - sentence: Моє́ ___ Ме́льник.
    answer: прі́звище
    options:
    - прі́звище
    - ім'я́
    - фамі́лія
    explanation: Прі́звище означа́є родове́ ім'я́.
  - sentence: Я з Кана́ди. Я ___.
    answer: кана́дка
    options:
    - кана́дка
    - кана́дський
    - кана́дець
    explanation: Кана́дка — позна́чення жінки́ за націона́льністю.
  - sentence: Я ___. Моя́ майбу́тня профе́сія — лі́карка.
    answer: студе́нтка
    options:
    - студе́нтка
    - є студе́нтка
    - студе́нт
    explanation: Іденти́чність тепе́рішнього ча́су подає́ться без «є».
  - sentence: Моя́ ма́ма — вчи́телька, а ___ та́то — інжене́р.
    answer: мій
    options:
    - мій
    - моя́
    - моє́
    explanation: Та́то — чолові́чого ро́ду, тому́ «мій та́то».
  - sentence: У мене́ ___ одна́ сестра́.
    answer: є
    options:
    - є
    - зва́ти
    - з
    explanation: У мене́ є... виража́є ная́вність.
  - sentence: Ду́же приє́мно ___!
    answer: познайо́митися
    options:
    - познайо́митися
    - похо́дження
    - знайо́мство
    explanation: Ду́же приє́мно познайо́митися — вві́чливий фіна́л знайо́мства.
- id: act-w202
  type: unjumble
  title: Скла́ди ре́чення з розмо́ви
  instruction: Розста́в слова́ у пра́вильному поря́дку, щоб утвори́ти ре́чення.
  items:
  - sentence: Як тебе́ зва́ти?
    words:
    - Як
    - тебе́
    - зва́ти?
  - sentence: Мене́ зва́ти Бо́гдан.
    words:
    - Мене́
    - зва́ти
    - Бо́гдан.
  - sentence: Зві́дки ти?
    words:
    - Зві́дки
    - ти?
  - sentence: Я з Дніпра́.
    words:
    - Я
    - з
    - Дніпра́.
  - sentence: У мене́ є сестра́.
    words:
    - У
    - мене́
    - є
    - сестра́.
  - sentence: Ду́же приє́мно познайо́митися.
    words:
    - Ду́же
    - приє́мно
    - познайо́митися.
- id: act-w203
  type: group-sort
  title: Комунікати́вні ро́лі ре́плік
  instruction: Розпо́діли ре́пліки за комунікати́вними гру́пами.
  groups:
  - name: Привіта́ння та знайо́мство
    items:
    - Приві́т!
    - Мене́ зва́ти Бо́гдан.
    - Ду́же приє́мно.
  - name: Ро́зповідь про роди́ну
    items:
    - У мене́ є брат.
    - Моя́ ма́ма — вчи́телька.
    - Мій та́то — інжене́р.
  - name: Проща́ння
    items:
    - До поба́чення!
    - Бува́й!
- id: act-w204
  type: match-up
  title: Присві́йні займе́нники та іме́нники
  instruction: Поєдна́й займе́нник або́ фо́рму з відпові́дним іме́нником.
  pairs:
  - left: мій
    right: та́то
  - left: моя́
    right: ма́ма
  - left: моє́
    right: прі́звище
  - left: мої́
    right: батьки́
  - left: йо́го
    right: брат
  - left: її
    right: сестра́
- id: act-w205
  type: odd-one-out
  title: Зна́йди за́йве сло́во
  instruction: Обери́ сло́во, яке́ не нале́жить до ціє́ї смислово́ї гру́пи.
  items:
  - words:
    - Приві́т
    - До́брий день
    - До поба́чення
    - Віта́ю
    correct: 2
    explanation: «До поба́чення» — проща́ння, а ре́шта слів — привіта́ння.
  - words:
    - ма́ма
    - та́то
    - сестра́
    - інжене́р
    correct: 3
    explanation: «Інжене́р» — на́зва профе́сії, а ре́шта слів — чле́ни роди́ни.
  - words:
    - вчи́телька
    - лі́карка
    - студе́нтка
    - прі́звище
    correct: 3
    explanation: «Прі́звище» — на́зва ро́ду і́мені, а ре́шта слів — фах або́ рід заня́ть.
  - words:
    - мій
    - моя́
    - моє́
    - зві́дки
    correct: 3
    explanation: «Зві́дки» — пита́льне сло́во, а ре́шта — присві́йні займе́нники.
  - words:
    - Дніпро́
    - Терно́піль
    - Киї́в
    - кана́дка
    correct: 3
    explanation: «Кана́дка» — націона́льність, а ре́шта — на́зви міст Украї́ни.
  - words:
    - Бо́гдане
    - Соломі́є
    - Лі́но
    - прі́звище
    correct: 3
    explanation: «Прі́звище» — початко́ва фо́рма іме́нника, а ре́шта — фо́рми кли́чного відмі́нка.
- id: act-w206
  type: quiz
  title: Ти́пові помилки́ під час знайо́мства
  instruction: Обери́ нормати́вне украї́нське ре́чення без ка́льок.
  items:
  - prompt: Як назва́ти своє́ прі́звище?
    options:
    - text: Моє́ прі́звище Шевче́нко.
      correct: true
    - text: Моя́ фамі́лія Шевче́нко.
      correct: false
    explanation: «Прі́звище» — нормати́вне украї́нське сло́во.
  - prompt: Як повідо́мити, що ти студе́нт?
    options:
    - text: Я студе́нт.
      correct: true
    - text: Я є студе́нт.
      correct: false
    explanation: Зв'я́зка «є» опуска́ється в тепе́рішньому ча́сі.
  - prompt: Як назва́ти своє́ ім'я́?
    options:
    - text: Мене́ зва́ти Соломі́я.
      correct: true
    - text: Моє́ ім'я́ є Соломі́я.
      correct: false
    explanation: 'Нормати́вна фра́за: «Мене́ зва́ти...».'
  - prompt: Як сказа́ти про ная́вність се́стри?
    options:
    - text: У мене́ є сестра́.
      correct: true
    - text: Я маю́ сестра́.
      correct: false
    explanation: 'Констру́кція володі́ння: «У мене́ є...».'
  - prompt: Як зверну́тися до рове́сника на ім'я́ Бо́гдан?
    options:
    - text: Приві́т, Бо́гдане!
      correct: true
    - text: Приві́т, Бо́гдан!
      correct: false
    explanation: 'У прямо́му зверта́нні вжива́ють кли́чну фо́рму: «Бо́гдане».'
  - prompt: Як че́мно відповісти́ на «Ду́же приє́мно»?
    options:
    - text: Мені́ теж.
      correct: true
    - text: Я теж приє́мно.
      correct: false
    explanation: «Мені́ теж» виража́є взає́мну приє́мність.
