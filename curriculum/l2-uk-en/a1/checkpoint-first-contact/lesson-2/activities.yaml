inline:
- id: act-5
  type: fill-in
  title: Пропуски в діалозі
  instruction: Доповни діалог на мовних курсах.
  items:
  - sentence: ___! Мене звати Богдан.
    answer: Привіт
    options:
    - Привіт
    - Прізвище
    - Років
    explanation: Привіт відкриває розмову ровесників.
  - sentence: Привіт, ___! Мене звати Соломія.
    answer: Богдане
    options:
    - Богдане
    - Богдан
    - Богдана
    explanation: Богдане — клична форма прямого звертання.
  - sentence: Дуже приємно, ___.
    answer: Соломіє
    options:
    - Соломіє
    - Соломія
    - Соломію
    explanation: Соломіє — клична форма прямого звертання.
  - sentence: ___ ти? Я з Дніпра.
    answer: Звідки
    options:
    - Звідки
    - Хто
    - Де
    explanation: Звідки ти? питає, звідки людина.
  - sentence: Моя майбутня ___ — вчителька.
    answer: професія
    options:
    - професія
    - прізвище
    - знайомство
    explanation: Професія називає фах або заняття.
  - sentence: У мене є сестра. ___ звати Ірина.
    answer: Її
    options:
    - Її
    - Його
    - Я
    explanation: Її підходить до сестри.
  - sentence: У мене є брат. ___ звати Назар.
    answer: Його
    options:
    - Його
    - Її
    - Вона
    explanation: Його підходить до брата.
  - sentence: Дуже приємно ___!
    answer: познайомитися
    options:
    - познайомитися
    - походження
    - допомогти
    explanation: Дуже приємно познайомитися завершує першу зустріч.
- id: act-201
  type: match-up
  title: Репліки знайомства
  instruction: З'єднай запитання або репліку з природною відповіддю у студентській
    розмові.
  pairs:
  - left: Привіт! Мене звати Богдан.
    right: Привіт, Богдане! Мене звати Соломія.
  - left: Дуже приємно, Соломіє.
    right: Мені теж. Звідки ти?
  - left: Я з Дніпра. А ти?
    right: Я з Тернополя.
  - left: Ти студентка?
    right: Так, моя майбутня професія — вчителька.
  - left: У тебе є брати чи сестри?
    right: Так, у мене є сестра і брат.
  - left: Дуже приємно познайомитися.
    right: Мені теж. До побачення!
  - left: Як звати твою сестру?
    right: Її звати Ірина.
  - left: Як звати твого брата?
    right: Його звати Назар.
- id: act-6
  type: quiz
  title: Порядок знайомства
  instruction: Обери наступний рядок у розмові.
  items:
  - prompt: 'Перший рядок: Привіт! Мене звати Богдан.'
    options:
    - text: Привіт, Богдане! Мене звати Соломія.
      correct: true
    - text: До побачення!
      correct: false
    - text: Мені 20 років.
      correct: false
    explanation: Інша людина відповідає привітанням та іменем.
  - prompt: 'Рядок: Дуже приємно, Соломіє.'
    options:
    - text: Мені теж. Звідки ти?
      correct: true
    - text: Моє ім'я є Соломія.
      correct: false
    - text: Моя фамілія Сміт.
      correct: false
    explanation: Мені теж дає взаємну відповідь і рухає розмову далі.
  - prompt: 'Рядок: Я з Дніпра. А ти?'
    options:
    - text: Я з Тернополя.
      correct: true
    - text: Його звати Назар.
      correct: false
    - text: Це мій брат.
      correct: false
    explanation: А ти? повертає питання про походження.
  - prompt: 'Рядок: У мене є брат.'
    options:
    - text: Дуже приємно. До побачення!
      correct: true
    - text: Моє ім'я є брат.
      correct: false
    - text: Я маю брат років.
      correct: false
    explanation: Після родинного рядка пасує ввічливе завершення.
- id: act-202
  type: true-false
  title: Картка знайомства та мовний етикет
  instruction: Визнач, чи твердження про знайомство та заповнення картки є правильним.
  statements:
  - statement: У першій розмові з ровесником на курсах природно вживати «ти».
    is_true: true
    explanation: Студентський контекст передбачає рівноправний ти-регістр.
  - statement: У картці для родового імені вживають слово «фамілія».
    is_true: false
    explanation: Нормативне українське слово — «прізвище».
  - statement: Фраза «Мені теж» є ввічливою відповіддю на «Дуже приємно».
    is_true: true
    explanation: «Мені теж» виражає взаємність.
  - statement: Форма звертання до Богдана — «Привіт, Богдан!» без зміни закінчення.
    is_true: false
    explanation: 'В українській мові використовують кличну форму: «Богдане!».'
  - statement: У відповідь на питання про вік українською кажуть «Я маю 20 років».
    is_true: false
    explanation: 'Нормативна модель: «Мені 20 років».'
  - statement: Конструкція «У мене є...» підходить для розповіді про рідних.
    is_true: true
    explanation: «У мене є сестра / брат» — безпечна модель володіння.
  - statement: Після запитання «Звідки ти?» доречно відповісти «Я з Дніпра».
    is_true: true
    explanation: «Я з...» виражає походження.
workbook:
- id: act-w2
  type: match-up
  title: Карта лексики
  instruction: З'єднай українське контрольне слово з англійською підказкою.
  pairs:
  - left: ім'я
    right: first name
  - left: прізвище
    right: surname
  - left: знайомство
    right: acquaintance or introduction
  - left: професія
    right: profession
  - left: національність
    right: nationality
  - left: походження
    right: origin
  - left: Дуже приємно
    right: very nice to meet you
  - left: Мені теж
    right: me too
- id: act-w201
  type: fill-in
  title: 'Випускна промова: заповни пропуски'
  instruction: Встав правильне слово у розповідь Олени про себе.
  items:
  - sentence: Привіт! Мене ___ Олена.
    answer: звати
    options:
    - звати
    - прізвище
    - маю
    explanation: Мене звати... — звичний блок для імені.
  - sentence: Моє ___ Мельник.
    answer: прізвище
    options:
    - прізвище
    - ім'я
    - фамілія
    explanation: Прізвище означає родове ім'я.
  - sentence: Я з Канади. Я ___.
    answer: канадка
    options:
    - канадка
    - канадський
    - канадець
    explanation: Канадка — позначення жінки за національністю.
  - sentence: Я ___. Моя майбутня професія — лікарка.
    answer: студентка
    options:
    - студентка
    - є студентка
    - студент
    explanation: Ідентичність теперішнього часу подається без «є».
  - sentence: Моя мама — вчителька, а ___ тато — інженер.
    answer: мій
    options:
    - мій
    - моя
    - моє
    explanation: Тато — чоловічого роду, тому «мій тато».
  - sentence: У мене ___ одна сестра.
    answer: є
    options:
    - є
    - звати
    - з
    explanation: У мене є... виражає наявність.
  - sentence: Дуже приємно ___!
    answer: познайомитися
    options:
    - познайомитися
    - походження
    - знайомство
    explanation: Дуже приємно познайомитися — ввічливий фінал знайомства.
- id: act-w202
  type: unjumble
  title: Склади речення з розмови
  instruction: Розстав слова у правильному порядку, щоб утворити речення.
  items:
  - sentence: Як тебе звати?
    words:
    - Як
    - тебе
    - звати?
  - sentence: Мене звати Богдан.
    words:
    - Мене
    - звати
    - Богдан.
  - sentence: Звідки ти?
    words:
    - Звідки
    - ти?
  - sentence: Я з Дніпра.
    words:
    - Я
    - з
    - Дніпра.
  - sentence: У мене є сестра.
    words:
    - У
    - мене
    - є
    - сестра.
  - sentence: Дуже приємно познайомитися.
    words:
    - Дуже
    - приємно
    - познайомитися.
- id: act-w203
  type: group-sort
  title: Комунікативні ролі реплік
  instruction: Розподіли репліки за комунікативними групами.
  groups:
  - name: Привітання та знайомство
    items:
    - Привіт!
    - Мене звати Богдан.
    - Дуже приємно.
  - name: Розповідь про родину
    items:
    - У мене є брат.
    - Моя мама — вчителька.
    - Мій тато — інженер.
  - name: Прощання
    items:
    - До побачення!
    - Бувай!
- id: act-w204
  type: match-up
  title: Присвійні займенники та іменники
  instruction: Поєднай займенник або форму з відповідним іменником.
  pairs:
  - left: мій
    right: тато
  - left: моя
    right: мама
  - left: моє
    right: прізвище
  - left: мої
    right: батьки
  - left: його
    right: брат
  - left: її
    right: сестра
- id: act-w205
  type: odd-one-out
  title: Знайди зайве слово
  instruction: Обери слово, яке не належить до цієї смислової групи.
  items:
  - words:
    - Привіт
    - Добрий день
    - До побачення
    - Вітаю
    correct: 2
    explanation: «До побачення» — прощання, а решта слів — привітання.
  - words:
    - мама
    - тато
    - сестра
    - інженер
    correct: 3
    explanation: «Інженер» — назва професії, а решта слів — члени родини.
  - words:
    - вчителька
    - лікарка
    - студентка
    - прізвище
    correct: 3
    explanation: «Прізвище» — назва роду імені, а решта слів — фах або рід занять.
  - words:
    - мій
    - моя
    - моє
    - звідки
    correct: 3
    explanation: «Звідки» — питальне слово, а решта — присвійні займенники.
  - words:
    - Дніпро
    - Тернопіль
    - Київ
    - канадка
    correct: 3
    explanation: «Канадка» — національність, а решта — назви міст України.
  - words:
    - Богдане
    - Соломіє
    - Ліно
    - прізвище
    correct: 3
    explanation: «Прізвище» — початкова форма іменника, а решта — форми кличного відмінка.
- id: act-w206
  type: quiz
  title: Типові помилки під час знайомства
  instruction: Обери нормативне українське речення без кальок.
  items:
  - prompt: Як назвати своє прізвище?
    options:
    - text: Моє прізвище Шевченко.
      correct: true
    - text: Моя фамілія Шевченко.
      correct: false
    explanation: «Прізвище» — нормативне українське слово.
  - prompt: Як повідомити, що ти студент?
    options:
    - text: Я студент.
      correct: true
    - text: Я є студент.
      correct: false
    explanation: Зв'язка «є» опускається в теперішньому часі.
  - prompt: Як назвати своє ім'я?
    options:
    - text: Мене звати Соломія.
      correct: true
    - text: Моє ім'я є Соломія.
      correct: false
    explanation: 'Нормативна фраза: «Мене звати...».'
  - prompt: Як сказати про наявність сестри?
    options:
    - text: У мене є сестра.
      correct: true
    - text: Я маю сестра.
      correct: false
    explanation: 'Конструкція володіння: «У мене є...».'
  - prompt: Як звернутися до ровесника на ім'я Богдан?
    options:
    - text: Привіт, Богдане!
      correct: true
    - text: Привіт, Богдан!
      correct: false
    explanation: 'У прямому звертанні вживають кличну форму: «Богдане».'
  - prompt: Як чемно відповісти на «Дуже приємно»?
    options:
    - text: Мені теж.
      correct: true
    - text: Я теж приємно.
      correct: false
    explanation: «Мені теж» виражає взаємну приємність.
