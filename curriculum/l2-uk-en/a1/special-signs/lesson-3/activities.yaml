inline:
- id: act-301
  type: match-up
  title: Головні́ контра́сти мо́дуля
  instruction: З'єдна́й ко́жне сло́во з пра́вильним о́писом вимо́ви.
  pairs:
  - left: день
    right: пом'я́кшення кінце́вого н завдяки́ знаку́ ь
  - left: сім'я́
    right: тверди́й звук м та окре́ме звуча́ння йа
  - left: буря́к
    right: м'яки́й звук р пе́ред лі́терою я без апостро́фа
  - left: бур'я́н
    right: тверди́й звук р та чітке́ розді́льне йа
  - left: свя́то
    right: збіг при́голосних св без розді́льного зна́ка
  - left: комп'ю́тер
    right: розді́льна вимо́ва твердо́го п та зву́ків йу
- id: act-302
  type: quiz
  title: Підсу́мковий тест на розпізнава́ння зна́ків
  instruction: Обери́ пра́вильне поя́снення для ко́жного ви́падку.
  items:
  - prompt: Чому́ в сло́ві бур'я́н пи́шеться апостро́ф?
    options:
    - text: Бо пі́сля твердо́го р пе́ред я чу́ти розді́льний звук [й].
      correct: true
    - text: Бо лі́тера р пом'я́кшується пе́ред я.
      correct: false
    - text: Бо апостро́ф пом'я́кшує лі́теру р.
      correct: false
    explanation: Апостро́ф зберіга́є при́голосний тверди́м пе́ред йото́ваною голосно́ю.
  - prompt: Я́ка роль зна́ка ь у сло́ві день?
    options:
    - text: Він пом'я́кшує попере́дній при́голосний звук [н].
      correct: true
    - text: Він додає́ окре́мий голосни́й звук [і].
      correct: false
    - text: Він ро́бить сло́во до́вшим без змі́ни зву́ка.
      correct: false
    explanation: М'яки́й знак не ма́є вла́сного зву́ка, він лише́ вка́зує на м'я́кість.
  - prompt: Чому́ в сло́ві свя́то нема́є апостро́фа?
    options:
    - text: Пе́ред губни́м зву́ком [в] є при́голосний [с], тому́ апостро́ф не пи́шеться.
      correct: true
    - text: Бо лі́тера я за́вжди пом'я́кшує звук [в].
      correct: false
    - text: Бо це ви́няток з м'яки́м зна́ком.
      correct: false
    explanation: Пі́сля збі́гу при́голосних пе́ред я апостро́ф не пи́шеться.
  - prompt: Як пра́вильно перенести́ сло́во паль-ці?
    options:
    - text: паль-ці (знак ь залиша́ється з попере́дньою лі́терою)
      correct: true
    - text: па-льці (знак ь перехо́дить до насту́пного скла́ду)
      correct: false
    - text: пальц-і (лі́теру і залиша́ємо окре́мо)
      correct: false
    explanation: Знак м'я́кшення при перено́сі залиша́ється з попере́дньою лі́терою.
  - prompt: Як пра́вильно перенести́ сло́во бур'-ян?
    options:
    - text: бур'-ян (апостро́ф не відрива́ється від лі́тери р)
      correct: true
    - text: бу-р'ян (лі́тера р з апостро́фом перехо́дить на нови́й рядо́к)
      correct: false
    - text: бур-'ян (апостро́ф перено́ситься на нови́й рядо́к)
      correct: false
    explanation: Апостро́ф ні́коли не відрива́ється від попере́дньої лі́тери.
  - prompt: Я́ка вимо́ва пра́вильна для сло́ва м'я́со?
    options:
    - text: З тверди́м зву́ком [м] та розді́льним поча́тком [йа].
      correct: true
    - text: З м'яки́м зву́ком [м'] без зву́ка [й].
      correct: false
    - text: З до́вгим зву́ком [і] між при́голосним та голосни́м.
      correct: false
    explanation: Апостро́ф розділя́є тверди́й звук [м] і йото́вану голосну́ [йа].
- id: act-303
  type: fill-in
  title: Встав пропу́щений знак
  instruction: Запо́вни про́пуск відпові́дним зна́ком або́ ви́бери варіа́нт без зна́ка.
  items:
  - sentence: С___ого́дні га́рний день.
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
  - sentence: Моя́ сім___я вели́ка.
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: У по́лі росте́ бур___ян.
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: Весе́ле св___ято зібра́ло дру́зів.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
  - sentence: Мален___кий кінь стої́ть у дворі́.
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
  - sentence: Го́стрий цв___ях лежи́ть на столі́.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
- id: act-304
  type: divide-words
  title: Підсу́мковий по́діл слів для перено́су
  instruction: Обери́ пра́вильну моде́ль перено́су сло́ва з одно́го рядка́ на і́нший.
  items:
  - word: бур'я́н
    answer: бур'-ян
  - word: па́льці
    answer: паль-ці
  - word: Мар'я́на
    answer: Мар'-я́на
  - word: дерев'я́ний
    answer: дере-в'я́ний
  - word: мале́нький
    answer: ма-лень-кий
  - word: вчи́тель
    answer: вчи-тель
- id: act-305
  type: true-false
  title: Швидка́ переві́рка пра́вил
  instruction: Ви́знач, чи тве́рдження є пра́вильним.
  items:
  - statement: У сло́ві день м'яки́й знак вимовля́ється як окре́мий звук [і].
    correct: false
    explanation: М'яки́й знак не ма́є вла́сного зву́ка й лише́ пом'я́кшує при́голосний.
  - statement: У сло́ві бур'я́н апостро́ф пока́зує розді́льну вимо́ву зву́ків.
    correct: true
    explanation: Звук [р] залиша́ється тверди́м, а пі́сля ньо́го звучи́ть [йа].
  - statement: У сло́ві свя́то пи́шеться апостро́ф пі́сля лі́тери в.
    correct: false
    explanation: Че́рез збіг двох при́голосних св пе́ред я апостро́ф не пи́шеться.
  - statement: У сло́ві сім'я́ є апостро́ф пі́сля лі́тери м.
    correct: true
    explanation: Пі́сля губно́го [м] пе́ред я за́вжди пи́шеться апостро́ф.
  - statement: У сло́ві ло́жка потрі́бно писа́ти м'яки́й знак.
    correct: false
    explanation: Ло́жка ма́є тверди́й звук [л] і не ма́є м'яко́го зна́ка.
  - statement: При перено́сі слів апостро́ф ні́коли не відрива́ється від лі́тери пе́ред
      ним.
    correct: true
    explanation: Апостро́ф за́вжди залиша́ється з попере́дньою лі́терою.
workbook:
- id: act-w5
  type: fill-in
  title: Дода́й знак у нови́х слова́х
  instruction: Обери́ ь, апо́строф або́ без зна́ка.
  items:
  - sentence: бур___ян
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: комп___ютер
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: ім___я
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: У сло́ві мале́нький потрі́бен ___.
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
  - sentence: У сло́ві цвях пра́вильний ви́бір — ___.
