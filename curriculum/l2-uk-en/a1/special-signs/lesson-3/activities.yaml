inline:
- id: act-301
  type: watch-and-repeat
  title: 'Диві́ться та повто́рюйте: Ї, Щ, Ф — Watch and repeat: Ї, Щ, Ф'
  instruction: Диві́ться ві́део з вимо́вою та повто́рюйте ко́жне сло́во вго́лос. —
    Watch the pronunciation video and repeat each word aloud.
  items:
  - word: їжа́к
    letter: Ї
    sound: '[йі]'
    video: https://www.youtube.com/watch?v=UcjdjQXhAY8
    note: 'The letter Ї always represents two sounds: [й] + [і].'
  - word: по́їзд
    letter: Ї
    sound: '[йі]'
    video: https://www.youtube.com/watch?v=UcjdjQXhAY8
    note: 'In the middle of a word after a vowel: [по́-йізд].'
  - word: Ки́їв
    letter: Ї
    sound: '[йі]'
    video: https://www.youtube.com/watch?v=UcjdjQXhAY8
    note: 'Capital of Ukraine: [ки́-йів].'
  - word: щу́ка
    letter: Щ
    sound: '[шч]'
    video: https://www.youtube.com/watch?v=QmBLieIuf6Q
    note: 'The letter Щ always represents two sounds: [ш] + [ч].'
  - word: борщ
    letter: Щ
    sound: '[шч]'
    video: https://www.youtube.com/watch?v=QmBLieIuf6Q
    note: 'Traditional Ukrainian beet soup ending in [шч]: [боршч].'
  - word: фо́то
    letter: Ф
    sound: '[ф]'
    video: https://www.youtube.com/watch?v=haHRsFFZRQI
    note: The letter Ф represents a single voiceless consonant [f].
- id: act-302
  type: true-false
  title: Пра́вила лі́тер Ї, Щ, Ф — True or False
  instruction: Ви́значте, пра́вда це чи непра́вда. — Decide whether each statement
    is true or false.
  items:
  - statement: Лі́тера Ї за́вжди познача́є два зву́ки [йі]. — The letter Ї always
      represents two sounds [ji].
    correct: true
    explanation: Лі́тера ї ніко́ли не познача́є оди́н звук і не пом'я́кшує при́голосний.
      — The letter ї never represents a single sound and never softens a consonant.
  - statement: Пере́д лі́терою Ї мо́жна писа́ти м'яки́й знак (ь). — The soft sign
      (ь) can be written before the letter Ї.
    correct: false
    explanation: Пере́д ї м'яки́й знак ніко́ли не пи́шеться, оскі́льки ї вже ма́є
      звук [й]. — The soft sign is never written before ї because ї already contains
      [j].
  - statement: Лі́тера Щ за́вжди познача́є сполу́чення зву́ків [шч]. — The letter
      Щ always represents the blend [shch].
    correct: true
    explanation: 'В украї́нській мо́ві бу́ква щ за́вжди познача́є два тверди́х зву́ки:
      [ш] + [ч]. — In Ukrainian, the letter щ always represents two hard sounds: [sh]
      + [ch].'
  - statement: У сло́ві «борщ» чоти́ри зву́ки. — In the word «борщ» there are four
      sounds.
    correct: false
    explanation: 'У сло́ві «борщ» 4 бу́кви, але́ 5 зву́ків: [б-о-р-ш-ч]. — In «борщ»
      there are 4 letters but 5 sounds: [b-o-r-sh-ch].'
  - statement: Лі́тера Ф познача́є оди́н при́голосний звук [ф]. — The letter Ф represents
      a single consonant sound [f].
    correct: true
    explanation: Лі́тера ф передає́ оди́н глухи́й гу́бно-зубни́й звук [ф]. — The letter
      ф conveys a single voiceless labiodental sound [f].
  - statement: Сло́во «фо́то» пи́шеться як «хвото». — The word «фо́то» is written
      as «хвото».
    correct: false
    explanation: 'В літерату́рній мо́ві вжива́ється нормати́вна фо́рма з лі́терою
      ф: «фо́то». — In literary Ukrainian, the standard form with letter ф is used:
      «фо́то».'
- id: act-303
  type: quiz
  title: Звукове́ зна́чення лі́тер — Sound Values
  instruction: Ви́значте пра́вильне фонети́чне зна́чення для ко́жної лі́тери. — Identify
    the correct phonetic transcription for each letter.
  items:
  - prompt: Які́ зву́ки познача́є лі́тера Ї? — Which sounds does the letter Ї represent?
    options:
    - text: '[йі]'
      correct: true
    - text: '[і]'
      correct: false
    - text: '[й]'
      correct: false
    explanation: Лі́тера ї за́вжди познача́є два зву́ки [йі]. — The letter ї always
      represents two sounds [ji].
  - prompt: Які́ зву́ки познача́є лі́тера Щ? — Which sounds does the letter Щ represent?
    options:
    - text: '[шч]'
      correct: true
    - text: '[ш]'
      correct: false
    - text: '[ч]'
      correct: false
    explanation: Лі́тера щ за́вжди познача́є сполу́чення зву́ків [шч]. — The letter
      щ always represents the blend [shch].
  - prompt: Яки́й звук познача́є лі́тера Ф? — Which sound does the letter Ф represent?
    options:
    - text: '[ф]'
      correct: true
    - text: '[п]'
      correct: false
    - text: '[в]'
      correct: false
    explanation: Лі́тера ф познача́є глухи́й при́голосний звук [ф]. — The letter ф
      represents the voiceless consonant [f].
  - prompt: Скі́льки зву́ків у сло́ві «борщ»? — How many sounds are in the word «борщ»?
    options:
    - text: 5 зву́ків [б-о-р-ш-ч] — 5 sounds [б-о-р-ш-ч]
      correct: true
    - text: чоти́ри зву́ки — four sounds
      correct: false
    - text: три зву́ки — three sounds
      correct: false
    explanation: У сло́ві 4 бу́кви, але́ 5 зву́ків [б-о-р-ш-ч]. — There are 4 letters
      but 5 sounds [b-o-r-sh-ch].
  - prompt: Скі́льки зву́ків у сло́ві «їжа́к»? — How many sounds are in the word «їжа́к»?
    options:
    - text: 5 зву́ків [й-і-ж-а-к] — 5 sounds [й-і-ж-а-к]
      correct: true
    - text: чоти́ри зву́ки — four sounds
      correct: false
    - text: шість зву́ків — six sounds
      correct: false
    explanation: У сло́ві 4 бу́кви, але́ 5 зву́ків [й-і-ж-а-к]. — There are 4 letters
      but 5 sounds [y-i-zh-a-k].
  - prompt: Скі́льки зву́ків у сло́ві «факт»? — How many sounds are in the word «факт»?
    options:
    - text: чоти́ри зву́ки [ф-а-к-т] — four sounds [ф-а-к-т]
      correct: true
    - text: 5 зву́ків — 5 sounds
      correct: false
    - text: три зву́ки — three sounds
      correct: false
    explanation: 'Ко́жна лі́тера познача́є оди́н звук: [ф-а-к-т]. — Each letter represents
      one sound: [f-a-k-t].'
- id: act-304
  type: match-up
  title: Віта́ння та їх зна́чення — Greetings and meanings
  instruction: З'єдна́йте украї́нське віта́ння з йо́го англі́йським зна́ченням. —
    Match the Ukrainian greeting to its English meaning.
  pairs:
  - left: До́брого ра́нку!
    right: ранко́ве віта́ння — morning greeting
  - left: До́брий день!
    right: де́нне віта́ння — daytime greeting
  - left: До́брий ве́чір!
    right: вечі́рнє віта́ння — evening greeting
  - left: Приві́т!
    right: неформа́льне привіта́ння дру́зів — informal greeting to friends
  - left: До поба́чення!
    right: станда́ртне проща́ння — standard farewell
  - left: Щасли́вої доро́ги!
    right: побажа́ння тим, хто ї́де — wish to travelers
- id: act-305
  type: fill-in
  title: Вста́вте лі́теру Ї, Щ або́ Ф — Insert letter Ї, Щ, or Ф
  instruction: 'Запо́вніть про́пуски пра́вильною лі́терою: ї, щ або́ ф. — Fill in
    the blanks with the correct letter: ї, щ, or ф.'
  items:
  - sentence: У лі́сі живе́ колю́чий ___жа́к. — A spiky hedgehog lives in the forest.
    options:
    - ї
    - і
    - щ
    answer: ї
    explanation: Сло́во «їжа́к» почина́ється зі зву́ків [йі], яки́й познача́ється
      лі́терою ї. — The word «їжа́к» begins with the sounds [ji], spelled with letter
      ї.
  - sentence: Ми ї́демо на екску́рсію в мі́сто Ки́___в. — We are going on an excursion
      to the city of Kyiv.
    options:
    - ї
    - і
    - й
    answer: ї
    explanation: У на́зві «Ки́їв» пі́сля голосно́го «и» пи́шемо лі́теру ї [йі]. —
      In «Ки́їв», after vowel «и», we write letter ї [ji].
  - sentence: Украї́нський бор___ — це смачна́ стра́ва. — Ukrainian borscht is a delicious
      dish.
    options:
    - щ
    - ш
    - ч
    answer: щ
    explanation: У кінці́ сло́ва «борщ» звукосполу́чення [шч] познача́ється лі́терою
      щ. — At the end of «борщ», the sound blend [shch] is spelled with letter щ.
  - sentence: У рі́чці пла́ває хи́жа ___у́ка. — A predatory pike swims in the river.
    options:
    - щ
    - ш
    - ч
    answer: щ
    explanation: Сло́во «щу́ка» почина́ється з буквосполу́чення [шч], то́бто лі́тери
      щ. — The word «щу́ка» begins with [shch], represented by letter щ.
  - sentence: У мене́ є нове́ сіме́йне ___ото́. — I have a new family photo.
    options:
    - ф
    - хв
    - п
    answer: ф
    explanation: Сло́во «фо́то» пи́шеться з лі́терою ф. — The word «фо́то» is written
      with the letter ф.
  - sentence: Швидки́й по́___зд прибува́є вча́сно. — The fast train arrives on time.
    options:
    - ї
    - і
    - й
    answer: ї
    explanation: 'Пі́сля голосно́го «о» пи́шемо лі́теру ї: по́їзд. — After the vowel
      «о», we write the letter ї: по́їзд.'
workbook:
- id: act-306
  type: group-sort
  title: Класифіка́ція за кі́лькістю зву́ків — Classify by sound count
  instruction: 'Розподілі́ть слова́ на дві гру́пи: лі́тери за́вжди даю́ть два зву́ки
    (Ї, Щ) чи оди́н звук (Ф). — Sort the words into two groups: letters always give
    two sounds (Ї, Щ) or one sound (Ф).'
  groups:
  - label: За́вжди два зву́ки (Ї, Щ) — Always two sounds
    items:
    - їжа́к
    - по́їзд
    - Ки́їв
    - щу́ка
    - борщ
  - label: Оди́н звук (Ф) — One sound
    items:
    - фо́то
    - факт
    - шарф
    - кафе́
- id: act-307
  type: fill-in
  title: Пра́вильне віта́ння за ча́сом доби́ — Greetings by time of day
  instruction: Вста́вте пра́вильне сло́во у віта́ння. — Insert the correct word into
    the greeting.
  items:
  - sentence: До́брого ___! — Good morning! (ранко́ве віта́ння)
    options:
    - ра́нку
    - ве́чора
    - дня
    answer: ра́нку
    explanation: 'Ура́нці віта́ються: «До́брого ра́нку!». — In the morning, people
      greet with: «До́брого ра́нку!».'
  - sentence: До́брий ___! — Good afternoon! / Good day! (де́нне віта́ння)
    options:
    - день
    - ра́нок
    - ніч
    answer: день
    explanation: 'Уде́нь вжива́ють станда́ртне віта́ння: «До́брий день!». — During
      the day, the standard greeting is: «До́брий день!».'
  - sentence: До́брий ___! — Good evening! (вечі́рнє віта́ння)
    options:
    - ве́чір
    - день
    - ра́нок
    answer: ве́чір
    explanation: 'Уве́чері віта́ються: «До́брий ве́чір!». — In the evening, people
      greet with: «До́брий ве́чір!».'
  - sentence: До ___! — Good-bye! (вві́чливе проща́ння)
    options:
    - поба́чення
    - зу́стрічі
    - ра́нку
    answer: поба́чення
    explanation: 'Станда́ртна фо́рмула проща́ння: «До поба́чення!». — The standard
      farewell formula is: «До поба́чення!».'
  - sentence: На все ___! — All the best! (побажа́ння добра́)
    options:
    - до́бре
    - кра́ще
    - я́сне
    answer: до́бре
    explanation: 'Стійки́й ви́раз проща́ння: «На все до́бре!». — The fixed farewell
      expression is: «На все до́бре!».'
  - sentence: ___ доро́ги! — Safe journey! (побажа́ння мандрівника́м)
    options:
    - Щасли́вої
    - До́брої
    - Кра́щої
    answer: Щасли́вої
    explanation: 'Тим, хто від''їжджа́є, ка́жуть: «Щасли́вої доро́ги!». — To travelers
      departing, people say: «Щасли́вої доро́ги!».'
- id: act-308
  type: match-up
  title: Зіста́влення слів та зна́чень — Match words with meanings
  instruction: З'єдна́йте сло́во з лі́терами Ї, Щ, Ф із йо́го перекла́дом. — Match
    the word with letters Ї, Щ, Ф to its translation.
  pairs:
  - left: по́їзд
    right: train
  - left: їжа́к
    right: hedgehog
  - left: борщ
    right: beet soup
  - left: щу́ка
    right: pike (fish)
  - left: фо́то
    right: photo
  - left: шарф
    right: scarf
- id: act-309
  type: unjumble
  title: Складі́ть ре́чення етике́ту — Unjumble the greeting sentences
  instruction: Розташу́йте слова́ у пра́вильному поря́дку. — Put the words into the
    correct order.
  items:
  - scrambled:
    - ра́нку,
    - До́брого
    - вчи́телю!
    answer: До́брого ра́нку, вчи́телю!
    explanation: 'Вві́чливе ранко́ве зверта́ння: «До́брого ра́нку, вчи́телю!». — Polite
      morning address: «До́брого ра́нку, вчи́телю!».'
  - scrambled:
    - день,
    - До́брий
    - Окса́но!
    answer: До́брий день, Окса́но!
    explanation: 'Де́нне віта́ння: «До́брий день, Окса́но!». — Daytime greeting: «До́брий
      день, Окса́но!».'
  - scrambled:
    - ве́чір,
    - До́брий
    - Ма́рку!
    answer: До́брий ве́чір, Ма́рку!
    explanation: 'Вечі́рнє віта́ння: «До́брий ве́чір, Ма́рку!». — Evening greeting:
      «До́брий ве́чір, Ма́рку!».'
  - scrambled:
    - поба́чення,
    - До
    - дру́зі!
    answer: До поба́чення, дру́зі!
    explanation: 'Фо́рмула проща́ння: «До поба́чення, дру́зі!». — Farewell formula:
      «До поба́чення, дру́зі!».'
  - scrambled:
    - все
    - На
    - до́бре!
    answer: На все до́бре!
    explanation: 'Побажа́ння при проща́нні: «На все до́бре!». — Well-wish on parting:
      «На все до́бре!».'
  - scrambled:
    - доро́ги,
    - Щасли́вої
    - сім'є́!
    answer: Щасли́вої доро́ги, сім'є́!
    explanation: 'Побажа́ння мандрівника́м: «Щасли́вої доро́ги, сім''є́!». — Safe
      journey wish: «Щасли́вої доро́ги, сім''є́!».'
- id: act-310
  type: error-correction
  title: Знайді́ть та ви́правте поми́лку — Find and fix the error
  instruction: Знайді́ть помилко́во напи́сане сло́во та ви́беріть пра́вильний варіа́нт.
    — Find the misspelled word and choose the correct form.
  items:
  - sentence: У лі́сі біжи́ть колю́чий йіжа́к.
    error: йіжа́к
    correction: їжа́к
    options:
    - їжа́к
    - іжа́к
    - єжа́к
    explanation: 'Звукосполу́чення [йі] за́вжди познача́ється лі́терою ї: їжа́к. —
      The sound blend [ji] is always written with letter ї: їжа́к.'
  - sentence: Швидки́й пойи́зд ї́де до Ки́єва.
    error: пойи́зд
    correction: по́їзд
    options:
    - по́їзд
    - по́ізд
    - по́езд
    explanation: 'Пі́сля голосно́го пи́шемо лі́теру ї: по́їзд. — After a vowel, we
      write the letter ї: train.'
  - sentence: Ми ї́демо в мі́сто Кийи́в.
    error: Кийи́в
    correction: Ки́їв
    options:
    - Ки́їв
    - Ки́ів
    - Ки́єв
    explanation: 'У на́зві столи́ці Украї́ни пи́шеться лі́тера ї: Ки́їв. — The capital
      of Ukraine is written with the letter ї: Kyiv.'
  - sentence: На обі́д сього́дні гаря́чий боршч.
    error: боршч
    correction: борщ
    options:
    - борщ
    - борч
    - борш
    explanation: 'Звукосполу́чення [шч] на письмі́ передає́ться лі́терою щ: борщ.
      — The sound blend [шч] is written with the letter щ: borscht.'
  - sentence: У рі́чці пла́ває вели́ка шчу́ка.
    error: шчу́ка
    correction: щу́ка
    options:
    - щу́ка
    - чу́ка
    - ьщу́ка
    explanation: 'Звукосполу́чення [шч] познача́ється одніє́ю лі́терою щ: щу́ка. —
      The sound blend [шч] is written with single letter щ: щу́ка.'
  - sentence: На столі́ лежи́ть га́рне хво́то.
    error: хво́то
    correction: фо́то
    options:
    - фо́то
    - по́то
    - ьфо́то
    explanation: 'Сло́во «фо́то» пи́шеться з лі́терою ф: фо́то. — The word «фо́то»
      is written with the letter ф: photo.'
- id: act-311
  type: quiz
  title: Підсумко́вий тест з віта́нь та зву́ків — Final quiz on greetings and sounds
  instruction: Обері́ть пра́вильний варіа́нт ві́дповіді. — Choose the correct answer
    option.
  items:
  - prompt: Яке́ віта́ння використо́вують ура́нці? — Which greeting is used in the
      morning?
    options:
    - text: До́брого ра́нку!
      correct: true
    - text: До́брий ве́чір!
      correct: false
    - text: Добра́ніч!
      correct: false
    explanation: Ура́нці вжива́ють уста́лену фо́рму «До́брого ра́нку!». — In the morning,
      the established form «До́брого ра́нку!» is used.
