    - ь
- id: act-w6
  type: quiz
  title: Пра́вильна фо́рма
  instruction: Обери́ пра́вильно напи́сане сло́во.
  items:
  - prompt: Сім'я́ — я́ка фо́рма пра́вильна?
    options:
    - text: сім'я́
      correct: true
    - text: сімя
      correct: false
    explanation: Сім'я́ потребу́є апо́строфа.
  - prompt: День — я́ка фо́рма пра́вильна?
    options:
    - text: ден
      correct: false
    - text: день
      correct: true
    explanation: День потребу́є м'яко́го зна́ка.
  - prompt: Сло́во без апо́строфа?
    options:
    - text: св'ято
      correct: false
    - text: свя́то
      correct: true
    explanation: У сло́ві свя́то нема́є апо́строфа.
- id: act-w7
  type: odd-one-out
  title: За́йве за зна́ком
  instruction: Обери́ сло́во, яке́ не ма́є тако́го само́го зна́ка, як і́нші.
  items:
  - words:
    - сім'я́
    - м'я́со
    - п'ять
    - буря́к
    answer: буря́к
    explanation: Буря́к без апо́строфа; і́нші слова́ ма́ють апо́строф.
  - words:
    - день
    - кінь
    - сіль
    - свя́то
    answer: свя́то
    explanation: Свя́то без ь; і́нші слова́ ма́ють м'яки́й знак.
  - words:
    - буря́к
    - свя́то
    - цвях
    - бур'я́н
    answer: бур'я́н
    explanation: Бур'я́н ма́є апо́строф; і́нші слова́ тут без зна́ка.
- id: act-w301
  type: group-sort
  title: Класифіка́ція зна́ків
  instruction: Розпо́діли слова́ за ти́пом орфогра́ми.
  groups:
  - label: М'яки́й знак
    items:
    - день
    - кінь
    - сіль
    - вчи́тель
    - мале́нький
    - па́льці
  - label: Апостро́ф
    items:
    - сім'я́
    - м'я́со
    - п'ять
    - де́в'ять
    - комп'ю́тер
    - бур'я́н
  - label: Без зна́ка
    items:
    - буря́к
    - свя́то
    - цвях
    - ло́жка
- id: act-w302
  type: match-up
  title: Підсу́мкові па́ри пра́вил
  instruction: З'єдна́й ко́жне сло́во з пра́вилом йо́го вимо́ви чи написа́ння.
  pairs:
  - left: буря́к
    right: м'яки́й звук [р'] пе́ред я
  - left: бур'я́н
    right: тверди́й звук [р] та розді́льне [йа]
  - left: свя́то
    right: збіг двох при́голосних без апостро́фа
  - left: день
    right: м'яки́й кінце́вий звук [н'] завдяки́ ь
  - left: сім'я́
    right: тверди́й звук [м] та розді́льне [йа]
  - left: па́льці
    right: м'яки́й знак не відрива́ється при перено́сі
- id: act-w303
  type: true-false
  title: Переві́р свої́ знання́
  instruction: Ви́знач, чи тве́рдження є пра́вильним.
  items:
  - statement: У сло́ві буря́к звук [р] є м'яки́м.
    correct: true
    explanation: Бу́ква я пі́сля при́голосного пом'я́кшує йо́го.
  - statement: У сло́ві свя́то потрі́бно писа́ти апостро́ф.
    correct: false
    explanation: Пі́сля збі́гу при́голосних св пе́ред я апостро́ф не пи́шеться.
  - statement: М'яки́й знак не ма́є вла́сного зву́ка.
    correct: true
    explanation: Він лише́ вка́зує на м'я́кість попере́днього при́голосного.
  - statement: У сло́ві бур'я́н апостро́ф познача́є розді́льну вимо́ву.
    correct: true
    explanation: При́голосний [р] залиша́ється тверди́м, а да́лі звучи́ть [йа].
  - statement: При перено́сі слів м'яки́й знак мо́жна перенести́ окре́мо на нови́й рядо́к.
    correct: false
    explanation: М'яки́й знак за́вжди залиша́ється з попере́дньою лі́терою.
  - statement: У сло́ві ло́жка потрі́бно писа́ти м'яки́й знак пі́сля л.
    correct: false
    explanation: У сло́ві ло́жка лі́тера л познача́є тверди́й звук без м'яко́го зна́ка.
