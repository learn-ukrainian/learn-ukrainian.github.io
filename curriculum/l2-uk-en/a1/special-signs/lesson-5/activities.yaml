- id: act-507
  type: true-false
  title: Підсумко́ві те́зи мо́дуля — Final module statements
  instruction: Ви́значте, чи пра́вильне ко́жне тве́рдження про украї́нські зна́ки. — Determine whether each statement about Ukrainian signs is true or false.
  items:
  - statement: Знак Ь ніко́ли не відрива́ється від попере́дньої лі́тери при перено́сі. — The soft sign Ь is never separated from the preceding letter during hyphenation.
    correct: true
    explanation: Знак Ь за́вжди залиша́ється з попере́днім при́голосним. — The soft sign Ь always stays with the preceding consonant.
  - statement: Апо́строф при перено́сі за́вжди залиша́ється з попере́дньою лі́терою. — The apostrophe always stays with the preceding letter during hyphenation.
    correct: true
    explanation: Апо́строф не перено́ситься на насту́пний рядо́к. — The apostrophe is never moved alone to the next line.
  - statement: Мо́жна залиша́ти одну́ лі́теру на рядку́ при перено́сі сло́ва. — You may leave a single letter on a line when hyphenating a word.
    correct: false
    explanation: Одну́ лі́теру ніко́ли не залиша́ють і не перево́дять на і́нший рядо́к. — A single letter is never left alone or carried alone to another line.
  - statement: 'Лі́тера Ї за́вжди познача́є два зву́ки: [й] + [і]. — The letter Ї always represents two sounds: [й] + [і].'
    correct: true
    explanation: Лі́тера Ї за будь-яки́х умо́в ма́є два зву́ки. — The letter Ї has two sounds under all conditions.
  - statement: Бу́ква Щ в украї́нській мо́ві вимовля́ється як м'яки́й звук. — The letter Щ in Ukrainian is pronounced as a soft sound.
    correct: false
    explanation: Щ — це ви́ключно тверда́ сполу́ка [ш] та [ч]. — Щ is exclusively a hard blend of [ш] and [ч].
  - statement: У сло́ві «свя́то» пи́шеться апо́строф. — An apostrophe is written in the word «свя́то».
    correct: false
    explanation: У сло́ві «свя́то» апо́строфа нема́є, бо пе́ред [в] стої́ть [с]. — There is no apostrophe in «свя́то» because [с] precedes [в].
- id: act-508
  type: quiz
  title: Си́нтез пра́вил мо́дуля — Module Synthesis Quiz
  instruction: Test your mastery of the special signs, rules of hyphenation, and pronunciation.
  items:
  - question: Чи мо́жна відрива́ти апо́строф від попере́дньої бу́кви при перено́сі? — Can the apostrophe be separated from the preceding letter during hyphenation?
    options:
    - ні, не мо́жна — no, you cannot
    - так, за́вжди мо́жна — yes, you always can
    answer: ні, не мо́жна — no, you cannot
  - question: Чи мо́жна відрива́ти м'яки́й знак від попере́дньої бу́кви при перено́сі? — Can the soft sign be separated from the preceding letter during hyphenation?
    options:
    - ні, не мо́жна — no, you cannot
    - так, за́вжди мо́жна — yes, you always can
    answer: ні, не мо́жна — no, you cannot
  - question: Як пра́вильно перенести́ сло́во «па́льці»? — What is the correct hyphenation for «па́льці»?
    options:
    - паль-ці
    - пал-ьці
    - па-льці
    answer: паль-ці
  - question: Як пра́вильно перенести́ сло́во «Мар'я́на»? — What is the correct hyphenation for «Мар'я́на»?
    options:
    - Мар'-яна
    - Мар-'яна
    - Ма-р'яна
    answer: Мар'-яна
  - question: Як пра́вильно перенести́ сло́во «бур'я́н»? — What is the correct hyphenation for «бур'я́н»?
    options:
    - бур'-ян
    - бур-'ян
    - бу-р'ян
    answer: бур'-ян
  - question: Як пра́вильно перенести́ сло́во «дерев'я́ний»? — What is the correct hyphenation for «дерев'я́ний»?
    options:
    - дере-в'яний
    - дерев-'яний
    - де-рев'яний
    answer: дере-в'яний
