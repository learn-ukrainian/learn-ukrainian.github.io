inline:
- id: act-5
  type: divide-words
  title: Пра́ктика перено́су слів — Hyphenation practice
  instruction: Обери́ підгото́влену моде́ль перено́су. — Choose the prepared hyphenation
    model.
  items:
  - word: Мар'я́на
    answer: Мар'-я́на
  - word: дерев'я́ний
    answer: дере́-в'яний
  - word: бур'я́н
    answer: бур'-ян
  - word: па́льці
    answer: паль-ці
- id: act-502
  type: divide-words
  title: 'Пра́вила перено́су: нови́й спектр слів — Hyphenation rules: New words'
  instruction: Обері́ть пра́вильний варіа́нт перено́су для ко́жного сло́ва. — Choose
    the correct hyphenation option for each word.
  items:
  - word: вчи́тель
    answer: вчи-тель
  - word: мале́нький
    answer: малень-кий
  - word: комп'ю́тер
    answer: комп'-ютер
  - word: здоро́в'я
    answer: здо-ров'я
  - word: свя́то
    answer: свя-то
  - word: буря́к
    answer: бу-ряк
- id: act-503
  type: match-up
  title: Етике́тні ви́рази та проща́ння — Etiquette formulas and farewells
  instruction: З'єдна́йте украї́нську фо́рмулу з її́ англі́йським пере́кладом. — Match
    the Ukrainian formula with its English translation.
  pairs:
  - left: До поба́чення!
    right: Goodbye!
  - left: На все до́бре!
    right: All the best!
  - left: Щи́ро дя́кую!
    right: Thank you very much!
  - left: Будь ла́ска!
    right: You are welcome! / Please!
  - left: Як спра́ви?
    right: How are things?
  - left: Чудо́во, дя́кую!
    right: Wonderful, thank you!
- id: act-504
  type: quiz
  title: 'Етике́тний діало́г: розумі́ння розмо́ви — Etiquette dialogue check'
  instruction: Обері́ть пра́вильний варіа́нт ві́дповіді за конте́кстом діало́гу. —
    Choose the correct answer based on dialogue context.
  items:
  - prompt: Як Мар'я́на віта́є вчи́теля на уро́ці? — How does Mariana greet the teacher
      in the lesson?
    options:
    - text: До́брий день, вчи́телю! — Good day, teacher!
      correct: true
    - text: До́брий ве́чір, вчи́телю! — Good evening, teacher!
      correct: false
    - text: До поба́чення, вчи́телю! — Goodbye, teacher!
      correct: false
    explanation: «До́брий день!» — станда́ртне де́нне віта́ння в украї́нській мо́ві.
      — "До́брий день!" is the standard daytime greeting in Ukrainian.
  - prompt: Як вчи́тель зверта́ється до Мар'я́ни? — How does the teacher address Mariana?
    options:
    - text: Мар'я́но — Mariana (vocative)
      correct: true
    - text: Мар'я́на — Mariana (nominative)
      correct: false
    - text: Марко́ — Marko
      correct: false
    explanation: 'В украї́нській мо́ві у зверта́нні вжива́ється кли́чний відмі́нок:
      Мар''я́но. — In Ukrainian, the vocative case is used in direct address: Мар''я́но.'
  - prompt: За що Мар'я́на дя́кує вчи́телю? — What does Mariana thank the teacher
      for?
    options:
    - text: Дя́кую за ціка́вий уро́к. — Thank you for the interesting lesson.
      correct: true
    - text: Дя́кую за смачну́ ка́ву. — Thank you for the tasty coffee.
      correct: false
    - text: Дя́кую за нови́й зо́шит. — Thank you for the new notebook.
      correct: false
    explanation: Мар'я́на дя́кує вчи́телю за ціка́вий уро́к. — Mariana thanks the
      teacher for the interesting lesson.
  - prompt: Що ка́же вчи́тель про робо́ту Мар'я́ни? — What does the teacher say about
      Mariana's work?
    options:
    - text: Ти сього́дні чудо́во працюва́ла. — You worked wonderfully today.
      correct: true
    - text: Ти сього́дні відпочива́ла. — You rested today.
      correct: false
    - text: Ти запізни́лася на уро́к. — You were late for the lesson.
      correct: false
    explanation: Вчи́тель хва́лить учени́цю за чудо́ву пра́цю на уро́ці. — The teacher
      praises the student for wonderful work in the lesson.
  - prompt: Яку́ фо́рмулу вві́чливого проща́ння вжива́є Мар'я́на? — Which polite farewell
      formula does Mariana use?
    options:
    - text: На все до́бре! До поба́чення! — All the best! Goodbye!
      correct: true
    - text: До́брий ра́нок! Будь ла́ска! — Good morning! Please!
      correct: false
    - text: Як спра́ви? Чудо́во! — How are things? Great!
      correct: false
    explanation: «На все до́бре!» та «До поба́чення!» — станда́ртні украї́нські фо́рмули
      проща́ння. — "На все до́бре!" and "До поба́чення!" are standard Ukrainian farewell
      formulas.
  - prompt: Чому́ в і́мені Мар'я́на пи́шеться апо́строф? — Why is an apostrophe written
      in the name Mariana?
    options:
    - text: Пі́сля р пе́ред я чу́ти [йа], тому́ пи́шеться апо́строф. — After р before
        я [йа] is heard, so an apostrophe is written.
      correct: true
    - text: Бо р пом'я́кшується пе́ред я. — Because р is softened before я.
      correct: false
    - text: Бо в імена́х за́вжди ста́виться м'яки́й знак. — Because names always use
        a soft sign.
      correct: false
    explanation: В і́мені Мар'я́на тверди́й при́голосний р розділя́ється апо́строфом
      пе́ред я. — In the name Мар'я́на the hard consonant р is separated by an apostrophe
      before я.
- id: act-505
  type: group-sort
  title: 'Си́нтез: класифіка́ція за зна́ками — Synthesis: Classification by signs'
  instruction: Розподілі́ть слова́ у три гру́пи за ї́хньою фонети́чною структу́рою.
    — Sort the words into three groups by their phonetic structure.
  groups:
  - label: Знак Ь (пом'я́кшення) — Soft sign Ь (softening)
    items:
    - день
    - кінь
    - сіль
    - вчи́тель
    name: Знак Ь (пом'я́кшення) — Soft sign Ь (softening)
  - label: Апо́строф (розді́льність) — Apostrophe (separation)
    items:
    - сім'я́
    - м'я́со
    - п'ять
    - бур'я́н
    name: Апо́строф (розді́льність) — Apostrophe (separation)
  - label: Без зна́ка (зли́те чита́ння) — No sign (smooth reading)
    items:
    - буря́к
    - свя́то
    - цвях
    - ло́жка
    name: Без зна́ка (зли́те чита́ння) — No sign (smooth reading)
workbook:
- id: act-w5
  type: fill-in
  title: Дода́й знак у нови́х слова́х — Add a sign in new words
  instruction: Обери́ ь, апо́строф або́ без зна́ка. — Choose ь, an apostrophe, or
    no sign.
  items:
  - sentence: бур___ян
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка — no sign
    explanation: 'Апо́строф пи́шеться пі́сля твердо́го р пе́ред я: бур''я́н. — An
      apostrophe is written after hard р before я: бур''я́н.'
  - sentence: комп___ютер
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка — no sign
    explanation: 'Апо́строф пи́шеться пі́сля губно́го п пе́ред ю: комп''ю́тер. — An
      apostrophe is written after labial п before ю: комп''ю́тер.'
  - sentence: ім___я
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка — no sign
    explanation: 'Апо́строф пи́шеться пі́сля губно́го м пе́ред я: ім''я́. — An apostrophe
      is written after labial м before я: ім''я́.'
  - sentence: У сло́ві мален_кий потрі́бен ___ . — In the word "мален_кий", […] is
      needed.
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка — no sign
    explanation: 'М''яки́й знак пом''я́кшує при́голосний н: мале́нький. — The soft
      sign softens the consonant н: мале́нький.'
  - sentence: У сло́ві цвях пра́вильний ви́бір — ___ . — In the word "цвях", the correct
      choice is […].
    answer: без зна́ка — no sign
    options:
    - без зна́ка — no sign
    - ''''
    - ь
    explanation: У сло́ві цвях збіг при́голосних цв пе́ред я пи́шеться без зна́ка.
      — In the word цвях the consonant cluster цв before я is written without a sign.
- id: act-w6
  type: quiz
  title: Пра́вильна фо́рма — Correct form
  instruction: Обери́ пра́вильно напи́сане сло́во. — Choose the correctly spelled
    word.
  items:
  - prompt: Сім'я́ — яка́ фо́рма пра́вильна? — Сім'я́ — which form is correct?
    options:
    - text: сім'я́
      correct: true
    - text: сімя
      correct: false
    explanation: Сім'я́ потребу́є апо́строфа. — Сім'я́ requires an apostrophe.
  - prompt: День — яка́ фо́рма пра́вильна? — День — which form is correct?
    options:
    - text: ден
      correct: false
    - text: день
      correct: true
    explanation: День потребу́є м'яко́го зна́ка. — День requires a soft sign.
  - prompt: Сло́во без апо́строфа? — Which word is without an apostrophe?
    options:
    - text: св'ято
      correct: false
    - text: свя́то
      correct: true
    explanation: У сло́ві свя́то нема́є апо́строфа. — In the word свя́то there is
      no apostrophe.
- id: act-w7
  type: odd-one-out
  title: За́йве за зна́ком — Odd sign out
  instruction: Обери́ сло́во, яке́ не ма́є тако́го са́мого зна́ка, як і́нші. — Choose
    the word that does not have the same sign as the others.
  items:
  - words:
    - сім'я́
    - м'я́со
    - п'ять
    - буря́к
    answer: буря́к
    explanation: Буря́к без апо́строфа; і́нші слова́ ма́ють апо́строф. — Буря́к is
      without an apostrophe; the other words have an apostrophe.
  - words:
    - день
    - кінь
    - сіль
    - свя́то
    answer: свя́то
    explanation: Свя́то без ь; і́нші слова́ ма́ють м'яки́й знак. — Свя́то is without
      ь; the other words have a soft sign.
  - words:
    - буря́к
    - свя́то
    - цвях
    - бур'я́н
    answer: бур'я́н
    explanation: Бур'я́н ма́є апо́строф; і́нші слова́ тут без зна́ка. — Бур'я́н has
      an apostrophe; the other words here have no sign.
- id: act-506
  type: unjumble
  title: 'Складі́ть слова́ — Unjumble: Words with special signs'
  instruction: Складі́ть пра́вильні украї́нські слова́ з по́даних лі́тер. — Form correct
    Ukrainian words from the given letters.
  items:
  - words:
    - д
    - е
    - н
    - ь
    answer: день
  - words:
    - к
    - і
    - н
    - ь
    answer: кінь
  - words:
    - с
    - і
    - л
    - ь
    answer: сіль
  - words:
    - б
    - у
    - р
    - я
    - к
    answer: буря́к
  - words:
    - с
    - в
    - я
    - т
    - о
    answer: свя́то
  - words:
    - ц
    - в
    - я
    - х
    answer: цвях
- id: act-507
  type: true-false
  title: Підсумко́ві те́зи мо́дуля — Final module statements
  instruction: Ви́значте, чи пра́вильне ко́жне тве́рдження про украї́нські зна́ки.
    — Determine whether each statement about Ukrainian signs is true or false.
  items:
  - statement: Знак Ь ніко́ли не відрива́ється від попере́дньої лі́тери при перено́сі.
      — The soft sign Ь is never separated from the preceding letter during hyphenation.
    correct: true
    explanation: 'Знак Ь за́вжди залиша́ється з попере́днім при́голосним: паль-ці.
      — The soft sign Ь always stays with the preceding consonant: паль-ці.'
  - statement: Апо́строф при перено́сі за́вжди залиша́ється з попере́дньою лі́терою.
      — The apostrophe always stays with the preceding letter during hyphenation.
    correct: true
    explanation: 'Апо́строф не перено́ситься на насту́пний рядо́к: Мар''-я́на, бур''-ян.
      — The apostrophe is never moved alone to the next line: Мар''-я́на, бур''-ян.'
  - statement: Мо́жна залиша́ти одну́ лі́теру на рядку́ при перено́сі сло́ва. — You
      may leave a single letter on a line when hyphenating a word.
    correct: false
    explanation: Одну́ лі́теру ніко́ли не залиша́ють і не перево́дять на і́нший рядо́к.
      — A single letter is never left alone or carried alone to another line.
  - statement: М'яки́й знак (ь) ма́є вла́сний голосни́й звук. — The soft sign (ь)
      has its own vowel sound.
    correct: false
    explanation: М'яки́й знак не ма́є вла́сного зву́ка; він лише́ пом'я́кшує попере́дній
      при́голосний. — The soft sign has no sound of its own; it only softens the preceding
      consonant.
  - statement: Апо́строф вка́зує, що попере́дній при́голосний залиша́ється тверди́м.
      — The apostrophe indicates that the preceding consonant remains hard.
    correct: true
    explanation: 'Апо́строф розділя́є зву́ки: при́голосний звучи́ть тве́рдо, а по́тім
      чу́ти [й] + голосни́й. — The apostrophe separates sounds: the consonant sounds
      hard, followed by [j] + vowel.'
  - statement: У сло́ві «свя́то» пи́шеться апо́строф. — An apostrophe is written in
      the word «свя́то».
    correct: false
    explanation: У сло́ві «свя́то» апо́строфа нема́є, бо пе́ред [в] стої́ть [с]. —
      There is no apostrophe in «свя́то» because [с] precedes [в].
- id: act-508
  type: quiz
  title: Си́нтез пра́вил перено́су та зна́ків — Synthesis Quiz
  instruction: Переві́рте знання́ особли́вих зна́ків та перено́су слів. — Test your
    knowledge of special signs and word hyphenation.
  items:
  - prompt: Чи мо́жна відрива́ти апо́строф від попере́дньої бу́кви при перено́сі?
      — Can the apostrophe be separated from the preceding letter during hyphenation?
    options:
    - text: Ні, не мо́жна. — No, you cannot.
      correct: true
    - text: Так, за́вжди мо́жна. — Yes, you always can.
      correct: false
    - text: Лише́ у до́вгих слова́х. — Only in long words.
      correct: false
    explanation: 'Апо́строф за́вжди залиша́ється з попере́дньою лі́терою: Мар''-я́на.
      — The apostrophe always stays with the preceding letter: Мар''-я́на.'
  - prompt: Чи мо́жна відрива́ти м'яки́й знак від попере́дньої бу́кви при перено́сі?
      — Can the soft sign be separated from the preceding letter during hyphenation?
    options:
    - text: Ні, не мо́жна. — No, you cannot.
      correct: true
    - text: Так, за́вжди мо́жна. — Yes, you always can.
      correct: false
    - text: Лише́ на поча́тку рядка́. — Only at the beginning of a line.
      correct: false
    explanation: 'М''яки́й знак за́вжди залиша́ється з попере́дньою лі́терою: паль-ці.
      — The soft sign always stays with the preceding letter: паль-ці.'
  - prompt: Як пра́вильно перенести́ сло́во «па́льці»? — What is the correct hyphenation
      for «па́льці»?
    options:
    - text: паль-ці
      correct: true
    - text: пал-ьці
      correct: false
    - text: па-льці
      correct: false
    explanation: 'М''яки́й знак не відрива́ється від лі́тери л: паль-ці. — The soft
      sign is not separated from the letter л: паль-ці.'
  - prompt: Як пра́вильно перенести́ сло́во «Мар'я́на»? — What is the correct hyphenation
      for «Мар'я́на»?
    options:
    - text: Мар'-я́на
      correct: true
    - text: Мар-'я́на
      correct: false
    - text: Ма-р'яна
      correct: false
    explanation: 'Апо́строф не відрива́ється від лі́тери р: Мар''-я́на. — The apostrophe
      is not separated from the letter р: Мар''-я́на.'
  - prompt: Як пра́вильно перенести́ сло́во «бур'я́н»? — What is the correct hyphenation
      for «бур'я́н»?
    options:
    - text: бур'-ян
      correct: true
    - text: бур-'ян
      correct: false
    - text: бу-р'ян
      correct: false
    explanation: 'Апо́строф залиша́ється з попере́дньою лі́терою р: бур''-ян. — The
      apostrophe stays with the preceding letter р: бур''-ян.'
  - prompt: Як пра́вильно перенести́ сло́во «дерев'я́ний»? — What is the correct hyphenation
      for «дерев'я́ний»?
    options:
    - text: дере́-в'яний
      correct: true
    - text: дере́в-'яний
      correct: false
    - text: де-рев'яний
      correct: false
    explanation: Безпе́чна моде́ль перено́су — дере́-в'яний. — The safe hyphenation
      model is дере́-в'яний.
