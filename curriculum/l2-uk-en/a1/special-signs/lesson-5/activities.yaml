inline:
- id: act-5-1
  type: match-up
  title: З'єдна́йте сло́во з пра́вилом — Match word with rule
  instruction: З'єдна́йте ко́жне сло́во з йо́го орфографі́чним поя́сненням. — Match
    each word with its spelling explanation.
  pairs:
  - left: день
    right: м'яки́й знак наприкінці́ сло́ва — soft sign at the end of the word
  - left: сім'я́
    right: апо́строф пі́сля губно́го м — apostrophe after labial м
  - left: буря́к
    right: м'яки́й [р'] пе́ред я без зна́ка — soft [р'] before я without sign
  - left: бур'я́н
    right: тверди́й [р] та [йа] з апо́строфом — hard [р] and [йа] with apostrophe
  - left: свя́то
    right: корене́вий збіг св пе́ред я — root cluster св before я
  - left: ло́жка
    right: тверди́й [л] без м'яко́го зна́ка — hard [л] without soft sign
- id: act-5-2
  type: fill-in
  title: Ви́беріть пра́вильний знак — Choose the correct sign
  instruction: Обери́ ь, апо́строф або́ без зна́ка. — Choose ь, an apostrophe, or
    no sign.
  items:
  - sentence: Моя́ дру́жна сім___я живе́ дру́жно. — My family lives in harmony.
    answer: ''''
    options:
    - ''''
    - ь
    - ''
    explanation: У сло́ві «сім'я́» пи́шеться апо́строф пі́сля губно́го [м]. — In the
      word сім'я́ an apostrophe is written after the labial [m].
  - sentence: Сього́дні ду́же га́рний ден___ . — Today is a very nice day.
    answer: ь
    options:
    - ь
    - ''''
    - ''
    explanation: 'У сло́ві «день» наприкінці́ пи́шеться м''яки́й знак: день. — At
      the end of the word день a soft sign is written: день.'
  - sentence: У руці́ рі́вно п___ять па́льців. — In the hand there are exactly five
      fingers.
    answer: ''''
    options:
    - ''''
    - ь
    - ''
    explanation: У сло́ві «п'ять» пи́шеться апо́строф пі́сля губно́го [п]. — In the
      word п'ять an apostrophe is written after labial [p].
  - sentence: Черво́ний бур___як росте́ на горо́ді. — Red beetroot grows in the garden.
    answer: ''
    options:
    - ''
    - ''''
    - ь
    explanation: У сло́ві «буря́к» апо́строф не потрі́бен, бо звук [р'] м'яки́й. —
      In the word буря́к no apostrophe is needed because [r'] is soft.
  - sentence: Зеле́ний бур___ян росте́ бі́ля доро́ги. — Green weed grows near the
      road.
    answer: ''''
    options:
    - ''''
    - ь
    - ''
    explanation: У сло́ві «бур'я́н» пи́шеться апо́строф пі́сля твердо́го [р]. — In
      the word бур'я́н an apostrophe is written after hard [r].
  - sentence: Сього́дні у мі́сті вели́ке св___ято. — Today there is a big holiday
      in the city.
    answer: ''
    options:
    - ''
    - ''''
    - ь
    explanation: У сло́ві «свя́то» апо́строф не пи́шеться че́рез збіг св. — In the
      word свя́то no apostrophe is written due to cluster св.
- id: act-5-3
  type: quiz
  title: Переві́рка знань про особли́ві зна́ки — Check your knowledge of special signs
  instruction: Обері́ть пра́вильний варіа́нт ві́дповіді. — Choose the correct answer
    option.
  items:
  - prompt: Яка́ головна́ фу́нкція м'яко́го зна́ка (ь)? — What is the main function
      of the soft sign (ь)?
    options:
    - text: Пом'я́кшувати попере́дній при́голосний звук. — Soften the preceding consonant
        sound.
      correct: true
    - text: Познача́ти окре́мий голосни́й звук. — Represent an independent vowel sound.
      correct: false
    - text: Розділя́ти склад на дві части́ни. — Divide a syllable into two parts.
      correct: false
    explanation: М'яки́й знак не ма́є вла́сного зву́ка; він лише́ вка́зує на м'я́кість
      попере́днього при́голосного. — The soft sign has no sound of its own; it only
      indicates the softness of the preceding consonant.
  - prompt: Яка́ головна́ фу́нкція апо́строфа (')? — What is the main function of
      the apostrophe (')?
    options:
    - text: Зберіга́ти тве́рдість при́голосного та розді́льну вимо́ву [й]. — Keep
        consonant hard and ensure separated [й] pronunciation.
      correct: true
    - text: Пом'я́кшувати губні́ при́голосні. — Soften labial consonants.
      correct: false
    - text: Роби́ти па́узу всере́дині сло́ва. — Make a pause inside the word.
      correct: false
    explanation: Апо́строф забороня́є пом'я́кшення й вка́зує на розді́льну вимо́ву
      йото́ваного зву́ка [йа, йу, йе, йі]. — The apostrophe prevents softening and
      indicates separate pronunciation of iotated sounds.
  - prompt: Чому́ в сло́ві «буря́к» нема́є апо́строфа? — Why is there no apostrophe
      in «буря́к»?
    options:
    - text: 'Звук [р''] м''яки́й, вимо́ва зли́та: [бур''а́к]. — Sound [р''] is soft,
        pronunciation is smooth: [бур''а́к].'
      correct: true
    - text: Пі́сля р за́вжди пи́шеться ь. — After р a soft sign is always written.
      correct: false
    - text: Це ви́няток з пра́вила. — This is an exception to the rule.
      correct: false
    explanation: У сло́ві «буря́к» звучи́ть м'яки́й [р'], тому́ апо́строф не ста́виться.
      — In «буря́к» the soft sound [р'] is heard, so no apostrophe is written.
  - prompt: Чому́ в сло́ві «бур'я́н» пи́шеться апо́строф? — Why is an apostrophe written
      in «бур'я́н»?
    options:
    - text: 'Звук [р] тверди́й, вимо́ва розді́льна: [бурйа́н]. — Sound [р] is hard,
        pronunciation is separate: [бурйа́н].'
      correct: true
    - text: Звук [р] пом'я́кшується пе́ред я. — Sound [р] softens before я.
      correct: false
    - text: Це сло́во іншомо́вного похо́дження. — This is a loanword.
      correct: false
    explanation: У сло́ві «бур'я́н» апо́строф утри́мує тве́рдість [р] і відокре́млює
      [йа]. — In «бур'я́н» the apostrophe keeps [р] hard and separates [йа].
  - prompt: Чому́ в сло́ві «свя́то» нема́є апо́строфа? — Why is there no apostrophe
      in «свя́то»?
    options:
    - text: Пе́ред губни́м в є корене́вий при́голосний с. — Before labial в stands
        root consonant с.
      correct: true
    - text: Губни́й в за́вжди м'яки́й. — Labial в is always soft.
      correct: false
    - text: Лі́тера я мовчи́ть. — Letter я is silent.
      correct: false
    explanation: Коли́ пе́ред губни́м стої́ть і́нший корене́вий при́голосний (крім
      р), апо́строф не ста́виться. — When another root consonant (except р) precedes
      the labial, no apostrophe is written.
  - prompt: Яке́ сло́во напи́сано помилко́во? — Which word is written incorrectly?
    options:
    - text: льо́жка
      correct: true
    - text: ло́жка
      correct: false
    - text: день
      correct: false
    explanation: 'У сло́ві «ло́жка» нема́є м''яко́го зна́ка пі́сля л: пра́вильно «ло́жка».
      — In the word ло́жка there is no soft sign after л: correctly «ло́жка».'
- id: act-5-4
  type: true-false
  title: Пра́вда чи непра́вда — True or false
  instruction: Ви́значте, чи є тве́рдження пра́вильним. — Decide whether each statement
    is correct.
  items:
  - statement: М'яки́й знак (ь) ма́є свій вла́сний голосни́й звук. — The soft sign
      (ь) has its own vowel sound.
    isTrue: false
    explanation: М'яки́й знак не познача́є жо́дного зву́ка; він лише́ пом'я́кшує попере́дній
      при́голосний. — The soft sign represents no sound; it only softens the preceding
      consonant.
  - statement: Апо́строф ста́виться пе́ред я, ю, є, ї пі́сля губни́х б, п, в, м, ф
      та р при розді́льній вимо́ві. — The apostrophe is placed before я, ю, є, ї after
      labials б, п, в, м, ф and р with separate pronunciation.
    isTrue: true
    explanation: Це ба́зове пра́вило вжива́ння украї́нського апо́строфа. — This is
      the basic rule of Ukrainian apostrophe usage.
  - statement: У сло́ві «буря́к» пи́шеться апо́строф. — In the word «буря́к» an apostrophe
      is written.
    isTrue: false
    explanation: У сло́ві «буря́к» звук [р'] є м'яки́м, тому́ апо́строф не пи́шеться.
      — In «буря́к» the sound [р'] is soft, so no apostrophe is written.
  - statement: У сло́ві «цвях» нема́є апо́строфа. — In the word «цвях» there is no
      apostrophe.
    isTrue: true
    explanation: Че́рез корене́вий збіг при́голосних цв апо́строф не пи́шеться. —
      Due to the root consonant cluster цв no apostrophe is written.
  - statement: 'Пі́сля апо́строфа лі́тери я, ю, є за́вжди познача́ють два зву́ки:
      [йа], [йу], [йе]. — After an apostrophe, letters я, ю, є always represent two
      sounds: [йа], [йу], [йе].'
    isTrue: true
    explanation: Апо́строф зберіга́є розді́льну вимо́ву та звук [й]. — The apostrophe
      preserves separate pronunciation and the [j] sound.
  - statement: В украї́нській мо́ві є тверди́й знак (ъ). — In Ukrainian there is a
      hard sign (ъ).
    isTrue: false
    explanation: В украї́нській мо́ві твердо́го зна́ка нема́є; розді́льну вимо́ву
      передає́ ви́ключно апо́строф. — In Ukrainian there is no hard sign; separate
      pronunciation is conveyed exclusively by the apostrophe.
workbook:
- id: act-w5
  type: fill-in
  title: Дода́й знак у нови́х слова́х — Add a sign in new words
  instruction: Обери́ ь, апо́строф або́ без зна́ка. — Choose ь, an apostrophe, or
    no sign.
  items:
  - sentence: бур___ян
    answer: ''''
    options:
    - ''''
    - ь
    - ''
    explanation: У сло́ві «бур'я́н» пи́шеться апо́строф пі́сля твердо́го [р] пе́ред
      я. — In the word бур'я́н an apostrophe is written after hard [r] before я.
  - sentence: комп___ютер
    answer: ''''
    options:
    - ''''
    - ь
    - ''
    explanation: У сло́ві «комп'ю́тер» пи́шеться апо́строф пі́сля твердо́го губно́го
      [п] пе́ред ю. — In the word комп'ю́тер an apostrophe is written after hard labial
      [p] before ю.
  - sentence: ім___я
    answer: ''''
    options:
    - ''''
    - ь
    - ''
    explanation: У сло́ві «ім'я́» пи́шеться апо́строф пі́сля губно́го [м] пе́ред я.
      — In the word ім'я́ an apostrophe is written after labial [m] before я.
  - sentence: У сло́ві мален_кий потрі́бен ___ . — In the word "мален_кий", […] is
      needed.
    answer: ь
    options:
    - ь
    - ''''
    - ''
    explanation: У сло́ві «мале́нький» пи́шеться м'яки́й знак пі́сля н пе́ред к. —
      In the word мале́нький a soft sign is written after н before к.
  - sentence: У сло́ві цвях пра́вильний ви́бір — ___ . — In the word "цвях", the correct
      choice is […].
    answer: ''
    options:
    - ''
    - ''''
    - ь
    explanation: У сло́ві «цвях» апо́строф не пи́шеться че́рез корене́вий збіг цв.
      — In the word цвях no apostrophe is written due to the root consonant cluster
      цв.
- id: act-w6
  type: quiz
  title: Пра́вильна фо́рма — Correct form
  instruction: Обери́ пра́вильно напи́сане сло́во. — Choose the correctly spelled
    word.
  items:
  - prompt: Сім'я́ — яка́ фо́рма пра́вильна? — Сім'я́ — which form is correct?
    options:
    - text: сім'я́
      correct: true
    - text: сімя
      correct: false
    explanation: Сім'я́ потребу́є апо́строфа пі́сля губно́го [м] пере́д я. — Сім'я́
      requires an apostrophe after labial [m] before я.
  - prompt: День — яка́ фо́рма пра́вильна? — День — which form is correct?
    options:
    - text: ден
      correct: false
    - text: день
      correct: true
    explanation: День потребу́є м'яко́го зна́ка для позна́чення м'я́кості [н']. —
      День requires a soft sign to indicate the softness of [n'].
  - prompt: Сло́во без апо́строфа? — Which word is without an apostrophe?
    options:
    - text: св'ято
      correct: false
    - text: свя́то
      correct: true
    explanation: У сло́ві свя́то нема́є апо́строфа че́рез збіг при́голосних св у ко́рені.
      — In the word свя́то there is no apostrophe due to the consonant cluster св
      in the root.
- id: act-w7
  type: odd-one-out
  title: За́йве за зна́ком — Odd one out by sign
  instruction: Обери́ сло́во, яке́ не ма́є тако́го само́го зна́ка, як і́нші. — Choose
    the word that does not have the same sign as the others.
  items:
  - words:
    - сім'я́
    - м'я́со
    - п'ять
    - буря́к
    answer: буря́к
    explanation: Буря́к без апо́строфа; і́нші слова́ ма́ють апо́строф. — Буря́к is
      without an apostrophe; other words have an apostrophe.
  - words:
    - день
    - кінь
    - сіль
    - свя́то
    answer: свя́то
    explanation: Свя́то без ь; і́нші слова́ ма́ють м'яки́й знак. — Свя́то has no ь;
      other words have a soft sign.
  - words:
    - буря́к
    - свя́то
    - цвях
    - бур'я́н
    answer: бур'я́н
    explanation: Бур'я́н ма́є апо́строф; і́нші слова́ тут без зна́ка. — Бур'я́н has
      an apostrophe; other words here have no sign.
- id: act-w8
  type: group-sort
  title: Сортува́ння за зна́ками — Sorting by signs
  instruction: 'Розподілі́ть слова́ на три гру́пи: з м''яки́м зна́ком, з апо́строфом
    та без зна́ка. — Sort the words into three groups: with soft sign, with apostrophe,
    and without sign.'
  groups:
  - label: Є м'яки́й знак (ь) — Has soft sign
    items:
    - день
    - кінь
    - сіль
    - вчи́тель
  - label: Є апо́строф (') — Has apostrophe
    items:
    - сім'я́
    - м'я́со
    - п'ять
    - комп'ю́тер
  - label: Нема́є зна́ка — No sign
    items:
    - буря́к
    - свя́то
    - цвях
    - ло́жка
- id: act-w9
  type: error-correction
  title: Знайди́ та ви́прав по́милку — Find and fix the mistake
  instruction: Знайді́ть помилко́ве сло́во в ре́ченні та ви́правте йо́го. — Find the
    misspelled word in the sentence and fix it.
  items:
  - sentence: Моя́ дру́жна сімя живе́ у Ки́єві.
    error: сімя
    correction: сім'я́
    options:
    - сім'я́
    - сімья
    - сьім'я
    explanation: У сло́ві «сім'я́» потрі́бен апо́строф пі́сля губно́го [м] пе́ред
      я. — In the word сім'я́ an apostrophe is needed after the labial [m] before
      я.
  - sentence: Сього́дні ду́же те́плий ден.
    error: ден
    correction: день
    options:
    - день
    - дєнь
    - дьень
    explanation: Сло́во «день» пи́шеться з м'яки́м зна́ком на кінці́. — The word день
      is written with a soft sign at the end.
  - sentence: У руці́ рі́вно пять па́льців.
    error: пять
    correction: п'ять
    options:
    - п'ять
    - пьять
    - ьп'ять
    explanation: У сло́ві «п'ять» пі́сля губно́го [п] пе́ред я пи́шеться апо́строф.
      — In the word п'ять an apostrophe is written after labial [p] before я.
  - sentence: На по́лі росте́ зеле́ний бурян.
    error: бурян
    correction: бур'я́н
    options:
    - бур'я́н
    - бурья́н
    - ьбур'я́н
    explanation: У сло́ві «бур'я́н» потрі́бен апо́строф пі́сля твердо́го [р] пе́ред
      я. — In the word бур'я́н an apostrophe is needed after hard [r] before я.
  - sentence: Сього́дні у мі́сті вели́ке св'ято.
    error: св'ято
    correction: свя́то
    options:
    - свя́то
    - сьвя́то
    - свья́то
    explanation: У сло́ві «свя́то» нема́є апо́строфа че́рез збіг при́голосних св у
      ко́рені. — In the word свя́то there is no apostrophe due to the consonant cluster
      св in the root.
  - sentence: На столі́ лежи́ть вели́ка льожка.
    error: льожка
    correction: ло́жка
    options:
    - ло́жка
    - лю́жка
    - льо́шка
    explanation: Сло́во «ло́жка» не ма́є м'яко́го зна́ка пі́сля л. — The word ло́жка
      has no soft sign after л.
- id: act-w10
  type: unjumble
  title: Складі́ть ре́чення — Unjumble the sentences
  instruction: Розста́вте слова́ у пра́вильному поря́дку, щоб утвори́ти ре́чення.
    — Arrange the words in the correct order to form a sentence.
  items:
  - jumbled: Сього́дні / у / мі́сті / вели́ке / свя́то.
    answer: Сього́дні у мі́сті вели́ке свя́то.
  - jumbled: Моя́ / дру́жна / сім'я́ / живе́ / у / Ки́єві.
    answer: Моя́ дру́жна сім'я́ живе́ у Ки́єві.
  - jumbled: Наш / вчи́тель / пи́ше / пра́вило / на / до́шці.
    answer: Наш вчи́тель пи́ше пра́вило на до́шці.
