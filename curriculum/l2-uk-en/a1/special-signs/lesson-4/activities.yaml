inline:
- id: act-1
  type: quiz
  title: М'я́ко чи розді́льно
  instruction: Обери́ поя́снення для чита́ння.
  items:
  - prompt: Буря́к — що відбу́вається пе́ред лі́терою я?
    options:
    - text: Р пом'я́кшується пе́ред я.
      correct: true
    - text: Є апо́строф.
      correct: false
    - text: Ї за́вжди [йі].
      correct: false
    explanation: У сло́ві буря́к нема́є апо́строфа; р пом'я́кшується пе́ред я.
  - prompt: Бур'я́н — що ро́бить апо́строф?
    options:
    - text: Р зника́є.
      correct: false
    - text: Р залиша́ється тверди́м, по́тім чу́ти [йа].
      correct: true
    - text: Додає́ звук [і].
      correct: false
    explanation: Апо́строф відділя́є р від я.
  - prompt: Ї — що за́вжди пра́вильно?
    options:
    - text: Мовчи́ть.
      correct: false
    - text: Це м'яки́й знак.
      correct: false
    - text: За́вжди [йі].
      correct: true
    explanation: Ї за́вжди познача́є [йі].
- id: act-3
  type: fill-in
  title: Дода́й знак
  instruction: Обери́ ь, апо́строф або́ без зна́ка.
  items:
  - sentence: сім_я
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: ден_
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
  - sentence: п_ять
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: У сло́ві свя́то пра́вильний ви́бір — ____.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
- id: act-4
  type: error-correction
  title: Ви́прав па́стки
  instruction: Обери́ пра́вильну украї́нську фо́рму.
  items:
  - sentence: Не пиши́ сімя без апо́строфа.
    error: сімя
    correction: сім'я́
    options:
    - сім'я́
    - сімя
    explanation: У сло́ві сім'я́ потрі́бен апо́строф.
  - sentence: День — не пиши́ ден.
    error: ден
    correction: день
    options:
    - день
    - ден
    explanation: День потребу́є м'яко́го зна́ка.
  - sentence: Не пиши́ св'ято з апо́строфом.
    error: св'ято
    correction: свя́то
    options:
    - свя́то
    - св'ято
    explanation: У сло́ві свя́то нема́є апо́строфа.
  - sentence: Не пиши́ льожка з ви́гаданим м'яки́м зна́ком.
    error: льожка
    correction: ло́жка
    options:
    - ло́жка
    - льожка
    explanation: Ло́жка не ма́є м'яко́го зна́ка пі́сля л.
- id: act-404
  type: match-up
  title: 'Зіста́влення слів та зна́ків — Match-up: Words and signs'
  instruction: З'єдна́йте украї́нське сло́во з йо́го фо́рмою та зна́ченням.
  pairs:
  - left: сім'я́
    right: 'роди́на: тверди́й [м] та [йа]'
  - left: м'я́со
    right: 'ї́жа: тверди́й [м] та [йа]'
  - left: п'ять
    right: 'число́: тверди́й [п] та [йа]'
  - left: буря́к
    right: 'о́воч: м''яки́й [р''] пе́ред [а]'
  - left: бур'я́н
    right: 'трава́: тверди́й [р] та [йа]'
  - left: свя́то
    right: 'ра́дість: губни́й [в] пі́сля [с]'
- id: act-405
  type: quiz
  title: Пра́вила вжива́ння апо́строфа — Rules of apostrophe usage
  instruction: Обері́ть пра́вильний варіа́нт ві́дповіді на ко́жне запита́ння.
  items:
  - prompt: Пі́сля яки́х лі́тер за́вжди пи́шеться апо́строф пе́ред я, ю, є, ї?
    options:
    - text: Пі́сля губни́х б, п, в, м, ф та пі́сля р
      correct: true
    - text: Пі́сля будь-яки́х при́голосних
      correct: false
    - text: Ті́льки пі́сля голосни́х
      correct: false
    explanation: Апо́строф вжива́ється пі́сля губни́х при́голосних (б, п, в, м, ф)
      та р пе́ред я, ю, є, ї.
  - prompt: Чому́ в сло́ві «буря́к» нема́є апо́строфа?
    options:
    - text: Тому́ що [р'] м'яки́й і нема́є розді́льної вимо́ви
      correct: true
    - text: Тому́ що це поми́лка
      correct: false
    - text: Тому́ що я мовчи́ть
      correct: false
    explanation: У сло́ві «буря́к» при́голосний [р'] пом'я́кшується пе́ред [а], тому́
      апо́строф не потрі́бен.
  - prompt: Чому́ в сло́ві «свя́то» нема́є апо́строфа?
    options:
    - text: Тому́ що пе́ред губни́м в стої́ть при́голосний с
      correct: true
    - text: Тому́ що в сло́ві лише́ три лі́тери
      correct: false
    - text: Тому́ що в за́вжди м'яки́й
      correct: false
    explanation: Пе́ред губни́м [в] є і́нший корене́вий при́голосний [с], тому́ апо́строф
      не ста́виться.
  - prompt: Як пра́вильно чита́ти сло́во «комп'ю́тер»?
    options:
    - text: З розді́льною вимо́вою твердо́го [п] та [йу]
      correct: true
    - text: З пом'я́кшеним п
      correct: false
    - text: Без зву́ка п
      correct: false
    explanation: Апо́строф зберіга́є розді́льну вимо́ву [йу] пі́сля твердо́го [п].
  - prompt: Скі́льки зву́ків познача́є лі́тера я у сло́ві «ім'я́»?
    options:
    - text: 'Два зву́ки: [й] + [а]'
      correct: true
    - text: 'Оди́н звук: [а]'
      correct: false
    - text: Жо́дного зву́ка
      correct: false
    explanation: Пі́сля апо́строфа лі́тери я, ю, є за́вжди познача́ють два зву́ки.
  - prompt: Яку́ роль відігра́є апо́строф в украї́нській мо́ві?
    options:
    - text: Він є розді́льним зна́ком і не ма́є вла́сного зву́ка
      correct: true
    - text: Він познача́є окре́мий голосни́й звук
      correct: false
    - text: Він пом'я́кшує попере́дній при́голосний
      correct: false
    explanation: Апо́строф — це графі́чний розді́льний знак, яки́й сам зву́ка не познача́є.
workbook:
- id: act-w1
  type: group-sort
  title: Сорту́й за зна́ком
  instruction: Розподіли́ ко́жне сло́во в пра́вильну гру́пу.
  groups:
  - label: Є ь
    items:
    - день
    - кінь
    - сіль
    - вчи́тель
    - мале́нький
  - label: Є апо́строф
    items:
    - сім'я́
    - м'я́со
    - п'ять
    - комп'ю́тер
    - бур'я́н
  - label: Нема́є зна́ка
    items:
    - буря́к
    - свя́то
    - цвях
    - ло́жка
- id: act-w2
  type: match-up
  title: Поясни́ контра́ст
  instruction: З'єдна́й сло́во з поя́сненням.
  pairs:
  - left: буря́к
    right: 'м''я́кість без апо́строфа: р + я'
  - left: бур'я́н
    right: 'апо́строф: р тверди́й, по́тім [йа]'
  - left: свя́то
    right: збіг св + я без апо́строфа
  - left: цвях
    right: збіг цв + я без апо́строфа
- id: act-w3
  type: error-correction
  title: Ви́прав усі́ па́стки
  instruction: Обери́ пра́вильну украї́нську фо́рму.
  items:
  - sentence: Не пиши́ сімя без апо́строфа.
    error: сімя
    correction: сім'я́
    options:
    - сім'я́
    - сімя
    explanation: У сло́ві сім'я́ потрі́бен апо́строф.
  - sentence: Не пиши́ пять без апо́строфа.
    error: пять
    correction: п'ять
    options:
    - п'ять
    - пять
    explanation: У сло́ві п'ять потрі́бен апо́строф.
  - sentence: Не пиши́ бурян без апо́строфа.
    error: бурян
    correction: бур'я́н
    options:
    - бур'я́н
    - бурян
    explanation: У сло́ві бур'я́н потрі́бен апо́строф пі́сля р.
  - sentence: День — не пиши́ ден.
    error: ден
    correction: день
    options:
    - день
    - ден
    explanation: День потребу́є м'яко́го зна́ка.
  - sentence: Не пиши́ св'ято з апо́строфом.
    error: св'ято
    correction: свя́то
    options:
    - свя́то
    - св'ято
    explanation: У сло́ві свя́то нема́є апо́строфа.
  - sentence: Не пиши́ льожка з ви́гаданим м'яки́м зна́ком.
    error: льожка
    correction: ло́жка
    options:
    - ло́жка
    - льожка
    explanation: Ло́жка не ма́є м'яко́го зна́ка пі́сля л.
- id: act-w4
  type: true-false
  title: Фа́кти про зна́ки
  instruction: 'Обери́: пра́вда чи непра́вда.'
  items:
  - statement: Ь не ма́є вла́сного зву́ка.
    correct: true
    explanation: Він пом'я́кшує попере́дній при́голосний.
  - statement: Апо́строф трима́є попере́дній при́голосний тверди́м.
    correct: true
    explanation: Він відділя́є при́голосний від йото́ваної голосно́ї.
  - statement: Ї і́ноді мовчи́ть.
    correct: false
    explanation: Ї за́вжди чита́ємо як [йі].
  - statement: Свя́то ма́є апо́строф.
    correct: false
    explanation: Свя́то — моде́льне сло́во без апо́строфа.
- id: act-406
  type: fill-in
  title: Впиші́ть пра́вильне сло́во зі зна́ком — Fill in the correct word with sign
  instruction: Впиші́ть пра́вильне сло́во у про́пуск ___ у ко́жному ре́ченні.
  items:
  - sentence: Моя́ дру́жна ___ живе́ у Ки́єві.
    answer: сім'я́
    options:
    - сім'я́
    - сімя
    - сімь
  - sentence: У руці́ рі́вно ___ па́льців.
    answer: п'ять
    options:
    - п'ять
    - пять
    - пят
  - sentence: На горо́ді росте́ черво́ний ___ .
    answer: буря́к
    options:
    - буря́к
    - бур'я́к
    - бурак
  - sentence: На по́лі зеле́ний ___ заважа́є кві́там.
    answer: бур'я́н
    options:
    - бур'я́н
    - бурян
    - буріян
  - sentence: Сього́дні весе́ле ___ у на́шому мі́сті.
    answer: свя́то
    options:
    - свя́то
    - св'ято
    - сьвято
  - sentence: У су́пі потрі́бна вели́ка ___ .
    answer: ло́жка
    options:
    - ло́жка
    - льожка
    - ложька
- id: act-407
  type: quiz
  title: Знак чи без зна́ка — Apostrophe or no apostrophe
  instruction: Select the correctly spelled form for each item.
  items:
  - question: Як пра́вильно написа́ти «family»?
    options:
    - сім'я́
    - сімя́
    - сімья́
    answer: сім'я́
  - question: Як пра́вильно написа́ти «beetroot»?
    options:
    - буря́к
    - бур'я́к
    - буріак
    answer: буря́к
  - question: Як пра́вильно написа́ти «weed»?
    options:
    - бур'я́н
    - буря́н
    - буріан
    answer: бур'я́н
  - question: Як пра́вильно написа́ти «holiday»?
    options:
    - свя́то
    - св'я́то
    - сьвя́то
    answer: свя́то
  - question: Як пра́вильно написа́ти «nail»?
    options:
    - цвях
    - цв'ях
    - цьвях
    answer: цвях
  - question: Як пра́вильно написа́ти «meat»?
    options:
    - м'я́со
    - мя́со
    - мья́со
    answer: м'я́со
