inline:
- id: act-3
  type: fill-in
  title: Дода́й знак — Add a sign
  instruction: Обери́ ь, апо́строф або́ без зна́ка. — Choose ь, an apostrophe, or
    no sign.
  items:
  - sentence: сім___я
    options:
    - ''''
    - ь
    - ''
    answer: ''''
    explanation: 'Пі́сля губно́го при́голосного «м» пе́ред «я» пи́шемо апо́строф:
      сім''я́. — After labial ''м'' before ''я'', we write an apostrophe: сім''я́.'
  - sentence: ден___
    options:
    - ь
    - ''''
    - ''
    answer: ь
    explanation: 'Наприкінці́ сло́ва пі́сля «н» пи́шемо м''яки́й знак: день. — At
      the end of the word after ''н'', we write a soft sign: день.'
  - sentence: п___ять
    options:
    - ''''
    - ь
    - ''
    answer: ''''
    explanation: 'Пі́сля губно́го при́голосного «п» пе́ред «я» пи́шемо апо́строф:
      п''ять. — After labial ''п'' before ''я'', we write an apostrophe: п''ять.'
  - sentence: У сло́ві свя́то пра́вильний ви́бір — ___ . — In the word "свя́то", the
      correct choice is […].
    options:
    - ''
    - ''''
    - ь
    answer: ''
    explanation: 'Пі́сля корене́вого збі́гу при́голосних «св» пе́ред «я» апо́строф
      не пи́шемо: свя́то. — After root consonant cluster ''св'' before ''я'', no apostrophe
      is written: свя́то.'
- id: act-401
  type: match-up
  title: Апо́строф пі́сля губни́х — Apostrophe after labials
  instruction: З'єдна́й украї́нське сло́во з йо́го о́писом. — Match the Ukrainian
    word with its description.
  pairs:
  - left: сім'я́
    right: апо́строф пі́сля «м» — apostrophe after «м»
  - left: м'я́со
    right: апо́строф пі́сля «м» пе́ред «я» — apostrophe after «м» before «я»
  - left: п'ять
    right: апо́строф пі́сля «п» — apostrophe after «п»
  - left: де́в'ять
    right: апо́строф пі́сля «в» — apostrophe after «в»
  - left: ім'я́
    right: апо́строф пі́сля «м» в ко́рені — apostrophe after «м» in root
  - left: комп'ю́тер
    right: апо́строф пі́сля «п» пе́ред «ю» — apostrophe after «п» before «ю»
- id: act-1
  type: quiz
  title: М'я́ко чи розді́льно — Soft or separate
  instruction: Обери́ поя́снення для чита́ння. — Choose the explanation for reading.
  items:
  - prompt: Буря́к — що відбу́вається пе́ред лі́терою я? — Буря́к — what happens before
      the letter я?
    options:
    - text: Р пом'я́кшується пе́ред я. — Р softens before я.
      correct: true
    - text: Є апо́строф. — There is an apostrophe.
      correct: false
    - text: Ї за́вжди [йі]. — Ї is always [йі].
      correct: false
    explanation: У сло́ві буря́к нема́є апо́строфа; р пом'я́кшується пе́ред я. — In
      the word буря́к there is no apostrophe; р softens before я.
  - prompt: Бур'я́н — що ро́бить апо́строф? — Бур'я́н — what does the apostrophe do?
    options:
    - text: Р зника́є. — Р disappears.
      correct: false
    - text: Р залиша́ється тверди́м, по́тім чу́ти [йа]. — Р remains hard, then [йа]
        is heard.
      correct: true
    - text: Додає́ звук [і]. — It adds the sound [і].
      correct: false
    explanation: Апо́строф відділя́є р від я. — The apostrophe separates р from я.
  - prompt: Ї — що за́вжди пра́вильно? — Ї — what is always true?
    options:
    - text: Мовчи́ть. — It is silent.
      correct: false
    - text: Це м'яки́й знак. — It is the soft sign.
      correct: false
    - text: За́вжди [йі]. — Always [йі].
      correct: true
    explanation: Ї за́вжди познача́є [йі]. — Ї always represents [йі].
- id: act-4
  type: error-correction
  title: Ви́прав па́стки — Correct the traps
  instruction: Обери́ пра́вильну украї́нську фо́рму. — Choose the correct Ukrainian
    form.
  items:
  - sentence: Моя́ дру́жна сімя живе́ у Ки́єві.
    error: сімя
    correction: сім'я́
    options:
    - сім'я́
    - сімья́
    - ьсім'я́
    explanation: У сло́ві сім'я́ потрі́бен апо́строф. — In the word сім'я́ an apostrophe
      is needed.
  - sentence: Сього́дні га́рний і те́плий ден.
    error: ден
    correction: день
    options:
    - день
    - дєнь
    - ьдень
    explanation: День потребу́є м'яко́го зна́ка. — День requires a soft sign.
  - sentence: Сього́дні у мі́сті вели́ке св'ято.
    error: св'ято
    correction: свя́то
    options:
    - свя́то
    - свья́то
    - ьсвя́то
    explanation: У сло́ві свя́то нема́є апо́строфа. — In the word свя́то there is
      no apostrophe.
  - sentence: На столі́ лежи́ть вели́ка льожка.
    error: льожка
    correction: ло́жка
    options:
    - ло́жка
    - ьло́жка
    - лоь́жка
    explanation: Ло́жка не ма́є м'яко́го зна́ка пі́сля л. — Ло́жка has no soft sign
      after л.
- id: act-402
  type: quiz
  title: 'Три контра́сти: ви́бір пра́вила — Three contrasts: choosing the rule'
  instruction: Обери́ пра́вильне поя́снення для по́даного сло́ва. — Choose the correct
    explanation for the given word.
  items:
  - prompt: Чому́ в сло́ві «буря́к» нема́є апо́строфа? — Why is there no apostrophe
      in the word «буря́к»?
    options:
    - text: Бу́ква «р» познача́є м'яки́й звук [р'], вимо́ва зли́та. — Letter «р» denotes
        soft [р'], pronunciation is blended.
      correct: true
    - text: Бу́ква «р» вимага́є апо́строфа за́вжди. — Letter «р» always requires an
        apostrophe.
      correct: false
    - text: Тут є м'яки́й знак. — There is a soft sign here.
      correct: false
    explanation: У сло́ві «буря́к» звук [р'] є м'яки́м, тому́ апо́строф не пи́шеться.
      — In «буря́к» the sound [р'] is soft, so no apostrophe is written.
  - prompt: Що ро́бить апо́строф у сло́ві «бур'я́н»? — What does the apostrophe do
      in the word «бур'я́н»?
    options:
    - text: Зберіга́є тве́рдість [р] і розді́льну вимо́ву [йа]. — Keeps [р] hard and
        pronunciation separate [йа].
      correct: true
    - text: Пом'я́кшує звук [р]. — Softens the sound [р].
      correct: false
    - text: Пока́зує, що бу́ква «я» мовчи́ть. — Shows that letter «я» is silent.
      correct: false
    explanation: Апо́строф познача́є тверди́й звук [р] пе́ред [йа]. — The apostrophe
      indicates a hard [р] before [йа].
  - prompt: Чому́ в сло́ві «свя́то» нема́є апо́строфа? — Why is there no apostrophe
      in the word «свя́то»?
    options:
    - text: Пе́ред губни́м «в» є корене́вий при́голосний «с». — Before labial «в»
        there is root consonant «с».
      correct: true
    - text: Бу́ква «в» за́вжди м'яка́. — Letter «в» is always soft.
      correct: false
    - text: Сло́во є запози́ченим. — The word is borrowed.
      correct: false
    explanation: 'Пе́ред губни́м «в» стої́ть при́голосний «с», тому́ апо́строф не
      пи́шеться: свя́то. — Before labial «в» stands consonant «с», so no apostrophe
      is written: свя́то.'
  - prompt: Чому́ в сло́ві «цвях» нема́є апо́строфа? — Why is there no apostrophe
      in the word «цвях»?
    options:
    - text: Пе́ред губни́м «в» є при́голосний «ц». — Before labial «в» stands consonant
        «ц».
      correct: true
    - text: Апо́строф пи́шеться лише́ наприкінці́. — Apostrophe is written only at
        the end.
      correct: false
    - text: Бу́ква «я» не познача́є звук. — Letter «я» does not represent a sound.
      correct: false
    explanation: Пе́ред губни́м «в» є при́голосний ко́реня «ц», тому́ апо́строф не
      пи́шеться. — Before labial «в» stands root consonant «ц», so no apostrophe is
      written.
  - prompt: Яка́ вимо́ва у сло́ві «м'я́со»? — What is the pronunciation of «м'я́со»?
    options:
    - text: Тверди́й [м] + розді́льне [йа]. — Hard [м] + separate [йа].
      correct: true
    - text: М'яки́й [м'] + [а]. — Soft [м'] + [а].
      correct: false
    - text: До́вга па́уза з горта́нним зву́ком. — A long pause with a glottal stop.
      correct: false
    explanation: Апо́строф пі́сля «м» забезпе́чує тверди́й [м] і розді́льний звук
      [йа]. — Apostrophe after «м» provides hard [м] and separate sound [йа].
  - prompt: Що познача́є «ь» у сло́ві «день»? — What does «ь» indicate in «день»?
    options:
    - text: М'я́кість попере́днього [н']. — Softness of preceding [н'].
      correct: true
    - text: Розді́льну вимо́ву [й]. — Separate pronunciation [й].
      correct: false
    - text: Окре́мий звук [і]. — A separate sound [і].
      correct: false
    explanation: М'яки́й знак пока́зує м'я́кість попере́днього при́голосного [н'].
      — The soft sign indicates softness of the preceding consonant [н'].
workbook:
- id: act-w1
  type: group-sort
  title: Сорту́й за зна́ком — Sort by sign
  instruction: Розподіли́ ко́жне сло́во в пра́вильну гру́пу. — Sort each word into
    the correct group.
  groups:
  - label: Є ь — Has ь
    items:
    - день
    - кінь
    - сіль
    - вчи́тель
    - мале́нький
  - label: Є апо́строф — Has apostrophe
    items:
    - сім'я́
    - м'я́со
    - п'ять
    - комп'ю́тер
    - бур'я́н
  - label: Нема́є зна́ка — No sign
    items:
    - буря́к
    - свя́то
    - цвях
    - ло́жка
- id: act-w2
  type: match-up
  title: Поясни́ контра́ст — Explain the contrast
  instruction: З'єдна́й сло́во з поя́сненням. — Match each word with its explanation.
  pairs:
  - left: буря́к
    right: 'м''я́кість без апо́строфа: р + я — softness without apostrophe: р + я'
  - left: бур'я́н
    right: 'апо́строф: р тверди́й, по́тім [йа] — apostrophe: hard р, then [йа]'
  - left: свя́то
    right: збіг св + я без апо́строфа — cluster св + я without apostrophe
  - left: цвях
    right: збіг цв + я без апо́строфа — cluster цв + я without apostrophe
- id: act-w3
  type: error-correction
  title: Ви́прав усі́ па́стки — Fix all traps
  instruction: Обери́ пра́вильну украї́нську фо́рму. — Choose the correct Ukrainian
    form.
  items:
  - sentence: Це на́ша дру́жна сімя.
    error: сімя
    correction: сім'я́
    options:
    - сім'я́
    - сімья́
    - ьсім'я́
    explanation: У сло́ві сім'я́ потрі́бен апо́строф. — In the word сім'я́ an apostrophe
      is needed.
  - sentence: У руці́ рі́вно пять па́льців.
    error: пять
    correction: п'ять
    options:
    - п'ять
    - пьять
    - ьп'ять
    explanation: У сло́ві п'ять потрі́бен апо́строф. — In the word п'ять an apostrophe
      is needed.
  - sentence: На по́лі росте́ зеле́ний бурян.
    error: бурян
    correction: бур'я́н
    options:
    - бур'я́н
    - бурья́н
    - ьбур'я́н
    explanation: У сло́ві бур'я́н потрі́бен апо́строф пі́сля р. — In the word бур'я́н
      an apostrophe is needed after р.
  - sentence: Сього́дні ду́же те́плий ден.
    error: ден
    correction: день
    options:
    - день
    - дєнь
    - ьдень
    explanation: День потребу́є м'яко́го зна́ка. — День requires a soft sign.
  - sentence: Сього́дні у на́с весе́ле св'ято.
    error: св'ято
    correction: свя́то
    options:
    - свя́то
    - свья́то
    - ьсвя́то
    explanation: У сло́ві свя́то нема́є апо́строфа. — In the word свя́то there is
      no apostrophe.
  - sentence: У су́пі лежи́ть вели́ка льожка.
    error: льожка
    correction: ло́жка
    options:
    - ло́жка
    - ьло́жка
    - лоь́жка
    explanation: Ло́жка не ма́є м'яко́го зна́ка пі́сля л. — Ло́жка has no soft sign
      after л.
- id: act-w4
  type: true-false
  title: Фа́кти про зна́ки — Facts about signs
  instruction: 'Обери́: пра́вда чи непра́вда. — Choose: true or false.'
  items:
  - statement: Ь не ма́є вла́сного зву́ка. — Ь has no sound of its own.
    correct: true
    explanation: Він пом'я́кшує попере́дній при́голосний. — It softens the preceding
      consonant.
  - statement: Апо́строф трима́є попере́дній при́голосний тверди́м. — The apostrophe
      keeps the preceding consonant hard.
    correct: true
    explanation: Він відділя́є при́голосний від йото́ваної голосно́ї. — It separates
      the consonant from the iotated vowel.
  - statement: Ї і́ноді мовчи́ть. — Ї is sometimes silent.
    correct: false
    explanation: Ї за́вжди чита́ємо як [йі]. — We always read ї as [йі].
  - statement: Свя́то ма́є апо́строф. — Свя́то has an apostrophe.
    correct: false
    explanation: Свя́то — моде́льне сло́во без апо́строфа. — Свя́то is a model word
      without an apostrophe.
- id: act-403
  type: fill-in
  title: Встав знак у ре́ченнях — Insert sign in sentences
  instruction: Ви́бери апо́строф, м'яки́й знак або́ зали́ш по́ле поро́жнім. — Choose
    apostrophe, soft sign, or leave the field blank.
  items:
  - sentence: Моє́ ім___я́ — Марко́.
    options:
    - ''''
    - ь
    - ''
    answer: ''''
    explanation: 'Пі́сля губно́го «м» пе́ред «я» пи́шемо апо́строф: ім''я́. — After
      labial «м» before «я» write an apostrophe: ім''я́.'
  - sentence: Бажа́ю міцно́го здоро́в___я!
    options:
    - ''''
    - ь
    - ''
    answer: ''''
    explanation: 'Пі́сля губно́го «в» пе́ред «я» пи́шемо апо́строф: здоро́в''я. —
      After labial «в» before «я» write an apostrophe: здоро́в''я.'
  - sentence: На поли́ці стої́ть нови́й комп___ю́тер.
    options:
    - ''''
    - ь
    - ''
    answer: ''''
    explanation: У сло́ві комп'ю́тер пи́шемо апо́строф пі́сля «п». — In комп'ю́тер
      an apostrophe is written after «п».
  - sentence: У стіні́ заби́тий метале́вий цв___ях.
    options:
    - ''
    - ''''
    - ь
    answer: ''
    explanation: 'Пі́сля корене́вого збі́гу «цв» апо́строф не пи́шемо: цвях. — After
      root cluster «цв» no apostrophe is written: цвях.'
  - sentence: У го́роді ви́ріс вели́кий бур___я́н.
    options:
    - ''''
    - ь
    - ''
    answer: ''''
    explanation: 'Пі́сля твердо́го «р» пе́ред «я» пи́шемо апо́строф: бур''я́н. — After
      hard «р» before «я» write an apostrophe: бур''я́н.'
  - sentence: У борщі́ є черво́ний бур___я́к.
    options:
    - ''
    - ''''
    - ь
    answer: ''
    explanation: 'Пі́сля м''яко́го «р» апо́строф не пи́шемо: буря́к. — After soft
      «р» no apostrophe is written: буря́к.'
- id: act-404
  type: match-up
  title: Слова́ та ї́хнє зна́чення — Words and their meanings
  instruction: З'єдна́й украї́нське сло́во з йо́го зна́ченням. — Match the Ukrainian
    word with its meaning.
  pairs:
  - left: сім'я́
    right: family
  - left: м'я́со
    right: meat
  - left: де́в'ять
    right: nine
  - left: ім'я́
    right: name
  - left: здоро́в'я
    right: health
  - left: дерев'я́ний
    right: wooden
- id: act-405
  type: odd-one-out
  title: Знайди́ за́йве сло́во — Find the odd word
  instruction: Обери́ сло́во, яке́ відрізня́ється за ная́вністю або́ відсу́тністю
    апо́строфа. — Choose the word that differs by the presence or absence of an apostrophe.
  items:
  - words:
    - сім'я́
    - м'я́со
    - п'ять
    - свя́то
    answer: свя́то
    explanation: Свя́то пи́шеться без апо́строфа, тоді́ як і́нші три сло́ва ма́ють
      апо́строф. — Свя́то is written without an apostrophe, while the other three
      words have an apostrophe.
  - words:
    - буря́к
    - цвях
    - свя́то
    - бур'я́н
    answer: бур'я́н
    explanation: Бур'я́н пи́шеться з апо́строфом, а ре́шта слів — без апо́строфа.
      — Бур'я́н is written with an apostrophe, whereas the remaining words are without
      an apostrophe.
  - words:
    - ім'я́
    - де́в'ять
    - здоро́в'я
    - ло́жка
    answer: ло́жка
    explanation: Ло́жка не ма́є апо́строфа, а і́нші сло́ва ма́ють апо́строф. — Ло́жка
      has no apostrophe, while the other words have an apostrophe.
  - words:
    - комп'ю́тер
    - дерев'я́ний
    - Мар'я́на
    - буря́к
    answer: буря́к
    explanation: Буря́к не ма́є апо́строфа, а в і́нших слова́х є апо́строф. — Буря́к
      has no apostrophe, while the other words have an apostrophe.
  - words:
    - свя́то
    - цвях
    - буря́к
    - м'я́со
    answer: м'я́со
    explanation: М'я́со ма́є апо́строф пі́сля «м», і́нші сло́ва — без апо́строфа.
      — М'я́со has an apostrophe after «м», the other words are without an apostrophe.
  - words:
    - сім'я́
    - бур'я́н
    - п'ять
    - цвях
    answer: цвях
    explanation: Цвях пи́шеться без апо́строфа че́рез збіг «цв», і́нші сло́ва — з
      апо́строфом. — Цвях is written without an apostrophe due to the cluster «цв»,
      the other words have an apostrophe.
