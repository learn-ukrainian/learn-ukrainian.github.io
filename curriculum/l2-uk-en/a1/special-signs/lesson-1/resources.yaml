- title: Украї́нський право́пис (2019), § 26–27. Бу́ква Ь
  url: https://2019.pravopys.net/sections/26/
  source: Украї́нський право́пис 2019
  notes: Пра́вила вжива́ння м'яко́го зна́ка пі́сля букв д, т, з, с, дз, ц, л, н та відсу́тність
    м'яко́го зна́ка пі́сля шипля́чих.
- title: Авра́менко О. Украї́нська мо́ва. 5 клас (2022), § 54–55, с. 124–127
  chunk_id: 5-klas-ukrmova-avramenko-2022_s0127
  source: 5-klas-ukrmova-avramenko-2022
  notes: Позна́чення м'я́кості при́голосних на письмі́. Вжива́ння м'яко́го зна́ка та африка́ти.
- title: 'Строкаль О. Суча́сна украї́нська літерату́рна мо́ва: Орфогра́фія (2021), § 5,
    с. 28'
  chunk_id: uni-ukrmova-orthography-strokal-2021_s0047
  source: uni-ukrmova-orthography-strokal-2021
  notes: Позна́чення м'я́кості при́голосних та відсу́тність м'яко́го зна́ка пі́сля шипля́чих.
