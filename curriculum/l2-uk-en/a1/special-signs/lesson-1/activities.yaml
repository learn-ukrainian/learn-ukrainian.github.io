inline:
- id: act-1
  type: quiz
  title: М'я́ко чи розді́льно
  instruction: Обери́ поя́снення для чита́ння.
  items:
  - prompt: Буря́к — що відбу́вається пе́ред лі́терою я?
    options:
    - text: Р пом'я́кшується пе́ред я.
      correct: true
    - text: Є апо́строф.
      correct: false
    - text: Ї за́вжди [йі].
      correct: false
    explanation: У сло́ві буря́к нема́є апо́строфа; р пом'я́кшується пе́ред я.
  - prompt: Бур'я́н — що ро́бить апо́строф?
    options:
    - text: Р зника́є.
      correct: false
    - text: Р залиша́ється тверди́м, по́тім чу́ти [йа].
      correct: true
    - text: Додає́ звук [і].
      correct: false
    explanation: Апо́строф відділя́є р від я.
  - prompt: Ї — що за́вжди пра́вильно?
    options:
    - text: Мовчи́ть.
      correct: false
    - text: Це м'яки́й знак.
      correct: false
    - text: За́вжди [йі].
      correct: true
    explanation: Ї за́вжди познача́є [йі].
- id: act-2
  type: match-up
  title: Що ро́бить ь
  instruction: З'єдна́й ко́жне сло́во з підка́зкою про м'яки́й знак.
  pairs:
  - left: день
    right: м'яки́й н у сло́ві день
  - left: кінь
    right: м'яки́й н у сло́ві кінь
  - left: сіль
    right: м'яки́й л у сло́ві сіль
  - left: вчи́тель
    right: м'яки́й л у сло́ві вчи́тель
  - left: м'яки́й знак
    right: не ма́є вла́сного зву́ка
- id: act-101
  type: match-up
  title: Тверди́й чи м'яки́й звук
  instruction: З'єдна́й ко́жне сло́во з о́писом кінце́вого зву́ка.
  pairs:
  - left: стань
    right: сло́во з м'яки́м зву́ком [н']
  - left: стан
    right: сло́во з тверди́м зву́ком [н]
  - left: лань
    right: сло́во з м'яки́м зву́ком [н'] у сло́ві лань
  - left: лан
    right: сло́во з тверди́м зву́ком [н] у сло́ві лан
  - left: рись
    right: сло́во з м'яки́м зву́ком [с']
  - left: рис
    right: сло́во з тверди́м зву́ком [с]
- id: act-3
  type: fill-in
  title: Дода́й знак
  instruction: Обери́ ь, апо́строф або́ без зна́ка.
  items:
  - sentence: сім_я
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: ден_
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
  - sentence: п_ять
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: У сло́ві свя́то пра́вильний ви́бір — ____.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
- id: act-102
  type: quiz
  title: При́голосний пе́ред апостро́фом
  instruction: Обери́ пра́вильну ві́дповідь про роль апостро́фа.
  items:
  - prompt: Що ро́бить апо́строф у сло́ві сім'я́?
    options:
    - text: Зберіга́є м тверди́м і відокре́млює я.
      correct: true
    - text: Пом'я́кшує лі́теру м.
      correct: false
    - text: Додає́ звук [і].
      correct: false
    explanation: Апо́строф зберіга́є при́голосний тверди́м пе́ред йото́ваною голосно́ю.
  - prompt: Як чита́ємо сло́во м'я́со?
    options:
    - text: З тверди́м [м] та початко́вим [йа].
      correct: true
    - text: З м'яки́м [м'].
      correct: false
    - text: Як одне́ злите́ [ма].
      correct: false
    explanation: Апо́строф пока́зує тверди́й звук [м] і розді́льне [йа].
  - prompt: Я́ка лі́тера стої́ть пе́ред апостро́фом у сло́ві п'ять?
    options:
    - text: Губна́ лі́тера п.
      correct: true
    - text: Лі́тера л.
      correct: false
    - text: Лі́тера н.
      correct: false
    explanation: Лі́тера п — одна́ з губни́х букв (б, п, в, м, ф).
  - prompt: Що чу́ти пі́сля апостро́фа пе́ред лі́терою ю в сло́ві комп'ю́тер?
    options:
    - text: Звукосполу́чення [йу].
      correct: true
    - text: Прости́й звук [у] без [й].
      correct: false
    - text: Звук [і].
      correct: false
    explanation: Пі́сля апостро́фа ю за́вжди познача́є [йу].
  - prompt: У сло́ві де́в'ять пі́сля яко́ї лі́тери стої́ть апо́строф?
    options:
    - text: Пі́сля лі́тери в.
      correct: true
    - text: Пі́сля лі́тери д.
      correct: false
    - text: Пі́сля лі́тери я.
      correct: false
    explanation: Апо́строф стої́ть пі́сля губно́ї лі́тери в пе́ред я.
  - prompt: Чи ро́бить апо́строф вели́ку па́узу у вимо́ві?
    options:
    - text: Ні, ви́дих трива́є, але́ при́голосний не пом'я́кшується.
      correct: true
    - text: Так, тре́ба зупини́ти ди́хання на кі́лька секу́нд.
      correct: false
    - text: Так, це знак кінця́ ре́чення.
      correct: false
    explanation: Апо́строф — це інстру́кція для вимо́ви, а не до́вга па́уза.
workbook:
- id: act-w1
  type: group-sort
  title: Сорту́й за зна́ком
  instruction: Розпо́діли ко́жне сло́во в пра́вильну гру́пу.
  groups:
  - label: Є ь
    items:
    - день
    - кінь
    - сіль
    - вчи́тель
    - мале́нький
  - label: Є апо́строф
    items:
    - сім'я́
    - м'я́со
    - п'ять
    - комп'ю́тер
    - бур'я́н
  - label: Нема́є зна́ка
    items:
    - буря́к
    - свя́то
    - цвях
    - ло́жка
- id: act-w2
  type: match-up
  title: Поясни́ контра́ст
  instruction: З'єдна́й сло́во з поя́сненням.
  pairs:
  - left: буря́к
    right: 'м''я́кість без апо́строфа: р + я'
  - left: бур'я́н
    right: 'апо́строф: р тверди́й, по́тім [йа]'
  - left: свя́то
    right: збіг св + я без апо́строфа
  - left: цвях
    right: збіг цв + я без апо́строфа
- id: act-w101
  type: fill-in
  title: Встав знак у знайо́мих слова́х
  instruction: Ви́бери ь, апо́строф або́ без зна́ка.
  items:
  - sentence: Сього́дні га́рний ден___.
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
  - sentence: Це моя́ рі́дна сім___я.
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: На столі́ лежи́ть сві́же м___я́со.
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: У кла́сі працю́є нови́й вчител___.
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
  - sentence: У кімна́ті стої́ть комп___ютер.
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
  - sentence: На лу́зі пасе́ться бі́лий кін___.
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
- id: act-w102
  type: true-false
  title: Пра́вила вимо́ви зна́ків
  instruction: 'Обери́: пра́вда чи непра́вда.'
  items:
  - statement: М'яки́й знак ма́є вла́сний голосни́й звук.
    correct: false
    explanation: М'яки́й знак не ма́є вла́сного зву́ка.
  - statement: У сло́ві день кінце́вий звук [н'] є м'яки́м.
    correct: true
    explanation: Бу́ква ь пока́зує м'я́кість [н'].
  - statement: Апо́строф пом'я́кшує попере́дній при́голосний.
    correct: false
    explanation: Апо́строф зберіга́є при́голосний тверди́м.
  - statement: Пі́сля апостро́фа лі́тери я, ю, є познача́ють два зву́ки з [й].
    correct: true
    explanation: Пі́сля апостро́фа чу́ти [йа], [йу], [йе].
  - statement: У сло́ві сіль бу́ква ь пом'я́кшує звук [л'].
    correct: true
    explanation: Ь вка́зує на м'я́кість [л'].
  - statement: Сло́во вчи́тель чита́ється з тверди́м [л] у кінці́.
    correct: false
    explanation: У сло́ві вчи́тель звук [л'] м'яки́й.
- id: act-w103
  type: odd-one-out
  title: За́йве сло́во за зна́ком
  instruction: Обери́ сло́во, яке́ відрізня́ється від і́нших ная́вністю зна́ка.
  items:
  - words:
    - день
    - кінь
    - сіль
    - м'я́со
    answer: м'я́со
    explanation: М'я́со ма́є апо́строф, а і́нші — м'яки́й знак.
  - words:
    - сім'я́
    - п'ять
    - ім'я́
    - вчи́тель
    answer: вчи́тель
    explanation: Вчи́тель ма́є м'яки́й знак, а і́нші — апо́строф.
  - words:
    - де́в'ять
    - м'я́со
    - комп'ю́тер
    - кінь
    answer: кінь
    explanation: Кінь ма́є м'яки́й знак, а і́нші — апо́строф.
  - words:
    - день
    - сіль
    - вчи́тель
    - п'ять
    answer: п'ять
    explanation: П'ять ма́є апо́строф пе́ред я, а і́нші слова́ ма́ють м'яки́й знак.
  - words:
    - сім'я́
    - де́в'ять
    - м'я́со
    - стан
    answer: стан
    explanation: Стан не ма́є жо́дного зна́ка, а і́нші слова́ ма́ють апо́строф.
  - words:
    - кінь
    - день
    - сіль
    - рис
    answer: рис
    explanation: Рис не ма́є м'яко́го зна́ка, а і́нші слова́ ма́ють ь.
- id: act-w104
  type: match-up
  title: З'єдна́й сло́во та пере́клад
  instruction: З'єдна́й украї́нське сло́во з йо́го зна́ченням.
  pairs:
  - left: день
    right: day
  - left: кінь
    right: horse
  - left: сіль
    right: salt
  - left: вчи́тель
    right: teacher
  - left: сім'я́
    right: family
  - left: м'я́со
    right: meat
- id: act-w105
  type: group-sort
  title: Розпо́діл слів за зна́ком
  instruction: 'Розпо́діли сло́ва на дві гру́пи: слова́ з ь та слова́ з апостро́фом.'
  groups:
  - label: Сло́ва з м'яки́м зна́ком (ь)
    items:
    - день
    - кінь
    - сіль
    - вчи́тель
  - label: Сло́ва з апостро́фом (')
    items:
    - сім'я́
    - м'я́со
    - п'ять
    - комп'ю́тер
    - де́в'ять
    - ім'я́
