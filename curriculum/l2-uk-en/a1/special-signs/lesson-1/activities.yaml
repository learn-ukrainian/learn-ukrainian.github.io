inline:
- id: act-2
  type: match-up
  title: Що ро́бить ь
  instruction: З'єдна́й ко́жне сло́во з підка́зкою про м'яки́й знак.
  pairs:
  - left: день
    right: soft [n'] in «день»
  - left: кінь
    right: soft [n'] in «кінь»
  - left: сіль
    right: soft [l'] in «сіль»
  - left: вчи́тель
    right: soft [l'] in «вчи́тель»
  - left: ь (soft sign)
    right: has no sound of its own
- id: act-l1-1
  type: quiz
  title: Впізна́й м'яки́й знак — Recognize the soft sign
  instruction: Обери́ пра́вильне тве́рдження про звук чи лі́теру. — Choose the correct
    statement about the sound or letter.
  items:
  - prompt: Що ро́бить м'яки́й знак (ь)? — What does the soft sign (ь) do?
    options:
    - text: Пом'я́кшує попере́дній при́голосний. — Softens the preceding consonant.
      correct: true
    - text: Познача́є окре́мий звук [і]. — Represents a separate sound [і].
      correct: false
    - text: Ро́бить звук тверди́м. — Makes the sound hard.
      correct: false
    explanation: М'яки́й знак не ма́є вла́сного зву́ка; він лише́ пом'я́кшує попере́дній
      при́голосний.
  - prompt: Сло́во «день» — як звучи́ть оста́нній звук? — The word «день» — how does
      the last sound sound?
    options:
    - text: М'яки́й [н']. — Soft [н'].
      correct: true
    - text: Тверди́й [н]. — Hard [н].
      correct: false
    - text: Окре́мий звук [і]. — Separate sound [і].
      correct: false
    explanation: 'У сло́ві «день» стої́ть ь, тому́ оста́нній при́голосний звучи́ть
      м''я́ко: [н''].'
  - prompt: Сло́во «сіль» — як звучи́ть оста́нній звук? — The word «сіль» — how does
      the last sound sound?
    options:
    - text: М'яки́й [л']. — Soft [л'].
      correct: true
    - text: Тверди́й [л]. — Hard [л].
      correct: false
    - text: Звук [й]. — Sound [й].
      correct: false
    explanation: У сло́ві «сіль» бу́ква ь ро́бить звук [л'] м'яки́м.
  - prompt: Чи ма́є м'яки́й знак вла́сний звук? — Does the soft sign have its own
      sound?
    options:
    - text: Ні, він не ма́є зву́ка. — No, it has no sound.
      correct: true
    - text: Так, це звук [і]. — Yes, it is the sound [і].
      correct: false
    - text: Так, це звук [й]. — Yes, it is the sound [й].
      correct: false
    explanation: М'яки́й знак — це грамати́чний знак без вла́сного зву́ка.
  - prompt: Чим відрізня́ються слова́ «стан» і «стань»? — How do the words «стан»
      and «стань» differ?
    options:
    - text: Тверди́й [н] про́ти м'яко́го [н']. — Hard [н] versus soft [н'].
      correct: true
    - text: Додає́ться нови́й голосни́й звук. — A new vowel sound is added.
      correct: false
    - text: Звук [с] стає́ м'яки́м. — Sound [с] becomes soft.
      correct: false
    explanation: Бу́ква ь у сло́ві «стань» пом'я́кшує кінце́вий при́голосний [н'].
  - prompt: Чим відрізня́ються слова́ «рис» і «рись»? — How do the words «рис» and
      «рись» differ?
    options:
    - text: Тверди́й [с] про́ти м'яко́го [с']. — Hard [с] versus soft [с'].
      correct: true
    - text: Вони́ звуча́ть одна́ково. — They sound the same.
      correct: false
    - text: З'явля́ється звук [й]. — Sound [й] appears.
      correct: false
    explanation: У сло́ві «рис» звук [с] тверди́й, а в сло́ві «рись» — м'яки́й [с'].
- id: act-l1-2
  type: fill-in
  title: Обери́ ь або́ без зна́ка — Choose ь or no sign
  instruction: Обери́ ь або́ без зна́ка. — Choose ь or no sign.
  items:
  - sentence: па́лец___
    options:
    - ь
    - ''
    answer: ь
    explanation: У сло́ві «па́лець» наприкінці́ пи́шемо м'яки́й знак пі́сля ц.
  - sentence: ніч___
    options:
    - ''
    - ь
    answer: ''
    explanation: 'Пі́сля шипля́чого [ч] у кінці́ слів м''яки́й знак не пи́шеться:
      «ніч».'
  - sentence: стіле́ц___
    options:
    - ь
    - ''
    answer: ь
    explanation: Африка́та [ц'] у сло́ві «стіле́ць» є м'яко́ю і потребу́є м'яко́го
      зна́ка.
  - sentence: ден___
    options:
    - ь
    - ''
    answer: ь
    explanation: У сло́ві «день» пи́шемо м'яки́й знак для позна́чення м'я́кості кінце́вого
      [н'].
  - sentence: со́нце___
    options:
    - ''
    - ь
    answer: ''
    explanation: У сло́ві «со́нце» звук [ц] тверди́й пе́ред е, м'яки́й знак не потрі́бен.
  - sentence: чи́ста те́мна ніч___
    options:
    - ''
    - ь
    answer: ''
    explanation: 'Пі́сля лі́тери ч м''яки́й знак не ста́вимо: «ніч».'
- id: act-l1-3
  type: match-up
  title: 'Зву́ки та бу́кви: Ц та Ч — Sounds and letters: Ц and Ч'
  instruction: З'єдна́й сло́во з о́писом зву́ка. — Match each word with its sound
    description.
  pairs:
  - left: па́лець
    right: soft [ts'] in unstressed ending (finger)
  - left: стіле́ць
    right: soft [ts'] in stressed ending (chair)
  - left: со́нце
    right: hard [ts] in the middle before vowel [e] (sun)
  - left: ніч
    right: hard sibilant [ch] at word end without soft sign (night)
  - left: ча́шка
    right: hard sibilant [ch] in two syllables before -шка (cup)
  - left: чай
    right: hard sibilant [ch] in one syllable ending in -й (tea)
- id: act-l1-4
  type: quiz
  title: 'Переві́рка африка́т: Ц чи Ч — Affricate check: Ц or Ч'
  instruction: Обери́ пра́вильну лі́теру для сло́ва. — Choose the correct letter for
    the word.
  items:
  - prompt: 'У сло́ві «...ай» пе́рша лі́тера — це: — In the word «...ай» the first
      letter is:'
    options:
    - text: Ч (чай) — letter Ч
      correct: true
    - text: Ц (цай) — letter Ц
      correct: false
    explanation: 'Украї́нське сло́во пи́шеться з лі́терою Ч: чай.'
  - prompt: 'У сло́ві «...у́кор» пе́рша лі́тера — це: — In the word «...у́кор» the
      first letter is:'
    options:
    - text: Ц (цу́кор) — letter Ц
      correct: true
    - text: Ч (чу́кор) — letter Ч
      correct: false
    explanation: 'Украї́нське сло́во пи́шеться з лі́терою Ц: цу́кор.'
  - prompt: 'У сло́ві «стіле́...» оста́ння лі́тера пере́д ь — це: — In the word «стіле́...»
      the last letter before ь is:'
    options:
    - text: ц (стіле́ць) — letter ц
      correct: true
    - text: ч (стіле́чь) — letter ч
      correct: false
    explanation: Прави́льна украї́нська фо́рма — стіле́ць.
  - prompt: Чи пи́шемо ь у кінці́ сло́ва «ніч»? — Do we write ь at the end of «ніч»?
    options:
    - text: Ні, пі́сля ч м'яки́й знак не пи́шемо. — No, soft sign is not written after
        ч.
      correct: true
    - text: Так, обов'язко́во пи́шемо ь. — Yes, ь is mandatory.
      correct: false
    explanation: В украї́нській мо́ві шипля́чі при́голосні не ма́ють м'яко́го зна́ка
      наприкінці́ слів.
  - prompt: 'У сло́ві «...а́шка» пе́рша лі́тера — це: — In the word «...а́шка» the
      first letter is:'
    options:
    - text: Ч (ча́шка) — letter Ч
      correct: true
    - text: Ц (ца́шка) — letter Ц
      correct: false
    explanation: Прави́льне украї́нське сло́во — ча́шка.
  - prompt: 'У сло́ві «па́ле...» оста́нній при́голосний пере́д ь — це: — In the word
      «па́ле...» the last consonant before ь is:'
    options:
    - text: ц (па́лець) — letter ц
      correct: true
    - text: ч (па́лечь) — letter ч
      correct: false
    explanation: Прави́льна украї́нська фо́рма — па́лець.
workbook:
- id: act-l1-w1
  type: group-sort
  title: 'Сортува́ння за зна́ком: Є ь чи Нема́є ь — Sort by sign: Has ь or No ь'
  instruction: Розподіли́ слова́ на дві гру́пи. — Sort the words into two groups.
  groups:
  - label: Є м'яки́й знак — Has soft sign
    items:
    - день
    - кінь
    - сіль
    - вчи́тель
    - па́лець
    - стіле́ць
  - label: Нема́є м'яко́го зна́ка — No soft sign
    items:
    - ніч
    - чай
    - цу́кор
    - ча́шка
    - со́нце
    - ло́жка
- id: act-l1-w2
  type: fill-in
  title: Обери́ ь або́ без зна́ка — Choose ь or no sign
  instruction: Обери́ ь або́ без зна́ка. — Choose ь or no sign.
  items:
  - sentence: Сього́дні те́плий ден___ .
    options:
    - ь
    - ''
    answer: ь
    explanation: Сло́во «день» пи́шеться з м'яки́м зна́ком на кінці́.
  - sentence: У комо́рі стої́ть бі́лий кін___ .
    options:
    - ь
    - ''
    answer: ь
    explanation: Сло́во «кінь» ма́є м'яки́й знак пі́сля н.
  - sentence: На столі́ бі́ла сіл___ .
    options:
    - ь
    - ''
    answer: ь
    explanation: Сло́во «сіль» ма́є м'яки́й знак пі́сля л.
  - sentence: Наста́ла те́мна ніч___ .
    options:
    - ''
    - ь
    answer: ''
    explanation: 'В украї́нській мо́ві пі́сля ч м''яки́й знак не пи́шемо: «ніч».'
  - sentence: Це мале́н___кий па́лець.
    options:
    - ь
    - ''
    answer: ь
    explanation: 'У су́фіксі -еньк- пи́шемо м''яки́й знак: «мале́нький».'
  - sentence: На столі́ лежи́ть л___ожка.
    options:
    - ''
    - ь
    answer: ''
    explanation: У сло́ві «ло́жка» пі́сля л нема́є м'яко́го зна́ка; [л] тверди́й.
- id: act-l1-w3
  type: match-up
  title: З'єдна́й па́ри протиле́жностей — Match contrast pairs
  instruction: З'єдна́й тверди́й при́голосний із м'яки́м ана́логом. — Match the hard
    consonant with its soft counterpart.
  pairs:
  - left: стан (hard н)
    right: стань (soft нь)
  - left: лан (hard н)
    right: лань (soft нь)
  - left: рис (hard с)
    right: рись (soft сь)
  - left: стіл (hard л)
    right: сіль (soft ль)
  - left: син (hard н)
    right: кінь (soft нь)
  - left: брат (hard т)
    right: мить (soft ть)
- id: act-l1-w4
  type: error-correction
  title: Знайди́ та ви́прав поми́лку — Find and fix the error
  instruction: Обери́ пра́вильну украї́нську фо́рму для ви́діленого сло́ва. — Choose
    the correct Ukrainian form for the marked word.
  items:
  - sentence: Сього́дні ду́же га́рний ден.
    error: ден
    correction: день
    options:
    - день
    - дєнь
    - дьень
    explanation: 'The word «день» requires a soft sign at the end: день.'
  - sentence: У кімна́ті стої́ть дерев'я́ний стілеч.
    error: стілеч
    correction: стіле́ць
    options:
    - стіле́ць
    - стілец
    - стілєць
    explanation: The correct noun is «стіле́ць» with ц and a soft sign.
  - sentence: На столі́ лежи́ть вели́ка льо́жка.
    error: льо́жка
    correction: ло́жка
    options:
    - ло́жка
    - льо́шка
    - лю́жка
    explanation: The Ukrainian word is «ло́жка» with hard л and no soft sign.
  - sentence: У лі́сі біжи́ть ди́ка рис.
    error: рис
    correction: рись
    options:
    - рись
    - рісь
    - рєсь
    explanation: The lynx is «рись» with a soft sign, unlike «рис» (rice).
  - sentence: Надво́рі ти́ха те́мна нічь.
    error: нічь
    correction: ніч
    options:
    - ніч
    - неч
    - нич
    explanation: 'In Ukrainian, sibilant ч never takes a soft sign at the end: ніч.'
  - sentence: Це мій вели́кий палец.
    error: палец
    correction: па́лець
    options:
    - па́лець
    - па́лєць
    - па́ліць
    explanation: 'The word «па́лець» ends in soft ц with ь: па́лець.'
- id: act-l1-w5
  type: true-false
  title: Фа́кти про м'яки́й знак та африка́ти — Facts about soft sign and affricates
  instruction: 'Обери́: пра́вда чи непра́вда. — Choose: true or false.'
  items:
  - statement: М'яки́й знак (ь) ма́є вла́сний голосни́й звук. — The soft sign (ь)
      has its own vowel sound.
    correct: false
    explanation: М'яки́й знак не ма́є вла́сного зву́ка; він лише́ пом'я́кшує попере́дній
      при́голосний.
  - statement: У сло́ві «день» оста́нній звук — м'яки́й [н']. — In the word «день»,
      the last sound is soft [н'].
    correct: true
    explanation: Бу́ква ь познача́є м'я́кість зву́ка [н'].
  - statement: В украї́нській мо́ві пі́сля шипля́чого [ч] у кінці́ слів пи́шемо ь.
      — In Ukrainian, after sibilant [ч] at the end of words we write ь.
    correct: false
    explanation: 'Пі́сля шипля́чих (ж, ч, ш, щ) м''яки́й знак в украї́нській мо́ві
      не пи́шеться: «ніч», «ключ».'
  - statement: У сло́ві «па́лець» наприкінці́ пи́шемо м'яки́й знак пі́сля ц. — In
      the word «па́лець», at the end we write a soft sign after ц.
    correct: true
    explanation: Африка́та [ц'] мо́же бу́ти м'яко́ю і потребу́є м'яко́го зна́ка.
  - statement: Слова́ «стан» і «стань» ма́ють одна́кове зна́чення. — The words «стан»
      and «стань» have the same meaning.
    correct: false
    explanation: «Стан» (condition) і «стань» (become/stand) — це рі́зні слова́ з
      тверди́м та м'яки́м [н].
  - statement: У сло́ві «со́нце» звук [ц] є тверди́м. — In the word «со́нце», the
      sound [ц] is hard.
    correct: true
    explanation: 'Пе́ред бу́квою е звук [ц] звучи́ть тве́рдо: [со́нце].'
- id: act-l1-w6
  type: translate
  title: 'Пере́клад ре́чень: м''яки́й знак та африка́ти — Translation of sentences:
    soft sign and affricates'
  instruction: Обери́ пра́вильний украї́нський пере́клад. — Choose the correct Ukrainian
    translation.
  items:
  - source: Today is a warm day.
    options:
    - text: Сього́дні те́плий день.
      correct: true
    - text: Сього́дні те́плий ден.
      correct: false
    - text: Сього́дні бі́лий кінь.
      correct: false
    explanation: «Day» is «день» with a soft sign at the end.
  - source: This is a white horse.
    options:
    - text: Це бі́лий кінь.
      correct: true
    - text: Це бі́лий кін.
      correct: false
    - text: Це бі́лий стіл.
      correct: false
    explanation: «Horse» is «кінь» with soft [н'].
  - source: Where is our teacher?
    options:
    - text: Де наш вчи́тель?
      correct: true
    - text: Де наш стіле́ць?
      correct: false
    - text: Де наш кінь?
      correct: false
    explanation: «Teacher» is «вчи́тель» with soft [л'].
  - source: This is hot tea.
    options:
    - text: Це гаря́чий чай.
      correct: true
    - text: Це гаря́чий цай.
      correct: false
    - text: Це бі́лий цу́кор.
      correct: false
    explanation: '«Tea» begins with the letter Ч: чай.'
  - source: It is a quiet night outside.
    options:
    - text: На дворі́ ти́ха ніч.
      correct: true
    - text: На дворі́ ти́ха нічь.
      correct: false
    - text: На дворі́ те́плий день.
      correct: false
    explanation: In Ukrainian, «ніч» ends with hard sibilant [ч] and has no soft sign.
  - source: Here is a wooden chair.
    options:
    - text: Ось дерев'я́ний стіле́ць.
      correct: true
    - text: Ось дерев'я́ний стілеч.
      correct: false
    - text: Ось мале́нька ло́жка.
      correct: false
    explanation: «Chair» is «стіле́ць» ending in letter ц with a soft sign.
