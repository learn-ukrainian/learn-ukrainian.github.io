- id: act-w4
  type: true-false
  title: Фа́кти про зна́ки
  instruction: 'Обери́: пра́вда чи непра́вда.'
  items:
  - statement: Ь не ма́є вла́сного зву́ка.
    correct: true
    explanation: Він пом'я́кшує попере́дній при́голосний.
  - statement: Апо́строф трима́є попере́дній при́голосний тверди́м.
    correct: true
    explanation: Він відділя́є при́голосний від йото́ваної голосно́ї.
  - statement: Ї і́ноді мовчи́ть.
    correct: false
    explanation: Ї за́вжди чита́ємо як [йі].
  - statement: Свя́то ма́є апо́строф.
    correct: false
    explanation: Свя́то — моде́льне сло́во без апо́строфа.
- id: act-w201
  type: group-sort
  title: Розпо́діли за озна́кою зна́ка
  instruction: Розпо́діли слова́ на три гру́пи відпові́дно до написа́ння.
  groups:
  - label: З м'яки́м зна́ком
    items:
    - день
    - кінь
    - сіль
    - па́льці
  - label: З апостро́фом
    items:
    - бур'я́н
    - Мар'я́на
    - дерев'я́ний
    - здоро́в'я
  - label: Без зна́ка
    items:
    - буря́к
    - свя́то
    - цвях
    - ло́жка
- id: act-w202
  type: divide-words
  title: Поді́ли слова́ для перено́су
  instruction: Обери́ пра́вильний по́діл сло́ва для перено́су з рядка́ в рядо́к.
  items:
  - word: Мар'я́на
    answer: Мар'-я́на
  - word: дерев'я́ний
    answer: дере́-в'яний
  - word: бур'я́н
    answer: бур'-ян
  - word: па́льці
    answer: паль-ці
  - word: мале́нький
    answer: ма-лень-кий
  - word: сього́дні
    answer: сьо-го́дні
- id: act-w203
  type: fill-in
  title: Дода́й пропу́щений знак
  instruction: Встав пра́вильний знак у по́даних ре́ченнях.
  items:
  - sentence: На го́роді росте́ соло́дкий бур_як.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
    explanation: Буря́к пи́шеться без апостро́фа.
  - sentence: Бі́ля ти́ну росте́ бур_ян.
    answer: ''''
    options:
    - ''''
    - без зна́ка
    - ь
    explanation: Бур'я́н пи́шеться з апостро́фом.
  - sentence: Мар_я́на чита́є нову́ кни́жку.
    answer: ''''
    options:
    - ''''
    - без зна́ка
    - ь
    explanation: Мар'я́на пи́шеться з апостро́фом.
  - sentence: На столі́ лежи́ть залі́зний цв_ях.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
    explanation: Цвях пи́шеться без апостро́фа.
  - sentence: Бажа́ю вам міцно́го здоро́в_я.
    answer: ''''
    options:
    - ''''
    - без зна́ка
    - ь
    explanation: Здоро́в'я пи́шеться з апостро́фом пі́сля в.
  - sentence: Ось мален_кий дерев'я́ний стіле́ць.
    answer: ь
    options:
    - ь
    - ''''
    - без зна́ка
    explanation: Мале́нький пи́шеться з м'яки́м зна́ком пі́сля н.
- id: act-w204
  type: match-up
  title: З'єдна́й сло́во та перено́с
  instruction: З'єдна́й по́вне сло́во з йо́го моде́ллю перено́су.
  pairs:
  - left: Мар'я́на
    right: Мар'-я́на
  - left: дерев'я́ний
    right: дере́-в'яний
  - left: бур'я́н
    right: бур'-ян
  - left: па́льці
    right: паль-ці
  - left: мале́нький
    right: ма-лень-кий
  - left: сього́дні
    right: сьо-го́дні
- id: act-w205
  type: unjumble
  title: Скла́ди ре́чення
  instruction: Розташу́й слова́ у пра́вильному поря́дку, щоб утвори́ти ре́чення.
  items:
  - words:
    - Сього́дні
    - весе́ле
    - свя́то.
    answer: Сього́дні весе́ле свя́то.
  - words:
    - Це
    - міцни́й
    - дерев'я́ний
    - стіл.
    answer: Це міцни́й дерев'я́ний стіл.
  - words:
    - Мар'я́на
    - готу́є
    - черво́ний
    - буря́к.
    answer: Мар'я́на готу́є черво́ний буря́к.
  - words:
    - На
    - столі́
    - лежи́ть
    - вели́ка
    - ло́жка.
    answer: На столі́ лежи́ть вели́ка ло́жка.
  - words:
    - Бажа́ю
    - вам
    - міцно́го
    - здоро́в'я.
    answer: Бажа́ю вам міцно́го здоро́в'я.
  - words:
    - Сього́дні
    - чудо́вий
    - і
    - те́плий
    - день.
    answer: Сього́дні чудо́вий і те́плий день.
