- id: act-209
  type: error-correction
  title: Знайді́ть поми́лку — Spot the error
  instruction: Find the spelling error in each sentence.
  items:
  - sentence: Вра́нці я пив чаі з лимо́ном. — In the morning I drank tea with lemon.
    error: чаі
    correction: чай
    explanation: 'Напівголосни́й звук [й] познача́ється лі́терою й: чай. — The semivowel sound [j] is written with letter й: чай.'
  - sentence: На столі́ лежи́ть смачне́ йа́блуко. — On the table lies a tasty apple.
    error: йа́блуко
    correction: я́блуко
    explanation: 'Сполу́ка зву́ків [йа] на поча́тку сло́ва познача́ється лі́терою я: я́блуко. — The sound blend [ja] at the word start is written with letter я: я́блуко.'
  - sentence: У тарі́лці те́пла йу́шка. — In the plate is warm broth.
    error: йу́шка
    correction: ю́шка
    explanation: 'Сполу́ка зву́ків [йу] на поча́тку сло́ва познача́ється лі́терою ю: ю́шка. — The sound blend [ju] at the word start is written with letter ю: ю́шка.'
  - sentence: У лі́сі живе́ смуга́стий йено́т. — In the forest lives a striped raccoon.
    error: йено́т
    correction: єно́т
    explanation: 'Сполу́ка зву́ків [йе] на поча́тку сло́ва познача́ється лі́терою є: єно́т. — The sound blend [je] at the word start is written with letter є: єно́т.'
  - sentence: На по́лі росте́ сокови́тий буряік. — In the field grows juicy beetroot.
    error: буряік
    correction: буря́к
    explanation: 'Сло́во «буря́к» пи́шеться з лі́терою я: буря́к. — The word «буря́к» is written with the letter я: буря́к.'
  - sentence: Сього́дні в мі́сті вели́ке свиа́то. — Today in town there is a big holiday.
    error: свиа́то
    correction: свя́то
    explanation: 'Сло́во «свя́то» пи́шеться з лі́терою я без апо́строфа: свя́то. — The word «свя́то» is written with letter я without an apostrophe: свя́то.'
- id: act-210
  type: quiz
  title: Ви́беріть пра́вильне сло́во — Multiple Choice
  instruction: Select the correct Ukrainian vocabulary word.
  items:
  - question: What is the Ukrainian word for “tea”?
    options:
    - чай
    - час
    - рис
    answer: чай
  - question: What is the Ukrainian word for “apple”?
    options:
    - я́блуко
    - ю́шка
    - єно́т
    answer: я́блуко
  - question: What is the Ukrainian word for “soup / broth”?
    options:
    - ю́шка
    - я́блуко
    - єно́т
    answer: ю́шка
  - question: What is the Ukrainian word for “raccoon”?
    options:
    - єно́т
    - кінь
    - лань
    answer: єно́т
  - question: What is the Ukrainian word for “beetroot”?
    options:
    - буря́к
    - я́блуко
    - свя́то
    answer: буря́к
  - question: What is the Ukrainian word for “holiday”?
    options:
    - свя́то
    - буря́к
    - день
    answer: свя́то
- id: act-211
  type: quiz
  title: Ви́бір лі́тери — Letter Choice
  instruction: Choose the appropriate letter for each word.
  items:
  - question: 'Пе́рша лі́тера у сло́ві «___блуко»: — First letter in «___блуко» (apple):'
    options:
    - Я
    - Й
    answer: Я
  - question: 'Пе́рша лі́тера у сло́ві «___шка»: — First letter in «___шка» (soup):'
    options:
    - Ю
    - Й
    answer: Ю
  - question: 'Пе́рша лі́тера у сло́ві «___но́т»: — First letter in «___но́т» (raccoon):'
    options:
    - Є
    - Й
    answer: Є
  - question: 'Оста́ння лі́тера у сло́ві «ча___»: — Last letter in «ча___» (tea):'
    options:
    - й
    - і
    answer: й
  - question: 'Лі́тера пі́сля «р» у сло́ві «бур___к»: — Letter after «р» in «бур___к» (beetroot):'
    options:
    - я
    - і
    answer: я
  - question: 'Лі́тера пі́сля «в» у сло́ві «св___то»: — Letter after «в» in «св___то» (holiday):'
    options:
    - я
    - і
    answer: я
