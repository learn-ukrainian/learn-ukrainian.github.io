inline:
- id: act-4
  type: error-correction
  title: Ви́прав пастки́
  instruction: Обери́ пра́вильну украї́нську фо́рму.
  items:
  - sentence: Не пиши́ сімя без апо́строфа.
    error: сімя
    correction: сім'я́
    options:
    - сім'я́
    - сімя
    explanation: У сло́ві сім'я́ потрі́бен апо́строф.
  - sentence: День — не пиши́ ден.
    error: ден
    correction: день
    options:
    - день
    - ден
    explanation: День потребу́є м'яко́го зна́ка.
  - sentence: Не пиши́ св'ято з апо́строфом.
    error: св'ято
    correction: свя́то
    options:
    - свя́то
    - св'ято
    explanation: У сло́ві свя́то нема́є апо́строфа.
  - sentence: Не пиши́ льожка з ви́гаданим м'яки́м зна́ком.
    error: льожка
    correction: ло́жка
    options:
    - ло́жка
    - льожка
    explanation: Ло́жка не ма́є м'яко́го зна́ка пі́сля л.
- id: act-201
  type: match-up
  title: Чому́ таки́й знак
  instruction: З'єдна́й ко́жне сло́во з поя́сненням йо́го написа́ння.
  pairs:
  - left: буря́к
    right: р пом'я́кшується пе́ред я без зна́ка
  - left: бур'я́н
    right: апостро́ф зберіга́є р тверди́м пе́ред я
  - left: свя́то
    right: збіг при́голосних св пе́ред я без апостро́фа
  - left: цвях
    right: збіг при́голосних цв пе́ред я без апостро́фа
  - left: день
    right: м'яки́й знак пока́зує м'я́кість кінце́вого н
  - left: ло́жка
    right: тверди́й звук л без м'яко́го зна́ка
- id: act-202
  type: quiz
  title: Обери́ пра́вильне пра́вило
  instruction: Ви́знач, яке́ фонети́чне пра́вило ді́є у ко́жному сло́ві.
  items:
  - prompt: Чому́ в сло́ві буря́к нема́є апостро́фа?
    options:
    - text: Бо звук [р'] м'яки́й пе́ред я.
      correct: true
    - text: Бо пі́сля р за́вжди пи́шеться м'яки́й знак.
      correct: false
    - text: Бо це інозе́мне сло́во.
      correct: false
    explanation: У сло́ві буря́к звук [р'] є м'яки́м, тому́ апостро́ф не ста́виться.
  - prompt: Що ро́бить апостро́ф у сло́ві бур'я́н?
    options:
    - text: Зберіга́є р тверди́м, пі́сля чого́ чу́ти [йа].
      correct: true
    - text: Пом'я́кшує бу́кву р.
      correct: false
    - text: Ро́бить па́узу між скла́дами.
      correct: false
    explanation: Апостро́ф не пом'я́кшує при́голосний, а розділя́є тверди́й р та йото́ваний
      [йа].
  - prompt: Чому́ в сло́ві свя́то не пи́шемо апостро́ф?
    options:
    - text: Че́рез збіг двох при́голосних пе́ред я.
      correct: true
    - text: Бо я тут познача́є звук [а].
      correct: false
    - text: Бо в сло́ві є м'яки́й знак.
      correct: false
    explanation: Пе́ред губни́м стої́ть і́нший корене́вий при́голосний (збіг св).
  - prompt: Чому́ сло́во цвях пи́шеться без зна́ка?
    options:
    - text: Че́рез збіг двох при́голосних цв пе́ред я.
      correct: true
    - text: Бо цвях — це ви́няток з апостро́фом.
      correct: false
    - text: Бо звук [ц] за́вжди м'яки́й.
      correct: false
    explanation: Збіг при́голосних цв не потребу́є розді́льного зна́ка.
  - prompt: Я́ка поми́лка є типо́вою для сло́ва ло́жка?
    options:
    - text: Вставля́ння ви́гаданого м'яко́го зна́ка пі́сля л.
      correct: true
    - text: Написа́ння апостро́фа пі́сля ж.
      correct: false
    - text: Про́пуск лі́тери о.
      correct: false
    explanation: У сло́ві ло́жка звук [л] тверди́й, м'яки́й знак не потрі́бен.
  - prompt: Я́ка роль м'яко́го зна́ка в сло́ві день?
    options:
    - text: Пом'я́кшує кінце́вий звук н.
      correct: true
    - text: Додає́ додатко́вий голосни́й звук.
      correct: false
    - text: Розділя́є зву́ки як апостро́ф.
      correct: false
    explanation: М'яки́й знак не ма́є вла́сного зву́ка і пом'я́кшує попере́дній звук н.
- id: act-5
  type: divide-words
  title: Пра́ктика перено́су слів
  instruction: Обери́ підгото́влену моде́ль перено́су.
  items:
  - word: Мар'я́на
    answer: Мар'-я́на
  - word: дерев'я́ний
    answer: дере́-в'яний
  - word: бур'я́н
    answer: бур'-ян
  - word: па́льці
    answer: паль-ці
- id: act-203
  type: fill-in
  title: Встав знак або́ зали́ш про́пуск
  instruction: Обери́ ь, апостро́ф або́ без зна́ка.
  items:
  - sentence: Сві́жий бур_як росте́ на го́роді.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
    explanation: Буря́к пи́шеться без зна́ка.
  - sentence: На по́лі ви́ріс зеле́ний бур_ян.
    answer: ''''
    options:
    - ''''
    - без зна́ка
    - ь
    explanation: Бур'я́н потребу́є апостро́фа пі́сля р.
  - sentence: Сього́дні в на́шій роди́ні вели́ке св_ято.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
    explanation: Свя́то пи́шеться без апостро́фа.
  - sentence: У дерев'я́ну до́шку вби́то залі́зний цв_ях.
    answer: без зна́ка
    options:
    - без зна́ка
    - ''''
    - ь
    explanation: Цвях пи́шеться без зна́ка.
  - sentence: У моє́ї по́други Мар_я́ни га́рне ім'я́.
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
    explanation: Мар'я́на потребу́є апостро́фа пі́сля р.
  - sentence: У кімна́ті стої́ть міцни́й дере́в_яний стіл.
    answer: ''''
    options:
    - ''''
    - ь
    - без зна́ка
    explanation: Дерев'я́ний пи́шеться з апостро́фом пі́сля в.
