- id: act-209
  type: error-correction
  title: Знайді́ть поми́лку — Spot the error
  instruction: Знайді́ть орфографі́чну поми́лку в ко́жному ре́ченні. — Find the spelling error in each
    sentence.
  items:
  - sentence: Вра́нці я пив чаі з лимо́ном. — In the morning I drank tea with lemon.
    error: чаі
    correction: чай
    options:
    - чай
    - чаі
    - чаї
    explanation: 'Напівголосни́й звук [й] познача́ється лі́терою й: чай. — The semivowel sound [j] is
      written with letter й: чай.'
  - sentence: На столі́ лежи́ть смачне́ йа́блуко. — A tasty apple is on the table.
    error: йа́блуко
    correction: я́блуко
    options:
    - я́блуко
    - йа́блуко
    - а́блуко
    explanation: 'Сполу́ка зву́ків [йа] на поча́тку сло́ва познача́ється лі́терою я: я́блуко. — The sound
      blend [ja] at the word start is written with letter я: я́блуко.'
  - sentence: У тарі́лці те́пла йу́шка. — There is warm soup in the bowl.
    error: йу́шка
    correction: ю́шка
    options:
    - ю́шка
    - йу́шка
    - у́шка
    explanation: 'Сполу́ка зву́ків [йу] на поча́тку сло́ва познача́ється лі́терою ю: ю́шка. — The sound
      blend [ju] at the word start is written with letter ю: ю́шка.'
  - sentence: У лі́сі живе́ смуга́стий йено́т. — A striped raccoon lives in the forest.
    error: йено́т
    correction: єно́т
    options:
    - єно́т
    - йено́т
    - ено́т
    explanation: 'Сполу́ка зву́ків [йе] на поча́тку сло́ва познача́ється лі́терою є: єно́т. — The sound
      blend [je] at the word start is written with letter є: єно́т.'
  - sentence: На по́лі росте́ сокови́тий буряік. — A juicy beet grows in the field.
    error: буряік
    correction: буря́к
    options:
    - буря́к
    - буряік
    - бурьак
    explanation: 'Сло́во «буря́к» пи́шеться з лі́терою я: буря́к. — The word «буря́к» is written with
      the letter я: буря́к.'
  - sentence: Сього́дні в мі́сті вели́ке свиа́то. — Today there is a big holiday in the city.
    error: свиа́то
    correction: свя́то
    options:
    - свя́то
    - свиа́то
    - св'ято
    explanation: 'Сло́во «свя́то» пи́шеться з лі́терою я без апо́строфа: свя́то. — The word «свя́то» is
      written with letter я without an apostrophe: свя́то.'
- id: act-210
  type: quiz
  title: Ви́беріть пра́вильне сло́во — Multiple Choice
  instruction: Select the correct Ukrainian vocabulary word.
  items:
  - question: What is the Ukrainian word for “tea”?
    options:
    - чай
    - час
    - рис
    answer: чай
    explanation: «Чай» means tea; «час» means time, and «рис» means rice.
  - question: What is the Ukrainian word for “apple”?
    options:
    - я́блуко
    - ю́шка
    - єно́т
    answer: я́блуко
    explanation: «Я́блуко» means apple; «ю́шка» is soup/broth, and «єно́т» is raccoon.
  - question: What is the Ukrainian word for “soup / broth”?
    options:
    - ю́шка
    - я́блуко
    - єно́т
    answer: ю́шка
    explanation: «Ю́шка» is traditional Ukrainian soup or broth.
  - question: What is the Ukrainian word for “raccoon”?
    options:
    - єно́т
    - кінь
    - лань
    answer: єно́т
    explanation: «Єно́т» is raccoon; «кінь» is horse, and «лань» is doe/hind.
  - question: What is the Ukrainian word for “beetroot”?
    options:
    - буря́к
    - я́блуко
    - свя́то
    answer: буря́к
    explanation: «Буря́к» is beetroot, the essential ingredient in Ukrainian borsch.
  - question: What is the Ukrainian word for “holiday”?
    options:
    - свя́то
    - буря́к
    - день
    answer: свя́то
    explanation: «Свя́то» means holiday or celebration; «день» means day.
- id: act-211
  type: quiz
  title: Ви́бір лі́тери — Letter Choice
  instruction: Choose the appropriate letter for each word.
  items:
  - question: 'Пе́рша лі́тера у сло́ві «___блуко»: — First letter in «___блуко» (apple):'
    options:
    - Я
    - Й
    answer: Я
    explanation: На́зва «я́блуко» почина́ється з лі́тери Я, яка́ дає́ зву́ки [йа]. — The word «я́блуко»
      begins with letter Я, which represents [йа].
  - question: 'Пе́рша лі́тера у сло́ві «___шка»: — First letter in «___шка» (soup):'
    options:
    - Ю
    - Й
    answer: Ю
    explanation: На́зва «ю́шка» почина́ється з лі́тери Ю, яка́ дає́ зву́ки [йу]. — The word «ю́шка» begins
      with letter Ю, which represents [йу].
  - question: 'Пе́рша лі́тера у сло́ві «___но́т»: — First letter in «___но́т» (raccoon):'
    options:
    - Є
    - Й
    answer: Є
    explanation: На́зва «єно́т» почина́ється з лі́тери Є, яка́ дає́ зву́ки [йе]. — The word «єно́т» begins
      with letter Є, which represents [йе].
  - question: 'Оста́ння лі́тера у сло́ві «ча___»: — Last letter in «ча___» (tea):'
    options:
    - й
    - і
    answer: й
    explanation: Напівголосни́й звук [й] у сло́ві «чай» пи́шеться з лі́терою й. — The semivowel glide
      [j] in «чай» is written with letter й.
  - question: 'Лі́тера пі́сля «р» у сло́ві «бур___к»: — Letter after «р» in «бур___к» (beetroot):'
    options:
    - я
    - і
    answer: я
    explanation: Сло́во «буря́к» пи́шеться з лі́терою я без апо́строфа. — The word «буря́к» is written
      with the letter я without an apostrophe.
  - question: 'Лі́тера пі́сля «в» у сло́ві «св___то»: — Letter after «в» in «св___то» (holiday):'
    options:
    - я
    - і
    answer: я
    explanation: Сло́во «свя́то» пи́шеться з лі́терою я без апо́строфа. — The word «свя́то» is written
      with letter я without an apostrophe.
