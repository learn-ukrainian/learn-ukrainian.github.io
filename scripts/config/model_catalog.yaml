# Fleet-comms stream orchestrator seats (#5512 / #4707 / #5703). These lanes may own a
# cold-start loop (prioritize → delegate → CF → merge-in-lane). Formal *sealed*
# AGY remains fail-closed because its text-only wrapper cannot consume the
# parent-owned sealed MCP. Native Grok never judges (Grok reviews code/infra only through the
# attested Cursor seat, #9488); Kimi: web, UI and backend coding only, never review.
# Parallel escalate ladder (user 2026-07-22): practical default + authority deep.
# Same shape for every orchestrator seat — like AGY Flash → Pro.
orchestrator_seats:
  claude:
    model_id: claude-opus-5-5
    effort: high
    escalate_model_id: gpt-6.1-sol
    escalate_effort: high
    escalate_when: deep_single_shot_or_architecture
    note: >-
      Operator 2026-09-22: Opus 5.5 is the Claude orchestrator seat and executes
      advanced non-linguistic work (architecture, hard coding, deep code review).
      start-claude-driver.sh pins claude-opus-5-5[1m] @ high unless --model /
      --effort (or LAUNCHER_MODEL / LAUNCHER_EFFORT) override it. Opus 5.5 /
      Sol 6.1 take review, critique, design input and Ukrainian work first (#9394);
      Fable and the Astra seat are last resort. Orchestration alone does not
      confer approval authority. grok-4.7 owns the daily epic
      loops; Claude driver sessions stay dispatch-heavy, never inline-heavy.
      Escalation stays CROSS-FAMILY to GPT-6.1 Sol @ high; Claude is an escalation TARGET,
      not an escalator. Driving default is `high` (Opus 5.5 API default is medium;
      step down to medium/low for routine turns; xhigh for hard turns and pinned
      curriculum/linguistic review skills; max almost never) — see
      fleet-shared-doctrine § Effort guidance.
  codex:
    model_id: gpt-6.1-sol
    effort: high
    escalate_model_id: gpt-6.1-sol
    escalate_effort: high
    escalate_when: consequential_advisory
    note: >
      Operator 2026-09-29 (#9230): GPT-6.1 Sol @ high is the Codex orchestrator,
      advanced seat; ordinary advice uses Sol high; Astra is last resort.
      The #9275 bounded-envelope route is unchanged. GPT-6
      Luna @ high does scouting and bounded work and is not this seat. Named alternate on
      harness/infra and DevOps — never a concurrent same-stream co-owner.
  # 2026-07-22 removal note retained for history: "the 272K window is not worth the session-
  # start/end rollover-token overhead relative to its small context" — see the 2026-07-23 note
  # above for why that calculus changed.
  grok:
    model_id: grok-4.7
    effort: high
    # grok-4.7 only. grok-4.7-build-fast is not admitted.
    escalate_model_id: grok-4.7
    escalate_effort: high
    escalate_when: n/a_same_sku
    fallback_transport: cursor
    fallback_model_id: grok-4.7
    note: native grok-4.7; Cursor explicit grok-4.7 if native dark (not a quality escalate)
  agy:
    model_id: gemini-3.8-flash-high
    effort: high
    escalate_model_id: gemini-3.8-flash-high
    escalate_effort: high
    escalate_when: n/a_same_sku
    note: "Google-family seat; Flash default and deep (operator 2026-09-22: 3.8 Flash High outperforms 3.1 Pro; Pro only when explicitly requested)"
  cursor:
    model_id: grok-4.7
    effort: high
    escalate_model_id: gpt-6.1-sol
    escalate_effort: high
    escalate_when: deep_single_shot_or_architecture
    auto_allowlist:
      - grok-4.7
      - composer-2.5
    auto_scope: write_implementation_dispatch_with_green_dor
    attestation_rule: driver_of_record_requires_attested_resolved_model
    unknown_auto_family_resolution: union_family
    unknown_auto_union_families:
      - xai
      - moonshot
    note: >-
      Cursor orchestrator seat (parent #6952, #6955). The seat runs the concrete pin
      grok-4.7 (#8464; the launcher sends grok-4.7-high) or another allowlisted pin.
      Operator decision 2026-09-30 (#9274): Auto runs only a well-defined coding task
      (auto_scope: a write-capable dispatch typed --research-role implementation, with owned
      paths and a green DoR issue card, in agent mode) and only within the explicit allowlist (currently grok-4.7 [xAI],
      composer-2.5 [Moonshot]; refresh under the catalog ~30-day contract). The driver
      seat, review, design, consults, discussions and recon never run Auto.
      When cursor:auto reports resolved_model=unknown, resolve its identity to the
      allowlist-union family {xAI, Moonshot}: Cursor-authored PRs require a single
      cross-family reviewer from outside {xAI, Moonshot}; Cursor-as-reviewer is eligible
      only against authors outside {xAI, Moonshot}. Attested Cursor grok-4.7 = xAI family; it is
      a formal code/infra reviewer only as the review_candidates grok-4.7-cursor-fallback seat (#9488).
      Driver-of-record still requires an attested concrete resolved_model from the run.
      Concurrency is 1 (the driver session is the Cursor lane; do not dispatch --agent cursor
      from within the driver session).

# Formal CF transport defaults (model + effort; sealed review-pr was removed in #8520). Advisor/authority
# roles use their catalog effort; Sol high fills the routine Codex reviewer role.
# Fable remains off the
# routine ladder. CodexBar health probes must never collapse routing to one seat.
formal_cf_defaults:
  codex:
    model_id: gpt-6.1-sol
    effort: high
    # Advisory escalation. The one-shot Codex ACP participant does not expose
    # reasoning effort, so previously review-pr pinned the model only.
    escalate_model_id: gpt-6.1-sol
    escalate_effort: high
  claude:
    model_id: claude-sonnet-5-5
    effort: high
    # Opus 5.5 is the first escalation; Fable 5.1 is last resort (#9394).
    escalate_model_id: claude-opus-5-5
    escalate_effort: high
    family_models:
      - claude-sonnet-5-5
      - claude-fable-5-1
      - claude-opus-5-5
  glm:
    model_id: glm-5.3
    effort: high
    # Native efforts: low | high | max. Default high; advisory/escalation max
    # (operator 2026-08-14 — GLM-5.3 dramatically improved).
    escalate_model_id: glm-5.3
    escalate_effort: max
    family_models:
      - glm-5.3
  pool:
    # Laguna S 2.1 — gen-2 strongest (not m.1; not xs)
    model_id: poolside/laguna-s-2.1
    effort: high
    family_models:
      - poolside/laguna-s-2.1   # gen-2 default (S)
      - poolside/laguna-xs-2.1  # gen-2 light (XS)
      - poolside/laguna-m.1     # gen-1 fallback only
  pool_xs:
    model_id: poolside/laguna-xs-2.1
    effort: high
  grok:
    model_id: grok-4.7
    effort: high
    fallback_transport: cursor
    fallback_model_id: grok-4.7
  agy:
    # Orchestrator pin + ladder seat; not a reviewer transport until
    # sealed isolation (#5555). Operator 2026-09-25 also excludes AGY from
    # every code-review candidate and ladder; this is not a CF route.
    model_id: gemini-3.8-flash-high
    effort: high
    formal_review_eligible: false
    isolation_issue: 5555

review_ladders:
  # Hard filters precede last-resort preference, then suitability and quality.
  # Opus / Sol handle critical review first (#9394). Native Grok never judges;
  # the attested Cursor Grok seat is the Sol-spared last resort (#9488) and has
  # no critical_review role, so critical lists it only to record that exclusion.
  # GLM remains explicit-pin only; Fable is automatic only as critical last resort.
  critical:
    - [openai_frontier]
    - [claude-opus-5-5]
    - [claude-opus-5-5-cursor-fallback]
    - [composer-2.5]
    - [pool]
    - [pool-xs]
    - [claude-fable-5-1]
    - [claude-fable-5-1-cursor-fallback]
    - [grok-4.7-cursor-fallback]
  # High lists only review_scheduler.risk_reviewer_models.high (#9538): when
  # neither seat is eligible the resolver returns no reviewer with a stated reason.
  high:
    - [openai_frontier]
    - [claude-opus-5-5]
    - [claude-opus-5-5-cursor-fallback]
  medium: &practical_first_code_review
    - [openai_frontier]
    - [claude-opus-5-5]
    - [claude-opus-5-5-cursor-fallback]
    - [claude-sonnet-5-5]
    - [composer-2.5]
    - [pool]
    - [pool-xs]
    - [grok-4.7-cursor-fallback]
  low: *practical_first_code_review

# Explicit --model rewrite when a hard substitution changes the agent (#8855).
# Keyed by the substitute lane. A source model with a row rewrites to that
# target. No explicit --model, or an explicit model the substitute adapter
# does not reject, uses that lane's registry default — the dispatch pin named
# on orchestrator_seats (cursor: grok-4.7), not the driver launcher's
# grok-4.7-high slug.
# An explicit model with no row that the substitute adapter rejects is
# refused before spawn (agy rejects an unknown Gemini slug; codex rejects
# anything outside gpt-6.1-sol/gpt-6-luna). Cursor forwards an unrecognized
# --model, so an unmapped slug such as gpt-6.1-sol still uses grok-4.7.
# GPT-6 has no Cursor row: native Codex only, until Cursor has a verified slug.
budget_substitution_models:
  codex:
    gpt-6.1-sol: gpt-6.1-sol
    gpt-6-luna: gpt-6-luna
  cursor:
    claude-opus-5-5: claude-opus-5-5-high
    # Read-only cursor-agent --list-models verified 2026-09-30:
    # claude-fable-5-1-thinking-high - Claude Fable 5.1 1M Thinking (NO ZDR)
    claude-fable-5-1: claude-fable-5-1-thinking-high
    grok-4.7: grok-4.7
    composer-2.5: composer-2.5
