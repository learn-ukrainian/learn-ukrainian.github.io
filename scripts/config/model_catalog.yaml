  claude-fable-5:
    family: anthropic
    tier: frontier_authority
    lifecycle: retired
    replaced_by: claude-fable-5-1
    roles: [architecture, critical_review, long_horizon_coding]
    transports: []
    strengths: [highest_anthropic_capability, long_horizon_work]
    weaknesses: [stricter_refusal_surface, cursor_fallback_no_zdr]
    notes: >-
      Wave 1 SCORECARD 2026-08-23 operator lock: S+. Remains frontier_authority;
      no Wave 1 public CF cell required to hold the lock.
    sources:
      - https://www.anthropic.com/news/claude-fable-5-mythos-5
  claude-fable-5-1:
    family: anthropic
    tier: frontier_authority
    lifecycle: active
    roles: [architecture, critical_review, long_horizon_coding, orchestration]
    transports: [native_claude, cursor]
    strengths: [highest_anthropic_capability, long_horizon_work, always_on_thinking]
    weaknesses: [stricter_refusal_surface, cursor_fallback_no_zdr]
    notes: >-
      Fable 5.1 is last resort for review, critique, design input and Ukrainian
      work (#9394); use Opus 5.5 / Sol 6.1 first. It succeeds claude-fable-5
      as a designated-authority fallback. Thinking is always on (never send
      thinking: disabled). Effort decision topology (operator 2026-09-09): default
      high (API default; start here — do not port Opus/xhigh habits); medium/low
      for routine interactive work (low often beats prior-gen xhigh/max; medium
      ≈ Fable 5 cheaper); xhigh for hard multi-file / long autonomous turns and for
      curriculum/linguistic review skills that pin effort: xhigh (content-review,
      plan-review, plan-review-seminar, batch-review, prompt-review — do not step
      those down); max almost never. Long deliverables stay at high unless a
      measured quality gain says otherwise; at xhigh/max leave output-budget room.
      Quirks: high+ on simple tasks over-gathers (lower effort, do not prompt
      around it); low searches less (bump for retrieval-heavy named products);
      effort does not shorten visible output. Keep verification scaffolding —
      the Opus 5 guidance to delete it does not apply. claude-fable-5 is retired
      with no executable routes; historical attribution remains unchanged. Full prose:
      docs/best-practices/fleet-shared-doctrine.md § Effort.
    sources:
      - https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-fable-5-1
  claude-opus-5-5:
    family: anthropic
    tier: frontier_authority
    lifecycle: active
    roles: [orchestration, architecture, agentic_coding, critical_review, security_review]
    transports: [native_claude, cursor]
    strengths: [agentic_coding_at_medium_effort, code_review_precision, grounded_analysis, visual_input_reading]
    weaknesses: [thinking_cannot_be_disabled, longer_turns_at_xhigh_max, broader_refusal_classifiers]
    notes: >-
      Operator 2026-09-22: default Claude model and the Claude orchestrator seat.
      Opus 5.5 executes architecture, hard coding, deep code review and
      Ukrainian-specific linguistic work. start-claude-driver.sh pins claude-opus-5-5[1m] @ high.
      Opus 5.5 / Sol 6.1 take review, critique and design input first (#9394);
      Fable and the Astra seat are last resort. Effort: API default is medium (not high); medium on
      Opus 5.5 beats Opus 5 @ high on coding and knowledge work. Orchestrating runs
      at high; medium/low for routine turns; xhigh for hard debugging and the
      curriculum/linguistic review skills that pin effort: xhigh; max almost never.
      Each level thinks more per turn than on Opus 5 — lower effort before prompting
      for brevity. Thinking is always on (thinking: disabled and budget_tokens 400);
      forced tool_choice any/tool 400s. Full prose: fleet-shared-doctrine § Effort.
    sources:
      - https://platform.claude.com/docs/en/about-claude/models/overview
  claude-opus-5:
    family: anthropic
    tier: frontier_authority
    lifecycle: retired
    replaced_by: claude-opus-5-5
    roles: [historical_record_resolution]
    transports: []
    strengths: [deep_reasoning, long_horizon_agentic, high_precision_and_recall_code_review]
    weaknesses: [verbose_by_default, over_delegates_to_subagents, elevated_refusal_surface]
    notes: >-
      Anthropic authority-tier seat. Operator 2026-08-06: formal CF eligible when pinned
      on the sealed claude endpoint (sealed review-pr was removed in #8520).
      Advisory consultations remain non-binding for designated advisor authority (Sol/Fable).
      Kimi: web, UI and backend coding only — no Ukrainian-language content, no
      reviews, consults, design or rules.
      Effort ladder low..max; use high for advisory and xhigh only for a documented hard turn.
      Thinking is ON by default and disabling it is invalid above high effort. Separate
      rate-limit bucket from the Opus 4.x pool.
