    sources:
      - https://developers.openai.com/api/docs/models/gpt-6-sol
  gpt-5.6-sol:
    family: openai
    tier: frontier_authority
    lifecycle: retired
    replaced_by: gpt-6.1-sol
    roles: [architecture, critical_review, bounded_advisory_envelope, difficult_debugging, final_synthesis]
    transports: []
    strengths: [frontier_technical_judgment, long_horizon_reasoning, programmatic_tools]
    weaknesses: [scarce_frontier_quota, wasteful_for_routine_work, not_a_speed_winner]
    notes: >-
      Historical Wave 1 scorecard only. Operator 2026-09-22: do not select
