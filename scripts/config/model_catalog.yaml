# Fleet-comms stream orchestrator seats (#5512 / #4707 / #5703). These lanes may own a
# cold-start loop (prioritize → delegate → CF → merge-in-lane). Formal *sealed*
# AGY remains fail-closed because its text-only wrapper cannot consume the
# parent-owned sealed MCP. Grok enters through the proven exact-head ACP review
# path; Kimi K3 remains fail-closed until its authenticated sealed canary passes.
# Parallel escalate ladder (user 2026-07-22): practical default + authority deep.
# Same shape for every orchestrator seat — like AGY Flash → Pro.
orchestrator_seats:
  claude:
    model_id: claude-fable-5
    effort: high
    escalate_model_id: gpt-5.6-sol
    escalate_effort: xhigh
    escalate_when: deep_single_shot_or_architecture
    note: >-
      Fable 5 remains the Anthropic orchestration and designated-authority seat.
      Non-binding Anthropic advisory consultations route separately to Opus 5 under
      the operator's 2026-07-31 directive. Fable runs in the SUMMONED cadence, not
      as a resident daily driver: grok-4.5 owns the daily epic loops; Fable takes
      1-2 short scheduled judgment sessions/day (verdict reads, course corrections,
      design locks, briefs) driven dispatch-heavy, never inline-heavy — measured
      2026-07-26 at ~2 weekly-quota points per orchestration hour in that style.
      Escalation stays CROSS-FAMILY to Sol @ xhigh; Claude is an escalation TARGET,
      not an escalator. Opus 5 is not an orchestrator and its advisory output does
      not confer approval authority. Driving is `high`, not `xhigh`.
  codex:
    model_id: gpt-5.6-terra
    effort: high
    escalate_model_id: gpt-5.6-sol
    escalate_effort: xhigh
    escalate_when: deep_single_shot_or_architecture
    note: >
      Re-added as orchestrator seat 2026-07-23 (reverses the 2026-07-22 removal) specifically for
      HydrationCapsuleV1 long-horizon support — score-from-memory + a ~100ms capsule hydrate is
      designed to minimize the rollover-token overhead the prior removal objected to. Named
      alternate/overflow on harness/infra (epic:4707) and the independent DevOps stream
      (epic:5703) alongside Gemini — never a concurrent same-stream co-owner; each
      session-stream lease already fails closed on a live foreign holder, so no new
      exclusivity logic is needed.
  # 2026-07-22 removal note retained for history: "the 272K window is not worth the session-
  # start/end rollover-token overhead relative to its small context" — see the 2026-07-23 note
  # above for why that calculus changed.
  grok:
    model_id: grok-4.5
    effort: high
    # No higher Grok SKU in catalog yet — keep native pin; Cursor pin is availability fallback only.
    escalate_model_id: grok-4.5
    escalate_effort: high
    escalate_when: n/a_same_sku
    fallback_transport: cursor
    fallback_model_id: grok-4.5
    note: native grok-4.5; Cursor explicit grok-4.5 if native dark (not a quality escalate)
  agy:
    model_id: gemini-3.6-flash-high
    effort: high
    escalate_model_id: gemini-3.1-pro-high
    escalate_effort: high
    escalate_when: deep_single_shot_or_architecture
    note: Google-family orchestrator; Flash default loop; Pro escalate only

# Formal CF transport defaults for review-pr (model + effort). Advisor/authority
# seats (Sol/Fable and other designated-authority seats) are critical-ladder only —
# not routine review-pr pins (operator 2026-08-03 + Sol GO). Fable remains off the
# routine ladder. CodexBar health probes must never collapse routing to one seat.
formal_cf_defaults:
  codex:
    model_id: gpt-5.6-terra
    effort: high
    # Authority model for critical / hard CF. The one-shot Codex ACP participant
    # does not expose reasoning effort, so review-pr pins the model only.
    escalate_model_id: gpt-5.6-sol
    escalate_effort: provider_default
  claude:
    model_id: claude-sonnet-5
    effort: high
    # The sealed Claude ACP participant supports Sonnet and Fable at its fixed
    # high effort. Opus 5 advisory consultations remain non-binding and separate.
    escalate_model_id: claude-fable-5
    escalate_effort: high
  glm:
    model_id: glm-5.2
    effort: high
  pool:
    # Laguna S 2.1 — gen-2 strongest (not m.1; not xs)
    model_id: poolside/laguna-s-2.1
    effort: high
    family_models:
      - poolside/laguna-s-2.1   # gen-2 default (S)
      - poolside/laguna-xs-2.1  # gen-2 light (XS)
      - poolside/laguna-m.1     # gen-1 fallback only
  pool_xs:
    model_id: poolside/laguna-xs-2.1
    effort: high
  grok:
    model_id: grok-4.5
    effort: high
    fallback_transport: cursor
    fallback_model_id: grok-4.5
  agy:
    # Orchestrator pin + ladder seat; not a review-pr --reviewer transport until
    # sealed isolation (#5555). When AGY is the formal candidate, resolve-reviewer
    # selects gemini-3.6-flash-high via the practical ladder.
    model_id: gemini-3.6-flash-high
    effort: high
    formal_review_eligible: false
    isolation_issue: 5555

review_ladders:
  # #5293 quality-first: never let a later rung improve quality tier.
  # critical keeps frontier_authority first (false APPROVED is expensive).
  # high/medium/low: Terra → Sonnet → GLM first (Sol GO 2026-08-03), then Flash /
  # Grok / K3 / DS / pool — not Sol/Fable/advisor seats on routine PRs.
  critical:
    - [openai_frontier]
    # Fable 5 is the Anthropic authority rung (operator 2026-07-26 — Opus 5
    # de-advisored: weak in the role, over-verbose; reverses 2026-07-24). Opus is
    # NOT on the authority ladder at all; it remains a practical/coding seat.
    - [claude-fable-5]
    - [claude-fable-5-cursor-fallback]
    - [gpt-5.6-terra]
    - [claude-sonnet-5]
    - [gemini-3.6-flash]
    - [grok-4.5]
    - [grok-4.5-cursor-fallback]
    - [kimi-k3]
    - [glm-5.2]
    - [deepseek-v4-pro]
    - [deepseek-v4-flash]
    - [composer-2.5]
    - [gemini-3.1-pro]
    - [pool]
    - [pool-xs, gemini-3.5-flash]
  high: &practical_first_code_review
    # Routine CF order (Sol GO 2026-08-03): Terra → Sonnet → GLM, then other workhorses.
    # Advisors (Sol/Fable) stay off this ladder (critical only).
    - [gpt-5.6-terra]
    - [claude-sonnet-5]
    - [glm-5.2]
    - [gemini-3.6-flash]
    - [grok-4.5]
    - [grok-4.5-cursor-fallback]
    - [kimi-k3]
    - [deepseek-v4-flash]
    - [deepseek-v4-pro]
    - [composer-2.5]
    - [gemini-3.1-pro]
    - [pool]
    - [pool-xs, gemini-3.5-flash]
  medium: *practical_first_code_review
  low: *practical_first_code_review
