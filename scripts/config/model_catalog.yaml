schema_version: model-catalog.v1
reviewed_on: 2026-09-24
refresh_after_days: 30

# This is the preferred/current fleet, not every legacy model exposed by a
# multi-model picker. Provider catalogs remain discovery inputs; this catalog
# records the models that routing policy may actively select.
quality_tiers:
  frontier_authority: 1
  frontier_practical: 2
  strong_efficient: 3
  economical: 4
  specialist: 5
  compatibility: 6

policy:
  quality_first: true
  selection_order:
    - independence_and_hard_gates
    - primary_before_last_resort
    - profile_risk_suitability
    - review_quality_tier
    - health_and_quota_within_tier
    - cost_within_equivalent_fit
  risk_quality_floor:
    critical: economical
    high: economical
    medium: economical
    low: economical
  inventory_sources:
    - runtime_registry
    - native_cli_catalogs
    - bridge_routes
    - cursor_model_catalog
    - codexbar_health_and_quota
  notes:
    - CodexBar is a health and quota signal, not a complete model inventory.
    - >-
      Cursor auto is a harness choice, never a model identity for formal review. Operator decision
      2026-09-30 (#9274): Auto runs only a well-defined coding task (a write-capable dispatch typed
      --research-role implementation, with owned paths and a green DoR issue card); every other Cursor use pins a concrete
      approved model (orchestrator_seats.cursor).
    - >-
      GPT-6 routes are native Codex only until Cursor exposes a verified GPT-6 slug.
      Claude Opus 5.5 may use native Claude or an explicitly verified Cursor slug.
      Grok is native CLI ONLY at grok-4.7 for every seat
      (interactive, orchestrator, ask, dispatch, cursor availability fallback). Native Grok never
      reviews or judges. Operator decision 2026-10-02 (#9488): Grok reviews code and infra only
      through the Cursor seat pinned to grok-4.7-high whose runtime attests the concrete model;
      Sol stays the first seat and the Cursor seat is the Sol-spared last resort.
      Operator order 2026-09-22 (#8464) rotates from grok-4.6; #6865 previously retired opencode
      first-party xai/grok-* for orchestrator seats — opencode remains unsanctioned for grok.
      Hermes and OpenRouter grok routes remain banned. grok-4.6 and grok-4.7-build-fast are not admitted.
    - >-
      Kimi K3 workers (`kimi`, `kimicc`, and catalog ids `kimi-code/k3*`) use the
      native `kimi` CLI subscription path only (`catalog_transport` /
      `transports`: `native_kimi`). OpenRouter is forbidden as a Kimi worker
      bus. Do not relaunch OpenRouter-for-subscribed-models patterns for
      Moonshot/Kimi K3. OpenRouter remains mainly Pool + Gemma access.
    - >-
      Kimi: web, UI and backend coding only — no Ukrainian-language content, no
      reviews, consults, design or rules. Kimi seats (`kimi`, `kimicc`, every
      `kimi-code/*` / `kimi-k3*` id) take workspace-write implementation of the
      allowlisted UI and backend paths (KIMI_OWNED_ROOTS) only; they carry no review,
      consult, advisor, or ACP-discussion role and are absent from
      review_candidates and review_ladders; dispatch, the runtime, ACP and the
      fleet-comms authority refuse everything else before any side effect
      (scripts/agent_runtime/kimi_admission.py). The one exception is
      review_scheduler.subject_seat_review_exception (#9532, #9577).
    - >-
      EXEMPT (not a fleet seat) — scripts/projects/open_model_data Phase 3 v2.1 ROLE_EXECUTION
      still pins harness opencode + exact_model grok-4.5 for ukrainian_source_reviewer /
      cross_family_code_infra_reviewer / textbook_nonhit_auditor (and OPENCODE_REVIEW_MODEL
      xai/grok-4.5). Those pins live in hash-bound v2.1 evidence/validator artifacts
      (phase3_functional_roles.py validator_sha256 + phase3_source_production_transport.py
      inventory sha); rotating or rewriting them is outside the fleet seat list and requires
      a separate open-model-data rebind (#6870 item 3). The same rebind must cover
      gemini-3.6/3.7 (including Flash variants), claude-fable-5 and grok-4.6 pins
      in those hash-bound Phase 3 artifacts. Fleet routing must not read them.
    - >-
      Composer 2.5 derives from Kimi 2.5; native Kimi K3 diverged. Composer 2.5
      conservatively shares Moonshot independence lineage with Kimi.
    - >-
      Wave 1 CF SCORECARD 2026-08-23 (operator/CTO GO, provisional): letter grades
      are advisory labels on existing quality_tiers — not a parallel ranking and
      not a reviewed_on refresh. Fable (claude-fable-5) = S+ (frontier_authority).
      gpt-5.6-sol = A / hard advisory (frontier_authority). grok-4.7/4.6 ≥B, NOT C
      (keep frontier_practical; do not demote). Kimi = strong root-cause / densest
      useful CI nits (native `kimi` CLI only). AGY gemini-3.7-flash-high = fast
      scoped CF. GLM-5.3 = ships-heavier, LOCAL-ONLY (zai-coding-plan; never
      OpenRouter). Codex/Sol = careful/small, thorough/heavy advisory — not a
      speed winner. Evidence: AGY #7137, Kimi #7143, Codex/Sol #7142, Grok #7133,
      GLM #7144 (also addresses #7121 fetch refspecs). OpenRouter remains mainly
      Pool+Gemma; Kimi/Gemini/GLM subscribed seats never OpenRouter.

# Canonical sealed formal-review transports. Resolver policy consumes these
# endpoint records before considering balance. A route with
# formal_review_eligible: false may support advisory or implementation work,
# but it is never selected as the formal cross-family gate.
review_scheduler:
  schema_version: review-scheduler.v1
  policy_version: deterministic-formal-routing.v2
  # Suitability is a semantic gate/rank, not a traffic-rotation weight. These
  # ordered catalog roles are read from the selected model's `roles` field:
  # an absent role fails closed, and pressure only breaks ties at one exact
  # profile/risk suitability + quality tier.
  profile_risk_role_order:
    code:
      critical: [critical_review]
      high: [strong_review, standard_review, long_context_review, critical_review]
      medium: [standard_review, strong_review, long_context_review, routine_review, critical_review]
      low: [routine_review, standard_review, strong_review, long_context_review, critical_review]
    infra:
      critical: [critical_review, security_review]
      high: [strong_review, security_review, standard_review, long_context_review, critical_review]
      medium: [standard_review, strong_review, security_review, long_context_review, routine_review, critical_review]
      low: [routine_review, standard_review, strong_review, security_review, long_context_review, critical_review]
  automatic_near_cap_assignments: false
  # Operator decision 2026-10-02 (#9538): a formal review at a listed risk is
  # performed only by these models, on any catalogued transport (Opus 5.5
  # natively or through Cursor). This is an eligibility gate: ladders, explicit
  # pins, custom ladders and delegate review admission all apply it.
  risk_reviewer_models:
    high: [gpt-6.1-sol, claude-opus-5-5]
  # Operator decision 2026-10-03 (#9532), implemented in #9577: when every
  # review_ladders.<risk> seat is excluded as the change's subject seat or the
  # author's family (never health or capacity), this seat reviews read-only.
  # The resolver, delegate review/Kimi admission and record_cf_verdict all read
  # this block. Critical risk is never listed. A Moonshot author (Kimi or
  # Composer) is same-family, so it never gets this seat.
  # Read-only `cursor-agent --list-models` 2026-10-03: "kimi-k3-high - Kimi K3 High".
  subject_seat_review_exception:
    id: subject-seat-exhausted-kimi-k3-cursor
    decision: "#9532"
    issue: "#9577"
    risks: [high]
    model_id: kimi-code/k3
    route: cursor
    transport: cursor
    dispatch_model: kimi-k3-high
    mode: read-only
    review_profiles: [code, infra]
    capabilities: [code_review]
  endpoints:
    claude:
      formal_review_eligible: true
      # Active formal CF pins; superseded Opus/Sonnet identities are historical only.
      models: [claude-fable-5-1, claude-sonnet-5-5, claude-opus-5-5]
      participant: claude
      adapter_transport: acp
      catalog_transport: native_claude
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: claude
      credential_bucket: claude
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0
    codex:
      formal_review_eligible: true
      models: [gpt-6.1-sol]
      participant: codex
      adapter_transport: acp
      catalog_transport: native_codex
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: codex
      credential_bucket: codex
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0
    glm:
      formal_review_eligible: true
      models: [glm-5.3]
      participant: glm
      adapter_transport: acp
      catalog_transport: opencode
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: glm
      credential_bucket: glm
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0
    agy:
      formal_review_eligible: false
      formal_review_exclusion_reason: source-blind AGY ACP wrapper does not expose parent-owned MCP servers
      models: [gemini-3.8-flash-high]
      participant: agy
      adapter_transport: acp
      catalog_transport: agy
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: agy
      credential_bucket: agy
      quota_limit: 2
      credential_limit: 2
      capacity_weight: 1.0
    grok:
      # Transport flag only: native Grok never judges code or infra; the
      # resolver and the ladder lint refuse it (#9488 kept that rule).
      formal_review_eligible: true
      models: [grok-4.7]
      participant: grok
      adapter_transport: acp
      catalog_transport: native_grok
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: grok
      credential_bucket: grok
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0
    kimi:
      formal_review_eligible: false
      formal_review_exclusion_reason: "Kimi: web, UI and backend coding only; reviews are refused"
      models: []
      participant: kimi
      adapter_transport: acp
      # Native `kimi` CLI subscription path only. OpenRouter is not a Kimi worker bus.
      catalog_transport: native_kimi
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: kimi
      credential_bucket: kimi
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0
    kimicc:
      formal_review_eligible: false
      formal_review_exclusion_reason: "Kimi: web, UI and backend coding only; reviews are refused"
      # Routable kimicc models only. kimi-code/k3-256k is omitted: the live
      # coding endpoint rejects coding_model_id k3-256k with
      # [claude-code:unrecognized_model] (#8745). No replacement 256k id.
      # The first entry is the omitted-model default (kimi-code/k3).
      models: [kimi-code/k3, kimi-k3-max, kimi-code/kimi-for-coding, kimi-code/kimi-for-coding-highspeed]
      participant: kimicc
      adapter_transport: acp
      # Native `kimi` CLI subscription path only. OpenRouter is not a Kimi worker bus.
      catalog_transport: native_kimi
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: kimi
      credential_bucket: kimi
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0
    cursor:
      # Operator decision 2026-10-02 (#9488): only the pinned models below are
      # formal identities on this multi-model harness. Each is dispatched with an
      # exact Cursor slug and record_cf_verdict accepts its verdict only from the
      # runtime-reported model. Composer (Kimi lineage), Auto and Cursor-routed
      # Claude stay unpinned, so the resolver excludes them as unattested.
      formal_review_eligible: true
      models: [grok-4.7]
      participant: cursor
      adapter_transport: acp
      catalog_transport: cursor
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: cursor
      credential_bucket: cursor
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0
    deepseek:
      formal_review_eligible: false
      formal_review_exclusion_reason: text-only child cannot consume parent-owned sealed-review MCP
      participant: deepseek
      adapter_transport: acp
      # Native opencode ACP transport since the Hermes removal (operator order
      # 2026-08-16, #6805) — mirrors the glm/gemma seats.
      catalog_transport: opencode
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: deepseek
      credential_bucket: deepseek
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0
    pool:
      formal_review_eligible: false
      formal_review_exclusion_reason: ACP participant does not yet pin and attest the concrete Laguna model
      participant: pool
      adapter_transport: acp
      catalog_transport: opencode
      sealed_executable: agent_runtime.runner:invoke_inter_agent
      quota_bucket: pool
      credential_bucket: pool
      quota_limit: 1
      credential_limit: 1
      capacity_weight: 1.0

# Bounded execution routing after a frontier advisory pass. This is deliberately
# separate from review_ladders: it selects an implementation/investigation lane,
# not a formal reviewer or a release authority.
execution_routing:
  sol_advised_bounded:
    advisor:
      model_id: gpt-6.1-sol
      effort: high
      role: bounded_advisory_envelope
      output_fields:
        - task_contract
        - owned_paths
        - max_changed_files
        - max_non_test_loc
        - constraints
        - risk_boundaries
        - acceptance_evidence
        - escalation_triggers
    preferred_worker:
      model_id: gpt-6-luna
      effort: high
      requires: [complete_advisory_envelope, objective_scope_ceiling]
      task_types: [bounded_implementation, bounded_investigation]
      escalate_to: gpt-6.1-sol
      prohibited_decisions:
        - consequential_architecture
        - security
        - release
        - high_risk_go_no_go
      escalation_triggers:
        - scope_ceiling_exceeded
        - unresolved_consequential_ambiguity
        - broader_integration
        - final_disposition
    # Operator decision 2026-09-30 (#9275): there is no direct bounded dispatch.
    # Every dispatch to a bounded worker (preferred_worker, or the Gemini Flash
    # fallback below unless it carries a Ukrainian authoring/review
    # classification) needs a complete advisory envelope from the advisor above,
    # bound to that dispatch; delegate.py refuses one without it.
    bounded_fallback_worker:
      model_id: gemini-3.8-flash-high
      effort: high
      requires: [complete_advisory_envelope, objective_scope_ceiling]
      non_bounded_task_families: [ukrainian-authoring, ukrainian-review]
    autonomous_fallback:
      model_id: gpt-6.1-sol
      effort: high
      when: [missing_objective_scope_ceiling, broader_autonomous_integration, unresolved_consequential_ambiguity]
    review_boundary:
      advisory_family: openai
      advisory_satisfies_cross_family_review: false
      independent_cross_family_review_required: true

models:
  gpt-6.1-sol:
    family: openai
    tier: frontier_authority
    lifecycle: active
    roles:
      - orchestration
      - architecture
      - implementation
      - standard_review
      - critical_review
      - agentic_coding
      - bounded_advisory_envelope
      - consequential_advisory
    transports: [native_codex]
    strengths: [agentic_coding, demanding_reasoning, frontier_technical_judgment, near_astra_at_lower_cost]
    weaknesses: [not_independent_from_openai_authors]
    notes: >-
      Operator 2026-09-29 (#9230): the only Sol and the only GPT-6 frontier seat.
      Codex orchestrator, coder, reviewer, and the hard advisory seat that GPT-6
      Astra held. Orchestration, coding, review and the advisory seat
      use high (#9360). GPT-6 Luna stays the scouting and bounded-work seat.
      API id gpt-6.1-sol (official model page). Context window 1,050,000 tokens,
      max input 922,000, max output 128,000; knowledge cutoff 2026-04-30;
      reasoning effort low, medium (default), high, xhigh, max. Standard price
      $2 input / $0.10 cached input / $2.50 cache write / $10 output per million
      tokens; prompts over 272K input tokens bill 2x input and 1.5x output.
      OpenAI positions it as near-Astra performance at a lower cost.
    sources:
      - https://developers.openai.com/api/docs/models/gpt-6.1-sol
      - https://openai.com/index/introducing-gpt-6-1-sol/
      - https://developers.openai.com/api/docs/pricing
  gpt-6-luna:
    family: openai
    tier: economical
    lifecycle: active
    roles: [recon, bounded_checks, log_triage, bounded_implementation, bounded_investigation]
    transports: [native_codex]
    strengths: [high_volume, repeatable_work, lowest_gpt6_token_price]
    weaknesses: [not_a_formal_reviewer, not_the_orchestrator, not_sole_consequential_authority]
    notes: >-
      Operator 2026-09-22: scouting and bounded repeatable work at high.
      Use max only for an unusually hard scouting task. API id gpt-6-luna.
      Standard price $0.10 / $0.50 per million input/output tokens, 20x below
      GPT-6.1 Sol. Routing decisions stay with the Sol orchestrator.
    sources:
      - https://developers.openai.com/api/docs/models/gpt-6-luna
      - https://openai.com/index/introducing-gpt-6-sol-and-luna/
  gpt-6-astra:
    family: openai
    tier: frontier_authority
    lifecycle: retired
    replaced_by: gpt-6.1-sol
    roles: [bounded_advisory_envelope, architecture, consequential_advisory]
    transports: []
    strengths: [agentic_coding, frontier_technical_judgment]
    weaknesses: [not_independent_from_openai_authors]
    notes: >-
      Historical records only. Operator 2026-09-29 (#9230): gpt-6.1-sol took
      the advisory seat. Not routable.
    sources:
      - https://developers.openai.com/api/docs/models/gpt-6-astra
  gpt-6-sol:
    family: openai
    tier: frontier_authority
    lifecycle: retired
    replaced_by: gpt-6.1-sol
    roles: [orchestration, architecture, implementation, standard_review, critical_review, agentic_coding]
    transports: []
    strengths: [agentic_coding, demanding_reasoning]
    weaknesses: [not_independent_from_openai_authors]
    notes: >-
      Historical records only. Operator 2026-09-29 (#9230): gpt-6.1-sol is the
