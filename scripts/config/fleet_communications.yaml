---
version: 1
# Message plane production default (#6159 authority cutover). Env
# FLEET_COMMS_MESSAGE_PLANE always wins when set. Modes:
# off | shadow | dual_write | authority.
# Present-tense operator GO 2026-08-01 authorized authority after active
# migration, reconciliation, crash/restart, replay, and orphan checks passed.
# Protected rail PR #6200 and the retirement prerequisites are merged; the env
# override remains the explicit rollback control.
message_plane:
  default_mode: authority

# Projection only. Formal-review policy, model pins, sealed participants, and
# quota/credential buckets are canonical in model_catalog.yaml under
# review_scheduler.endpoints. Keep these endpoint booleans synchronized for
# legacy endpoint-status consumers; reviewer_resolver never reads this copy.
formal_review_eligibility_source: scripts/config/model_catalog.yaml#review_scheduler.endpoints

# Formal review is eligible only after the endpoint proves parent-owned sealed
# MCP consumption on the exact-head ACP path. AGY remains structurally
# fail-closed; Kimi is never a reviewer (web, UI and backend coding only).
#
# Formal CF model+effort pins (model_catalog formal_cf_defaults; review-pr removed in #8520):
#   codex → gpt-6.1-sol @ high · claude → claude-sonnet-5-5 @ high · glm → glm-5.3 @ high (advisory max)
#   claude formal pins also: claude-opus-5-5
#   pool volume → Laguna S 2.1 (laguna-s-2.1); also XS 2.1 / M.1 in catalog
#   grok → daily driver only; native Grok never reviews or judges (Grok reviews code/infra
#          only as the attested cursor grok-4.7-high seat below critical, #9488)
#   agy → gemini-3.8-flash-high @ high (orchestrator seat; text-only ACP wrapper is not a formal-review route)
# Codex advisory escalation: gpt-6.1-sol @ high; routine reviewer stays high.
# Automatic authority Opus 5.5/Sol 6.1 selection stays on the critical ladder;
# Fable and Astra hold no review role (#9583). An explicit operator pin at another risk keeps every
# formal eligibility, isolation, family, capability, health, and circuit gate
# enforced.
#
# Orchestrator seats for this stream (model_catalog.orchestrator_seats):
#   claude(claude-opus-5-5 @ high)
#   · codex(gpt-6.1-sol @ high) · grok(daily driver) · agy(gemini-3.8-flash-high @ high)
#   (codex was dropped as a driver on 2026-07-22, then re-added on 2026-07-23 because
#    HydrationCapsuleV1 reduces rollover overhead; formal-CF eligibility is unchanged.)
# Each may own cold-start / drive-board loops. Sealed formal CF (review-pr) was
# removed in #8520; eligible routes are projected below from model_catalog.
endpoints:
  - name: claude
    aliases: [claude]
    state: live
    transports: [acp]
    completion_evidence: [terminal_event, authority_receipt]
    default_ttl_seconds: 3600
    retry_class: standard
    concurrency_limit: 1
    formal_review_eligible: true
    model_family_resolver: canonical-reviewer-resolver
  - name: codex
    aliases: [codex]
    state: live
    transports: [acp]
    completion_evidence: [terminal_event, authority_receipt]
    default_ttl_seconds: 3600
    retry_class: standard
    concurrency_limit: 1
    formal_review_eligible: true
    model_family_resolver: canonical-reviewer-resolver
  - name: agy
    aliases: [agy]
    state: live
    transports: [acp]
    completion_evidence: [terminal_event, authority_receipt]
    default_ttl_seconds: 3600
    retry_class: standard
    concurrency_limit: 2
    # Seat pin: gemini-3.8-flash-high @ high; prefer Ukrainian and well-defined work.
    # It remains a peer cold-start / drive-board driver alongside claude|grok|codex
    # (Codex re-added 2026-07-23).
    # The source-blind AGY wrapper is text-only and cannot consume the
    # parent-owned sealed MCP. When AGY orchestrates, request formal CF through
    # an eligible cross-family route (sealed review-pr removed in #8520); AGY itself stays advisory.
    formal_review_eligible: false
    model_family_resolver: canonical-reviewer-resolver
  - name: grok
    aliases: [grok]
    state: live
    transports: [acp]
    completion_evidence: [terminal_event, authority_receipt]
    default_ttl_seconds: 3600
    retry_class: standard
    concurrency_limit: 1
    # Native Grok uses the hash-pinned sealed-review profile only when the
    # parent supplies a validated exact-head MCP config. Policy still refuses
    # native Grok as a code/infra reviewer; Grok reviews only through the
    # runtime-attested Cursor seat (#9488).
    formal_review_eligible: true
    model_family_resolver: canonical-reviewer-resolver
  - name: kimi
    aliases: [kimi]
    state: live
    transports: [acp]
    completion_evidence: [terminal_event, authority_receipt]
    default_ttl_seconds: 3600
    retry_class: standard
    concurrency_limit: 1
    # Kimi: web, UI and backend coding only — no Ukrainian-language content, no
    # reviews, consults, design or rules. The seat stays live for workspace-write
    # dispatch, but requests addressed to it, ACP asks, consults, discussion
    # panels, and reviews are refused before any side effect
    # (scripts/agent_runtime/kimi_admission.py).
    formal_review_eligible: false
    model_family_resolver: canonical-reviewer-resolver
  - name: cursor
    aliases: [cursor]
    state: live
    transports: [acp]
    completion_evidence: [terminal_event, authority_receipt]
    default_ttl_seconds: 3600
    retry_class: standard
    concurrency_limit: 1
    # Multi-model harness: formal only for the concrete models the catalog pins
    # on review_scheduler.endpoints.cursor (grok-4.7 dispatched as grok-4.7-high,
    # its verdict accepted only from the runtime-reported model; #9488). Cursor
    # auto, Composer and Cursor-routed Claude are never formal review identities.
    formal_review_eligible: true
    model_family_resolver: canonical-reviewer-resolver
  - name: gemini
    aliases: [gemini]
    state: retired
    successor: agy
    transports: []
    completion_evidence: []
    default_ttl_seconds: 3600
    retry_class: none
    concurrency_limit: 0
    formal_review_eligible: false
    model_family_resolver: canonical-reviewer-resolver
  - name: glm-local
    aliases: [glm-local, glm]
    state: live
    transports: [acp]
    completion_evidence: [terminal_event, authority_receipt, sealed_verdict]
    default_ttl_seconds: 3600
    retry_class: standard
    concurrency_limit: 1
    formal_review_eligible: true
    model_family_resolver: canonical-reviewer-resolver
