---
# Issue-stream registry — single source of truth for "which epic defines which stream".
# Consumed by scripts/orchestration/issue_stream_audit.py, the session-setup hook, and
# /api/state/issues-health. docs/WORKSTREAMS.md § Streams mirrors this table.
#
# Rules (binding, served via /api/rules → workflow.md § Work intake):
# - Every OPEN issue must be a member of EXACTLY ONE stream (native descendant of a
#   stream epic, or a #N reference in the epic body while migration is pending).
# - New issues link their stream epic at creation time.
# - Active root epics themselves are exempt from membership. Closed epics may
#   stay registered for launcher/session consumers but are not audit roots.
# - An optional `retired: true` marker (boolean; rejected otherwise) likewise
#   keeps a stream registered for launcher/session consumers without making it
#   an audit root. Retired lanes are normally removed outright instead.
