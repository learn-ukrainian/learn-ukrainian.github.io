# Area assignments registry — MUTABLE mapping of area -> driver_agent_type, slots roster.
# Replaces .agent/lane-assignments.md as machine authority (in later step).
# See #5281 / #5279 design decisions.
#
# Derivation rule: slots = provider identity functions × launcher_selector_resolve lanes;
# see scripts/lib/handoff_identity.sh — do not add rows without a mintable selector.
# Both directions are enforced by tests/test_handoff_slot_registry.py, and the launcher
# refuses a selector whose <provider>-<lane> slot is not listed here (#8303).

schema_version: 1
assignments:
  infra:
    driver_agent_type: infra-orchestrator
    slots:
      - claude-infra
      - codex-infra
      - gemini-infra
      - grok-infra
      - kimi-infra
      - cursor-infra
  devops:
    driver_agent_type: infra-orchestrator
    slots:
      - claude-devops
      - codex-devops
      - gemini-devops
      - grok-devops
      - kimi-devops
      - cursor-devops
  monitor:
    # Human name: Ops API + UI (#7919). Prefer Kimi for UI/design (dispatch --agent kimi);
    # keep slots empty so *-monitor phantoms alias to bare provider.
    driver_agent_type: infra-orchestrator
    slots: []
  harness:
    driver_agent_type: infra-orchestrator
    slots:
      - claude-corpus
      - codex-corpus
      - gemini-corpus
      - grok-corpus
      - kimi-corpus
      - cursor-corpus
  open-model-data:
    driver_agent_type: infra-orchestrator
    slots: []
  atlas:
    driver_agent_type: infra-orchestrator
    slots:
      - claude-atlas
      - codex-atlas
      - gemini-atlas
      - grok-atlas
      - kimi-atlas
      - cursor-atlas
  core:
    driver_agent_type: curriculum-orchestrator
    # Empty-roster recipient is <provider>-core. Selector curriculum-upgrade
    # mints that slot (launcher_stream_aliases.tsv, lane core, stream epic 7994).
    # Its file handoff stays .claude/curriculum-upgrade-epic/. core-quality
    # (epic 4274) is still a taxonomy alias and does not mint this slot.
    slots: []
  seminars:
    driver_agent_type: curriculum-orchestrator
    # Operator order 2026-09-27: "only claude, gpt and gemini should be involved
    # in ukrainian content. no other models allowed if it is about ukrainian
    # lang. culture, heritage."
    # NAME vs RESOLUTION (r2 ruling, #5889): these lane-named slots resolve
    # through the AREA's full epic union (see fleet_taxonomy.yaml → seminars:
    # epics 2836 folk + 4431/4215 bio + 3120/3079 cross), NOT a single lane.
    # So claude-folk and claude-bio both match ANY active seminars lease — a
    # delivery to claude-folk is pickable by a bio-track driver. The lane
    # suffix is an addressing hint only; do not narrow it without an
    # operator/advisor GO.
    slots:
      - claude-folk
      - codex-folk
      - gemini-folk
      - claude-bio
      - codex-bio
      - gemini-bio
  hramatka:
    driver_agent_type: curriculum-orchestrator
    # Same operator order applies to Ukrainian language content here.
    slots:
      - claude-hramatka
      - codex-hramatka
      - gemini-hramatka
