# Area assignments registry — MUTABLE mapping of area -> driver_agent_type, slots roster.
# Replaces .agent/lane-assignments.md as machine authority (in later step).
# See #5281 / #5279 design decisions.
#
# Derivation rule: slots = provider identity functions × launcher_selector_resolve lanes;
# see scripts/lib/handoff_identity.sh — do not add rows without a mintable selector.

schema_version: 1
assignments:
  infra:
    driver_agent_type: infra-orchestrator
    slots:
      - claude-infra
      - codex-infra
      - gemini-infra
      - grok-infra
      - kimi-infra
  devops:
    driver_agent_type: infra-orchestrator
    slots:
      - claude-devops
      - codex-devops
      - gemini-devops
      - grok-devops
      - kimi-devops
  harness:
    driver_agent_type: infra-orchestrator
    slots:
      - claude-corpus
      - codex-corpus
      - gemini-corpus
      - grok-corpus
      - kimi-corpus
  atlas:
    driver_agent_type: infra-orchestrator
    slots:
      - claude-atlas
      - codex-atlas
      - gemini-atlas
      - grok-atlas
      - kimi-atlas
  core:
    driver_agent_type: curriculum-orchestrator
    # no launcher selector mints a core slot (C7)
    slots: []
  seminars:
    driver_agent_type: curriculum-orchestrator
    # NAME vs RESOLUTION (r2 ruling, #5889): these lane-named slots resolve
    # through the AREA's full epic union (see fleet_taxonomy.yaml → seminars:
    # epics 2836 folk + 4431/4215 bio + 3120/3079 cross), NOT a single lane.
    # So claude-folk and claude-bio both match ANY active seminars lease — a
    # delivery to claude-folk is pickable by a bio-track driver. The lane
    # suffix is an addressing hint only; do not narrow it without an
    # operator/advisor GO.
    slots:
      - claude-folk
      - codex-folk
      - gemini-folk
      - grok-folk
      - kimi-folk
      - claude-bio
      - codex-bio
      - gemini-bio
      - grok-bio
      - kimi-bio
  hramatka:
    driver_agent_type: curriculum-orchestrator
    slots:
      - claude-hramatka
      - codex-hramatka
      - gemini-hramatka
      - grok-hramatka
      - kimi-hramatka
