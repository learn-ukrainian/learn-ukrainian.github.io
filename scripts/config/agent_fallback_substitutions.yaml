# Agent fallback substitution map — canonical source of truth.
# Consumed by /api/state/routing-budget and delegate.py --check-budget hard auto-sub.
# referenced by orchestrator routing decisions (MEMORY.md, this file).

# Machine-readable for hard auto-sub (when lane is near_cap, hot for a reason
# the pace rule still supports, or a routing pace deficit on a fresh snapshot:
# pace visible, projected to run out before reset, and |delta| > 2).
# Model rewrite for an explicit --model on these rows is
# model_catalog.yaml `budget_substitution_models` (#8855). This file stays
# agent→agent only.
dispatch_fallbacks:
  claude: codex
  # Mechanical shed when Codex is hot or in weekly deficit while free seats
  # (Cursor) sit idle — operator 2026-08-12 / stream #4707.
  codex: cursor
  # PERMANENT retirement, not a hot/deficit-only shed: the gemini CLI is not
  # supported and will not be installed (operator 2026-08-18). delegate.py
  # resolves this row UNCONDITIONALLY, before the budget guard even runs —
  # a "gemini is cool" budget reading is not proof the binary exists.
  # Canonical mapping lives in agent_runtime.agent_identity.RETIRED_AGENT_ALIASES;
  # this row keeps it visible to yaml-only consumers of dispatch_fallbacks.
  gemini: agy
  # PERMANENT retirement, not a hot/deficit-only shed: the z.ai GLM
  # subscription backing the glm lane is retired (key gone; operator
  # 2026-09-03). glm-5.3 work routes to cursor or OpenRouter instead.
  # Canonical mapping lives in agent_runtime.agent_identity.RETIRED_AGENT_ALIASES;
  # this row keeps it visible to yaml-only consumers of dispatch_fallbacks.
  glm: cursor
  # grok/cursor/kimi/agy: no automatic mapping without an explicit
  # operator comment (refuse dispatch when hot/deficit and no row here).
#
# Trigger condition: when a budget bucket is at status `near_cap`, `hot`
# (runtime headroom or a real pace deficit), or the shared pace rule says the
# lane will run out before reset outside the on-pace band, the orchestrator
# MUST use the substitution path below instead of draining the depleted
# bucket. A pace that is not yet visible, or whose |delta| is within 2 points,
# is not a deficit. Missing mapping → refuse unless --force-agent.
#
# Provenance: user direction 2026-05-13 — "you need to store this and add to
# router" (paste of the substitution table built during the budget-economics
# discussion that day). Capacity-first codex→cursor shed: operator 2026-08-12.

# Task-level Haiku selection uses catalog roles, never a blanket agent shed:
# routine_mechanical: mechanical_worker first, anthropic_practical fallback;
# mechanical_classification: mechanical_worker; readonly_recon: mechanical_worker
# alongside bounded_worker (Luna still needs its Sol envelope). Haiku is never a
# replacement for review, language, design/approval, security, driver or bounded code.
substitutions:
  - currently_uses: "routine lockfile, pointer and smoke tasks"
    fallback: "Resolve catalog role routine_mechanical: Haiku 5.5 first, Sonnet 5.5 fallback"
    budget_bucket: "Claude; provider health and quota must admit the selected route"

  - currently_uses: "delegate.py --agent claude (adversarial review)"
    fallback: 'Agent(subagent_type="general-purpose", model="opus")'
    fallback_note: "Agent tool subagents run as children of this session"
    budget_bucket: "interactive (orchestrator session, not programmatic)"

  - currently_uses: "delegate.py --agent claude (code dispatch >50 LOC)"
    fallback: |
      (a) Codex via `delegate.py --agent codex` (separate weekly quota), OR
      (b) inline by orchestrator if context-continuity gives it an edge
    budget_bucket: "Codex weekly quota OR interactive"

  - currently_uses: "ab ask-claude (one-shot consult)"
    fallback: |
      Orchestrator inline reasoning (orchestrator IS Claude), OR
      Agent(subagent_type="general-purpose", model="opus")
    budget_bucket: "interactive"

  - currently_uses: "ab discuss (Codex + Claude adversarial)"
    fallback: |
      Codex via `delegate.py --agent codex` + Agent subagent for Claude role,
      OR escalate to user for cold-start interactive Claude (highest-stakes
      adversarial dynamic only)
    budget_bucket: "Codex + interactive"

  - currently_uses: "delegate.py --agent codex"
    fallback: |
      When Codex is hot / near_cap / weekly deficit: hard auto-sub to
      `delegate.py --agent cursor` via dispatch_fallbacks (operator 2026-08-12).
      Otherwise Codex weekly quota is independent of Claude interactive.
    budget_bucket: "Codex weekly → Cursor when shed"

  - currently_uses: "delegate.py --agent gemini"
    fallback: |
      PERMANENT, always-on (not a budget-status shed): gemini CLI is
      retired and will not be reinstalled (operator 2026-08-18). Resolves
      to `delegate.py --agent agy` before Popen, via
      dispatch_fallbacks.gemini and agent_identity.RETIRED_AGENT_ALIASES.
      Do not tell agents to install `gemini` — the live Gemini-family
      implementer is agy.
    budget_bucket: "Gemini-family quota, tracked under agy"

  - currently_uses: "delegate.py --agent glm"
    fallback: |
      PERMANENT, always-on (not a budget-status shed): the z.ai GLM
      subscription is retired (key gone; operator 2026-09-03). Resolves to
      `delegate.py --agent cursor` before Popen, via dispatch_fallbacks.glm
      and agent_identity.RETIRED_AGENT_ALIASES. glm-5.3 work routes to
      cursor or OpenRouter; do not dispatch --agent glm unless the operator
      explicitly asks.
    budget_bucket: "glm quota (retired) → Cursor"

# Per the 2026-10-09 resource-policy order, native Claude CLI workers are
# eligible whenever task fit, provider health and subscription headroom admit
# them. Budget substitutions apply on depletion, not as a standing prohibition.
worker_resource_policy: |
  Sol is the default eligible code worker. Use native Claude CLI workers as
  heavily as their subscription allows, respecting task fit and hard gates.
  Cursor Grok or Gemini routes are language-free overflow only; resolve admitted
  models and transports from the live catalog, never infer route availability.
  Writer selection follows core rules and the canonical writer policy, with no
  excluded-writer recommendation in this substitution table.
