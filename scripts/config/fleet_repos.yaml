# Fleet repository allowlist — multi-repo dispatch (#672 P2.1)
#
# Keys are the only valid `--repo` values for `scripts/dispatch.py`.
# `local_name` is the sibling checkout beside the public primary, named by
# `local_name` (layout A).
#
# Control plane (batch_state, Monitor, fleet-comms) remains on the public
# primary that owns `scripts/dispatch.py`. `--repo` retargets git worktree
# creation and `gh` remotes only.
#
# `worktree_registry` (optional) names the repository's own worktree registry; see kube-dojo.
#
# `verdict_recorder` (required, boolean) says whether the repository's PRs carry
# review verdicts from scripts/review/record_cf_verdict.py. When true,
# `python -m scripts.publish pr-merge` refuses a head without a recorded
# exact-head cross-family APPROVE; when false, a head with no recorded verdict
# keeps the publisher's older behaviour.
#
# `required_workflow` (optional) is the workflow file whose failed PR or merge-queue run is the CI
# evidence for a repair-verification review round (scripts/review/repair_round.py); default
# `.github/workflows/ci.yml`.

version: 1

repos:
  public:
    github: learn-ukrainian/learn-ukrainian.github.io
    local_name: learn-ukrainian
    transport: ssh
    role: public-monorepo
    verdict_recorder: true
    default: true
  infra-private:
    github: learn-ukrainian/learn-ukrainian-infra-private
    local_name: learn-ukrainian-infra-private
    transport: https
    role: private-infra
    verdict_recorder: true
  hramatka:
    github: learn-ukrainian/hramatka
    local_name: hramatka
    transport: ssh
    role: private-product
    verdict_recorder: false
  # kube-dojo (#12499, plan approved under #12239). Both are public repositories, so their roles
  # deliberately avoid "public-monorepo" (learn-ukrainian-only audits, Kimi and DeepSeek admission)
  # and any "private" spelling (private-input and OPSEC private-repo handling).
  kube-dojo:
    github: kube-dojo/kube-dojo.github.io
    local_name: kube-dojo
    transport: https
    role: public-content
    verdict_recorder: true
    # Ignored registry in the repository's primary checkout, written by the dispatcher for every worktree
    # it creates or removes (kube-dojo docs/ops/workspace-hygiene.md); a path relative to that checkout.
    worktree_registry: .agent/workspace-hygiene.json
  kubedojo-labs:
    github: kube-dojo/kubedojo-labs
    local_name: kubedojo-labs
    transport: https
    role: public-labs
    verdict_recorder: true
  # machinery: the public machinery repository. Role avoids "public-monorepo" (learn-ukrainian-only
  # audits, Kimi and DeepSeek admission) and keeps the "public-" prefix for publisher privacy handling.
  machinery:
    github: learn-ukrainian/machinery
    local_name: machinery
    transport: https
    role: public-machinery
    verdict_recorder: true
    required_workflow: .github/workflows/ci-gate.yml
  # Private sibling. The private- role prefix is what OPSEC and the publisher
  # read as visibility. The row otherwise matches kubedojo-labs.
  mnq-orb:
    github: krisztiankoos/mnq-orb
    local_name: mnq-orb
    transport: https
    role: private-labs
    verdict_recorder: true
