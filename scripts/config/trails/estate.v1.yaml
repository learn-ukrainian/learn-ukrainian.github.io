schema_version: estate-registry.v1
version: "1.0.0"
title: Estate surface registry seed
surfaces:
  vps_hosts:
    - name: estate-probe-vps
      ssh_alias: estate-probe-ssh
      role: probe_role
      mutation_policy: refused
  services:
    - name: estate-probe-service
      host_alias: estate-probe-ssh
      systemd_unit: estate-probe-unit
      mutation_policy: refused
  repositories:
    - name: estate-probe-private-repo
      local_path: ~/projects/estate-probe-private
      visibility: private
      mutation_policy: refused
  public_sites:
    - name: public-site
      url: https://learn-ukrainian.github.io/
      mutation_policy: refused
  worktrees:
    - surface_id: worktree-list
      path_pattern: ".worktrees/*"
      mutation_policy: judgment_only
  branches:
    - surface_id: git-branches
      scope: local_and_remote
      mutation_policy: judgment_only
  babysit_files:
    - surface_id: babysit-file
      path_pattern: "batch_state/babysit/*"
      mutation_policy: judgment_only
  dispatch_tasks:
    - surface_id: dispatch-task-queue
      mutation_policy: judgment_only
refused_mutation_surfaces:
  - estate-probe-vps
  - estate-probe-service
  - estate-probe-private-repo
  - public-site
