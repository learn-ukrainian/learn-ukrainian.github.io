# Stress overrides: lemma -> stressed form (with combining acute accent)
# Add entries here when ukrainian_word_stress produces wrong stress.
# Vocab files contain lemmas (dictionary forms), so stress errors are rarer
# than with arbitrary inflected text.
#
# Format:  word: "wó̤rd"  (combining acute U+0301 after stressed vowel)
любов: "любо́в"
разом: "ра́зом"
марко: "Марко́"
уроці: "уро́ці"
фемінітиви: "фемініти́ви"
фемінітивом: "фемініти́вом"
# Dual-packed ULIF readings where the last marked vowel is not the
# pedagogical A1 form (school dual-stress lists; first syllable is preferred).
завжди: "за́вжди"
також: "та́кож"
# ULIF trie has no entry at all for "її" (genitive/accusative of "вона";
# indeclinable possessive pronoun) in any casing — #7994. Fixed final-syllable
# stress (ї-ї́), same pattern as other oblique personal-pronoun forms the
# trie does cover (мене́, тебе́). Override lookup is exact-string, not
# casefolded (see stress.py's _load_overrides), so both castings are listed
# explicitly to cover mid-sentence "її" and sentence-initial "Її".
її: "її́"
Її: "Її́"
# ULIF packs Fem "family" (сім'я́, end-stress) and Neut "seed" (сі́м'я) under
# the same surface. Ambiguous verify_stress returns Neut first; annotator then
# picks matches[0] and fails A1 pedagogy / slow nightly (#8082). Prefer Fem.
сім'я: "сім'я́"
