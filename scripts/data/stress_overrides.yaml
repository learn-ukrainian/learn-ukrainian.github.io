# Stress overrides: lemma -> stressed form (with combining acute accent)
# Add entries here when ukrainian_word_stress produces wrong stress.
# Vocab files contain lemmas (dictionary forms), so stress errors are rarer
# than with arbitrary inflected text.
#
# Format:  word: "wó̤rd"  (combining acute U+0301 after stressed vowel)
любов: "любо́в"
разом: "ра́зом"
марко: "Марко́"
уроці: "уро́ці"
фемінітиви: "фемініти́ви"
фемінітивом: "фемініти́вом"
# Dual-packed ULIF readings where the last marked vowel is not the
# pedagogical A1 form (school dual-stress lists; first syllable is preferred).
завжди: "за́вжди"
також: "та́кож"
# ULIF trie has no entry at all for "її" (genitive/accusative of "вона";
# indeclinable possessive pronoun) in any casing — #7994. Fixed final-syllable
# stress (ї-ї́), same pattern as other oblique personal-pronoun forms the
# trie does cover (мене́, тебе́). Override lookup is exact-string, not
# casefolded (see stress.py's _load_overrides), so both castings are listed
# explicitly to cover mid-sentence "її" and sentence-initial "Її".
її: "її́"
Її: "Її́"
# sources MCP search_definitions: СУМ-11 "він" id 13932 and "воно" id
# 15081 both give "його́"; verify_stresses returned the wrong "йо́го".
# stress.py keys are exact-case, so sentence-initial casing needs its own key.
його: "його́"
# Same СУМ-11 entries (ids 13932, 15081); exact-case lookup.
Його: "Його́"
# sources MCP search_definitions: СУМ-11 "він" id 13932 includes "йому́";
# verify_stresses returned not_found for the VESUM dative form.
йому: "йому́"
# sources MCP search_definitions: СУМ-11 "він" id 13932 and "воно"
# id 15081 explicitly give prepositional "ньо́го"; trie: not_found.
нього: "ньо́го"
# sources MCP search_definitions: СУМ-11 "переді" id 67992: "ПЕ́РЕДІ";
# verify_stresses returned packed "пе́ре́ді".
переді: "пе́реді"
# sources MCP search_definitions: СУМ-11 "межи" id 47773: "МЕЖИ́";
# verify_stresses returned packed "ме́жи́".
межи: "межи́"
# sources MCP search_definitions: СУМ-11 "піді" id 72376: "ПІ́ДІ";
# verify_stresses returned not_found.
піді: "пі́ді"
# ULIF packs Fem "family" (сім'я́, end-stress) and Neut "seed" (сі́м'я) under
# the same surface. Ambiguous verify_stress returns Neut first; annotator then
# picks matches[0] and fails A1 pedagogy / slow nightly (#8082). Prefer Fem.
сім'я: "сім'я́"
# Title-case Київ is correct (Ки́їв); lowercase trie returns киї́в (#7994 scar).
# Annotator casefolds before lookup, so without this override it rewrites capital Kyiv wrong.
київ: "ки́їв"
