[run]
branch = true
core = ctrace
patch = subprocess
parallel = true
# Subprocess startup can happen below the repository root. Preserve the origin
# in raw data; combine enables relative_files and applies these aliases.
# https://coverage.readthedocs.io/en/7.16.2/config.html#paths
relative_files = false
source =
    scripts
    .mcp
    agents_extensions
    packages
# Jinja2 compiles a template to Python code whose filename is the .j2 path, and
# the inbox-hook test compiles the hook's embedded Python under the .sh path.
# Neither is Python source we report. combine also classifies any non-.py
# measured path as non-reportable, so older raw data stays honest.
# https://coverage.readthedocs.io/en/7.16.2/config.html#run-omit
omit =
    *.j2
    *.sh

[paths]
scripts =
    scripts/
    */scripts/
mcp =
    .mcp/
    */.mcp/
agents_extensions =
    agents_extensions/
    */agents_extensions/
packages =
    packages/
    */packages/

[report]
fail_under = 0

[json]
pretty_print = true
