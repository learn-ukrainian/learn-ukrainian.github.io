[run]
branch = true
core = ctrace
patch = subprocess
parallel = true
# Subprocess startup can happen below the repository root. Preserve the origin
# in raw data; combine enables relative_files and applies these aliases.
# https://coverage.readthedocs.io/en/7.16.2/config.html#paths
relative_files = false
source =
    scripts
    .mcp
    agents_extensions
    packages

[paths]
scripts =
    scripts/
    */scripts/
mcp =
    .mcp/
    */.mcp/
agents_extensions =
    agents_extensions/
    */agents_extensions/
packages =
    packages/
    */packages/

[report]
fail_under = 0

[json]
pretty_print = true
