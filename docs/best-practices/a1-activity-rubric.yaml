- id: A1-ACT-005
  type: error-correction
  verdict: conditional
  placement: workbook
  conditions: Bind one applicable E-record and one already taught contrast. Identify the error span for correction
    selection or supply; the carrier sentence uses taught vocabulary and grammar. Options mode has one defensible
    offered repair; supply mode requires an already practised repair, with context excluding competing repairs because
    the schema key holds one correction. Independently finding an error in an unmarked sentence adds a separate
    detection demand and is not admitted by this adaptation. Preserve item-specific feedback explaining the recorded
    cause and why the repair resolves it in context.
