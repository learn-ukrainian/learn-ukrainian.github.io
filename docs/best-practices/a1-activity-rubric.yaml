support: A1 English scaffolding follows the existing immersion payload intentionally. Neither rubric adoption nor
  support/scaffold labels alter placement, counts or immersion.
source_gaps:
- 'Drive-held university foreign-student books: unavailable, not consulted; no ingestion/recovery under #10109.'
- Correction and repetition use retrieved method witnesses with the limited adaptations below; no witness establishes
  causal effectiveness or automatic learner success.
- Primer section metadata and printed pages differ as recorded; do not silently substitute physical-page citations.
- DF 12.1 task 5 is a grammatical-discrimination comparator, not a verified direct bin-sorting task.
- Remote media metadata and publisher embeds establish availability evidence, not playback, target fidelity or learner
  pronunciation. Each actual required clip still needs those content checks before use.
