    listening or pronunciation proof. Actual target suitability and downstream assessment remain reviewer judgments;
    causal effectiveness and automatic success remain unverified.'
sources:
  POLICY:
    role: P
    title: Fresh A1 activity and review contracts
    locator: docs/best-practices/activity-pedagogy.md §2; docs/style-cards/a1.md §5; docs/epics/fresh-build-review-contracts.md
      Contract 1 and Contract 2; schemas/fresh-activity-constraints-v1.json
    limit: Repository admission, scope, feedback and support policy; not learning-effectiveness evidence.
  DF-1:
    role: S
    title: Dobra Forma, University of Kansas Ukrainian Language Program
    locator: docs/references/dobra-forma/chapters/1.2.md tasks 1–5 and final test
    url: https://opentext.ku.edu/dobraforma/chapter/1-2/
    limit: Retrieved adult English-speaker L2 noticing (task 1), heard completion/selection (tasks 2 and 5) and
      contextual completion (tasks 3–4 and final test). No matching or phrase-bank witness; no permission for untaught
      grammar or causal effectiveness claim.
  DF-2:
    role: S
    title: Dobra Forma
    locator: docs/references/dobra-forma/chapters/2.3.md tasks 1, 2, 4, 6–7
    url: https://opentext.ku.edu/dobraforma/chapter/2-3/
    limit: Model followed by contextual practice, not evidence for scored observation.
  DF-3:
    role: S
    title: Dobra Forma
    locator: docs/references/dobra-forma/chapters/5.1.md task 5
    url: https://opentext.ku.edu/dobraforma/chapter/5-1/
    limit: Actual task sequences telephone-dialogue lines; its subsequent grammatical marking is not part of the
      A1 ordering adaptation.
  DF-4:
    role: S
    title: Dobra Forma
    locator: docs/references/dobra-forma/chapters/7.3.md task 1
    url: https://opentext.ku.edu/dobraforma/chapter/7-3/
    limit: Actual task orders words into a natural utterance and follows with comprehension; no claim that one order
      always exhausts acceptable Ukrainian orders.
  DF-5:
    role: A
    title: Dobra Forma
    locator: docs/references/dobra-forma/chapters/12.1.md task 5
    url: https://opentext.ku.edu/dobraforma/chapter/12-1/
    limit: Actual task distinguishes single versus multiple referents from heard forms. Comparator for grammatical
      discrimination; adapting this listening decision to record-bound sorting bins still requires independent judgment.
      Not a verified direct drag-to-bin task.
  DF-6:
    role: S
    title: Dobra Forma
    locator: docs/references/dobra-forma/chapters/7.3.md task 7
    url: https://opentext.ku.edu/dobraforma/chapter/7-3/
    limit: Actual task judges statements against a dialogue; neither general-fact recall nor permission to reuse
      its grammar early.
  OHO-1:
    role: S
    rights: owned_cite_only
    title: Oho! Ukrainian Grammar & Workbook A1
    locator: owned-oho-a1-workbook_f1_p0038_c0001
    limit: Retrieved method witness for matching; title and locator only, no excerpts.
  OHO-2:
    role: S
    rights: owned_cite_only
    title: Oho! Ukrainian Grammar & Workbook A1
    locator: owned-oho-a1-workbook_f1_p0098_c0001, exercise/audio references 38.4–38.7
    limit: Retrieved contextual completion method; title and locator only, no excerpts. Not permission for untaught
      grammar.
  ULP-1:
    role: S
    rights: owned_cite_only
    title: Ukrainian Lessons Podcast — Season 1 lesson notes
    locator: Lesson 10, ulp-1-00-lesson-notes_l0010_w003
    limit: Retrieved translation-instruction method; title and locator only, no excerpts.
  PR-1:
    role: A
    title: Zaharijchuk primer, 2025, part 1
    locator: 1-klas-bukvar-zaharijchuk-2025-1_s0054; section metadata page 58, printed page 56
    limit: Actual letter-puzzle word construction. Adapt to adult L2 by using introduced words with a meaningful
      contextual cue rather than child narrative or arbitrary manipulation. Witness, not adult-L2 effectiveness
      proof.
  PR-2:
    role: A
    title: Zaharijchuk primer, 2025, part 1
    locator: 1-klas-bukvar-zaharijchuk-2025-1_s0053; section metadata page 57, printed page 55; _s0014, metadata
      page 17, printed page 15
    limit: Actual oral picture-name segmentation and discrimination. Adult L2 adaptation uses known sourced words,
      explicitly taught criteria and complete feedback; counting and multiple-index selection are adaptations, not
      exact task matches. Images were not retrieved.
  PR-3:
    role: A
    title: Zaharijchuk primer, 2025, part 1
    locator: 1-klas-bukvar-zaharijchuk-2025-1_s0014; section metadata page 17, printed page 15
    limit: Actual picture-name initial-sound discrimination. Adapt to adult L2 through established Ukrainian naming
      and a taught sound–letter mapping; an emoji alone cannot establish the name. Images were not retrieved.
  ORTH-63:
    role: S
    title: Ukrainian Orthography, 2019
    locator: §63, pp. 93–95, official authorized edition, Naukova Dumka
    url: https://www.ulif.org.ua/system/files/pravopus-new.pdf
    limit: Normative line-transfer restrictions; line transfer and oral syllable segmentation must not be equated.
      Not L2 method evidence.
  DF-MATCH:
    role: S
    title: Dobra Forma
    locator: docs/references/dobra-forma/chapters/7.3.md task 5
    url: https://opentext.ku.edu/dobraforma/chapter/7-3/
    limit: Retrieved relationship-to-definition matching instruction; its grammar must be taught before use. Not
      an effectiveness study or direct witness for every matching relation.
  DF-QA:
    role: A
    title: Dobra Forma
    locator: docs/references/dobra-forma/chapters/1.2.md task 5
    url: https://opentext.ku.edu/dobraforma/chapter/1-2/
    limit: Retrieved heard-question response selection. Adapting selection to question/answer pairing in columns
      requires independent judgment; not a direct matching task.
  DF-PHRASES:
    role: A
    title: Dobra Forma
    locator: docs/references/dobra-forma/chapters/1.2.md tasks 1 and 3
    url: https://opentext.ku.edu/dobraforma/chapter/1-2/
    limit: Contextual dialogue models followed by completion; adapt models to grouped phrases supporting later selection
      or use. No retrieved direct phrase-table task or phrase-bank effectiveness evidence.
  OHO-CORR:
    role: A
    rights: owned_cite_only
    title: Oho! Ukrainian Grammar & Workbook A1
    locator: owned-oho-a1-workbook_f1_p0096_c0001
    limit: Retrieved method comparator; title and locator only, no excerpts. Row-specific adaptation and limits
      stated in grounding_reason; no causal effectiveness claim.
  OHO-REPEAT:
    role: A
    rights: owned_cite_only
    title: Oho! Ukrainian Grammar & Workbook A1
    locator: owned-oho-a1-workbook_f1_p0024_c0001; owned-oho-a1-workbook_f1_p0028_c0001
    limit: Retrieved method comparator; title and locator only, no excerpts. Row-specific adaptation and limits
      stated in grounding_reason; no causal effectiveness claim.
  OHO-MULTI:
    role: S
    rights: owned_cite_only
    title: Oho! Ukrainian Grammar & Workbook A1
    locator: owned-oho-a1-workbook_f1_p0035_c0001
    limit: Retrieved method comparator; title and locator only, no excerpts. Row-specific adaptation and limits
      stated in grounding_reason; no causal effectiveness claim.
  ULP-VIDEO:
    role: S
    title: 'Ukrainian Alphabet: Full Guide with Examples and Pronunciation — Ukrainian Lessons'
    locator: 'Introduction before the individual-letter sections: video listening/repetition instruction; individual-letter
      publisher embeds'
    url: https://www.ukrainianlessons.com/ukrainian-alphabet/
    limit: Public video repetition instruction, not experimental effectiveness evidence. Publisher embed and HTTP
      200 oEmbed metadata were retrieved for existing clip 7UsFBgSL91E; this does not verify playback or any particular
      lesson target. No source phonetic explanation is adopted as normative proof.
  MEDIA-POLICY:
    role: P
    title: Existing fresh-build remote-video contracts
    locator: schemas/activities-a1.schema.json#/definitions/watch-and-repeat-a1; docs/epics/fresh-build-writer-contract.md
      §1b and §4; scripts/curriculum/evidence/verify.py remote video URL checks
    limit: Existing URL/identifier and bound-record operations, not a requirement to host or copy media. URL availability
      checks do not establish target fidelity, playback or learning effectiveness.
