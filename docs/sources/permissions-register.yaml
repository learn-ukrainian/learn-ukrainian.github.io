    contact:
      route: Марія Шведова, project lead (communication)
      email: corpus.textiv@gmail.com
      url: https://uacorpus.org/informaciya-pro-grak/rozrobniki
      source_url: https://uacorpus.org/informaciya-pro-grak/rozrobniki — «Марія Шведова – Керівниця проєкту… комунікацію (corpus.textiv@gmail.com)»
