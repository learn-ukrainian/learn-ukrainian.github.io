        - id: inmo_sum11_edition
          quote: >-
            Створений кількома поколіннями лексикографів Інституту мовознавства ім. О. О. Потебні
            (А. А. Бурячок … Л. А. Юрчук та ін. – загалом понад 50 укладачів і редакторів).
            Паперовий оригінал вийшов у 11-ти томах (1970–1980).
          url: https://www.inmo.org.ua/sum.html
          read_on: "2026-09-27"
