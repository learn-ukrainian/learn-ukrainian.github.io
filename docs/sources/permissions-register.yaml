- id: ulif
  permission_status: verbal-granted-written-pending
  permission_note: ULIF gave verbal permission (2026-10, per the operator); written confirmation pending.
  name: «Словники України» online (DictUA) — paradigm, synonym, antonym and phraseology tabs
  organisation: Український мовно-інформаційний фонд НАН України (УМІФ / ULIF)
  role: 'Stress, paradigms, grammar labels, homonym/sense hints, synonyms, antonyms and phraseology for word cards;
    the harvest is #8400.'
  fields_used:
  - corroboration_reference
  - headword
  - stress
  - grammatical_label
  - paradigm
  - homonym_sense_gloss
  - synonym_groups
  - antonym_pairs
  - phraseology
  appears_in:
  - internal
  - site
  - dataset
  appears_note: scripts/lexicon/enrich_manifest.py fills synonyms, antonyms and stress from ulif_dictua_* with ULIF_DICTUA_LABEL;
    the 2026-09-11 manifest predates most of the harvest (one ULIF-labelled payload in the atlas.db public-route
    payloads of the 2026-09-11 manifest, published as the atlas-manifest release asset; counted 2026-09-28).
  stored_in:
  - data/sources.db ulif_dictua_entries, ulif_dictua_sections
  - data/lexicon/cache/ulif_raw.sqlite ulif_dictua_raw_responses
  - data/atlas.db / site lexicon shards (scripts/atlas/export_runtime_shards.py writes each public payload_json into
    the shards; the 2026-09-11 build carries one ULIF-labelled payload and no ULIF-labelled synonym, antonym or
    idiom section — see appears_note)
  provenance:
    urls:
    - https://lcorp.ulif.org.ua/dictua/
    retrieved: '2026-09-27'
    retrieved_evidence: 'sources.db ulif_dictua_entries.retrieved_at spans 2026-07-15 to 2026-09-27 (harvest #8400,
      ongoing).'
  terms:
    found: true
    licence:
      name: All rights reserved (© ULIF); no open licence found
      spdx: null
      verbatim_quote: null
    conditions:
      share_alike: null
      non_commercial: null
      other:
      - Sui generis database right (Law 2811-IX Art. 21) applies to extraction and re-use of substantial parts.
      - Harvest runs at one request per second with an identifying non-commercial user agent (fetch_ulif_homonyms.py).
    quotes:
    - id: ulif_portal_footer
      quote: '"Словники України online" розроблено на основі CD-версії 3.2 (2008р.) © ULIF, 2001-2026'
      gloss_en: Copyright notice only; no licence or terms-of-use page is linked from the portal.
      url: https://lcorp.ulif.org.ua/dictua/
      read_on: '2026-09-27'
    - id: ulif_mirrors_notice
      quote: ШАНОВНІ КОРИСТУВАЧІ! Вебсайти на кшталт goroh.pp.ua, sum.in.ua, slovnyk.me використовують електронні
        версії "Словника української мови" та "Словника української мови в 20 томах" неправомірно, не вказуючи авторів!
      gloss_en: ULIF states that goroh.pp.ua, sum.in.ua and slovnyk.me use СУМ and СУМ-20 unlawfully, without naming
        the authors.
      url: https://www.ulif.org.ua/koristuities-dostovirnimi-dzhierielami
      read_on: '2026-09-27'
    searched:
    - https://lcorp.ulif.org.ua/dictua/ (footer; only links Pro_Systemu.pdf, Instruction_Dict_Of_Ukraine_3.2.pdf,
      the notice)
    - https://lcorp.ulif.org.ua/robots.txt (returned an access-restricted page)
    - https://www.ulif.org.ua/contacts
    - services.ulif.org.ua (timed out)
