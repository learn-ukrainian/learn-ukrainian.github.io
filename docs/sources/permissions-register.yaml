          url: https://www.inmo.org.ua/sum.html
          read_on: "2026-09-27"
      searched:
        - https://www.inmo.org.ua/sum.html (no licence text)
        - https://sum.in.ua/ (unreachable; Wayback 2026-01-03 footer «© 2023, Webmezha», no terms page)
    licence:
      name: >-
        In copyright — co-authored work, 70 years after the last co-author's death (Art. 31(4));
        LICENSE-CONTENT.md and scripts/audit/source_license_map.json call it public domain, which is wrong.
      spdx: null
    conditions:
      attribution: >-
        Словник української мови: в 11 томах. АН УРСР, Інститут мовознавства ім. О. О. Потебні.
        Київ: Наукова думка, 1970–1980. Т. <vol>, с. <page> — quoted, red-flagged, always with the modern norm in the same sentence.
      share_alike: null
      non_commercial: null
      other:
        - Our copy comes from an aggregator of the sum.in.ua text, which ULIF names as unlawful; verify each quoted passage against the official edition (inmo.org.ua/sum.html) before display.
    permissions:
      - fields: [russification_quote, russification_pair]
        scale: quotation
        note: One short quoted СУМ-11 passage per flagged entry, inside our critical commentary.
        uses:
          acquire: {status: assessed, basis: "Normal use of the official edition for checking each quoted passage.", terms_refs: [law_art26_normal_use]}
          store: {status: assessed, basis: "The passage is kept with its citation as part of our commentary.", terms_refs: [law_art22_quotation]}
          transform: {status: assessed, basis: "Quoted verbatim inside our own contrastive analysis; boundaries marked.", terms_refs: [law_art22_quotation]}
          display: {status: assessed, basis: "Quotation for a critical/polemical purpose (exposing russification), author and source named, boundaries marked.", terms_refs: [law_art22_quotation]}
          redistribute: {status: unknown, basis: "An opt-in dataset subset of quotations is systematic re-use; HELD until the Інститут мовознавства answers (outreach/inmo.md)."}
      - fields: [russification_quote, russification_pair]
        scale: bulk
        note: The full sum11 table used to find candidates.
        uses:
          acquire: {status: assessed, basis: "Extraction for research into russification, source cited, non-commercial; copy from an unauthorised aggregator is a residual risk.", terms_refs: [law_art26_education_extraction]}
          store: {status: assessed, basis: "Private store only.", terms_refs: [law_art26_education_extraction]}
          transform: {status: assessed, basis: "Internal comparison with modern sources to find candidates.", terms_refs: [law_art26_education_extraction]}
          display: {status: unknown, basis: "Never displayed at bulk scale (rule #M-6). HELD."}
          redistribute: {status: unknown, basis: "Never redistributed at bulk scale. HELD."}
    open_questions:
      - Will the Інститут мовознавства permit the opt-in russification-evidence dataset subset (contrastive pairs with short quotations)?
      - Replace the aggregator copy with passages checked against the official edition.
    contact:
      route: Інститут мовознавства ім. О. О. Потебні НАН України — email or quick contact form
      email: inmo2006@ukr.net
      url: https://www.inmo.org.ua/sum.html
      source_url: >-
