# Source permissions register (#8979) — machine-readable.
# Human-readable twin: docs/sources/permissions-register.md (read it first).
# Schema: schemas/permissions-register.schema.json; test: tests/validate/test_permissions_register.py.
#
# One row per (source, fields, scale); every row states every use.
#   permitted — the rights holder's own published licence/terms (quoted in `terms`) or its
#               direct written permission grants the use.
#   assessed  — no grant; the project relies on the basis written in `basis`: a statute
#               (quoted in `legal_references`), public-domain status, the project's own work,
#               or, for internal preparation only, the operator's recorded risk decision.
#   unknown   — nobody has granted or assessed it. HELD: the use does not happen.
#   refused   — the rights holder's terms or answer forbid it. HELD.
# Scales: lookup = per-entry reads for checking; quotation = one short, attributed,
#   marked excerpt; bulk = a substantial part, or systematic per-entry use across the lexicon.
# This register is not legal advice (non-goal of #8979); `assessed` is the project's own reading.

schema_version: 1
register_date: "2026-09-27"
uses: [acquire, store, transform, display, redistribute]
statuses: [permitted, assessed, unknown, refused]
scales: [lookup, quotation, bulk]

gates:
  site_display:
    use: display
    publish_if: [permitted, assessed]
    description: >-
      A field reaches a learner-facing page (Word Atlas, practice, lessons) only if the
      `display` status of its (source, field, scale) row is permitted or assessed.
  dataset_and_atlas_export:
    use: redistribute
    publish_if: [permitted, assessed]
    description: >-
      One gate for the open dataset AND the off-site Atlas export/API (bulk-downloadable, so it
      is redistribution): a field ships only if its `redistribute` status is permitted or
      assessed. The export may not carry a field the dataset could not (Fable, #8976).

legal_references:
  - id: law_art21_sui_generis
    quote: >-
      Виробнику бази даних, крім бази, створеної для систематизації даних, що є публічною
      інформацією відповідно до Закону України "Про доступ до публічної інформації", який
      зробив якісно та/або кількісно значний внесок в отримання, перевірку чи подання вмісту
      бази даних, для запобігання вилученню та/або повторному використанню - будь-якому
      наданню невизначеному колу осіб повного вмісту бази даних або значної її частини у
      якісному чи кількісному вимірі, на таку базу даних надається право особливого роду
      (sui generis).
    gloss_en: >-
      Art. 21(4), Law 2811-IX: a database maker with a substantial investment gets a sui
      generis right against extraction and re-use (making the whole or a substantial part
      available to the public); 15-year term from creation/publication, renewed by
      substantial changes (Art. 21(7)-(8)).
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"
  - id: law_art26_normal_use
    quote: >-
      здійснювати будь-які дії, необхідні для забезпечення доступу до вмісту бази даних та
      нормального використання цього вмісту з тієї метою, для якої законний користувач
      правомірно отримав копію бази даних
    gloss_en: Art. 26(1)(1) — a lawful user may do what is needed to access and normally use the content.
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"
  - id: law_art26_insubstantial
    quote: >-
      Законний користувач бази даних має право вилучати та/або повторно використовувати для
      будь-яких цілей незначні у якісному чи кількісному вимірі частини вмісту бази даних без
      згоди виробника такої бази даних
    gloss_en: Art. 26(2) — insubstantial parts may be extracted and re-used for any purpose.
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"
  - id: law_art26_education_extraction
    quote: >-
      вилучення для цілей ілюстрації в освітній або науковій діяльності, за умови зазначення
      джерела і здійснення цих дій за умов, що вони не мають самостійного економічного
      значення
    gloss_en: >-
      Art. 26(3)(2) — EXTRACTION (not re-use) of a substantial part of a non-original
      database is allowed for illustration in education or research, source cited, no
      independent economic significance. Publishing (re-use) is not covered.
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"
  - id: law_art26_systematic
    quote: >-
      Не дозволяється багаторазове та систематичне вилучення і повторне використання
      незначних частин вмісту бази даних, що включає дії, які суперечать нормальному
      використанню бази даних чи які невиправдано завдають шкоди законним інтересам
      розробника такої бази даних.
    gloss_en: >-
      Art. 26(4) — repeated, systematic extraction/re-use of insubstantial parts is not
      allowed; per-card display across the whole lexicon is therefore treated as bulk.
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"
  - id: law_art22_quotation
    quote: >-
      Без дозволу суб’єктів авторського права і безоплатно, але із зазначенням імені автора і
      джерела запозичення, допускається: 1) використання цитат, включаючи їх переклад з інших
      мов, з правомірно опублікованих творів, ... якщо це зумовлено критичним, полемічним,
      науковим або інформаційним характером твору (повідомлення), до якого цитати
      включаються, із семантичним та/або графічним виділенням меж цитати
    gloss_en: >-
      Art. 22(2)(1) — quotation without permission, naming author and source, where the
      quoting work is critical, polemical, scientific or informational, with the quotation's
      boundaries marked.
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"
  - id: law_art22_tdm
    quote: >-
      виготовлення копій творів, що зроблені із законного джерела з метою пошуку тексту і даних,
      включених до наукових публікацій або пов’язаних з ними, для дослідницьких цілей. Це
      положення застосовується за умови, що використання творів не було прямо заборонено
      суб’єктами авторського права відповідним чином, зокрема за допомогою засобів, придатних для
      зчитування комп’ютером
    gloss_en: >-
      Art. 22(2)(14) — text-and-data-mining copies from a lawful source, for research tied to
      scientific publications, unless the rights holder opted out (also machine-readably).
      Narrow: it does not cover a learner product, and not copies from unlawful mirrors.
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"
  - id: law_art31_term
    quote: >-
      Строк чинності майнових прав інтелектуальної власності на твір спливає через 70 років,
      що обчислюються з 1 січня року, наступного за роком смерті автора ... Строк чинності
      майнових прав інтелектуальної власності на твір, створений у співавторстві, спливає
      через 70 років, що обчислюються з 1 січня року, наступного за роком смерті останнього
      співавтора.
    gloss_en: 'Art. 31(2),(4) — life + 70 years; co-authored works: 70 years after the last co-author''s death.'
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"
  - id: law_art32_public_domain
    quote: >-
      Закінчення строку чинності майнових прав на твір означає перехід твору у суспільне
      надбання. Твори, які стали суспільним надбанням, можуть вільно, без сплати винагороди,
      використовуватися будь-якою особою, за умови дотримання особистих немайнових прав
      автора, передбачених статтею 11 цього Закону.
    gloss_en: Art. 32(3) — expired works enter the public domain; free use, moral rights (e.g. attribution) kept.
    url: https://zakon.rada.gov.ua/laws/show/2811-20/print
    read_on: "2026-09-27"

sources:
  # ---------------------------------------------------------------- ULIF
  - id: ulif
    name: «Словники України» online (DictUA) — paradigm, synonym, antonym and phraseology tabs
    organisation: Український мовно-інформаційний фонд НАН України (УМІФ / ULIF)
    role: >-
      Stress, paradigms, grammar labels, homonym/sense hints, synonyms, antonyms and
      phraseology for word cards; the harvest is #8400.
    fields_used:
      - corroboration_reference
      - headword
      - stress
      - grammatical_label
      - paradigm
      - homonym_sense_gloss
      - synonym_groups
      - antonym_pairs
      - phraseology
    stored_in:
      - data/sources.db ulif_dictua_entries, ulif_dictua_sections
      - data/lexicon/cache/ulif_raw.sqlite ulif_dictua_raw_responses
      - data/atlas.db / site lexicon shards (synonyms, antonyms, idioms already exported — see md § Findings)
    terms:
      found: true
      quotes:
        - id: ulif_portal_footer
          quote: '"Словники України online" розроблено на основі CD-версії 3.2 (2008р.) © ULIF, 2001-2026'
          gloss_en: Copyright notice only; no licence or terms-of-use page is linked from the portal.
          url: https://lcorp.ulif.org.ua/dictua/
          read_on: "2026-09-27"
        - id: ulif_mirrors_notice
          quote: >-
            ШАНОВНІ КОРИСТУВАЧІ! Вебсайти на кшталт goroh.pp.ua, sum.in.ua, slovnyk.me
            використовують електронні версії "Словника української мови" та "Словника
            української мови в 20 томах" неправомірно, не вказуючи авторів!
          gloss_en: ULIF states that goroh.pp.ua, sum.in.ua and slovnyk.me use СУМ and СУМ-20 unlawfully, without naming the authors.
          url: https://www.ulif.org.ua/koristuities-dostovirnimi-dzhierielami
          read_on: "2026-09-27"
      searched:
        - https://lcorp.ulif.org.ua/dictua/ (footer; only links Pro_Systemu.pdf, Instruction_Dict_Of_Ukraine_3.2.pdf, the notice)
        - https://lcorp.ulif.org.ua/robots.txt (returned an access-restricted page)
        - https://www.ulif.org.ua/contacts
        - services.ulif.org.ua (timed out)
    licence:
      name: All rights reserved (© ULIF); no open licence found
      spdx: null
    conditions:
      attribution: >-
        «Словники України online», Український мовно-інформаційний фонд НАН України,
        https://lcorp.ulif.org.ua/dictua/ (entry reference and retrieval date per field)
      share_alike: null
      non_commercial: null
      other:
        - Sui generis database right (Law 2811-IX Art. 21) applies to extraction and re-use of substantial parts.
        - Harvest runs at one request per second with an identifying non-commercial user agent (fetch_ulif_homonyms.py).
    permissions:
      - fields: [corroboration_reference]
        scale: bulk
        note: >-
          ULIF as corroboration: a fact carried by an open source (e.g. VESUM stress/POS) is
          published under that source's licence, and the card only records "ULIF agrees"
          with the ULIF entry reference. No ULIF content is re-used.
        uses:
          acquire: {status: assessed, basis: "Extraction for educational illustration, source cited, non-commercial.", terms_refs: [law_art26_education_extraction]}
          store: {status: assessed, basis: "Private store of the extracted copy; same basis as acquire.", terms_refs: [law_art26_education_extraction]}
          transform: {status: assessed, basis: "Comparison against open sources to produce our own agreement flag.", terms_refs: [law_art26_education_extraction]}
          display: {status: assessed, basis: "Only a citation and our own agree/disagree flag are shown; no ULIF content is re-used."}
          redistribute: {status: assessed, basis: "Only the citation and our own flag ship; the underlying fact ships under the open source's licence."}
      - fields: [headword, stress, grammatical_label, paradigm, homonym_sense_gloss, synonym_groups, antonym_pairs, phraseology]
        scale: bulk
        note: ULIF-only data at scale — the whole harvest, or per-card display across the lexicon (Art. 26(4)).
        uses:
          acquire: {status: assessed, basis: "Extraction of a substantial part for educational illustration, source cited, no independent economic significance; operator sign-off 2026-09-27 (#8976) to prepare in advance.", terms_refs: [law_art26_education_extraction]}
          store: {status: assessed, basis: "Private store only (sources.db, raw cache); same basis as acquire.", terms_refs: [law_art26_education_extraction]}
          transform: {status: assessed, basis: "Internal card assembly and joins; nothing leaves the private store under this row.", terms_refs: [law_art26_education_extraction]}
          display: {status: unknown, basis: "Showing ULIF content on every Atlas card is re-use of a substantial part (Art. 21(4)) or systematic re-use of insubstantial parts (Art. 26(4)); no permission yet. HELD until ULIF answers (outreach/ulif.md).", terms_refs: [law_art21_sui_generis, law_art26_systematic]}
          redistribute: {status: unknown, basis: "Bulk re-use in the dataset / Atlas export needs ULIF's permission. HELD.", terms_refs: [law_art21_sui_generis]}
      - fields: [headword, stress, grammatical_label, paradigm, homonym_sense_gloss, synonym_groups, antonym_pairs, phraseology]
        scale: lookup
        note: Per-entry live reads for checking a word (MCP query_ulif, reviewers).
        uses:
          acquire: {status: assessed, basis: "Normal use of a public dictionary portal by a lawful user.", terms_refs: [law_art26_normal_use]}
          store: {status: assessed, basis: "Transient/insubstantial parts only.", terms_refs: [law_art26_insubstantial]}
          transform: {status: assessed, basis: "Insubstantial part, used to check our own text.", terms_refs: [law_art26_insubstantial]}
          display: {status: assessed, basis: "An individual lesson or review may quote one entry with attribution (not systematic).", terms_refs: [law_art26_insubstantial, law_art22_quotation]}
          redistribute: {status: unknown, basis: "Not needed at this scale; any dataset use is bulk (row above). HELD."}
    open_questions:
      - Will ULIF permit display of synonyms, antonyms, phraseology and paradigms on Atlas pages, and their inclusion in the dataset under CC BY-NC-SA 4.0?
      - Which attribution form does ULIF want, and does it want links to lcorp.ulif.org.ua entries?
      - lcorp.ulif.org.ua/robots.txt returns an access-restricted page, so no crawl policy can be read; ask ULIF whether the one-request-per-second harvest (#8400) is acceptable.
      - Is the published contact email (alexandr.yeroshenko@hotmail.com, "про нас" sidebar) the right route, or the director's office by phone/post?
    contact:
      route: Director's office (Надутенко Максим Вікторович); adviser to the directorate academician Широков Володимир Анатолійович
      email: alexandr.yeroshenko@hotmail.com
      url: https://www.ulif.org.ua/contacts
      source_url: >-
        https://www.ulif.org.ua/contacts — «Тел.: +38044 525 81 65 (директор) ... Адреса: 03039,
        Україна, м.Київ, пр-т. Голосіївський, 3»; email from the site's "про нас" sidebar
        («Контактна інформація alexandr.yeroshenko@hotmail.com»); legacy ulif@ulif.org.ua in the 2008 CD manual.
    outreach: docs/sources/outreach/ulif.md

  # ---------------------------------------------------------------- СУМ-20
  - id: sum20
    name: «Словник української мови у 20 томах» (СУМ-20), official electronic edition
    organisation: >-
      Український мовно-інформаційний фонд НАН України (publisher, © of sum20ua.com) with the
      Інститут мовознавства ім. О. О. Потебні НАН України (co-compiler). Not the Інститут
      української мови, as the #8979 brief assumed — see the quotes.
    role: Modern Ukrainian definitions, sense structure, stressed headwords and citations for cards.
    fields_used:
      - definition_text
      - sense_structure
      - stressed_headword
      - literary_citations
    stored_in:
      - data/sources.db sum20_articles, sum20_senses, sum20_citations (crawled from sum20ua.com)
      - site lexicon shards (definition cards; see md § Findings)
    terms:
      found: true
      quotes:
        - id: sum20_footer
          quote: Словник української мови. Томи 1-16 (А-РЯХТЛИВИЙ) © Український мовно-інформаційний фонд НАН України, 2015 - 2026
          url: https://sum20ua.com/
          read_on: "2026-09-27"
        - id: sum20_linking
          quote: >-
            Для посилання на наш Словник ... можна використовувати URL-адресу форми:
            https://sum20ua.com/expl/entry/search/слово
          gloss_en: The only reuse the site offers is linking (and embedding its search form).
          url: https://sum20ua.com/
          read_on: "2026-09-27"
        - id: sum20_robots
          quote: "User-agent: ClaudeBot Disallow: / ... User-agent: * Allow: / ... Crawl-delay: 10"
          gloss_en: AI crawlers are blocked by name; all other agents allowed with a 10-second crawl delay.
          url: https://sum20ua.com/robots.txt
          read_on: "2026-09-27"
        - id: sum20_compilers
          quote: >-
            "Словник української мови в 20 томах" укладається науковцями Українського
            мовно-інформаційного фонду НАН України та Інституту мовознавства ім. О.О. Потебні
            НАН України
          url: https://www.ulif.org.ua/koristuities-dostovirnimi-dzhierielami
          read_on: "2026-09-27"
      searched:
        - https://sum20ua.com/Home/About (404)
        - https://sum20ua.com/robots.txt
        - https://iul-nasu.org.ua/pro-instytut/kontaktna-informatsiya.html (Інститут української мови — not the compiler)
    licence:
      name: All rights reserved (© ULIF); no open licence found
      spdx: null
    conditions:
      attribution: >-
        Словник української мови у 20 томах (Український мовно-інформаційний фонд НАН України,
        Інститут мовознавства ім. О. О. Потебні НАН України), https://sum20ua.com/ — official
        edition only, never a mirror (docs/best-practices/atlas-source-presentation.md).
      share_alike: null
      non_commercial: null
      other:
        - Definitions are copyrighted text and the dictionary is also a protected database.
        - robots.txt asks for a 10-second crawl delay; the ingest crawler (scripts/ingest/sum20_official_ingest.py, delay_s=2.0) used 2 seconds — see md § Findings.
    permissions:
      - fields: [definition_text, sense_structure, stressed_headword, literary_citations]
        scale: bulk
        uses:
          acquire: {status: assessed, basis: "Extraction for educational illustration, source cited, non-commercial; operator sign-off 2026-09-27 (#8976). Crawl-delay compliance is an open question.", terms_refs: [law_art26_education_extraction]}
          store: {status: assessed, basis: "Private store only; same basis as acquire.", terms_refs: [law_art26_education_extraction]}
          transform: {status: assessed, basis: "Internal comparison and card assembly.", terms_refs: [law_art26_education_extraction]}
          display: {status: unknown, basis: "A definition on every Atlas card is systematic re-use of a protected database and copyrighted text. HELD until ULIF answers (covered by outreach/ulif.md).", terms_refs: [law_art21_sui_generis, law_art26_systematic]}
          redistribute: {status: unknown, basis: "Class C (dictionary-authored text): held out of the dataset and Atlas export until the rights holder agrees (#8976). HELD.", terms_refs: [law_art21_sui_generis]}
      - fields: [definition_text, sense_structure, stressed_headword, literary_citations]
        scale: quotation
        note: One attributed definition quoted in a lesson or review, marked as a quotation — not the Atlas at scale.
        uses:
          acquire: {status: assessed, basis: "Normal use of a public dictionary site.", terms_refs: [law_art26_normal_use]}
          store: {status: assessed, basis: "Insubstantial part.", terms_refs: [law_art26_insubstantial]}
          transform: {status: assessed, basis: "Quoted, not altered; boundaries marked.", terms_refs: [law_art22_quotation]}
          display: {status: assessed, basis: "Quotation with author and source named, informational purpose, boundaries marked.", terms_refs: [law_art22_quotation]}
          redistribute: {status: unknown, basis: "Quotation in a bulk dataset is systematic; HELD."}
    open_questions:
      - Is СУМ-20 display/dataset permission granted by ULIF alone, or also by the Інститут мовознавства ім. О. О. Потебні as co-compiler?
      - Re-crawl or top-up must honour Crawl-delay 10 (current crawler used 2 s).
    contact:
      route: Same as ULIF (publisher of sum20ua.com); co-compiler Інститут мовознавства ім. О. О. Потебні НАН України
      email: alexandr.yeroshenko@hotmail.com
      url: https://www.ulif.org.ua/contacts
      source_url: https://sum20ua.com/ footer names ULIF as © holder
    outreach: docs/sources/outreach/ulif.md

  # ---------------------------------------------------------------- VESUM
  - id: vesum
    name: ВЕСУМ — Великий електронний словник української мови (dict_uk)
    organisation: Андрій Рисін, Василь Старко, команда БрУК (brown-uk)
    role: Lemmas, all word forms, POS and grammatical tags — the open backbone of every card.
    fields_used: [lemma, word_forms, pos, morph_tags, markers]
    stored_in:
      - data/vesum.db (forms_all, form_markers, vesum_build_metadata) from dict_corp_vis.txt.bz2 v6.8.0 (scripts/config/vesum_source.lock.json)
    terms:
      found: true
      quotes:
        - id: vesum_readme_licence_uk
          quote: >-
            Дані словника доступні для використання згідно з умовами ліцензії "Creative Commons
            Attribution-NonCommercial-ShareAlike 4.0 International License"
            (https://creativecommons.org/licenses/by-nc-sa/4.0/)
          url: https://github.com/brown-uk/dict_uk/blob/master/README.md
          read_on: "2026-09-27"
        - id: vesum_readme_licence_en
          quote: >-
            Dictionary data are distributed under "Creative Commons Attribution-NonCommercial-ShareAlike
