    permissions:
      - fields: [lemma, word_forms, pos, morph_tags, markers]
        scale: bulk
        uses:
          acquire: {status: permitted, basis: "CC BY-NC-SA 4.0 data licence.", terms_refs: [vesum_readme_licence_uk, vesum_readme_licence_en]}
          store: {status: permitted, basis: "CC BY-NC-SA 4.0.", terms_refs: [vesum_readme_licence_en]}
          transform: {status: permitted, basis: "Adaptation allowed; result stays BY-NC-SA 4.0.", terms_refs: [vesum_readme_licence_en, cc_by_nc_sa_summary]}
          display: {status: permitted, basis: "Non-commercial display with the citation.", terms_refs: [vesum_readme_licence_en, vesum_citation]}
          redistribute: {status: permitted, basis: "Non-commercial redistribution under BY-NC-SA 4.0 with attribution.", terms_refs: [vesum_readme_licence_en, cc_by_nc_sa_summary]}
    open_questions:
      - The README cites version 6.7.8; we pin 6.8.0 (latest release 6.8.6). Cite the version actually used.
    contact:
