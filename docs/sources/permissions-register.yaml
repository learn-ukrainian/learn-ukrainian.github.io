          transform: {status: refused, basis: "Same terms.", terms_refs: [slovnyk_terms_2024]}
          display: {status: refused, basis: "Same terms; use the underlying work's own row instead.", terms_refs: [slovnyk_terms_2024]}
          redistribute: {status: refused, basis: "Same terms.", terms_refs: [slovnyk_terms_2024]}
