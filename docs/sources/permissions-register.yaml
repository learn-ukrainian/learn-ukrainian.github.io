# Source citation and provenance register (#8979) — machine-readable.
# Human-readable twin: docs/sources/permissions-register.md.
# Schema: schemas/permissions-register.schema.json; test: tests/validate/test_permissions_register.py.
#
# Per source: the rights holder, what we use, where it comes from (URL, retrieval date), the terms as
# found (quoted, with URL and read date; verbatim licence text where one exists), the citation we show,
# and the removal route. Not a publication gate — see operator_decisions. Not legal advice.

schema_version: 2
register_date: '2026-10-06'
purpose: 'Citation and provenance record: who holds the rights, what we use, where it comes from, the terms as found,
  the citation we show, and how to ask for removal. It is not a publication gate: no build reads it to withhold
  content.'
operator_decisions:
- id: d1_content_stays
  date: '2026-09-27'
  decision: IP is the operator's responsibility. All current content stays on the site and in exports, including
    СУМ-20, ЕСУМ, ULIF (synonyms, antonyms, idioms), Горох/Балла; nothing is removed or held.
  url: https://github.com/learn-ukrainian/learn-ukrainian.github.io/issues/8979
- id: d2_teacher_consent
  date: '2026-09-27'
  decision: The teacher agrees to her material being used (site and dataset).
  url: https://github.com/learn-ukrainian/learn-ukrainian.github.io/issues/8979
- id: d3_takedown_via_issues
  date: '2026-09-27'
  decision: Takedown requests come as GitHub issues; no contact email.
  url: https://github.com/learn-ukrainian/learn-ukrainian.github.io/issues/8979
- id: d4_no_outreach
  date: '2026-09-27'
  decision: 'No outreach: nothing is sent to rights holders; the outreach drafts are dropped.'
  url: https://github.com/learn-ukrainian/learn-ukrainian.github.io/issues/8979
- id: o1_verbatim_use
  date: '2026-10-03'
  decision: 'Plan v3.5.0 O1: verbatim use of in-copyright sources: YES, as the operator''s IP responsibility.'
  url: https://github.com/learn-ukrainian/learn-ukrainian.github.io/issues/6321
- id: o3_textbooks_used
  date: '2026-10-03'
  decision: 'Plan v3.5.0 O3: school and university textbooks are used as record sources (component C9).'
  url: https://github.com/learn-ukrainian/learn-ukrainian.github.io/issues/6321
- id: d5_permissions_sought
  date: '2026-10-06'
  decision: Permissions for ULIF and СУМ-20 are being sought with help from Ukrainian experts. ULIF gave verbal
    permission in 2026-10, per the operator; written confirmation pending. This updates the practice described
    in d4_no_outreach only for these permissions.
  url: https://github.com/learn-ukrainian/learn-ukrainian.github.io/issues/6321
removal_route:
  url: https://github.com/learn-ukrainian/learn-ukrainian.github.io/issues
  how: A rights holder opens a GitHub issue naming the source and the content; the maintainer removes it from the
    site and the dataset export. There is no contact email (operator decision 3).
appears_in_values:
- internal
- site
- dataset
legal_references:
- id: law_art21_sui_generis
  quote: Виробнику бази даних, крім бази, створеної для систематизації даних, що є публічною інформацією відповідно
    до Закону України "Про доступ до публічної інформації", який зробив якісно та/або кількісно значний внесок в
    отримання, перевірку чи подання вмісту бази даних, для запобігання вилученню та/або повторному використанню
    - будь-якому наданню невизначеному колу осіб повного вмісту бази даних або значної її частини у якісному чи
    кількісному вимірі, на таку базу даних надається право особливого роду (sui generis).
  gloss_en: 'Art. 21(4), Law 2811-IX: a database maker with a substantial investment gets a sui generis right against
    extraction and re-use (making the whole or a substantial part available to the public); 15-year term from creation/publication,
    renewed by substantial changes (Art. 21(7)-(8)).'
  url: https://zakon.rada.gov.ua/laws/show/2811-20/print
  read_on: '2026-09-27'
- id: law_art22_quotation
  quote: 'Без дозволу суб’єктів авторського права і безоплатно, але із зазначенням імені автора і джерела запозичення,
    допускається: 1) використання цитат, включаючи їх переклад з інших мов, з правомірно опублікованих творів, ...
    якщо це зумовлено критичним, полемічним, науковим або інформаційним характером твору (повідомлення), до якого
    цитати включаються, із семантичним та/або графічним виділенням меж цитати'
  gloss_en: Art. 22(2)(1) — quotation without permission, naming author and source, where the quoting work is critical,
    polemical, scientific or informational, with the quotation's boundaries marked.
  url: https://zakon.rada.gov.ua/laws/show/2811-20/print
  read_on: '2026-09-27'
- id: law_art31_term
  quote: Строк чинності майнових прав інтелектуальної власності на твір спливає через 70 років, що обчислюються
    з 1 січня року, наступного за роком смерті автора ... Строк чинності майнових прав інтелектуальної власності
    на твір, створений у співавторстві, спливає через 70 років, що обчислюються з 1 січня року, наступного за роком
    смерті останнього співавтора.
  gloss_en: 'Art. 31(2),(4) — life + 70 years; co-authored works: 70 years after the last co-author''s death.'
  url: https://zakon.rada.gov.ua/laws/show/2811-20/print
  read_on: '2026-09-27'
- id: law_art32_public_domain
  quote: Закінчення строку чинності майнових прав на твір означає перехід твору у суспільне надбання. Твори, які
    стали суспільним надбанням, можуть вільно, без сплати винагороди, використовуватися будь-якою особою, за умови
    дотримання особистих немайнових прав автора, передбачених статтею 11 цього Закону.
  gloss_en: Art. 32(3) — expired works enter the public domain; free use, moral rights (e.g. attribution) kept.
  url: https://zakon.rada.gov.ua/laws/show/2811-20/print
  read_on: '2026-09-27'
open_questions:
- 'The open dataset''s own licence. VESUM data is CC BY-NC-SA 4.0 and CC allows adaptations of it only under
  BY-NC-SA 4.0 or later; CC BY-SA inputs (Вікісловник, Kaikki, dmklinger, Ukrajinet, Вікіпедія) must stay BY-SA.
  Recommendation on #8979: CC BY-NC-SA 4.0 for the core, BY-SA-derived fields in separate CC BY-SA 4.0 files.
  Not decided. O1/O3 (2026-10-03, plan v3.5.0 on #6321) decided use, not the dataset''s licence; plan step
  E6 (dataset licence choice) remains an operator decision.'
- 'Sources shown in the Atlas with no entry here yet (labels from scripts/lexicon/source_attribution.py, counted
  in atlas.db public-route payloads of the 2026-09-11 manifest, published as the atlas-manifest release asset; counted
  2026-09-28): Великий тлумачний словник сучасної української мови (ВТС, 8,422), Словник синонімів С. Караванського
  (2,727), Орфографічний словник української мови (5,534), Правописний словник Голоскевича (3,396), Орфоепічний
  словник української мови (1,912), Приповідки або українсько-народня філософія (555), МійКлас relation pairs (704),
  «Уроки державної мови» з газети «Хрещатик» (27), Словник чужослів Павла Штепи (33), Культура слова (3), and the
  literary corpus (literary_texts, e.g. izbornyk.org.ua, ukrlib.com.ua). Each needs its own entry.'
