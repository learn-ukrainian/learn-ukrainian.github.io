            (ГРАК) / М. Шведова, Р. фон Вальденфельс, С. Яригін, А. Рисін, В. Старко, Т. Ніколаєнко,
            А. Лукашевський та ін. — Київ, Львів, Єна, 2017–. — uacorpus.org.
          url: https://uacorpus.org/
          read_on: "2026-09-27"
      searched:
