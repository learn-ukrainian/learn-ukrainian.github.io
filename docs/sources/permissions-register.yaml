          store: {status: assessed, basis: "Only the selected sentences with citation.", terms_refs: [law_art26_insubstantial]}
          transform: {status: assessed, basis: "Selection and cloze blanks; the sentence text is not altered.", terms_refs: [grac_purpose]}
          display: {status: assessed, basis: "Short attributed quotation for an informational/educational purpose; GRAC's stated purpose.", terms_refs: [law_art22_quotation, grac_purpose]}
          redistribute: {status: unknown, basis: "No published redistribution terms; texts under authors' copyright. HELD until GRAC answers (outreach/grac.md)."}
      - fields: [frequency_count]
        scale: bulk
        uses:
          acquire: {status: assessed, basis: "Per-lemma queries; extraction for educational use, source cited.", terms_refs: [law_art26_education_extraction]}
          store: {status: assessed, basis: "Private cache.", terms_refs: [law_art26_education_extraction]}
          transform: {status: assessed, basis: "Converted into our own coarse tiers."}
          display: {status: unknown, basis: "Raw counts for every card are re-use of corpus data; not needed. HELD."}
          redistribute: {status: unknown, basis: "HELD until GRAC answers."}
      - fields: [frequency_tier]
        scale: bulk
        note: Our own coarse tier (e.g. top-1k, top-5k) computed from the counts.
        uses:
          acquire: {status: assessed, basis: "Derived by us from the counts row.", terms_refs: [law_art26_education_extraction]}
          store: {status: assessed, basis: "Our own derived value."}
          transform: {status: assessed, basis: "Our own computation."}
          display: {status: assessed, basis: "Our own classification, cited as based on GRAC; no corpus content shown.", terms_refs: [grac_citation]}
          redistribute: {status: unknown, basis: "Tiers for the whole lexicon mirror the frequency ranking; ask GRAC before shipping. HELD."}
    open_questions:
