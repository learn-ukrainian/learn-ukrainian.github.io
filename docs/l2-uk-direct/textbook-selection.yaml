# Textbook Selection for RAG Database
# Selected: 2026-08-08
# Total: 151 logical books from catalog and publisher sources, retained once in Google Drive
# Strategy: language/literature/history diversity plus one storage-efficient
# representative for each acquired curriculum cell; alternatives are not duplicated.
#
# PDF URL pattern: https://pidruchnyk.com.ua/uploads/book/{filename}.pdf
# Page URL pattern: https://pidruchnyk.com.ua/{slug}.html

# Selection criteria:
# 1. Current NUS editions for each staged cohort, including Grade 9 in 2026/27
# 2. Author diversity: Большакова (1-2), mixed (3-4), Авраменко+Голуб/Караман (5-11)
# 3. Decolonized history: Щупак (5-8), Гісем+Хлібовська (9-11)
# 4. Two language books per grade for RAG diversity

