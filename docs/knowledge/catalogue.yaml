# ================================================================ SQLite store registry (#11092)
# One row per SQLite store the project owns (DB plan step 1). Checked by
# `.venv/bin/python -m scripts.docs.catalogue check` (static) and
# `... catalogue census --root <checkout> --expect-present` (filesystem, read-only).
# - stores: one row per named physical file, present or declared in code but
#   absent. writers are file:function (Class.method) entry points that must be
#   defined in tracked code. busy_ms is the effective SQLite busy timeout of the
#   writer connection (sqlite3.connect defaults to 5 s). journal is the persistent
#   mode in the file header (wal or delete).
# - protection: keep (must survive host loss), rebuild (regenerable from tracked
#   code and sources), disposable (loss costs only a re-run). It is never a deletion
#   authorization; deletion and eviction are operator-authorized (plan step 12).
# - backup is the fact scripts/config/backup-allowlist.json gives today (keep,
#   drop or none), checked against that file; the nightly owns it (plan step 6).
#   protection keep without backup keep carries protection_gap.
# - families: stores at caller-chosen or per-key paths; glob is what the census
#   can match, path_rule the code's rule. --db and other overrides elsewhere are a
#   known gap (residual G1).
# - evidence_dirs are not walked; non_stores are SQLite-shaped files that are not
#   stores. A new SQLite file anywhere else under data/, .agent/, .mcp/ or
#   batch_state/ fails the census until a row claims it.
# Inputs: DB census study r2 section 2 and the Sol validation amendments 1 and 5.
store_registry:
  census_roots: [data, .agent, .mcp, batch_state]
  stores:
    # ---------------------------------------------------------------- operational
    - path: batch_state/fleet-comms/v1/comms.sqlite3
      owner: infra-harness
      kind: operational
      activity: active
      presence: present
      writers: [scripts/fleet_comms/artifacts.py:ArtifactStore.__init__]
      journal: wal
      busy_ms: 5000
      busy_source: explicit
      protection: keep
      backup: keep
      retention: Durable Fleet Comms message and job authority; kept indefinitely.
    - path: .agent/session-streams/v1/session-streams.sqlite3
      owner: infra-harness
      kind: operational
      activity: active
      presence: present
      writers: [agents_extensions/shared/session_streams/db.py:SessionStreamDatabase._connect_once]
      journal: wal
      busy_ms: 5000
      busy_source: explicit
      protection: keep
      backup: keep
      retention: Session stream leases and events; kept indefinitely (#11021 owns its evolution).
    - path: batch_state/tasks/write-ownership.sqlite3
      owner: infra-harness
      kind: operational
      activity: active
      presence: present
      writers: [scripts/guardrails/delegate_ownership.py:OwnershipLedger._connect]
      journal: wal
      busy_ms: 30000
      busy_source: explicit
      protection: keep
      backup: none
      protection_gap: The task_records filter stages only json, result, diag, md and prompt files and archive/, so the admission audit trail is not backed up; DB plan step 6 (devops) proposes a keep file row.
      retention: Admission claims and audit events; kept indefinitely.
    - path: batch_state/tasks/.task_cache.sqlite3
      owner: monitor
      kind: operational
      activity: active
      presence: present
      writers: [scripts/api/delegate_router.py:_init_task_cache_db]
      journal: delete
      busy_ms: 5000
      busy_source: default
      protection: disposable
      backup: none
      retention: Derived from task files on every scan; safe to lose.
    - path: .mcp/servers/message-broker/messages.db
      owner: infra-harness
      kind: operational
      activity: active
      presence: present
      writers: [scripts/ai_agent_bridge/_db.py:init_db, .mcp/servers/message-broker/server.py:handle_send_message]
      journal: wal
      busy_ms: 5000
      busy_source: explicit
      busy_setters: [scripts/ai_agent_bridge/_db.py:_tune_connection, .mcp/servers/message-broker/server.py:get_db]
      protection: keep
      backup: none
      protection_gap: 'Legacy broker history is not in the allowlist; DB plan step 6 proposes keep until #6106 retires it, then frozen and kept.'
      retention: 'Legacy broker history; frozen read-only and kept after #6106 retirement, never row-deleted without operator authorization.'
    - path: batch_state/entire-context/v1/context-links.sqlite3
      owner: infra-harness
      kind: operational
      activity: active
      presence: present
      writers: [scripts/entire_context/store.py:ContextLinkStore._connect]
      journal: delete
      busy_ms: 5000
      busy_source: default
      protection: keep
      backup: none
      protection_gap: Not in the allowlist; DB plan step 6 proposes keep.
      retention: Body-free context links and use receipts; kept indefinitely.
    - path: <git-common-dir>/ci-recovery.sqlite3
      owner: devops
      kind: operational
      activity: active
      presence: present
      writers: [scripts/publish/recovery.py:consume]
      journal: delete
      busy_ms: 30000
      busy_source: explicit
      protection: keep
      backup: none
      protection_gap: Lives in the Git common directory, outside every allowlist root; it records the one-recovery-per-head allowance, and DB plan step 6 proposes keep.
      retention: One row per PR head recovery attempt; kept indefinitely.
      note: ledger_path resolves it with git rev-parse --git-common-dir, so every worktree shares one file.
    - path: batch_state/review-findings/a1.sqlite
      owner: core-quality
      kind: operational
      activity: active
      presence: present
      family: review-findings
      writers: [scripts/review/findings_db.py:connect]
      journal: delete
      busy_ms: 30000
      busy_source: explicit
      protection: keep
      backup: none
      protection_gap: Review findings are a review record like the required review-receipts tree but sit outside every allowlist row; DB plan step 6 proposes the review-findings glob as keep.
      retention: Review findings, attempts and budgets; kept indefinitely.
      note: Missed by the r1 census because its classifier hard-coded live directories.
    - path: batch_state/agent_monitor.sqlite3
      owner: monitor
      kind: operational
      activity: dormant
      presence: present
      writers: [scripts/api/agent_monitor_router.py:_get_db]
      journal: wal
      busy_ms: 10000
      busy_source: explicit
      protection: disposable
      backup: none
      retention: Host RAM reservations from agent leases (0 rows); dormant is a traffic state, not a retirement verdict (DB plan step 8).
    # ---------------------------------------------------------------- caches
    - path: batch_state/github-client/cache.sqlite3
      owner: devops
      kind: cache
      activity: active
      presence: present
      writers: [scripts/common/github_client.py:GitHubClient._db]
      journal: delete
      busy_ms: 5000
      busy_source: explicit
      protection: rebuild
      backup: drop
      retention: Unbounded today (no row eviction); a logical bound is DB plan step 5, and destructive eviction needs operator authorization.
    - path: data/wiki_cache.db
      owner: corpus-channels
      kind: cache
      activity: active
      presence: present
      catalogue_entry: data-wiki-cache
      writers: [scripts/rag/wiki_cache.py:WikiCache.__init__]
      journal: wal
      busy_ms: 5000
      busy_source: default
      protection: keep
      backup: keep
      retention: Small wiki retrieval cache; kept by the data/wiki_*.db nightly glob.
    - path: data/mphdict/.mphdict-lookup.sqlite3
      owner: corpus-channels
      kind: cache
      activity: active
      presence: present
      writers: [scripts/mphdict/query.py:_ensure_index]
      journal: wal
      busy_ms: 5000
      busy_source: default
      protection: keep
      backup: keep
      retention: Lookup index sidecar over the mphdict databases; kept with the data/mphdict tree, rebuildable from it.
    - path: data/lexicon/cache/ulif_raw.sqlite
      owner: atlas-practice
      kind: cache
      activity: active
      presence: present
      catalogue_entry: data-lexicon-ulif-cache
      writers: [scripts/lexicon/ulif_raw_cache.py:open_cache]
      journal: wal
      busy_ms: 30000
      busy_source: explicit
      protection: keep
      backup: keep
      retention: Digest-keyed raw ULIF response bodies; kept, since a refetch costs the full crawl.
    # ---------------------------------------------------------------- reference and derived
    - path: data/sources.db
      owner: corpus-channels
      kind: reference
      activity: active
      presence: present
      catalogue_entry: data-sources-db
      writers: [scripts/wiki/build_sources_db.py:build, scripts/wiki/sources_db.py:store_ulif_dictua_entry]
      journal: wal
      busy_ms: 30000
      busy_source: explicit
      busy_setters: [scripts/wiki/sources_db.py:_open_conn]
      protection: keep
      backup: keep
      retention: The corpus of record; kept indefinitely.
      note: The sources MCP miss path writes ulif_dictua_entries rows through store_ulif_dictua_entry (DB plan step 9), which opens the store through _open_conn; build writes a temporary file and replaces the store, so its default timeout never applies to the store.
    - path: data/vesum.db
      owner: corpus-channels
      kind: reference
      activity: active
      presence: present
      catalogue_entry: data-vesum-db
      writers: [scripts/rag/activate_vesum_db.py:activate_database]
      journal: delete
      busy_ms: null
      busy_source: not_applicable
      protection: rebuild
      backup: drop
      retention: Replaced by an atomic swap from a verified shadow; rebuilt from the VESUM source, not restored from the nightly.
    - path: data/vesum_shadow_v680.db
      owner: corpus-channels
      kind: reference
      activity: active
      presence: present
      catalogue_entry: data-vesum-db
      writers: [scripts/rag/vesum_reingest.py:build_shadow_database]
      journal: delete
      busy_ms: 5000
      busy_source: default
      protection: rebuild
      backup: drop
      retention: Shadow build of the v6.8.0 VESUM; rebuilt, not restored.
    - path: data/atlas.db
      owner: atlas-practice
      kind: derived
      activity: active
      presence: present
      catalogue_entry: data-atlas-db
      writers: [scripts/atlas/atlas_db.py:migrate_manifest]
      journal: wal
      busy_ms: 5000
      busy_source: default
