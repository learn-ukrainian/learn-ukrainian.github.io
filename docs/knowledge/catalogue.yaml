    keywords: [ULIF, stress, oracle, pronunciation, source identity, trie fallback]
    lifecycle: active
    owner: atlas-practice
    entrypoints:
      - {topic: ULIF-first stress oracle, path: docs/verification/ulif-first-stress.md}
    query:
      - {surface: git_grep, how: "git grep -n -i -F '<term>' -- docs/verification/ulif-first-stress.md"}
    content_searchable: true

