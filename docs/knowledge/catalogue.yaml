# Document and data catalogue (#9412).
#
# One entry per document FAMILY (a directory or glob sharing purpose, owner,
# default lifecycle and retrieval method) or per logical DATA STORE under
# data/. Never one hand-written entry per file. It extends the ADR-013
# inventory (docs/knowledge/inventory/, scripts/docs/docs_inventory.py) and the
# lifecycle contract in docs/architecture/docs-authority-lifecycle.md; it does
# not replace them and it is separate from the ADR-011 research registry.
#
# Rules (checked by `.venv/bin/python -m scripts.docs.catalogue check`):
# - Every path Git tracks under the tracked roots resolves to exactly one
#   family. The most specific glob wins (exact path, then more literal path
#   segments, then more literal characters). Equal-specificity matches from two
#   families are errors.
# - A tracked path containing a control character (newline, tab, CR or any
#   other C0/C1 control) is an error and is never catalogued or read.
# - Glob dialect (paths and store names alike): literal characters, '*' within
#   one path segment (never across '/'), '?' for one character within a segment,
#   and '**' as a whole segment spanning segments. Character classes ([...]),
#   braces ({a,b}), empty, '.' and '..' segments are errors: list each path.
# - Catch-all rule: the first segment below a glob's tracked root must be
#   literal, so docs/**, docs/*/**, docs/a*/** and docs/*.md are errors.
# - Every glob matches at least one tracked file.
# - A family that owns any path under a component the docs inventory excludes
#   for privacy (session-state, private, secrets, credentials, cache, ...) must
#   set content_searchable: false. Ownership is what decides, not glob text.
# - lifecycle uses the contract vocabulary: draft | active | superseded | archive.
#   superseded needs superseded_by: a tracked path (optionally #section) or
#   id:<entry>. Chains must end at an active or archive node, with no cycles;
#   this holds for every entry kind, data stores included.
# - overrides set the lifecycle of one exact path inside the family (for files
#   that cannot carry front-matter, or that differ from the family default).
# - residual lists paths whose lifecycle is not yet classified; the family
#   default does not apply to them. Unknown is never a lifecycle value.
# - owner is a stream key (scripts/config/issue_streams.yaml) or an area key
#   (scripts/config/area_assignments.yaml).
# - data_store entries name logical stores and tracked producer scripts only,
#   never a host path or mount.
# - Every data/<name>.db|.sqlite|.sqlite3 store that scripts/ code names is
#   claimed by a data_store entry or listed, with a reason, in
#   store_literal_exemptions.
# - A Markdown file that an override marks superseded carries front matter
#   (lifecycle: superseded, superseded_by: <target>) and the visible line
#   '> **Superseded by:** [target](link)'; `... catalogue mark --apply` writes
#   both. Front-matter lifecycle or superseded_by anywhere must agree with what
#   the catalogue resolves for that file.
# - docs/README.md's family table is generated from this file:
#   `.venv/bin/python -m scripts.docs.catalogue readme`.
# Search it (and tracked names and text) with `.venv/bin/python -m scripts.docs.find "<query>"`.
# Census and evidence: docs/knowledge/inventory/catalogue-census-2026-10-01.md.
schema_version: 1
denominator:
  tracked_roots: [docs, registry, curriculum/l2-uk-en/evidence]
  local_store_root: data
status_mapping:
  current: active
  historical: archive
  superseded: superseded

