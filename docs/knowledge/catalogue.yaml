    keywords: [documentation map, entry point, where to start, docs index, navigation hazards, find a document]
    lifecycle: active
    owner: docs-knowledge
    entrypoints:
      - {topic: documentation map, path: docs/README.md}
      - {topic: document and data catalogue, path: docs/knowledge/catalogue.yaml}
    query:
