# Ukrainian State Standard 2024 - Module Compliance Mapping
# Reference: docs/l2-uk-en/UKRAINIAN-STATE-STANDARD-2024.txt
#
# Structure per level:
#   Section 1: Speech activities (listening, reading, writing, speaking)
#   Section 2: Catalogue A — Communicative intentions
#   Section 3: Catalogue B — Thematic catalogue
#   Section 4: Catalogue C — Linguistic competence (morphology, syntax, stylistics)
#
# For curriculum modules, Section 4 (linguistic competence) is the primary reference.
# Line numbers refer to UKRAINIAN-STATE-STANDARD-2024.txt
#
# Policy (requirement R-32): The State Standard defines the minimum floor each level must cover.
# Teaching earlier than the Standard prescribes is permitted when ULP evidence is
# recorded; dropping a required Standard item is prohibited.

# ============================================================
# A1 — Початковий рівень першого ступеня (lines 221-747)
# ============================================================
a1:
  level_lines: [221, 747]

  # --- Communicative Intentions (§2, Каталог А) ---
  intentions:
    reference: "§2 (Каталог А)"
    lines: [453, 477]
    items:
      - "привернути чиюсь увагу, установити контакт"
      - "відрекомендувати себе або інших"
      - "привітатися"
      - "попрощатися"
      - "подякувати"
      - "попросити вибачення"
      - "привітати"
      - "побажати"
      - "ставити прості запитання"
      - "відповідати на прості запитання"
      - "просити надати інформацію"
      - "підтвердити інформацію / заперечити її"
      - "висловити свої вподобання"
      - "прохання зробити щось"
      - "заборонити робити щось"
      - "виразити просторові значення"
      - "виразити часові поняття"

  # --- Phonetics & Graphics (§4.1) ---
  phonetics:
    alphabet:
      reference: "§4.1.1"
      lines: [571, 572]
      description: "Український алфавіт. Друковані та писані літери. Великі і малі літери"
    apostrophe:
      reference: "§4.1.2"
      lines: [574, 574]
      description: "Апостроф"
    soft_sign:
      reference: "§4.1.3"
      lines: [575, 575]
      description: "М'який знак"
    vowels_consonants:
      reference: "§4.1.4"
      lines: [577, 584]
      description: "Голосні та приголосні звуки: вимова голосних у наголошеній і ненаголошеній позиціях ([е], [и]); тверді та м'які приголосні; твердість перед [е]; дзвінкі та глухі; звуки [дж], [дз]"
    stress:
      reference: "§4.1.5"
      lines: [586, 586]
      description: "Наголос"
    syllable:
      reference: "§4.1.6"
      lines: [588, 588]
      description: "Склад. Перенос слів"
    euphony:
      reference: "§4.1.7"
      lines: [590, 594]
      description: "Засоби милозвучності: уживання прийменників у, в; сполучників і, й; прийменника з і варіантів із, зі"
    intonation:
      reference: "§4.1.8"
      lines: [596, 596]
      description: "Інтонація (розповідна, питальна, оклична)"

  # --- Morphology (§4.2) ---
  morphology:
    noun_declension:
      reference: "§4.2.1.1"
      lines: [603, 631]
      description: "Іменник: родові значення в однині; форми множини в називному відмінку (-и, -і/-ї); чергування голосних в однині/множині; форми знахідного та місцевого відмінків (ч.р., ж.р., с.р.); кличний відмінок"
    adjective_declension:
      reference: "§4.2.1.2"
      lines: [633, 650]
      description: "Прикметник: форми називного відмінка однини; узгодження з іменниками в роді й числі; форми знахідного та місцевого відмінків (-ий/-а/-е, -ій/-я/-є)"
    numeral:
      reference: "§4.2.1.3"
      lines: [652, 654]
      description: "Числівник: родові форми порядкових числівників із закінченнями -ий, -а, -е (перший, першого; другий, друга, друге)"
    pronoun:
      reference: "§4.2.1.4"
      lines: [656, 657]
      description: "Займенник: відмінкові форми особових займенників я (мене, мені), ти (тебе, тобі), ми (нас, нам), ви (вас, вам)"
    pronoun_gender_number:
      reference: "§4.2.2"
      lines: [659, 667]
      description: "Родові й числові форми присвійних займенників (мій, твій, наш, ваш, їхній), вказівних (той, цей), порядкових числівників (перший, третій); форми множини (мої, твої, наші, ваші, їхні, ті, ці)"

  # --- Case Usage (§4.2.3) ---
  cases:
    nominative:
      reference: "§4.2.3.1"
      lines: [672, 676]
      description: "Називний відмінок: суб'єкт активної дії; особа чи предмет; ідентифікація особи чи предмета"
      first_module: 1
      required: true
    accusative:
      reference: "§4.2.3.2"
      lines: [678, 688]
      description: "Знахідний відмінок: без прийменника (об'єкт дії); із прийменниками в, у, на (кінцевий пункт руху), у/в (дні тижня), про (думати, мріяти)"
      first_module: 11
      required: true
    locative:
      reference: "§4.2.3.3"
      lines: [690, 695]
      description: "Місцевий відмінок: у, в, на (позначення місця); у, в (момент часу з назвами місяців)"
      first_module: 13
      required: true
    vocative:
      reference: "§4.2.3.4"
      lines: [697, 699]
      description: "Кличний відмінок: адресат мовлення — потенційний суб'єкт дії"

  # --- Verb Forms (§4.2.4) ---
  verbs:
    indicative:
      reference: "§4.2.4.1"
      lines: [703, 719]
      description: "Дійсний спосіб: теперішній час (читати, працювати, могти, іти, їхати, сидіти, дивитися); майбутній час бути; минулий час (-в, -ла, -ло, -ли; сміявся); складена форма майбутнього часу недоконаного виду (буду читати); майбутній час деяких дієслів доконаного виду (зможу, скажете)"
    imperative:
      reference: "§4.2.4.2"
      lines: [721, 725]
      description: "Наказовий спосіб: форми 2-ї особи однини і множини (читай, читайте; скажи, скажіть; дай, дайте; пиши, пишіть; сідай, сідайте; сиди, сидіть)"
      required_forms: ["2nd_person"]

  # Presence requirement for reflexive verbs in indicative mood
  reflexive_verbs:
    reference: "§4.2.4.1"
    lines: [709, 714]
    requirement_id: "REQ-A1-REFLEXIVE"
    arc_position: 9
    module: 9
    required_patterns: ["дивитися", "сміявся"]

  # --- Syntax (§4.3) ---
  syntax:
    simple_sentence:
      reference: "§4.3.1"
      lines: [729, 739]
      description: "Просте речення: розповідне; питальне (чи); питальне зі словами де, звідки, куди, що, хто; спонукальне для вираження прохання; стверджувальні й заперечні (не, ні)"
    complex_sentence:
      reference: "§4.3.2"
      lines: [741, 747]
      description: "Складне речення: складносурядні зі сполучниками і (й), але; складнопідрядні причини зі сполучниками тому що, бо"

  # --- Thematic Areas (§3) ---
  themes:
    reference: "§3 (Каталог Б)"
    lines: [479, 556]
    topics: ["Людина", "Дім, помешкання", "Місто (заклади, транспорт і місця)", "Побут", "Діяльність", "Дозвілля, відпочинок", "Подорожі", "Купівля (закупи)", "Ресторан, кафе", "Здоров’я", "Природне середовище", "Традиції, звичаї, свята"]

# ============================================================
# A2 — Початковий рівень другого ступеня (lines 749-1432)
# ============================================================
a2:
  level_lines: [749, 1432]

  immersion:
    graduated: true
    target_percentage: 80.0
    reference: "Curriculum design decision (Easy Ukrainian ramp: early A2 75-85%+, mid/late A2 90-95%+)"

  # --- Communicative Intentions (§2, Каталог А) ---
  intentions:
    reference: "§2 (Каталог А)"
    lines: [1029, 1070]
    items:
      - "привернути чиюсь увагу, установити контакт"
      - "відрекомендувати себе або інших"
      - "привітатися"
      - "попрощатися"
      - "подякувати"
      - "попросити вибачення, перепросити"
      - "привітати"
      - "побажати"
      - "ставити прості запитання для уточнення інформації"
      - "відповідати на прості запитання"
      - "просити надати інформацію"
      - "підтвердити інформацію / заперечити її"
      - "висловити свої вподобання"
      - "прохання робити щось"
      - "заборона робити щось / заклик не робити чогось"
      - "виражати впевненість / невпевненість"
      - "висловлювати можливість / неможливість"
      - "запрошувати"
      - "ідентифікувати певні предмети"
      - "давати прості визначення"
      - "виражати надію"
      - "виражати належність"
      - "виражати просторові значення"
      - "виражати часові поняття"
      - "виражати причиново-наслідкові значення"

  # --- Phonetics (§4.1) ---
  phonetics:
    vowels_consonants:
      reference: "§4.1.1"
      lines: [1176, 1181]
      description: "Чергування голосних [і] – [о], [і] – [е] (ніс – носа, річ – речі); чергування приголосних [к] – [ц´], [х] – [с´], [г] – [з´] (рука – у руці, поверх – на поверсі, нога – на нозі); чергування приголосних [д] – [дж], [с] – [ш] (ходити – ходжу, носити – ношу)"
    stress:
      reference: "§4.1.2"
      lines: [1183, 1188]
      description: "Наголос: подвійний (по́милка – поми́лка, за́вжди – завжди́); для розрізнення слів (замо́к – за́мок); для розрізнення форм (ру́ки – руки́)"
    euphony:
      reference: "§4.1.3"
      lines: [1190, 1195]
      description: "Засоби милозвучності: уживання прийменників у, в; сполучників і, й; прийменника з і його варіантів зі, із"
    intonation:
      reference: "§4.1.4"
      lines: [1197, 1197]
      description: "Інтонація (розповідна, питальна, оклична)"

  # --- Morphology (§4.2) ---
  morphology:
    noun_declension:
      reference: "§4.2.1.1"
      lines: [1204, 1221]
      description: "Відмінкові форми іменників: ч.р. твердий/м'який/на -ар/мішана на -ж, -ч, -ш, -щ; ж.р. твердий/м'який/на -ія; с.р. на -о, -е, -а (-я)"
    adjective_declension:
      reference: "§4.2.1.2"
      lines: [1223, 1233]
      description: "Прикметник: форми ч.р., ж.р., с.р. (-ий, -а, -е; -ій, -я, -є) та форми множини"
    numeral:
      reference: "§4.2.1.3"
      lines: [1235, 1242]
      description: "Числівник: відмінково-родові форми порядкових числівників із закінченнями -ий, -а, -е та -ій, -я, -є; кількісний числівник один (один, одного, одному...)"
    pronoun:
      reference: "§4.2.1.4"
      lines: [1244, 1254]
      description: "Займенник: особові займенники (я, ти, він/воно, вона, ми, ви, вони — повні відмінкові парадигми); присвійні займенники ч.р., с.р., ж.р. (мій, твій, наш, ваш, їхній)"

  # --- Case Usage (§4.2.2) ---
  cases:
    nominative:
      reference: "§4.2.2.1"
      lines: [1258, 1263]
      description: "Називний відмінок: суб'єкт активної дії; ідентифікація особи чи предмета; об'єкт зацікавлення (подобатися)"
    genitive:
      reference: "§4.2.2.2"
      lines: [1265, 1285]
      description: "Родовий відмінок: без прийменника (час і дата, заперечення об'єкта, кількість/міра з числівниками); із прийменниками з/із/зі (вихідний пункт, матеріал, початок дії), до (кінцевий пункт), для (призначення, мета), біля, навпроти (місце)"
    dative:
      reference: "§4.2.2.3"
      lines: [1287, 1291]
      description: "Давальний відмінок: особа або предмет, для яких відбувається дія (на користь/шкоду); суб'єкт кількісної вікової ознаки"
      first_module: 1
      required: true
    accusative:
      reference: "§4.2.2.4"
      lines: [1293, 1302]
      description: "Знахідний відмінок: без прийменника (прямий об'єкт дії); із прийменниками в, у, на (кінцевий пункт руху), у/в (початок дії), про (об'єктні відношення)"
    instrumental:
      reference: "§4.2.2.5"
      lines: [1304, 1322]
      description: "Орудний відмінок: без прийменника (професія/статус, знаряддя/засіб, об'єкт дії/стану); із прийменниками з/із/зі (спільність дії, ознака), над, під, перед, за, між (простір/шлях), між (об'єктні відношення), перед (час дії)"
      first_module: 4
      required: true
    locative:
      reference: "§4.2.2.6"
      lines: [1324, 1332]
      description: "Місцевий відмінок: у, в, на (місце перебування); у, в (час: місяць, рік); по (шлях руху); у, в (ознака особи чи предмета)"
    vocative:
      reference: "§4.2.2.7"  # numbered §4.2.2.6 in Standard text
      lines: [1334, 1337]
      description: "Кличний відмінок: адресат мовлення — потенційний суб'єкт дії або стану"

  # --- Verb Forms (§4.2.3) ---
  verbs:
    indicative:
      reference: "§4.2.3.1"
      lines: [1341, 1359]
      description: "Дійсний спосіб: дієвідмінювання в теперішньому часі (мріяти, казати, іти, їхати, кричати, ходити, їздити, пити, боротися); форми минулого часу; складена форма майбутнього часу недоконаного виду; майбутній час доконаного виду"
    imperative:
      reference: "§4.2.3.2"
      lines: [1361, 1365]
      description: "Наказовий спосіб: форми 2-ї і 3-ї особи однини і множини (мрій, мрійте, хай/нехай мріє, хай/нехай мріють; кажи, кажіть; пий, пийте; борися, боріться)"
      required_patterns: ["хай", "нехай"]
      required_forms: ["2nd_person", "3rd_person"]

  # Presence requirement for 3rd person imperative
  imperative_complete:
    reference: "§4.2.3.2"
    lines: [1361, 1365]
    requirement_id: "REQ-A2-IMPERATIVE-3RD"
    arc_position: 23
    module: 23
    required_patterns: ["хай", "нехай"]

  # --- Word Formation (§4.3) ---
  word_formation:
    adjective_comparison:
      reference: "§4.3.1"
      lines: [1369, 1378]
      description: "Ступені порівняння якісних прикметників: проста форма вищого ступеня (солодший); проста форма найвищого ступеня (найсолодший); складена форма вищого (більш солодкий, менш кислий); складена форма найвищого (найбільш солодкий); суплетивні форми (великий – більший, малий – менший)"
    aspect_pairs:
      reference: "§4.3.2"
      lines: [1380, 1381]
      description: "Видові пари дієслів (робити – зробити, ділити – поділити, писати – написати, виходити – вийти, забувати – забути)"

  # --- Syntax (§4.4) ---
  syntax:
    declarative:
      reference: "§4.4.1.1"
      lines: [1387, 1389]
      description: "Розповідне речення: стверджувальне (Студент відповідає) та заперечне (Студент не відповідає)"
    interrogative:
      reference: "§4.4.1.2"
      lines: [1391, 1398]
      description: "Питальне речення: інтонаційне; загальне з часткою чи; з питальними словами де, звідки, куди, з ким, про кого; загальні хто це? що це?"
    imperative_sentence:
      reference: "§4.4.1.3"
      lines: [1400, 1401]
      description: "Спонукальне речення: вираження розпорядження, прохання, поради, пропозиції"
    complex_sentence:
      reference: "§4.4.2"
      lines: [1403, 1416]
      description: "Складне речення: складносурядні з і (й), та (зі значенням і); складносурядні з але; складнопідрядні зі сполучними словами де, куди, звідки; складнопідрядні зі сполучником що; причини з тому що, бо; мети зі сполучником щоб"

  # --- Stylistics (§4.5) ---
  stylistics:
    lexical:
      reference: "§4.5.1"
      lines: [1420, 1425]
      description: "Стилістичні засоби лексики: антоніми (тут – там, весело – сумно), синоніми (водій – шофер), епітети (веселі птахи, золоті руки), метафори (прийшла осінь, місто спить)"
    syntactic:
      reference: "§4.5.2"
      lines: [1427, 1432]
      description: "Стилістичні засоби синтаксису: звертання, еліпсис, повтор"

  # --- Thematic Areas (§3) ---
  themes:
    reference: "§3 (Каталог Б)"
    lines: [1072, 1163]
    topics: ["людина", "дім, помешкання", "щоденне життя, побут", "дозвілля", "навчання", "робота", "купівля", "їжа та напої", "послуги", "Здоров’я й особиста гігієна", "Середовище перебування (місто чи село)", "подорожі", "природа, погода", "традиції, свята"]

# ============================================================
# B1 — Середній рівень першого ступеня (lines 1434-2450)
# ============================================================
b1:
  level_lines: [1434, 2450]

  immersion:
    metalanguage_bridge: [1, 2, 3, 4, 5]
    full_immersion_start: 6
    target_percentage: 90.0
    reference: "Curriculum design decision"

  # --- Phonetics (§4.1) ---
  phonetics:
    vowels_consonants:
      reference: "§4.1.1"
      lines: [1992, 2013]
      description: "Голосні та приголосні звуки: чергування [о], [е] з [і]; [о], [е] з фонетичним нулем; [о] з [е] після шиплячих та [й]; [г], [к], [х] із [ж], [ч], [ш] у кличному відмінку; [г], [к], [х] із [з´], [ц´], [с´] у давальному і місцевому відмінках ж.р. та місцевому ч.р./с.р.; чергування під час словотворення; чергування [д] – [дж], [с] – [ш], [к] – [ч], [т] – [ч]; спрощення у групах приголосних"
    stress:
      reference: "§4.1.2"
      lines: [2015, 2020]
      description: "Наголос: подвійний (по́милка – поми́лка, за́вжди – завжди́); для розрізнення слів (замо́к – за́мок); для розрізнення форм (ру́ки – руки́)"
    euphony:
      reference: "§4.1.3"
      lines: [2022, 2026]
      description: "Засоби милозвучності української мови: уживання прийменників у, в (жив у Варшаві, була в Україні); сполучників і, й (Нью-Йорк і Київ, Полтава й Одеса); прийменника з і його варіантів зі, із (з авдиторії, зі стола / зі столу, із Сингапуру)"
    intonation:
      reference: "§4.1.4"
      lines: [2028, 2028]
      description: "Інтонація (розповідна, питальна, оклична)"
    abbreviations:
      reference: "§4.1.5"
      lines: [2030, 2034]
      description: "Графічні засоби компресії писемного тексту: абревіатури (ВР України, Кабмін, ООН); скорочення іменників (вул., м, кг); скорочення порядкових числівників (1-й, 3-тє, об 11 год)"

  # --- Morphology (§4.2) ---
  morphology:
    noun_declension:
      reference: "§4.2.1.1"
      lines: [2041, 2073]
      description: "Іменник: відмінкові форми ч.р. на твердий приголосний, на -ар, на -яр, на -о, на -ж, -ч, -ш, -щ, на -ин (-анин, -янин), на м'який приголосний, на -ень, -ець, на -ий (вартовий, молодий); ж.р. на твердий (-а), м'який (-я), на -ія, з нульовим закінченням (любов, осінь, подорож, тінь), на -ість (радість, молодість); с.р. на -о, -е, на -я (завдання, знаряддя, прислів'я); множинні іменники (двері, окуляри, Карпати, Черкаси)"
    adjective_declension:
      reference: "§4.2.1.2"
      lines: [2075, 2083]
      description: "Прикметник: форми ч.р., ж.р., с.р. (-ий/-ій, -а/-я, -е/-є); прикметники ч.р. з нульовим закінченням у називному та знахідному відмінках (зелен, молод, потрібен); форми множини (-і)"
    numeral:
      reference: "§4.2.1.3"
      lines: [2085, 2093]
      description: "Числівник: родово-відмінкові форми порядкових числівників (третій, сотий, двадцята, двохтисячне); кількісні числівники один, два (дві), три, чотири; неозначені числівники (багато, кілька, декілька)"
    pronoun:
      reference: "§4.2.1.4"
      lines: [2095, 2113]
      description: "Займенник: особові займенники (я, ти, він, воно, вона, ми, ви, вони); присвійні займенники (мій, моє, твій, твоє, наш, наше, ваш, ваше, їхній, їхнє; моя, твоя, наша, ваша, їхня); зворотний займенник себе (собі, собою, на собі); вказівні займенники (той, те; цей, це; та, ця); питально-відносні займенники (хто, що, який, яка, яке, чий, чия, чиє, котрий, котра, котре)"

  # --- Case Usage (§4.2.2) ---
  cases:
    nominative:
      reference: "§4.2.2.1"
      lines: [2118, 2133]
      description: "Називний відмінок: суб'єкт активної дії; ідентифікація особи чи предмета; носій характеристики – компонент складеного іменного присудка; вказівка на факти, події; наявність особи або предмета; об'єкт зацікавлення (подобається, потрібна); об'єкт порівняння (Київ більш давній, ніж Львів); означення часового відтинку; стан"
    genitive:
      reference: "§4.2.2.2"
      lines: [2135, 2181]
      description: "Родовий відмінок: без прийменника (належність особі, ознака предмета, носій ознаки, характеристика суб'єкта, кількісна партитивність, кількісно-іменні відношення, час і дата дії, об'єкт дії під час заперечення, кількість та міра, об'єкт бажання/очікування); із прийменниками: з, із, зі, від (вихідний пункт), з, із, зі (галузь, матеріал), до (кінцевий пункт, об'єкт дії, об'єкт порівняння), до, для (призначення, мета), біля, серед, недалеко від, справа від, зліва від, навпроти, посеред (місце), від (напрям руху від особи/предмета), від, з (причина), від (об'єкт порівняння), без (відсутність)"
    dative:
      reference: "§4.2.2.3"
      lines: [2183, 2192]
      description: "Давальний відмінок: особа або предмет, для яких відбувається дія (на користь чи на шкоду); суб'єкт певного стану (мені не спиться, нам весело); адресат дії; особа, яка потребує чого-небудь (тобі треба, Олені потрібна допомога); суб'єкт кількісної вікової ознаки"
    accusative:
      reference: "§4.2.2.4"
      lines: [2194, 2217]
      description: "Знахідний відмінок: без прийменника (прямий об'єкт дії; час дії, тривалість, повторюваність); із прийменниками: в, у, на, за (кінцевий пункт руху), в, у, за, через (час завершення дії, день тижня), за (об'єкт порівняння), через (шлях руху, причина), на, за (тривалість дії), за, про (об'єктні відношення), на (об'єкт порівняння; стан або ознака суб'єкта), по (мета дії: послати по лікаря, піти по воду)"
    instrumental:
      reference: "§4.2.2.5"
      lines: [2219, 2244]
      description: "Орудний відмінок: без прийменника (характеристика за професією чи статусом, знаряддя і засіб дії, засіб пересування, об'єкт дії і стану, шлях руху); із прийменниками: з, із, зі (об'єкт спільної дії, ознака предмета, ознака дії), над, під, перед, за, між (місце розташування), між (об'єктні відношення), перед (передування дії)"
    locative:
      reference: "§4.2.2.6"
      lines: [2246, 2256]
      description: "Місцевий відмінок: у, в, на (місце перебування); у, в (час дії); по (шлях руху, характеристика об'єкта); у, в (ознака особи чи предмета); о, об (час дії)"
    vocative:
      reference: "§4.2.2.7"
      lines: [2258, 2265]
      description: "Кличний відмінок: адресат мовлення – потенційний суб'єкт дії (Максиме); адресат мовлення – потенційний суб'єкт стану; адресат мовлення – адресат ідентифікації; акцентований адресат мовлення (пане кухарю)"

  # --- Verb Forms (§4.2.3) ---
  verbs:
    indicative:
      reference: "§4.2.3.1"
      lines: [2269, 2291]
      description: "Дійсний спосіб: дієвідмінювання дієслів у теперішньому часі (запрошувати, мити, митися, брати, знайомити); дати, їсти в майбутньому і теперішньому часі; форми роду і числа минулого часу недоконаного і доконаного виду; майбутній час недоконаного виду – складена форма (буду боротися) та синтетична форма (боротимуся, питимеш); майбутній час доконаного виду (скажу, закричите)"
    imperative:
      reference: "§4.2.3.2"
      lines: [2293, 2295]
      description: "Наказовий спосіб: утворення форм наказового способу: 1-а особа множини (мріймо, скажімо, пиймо, борімося); 2-а особа однини і множини (мрій, кажіть, скажіть, пий, пийте, борися, боріться); 3-я особа (хай / нехай бореться, хай / нехай борються)"
    conditional:
      reference: "§4.2.3.3"
      lines: [2297, 2298]
      description: "Умовний спосіб: утворення форм умовного способу: говорив би, випила б, прочитали б"

  # --- Word Formation (§4.3) ---
  word_formation:
    adjective_comparison:
      reference: "§4.3.1"
      lines: [2302, 2310]
      description: "Ступені порівняння якісних прикметників: проста форма вищого ступеня (важчий, легший, дорожчий); проста форма найвищого ступеня (найважчий, найлегший); складена форма вищого ступеня (більш синій, менш холодний); складена форма найвищого ступеня (найбільш високий, найменш потрібний); суплетивні форми (гарний – кращий, поганий – гірший)"
    adverb_comparison:
      reference: "§4.3.2"
      lines: [2312, 2318]
      description: "Ступені порівняння якісно-означальних прислівників: проста форма вищого ступеня (важко – важче, легко – легше); проста форма найвищого ступеня (найважче, найлегше); складена форма вищого ступеня (більш сучасно, менш холодно); складена форма найвищого ступеня (найбільш високо, найменш потрібно); суплетивні форми (гарно – краще, погано – гірше)"
    person_names:
      reference: "§4.3.3"
      lines: [2320, 2321]
      description: "Утворення назв осіб за видом діяльності: співати – співак, викладати – викладач, читати – читач"
    deverbal_nouns:
      reference: "§4.3.4"
      lines: [2323, 2324]
      description: "Утворення іменників від дієслів: читати – читання, говорити – говоріння, бачити – бачення"
    place_names:
      reference: "§4.3.5"
      lines: [2326, 2327]
      description: "Утворення іменників – назв місць за виконуваною дією: спати – спальня, приймати – приймальня, читати – читальня, вітати – вітальня"
    denominal_adjectives:
      reference: "§4.3.6"
      lines: [2330, 2331]
      description: "Утворення прикметників від іменників: осінь – осінній, вечір – вечірній, Львів – львівський"
    deadjectival_adverbs:
      reference: "§4.3.7"
      lines: [2333, 2334]
      description: "Утворення прислівників від прикметників: український – по-українськи (по-українському), швидкий – швидко"
    prefixed_motion_verbs:
      reference: "§4.3.8"
      lines: [2336, 2338]
      description: "Утворення префіксальних дієслів руху: іти – прийти, перейти, дійти, відійти, зайти, вийти; їхати – приїхати, переїхати, доїхати, від’їхати, заїхати, поїхати, виїхати, об’їхати"

  # --- Syntax (§4.4) ---
  syntax:
    declarative:
      reference: "§4.4.1.1"
      lines: [2344, 2352]
      description: "Розповідне речення: стверджувальне; заперечне; заперечне зі словами немає, не було, не буде; подвійне заперечення (нічого не зрозуміла, нічим не цікавишся)"
    interrogative:
      reference: "§4.4.1.2"
      lines: [2354, 2361]
      description: "Питальне речення: просте питальне інтонаційне; просте питальне загальне з часткою чи; з питальним словом, спеціальні запитання де?, звідки?, куди?, з ким?, про кого?, який?, яка?"
    imperative_sentence:
      reference: "§4.4.1.3"
      lines: [2363, 2365]
      description: "Спонукальне речення (вираження розпорядження, прохання, поради, пропозиції): Дайте, будь ласка, дві склянки молока. Обміркуйте нашу пропозицію!"
    complex_simple:
      reference: "§4.4.2"
      lines: [2367, 2378]
      description: "Просте ускладнене речення: просте речення з однорідними членами; з дієприкметниковим зворотом; з дієприслівниковим зворотом; зі вставними словами (мабуть, можливо, здається)"
    complex_sentence:
      reference: "§4.4.3"
      lines: [2380, 2431]
      description: "Складне речення: складносурядне (сполучники і; а, але; або... або, чи... чи); складнопідрядне з’ясувальне (що, хто, де, куди, звідки, щоб, скільки, чому, навіщо, який); означальне (який, яка, яке, які); часове (коли: одночасність, різночасність); причини (тому що, бо, через те що); умови (якщо, якби, коли б); мети (щоб); допустове (хоч, дарма що, незважаючи на те що); складні речення з прямою та непрямою мовою"

  # --- Stylistics (§4.5) ---
  stylistics:
    formal_informal:
      reference: "§4.5.1"
      lines: [2435, 2450]
      description: "Офіційне й неофіційне спілкування: стилістичні засоби лексики (антоніми, синоніми, епітети, метафори); стилістичні засоби синтаксису (звертання, еліпсис, повтор, порівняння: вищий, ніж я; вищий за мене; вищий від мене; як батько)"

  themes:
    reference: "§3 (Каталог Б)"
    lines: [1853, 1980]
    topics: ["людина", "дім", "щоденне життя", "дозвілля", "подорожі", "суспільні відносини", "здоров'я", "освіта", "робота", "купівля", "ресторан", "послуги", "місця", "природа", "традиції"]

# ============================================================
# B2 — Середній рівень другого ступеня (lines 2452-3479)
# ============================================================
b2:
  level_lines: [2452, 3480]

  immersion:
    target_percentage: 90.0
    reference: "Curriculum design decision"

  # --- Morphology (§4.1) ---
  morphology:
    noun_declension:
      reference: "§4.1.1.1"
      lines: [3084, 3114]
      description: "Іменник: відмінкові форми ч.р. на твердий приголосний, на -ар (-яр), із закінченнями -о, -а, на -ж, -ч, -ш, -щ, на м'який приголосний (дідуньо), на -ець, -ень, на -ин (-анин, -янин), на -ий (Котляревський); ж.р. на -а (-я), на -а прикметникового походження (набережна, наречена), з нульовим закінченням (Прип'ять, сіль, мазь, матір); с.р. на -о, -е, на -а (-я) із суфіксами -ат-(-ят-), -ен- (курча, немовля, плем'я, ім'я), на -е (-є) прикметникового походження (минуле, майбутнє); множинні іменники (ножиці, гроші, сутінки, шахи); іменники спільного роду (листоноша, приблуда, базікало, плакса); абревіатури та складноскорочені слова (Дніпрогес, Мін'юст, МОН, ФОП, ЦУМ)"
    adjective_declension:
      reference: "§4.1.1.2"
      lines: [3116, 3129]
      description: "Прикметник: прикметники ч.р., ж.р., с.р. із закінченнями -ий (-ій), -а (-я), -е (-є); прикметники ч.р. з нульовим закінченням (сестрин, братів, Андріїв); складні прикметники з компонентом -лиций (білолиций, круглолиций); форми множини (-і); складні прикметники з першим компонентом кількісним числівником (двоярусний, трикутний, двадцятип'ятирічний)"
    numeral:
      reference: "§4.1.1.3"
      lines: [3131, 3149]
      description: "Числівник: відмінювання числівників на позначення часу і дати; родово-відмінкові форми порядкових числівників (тисячний, тисячна, тисячне); складені порядкові числівники (сто третій, сто третя); кількісні числівники від 1 до 100"
    pronoun:
      reference: "§4.1.1.4"
      lines: [3151, 3165]
      description: "Займенник: особові (я, ти, ми, ви); особово-вказівні (він, вона, воно, вони); присвійні (мій, моє, моя; твій, твоє, твоя; наш, наше, наша; ваш, ваше, ваша; свій, своє, своя; їхній, їхня, їхнє); зворотний займенник себе; вказівні (той, та, те, ті; цей, ця, це, ці); відмінювання питально-відносних (хто, що; який, чий, котрий; скільки); відмінювання неозначених (хтось, хто-небудь, щось, що-небудь; якийсь, який-небудь, чийсь, чий-небудь)"

  # --- Case Usage (§4.1.2) ---
  cases:
    nominative:
      reference: "§4.1.2.1"
      lines: [3170, 3178]
      description: "Називний відмінок: суб'єкт активної дії (Народ обрав президента); носій характеристики особи – компонент складеного іменного присудка; об'єкт зацікавлення; об'єкт порівняння (Кохання сильніше, ніж смерть); стан особи, колективу, природи (Зима)"
    genitive:
      reference: "§4.1.2.2"
      lines: [3180, 3215]
      description: "Родовий відмінок: без прийменника (належність, ознака предмета чи особи, суб'єкт дії віддієслівного іменника, кількісно-іменні відношення, час і дата дії, прямий об'єкт дії під час заперечення); із прийменниками: з, із, зі, від (вихідний пункт), з, із, зі (галузь, матеріал), до (кінцевий пункт), до, для (призначення, мета), біля, серед, недалеко від, справа від, зліва від, навпроти, посеред (місце), від (напрямок руху від особи/предмета), від, з (причина), без (відсутність, обмеження)"
    dative:
      reference: "§4.1.2.3"
      lines: [3217, 3223]
      description: "Давальний відмінок: особа або предмет, для яких відбувається дія (на користь чи на шкоду); суб'єкт певного стану (Мирославі поки що щастило); суб'єкт кількісної вікової ознаки (синові шість років)"
    accusative:
      reference: "§4.1.2.4"
      lines: [3225, 3247]
      description: "Знахідний відмінок: без прийменника (безпосередній прямий об'єкт дії, тривалість дії, шлях руху); із прийменниками: в, у, на, за (кінцевий пункт руху), в, у, за, через (час завершення дії), на, за (тривалість дії), за, про (об'єктні відношення), на (причина, мета, призначення), під (кінцевий пункт руху: під'їхати під будинок), повз (переміщення щодо нерухомого об'єкта)"
    instrumental:
      reference: "§4.1.2.5"
      lines: [3249, 3271]
      description: "Орудний відмінок: без прийменника (реальна чи бажана характеристика особи зі словами стати, бути; знаряддя і засіб дії; засіб пересування; об'єкт стану; шлях руху); із прийменниками: з, із, зі (об'єкт спільної дії, ознака предмета, ознака дії), над, під, перед, за, між (розташування об'єкта), між (об'єктні відношення), перед (часове передування діяльності)"
    locative:
      reference: "§4.1.2.6"
      lines: [3273, 3284]
      description: "Місцевий відмінок: у, в, на (місце перебування особи чи розташування предмета); у, в (час дії, стану); по (шлях руху, характеристика об'єкта); у, в (ознака особи чи предмета); о, об (час дії)"
    vocative:
      reference: "§4.1.2.7"
      lines: [3286, 3293]
      description: "Кличний відмінок: адресат мовлення – потенційний суб'єкт дії (сестричко); адресат мовлення – потенційний суб'єкт стану (братику); адресат мовлення – адресат ідентифікації (Оленко); акцентований адресат мовлення – нейтралізований суб'єкт (шановна громадо)"

  # --- Verb Forms (§4.1.3) ---
  verbs:
    indicative:
      reference: "§4.1.3.1"
      lines: [3297, 3317]
      description: "Дійсний спосіб: дієвідмінювання дієслів недоконаного виду в теперішньому часі (вимірювати, зоставатися, везти, возити); недоконаного виду в майбутньому часі (складена й синтетична форми: буду висловлювати / висловлюватиму); дати (роздати), їсти (з'їсти); минулий час за родами і числами; доконаного виду в майбутньому часі (звикну, звикнеш)"
    imperative:
      reference: "§4.1.3.2"
      lines: [3319, 3321]
      description: "Наказовий спосіб: утворення різних форм наказового способу (ходи, ходімо, ходіть, хай / нехай ходить(-ять); літай, літаймо, літайте, хай / нехай літає(-ють))"
    conditional:
      reference: "§4.1.3.3"
      lines: [3323, 3324]
      description: "Умовний спосіб: утворення форм умовного способу: знав би, придумала б, відслужили б, якби закричав, -ла, -ло, -ли"

  # --- Word Formation (§4.2) ---
  word_formation:
    adjective_comparison:
      reference: "§4.2.1"
      lines: [3328, 3336]
      description: "Ступені порівняння якісних прикметників: проста форма вищого ступеня (молодший, солодший, сильніший); проста форма найвищого ступеня (наймолодший, найсолодший, найсильніший); складена форма вищого ступеня (більш / менш солодкий, сильний); складена форма найвищого ступеня (найбільш / найменш солодкий); суплетивні форми (великий – більший, малий – менший)"
    adverb_comparison:
      reference: "§4.2.2"
      lines: [3338, 3346]
      description: "Ступені порівняння якісно-означальних прислівників: проста форма вищого ступеня (солодко – солодше, сильно – сильніше, доступно – доступніше); проста форма найвищого ступеня (найсильніше, найдоступніше); складена форма вищого ступеня (більш / менш корисно, доступно); складена форма найвищого ступеня (найбільш / найменш корисно); суплетивні форми (багато – більше, мало – менше)"
    aspect_pairs:
      reference: "§4.2.3"
      lines: [3348, 3350]
      description: "Утворення видових пар дієслів: писати – написати, робити – зробити, темніти – потемніти, вивчати – вивчити, говорити – сказати, захищати – захистити, сполучати – сполучити"
    prefixed_motion:
      reference: "§4.2.4"
      lines: [3352, 3354]
      description: "Утворення префіксальних дієслів руху: іти – піти, прийти, зайти (увійти), вийти, дійти, перейти, обійти; їхати – поїхати, приїхати, заїхати (в’їхати), виїхати, доїхати, переїхати, об’їхати"
    agent_nouns:
      reference: "§4.2.5"
      lines: [3356, 3357]
      description: "Утворення назв осіб за видом діяльності: діяти – діяч, виконувати – виконавець, просити – прохач, танцювати – танцівник"
    deverbal_nouns_nnja:
      reference: "§4.2.6"
      lines: [3359, 3361]
      description: "Утворення іменників – назв діяльності (суфікси -нн-, -енн-, -інн-): читати – читання, сполучати – сполучання, креслити – креслення, навантажувати – навантаження, сполучити – сполучення, ходити – ходіння"
    deverbal_nouns_zero:
      reference: "§4.2.7"
      lines: [3363, 3364]
      description: "Утворення іменників – назв діяльності (нульовий суфікс): захищати – захист, приходити – прихід, додавати – додаток"
    place_names:
      reference: "§4.2.8"
      lines: [3366, 3367]
      description: "Утворення іменників – назв місць за виконуваною дією: спати – спальня, приймати – приймальня, читати – читальня, лікувати – лікарня"
    denominal_adjectives:
      reference: "§4.2.9"
      lines: [3369, 3370]
      description: "Утворення прикметників від іменників: осінь – осінній, вечір – вечірній, Київ – київський"
    deadjectival_adverbs:
      reference: "§4.2.10"
      lines: [3372, 3373]
      description: "Утворення прислівників від прикметників: український – по-українськи (по-українському), швидкий – швидко"

  # --- Syntax (§4.3) ---
  syntax:
    declarative:
      reference: "§4.3.1.1"
      lines: [3379, 3381]
      description: "Розповідне речення: стверджувальне (Люблю я присмерки пахучі квітневих вечорів); заперечне (Не люблю втручатися в чуже життя)"
    interrogative:
      reference: "§4.3.1.2"
      lines: [3383, 3389]
      description: "Питальне речення: просте питальне загальне з часткою чи; з питальним словом, спеціальні запитання де?, звідки?, куди?, з ким?, про кого?, який?, яка?; з відтінком запрошення (Хочете послухати цю музику?)"
    imperative_sentence:
      reference: "§4.3.1.3"
      lines: [3391, 3393]
      description: "Спонукальне речення (вираження розпорядження, прохання, поради, пропозиції): Дайте, будь ласка, дві склянки молока. Обміркуйте нашу пропозицію!"
    complex_simple:
      reference: "§4.3.2"
      lines: [3395, 3407]
      description: "Просте ускладнене речення: з однорідними членами; з однорідними членами й узагальнювальним словом; з дієприкметниковим зворотом; з дієприслівниковим зворотом; зі вставними словами; зі звертанням"
    one_member:
      reference: "§4.3.3"
      lines: [3409, 3418]
      description: "Просте односкладне речення: з головним членом – дієсловом: означено-особові, неозначено-особові, безособові; з головним членом – іменником (номінативні речення: Вечір. Омріяна прохолода. Спокій…)"
    complex_sentence:
      reference: "§4.3.4"
      lines: [3420, 3445]
      description: "Складне речення: складнопідрядні зі з’ясувальною частиною (що, щоб, куди, звідки, скільки, чому, навіщо, який); з означальною частиною (який, котрий, що); із часовою частиною (коли: одночасність, різночасність); причини; умови (якщо, якби, коли б); допусту (хоч)"
    direct_indirect_speech:
      reference: "§4.3.5"
      lines: [3446, 3449]
      description: "Пряма і непряма мова: сполучники що, щоб, частка чи в разі заміни прямої мови непрямою"

  # --- Stylistics (§4.4) ---
  stylistics:
    phonetic:
      reference: "§4.4.1.1"
      lines: [3453, 3458]
      description: "Стилістичні засоби фонетики (засоби милозвучності): уживання прийменників у, в; сполучників і, й; прийменника з і його варіантів зі, із; уживання у – в на початку слова (улітку – влітку, удень – вдень)"
    lexical:
      reference: "§4.4.1.2"
      lines: [3459, 3469]
      description: "Стилістичні засоби лексики: антоніми, синоніми, омоніми (мати – мати, замóк – зáмок), епітети, метафори, скорочення (год, р., ст.), зменшувально-пестливі форми (вуличка, річенька, матуся), складні слова, звуконаслідування (Няв!, Гав!)"
    syntactic:
      reference: "§4.4.1.3"
      lines: [3470, 3479]
      description: "Стилістичні засоби синтаксису: звертання, еліпсис, повтор, порівняння (краще, ніж я; краще за мене; кращий від мене; білий, як сніг), уточнення, елементи структурування тексту (вставні слова): по-перше, по-друге, по-третє, отже та ін."

  themes:
    reference: "§3 (Каталог Б)"
    lines: [2874, 3065]
    topics: ["людина", "дім", "побут", "культурне дозвілля", "спорт", "подорожі", "суспільні відносини", "економіка", "здоров'я", "освіта", "робота", "купівля", "харчування", "послуги", "місця", "природа", "наука і техніка", "медіа", "традиції"]

