  C9:
    binding: 'Heading printed in the textbook text, extracted verbatim with its position by #8341, keyed by
      book title, grade/level, headed-unit identity and page. Never an ingester section label.'
    source_fields:
      section_title: 'Heading PRINTED in eligible textbook text, extracted verbatim with its position by #8341;
        may head a theme, paragraph or chapter. Never textbook_sections.title without printed-heading proof.'
      book_title: Verbatim source textbook title, part of book identity; never an ingester label.
      grade: Verbatim source grade or university-level label, part of book identity; never authored or inferred.
