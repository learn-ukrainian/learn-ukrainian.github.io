        sense_variant: with_sense
        template: "Подай форму слова «{lemma}» за граматичним позначенням: {slot}\nЗначення: {sense}"
        slots:
          - lemma
          - slot
          - sense
      - id: C2.agreed_form.02
        operation: agreed_form
        sense_variant: with_sense
        template: "Запиши слово «{lemma}» у формі: {slot}\nЗначення: {sense}"
        slots:
          - lemma
          - slot
          - sense
      - id: C2.agreed_form.03
