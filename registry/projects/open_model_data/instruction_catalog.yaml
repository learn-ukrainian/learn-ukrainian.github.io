  C3:
    binding: Headword sense ↔ ULIF synonym/antonym group for that same sense, or stressed СУМ-20 headword
      ↔ the verbatim definition of that same article's selected sense.
    source_fields:
      headword: ULIF headword of the selected sense for synonyms/antonyms; verbatim СУМ-20 stressed article
        headword for sense_definition. Never add or remove stress.
      sense: ULIF sense label/text from the selected sense; never an authored gloss
    sense_definition_contract:
      context: c3-sense-context.v1
      context_parts:
        - register_labels
        - sense_citations
      context_values: verbatim_same_article_and_sense_source_order
      target: verbatim_same_sense_definition
      applicability:
        with_citations: At least one of the selected sense's own sum20_citations is model-visible context.
        single_sense: Exactly one unquarantined sense in the article and no citations; citations are not required.
        withhold: Multi-sense article without citations for the selected sense; missing headword/definition,
          quarantined article or non-discriminating context.
      specification: docs/projects/open-model-data/instruction-catalog.md
    required_context:
      - sense_identity
      - ulif_group_identity_or_sum20_article_and_sense_identity
      - source_locator
    target_policy: For synonyms/antonyms, target is the verbatim ULIF group for the selected headword sense
      and operation. For sense_definition, target is only the selected СУМ-20 sense's verbatim definition;
      register labels and that sense's citations may be context, never another sense or an authored gloss.
    exclusions:
      - Wrong-sense ULIF groups; invented glosses; synonyms/antonyms without a source-readable sense label.
      - For sense_definition, quarantined articles, missing stressed headword/definition, multi-sense articles
        without citations for the selected sense, or context that does not distinguish conflicting definitions
        for the same model-visible headword.
