        sense_variant: with_sense
        template: "Утвори форму слова «{lemma}»: {slot}\nЗначення: {sense}"
        slots:
          - lemma
          - slot
          - sense
      - id: C2.agreed_form.05
        operation: agreed_form
        sense_variant: with_sense
        template: "Добери форму слова «{lemma}»: {slot}\nЗначення: {sense}"
