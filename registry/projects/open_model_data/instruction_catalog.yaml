interpolation:
  mode: verbatim_source_fields_only
  missing_field: withhold
  empty_field_policy: Missing fields and empty or whitespace-only declared slots withhold. C2 sense must exist as a
    string; an empty or whitespace-only sense selects without_sense only if homonym forms do not differ and
    the headword group has no parse_error. Absent header levels are positional empty arrays or an empty row
    string; at least one authenticated header cell must contain non-whitespace text.
  transformations: fixed_lossless_serialization_only
  recursive_interpolation: false
  scope: Only instructions[].template is project-authored training text. All other catalog fields are control
    metadata and must not be exported as instructions or answers.
  field_mapping: Slots name binding roles from PLAN.md, not guessed physical database columns. E4 must authenticate
    the exact source adapter and row/field locators before any rendering.
  quoted_slot_policy: Withhold values containing guillemets when their slot is enclosed in guillemets;
    never escape, rewrite or nest same-form quotes. Sentence, example and printed-heading slots
    follow a colon without enclosing quotes; their source punctuation stays intact. Sense slots are final,
    unquoted fields after a colon, with no added terminal punctuation; parentheses remain verbatim.
prefix_metric:
  id: instruction-prefix.v1-draft
  status: proposed
  scope: Per component, operation and exported split; additionally the whole split for visibility. C7 remains
    opt-in and separate.
  prefix_lengths:
    - 1
    - 4
  top1_max: 0.15
  top5_max: 0.6
  small_denominator: N<10 is insufficient evidence, never PASS. For N>=10 use exact shares without rounding
    allowances; infeasible integer counts withhold the build.
  specification: docs/projects/open-model-data/instruction-catalog.md
