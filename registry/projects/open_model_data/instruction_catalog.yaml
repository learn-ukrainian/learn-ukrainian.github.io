        operation: agreed_form
        template: 'Назви форму слова «{lemma}» з таким граматичним позначенням: {slot}'
        slots:
          - lemma
          - slot
      - id: C2.agreed_form.10
        operation: agreed_form
        template: 'Відтвори форму слова «{lemma}» за позначенням: {slot}'
        slots:
          - lemma
          - slot
      - id: C2.agreed_form.11
        operation: agreed_form
        template: 'Постав слово «{lemma}» у форму: {slot}'
        slots:
          - lemma
