      - ulif_group_identity
      - source_locator
    target_policy: Target is the verbatim ULIF group for the selected headword sense and operation.
    exclusions:
      - Wrong-sense groups; invented glosses; a sense with no source-readable label is withheld for this draft.
    line_count: 24
    line_count_rationale: Twelve lines per operation give balanced top1=1/12 and top5=5/12. After two disputed
      lines are dropped, ten distinct starts give 0.10/0.50, retaining slack under proposed 0.15/0.60 bounds.
