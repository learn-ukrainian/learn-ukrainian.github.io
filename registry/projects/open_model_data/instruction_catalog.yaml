---
# Draft only; PA6 still requires non-author reviews and the E5-backed checker.
schema_version: instruction-catalog.v1
version: 0.4.0-draft
status: draft
training_eligible: false
issue: 9611
plan:
  path: docs/projects/open-model-data/PLAN.md
  version: 3.4.4
  body_sha256: 2d5db0ae7d15336b61c361c1dacdf89c3c9811cfd0109acc8f156f16149e94e1
interpolation:
  mode: verbatim_source_fields_only
  missing_field: withhold
  empty_field_policy: Missing fields and empty or whitespace-only declared slots withhold. C2 sense must exist as a
    string; an empty or whitespace-only sense selects without_sense only if homonym forms do not differ and
    the headword group has no parse_error. Absent header levels are positional empty arrays or an empty row
    string; at least one authenticated header cell must contain non-whitespace text.
  transformations: fixed_lossless_serialization_only
  recursive_interpolation: false
  scope: Only instructions[].template is project-authored training text. All other catalog fields are control
    metadata and must not be exported as instructions or answers.
  field_mapping: Slots name binding roles from PLAN.md, not guessed physical database columns. E4 must authenticate
    the exact source adapter and row/field locators before any rendering.
  quoted_slot_policy: Withhold values containing guillemets when their slot is enclosed in guillemets;
    never escape, rewrite or nest same-form quotes. Sentence, example, context and printed-heading slots
    follow a colon without enclosing quotes; their source punctuation stays intact. Sense slots are final,
    unquoted fields after a colon, with no added terminal punctuation; parentheses remain verbatim.
prefix_metric:
  id: instruction-prefix.v1-draft
  status: proposed
  scope: Per component, operation and exported split; additionally the whole split for visibility. C7 remains
    opt-in and separate.
  prefix_lengths:
    - 1
    - 4
  top1_max: 0.15
  top5_max: 0.6
  small_denominator: N<10 is insufficient evidence, never PASS. For N>=10 use exact shares without rounding
    allowances; infeasible integer counts withhold the build.
  specification: docs/projects/open-model-data/instruction-catalog.md
components:
  C1:
    binding: Learner sentence ↔ aligned human-corrected sentence; same document and annotator. Unchanged no-edit
      pairs remain eligible; they teach preservation rather than over-correction.
    source_fields:
      sentence: UA-GEC learner sentence; same document and annotator as the human correction
    required_context:
      - same_document
      - same_annotator
      - both_annotation_layers
      - source_locator
    target_policy: Target is the verbatim aligned human-corrected sentence, never a model correction. With
      no human edits, the target is the unchanged source sentence.
    exclusions:
      - Dev/final documents and authors; unaligned pairs.
    line_count: 12
    line_count_rationale: Twelve lines per operation give balanced top1=1/12 and top5=5/12. After two disputed
      lines are dropped, ten distinct starts give 0.10/0.50, retaining slack under proposed 0.15/0.60 bounds.
      Repetition is measured separately; counts do not prove semantic diversity.
    instructions:
      - id: C1.sentence_correction.01
        operation: sentence_correction
        template: 'Перевір речення і виправ помилки, якщо вони є: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.02
        operation: sentence_correction
        template: 'Подай речення після перевірки; виправ лише наявні помилки: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.03
        operation: sentence_correction
        template: 'Запиши речення, виправивши помилки, якщо вони є: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.04
        operation: sentence_correction
        template: 'Відредагуй речення, якщо воно потребує виправлень; інакше збережи його: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.05
        operation: sentence_correction
        template: 'Усунь помилки, якщо вони є, і запиши речення: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.06
        operation: sentence_correction
        template: 'Наведи речення після перевірки, зберігши його, якщо помилок немає: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.07
        operation: sentence_correction
        template: 'Речення перевір і запиши; за потреби виправ помилки: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.08
        operation: sentence_correction
        template: 'Як слід записати це речення? Якщо помилок немає, збережи його: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.09
        operation: sentence_correction
        template: 'Збережи речення, якщо воно правильне; якщо є помилки, виправ їх: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.10
        operation: sentence_correction
        template: 'Виправ лише наявні помилки й подай речення; збережи його, якщо воно правильне: {sentence}'
        slots:
          - sentence
      - id: C1.sentence_correction.11
        operation: sentence_correction
        template: 'Правильно запиши речення, залишивши його без змін, якщо помилок немає: {sentence}'
