  C5:
    binding: Printed paragraph example ↔ that same paragraph; never an outside example.
    source_fields:
      example: Example printed inside the cited Правопис 2019 paragraph
    required_context:
      - same_paragraph_example
      - paragraph_locator
    target_policy: Target is the complete verbatim Правопис 2019 paragraph (§) with its locator, as stored
      by E3b; no sub-point unit is stored or requested. The source example belongs to that §.
    exclusions:
      - External examples; outside-case rule selection; examples whose paragraph identity is ambiguous.
    line_count: 12
    line_count_rationale: Twelve lines per operation give balanced top1=1/12 and top5=5/12. After two disputed
      lines are dropped, ten distinct starts give 0.10/0.50, retaining slack under proposed 0.15/0.60 bounds.
      Repetition is measured separately; counts do not prove semantic diversity.
    instructions:
      - id: C5.printed_spelling_rule.01
        operation: printed_spelling_rule
        template: 'Подай повний текст параграфа Правопису, у якому наведено приклад: {example}'
        slots:
          - example
      - id: C5.printed_spelling_rule.02
        operation: printed_spelling_rule
        template: 'Наведи дослівно параграф Правопису, що містить такий приклад: {example}'
