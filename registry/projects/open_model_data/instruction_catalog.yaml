      - id: C1.sentence_correction.12
        operation: sentence_correction
        template: 'За потреби виправ помилки, а речення залиш без змін, якщо воно правильне: {sentence}'
        slots:
          - sentence
  C2:
    binding: Lemma + fixed header-cell serialization + visible source sense when nonempty → all agreed variant forms;
      VESUM/ULIF agreement and ULIF stress remain mandatory.
    source_fields:
      lemma: Verbatim ulif_dictua_entries.canonical_headword, authenticated as the P3 tuple headword
      slot: c2-header-cells.v2 JSON serialization of verbatim ULIF paradigm header cells; source is
        ulif_dictua_sections.payload_json.raw_html with rows cross-check and exact cell locators.
      sense: Verbatim ulif_dictua_entries.sense_gloss; empty selects without_sense only with equal homonym forms
        and no group parse_error.
    serialization:
      header_slot: c2-header-cells.v2
      target: ordered_json_array_all_agreed_variants
      sense_visibility: with_sense_variant_only
      empty_sense: without_sense_if_equal_forms_and_no_group_parse_error
      parse_error_homonym: withhold_group_empty_sense_records
      ambiguous_sense: withhold_missing_or_non_discriminating
      specification: docs/projects/open-model-data/instruction-catalog.md
    required_context:
      - homonym_sense
      - variant
      - vesum_ulif_agreement
      - source_locator
      - grammatical_tags
      - lossless_homonym_identifier
      - header_cell_locators
      - complete_variant_agreement
      - model_visible_sense_when_nonempty
      - headword_group_parse_error_check
    target_policy: Target is one JSON array containing every agreed form_stressed for the entry and grammatical slot,
      ordered by variant_order then form id. Never select one variant or discard a disagreed variant; withhold
      the entire record if agreement is incomplete. Tuple identity and per-variant locators stay in metadata.
    exclusions:
      - Asterisks, preposition-bound forms, unmapped labels, failed entries and single-source forms.
      - No authenticated header cells; numeric identifiers or code-list labels used as printable headers.
      - Differing homonym forms with missing sense_gloss or the same gloss mapping to conflicting targets.
      - Missing variant agreement, variant locators or source ordering; never silently select one variant.
      - Empty-sense records in any headword group containing a homonym with status=parse_error.
    line_count: 24
    line_count_rationale: Twelve lines per sense variant of agreed_form give balanced top1=1/12 and top5=5/12.
      After two disputed lines are dropped, ten distinct starts give 0.10/0.50,
