  C6:
    binding: UA-GEC sentence×annotator units with at least one edit and only F/Calque edits; mixed units belong
      to C1. Same document/annotator and split isolation. Book pairs name both forms in the same cited passage,
      individually signed off by Sol and Opus.
    source_fields:
      sentence: UA-GEC learner sentence containing the aligned F/Calque edit
      expression: Original expression explicitly named in the same Антоненко-Давидович passage as its replacement;
        each pair requires Sol and Opus sign-off.
    required_context:
      - same_document_annotator_or_signed_book_pair
      - aligned_calque_edit_or_explicit_pair
      - source_locator
      - calque_only_sentence_annotator_or_signed_book_pair
      - author_identity_for_book_pair
    target_policy: Sentence targets are verbatim aligned human-corrected sentences with only F/Calque edits
      in that sentence×annotator unit. Book targets are replacements explicitly printed in the same passage;
      author identity stays in authenticated context.
    exclusions:
      - Dev/final documents; book pairs without both forms or without individual Sol and Opus sign-off.
      - Mixed-tag sentence×annotator units (route to C1); no-edit units; any edit other than F/Calque.
    line_count: 24
    line_count_rationale: Twelve lines per operation give balanced top1=1/12 and top5=5/12. After two disputed
      lines are dropped, ten distinct starts give 0.10/0.50, retaining slack under proposed 0.15/0.60 bounds.
      Repetition is measured separately; counts do not prove semantic diversity.
    instructions:
      - id: C6.calque_correction.01
        operation: calque_correction
        template: 'Виправ кальку в реченні: {sentence}'
        slots:
          - sentence
      - id: C6.calque_correction.02
        operation: calque_correction
        template: 'Подай речення без кальки: {sentence}'
        slots:
