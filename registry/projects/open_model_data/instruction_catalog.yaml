  C4:
    binding: Idiom ↔ definition ↔ citation in the same dictionary entry.
    source_fields:
      idiom: Idiom printed in the dictionary entry
    required_context:
      - same_entry_definition
      - same_entry_citation
      - source_locator
    target_policy: Target definition and supporting citation are verbatim fields from one dictionary entry.
      Every instruction explicitly requests both definition and supporting citation from that entry; citation
      remains in the target, not context only.
    exclusions:
      - Citation overlap with exam/protection rulers; unresolved dictionary edition.
    line_count: 12
    line_count_rationale: Twelve lines per operation give balanced top1=1/12 and top5=5/12. After two disputed
      lines are dropped, ten distinct starts give 0.10/0.50, retaining slack under proposed 0.15/0.60 bounds.
      Repetition is measured separately; counts do not prove semantic diversity.
