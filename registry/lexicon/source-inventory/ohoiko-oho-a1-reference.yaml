version: 1
kind: atlas_source_inventory
sources:
- id: ohoiko-oho-a1-reference
  source_family: ohoiko
  extraction_mode: curated_key_word
  title: A1 reference workbook lexical inventory
  path: oho-ukrainian-grammar-workbook-a1.pdf
  notes: 'Words-only extraction per the 2026-07-10 IP boundary (issues #4851/#4223). Only glossary
    headwords and appendix infinitives are retained; no English, explanations, unit sentences or conjugation
    columns. Printed pages 200–216 contain the glossary; 217–223 contain the verb table; 224–229 contain
    back matter. Apostrophes use U+2019. PDF Latin lookalikes are transcribed as the printed Cyrillic
    glyphs; acute vowels preserve their printed stress. Parenthetical pronoun subjects are omitted
    from conjugation variants. Book-labelled POS is preserved; entries without a printed abbreviation
    use unlabelled. Single-word vesum_pos lists every sorted unique POS of lemma-bound analyses, not
    inflections of other lemmas. Phrases retain per-token verification without vesum_pos. Proper-name
    vesum_tags retain only lemma-bound analyses with the prop marker. Appendix POS is verb. Verification
    states attest forms; an inflected form can be found with an empty lemma-bound vesum_pos. Missing
    means no VESUM form analysis, never a lookup failure.'
