name: Security Audit (blocking)

# Blocking dependency-vulnerability security gate for production dependencies.
# Enforces zero unsuppressed High or Critical vulnerabilities across Python
# (pip-audit with .pip-audit-ignore.yaml) and Node.js production dependencies
# (npm audit with scripts/config/npm-audit-ignore.yaml).
#
# Reference issue: learn-ukrainian-infra-private#703

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    # Weekly Monday 09:00 UTC — surfaces newly-disclosed advisories between landings.
    - cron: '0 9 * * 1'
    # Daily 04:23 UTC — keeps the dependency-advisory tracking issue current (#9871).
    - cron: '23 4 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'requirements-lock.txt'
      - 'site/package-lock.json'
      - 'scripts/config/pip-audit-ignore.yaml'
      - 'scripts/config/npm-audit-ignore.yaml'
      - 'requirements-machinery.lock'
      - '.github/workflows/security-audit.yml'

jobs:
  pip-audit:
    name: pip-audit (blocking)
    # Weekly Monday schedule, PRs and dispatch only: the daily 04:23 UTC run
    # exists solely to refresh the advisory tracking issue (#9871).
    if: ${{ github.event.schedule != '23 4 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The installed release has no implicit product: name this checkout.
    env:
      LU_PRODUCT_ROOT: ${{ github.workspace }}
      LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: pip-audit (blocking with suppression)
        run: |
          python -m pip install --upgrade pip pip-audit pyyaml
          version="$(sed -nE 's/^lu-machinery==([0-9]+(\.[0-9]+)*) \\$/\1/p' requirements-machinery.lock)"
          wheelhouse="${RUNNER_TEMP}/lu-machinery-wheelhouse"
          mkdir -p "$wheelhouse"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 300 --connect-timeout 20 \
            -o "${wheelhouse}/lu_machinery-${version}-py3-none-any.whl" \
            "https://github.com/learn-ukrainian/machinery/releases/download/v${version}/lu_machinery-${version}-py3-none-any.whl"
          sed -n '/^lu-machinery==/,/--hash=/p' requirements-machinery.lock > "${RUNNER_TEMP}/lu-machinery-lock.txt"
          python -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${RUNNER_TEMP}/lu-machinery-lock.txt"
          echo "::group::pip-audit (requirements-lock.txt)"
          python -m lu_machinery.ci.audit_dependencies --skip-node
          echo "::endgroup::"

  npm-audit:
    name: npm-audit (blocking)
    # Weekly Monday schedule, PRs and dispatch only: the daily 04:23 UTC run
    # exists solely to refresh the advisory tracking issue (#9871).
    if: ${{ github.event.schedule != '23 4 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The installed release has no implicit product: name this checkout.
    env:
      LU_PRODUCT_ROOT: ${{ github.workspace }}
      LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: npm audit (blocking production check with suppressions)
        run: |
          python -m pip install --upgrade pip pyyaml
          version="$(sed -nE 's/^lu-machinery==([0-9]+(\.[0-9]+)*) \\$/\1/p' requirements-machinery.lock)"
          wheelhouse="${RUNNER_TEMP}/lu-machinery-wheelhouse"
          mkdir -p "$wheelhouse"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 300 --connect-timeout 20 \
            -o "${wheelhouse}/lu_machinery-${version}-py3-none-any.whl" \
            "https://github.com/learn-ukrainian/machinery/releases/download/v${version}/lu_machinery-${version}-py3-none-any.whl"
          sed -n '/^lu-machinery==/,/--hash=/p' requirements-machinery.lock > "${RUNNER_TEMP}/lu-machinery-lock.txt"
          python -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${RUNNER_TEMP}/lu-machinery-lock.txt"
          echo "::group::npm audit (production deps, audited suppressions)"
          python -m lu_machinery.ci.audit_dependencies --skip-python
          echo "::endgroup::"
          echo "::group::npm audit (all, advisory summary)"
          npm audit --prefix site || true
          echo "::endgroup::"

  advisory-issue:
    name: Dependency advisory tracking issue
    # The daily 04:23 UTC schedule (and manual dispatch) on the default branch
    # maintains a single issue labelled dependency-advisory with unsuppressed
    # findings, closing it when the audit comes back clean (#9871). The weekly
    # schedule and PR runs never touch issues.
    if: ${{ github.ref == 'refs/heads/main' && (github.event.schedule == '23 4 * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    # The installed release has no implicit product: name this checkout.
    env:
      LU_PRODUCT_ROOT: ${{ github.workspace }}
      LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Collect unsuppressed findings
        run: |
          python -m pip install --upgrade pip pip-audit pyyaml
          version="$(sed -nE 's/^lu-machinery==([0-9]+(\.[0-9]+)*) \\$/\1/p' requirements-machinery.lock)"
          wheelhouse="${RUNNER_TEMP}/lu-machinery-wheelhouse"
          mkdir -p "$wheelhouse"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 300 --connect-timeout 20 \
            -o "${wheelhouse}/lu_machinery-${version}-py3-none-any.whl" \
            "https://github.com/learn-ukrainian/machinery/releases/download/v${version}/lu_machinery-${version}-py3-none-any.whl"
          sed -n '/^lu-machinery==/,/--hash=/p' requirements-machinery.lock > "${RUNNER_TEMP}/lu-machinery-lock.txt"
          python -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${RUNNER_TEMP}/lu-machinery-lock.txt"
          python -m lu_machinery.ci.dependency_advisory_issue collect --out ci-artifacts/dependency-findings.json

      - name: Plan tracking-issue action
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="$(gh issue list --label dependency-advisory --state open --json number --limit 1 --jq '.[0].number // ""')"
          python -m lu_machinery.ci.dependency_advisory_issue plan \
            --findings ci-artifacts/dependency-findings.json \
            --issue-number "$ISSUE_NUMBER" \
            --body-out ci-artifacts/advisory-issue-body.md

      - name: Apply tracking-issue action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ steps.plan.outputs.action }}
          ISSUE_NUMBER: ${{ steps.plan.outputs.issue_number }}
        run: |
          set -euo pipefail
          echo "advisory-issue action: $ACTION (issue: ${ISSUE_NUMBER:-none})"
          case "$ACTION" in
            create)
              gh label create dependency-advisory --force \
                --description "Unsuppressed dependency advisories from the scheduled audit" --color BFD4F2
              gh issue create --label dependency-advisory \
                --title "Dependency advisories: unsuppressed findings (scheduled audit)" \
                --body-file ci-artifacts/advisory-issue-body.md
              ;;
            update)
              gh issue edit "$ISSUE_NUMBER" --body-file ci-artifacts/advisory-issue-body.md
              ;;
            close)
              gh issue close "$ISSUE_NUMBER" \
                --comment "Scheduled dependency audit is clean: no unsuppressed findings. Closing."
              ;;
            none)
              echo "Audit clean and no open tracking issue; nothing to do."
              ;;
            *)
              echo "::error::Unknown advisory-issue action: $ACTION"
              exit 1
              ;;
          esac

  stack-currency:
    name: Stack currency (report only)
    # Weekly Monday 09:00 UTC only. The daily 04:23 UTC run refreshes advisory
    # findings; pull_request and workflow_dispatch do not publish this report.
    # Versions and repo-relative paths only, as a comment on the open
    # dependency-advisory issue. This job never opens a pull request.
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Collect pinned versus latest stable
        run: |
          python -m pip install --upgrade pip pyyaml
          python -m scripts.ci.stack_currency_report collect --out ci-artifacts/stack-currency.json
          python -m scripts.ci.stack_currency_report render --report ci-artifacts/stack-currency.json --body-out ci-artifacts/stack-currency.md
          cat ci-artifacts/stack-currency.md

      - name: Comment on the open dependency-advisory issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(gh issue list --label dependency-advisory --state open --json number --limit 1 --jq '.[0].number // ""')"
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No open dependency-advisory issue; the report stays local to this job."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file ci-artifacts/stack-currency.md
