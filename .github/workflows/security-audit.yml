name: Security Audit (blocking)

# Scheduled and manually dispatched dependency advisory checks. The required
# PR and merge-group scans run in ci.yml. This workflow checks Python
# (pip-audit over every group in uv.lock)
# and Node.js production dependencies (npm audit with
# scripts/config/npm-audit-ignore.yaml).
# The path-filtered PR runs also validate changes to this workflow.
#
# Reference issue: learn-ukrainian-infra-private#703

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    # Weekly Monday 09:00 UTC — surfaces newly-disclosed advisories between landings.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/config/npm-audit-ignore.yaml'
      - '.github/workflows/security-audit.yml'

jobs:
  pip-audit:
    name: pip-audit (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The installed release has no implicit product: name this checkout.
    env:
      LU_PRODUCT_ROOT: ${{ github.workspace }}
      LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
          # The audit exports uv.lock with uv (lu_machinery.ci.audit_dependencies).
          with-uv: 'true'

      - name: Install locked audit dependencies
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          UV_PROJECT_ENVIRONMENT: .venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --locked --no-build --python "$(cat .python-version)" --only-group audit --no-install-package lu-machinery
          uv pip install --python .venv/bin/python --no-index --no-deps --require-hashes \
            --find-links "${MACHINERY_WHEELHOUSE}" -r "${MACHINERY_REQUIREMENT}"

      - name: pip-audit (blocking Python lock)
        env:
          LU_MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
        run: .venv/bin/python -m lu_machinery.ci.audit_dependencies --skip-node

  npm-audit:
    name: npm-audit (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The installed release has no implicit product: name this checkout.
    env:
      LU_PRODUCT_ROOT: ${{ github.workspace }}
      LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
          with-uv: 'true'

      - name: Install locked audit dependencies
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          UV_PROJECT_ENVIRONMENT: .venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --locked --no-build --python "$(cat .python-version)" --only-group machinery --no-install-package lu-machinery
          uv pip install --python .venv/bin/python --no-index --no-deps --require-hashes \
            --find-links "${MACHINERY_WHEELHOUSE}" -r "${MACHINERY_REQUIREMENT}"

      - name: npm audit (blocking production check with suppressions)
        run: |
          echo "::group::npm audit (production deps, audited suppressions)"
          .venv/bin/python -m lu_machinery.ci.audit_dependencies --skip-python
          echo "::endgroup::"
