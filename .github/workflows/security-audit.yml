name: Security Audit (blocking)

# Scheduled and manually dispatched dependency advisory checks. The required
# PR and merge-group scans run in ci.yml. This workflow checks Python
# (pip-audit over the uv.lock export, with scripts/config/pip-audit-ignore.yaml)
# and Node.js production dependencies (npm audit with
# scripts/config/npm-audit-ignore.yaml).
# PRs that change the scheduled npm audit or its policy validate it here.
#
# Reference issue: learn-ukrainian-infra-private#703

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  schedule:
    # Weekly Monday 09:00 UTC — surfaces newly-disclosed advisories between landings.
    - cron: '0 9 * * 1'
    # Daily 04:23 UTC — keeps the dependency-advisory tracking issue current (#9871).
    - cron: '23 4 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/config/npm-audit-ignore.yaml'
      - '.github/workflows/security-audit.yml'

jobs:
  pip-audit:
    name: pip-audit (blocking)
    # Weekly Monday schedule and dispatch only. The daily 04:23 UTC run
    # exists solely to refresh the advisory tracking issue (#9871).
    if: ${{ github.event_name != 'pull_request' && github.event.schedule != '23 4 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The installed release has no implicit product: name this checkout.
    env:
      LU_PRODUCT_ROOT: ${{ github.workspace }}
      LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
          # The audit exports uv.lock with uv (lu_machinery.ci.audit_dependencies).
          with-uv: 'true'

      - name: Install locked audit dependencies
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          UV_PROJECT_ENVIRONMENT: .venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --locked --no-build --python "$(cat .python-version)" --only-group audit --no-install-package lu-machinery
          uv pip install --python .venv/bin/python --no-index --no-deps --require-hashes \
            --find-links "${MACHINERY_WHEELHOUSE}" -r "${MACHINERY_REQUIREMENT}"

      - name: pip-audit (blocking with suppression)
        env:
          LU_MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
        run: .venv/bin/python -m lu_machinery.ci.audit_dependencies --skip-node

  npm-audit:
    name: npm-audit (blocking)
    # Weekly Monday schedule, dispatch and audit-policy PRs. The daily 04:23 UTC run
    # exists solely to refresh the advisory tracking issue (#9871).
    if: ${{ github.event.schedule != '23 4 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The installed release has no implicit product: name this checkout.
    env:
      LU_PRODUCT_ROOT: ${{ github.workspace }}
      LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
          with-uv: 'true'

      - name: Install locked audit dependencies
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          UV_PROJECT_ENVIRONMENT: .venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --locked --no-build --python "$(cat .python-version)" --only-group machinery --no-install-package lu-machinery
          uv pip install --python .venv/bin/python --no-index --no-deps --require-hashes \
            --find-links "${MACHINERY_WHEELHOUSE}" -r "${MACHINERY_REQUIREMENT}"

      - name: npm audit (blocking production check with suppressions)
        run: |
          echo "::group::npm audit (production deps, audited suppressions)"
          .venv/bin/python -m lu_machinery.ci.audit_dependencies --skip-python
          echo "::endgroup::"
          echo "::group::npm audit (all, advisory summary)"
          npm audit --prefix site || true
          echo "::endgroup::"

  advisory-findings:
    name: Collect dependency advisory findings
    # PRs and branch dispatches render the same report without publishing it.
    if: github.event.schedule == '23 4 * * *' || github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      action: ${{ steps.plan.outputs.action }}
    # The installed release has no implicit product: name this checkout.
    env:
      LU_PRODUCT_ROOT: ${{ github.workspace }}
      LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
          # The audit exports uv.lock with uv (lu_machinery.ci.audit_dependencies).
          with-uv: 'true'

      - name: Install locked audit dependencies
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          UV_PROJECT_ENVIRONMENT: .venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --locked --no-build --python "$(cat .python-version)" --only-group audit --no-install-package lu-machinery
          uv pip install --python .venv/bin/python --no-index --no-deps --require-hashes \
            --find-links "${MACHINERY_WHEELHOUSE}" -r "${MACHINERY_REQUIREMENT}"

      - name: Collect unsuppressed findings
        env:
          LU_MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
        run: .venv/bin/python -m lu_machinery.ci.dependency_advisory_issue collect --out ci-artifacts/dependency-findings.json

      - name: Render the tracking-issue body
        id: plan
        run: |
          .venv/bin/python -m lu_machinery.ci.dependency_advisory_issue plan \
            --findings ci-artifacts/dependency-findings.json --body-out ci-artifacts/advisory-issue-body.md

      - name: Upload the rendered advisory report
        if: steps.plan.outputs.action == 'create'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-advisory-report
          path: ci-artifacts/advisory-issue-body.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  advisory-issue:
    name: Dependency advisory tracking issue
    needs: advisory-findings
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Download the rendered advisory report
        if: needs.advisory-findings.outputs.action == 'create'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-advisory-report
          path: ${{ runner.temp }}/dependency-advisory/

      - name: Apply tracking-issue action
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ needs.advisory-findings.outputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            create|none) ;;
            *)
              echo "::error::Unknown advisory-issue action: $ACTION"
              exit 1
              ;;
          esac
          ISSUE_NUMBER="$(gh issue list --label dependency-advisory --state open --json number --limit 1 --jq '.[0].number // ""')"
          if [[ "$ACTION" == create ]]; then
            BODY="$RUNNER_TEMP/dependency-advisory/advisory-issue-body.md"
            test -s "$BODY"
            if [[ -n "$ISSUE_NUMBER" ]]; then
              gh issue edit "$ISSUE_NUMBER" --body-file "$BODY"
            else
              gh label create dependency-advisory --force \
                --description "Unsuppressed dependency advisories from the scheduled audit" --color BFD4F2
              gh issue create --label dependency-advisory \
                --title "Dependency advisories: unsuppressed findings (scheduled audit)" \
                --body-file "$BODY"
            fi
          elif [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue close "$ISSUE_NUMBER" \
              --comment "Scheduled dependency audit is clean: no unsuppressed findings. Closing."
          else
            echo "Audit clean and no open tracking issue; nothing to do."
          fi

  stack-currency:
    name: Stack currency (report only)
    # Weekly Monday 09:00 UTC only. The daily 04:23 UTC run refreshes advisory
    # findings. Manual dispatches skip this report.
    # Versions and repo-relative paths only, as a comment on the open
    # dependency-advisory issue. This job never opens a pull request.
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
          with-uv: 'true'

      - name: Install locked audit dependencies
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          UV_PROJECT_ENVIRONMENT: .venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --locked --no-build --python "$(cat .python-version)" --only-group machinery --no-install-package lu-machinery
          uv pip install --python .venv/bin/python --no-index --no-deps --require-hashes \
            --find-links "${MACHINERY_WHEELHOUSE}" -r "${MACHINERY_REQUIREMENT}"

      - name: Collect pinned versus latest stable
        env:
          LU_PRODUCT_ROOT: ${{ github.workspace }}
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
        run: |
          .venv/bin/python -m lu_machinery.ci.stack_currency_report collect --out ci-artifacts/stack-currency.json
          .venv/bin/python -m lu_machinery.ci.stack_currency_report render --report ci-artifacts/stack-currency.json --body-out ci-artifacts/stack-currency.md
          cat ci-artifacts/stack-currency.md

      - name: Upload stack currency report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-currency-report
          path: ci-artifacts/stack-currency.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  stack-currency-issue:
    name: Comment with stack currency report
    needs: stack-currency
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Download stack currency report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stack-currency-report
          path: ${{ runner.temp }}/stack-currency/

      - name: Comment on the open dependency-advisory issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(gh issue list --label dependency-advisory --state open --json number --limit 1 --jq '.[0].number // ""')"
          if [[ -z "$ISSUE_NUMBER" ]]; then
            echo "No open dependency-advisory issue; the report is available as a workflow artifact."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/stack-currency/stack-currency.md"
