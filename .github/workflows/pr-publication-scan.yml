name: PR publication scan

# The edit-time publication scan. ci.yml does not subscribe to `edited`, so a
# PR title or body edit re-checks only the PR text here instead of restarting
# the full suite. ci.yml still scans publication fields for PR pushes and the
# merge queue.
#
# "Scan PR publication fields" blocks a bad title or body edit once branch
# protection requires it. It also runs for merge_group, so the required
# context reports on queue candidates. No push trigger: a push run would add a
# skipped check of the same name to the head, and a skipped check counts as
# success for a required context.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  # Keyed by PR number: a rapid edit cancels the previous scan, and the newer
  # run checks the same or a newer head. Queue runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-publication:
    # Reads title, body, branch and commit messages from the event and the
    # current PR metadata; a queue run reads every member's current metadata.
    name: Scan PR publication fields
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for commit messages; no historical blobs.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
      # The locked lu-machinery wheel alone (no dependencies); the lock's hash decides which bytes install.
      - name: Install the locked lu-machinery release
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
        run: |
          set -euo pipefail
          wheelhouse="${MACHINERY_WHEELHOUSE}"
          python3 -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${MACHINERY_REQUIREMENT}"
      - name: Scan publication fields
        env:
          GH_TOKEN: ${{ github.token }}
          LU_PRODUCT_ROOT: ${{ github.workspace }}
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
        run: python3 scripts/audit/lint_opsec_leaks.py --event-file "$GITHUB_EVENT_PATH"
