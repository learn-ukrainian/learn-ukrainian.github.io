name: actionlint

# Structural/schema gate for GitHub Actions workflow files (root-cause fix for
# the #3739/#3742 break: a de-indented setup-node `with:` block was valid YAML
# but invalid Actions, slipped past yamllint + zizmor, and broke the Pages
# deploy in production). actionlint type-checks `${{ }}` expressions, validates
# step keys / `with:` inputs / runner labels, and lints `run:` scripts via the
# shellcheck preinstalled on GitHub runners.
#
# Runs on EVERY PR (no `paths:` filter) on purpose: it lints only the handful
# of workflow files, finishes in seconds, and — unlike the path-scoped
# validate-yaml job — is therefore safe to add to branch protection's required
# checks without deadlocking doc-only PRs (GitHub blocks on a *skipped* required
# check). The pinned version + checksums live in scripts/audit/check_workflows.sh,
# which both this job and local devs invoke (single source of truth).

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint (workflow files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      # This remains in the existing always-on workflow so a PR cannot add a
      # runner job without checking the complete PR workflow inventory.
      - name: Enforce CI runner-slot budget (#5818)
        env:
          LU_PRODUCT_ROOT: ${{ github.workspace }}
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check PyYAML==6.0.3
          # The locked lu-machinery wheel alone; the lock's hash decides which bytes install.
          version="$(sed -nE 's/^lu-machinery==([0-9]+(\.[0-9]+)*) \\$/\1/p' requirements-machinery.lock)"
          wheelhouse="${RUNNER_TEMP}/lu-machinery-wheelhouse"
          mkdir -p "$wheelhouse"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 300 --connect-timeout 20 \
            -o "${wheelhouse}/lu_machinery-${version}-py3-none-any.whl" \
            "https://github.com/learn-ukrainian/machinery/releases/download/v${version}/lu_machinery-${version}-py3-none-any.whl"
          sed -n '/^lu-machinery==/,/--hash=/p' requirements-machinery.lock > "${RUNNER_TEMP}/lu-machinery-lock.txt"
          .venv/bin/python -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${RUNNER_TEMP}/lu-machinery-lock.txt"
          .venv/bin/python -m lu_machinery.ci.slot_inventory --check

      - name: Lint workflows
        env:
          # Force the pinned, checksum-verified actionlint build for a
          # reproducible result even if a runner image ever bundles its own.
          ACTIONLINT_FORCE_DOWNLOAD: '1'
        run: scripts/audit/check_workflows.sh
