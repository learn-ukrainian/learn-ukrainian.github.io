name: actionlint

# Structural/schema gate for GitHub Actions workflow files (root-cause fix for
# the #3739/#3742 break: a de-indented setup-node `with:` block was valid YAML
# but invalid Actions, slipped past yamllint + zizmor, and broke the Pages
# deploy in production). actionlint type-checks `${{ }}` expressions, validates
# step keys / `with:` inputs / runner labels, and lints `run:` scripts via the
# shellcheck preinstalled on GitHub runners.
#
# On PRs, ci.yml runs actionlint through the shared fleet workflow. This job
# still runs the product runner-slot and interpolation checks. Main pushes and
# manual runs use the same pinned lint script as local developers.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint (workflow files)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'

      # This remains in the existing always-on workflow so a PR cannot add a
      # runner job without checking the complete PR workflow inventory.
      - name: Enforce CI runner-slot budget (#5818)
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          LU_PRODUCT_ROOT: ${{ github.workspace }}
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check PyYAML==6.0.3
          # The locked lu-machinery wheel alone; the lock's hash decides which bytes install.
          wheelhouse="${MACHINERY_WHEELHOUSE}"
          .venv/bin/python -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${MACHINERY_REQUIREMENT}"
          .venv/bin/python -m lu_machinery.ci.slot_inventory --check

      - name: Check workflow interpolation
        if: github.event_name == 'pull_request'
        run: .venv/bin/python scripts/audit/check_untrusted_workflow_interpolation.py

      # The release tarball comes from the Actions cache, keyed on the version
      # pinned in check_workflows.sh; a miss downloads it through the
      # authenticated releases API. The script checks the tarball's sha256 on
      # every run, a cache hit included.
      - name: Read the pinned actionlint version
        if: github.event_name != 'pull_request'
        id: actionlint-pin
        run: |
          set -euo pipefail
          mapfile -t versions < <(sed -nE 's/^ACTIONLINT_VERSION="([0-9]+(\.[0-9]+)*)"$/\1/p' scripts/audit/check_workflows.sh)
          if (( ${#versions[@]} != 1 )); then
            echo "::error::scripts/audit/check_workflows.sh must pin exactly one ACTIONLINT_VERSION"
            exit 1
          fi
          echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"

      - name: Restore the actionlint tarball
        if: github.event_name != 'pull_request'
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-cache
          key: actionlint-${{ steps.actionlint-pin.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Lint workflows
        if: github.event_name != 'pull_request'
        env:
          # Force the pinned, checksum-verified actionlint build for a
          # reproducible result even if a runner image ever bundles its own.
          ACTIONLINT_FORCE_DOWNLOAD: '1'
          ACTIONLINT_CACHE_DIR: ${{ runner.temp }}/actionlint-cache
          # contents: read is enough to download a public release.
          GH_TOKEN: ${{ github.token }}
        run: scripts/audit/check_workflows.sh

      # A few MiB, written only on a miss after verification. Main writes
      # the entry every ref can read.
      - name: Save the actionlint tarball
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
          && steps.actionlint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-cache
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}
