name: Integration sweep

# Read-only PR landing report. The local merge-queue keeper (#8564) owns landing.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: integration-sweep
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  # Read access to check/status metadata for the PR statusCheckRollup the sweep
  # requires for the required-CI decision. Branch-protection REST is off-limits
  # to GITHUB_TOKEN and rollup isRequired was removed by GitHub (#6748); the
  # documented `CI Gate` is the sole required check.
  checks: read
  statuses: read

jobs:
  sweep:
    name: PR landing report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Report PR landing state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python -m scripts.orchestration.integration_sweep --report --repo "$REPOSITORY" | tee "$RUNNER_TEMP/integration-sweep.txt"
          cat "$RUNNER_TEMP/integration-sweep.txt" >> "$GITHUB_STEP_SUMMARY"
