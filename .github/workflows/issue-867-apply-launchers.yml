name: Apply launcher secret drop

on:
  push:
    branches:
      - cursor/issue-867-secret-redaction-30b9
    paths:
      - .github/workflows/issue-867-apply-launchers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cursor/issue-867-secret-redaction-30b9
          fetch-depth: 0

      - name: Drop unneeded secrets before provider exec
        run: |
          python3 - << 'PY'
          from pathlib import Path
          needle = "launcher_adapter_exec() {\n"
          insert = needle + "  launcher_drop_unneeded_secrets || exit 1\n"
          for path in ("scripts/launchers/kimi.sh", "scripts/launchers/glm.sh"):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if insert in text:
                  continue
              if needle not in text:
                  raise SystemExit(f"missing launcher_adapter_exec in {path}")
              file.write_text(text.replace(needle, insert, 1), encoding="utf-8")
          PY
          test "$(git hash-object scripts/launchers/kimi.sh)" = "05fc2f416cfa01e4e74496abc7fc5d7cc0da52f1"
          test "$(git hash-object scripts/launchers/glm.sh)" = "6d4571d9e865e2b4e0628ac3e2a3712eb8509288"
          git add scripts/launchers/kimi.sh scripts/launchers/glm.sh
          git update-index --chmod=+x scripts/launchers/kimi.sh scripts/launchers/glm.sh
          git rm -f .github/workflows/issue-867-apply-launchers.yml
          if git diff --cached --quiet; then
            echo "nothing staged"
            exit 1
          fi
          for path in scripts/launchers/kimi.sh scripts/launchers/glm.sh run-dispatcher.sh; do
            mode=$(git ls-files -s "$path" | awk '{print $1}')
            test "$mode" = "100755"
          done
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git commit --trailer "X-Agent: grok/grok-4.7" -m "fix: drop unneeded API keys before Kimi and GLM exec"
          git push origin HEAD:cursor/issue-867-secret-redaction-30b9
