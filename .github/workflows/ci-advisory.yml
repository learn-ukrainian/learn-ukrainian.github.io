name: CI advisory

# Advisory PR checks. Never a required check and never in CI Gate's needs
# (ci.yml): a red step here is information for the reviewer, not a gate.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_HTTP_RETRIES: '6'
  UV_HTTP_TIMEOUT: '60'

jobs:
  advisory:
    name: Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Python CI environment
        uses: ./.github/actions/python-ci-env
      - name: TypeSafe triage (docs/best-practices/typesafe-jev.md, #8232)
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -m scripts.ci.typesafe_pr_triage
      - name: Atlas POC richness and learner anchors (#3930, advisory since #4515)
        continue-on-error: true
        run: |
          .venv/bin/python scripts/audit/audit_atlas_poc_richness.py \
            --max-search-no-visible-gloss 0 --max-old-gate-no-english-anchor 0 --max-poc-thin-pages 900
      - name: Atlas vocabulary manifest coverage (diff-scoped)
        continue-on-error: true
        run: .venv/bin/python scripts/lexicon/check_manifest_vocabulary_coverage.py --changed-only --base origin/main
