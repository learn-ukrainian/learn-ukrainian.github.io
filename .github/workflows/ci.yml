name: CI

concurrency:
  # Ref-wide cancellation made main structurally unverified: a later pending
  # run evicts an earlier pending run too. PRs may supersede themselves; SHAs may not.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  # CI/docs-only required-check history: #1641/#1544/#1546/#1644 established
  # that a filtered required check wedges as "Expected". #3725/#3873/#4888/
  # #4936/#5351/#5354 then established that every attempted widening merely
  # moved the omission. Routing is therefore advisory only; no required job
  # below reads these outputs. Keep the router and its fail-open action for
  # diagnostics and cost-saving advisory workflows.
  changes:
    name: Advisory path classification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      lesson_schema: ${{ steps.filter.outputs.lesson_schema }}
      atlas: ${{ steps.filter.outputs.atlas }}
      postmortems: ${{ steps.filter.outputs.postmortems }}
      preparation: ${{ steps.filter.outputs.preparation }}
      agent_config: ${{ steps.filter.outputs.agent_config }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/paths-filter-retry
        id: filter
        with:
          filters: |
            code: ['.github/workflows/ci.yml', 'scripts/**/*.py', 'tests/**/*.py', 'pyproject.toml', 'site/**']
            python: ['scripts/**/*.py', 'tests/**/*.py', 'scripts/config/**', 'curriculum/l2-uk-en/**']
            frontend: ['site/**', 'curriculum/l2-uk-en/**', 'scripts/generate_mdx.py', 'scripts/generate_mdx/**', 'scripts/yaml_activities.py']
            agent_config: ['AGENTS.md', 'CLAUDE.md', 'GEMINI.md', 'agents_extensions/**', '.mcp.json', '.cursor/mcp.json']
            lesson_schema: ['docs/lesson-contract.md', 'docs/lesson-schema.yaml', 'site/src/components/**', 'scripts/build/generate_lesson_schema.py', 'scripts/build/lesson_schema_extractor.mjs', 'scripts/pipeline/config_tables.py']
            atlas: ['site/src/data/lexicon-manifest.pointer.json', 'site/src/data/lexicon-daily-pool.json', 'site/src/data/lexicon-practice-reviewed-sources.json', 'site/public/lexicon/**', 'scripts/lexicon/**']
            postmortems: ['docs/bug-autopsies/**', 'scripts/audit/check_postmortems.py']
            preparation: ['curriculum/l2-uk-en/plans/bio/*.yaml', 'curriculum/l2-uk-en/bio/discovery/*.yaml', 'curriculum/l2-uk-en/bio/promotion-evidence.yaml', 'docs/research/bio/*.md', 'wiki/figures/*.md', 'wiki/figures/*.sources.yaml']

  plan:
    name: Pytest plan (LPT)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: durations
        with:
          path: ci-artifacts/pytest-durations.json
          key: pytest-durations-${{ runner.os }}-${{ hashFiles('requirements-lock.txt') }}-${{ github.sha }}
          restore-keys: |
            pytest-durations-${{ runner.os }}-${{ hashFiles('requirements-lock.txt') }}-
      - name: Install collection dependencies
        # INVARIANT: this install set must stay IDENTICAL to the pytest shard job's.
        # The planner imports every test module during collection, so anything a
        # shard can import the planner must import too. A planner-only gap makes
        # collection fail, which empties the shard matrix and makes the whole suite
        # SKIP while the run still looks plausible — the exact failure this PR hit.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # torch/torchvision/open_clip_torch excluded per #5749: no first-party
          # module imports them, and installing them on a 2-vCPU/~7GB runner caused
          # MemoryError / "can't start new thread". --no-deps means nothing can pull
          # them back transitively.
          grep -viE '^(torch|torchvision|open_clip_torch)==' requirements-lock.txt \
            > "${RUNNER_TEMP}/requirements-ci.txt"
          .venv/bin/python -m pip install --no-deps -r "${RUNNER_TEMP}/requirements-ci.txt"
          # NOT present in requirements-lock.txt, yet imported during collection
          # (huggingface_hub via FlagEmbedding). Omitting them is what made this
          # planner job fail: reproduced locally by making huggingface_hub
          # unimportable, which yields exactly the observed 2 collection errors.
          .venv/bin/python -m pip install --no-deps multiprocess==0.70.18 huggingface-hub==1.24.0
      - name: Collect once and write four duration-balanced plans
        run: |
          mkdir -p ci-artifacts
          .venv/bin/python scripts/ci/pytest_shards.py plan-all \
            --durations ci-artifacts/pytest-durations.json \
            --output-dir ci-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-plans
          path: ci-artifacts/
          if-no-files-found: error

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install static dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install ruff PyYAML
      - name: Lint Python
        run: .venv/bin/ruff check scripts/ tests/
      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.8

  pytest:
    name: Pytest [${{ matrix.shard }}/4]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pytest-plans
          path: ci-artifacts
      - name: Install test dependencies
        # INVARIANT: identical to the planner job's install set. See the comment
        # there — a divergence empties the shard matrix and silently skips the suite.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # torch/torchvision/open_clip_torch excluded per #5749 (merged): nothing
          # under scripts/ or tests/ imports them — the embedding worker owns its own
          # venv — and installing them on all shards exhausted a 2-vCPU/~7GB runner.
          # This also removes the CPU-wheel force-reinstall that existed only to stop
          # PyPI's CUDA build (needing libcudart.so.13) from winning; moot once torch
          # is not installed at all.
          grep -viE '^(torch|torchvision|open_clip_torch)==' requirements-lock.txt \
            > "${RUNNER_TEMP}/requirements-ci.txt"
          .venv/bin/python -m pip install --no-deps -r "${RUNNER_TEMP}/requirements-ci.txt"
          # Not in the lockfile, but imported during collection.
          .venv/bin/python -m pip install --no-deps multiprocess==0.70.18 huggingface-hub==1.24.0
      - name: Run planned shard with bounded worker concurrency
        run: |
          .venv/bin/python scripts/ci/pytest_shards.py run \
            --nodeids ci-artifacts/test-nodeids-${{ matrix.shard }}.txt -- \
            -v --tb=short -n 1 --dist loadgroup --junitxml=ci-artifacts/main-junit-${{ matrix.shard }}.xml --durations=0 \
            2>&1 | tee ci-artifacts/main-${{ matrix.shard }}.log
          cp ci-artifacts/plan-${{ matrix.shard }}.json ci-artifacts/plan.json
          cp ci-artifacts/main-junit-${{ matrix.shard }}.xml ci-artifacts/main-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: ci-artifacts/
          if-no-files-found: error

  artifact-contracts:
    name: Artifact contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # `generate_lesson_schema.py` shells out to `node` for
      # `scripts/build/lesson_schema_extractor.mjs` (see that script, ~line 190),
      # so this job needs Node and the root `npm ci` — the previous schema-drift
      # job had both and the rewrite dropped them, which is why
      # "Check generated lesson-schema contract" failed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install extractor dependencies
        run: npm ci
      - name: Check generated lesson-schema contract
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install PyYAML jsonschema
          .venv/bin/python scripts/build/generate_lesson_schema.py
          git diff --exit-code docs/lesson-schema.yaml

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The site build reads `site/src/data/lexicon-manifest.json`. The previous
      # frontend job restored it from cache and rehydrated it from the pointer when
      # stale; the rewrite dropped that, along with the Python venv the rehydrate
      # step needs — which is why "Build and test site" failed. Ported verbatim from
      # the job this replaces rather than improvised.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: '.python-version'
      - name: Create Python venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install jsonschema PyYAML
      - name: Restore Atlas lexicon manifest cache
        id: atlas-manifest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/src/data/lexicon-manifest.json
          key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
      - name: Verify Atlas manifest matches pointer (rehydrate if stale)
        run: |
          .venv/bin/python -c "import sys; sys.path.insert(0, 'scripts'); from lexicon.manifest_io import load_manifest; load_manifest(); print('Atlas manifest verified against pointer')"
      - name: Save Atlas lexicon manifest cache
        if: steps.atlas-manifest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/src/data/lexicon-manifest.json
          key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
      - name: Build and test site
        working-directory: site
        run: |
          npm ci
          npm run build
          npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error

  frontend-e2e:
    name: Frontend E2E (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site-dist
          path: site/dist
      - name: Install Playwright and test the built artifact
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown --exclude-paths=.trufflehogignore

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [plan, static, pytest, artifact-contracts, frontend, frontend-e2e, security]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.pytest.result == 'success'
        with:
          pattern: pytest-shard-*
          path: pytest-artifacts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: needs.pytest.result == 'success'
        with:
          python-version: '3.12'
      - name: Create verifier environment
        if: needs.pytest.result == 'success'
        run: python -m venv .venv
      - name: Verify complete pytest selection and execution counts
        if: needs.pytest.result == 'success'
        run: .venv/bin/python scripts/ci/pytest_shards.py verify-artifacts --artifact-dir pytest-artifacts
      - name: Fail closed on any non-success required job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "required job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '(^|,)(failure|cancelled|skipped)(,|$)'; then
            echo '::error::A required CI job failed, was cancelled, or was skipped.'
            exit 1
          fi
          if [ "$(printf '%s' "$RESULTS" | tr -cd ',' | wc -c | tr -d ' ')" -ne 6 ]; then
            echo '::error::CI Gate did not receive every required job result.'
            exit 1
          fi
      - name: Publish duration history from a successful main run
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ci-artifacts
          .venv/bin/python scripts/ci/pytest_shards.py parse-durations \
            --log pytest-artifacts/pytest-shard-1/main-1.log \
            --log pytest-artifacts/pytest-shard-2/main-2.log \
            --log pytest-artifacts/pytest-shard-3/main-3.log \
            --log pytest-artifacts/pytest-shard-4/main-4.log \
            --output ci-artifacts/pytest-durations.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: ci-artifacts/pytest-durations.json
          key: pytest-durations-${{ runner.os }}-${{ hashFiles('requirements-lock.txt') }}-${{ github.sha }}
