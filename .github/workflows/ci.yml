          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Restore Atlas lexicon manifest cache
        id: atlas-manifest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/src/data/lexicon-manifest.json
          key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
      - name: Verify Atlas manifest matches pointer (rehydrate if stale)
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from lexicon.manifest_io import load_manifest; load_manifest(); print('Atlas manifest verified against pointer')"
      - name: Save Atlas lexicon manifest cache
        if: steps.atlas-manifest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/src/data/lexicon-manifest.json
          key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
      - name: Install generator dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install PyYAML jsonschema
      - name: Regenerate changed curriculum MDX and check drift
        run: |
          .venv/bin/python scripts/audit/check_mdx_generation_drift.py --changed-vs-base origin/main

  pytest:
    name: Pytest [${{ matrix.shard }}/4]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pytest-plans
          path: ci-artifacts
      - name: Install test dependencies
        # INVARIANT: identical to the planner job's install set. See the comment
        # there — a divergence empties the shard matrix and silently skips the suite.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # torch/torchvision/open_clip_torch excluded per #5749 (merged): nothing
          # under scripts/ or tests/ imports them — the embedding worker owns its own
          # venv. Installing ~2.5GB of unused wheels on every shard is what preceded
          # the shard failures; the mechanism was never profiled (see the autopsy),
          # so the lesson is "do not install what the suite never imports", not a
          # claim about runner size. This also removes the CPU-wheel force-reinstall
          # that existed only to stop PyPI's CUDA build (needing libcudart.so.13)
          # from winning; moot once torch is not installed at all.
          grep -viE '^(torch|torchvision|open_clip_torch)==' requirements-lock.txt \
            > "${RUNNER_TEMP}/requirements-ci.txt"
          .venv/bin/python -m pip install --no-deps -r "${RUNNER_TEMP}/requirements-ci.txt"
          # Not in the lockfile, but imported during collection.
          .venv/bin/python -m pip install --no-deps multiprocess==0.70.18 huggingface-hub==1.24.0
      # The suite reads site/src/data/lexicon-manifest.json. Without these steps
      # `load_manifest()` downloads a ~30MB release asset over HTTP mid-test — network
      # I/O inside the gate, which is the profile of the test that held a runner for
      # 357 minutes (#5740). The job this replaced had them; the rewrite dropped them.
      # Caught by the cross-family gate review of #5752 (BLOCKING finding 1) after I
      # had fixed the identical omission in `frontend` and failed to check this job.
      - name: Restore Atlas lexicon manifest cache
        id: atlas-manifest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/src/data/lexicon-manifest.json
          key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
      - name: Verify Atlas manifest matches pointer (rehydrate if stale)
        run: |
          .venv/bin/python -c "import sys; sys.path.insert(0, 'scripts'); from lexicon.manifest_io import load_manifest; load_manifest(); print('Atlas manifest verified against pointer')"
      - name: Save Atlas lexicon manifest cache
        if: steps.atlas-manifest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/src/data/lexicon-manifest.json
          key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
      - name: Run planned shard with bounded worker concurrency
        run: |
          # Track failures without aborting mid-step so shard artifacts still upload.
          status=0
          # Coverage is only instrumented on a main push: it skews per-test timing
          # (durations feed the next planner run) and is otherwise wasted cost on
          # every PR shard. Gradual floor path: 30 (2025) -> 35 (now, 2026-04) ->
          # 50 (mid-2026) -> 80 on critical paths. Re-measure and raise after each
          # new batch of tests; do not lower the floor.
          cov_args=()
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            cov_args=(--cov=scripts --cov-append --cov-report=)
          fi
          if [ "${{ matrix.shard }}" = "1" ]; then
            # Cache-invalidating tests need a fresh process before the shard body.
            .venv/bin/python -m pytest \
              tests/test_api_helpers.py::TestCacheFunctions::test_cache_invalidate_by_prefix \
              tests/test_api_helpers.py::TestCacheFunctions::test_cache_invalidate_default_clears_all \
              -v --tb=short --junitxml=ci-artifacts/cache-junit.xml "${cov_args[@]}" || status=$?
          fi
          set -o pipefail
          .venv/bin/python scripts/ci/pytest_shards.py run \
            --nodeids ci-artifacts/test-nodeids-${{ matrix.shard }}.txt -- \
            -v --tb=short -n 1 --dist loadgroup --junitxml=ci-artifacts/main-junit-${{ matrix.shard }}.xml --durations=0 "${cov_args[@]}" \
            2>&1 | tee ci-artifacts/main-${{ matrix.shard }}.log || status=$?
          if [ "${{ matrix.shard }}" = "1" ]; then
            # Wall-clock smoke last so an FTS/race flake does not skip the bulk shard body.
            # Up to 2 retries: this endpoint can 500 on FTS rebuild races under load.
            # Coverage instrumentation skews this endpoint's latency budget, so it stays outside coverage.
            playground_status=1
            for attempt in 1 2 3; do
              echo "playground smoke attempt ${attempt}/3"
              if .venv/bin/python -m pytest \
                tests/test_playground_api_stability.py::test_playground_primary_endpoints_keep_health_fast \
                -v --tb=short --junitxml=ci-artifacts/playground-junit.xml; then
                playground_status=0
                break
              fi
              playground_status=$?
              sleep 3
            done
            if [ "$playground_status" -ne 0 ]; then status=$playground_status; fi
          fi
          cp ci-artifacts/plan-${{ matrix.shard }}.json ci-artifacts/plan.json
          cp ci-artifacts/main-junit-${{ matrix.shard }}.xml ci-artifacts/main-junit.xml
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: ci-artifacts/
          if-no-files-found: error
      - name: Save coverage data for aggregation
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -f .coverage
          mkdir -p coverage
          mv .coverage coverage/.coverage.shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pytest-coverage-${{ matrix.shard }}
          path: coverage/
          include-hidden-files: true
          if-no-files-found: error

  artifact-contracts:
    name: Artifact contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # `generate_lesson_schema.py` shells out to `node` for
      # `scripts/build/lesson_schema_extractor.mjs` (see that script, ~line 190),
      # so this job needs Node and the root `npm ci` — the previous schema-drift
      # job had both and the rewrite dropped them, which is why
      # "Check generated lesson-schema contract" failed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install extractor dependencies
        run: npm ci
      - name: Check generated lesson-schema contract
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install PyYAML jsonschema
          .venv/bin/python scripts/build/generate_lesson_schema.py
          git diff --exit-code docs/lesson-schema.yaml

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The site build reads `site/src/data/lexicon-manifest.json`. The previous
      # frontend job restored it from cache and rehydrated it from the pointer when
      # stale; the rewrite dropped that, along with the Python venv the rehydrate
      # step needs — which is why "Build and test site" failed. Ported verbatim from
      # the job this replaces rather than improvised.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: '.python-version'
      - name: Create Python venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install jsonschema PyYAML
      - name: Restore Atlas lexicon manifest cache
        id: atlas-manifest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/src/data/lexicon-manifest.json
          key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
      - name: Verify Atlas manifest matches pointer (rehydrate if stale)
        run: |
          .venv/bin/python -c "import sys; sys.path.insert(0, 'scripts'); from lexicon.manifest_io import load_manifest; load_manifest(); print('Atlas manifest verified against pointer')"
      - name: Save Atlas lexicon manifest cache
        if: steps.atlas-manifest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/src/data/lexicon-manifest.json
          key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
      - name: Build and test site
        working-directory: site
        run: |
          npm ci
          npm run build
          npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error

  frontend-e2e:
    name: Frontend E2E (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site-dist
          path: site/dist
      - name: Install Playwright and test the built artifact
        working-directory: site
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown --exclude-paths=.trufflehogignore

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      [
        plan,
        static,
        pytest,
        artifact-contracts,
        frontend,
        frontend-e2e,
        security,
        quality-gates,
        lint-prompts,
        postmortem-hygiene,
        agent-config,
        scripts-root-guard,
        bio-preparation-data,
        atlas-freshness,
        mdx-source-parity,
        mdx-generation-drift,
      ]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.pytest.result == 'success'
        with:
          pattern: pytest-shard-*
          path: pytest-artifacts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: needs.pytest.result == 'success'
        with:
          python-version: '3.12'
      - name: Create verifier environment
        if: needs.pytest.result == 'success'
        run: python -m venv .venv
      - name: Verify complete pytest selection and execution counts
        if: needs.pytest.result == 'success'
        run: .venv/bin/python scripts/ci/pytest_shards.py verify-artifacts --artifact-dir pytest-artifacts
      - name: Download coverage shards
        if: needs.pytest.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pytest-coverage-*
          path: coverage-artifacts
      - name: Combine coverage once and enforce the floor
        if: needs.pytest.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Gradual path: 30 (2025) -> 35 (now, 2026-04) -> 50 (mid-2026) -> 80 on
          # critical paths. Re-measure after each new batch of tests and raise the
          # floor; never lower it to make a red run green.
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "$(grep '^coverage==' requirements-lock.txt)"
          # upload-artifact strips the coverage/ LCA; download lands files at
          # coverage-artifacts/pytest-coverage-N/.coverage.shard-N
          .venv/bin/python -m coverage combine coverage-artifacts/pytest-coverage-*/.coverage.shard-*
          .venv/bin/python -m coverage report --fail-under=35
          .venv/bin/python -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.pytest.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
      - name: Fail closed on any non-success required job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "required job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '(^|,)(failure|cancelled|skipped)(,|$)'; then
            echo '::error::A required CI job failed, was cancelled, or was skipped.'
            exit 1
          fi
          if [ "$(printf '%s' "$RESULTS" | tr -cd ',' | wc -c | tr -d ' ')" -ne 15 ]; then
            echo '::error::CI Gate did not receive every required job result.'
            exit 1
          fi
      - name: Publish duration history from a successful main run
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ci-artifacts
          .venv/bin/python scripts/ci/pytest_shards.py parse-durations \
            --log pytest-artifacts/pytest-shard-1/main-1.log \
            --log pytest-artifacts/pytest-shard-2/main-2.log \
            --log pytest-artifacts/pytest-shard-3/main-3.log \
            --log pytest-artifacts/pytest-shard-4/main-4.log \
