name: CI

# The required gate is intentionally unconditional.  It does not inspect a
# diff, classify paths, or let advisory routing choose which tests execute.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # The pytest evidence plugin applies SOURCES_MCP_NO_MLX only to wiki nodes.
  # A global value would invalidate the MLX bridge's non-wiki override tests.
  CI_PYTEST_WIKI_NO_MLX: "1"

jobs:
  pytest:
    name: Pytest [${{ matrix.shard }}/5]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Restore deterministic package cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-packages-${{ runner.os }}-py3.12-${{ hashFiles('requirements-lock.txt') }}-torch-cpu

      - name: Provision deterministic pytest environment
        run: |
          uv venv --python 3.12 .venv
          grep -vE '^(torch|torchvision|open_clip_torch)==' requirements-lock.txt > "$RUNNER_TEMP/requirements-ci.txt"
          uv pip install --python .venv/bin/python --no-deps -r "$RUNNER_TEMP/requirements-ci.txt"
          uv pip install --python .venv/bin/python --no-deps \
            --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          .venv/bin/python -c "import torch; print(f'torch={torch.__version__}; cuda={torch.cuda.is_available()}')"

      - name: Save deterministic package cache (single writer)
        if: matrix.shard == 1 && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-packages-${{ runner.os }}-py3.12-${{ hashFiles('requirements-lock.txt') }}-torch-cpu

      - name: Plan complete pytest shard
        run: |
          .venv/bin/python scripts/ci/pytest_shard.py --repo-root . prepare \
            --shard "${{ matrix.shard }}" \
            --quarantine scripts/config/pytest-quarantine.json \
            --evidence-dir "ci-evidence/shard-${{ matrix.shard }}"

      - name: Run planned pytest shard
        run: |
          .venv/bin/python scripts/ci/pytest_shard.py --repo-root . run \
            --shard "${{ matrix.shard }}" \
            --evidence-dir "ci-evidence/shard-${{ matrix.shard }}" \
            --timeout-seconds 1800

      - name: Report pytest timing
        if: ${{ always() }}
        run: |
          if [ -f "ci-evidence/shard-${{ matrix.shard }}/run.json" ]; then
            cat "ci-evidence/shard-${{ matrix.shard }}/run.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pytest shard ${{ matrix.shard }} produced no timing record" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload pytest evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pytest-evidence-${{ matrix.shard }}
          path: ci-evidence/shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 7

  web_quality:
    name: Web and quality (Python structure, unit, build, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Run web and quality checks with an explicit timeout report
        run: |
          started="$(date +%s)"
          set +e
          timeout --verbose --signal=TERM --kill-after=60s 1320s bash -eo pipefail <<'CHECKS'
            quality_started="$(date +%s)"
            python -m venv .quality-venv
            .quality-venv/bin/python -m pip install --upgrade pip
            .quality-venv/bin/python -m pip install --no-deps ruff==0.15.21
            .quality-venv/bin/python -m ruff check scripts tests
            ACTIONLINT_FORCE_DOWNLOAD=1 scripts/audit/check_workflows.sh .github/workflows/ci.yml
            quality_elapsed="$(( $(date +%s) - quality_started ))"
            echo "quality_elapsed_seconds=${quality_elapsed}" | tee -a "$GITHUB_STEP_SUMMARY"

            frontend_started="$(date +%s)"
            npm ci --prefix site
            npm run test --prefix site
            npm run build --prefix site
            (
              cd site
              ./node_modules/.bin/playwright install --with-deps chromium
              ./node_modules/.bin/playwright test
            )
            frontend_elapsed="$(( $(date +%s) - frontend_started ))"
            echo "frontend_elapsed_seconds=${frontend_elapsed}" | tee -a "$GITHUB_STEP_SUMMARY"
          CHECKS
          status=$?
          elapsed="$(( $(date +%s) - started ))"
          echo "web_quality_elapsed_seconds=${elapsed}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 124 ]; then
            echo "::error title=web and quality timeout::checks exceeded the 1320-second wrapper"
          fi
          exit "$status"

  ci-gate:
    name: CI Gate
    needs: [pytest, web_quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Create verifier environment
        run: |
          echo "CI_GATE_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          python -m venv .venv

      - name: Download all pytest evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v4.3.0
        with:
          pattern: pytest-evidence-*
          path: pytest-evidence

      - name: Fail closed on job state or missing execution evidence
        if: ${{ always() }}
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
          WEB_QUALITY_RESULT: ${{ needs.web_quality.result }}
        run: |
          status=0
          for required in pytest web_quality; do
            result="$(printenv "${required^^}_RESULT")"
            echo "${required}=${result}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              echo "::error title=required job did not succeed::${required}=${result}; " \
                "skipped and cancelled are failures"
              status=1
            fi
          done
          .venv/bin/python -m scripts.ci.verify_pytest_evidence \
            --root pytest-evidence \
            --quarantine scripts/config/pytest-quarantine.json \
            --shard-count 5 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"

      - name: Report gate timing
        if: ${{ always() }}
        run: |
          elapsed="$(( $(date +%s) - CI_GATE_STARTED_EPOCH ))"
          echo "ci_gate_elapsed_seconds=${elapsed}" | tee -a "$GITHUB_STEP_SUMMARY"
