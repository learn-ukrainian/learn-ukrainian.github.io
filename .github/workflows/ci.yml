name: CI

# New CI (Fable 5.1 spec 2026-09-03). Same jobs on pull_request and merge_group.
# Required GitHub context is still named "CI Gate".

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      frontend: ${{ steps.classify.outputs.frontend }}
      shards: ${{ steps.classify.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/frontend_change_denominator.json
          sparse-checkout-cone-mode: false
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, urllib.parse
          base = os.environ.get("BASE") or ""
          head = os.environ.get("HEAD") or ""
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          docs_only, frontend, shards = "false", "true", "[1,2,3,4]"

          def fail_closed():
              print("docs_only=false\nfrontend=true\nshards=[1,2,3,4]")
              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  pathlib.Path(out).write_text(
                      "docs_only=false\nfrontend=true\nshards=[1,2,3,4]\n", encoding="utf-8"
                  )
              sys.exit(0)

          if not base or set(base) <= {"0"} or not head:
              fail_closed()
          spec = urllib.parse.quote(f"{base}...{head}", safe=".")
          cmd = [
              "gh", "api", "--paginate",
              f"repos/{repo}/compare/{spec}",
              "--jq", ".files[].filename",
          ]
          try:
              raw = subprocess.check_output(cmd, text=True, timeout=60)
          except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
              fail_closed()
          paths = [line.strip() for line in raw.splitlines() if line.strip()]
          if not paths or len(paths) > 300:
              fail_closed()

          def is_docs(path: str) -> bool:
              if path.endswith(".md"):
                  return True
              prefixes = (
                  "docs/",
                  "agents_extensions/shared/skills/",
                  ".claude/",
                  ".codex/",
                  ".agent/",
              )
              return any(path == p.rstrip("/") or path.startswith(p) for p in prefixes)

          denom = {"site/", "scripts/atlas/", "scripts/lexicon/"}
          denom_file = pathlib.Path("scripts/ci/frontend_change_denominator.json")
          if denom_file.is_file():
              data = json.loads(denom_file.read_text(encoding="utf-8"))
              denom = set(data.get("paths") or denom)
          def is_frontend(path: str) -> bool:
              for entry in denom:
                  if entry.endswith("/"):
                      if path.startswith(entry):
                          return True
                  elif path == entry:
                      return True
              return False

          docs_only = "true" if all(is_docs(p) for p in paths) else "false"
          frontend = "true" if any(is_frontend(p) for p in paths) else "false"
          shards = "[1]" if docs_only == "true" else "[1,2,3,4]"
          print(f"files={len(paths)} docs_only={docs_only} frontend={frontend} shards={shards}")
          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              pathlib.Path(out).write_text(
                  f"docs_only={docs_only}\nfrontend={frontend}\nshards={shards}\n",
                  encoding="utf-8",
              )
          PY

  ruff:
    name: Ruff
    needs: [changes]
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: pip
      - run: python -m pip install "$(grep -E '^ruff==' requirements-lock.txt)"
      - run: |
          python -m ruff check scripts/ tests/ agents_extensions/ dashboards/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve secret scan commit scope
        id: secret-scan-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_AFTER_SHA: ${{ github.event.after || '' }}
        run: python3 scripts/ci/secret_scan_scope.py
      - name: Gate scrubbed public identifiers
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPSEC_RANGE: ${{ steps.secret-scan-scope.outputs.opsec_range }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/audit/lint_opsec_leaks.py "${PR_BASE_SHA}...${PR_HEAD_SHA}" --public-identifiers
          elif [ -n "$OPSEC_RANGE" ]; then
            python3 scripts/audit/lint_opsec_leaks.py --commit-range "$OPSEC_RANGE" --public-identifiers
          else
            python3 scripts/audit/lint_opsec_leaks.py --public-identifiers
          fi
      - run: python3 scripts/audit/check_no_internal_ids.py --changed-vs-base origin/main
      - name: Reject negated closing references
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: printf '%s' "$PR_BODY" | python3 scripts/audit/lint_pr_closing_references.py --stdin
      - uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          base: ${{ steps.secret-scan-scope.outputs.trufflehog_base }}
          head: ${{ steps.secret-scan-scope.outputs.trufflehog_head }}
          extra_args: --results=verified,unknown --exclude-paths=.trufflehogignore --exclude-detectors=Lob

  pytest:
    name: pytest (${{ matrix.shard }})
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lu
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      LEARN_UKRAINIAN_CP_PG_DSN: postgresql://postgres:postgres@localhost:5432/lu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Python deps
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # Lockfile is internally inconsistent (marker-pdf vs pillow; see
          # requirements.txt). Documented CI install is `--no-deps`. Drop
          # live-ML wheels — the unit suite does not import them and they
          # blow the 15m budget.
          grep -viE '^(torch|torchvision|open_clip_torch|stanza)==' requirements-lock.txt \
            > "${RUNNER_TEMP}/requirements-ci.txt"
          .venv/bin/python -m pip install --no-deps -r "${RUNNER_TEMP}/requirements-ci.txt"
      - name: Run pytest
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ "$DOCS_ONLY" = "true" ]; then
            .venv/bin/python -m pytest tests -m docs_skills --strict-markers --timeout=120 \
              --override-ini addopts=-v
            exit 0
          fi
          mapfile -t files < <(git ls-files 'tests/**/test_*.py' | sort | sed -n "${SHARD}~4p")
          .venv/bin/python -m pytest "${files[@]}" -n auto --dist=loadfile --timeout=120 \
            -m 'not atlas_release and not slow' --strict-markers \
            --override-ini addopts=-v

  contracts:
    name: Contracts
    needs: [changes]
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: |
          python -m pip install PyYAML jsonschema requests==2.34.2
          npm ci
      - run: python -c "import sys; sys.path.insert(0, 'scripts'); from lexicon.manifest_io import load_manifest; load_manifest()"
      - name: Word Atlas sense-lint ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python -m scripts.practice_deck.io
          base_ref="${BASE_SHA:-origin/main}"
          deck_args=()
          for deck in site/public/lexicon/*.json; do
            deck_args+=(--practice-deck "$deck")
          done
          python scripts/audit/lint_word_atlas.py \
            --manifest site/src/data/lexicon-manifest.json \
            "${deck_args[@]}" --base-ref "$base_ref" \
            --baseline scripts/audit/word_atlas_lint_baseline.json --ratchet --update-baseline
          git diff --exit-code -- scripts/audit/word_atlas_lint_baseline.json
      - run: python scripts/build/generate_lesson_schema.py && git diff --exit-code docs/lesson-schema.yaml
      - run: python scripts/audit/check_mdx_source_parity.py --changed-vs-base origin/main
      - run: python scripts/audit/check_mdx_forward_parity.py --changed-vs-base origin/main
      - run: python scripts/audit/check_teacher_cloze_content.py
      - run: python scripts/audit/check_locked_module_not_published.py --changed-vs-base origin/main
      - run: python scripts/audit/check_mdx_generation_drift.py --changed-vs-base origin/main
      - run: python scripts/lexicon/check_manifest_freshness.py
      - run: python scripts/audit/check_atlas_manifest_enrichment.py
      - run: python scripts/audit/check_static_practice_assets.py
      - run: python scripts/audit/check_dossier_wordcount.py --changed

  frontend:
    name: Frontend
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Create Python venv
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install jsonschema PyYAML
      - run: .venv/bin/python -c "import sys; sys.path.insert(0, 'scripts'); from lexicon.manifest_io import load_manifest; load_manifest()"
      - working-directory: site
        run: npm ci
      - working-directory: site
        run: npm run build
      - working-directory: site
        run: npm run test:unit
      - working-directory: site
        run: npm run test:built-output

  ci-gate:
    name: CI Gate
    if: always() && !cancelled()
    needs: [changes, ruff, secret-scan, pytest, contracts, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require event jobs
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          CHANGES: ${{ needs.changes.result }}
          RUFF: ${{ needs.ruff.result }}
          SECRET: ${{ needs.secret-scan.result }}
          PYTEST: ${{ needs.pytest.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          FRONTEND_JOB: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          ok() { [ "$1" = success ]; }
          skip_ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          ok "$CHANGES"
          ok "$SECRET"
          ok "$PYTEST"
          if [ "$DOCS_ONLY" = true ]; then
            skip_ok "$RUFF"
            skip_ok "$CONTRACTS"
          else
            ok "$RUFF"
            ok "$CONTRACTS"
          fi
          if [ "$FRONTEND" = true ]; then
            ok "$FRONTEND_JOB"
          else
            skip_ok "$FRONTEND_JOB"
          fi
          echo "CI Gate green"
