name: full-ci label

# Serves the `full-ci` label (#8505). ci.yml no longer subscribes to `labeled`
# (any label used to restart the full CI on an unchanged commit), so applying
# `full-ci` re-runs the latest completed ci.yml pull_request run for the PR
# head instead. The rerun reuses the original event payload, so
# scripts/ci/classify_changes.py reads the PR's CURRENT labels via the API in
# the Changes job and fails closed to the full tier when the lookup errors
# (S3). This workflow's own failure can never turn "CI Gate" green — it only
# ever triggers a rerun of the real CI.
#
# Status: advisory. Its result is not a required check; the rerun it starts is
# what reports "CI Gate".

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun-ci:
    name: Re-run CI with full-ci label
    if: github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # gh run rerun
    steps:
      - name: Re-run the latest CI run for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No ci.yml pull_request run found for head ${HEAD_SHA}; refusing to treat full-ci as satisfied."
            exit 1
          fi
          status="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '.status')"
          if [ "$status" != "completed" ]; then
            echo "::error::Latest ci.yml run ${run_id} for ${HEAD_SHA} is '${status}'; wait for it, then re-apply the label."
            exit 1
          fi
          gh run rerun "$run_id" --repo "$REPO"
          echo "Re-ran ci.yml run ${run_id} at ${HEAD_SHA}; Changes reads current labels via the API, so full-ci forces the full tier."
