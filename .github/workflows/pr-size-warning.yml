---
name: PR size warning

# Advisory only; deliberately separate from the required CI Gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size-warning:
    name: Small-batch size warning (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version-file: '.python-version'
      - name: Install existing review-helper dependency
        env:
          PROJECT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PROJECT_PYTHON" -m pip install --disable-pip-version-check PyYAML==6.0.3'
      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
      # The locked lu-machinery wheel alone (no dependencies); the lock's hash decides which bytes install.
      - name: Install the locked lu-machinery release
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          wheelhouse="${MACHINERY_WHEELHOUSE}"
          "$PYTHON_BIN" -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${MACHINERY_REQUIREMENT}"
      - name: Report exact PR diff
        id: report
        env:
          PROJECT_PYTHON: ${{ steps.python.outputs.python-path }}
          LU_PRODUCT_ROOT: ${{ github.workspace }}
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
        run: '"$PROJECT_PYTHON" -m lu_machinery.ci.pr_size_warning'
      - name: Report unavailable measurement
        if: ${{ always() && steps.report.outcome != 'success' }}
        run: |
          printf '%s%s\n' '{"status":"unknown","changed_non_test_lines":null,"eligible_files":null,' \
            '"diagnostics":["size reporter did not complete"]}'
          printf '%s%s\n' '::notice title=Small-batch measurement incomplete::' \
            'UNKNOWN changed non-test lines; UNKNOWN eligible files. Reporter incomplete. CI Gate is unchanged.'
          {
            echo '### Small-batch size warning'
            echo 'Status: unknown. UNKNOWN changed non-test lines; UNKNOWN eligible files.'
            echo 'The advisory reporter did not complete. CI Gate is unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
