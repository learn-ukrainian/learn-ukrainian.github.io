name: Model Catalog Freshness

on:
  pull_request:
    paths:
      - 'scripts/config/model_catalog.yaml'
      - 'scripts/config/fleet_communications.yaml'
      - 'scripts/review/model_catalog.py'
      - 'requirements-machinery.lock'
      - 'scripts/agent_runtime/registry.py'
      - 'scripts/lint/lint_model_catalog.py'
      - 'scripts/lint/lint_fleet_roster.py'
      - 'docs/runbooks/fleet-comms-open-gaps.md'
      - 'docs/runbooks/epic-orchestrator-roster.md'
      - 'docs/best-practices/agent-activity-matrix.md'
      - 'tests/test_model_catalog.py'
      - '.github/workflows/model-catalog-freshness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/config/model_catalog.yaml'
      - 'scripts/config/fleet_communications.yaml'
      - 'scripts/review/model_catalog.py'
      - 'requirements-machinery.lock'
      - 'scripts/agent_runtime/registry.py'
      - 'scripts/lint/lint_model_catalog.py'
      - 'scripts/lint/lint_fleet_roster.py'
      - 'docs/runbooks/fleet-comms-open-gaps.md'
      - 'docs/runbooks/epic-orchestrator-roster.md'
      - 'docs/best-practices/agent-activity-matrix.md'
      - 'tests/test_model_catalog.py'
      - '.github/workflows/model-catalog-freshness.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Create isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check PyYAML==6.0.3

      # The product catalog copy validates roles through the installed release (#13032). The locked
      # lu-machinery wheel alone (no dependencies), as ci.yml installs it: the lock's hash, not the
      # URL, decides which bytes install.
      - name: Install the locked lu-machinery release
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^lu-machinery==([0-9]+(\.[0-9]+)*) \\$/\1/p' requirements-machinery.lock)"
          wheelhouse="${RUNNER_TEMP}/lu-machinery-wheelhouse"
          mkdir -p "$wheelhouse"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 300 --connect-timeout 20 \
            -o "${wheelhouse}/lu_machinery-${version}-py3-none-any.whl" \
            "https://github.com/learn-ukrainian/machinery/releases/download/v${version}/lu_machinery-${version}-py3-none-any.whl"
          sed -n '/^lu-machinery==/,/--hash=/p' requirements-machinery.lock > "${RUNNER_TEMP}/lu-machinery-lock.txt"
          .venv/bin/python -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${RUNNER_TEMP}/lu-machinery-lock.txt"

      - name: Validate catalog structure and freshness
        run: .venv/bin/python scripts/lint/lint_model_catalog.py

      - name: Validate fleet roster + formal-CF eligibility projections
        run: .venv/bin/python scripts/lint/lint_fleet_roster.py
