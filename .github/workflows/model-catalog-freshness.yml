name: Model Catalog Freshness

on:
  pull_request:
    paths:
      - 'scripts/config/model_catalog.yaml'
      - 'scripts/config/fleet_communications.yaml'
      - 'scripts/review/model_catalog.py'
      - 'scripts/review/reviewer_resolver.py'
      - 'scripts/agent_runtime/registry.py'
      - 'scripts/agent_runtime/adapters/kimi.py'
      - 'scripts/lint/lint_model_catalog.py'
      - 'scripts/lint/lint_fleet_roster.py'
      - 'agents_extensions/shared/rules/model-assignment.md'
      - 'docs/runbooks/fleet-comms-open-gaps.md'
      - 'docs/runbooks/epic-orchestrator-roster.md'
      - 'docs/best-practices/agent-activity-matrix.md'
      - 'tests/test_lint_fleet_roster.py'
      - 'tests/test_model_catalog.py'
      - 'tests/test_start_kimi_launcher.py'
      - 'tests/test_start_kimi_claude_code.py'
      - 'tests/agent_runtime/adapters/test_kimi_adapter.py'
      - 'start-kimi.sh'
      - 'scripts/launchers/kimi.sh'
      - '.github/workflows/model-catalog-freshness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/config/model_catalog.yaml'
      - 'scripts/config/fleet_communications.yaml'
      - 'scripts/review/model_catalog.py'
      - 'scripts/review/reviewer_resolver.py'
      - 'scripts/agent_runtime/registry.py'
      - 'scripts/agent_runtime/adapters/kimi.py'
      - 'scripts/lint/lint_model_catalog.py'
      - 'scripts/lint/lint_fleet_roster.py'
      - 'agents_extensions/shared/rules/model-assignment.md'
      - 'docs/runbooks/fleet-comms-open-gaps.md'
      - 'docs/runbooks/epic-orchestrator-roster.md'
      - 'docs/best-practices/agent-activity-matrix.md'
      - 'tests/test_lint_fleet_roster.py'
      - 'tests/test_model_catalog.py'
      - 'tests/test_start_kimi_launcher.py'
      - 'tests/test_start_kimi_claude_code.py'
      - 'tests/agent_runtime/adapters/test_kimi_adapter.py'
      - 'start-kimi.sh'
      - 'scripts/launchers/kimi.sh'
      - '.github/workflows/model-catalog-freshness.yml'
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Create isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate catalog structure and freshness
        run: .venv/bin/python scripts/lint/lint_model_catalog.py

      - name: Validate fleet roster + formal-CF eligibility projections
        run: .venv/bin/python scripts/lint/lint_fleet_roster.py

  nightly-issue:
    name: Nightly failure issue
    needs: [freshness]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/
            scripts/ci/nightly_issue.py
            scripts/__init__.py
            scripts/common/__init__.py
            scripts/common/github_client.py
            scripts/opsec/__init__.py
            scripts/opsec/gh_snapshot.py
            scripts/opsec/prepublish.py
            .python-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - uses: ./.github/actions/nightly-issue
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
