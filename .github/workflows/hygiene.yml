name: Hygiene (advisory)

# Advisory Python/config hygiene checks, split out of ci.yml during the CI
# reboot (#5762). These jobs cannot catch a broken artifact — they flag code
# smells (radon complexity), prompt-template lint, bug-autopsy hygiene, and
# agent/config drift. None of them may gate a PR: `CI Gate` in ci.yml is the
# sole required check and none of these jobs are in its `needs`. Safe to
# path-filter, unlike pytest — an advisory check skipping on an unrelated
# change is a non-event, not a silent regression.
#
# #4811: the five former single-purpose jobs are one composite so a scripts/
# touch cannot claim five concurrent runner slots while CI Gate waits.
#
# Merge-queue cutover (#6943 stage 2): removed from pull_request fan-out after
# verifying branch protection required contexts == ["CI Gate"] only. Runs on
# schedule (weekday signal), merge_group (landing tree), and workflow_dispatch.

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

on:
  schedule:
    # Weekdays 05:17 UTC — advisory drift signal without PR runner contention.
    - cron: '17 5 * * 1-5'
  merge_group:
  workflow_dispatch:

jobs:
  hygiene-checks:
    name: Hygiene checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install radon
        if: github.event_name == 'merge_group'
        run: pip install radon

      - name: Collect changed scripts for radon
        if: github.event_name == 'merge_group'
        id: changed-scripts
        env:
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="$MERGE_BASE_SHA"
          head_sha="$MERGE_HEAD_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git merge-base origin/main "$head_sha")"
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=AMR "$base_sha" "$head_sha" -- \
              | rg '^scripts/.*\.py$' \
              | rg -v '^scripts/(oneoff|retired)/'
          )

          if ((${#changed_files[@]} == 0)); then
            echo "✅ No changed Python files under scripts/."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Checking radon only on changed files:\n'
          printf '  %s\n' "${changed_files[@]}"
          {
            echo 'files<<EOF'
            printf '%s\n' "${changed_files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: No F-grade functions in changed files (CC > 40)
        if: github.event_name == 'merge_group' && steps.changed-scripts.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed-scripts.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          output=$(python -m radon cc "${files[@]}" -n F -s 2>/dev/null || true)
          if [ -n "$output" ]; then
            echo "::error::F-grade functions found:"
            echo "$output"
            exit 1
          fi
          echo "✅ No F-grade functions in changed files"

      - name: No MI=C files in changed files (MI < 10)
        if: github.event_name == 'merge_group' && steps.changed-scripts.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed-scripts.outputs.files }}
        run: |
          mapfile -t files <<< "$CHANGED_FILES"
          output=$(python -m radon mi "${files[@]}" -s 2>/dev/null | grep " - C " || true)
          if [ -n "$output" ]; then
            echo "::error::MI=C files found:"
            echo "$output"
            exit 1
          fi
          echo "✅ No MI=C files in changed files"

      - name: Check for non-stub scripts in scripts/ root
        if: github.event_name == 'merge_group'
        env:
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="$MERGE_BASE_SHA"
          head_sha="$MERGE_HEAD_SHA"

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git merge-base origin/main "$head_sha")"
          fi

          if [[ -z "$base_sha" ]]; then
            echo "::error::Unable to determine the comparison base for scripts/ root guard."
            exit 1
          fi

          # Allowed non-stub files at scripts/ root
          allowed="__init__.py|batch_gemini_runner.py|config.py|generate_mdx.py|manifest_direct.py|manifest_utils.py|paths.py|pipeline_lib.py|slug_utils.py|yaml_activities.py"
          violations=""

          mapfile -t candidates < <(
            git diff --name-only --diff-filter=AR "$base_sha" "$head_sha" -- scripts \
              | while IFS= read -r f; do
                  if [[ "$(dirname "$f")" == "scripts" && "$f" == *.py ]]; then
                    printf '%s\n' "$f"
                  fi
                done
          )

          for f in "${candidates[@]}"; do
            [ ! -f "$f" ] && continue
            basename=$(basename "$f")
            # Skip allowed files
            echo "$basename" | grep -qE "^($allowed)$" && continue
            # Skip re-export stubs
            grep -q "Stub: module moved" "$f" && continue
            violations="$violations $f"
          done
          if [ -n "$violations" ]; then
            echo "::error::New non-stub scripts found in scripts/ root (move to a subdirectory):"
            echo "$violations" | tr ' ' '\n' | grep .
            exit 1
          fi
          echo "✅ No new root-level scripts"

      - name: Lint prompt templates
        run: python scripts/lint/lint_prompts.py

      # Direct file path (NOT `-m`): the checker is stdlib-only, but `-m`
      # would import scripts.audit/__init__ which needs pyyaml (absent on
      # bare setup-python).
      - name: Validate bug-autopsy fields + INDEX freshness (#3725)
        run: python scripts/audit/check_postmortems.py --check

      - name: Validate agent JSON config
        run: |
          jq empty \
            .mcp.json \
            .cursor/mcp.json \
            agents_extensions/shared/settings.json
          if [[ -f agents_extensions/shared/settings.local.json ]]; then
            jq empty agents_extensions/shared/settings.local.json
          fi

      - name: Validate agent shell entrypoints
        run: |
          bash -n \
            start-claude.sh \
            start-claude-driver.sh \
            start-codex.sh \
            start-codex-driver.sh \
            start-gemini.sh \
            start-gemini-driver.sh \
            start-grok.sh \
            start-grok-driver.sh \
            start-kimi.sh \
            start-glm.sh \
            scripts/lib/launcher_core.sh \
            scripts/lib/codex_cc_route.sh \
            scripts/lib/glmcc_route.sh \
            scripts/launchers/*.sh \
            scripts/lib/handoff_identity.sh \
            scripts/lib/claude_route_guard.sh \
            scripts/deploy_prompts.sh \
            scripts/check_rules_deployment.sh

      - name: Create local test venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pytest pyyaml

      - name: Verify agent extension deployment
        run: |
          npm run agents:deploy --silent
          bash scripts/check_rules_deployment.sh

      - name: Run focused agent config tests
        run: |
          .venv/bin/python -m pytest \
            tests/test_deploy_script_idempotency.py \
            tests/test_agent_runtime_tool_config.py \
            -v --tb=short
