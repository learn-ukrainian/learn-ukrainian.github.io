name: Cache hygiene

# Deletes dead Actions cache entries so the repository stays under GitHub's
# 10 GB cache limit, whose LRU eviction otherwise drops live entries such as
# main's uv cache (#9101). Rules live in scripts/ci/cache_hygiene.py:
# on main keep the newest CodeQL TRAP entry per language and CodeQL version
# plus every TRAP entry at an open pull request's base commit (the exact key
# CodeQL restores for that PR), drop TRAP entries on other refs, and drop
# superseded setup-uv entries on main after 24 h unread. Every other entry is
# left alone. If the cache or open-PR listing cannot be proven complete, the
# run exits without deleting anything.
#
# CodeQL runs as GitHub default setup (no workflow file, trap caching cannot be
# turned off) and saves ~247 MB per main commit, so this runs every two hours:
# a busy two hours adds ~10 entries, well under the limit. It is a separate
# workflow, not a job in uv-cache-warm.yml, because that workflow writes the
# uv cache on lock changes with read-only permissions; this one needs
# `actions: write` on its own schedule. No workflow_run trigger: default
# setup has no workflow to name, and zizmor flags workflow_run triggers.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cache-hygiene
  cancel-in-progress: false

jobs:
  prune:
    name: Prune dead cache entries
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/cache_hygiene.py
            scripts/__init__.py
            scripts/common/__init__.py
            scripts/common/github_client.py
            scripts/opsec/__init__.py
            scripts/opsec/gh_snapshot.py
            scripts/opsec/prepublish.py
            requirements-lock.txt
            .python-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Delete dead cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ci/cache_hygiene.py --repo "${REPO}" --lock-file requirements-lock.txt --apply

  nightly-issue:
    name: Nightly failure issue
    needs: [prune]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/
            scripts/ci/nightly_issue.py
            scripts/__init__.py
            scripts/common/__init__.py
            scripts/common/github_client.py
            scripts/opsec/__init__.py
            scripts/opsec/gh_snapshot.py
            scripts/opsec/prepublish.py
            .python-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - uses: ./.github/actions/nightly-issue
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
