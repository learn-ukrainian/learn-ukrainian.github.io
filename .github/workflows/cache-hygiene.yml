name: Cache hygiene

# Deletes dead Actions cache entries so the repository stays under GitHub's
# 10 GB cache limit, whose LRU eviction otherwise drops live entries such as
# main's uv cache (#9101). Rules live in lu_machinery.ci.cache_hygiene (the locked release):
# on main keep the newest CodeQL TRAP entry per language and CodeQL version
# plus every TRAP entry at an open pull request's base commit (the exact key
# CodeQL restores for that PR), drop TRAP entries on other refs, and drop
# superseded setup-uv entries on main after 24 h unread. Every other entry is
# left alone. If the cache or open-PR listing cannot be proven complete, the
# run exits without deleting anything.
#
# CodeQL runs as GitHub default setup (no workflow file, trap caching cannot be
# turned off) and saves ~247 MB per main commit, so this runs every two hours:
# a busy two hours adds ~10 entries, well under the limit. It is a separate
# workflow, not a job in uv-cache-warm.yml, because that workflow writes the
# uv cache on lock changes with read-only permissions; this one needs
# `actions: write` on its own schedule. No workflow_run trigger: default
# setup has no workflow to name, and zizmor flags workflow_run triggers.
#
# A pull request that changes this workflow or one of its inputs installs the
# same locked release and imports the module without running it. That
# job does not list or delete caches. Deletion stays on main. The import check
# has its own concurrency group per pull request. Schedule and workflow_dispatch
# stay on cache-hygiene, so neither can replace the other's pending run.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cache-hygiene.yml
      - requirements-lock.txt
      - requirements-machinery.lock
      - '.python-version'

permissions: {}

concurrency:
  # Same shape as the other pull_request workflows, with the non-PR side fixed
  # as cache-hygiene instead of a unique run id. cancel-in-progress stays false
  # so an in-progress prune is not cancelled.
  group: ${{ github.event_name == 'pull_request' && format('cache-hygiene-{0}-{1}', github.event_name, github.event.pull_request.number) || 'cache-hygiene' }}
  cancel-in-progress: false

jobs:
  prune:
    name: Prune dead cache entries
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            requirements-lock.txt
            requirements-machinery.lock
            .python-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      # The locked lu-machinery wheel alone (no dependencies); the lock's hash decides which bytes install.
      - name: Install the locked lu-machinery release
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^lu-machinery==([0-9]+(\.[0-9]+)*) \\$/\1/p' requirements-machinery.lock)"
          wheelhouse="${RUNNER_TEMP}/lu-machinery-wheelhouse"
          mkdir -p "$wheelhouse"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 300 --connect-timeout 20 \
            -o "${wheelhouse}/lu_machinery-${version}-py3-none-any.whl" \
            "https://github.com/learn-ukrainian/machinery/releases/download/v${version}/lu_machinery-${version}-py3-none-any.whl"
          sed -n '/^lu-machinery==/,/--hash=/p' requirements-machinery.lock > "${RUNNER_TEMP}/lu-machinery-lock.txt"
          python3 -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${RUNNER_TEMP}/lu-machinery-lock.txt"
      - name: Delete dead cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LU_PRODUCT_ROOT: ${{ github.workspace }}
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
        run: python3 -m lu_machinery.ci.cache_hygiene --repo "${REPO}" --lock-file requirements-lock.txt --lock-file requirements-machinery.lock --apply

  import-check:
    name: Import cache hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            requirements-lock.txt
            requirements-machinery.lock
            .python-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      # The locked lu-machinery wheel alone (no dependencies); the lock's hash decides which bytes install.
      - name: Install the locked lu-machinery release
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^lu-machinery==([0-9]+(\.[0-9]+)*) \\$/\1/p' requirements-machinery.lock)"
          wheelhouse="${RUNNER_TEMP}/lu-machinery-wheelhouse"
          mkdir -p "$wheelhouse"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 --retry-max-time 300 --connect-timeout 20 \
            -o "${wheelhouse}/lu_machinery-${version}-py3-none-any.whl" \
            "https://github.com/learn-ukrainian/machinery/releases/download/v${version}/lu_machinery-${version}-py3-none-any.whl"
          sed -n '/^lu-machinery==/,/--hash=/p' requirements-machinery.lock > "${RUNNER_TEMP}/lu-machinery-lock.txt"
          python3 -m pip install --disable-pip-version-check --quiet --no-index --no-deps --require-hashes \
            --find-links "$wheelhouse" -r "${RUNNER_TEMP}/lu-machinery-lock.txt"
      - name: Import cache hygiene without running it
        run: python3 -I -c "import lu_machinery.ci.cache_hygiene"
