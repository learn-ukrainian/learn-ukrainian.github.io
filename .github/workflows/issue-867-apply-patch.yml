name: apply issue 867 patch

on:
  push:
    branches:
      - cursor/issue-867-secret-redaction-30b9
    paths:
      - .github/workflows/issue-867-apply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: cursor/issue-867-secret-redaction-30b9
          fetch-depth: 10
      - name: Apply secret-redaction patch
        run: |
          set -euo pipefail
          src=f70062cd69f5b2a6041825f84ba8d6b7a2a5d40b
          patch=/tmp/issue-867-secret-redaction.patch
          git show "$src:scripts/ci/issue-867-secret-redaction.patch.1" > "$patch"
          git show "$src:scripts/ci/issue-867-secret-redaction.patch.2" >> "$patch"
          git show "$src:scripts/ci/issue-867-secret-redaction.patch.3" >> "$patch"
          git show "$src:scripts/ci/issue-867-secret-redaction.patch.4" >> "$patch"
          git apply --check "$patch"
          git apply --whitespace=nowarn "$patch"
          git add \
            .pre-commit-config.yaml \
            agents_extensions/shared/hooks/guard-secret-print.py \
            scripts/agent_runtime/env_sanitize.py \
            scripts/batch/batch_dispatcher.py \
            scripts/delegate.py \
            scripts/lib/launcher_core.sh \
            tests/conftest.py \
            tests/test_guard_secret_print.py
          grep -q 'without_unneeded_secrets(worker_env, dispatch_agent)' scripts/delegate.py
          grep -q 'launcher_drop_unneeded_secrets || exit 1' scripts/lib/launcher_core.sh
          grep -q 'no-secret-print-hook' .pre-commit-config.yaml
          git diff --cached --name-only | grep -qx scripts/delegate.py
          git rm -f .github/workflows/issue-867-apply-patch.yml
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git commit \
            -m "fix: redact secrets from repr, test output, child envs, and echo commands" \
            --trailer "X-Agent: grok/grok-4.7"
          git push origin HEAD:cursor/issue-867-secret-redaction-30b9
