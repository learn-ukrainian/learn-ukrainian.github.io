name: GitHub Actions Security Analysis with zizmor 🌈

# Static analysis of all .github/workflows/* files using zizmorcore/zizmor.
# Adopted 2026-05-19 after the actions-cool 2026-05 supply-chain attack +
# kubedojo cross-perspective recommendation. Findings land in repo Security
# tab (SARIF) via GitHub Advanced Security.
#
# Baseline at adoption (2026-05-19): 0 high, 21 medium (17 artipacked
# credential-persistence + 4 secrets-inherit). See follow-up issue for the
# triage plan — some checkouts legitimately need credentials.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['main']
  pull_request:
    paths:
      - '.github/workflows/**'
  schedule:
    # Weekly run on Mondays at 09:00 UTC catches new audit rules that ship
    # in zizmor releases between user-triggered runs.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions: {}

jobs:
  zizmor:
    name: 'Run zizmor 🌈'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run zizmor 🌈'
        uses: 'zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5' # v0.6.1
        with:
          # 2026-05-23 intent: skip online audits. artipacked online verification
          # hits HTTP 401 on unauthenticated git-upload-pack to actions/checkout,
          # which Microsoft's git host increasingly throttles/blocks.
          #
          # `advanced-args: '--offline'` was never a recognized zizmor-action
          # input (always a no-op / Unexpected-input warning), so online audits
          # kept running at the action default. Use the first-class
          # `online-audits` input (present since at least v0.5.7) to actually
          # enforce the offline posture. Some online-only audit coverage is
          # lost; the known baseline findings are offline YAML-static rules.
          online-audits: 'false'
