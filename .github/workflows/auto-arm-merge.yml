name: Auto-arm merge queue

# #7539: default-branch automation that only enables GitHub's normal
# auto-merge mechanism once CI Gate passes at the current head. It never
# checks out or runs code from a subject PR head.
#
# Retire-CF-attest (2026-09-03 GO): schedule and workflow_run triggers are
# removed so this workflow is never a live, automatic merge path during the
# red-team review window — humans merge; this pipeline only runs on explicit
# workflow_dispatch. The workflow_run-triggered red-completion self-heal scan
# (#7548), which existed to retry a stale failed CF-attest check, is retired
# with it: CF attest no longer exists as a check to retry.
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: auto-arm-merge
  cancel-in-progress: false

jobs:
  arm:
    name: Arm eligible pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: write
      contents: write
      checks: read
      # read: issue timeline scan for removed_from_merge_queue events
      # (merge-queue ejection visibility; no workflow trigger exists for it).
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      # #7586: GITHUB_TOKEN-created merge-queue entries never receive
      # merge_group workflow runs, so the queue ejects after the check
      # timeout and the next scan re-arms — a 60-min loop. Mint an App
      # installation token or skip arming. Never fall back to github.token.
      - name: Mint auto-arm GitHub App token
        id: app
        if: ${{ vars.AUTO_ARM_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_ARM_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_ARM_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-merge-queues: write

      - name: Skip arming when the App is not configured
        if: ${{ steps.app.outputs.token == '' }}
        run: |
          echo "::error::AUTO_ARM_APP_CLIENT_ID / AUTO_ARM_APP_PRIVATE_KEY missing; skip arm (#7586). Never fall back to github.token."

      - name: Arm opted-in green pull requests
        if: ${{ steps.app.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Module invocation keeps the repo root on sys.path.
        run: python -m scripts.ci.auto_arm_merge
