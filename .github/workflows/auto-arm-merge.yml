name: Auto-arm merge queue

# #7539: scheduled, default-branch automation that only enables GitHub's
# normal auto-merge mechanism after the exact-head CF and CI Gate checks pass.
# It never checks out or runs code from a subject PR head.
permissions:
  actions: write
  pull-requests: write
  contents: write
  checks: read

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Fallback trigger (#7539 follow-up): GitHub's cron has been unreliable for this
  # workflow (zero scheduled firings in its first 4h on main), so also arm right
  # after any CI run completes — that is exactly the moment a PR can newly become
  # eligible (CI Gate / CF attest just turned green). The scanner never checks out
  # or runs PR-head code, so workflow_run's default-branch privileges are safe here.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: auto-arm-merge
  cancel-in-progress: false

jobs:
  arm:
    name: Arm eligible pull requests
    # After a red CI run nothing can have newly become eligible; skip the scan.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Arm opted-in green pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Module invocation keeps the repo root on sys.path — #7553 added a
        # `from scripts.ci.cf_attest import ...` import that a plain-path
        # invocation cannot resolve (run 33445623952 crashed on it).
        run: python -m scripts.ci.auto_arm_merge
