name: Rules Deployment Check

permissions:
  contents: read

# Agent files are deployed by the installed lu-machinery release
# (`lu_machinery.agent_deploy`, pinned in uv.lock) from the
# release resources plus the product sources agents_extensions/deployment.v1.json
# names. Every input of that composition is in the path filters below.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rules-deployment-check.yml'
      - '.github/actions/python-ci-env/**'
      - 'agents_extensions/deployment.v1.json'
      - 'agents_extensions/shared/**'
      - 'agents_extensions/codex/**'
      - 'agents_extensions/agy/**'
      - 'agents_extensions/cursor/**'
      - 'package.json'
      - 'uv.lock'
      - 'scripts/pre_commit/project_python.sh'
      - 'scripts/lib/project_interpreter.sh'
      - 'scripts/lib/deploy_extensions.sh'
      - 'curriculum/l2-uk-en/curriculum.yaml'
      - '.claude/**'
      - '.agent/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
  pull_request:
    paths:
      - '.github/workflows/rules-deployment-check.yml'
      - '.github/actions/python-ci-env/**'
      - 'agents_extensions/deployment.v1.json'
      - 'agents_extensions/shared/**'
      - 'agents_extensions/codex/**'
      - 'agents_extensions/agy/**'
      - 'agents_extensions/cursor/**'
      - 'package.json'
      - 'uv.lock'
      - 'scripts/pre_commit/project_python.sh'
      - 'scripts/lib/project_interpreter.sh'
      - 'scripts/lib/deploy_extensions.sh'
      - 'curriculum/l2-uk-en/curriculum.yaml'
      - '.claude/**'
      - '.agent/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-rules-deployment:
    name: Verify Agent Deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python CI environment
        uses: ./.github/actions/python-ci-env
        env:
          GH_TOKEN: ${{ github.token }}

      # scripts/pre_commit/project_python.sh and the deployer read the
      # machinery.host.v1 binding. A runner has no host binding file, so the job
      # binds this checkout through LU_HOST_CONTEXT with the state-role shape the
      # release's consumer probe uses: the checkout's .venv is both the machinery
      # runtime and the product interpreter.
      - name: Bind the job's host context
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/lu-host-state"
          binding="$RUNNER_TEMP/host.v1.json"
          install -d -m 700 "$state"
          .venv/bin/python -I - "$binding" "$state" "$PWD" <<'PY'
          import importlib.metadata, json, sys, tomllib
          binding, state, root = sys.argv[1:4]
          python = f"{root}/.venv/bin/python"
          with open(f"{root}/uv.lock", "rb") as stream:
              (package,) = [p for p in tomllib.load(stream)["package"] if p["name"] == "lu-machinery"]
          unused = f"{state}-unused"
          context = {
              "schema": "machinery.host.v1",
              "state_root": state,
              "runtime": {
                  "python": python,
                  "lu_machinery": importlib.metadata.version("lu-machinery"),
                  "wheel_sha256": package["wheels"][0]["hash"].removeprefix("sha256:"),
              },
              "repos": {"machinery": root},
              "products": {"public": {"repo": "machinery", "python": python}},
              "default_product": "public",
              "private_tools": {},
              "cto": {"workspace": unused, "starter": f"{unused}/start", "config_dir": unused},
              "selector_file": f"{unused}/selector.yaml",
              "monitor_url": "http://127.0.0.1",
          }
          with open(binding, "x", encoding="utf-8") as stream:
              json.dump(context, stream)
          PY
          chmod 600 "$binding"
          printf 'LU_HOST_CONTEXT=%s\nLU_PYTHON=%s\n' "$binding" "$PWD/.venv/bin/python" >> "$GITHUB_ENV"
          LU_HOST_CONTEXT="$binding" .venv/bin/python -I -m lu_machinery.host_context check --role state

      - name: Deploy agent files from the installed release
        run: npm run --silent --if-present=false --script-shell=/bin/sh agents:deploy

      - name: Verify the deployment and its idempotency
        run: |
          set -euo pipefail
          check=(scripts/pre_commit/project_python.sh -I -m lu_machinery.agent_deploy --project-root "$PWD" --check)
          "${check[@]}"
          second="$(npm run --silent --if-present=false --script-shell=/bin/sh agents:deploy)"
          printf '%s\n' "$second"
          [[ "$second" == *"; 0 changes" ]] || { echo "::error::a second deploy changed outputs"; exit 1; }
          # The pre-push gate verifies deployed files against the outgoing commit.
          "${check[@]}" --print-manifest --inputs-commit "$(git rev-parse HEAD)" >/dev/null

# The installed release resolves its consumer explicitly.
env:
  LU_PRODUCT_ROOT: ${{ github.workspace }}
  LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
