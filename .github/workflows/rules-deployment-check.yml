name: Rules Deployment Check

permissions:
  contents: read

# Agent files are deployed by the installed lu-machinery release
# (`lu_machinery.agent_deploy`, pinned in uv.lock) from the
# release resources plus the product sources agents_extensions/deployment.v1.json
# names. Every input of that composition is in the path filters below.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rules-deployment-check.yml'
      - '.github/actions/python-ci-env/**'
      - 'agents_extensions/deployment.v1.json'
      - 'agents_extensions/shared/**'
      - 'agents_extensions/codex/**'
      - 'agents_extensions/agy/**'
      - 'package.json'
      - 'uv.lock'
      - 'scripts/pre_commit/project_python.sh'
      - 'scripts/lib/project_interpreter.sh'
      - 'scripts/lib/deploy_extensions.sh'
      - 'curriculum/l2-uk-en/curriculum.yaml'
      - '.claude/**'
      - '.agent/**'
      - '.agents/**'
      - '.codex/**'
  pull_request:
    paths:
      - '.github/workflows/rules-deployment-check.yml'
      - '.github/actions/python-ci-env/**'
      - 'agents_extensions/deployment.v1.json'
      - 'agents_extensions/shared/**'
      - 'agents_extensions/codex/**'
      - 'agents_extensions/agy/**'
      - 'package.json'
      - 'uv.lock'
      - 'scripts/pre_commit/project_python.sh'
      - 'scripts/lib/project_interpreter.sh'
      - 'scripts/lib/deploy_extensions.sh'
      - 'curriculum/l2-uk-en/curriculum.yaml'
      - '.claude/**'
      - '.agent/**'
      - '.agents/**'
      - '.codex/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-rules-deployment:
    name: Verify Agent Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python CI environment
        uses: ./.github/actions/python-ci-env
        env:
          GH_TOKEN: ${{ github.token }}

      # The checkout is its own primary, so the package script's default
      # interpreter anchor (the checkout) resolves .venv/bin/python through
      # scripts/pre_commit/project_python.sh with its usual validation.
      - name: Deploy agent files from the installed release
        run: npm run --silent --if-present=false --script-shell=/bin/sh agents:deploy

      - name: Verify the deployment and its idempotency
        run: |
          set -euo pipefail
          check=(scripts/pre_commit/project_python.sh -I -m lu_machinery.agent_deploy --project-root "$PWD" --check)
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT="$PWD" "${check[@]}"
          second="$(npm run --silent --if-present=false --script-shell=/bin/sh agents:deploy)"
          printf '%s\n' "$second"
          [[ "$second" == *"; 0 changes" ]] || { echo "::error::a second deploy changed outputs"; exit 1; }
          # The pre-push gate verifies deployed files against the outgoing commit.
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT="$PWD" "${check[@]}" --print-manifest --inputs-commit "$(git rev-parse HEAD)" >/dev/null

# The installed release resolves its consumer explicitly.
env:
  LU_PRODUCT_ROOT: ${{ github.workspace }}
  LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
