name: Rules Deployment Check

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rules-deployment-check.yml'
      - 'scripts/deploy_prompts.sh'
      - 'scripts/deploy_orphan_paths.sh'
      - 'scripts/deploy/**'
      - 'scripts/agent_deploy/**'
      - 'scripts/check_rules_deployment.sh'
      - 'scripts/lint_prompts.py'
      - 'scripts/lint/**/*.py'
      - 'agents_extensions/shared/**'
      - 'agents_extensions/codex/**'
      - 'gemini_extensions/**'
      - '.claude/**'
      - '.agent/**'
      - '.agents/**'
      - '.codex/**'
      - '.gemini/**'
      - 'tests/test_deploy_script_idempotency.py'
  pull_request:
    paths:
      - '.github/workflows/rules-deployment-check.yml'
      - 'scripts/deploy_prompts.sh'
      - 'scripts/deploy_orphan_paths.sh'
      - 'scripts/deploy/**'
      - 'scripts/agent_deploy/**'
      - 'scripts/check_rules_deployment.sh'
      - 'scripts/lint_prompts.py'
      - 'scripts/lint/**/*.py'
      - 'agents_extensions/shared/**'
      - 'agents_extensions/codex/**'
      - 'gemini_extensions/**'
      - '.claude/**'
      - '.agent/**'
      - '.agents/**'
      - '.codex/**'
      - '.gemini/**'
      - 'tests/test_deploy_script_idempotency.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-rules-deployment:
    name: Verify Deploy Script Idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python CI environment
        uses: ./.github/actions/python-ci-env
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify committed mirrors before deploy
        run: bash scripts/check_rules_deployment.sh --tracked-mirrors-only

      - name: Verify deploy script is idempotent (rules/prompts sync)
        run: |
          bash scripts/deploy_prompts.sh
          bash scripts/check_rules_deployment.sh

      - name: Regression tests for deploy drift check
        run: .venv/bin/python -m pytest tests/test_deploy_script_idempotency.py -v
