# Owner: DevOps. Issue feedback only; never a required check for code PRs.
name: Issue task quality

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-task-quality-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - name: Fetch the locked lu-machinery wheel
        id: machinery-wheel
        uses: ./.github/actions/python-ci-env
        with:
          machinery-wheel-only: 'true'
          with-uv: 'true'
      - name: Install the locked reporter environment
        env:
          MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.machinery-wheelhouse }}
          MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.machinery-requirement }}
          UV_PROJECT_ENVIRONMENT: .venv
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --locked --no-build --python "$(cat .python-version)" --only-group machinery --no-install-package lu-machinery
          uv pip install --python .venv/bin/python --no-index --no-deps --require-hashes \
            --find-links "${MACHINERY_WHEELHOUSE}" -r "${MACHINERY_REQUIREMENT}"
      - name: Re-fetch issue and reconcile feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          LU_PRODUCT_ROOT: ${{ github.workspace }}
          LEARN_UKRAINIAN_PRIMARY_REPO_ROOT: ${{ github.workspace }}
        run: .venv/bin/python -m lu_machinery.ci.comment_issue_task_quality
