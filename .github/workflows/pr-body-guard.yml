name: PR body guard

# Negated-closing-reference guard (#8505). ci.yml used to run this check inside
# its Secret scan job, which is why ci.yml subscribed to `edited`; that made
# every PR-body edit restart the full 15-minute CI on an unchanged commit. The
# guard now lives here so `edited` re-checks only the body, while opened /
# synchronize / reopened keep the guard enforced at push time (S2).
#
# Status: advisory. "CI Gate" remains the only required check; promoting this
# status to required is a deliberate branch-protection change for the operator.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Keyed by PR number: a rapid body edit cancels the previous guard run. The
  # job is a two-second linter, so cancellation is cheap and safe.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closing-references:
    name: Reject negated closing references
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The closing-reference lint and the publication-surface lint.
          sparse-checkout: |
            scripts/audit/lint_pr_closing_references.py
            scripts/audit/lint_public_surfaces.py
            scripts/audit/lint_opsec_leaks.py
            scripts/opsec/__init__.py
            scripts/opsec/needles.py
            .python-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Reject negated closing references
        run: |
          python3 - <<'PY' | python3 scripts/audit/lint_pr_closing_references.py --stdin
          import json
          import os
          import sys
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = (event.get("pull_request") or {}).get("body") or ""
          sys.stdout.write(body)
          PY
      - name: Scan pull request title, body, and branch
        run: |
          python3 scripts/audit/lint_public_surfaces.py \
            --event-file "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME"
