name: Nightly CI failure issue

# Routes the latest scheduled (nightly) CI run, red or recovered, to one owned
# issue. ci.yml jobs must run on every event and feed CI Gate, so this lives in
# its own scheduled workflow, after the 03:30 UTC nightly CI run.

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-issue-ci
  cancel-in-progress: false

jobs:
  nightly-issue:
    name: Nightly failure issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/
            scripts/ci/nightly_issue.py
            tests/
            tests/
            scripts/__init__.py
            scripts/common/__init__.py
            scripts/common/github_client.py
            scripts/opsec/__init__.py
            scripts/opsec/gh_snapshot.py
            scripts/opsec/prepublish.py
            .python-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - name: Route nightly CI result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Every scheduled CI run completed in the last 25 hours, oldest first, so a
          # late failure is reported even when a later run is green.
          since="$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh run list -R "${REPO}" -w ci.yml --event schedule --status completed -L 20 \
            --json conclusion,url,createdAt \
            --jq "[.[] | select(.createdAt >= \"${since}\")] | sort_by(.createdAt) | .[] | \"\(.conclusion) \(.url)\"" |
          while read -r conclusion run_url; do
            case "${conclusion}" in
              success) status=success ;;
              failure|timed_out|startup_failure) status=failure ;;
              *) echo "skip ${conclusion} ${run_url}"; continue ;;
            esac
            python3 scripts/ci/nightly_issue.py --key ci.yml --status "${status}" \
              --run-url "${run_url}" --workflow-path .github/workflows/ci.yml
          done
