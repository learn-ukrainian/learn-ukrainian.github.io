# Dependabot — automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions — detect outdated SHA pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait 7 days after a new release before opening a PR — gives the
    # upstream time to surface regressions and avoids burning CI on
    # versions that get yanked. zizmor/dependabot-cooldown requires
    # default-days >= 7 (alerts #209-#211 raised the bar from 5).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    # Group all action updates into a single PR
    groups:
      github-actions:
        patterns:
          - "*"

  # npm (site)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    # Astro + @astrojs/* majors must bump together (peer ERESOLVE if split).
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    # Only security updates — we don't want churn on minor bumps
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check@0.9.9 peers typescript@"^5.0.0 || ^6.0.0"; typescript 7
      # fails npm ci with ERESOLVE. Block >=7 until @astrojs/check accepts it —
      # REMOVE this entry then. Closed PR: #5527.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # npm (root manifest). Same weekly schedule, grouping, and cooldown as /site.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    open-pull-requests-limit: 5

  # pip (Python scripts)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # psycopg and psycopg-binary must stay at the same version: the C
    # implementation is loaded by the Python package, and a `--no-deps` install
    # ignores the [binary] extra. Bump them in one PR (#12476).
    groups:
      psycopg:
        patterns:
          - "psycopg"
          - "psycopg-binary"
    # Block constrained transitive bumps that requirements-lock.txt (a flat,
    # fully-pinned lock) lets Dependabot propose past their parent's pin,
    # producing structurally un-mergeable PRs. See issue #2716.
    ignore:
      # Every package requirements-machinery.lock also pins. That lock is resolved
      # with requirements-lock.txt as constraints (machinery docs/release.md,
      # "Dependency lock"), so a bump here alone makes installing both locks
      # unsatisfiable (#13086, #13087, #13088). These move only through a
      # machinery release. Canonical names, sorted, no version filters: the
      # "Check shared pins with the machinery lock" step of ci.yml fails when one
      # is missing. pydantic and pydantic-core (#2540) and starlette (#2710) are
      # in this list.
      - dependency-name: "annotated-doc"
      - dependency-name: "annotated-types"
      - dependency-name: "anyio"
      - dependency-name: "attrs"
      - dependency-name: "blinker"
      - dependency-name: "cffi"
      - dependency-name: "cfgv"
      - dependency-name: "click"
      - dependency-name: "coverage"
      - dependency-name: "cryptography"
      - dependency-name: "distlib"
      - dependency-name: "execnet"
      - dependency-name: "fastapi"
      - dependency-name: "filelock"
      - dependency-name: "flask"
      - dependency-name: "graphql-core"
      - dependency-name: "h11"
      - dependency-name: "httpcore2"
      - dependency-name: "httpx2"
      - dependency-name: "identify"
      - dependency-name: "idna"
      - dependency-name: "ijson"
      - dependency-name: "iniconfig"
      - dependency-name: "itsdangerous"
      - dependency-name: "jinja2"
      - dependency-name: "jsonschema"
      - dependency-name: "jsonschema-specifications"
      - dependency-name: "markdown-it-py"
      - dependency-name: "markupsafe"
      - dependency-name: "mcp"
      - dependency-name: "mcp-types"
      - dependency-name: "mdurl"
      - dependency-name: "nodeenv"
      - dependency-name: "opentelemetry-api"
      - dependency-name: "packaging"
      - dependency-name: "platformdirs"
      - dependency-name: "pluggy"
      - dependency-name: "pre-commit"
      - dependency-name: "prometheus-client"
      - dependency-name: "psutil"
      - dependency-name: "psycopg"
      - dependency-name: "psycopg-binary"
      - dependency-name: "pycparser"
      - dependency-name: "pydantic"
      - dependency-name: "pydantic-core"
      - dependency-name: "pygments"
      - dependency-name: "pyjwt"
      - dependency-name: "pytest"
      - dependency-name: "pytest-xdist"
      - dependency-name: "python-discovery"
      - dependency-name: "python-multipart"
      - dependency-name: "pyyaml"
      - dependency-name: "referencing"
      - dependency-name: "rpds-py"
      - dependency-name: "sse-starlette"
      - dependency-name: "starlette"
      - dependency-name: "truststore"
      - dependency-name: "typing-extensions"
      - dependency-name: "typing-inspection"
      - dependency-name: "uvicorn"
      - dependency-name: "virtualenv"
      - dependency-name: "werkzeug"
      # lxml is capped by inscriptis (inscriptis==2.7.1 requires lxml<6.1.0);
      # lxml 6.1.0 re-breaks the inscriptis import that #2732 fixed by pinning
      # down to 6.0.4 (#3282). Allow 6.0.x patches but block >=6.1.0 until
      # inscriptis supports lxml 6.1.x — REMOVE this entry then. Closed PR: #3329.
      - dependency-name: "lxml"
        versions: [">=6.1.0"]
      # tokenizers is capped by transformers (transformers==4.57.6 requires
      # tokenizers>=0.22.0,<=0.23.0); 0.23.1 breaks the test suite. Allow
      # 0.22.x-0.23.0 but block >0.23.0 until a transformers bump raises the
      # cap — REMOVE this entry then. Closed PR: #3338.
      - dependency-name: "tokenizers"
        versions: [">=0.23.1"]
