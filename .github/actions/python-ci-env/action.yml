name: 'Python CI environment'
description: >-
  Set up uv, install requirements-lock.txt into .venv (offline-first with an
  index retry, #9061), install ./packages/v4-runtime, then verify the Atlas
  lexicon manifest. Shared by the pytest, fast-checks and needs-artifact-audit
  jobs so the copied setup blocks cannot drift (#9062).

outputs:
  uv-cache-key:
    description: 'Exact setup-uv cache key for this runner, Python and requirements-lock.txt.'
    value: ${{ steps.setup-uv.outputs.cache-key }}

runs:
  using: 'composite'
  steps:
    - name: Set up uv
      id: setup-uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.9'
        enable-cache: true
        # Hash of requirements-lock.txt only. setup-uv restores that exact key
        # and passes no restore-keys; a different lock cannot satisfy --offline.
        cache-dependency-glob: requirements-lock.txt
        # Only refs/heads/main saves (the nightly schedule and uv-cache-warm.yml),
        # so the one entry every ref can read is the only one written (#9101).
        # A pull_request save lands on refs/pull/N/merge, readable only by that
        # PR, at ~447 MiB each; enough of them pushed the repository past
        # GitHub's 10 GB limit, whose LRU eviction could drop main's entry. PRs
        # still restore main's entry: the key has no event or ref component and
        # a PR may read its base branch's caches. merge_group never saved (its
        # gh-readonly-queue ref is unreadable by the next run) and still cannot.
        save-cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}

    - name: Install Python deps
      shell: bash
      run: |
        set -euo pipefail
        python -m venv .venv
        # Drop live-ML wheels; the unit suite does not import them and they
        # exceed the 15m budget. Check the installed dependency graph below.
        grep -viE '^(torch|torchvision|open_clip_torch|stanza)==' requirements-lock.txt \
          > "${RUNNER_TEMP}/requirements-ci.txt"
        if ! uv pip install --offline --python .venv/bin/python --no-deps -r "${RUNNER_TEMP}/requirements-ci.txt"; then
          echo 'uv cache incomplete; retrying installation from the index'
          uv pip install --python .venv/bin/python --no-deps -r "${RUNNER_TEMP}/requirements-ci.txt"
        fi
        uv pip install --python .venv/bin/python --no-deps --no-build-isolation ./packages/v4-runtime
        # The seven known missing ML dependencies result from the CI wheel
        # filter. The fallback accepts only those exact omissions.
        check_exit=0
        uv pip check --python .venv/bin/python || check_exit=$?
        if (( check_exit != 0 )); then
          if (( check_exit != 1 )); then exit "$check_exit"; fi
          .venv/bin/python scripts/audit/check_ci_dependencies.py
        fi
        .venv/bin/python packages/v4-runtime/build_assets.py

    - name: Hydrate Atlas lexicon manifest
      shell: bash
      run: |
        .venv/bin/python -c "import sys; sys.path.insert(0, 'scripts'); from lexicon.manifest_io import load_manifest; load_manifest(); print('Atlas manifest verified against pointer')"
