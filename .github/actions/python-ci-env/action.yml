name: 'Python CI environment'
description: >-
  Set up uv, install the project environment into .venv with uv sync --locked
  from uv.lock on the Python in .python-version (offline-first with an index
  retry, #9061), install the hash-checked lu-machinery release wheel, build the
  ./packages/v4-runtime assets, then verify the Atlas lexicon manifest. Shared by
  ci.yml and uv-cache-warm.yml so the install cannot drift between jobs (#9062).
  With machinery-wheel-only it only fetches the locked lu-machinery wheel and
  writes its hash-pinned requirement, for jobs that install that wheel alone: the
  repository's one copy of the fetch.
inputs:
  save-cache:
    description: 'Whether to save the uv cache; diagnostic workflows must disable writes.'
    default: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
  machinery-wheel-only:
    description: >-
      'true' fetches the locked lu-machinery wheel into the wheelhouse and writes the
      machinery-requirement file, and does nothing else (no project install); the job
      installs the wheel with its own --require-hashes command.
    default: 'false'
  with-uv:
    description: >-
      'true' also puts the pinned uv on PATH in machinery-wheel-only mode, without the
      uv cache, for jobs that read uv.lock with uv (the dependency audit exports it).
    default: 'false'
  hydrate-manifest:
    description: 'Verify the Atlas manifest; disable for jobs that only warm dependency caches.'
    default: 'true'
outputs:
  uv-cache-key:
    description: 'Exact setup-uv cache key for this runner, Python and uv.lock.'
    value: ${{ steps.setup-uv.outputs.cache-key }}
  machinery-wheelhouse:
    description: 'Directory holding the locked lu-machinery wheel.'
    value: ${{ steps.machinery-wheel.outputs.wheelhouse }}
  machinery-requirement:
    description: >-
      Requirements file pinning the locked lu-machinery version and its uv.lock SHA-256;
      install it with --no-index --no-deps --require-hashes --find-links machinery-wheelhouse.
    value: ${{ steps.machinery-wheel.outputs.requirement }}

runs:
  using: 'composite'
  steps:
    - name: Read Python pin
      id: python-pin
      if: inputs.machinery-wheel-only != 'true'
      shell: bash
      run: |
        version=$(cat .python-version)
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    # uv sync runs with UV_PYTHON_DOWNLOADS=never, so the pinned interpreter must be
    # on the runner. Callers that already ran setup-python hit its tool cache here.
    - name: Set up the pinned Python
      if: inputs.machinery-wheel-only != 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python-pin.outputs.version }}

    - name: Set up uv
      id: setup-uv
      if: inputs.machinery-wheel-only != 'true' || inputs.with-uv == 'true'
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        # pyproject.toml [tool.uv] required-version: the one uv that writes and
        # reads uv.lock (machinery .github/workflows/pins.txt UV_VERSION).
        version: '0.13.1'
        # Read the same pin as setup-python; avoid uv's interpreter inference
        # producing an unknown cache key before a matching environment exists.
        python-version: ${{ steps.python-pin.outputs.version }}
        # The audit-only uv of machinery-wheel-only jobs neither restores nor saves.
        enable-cache: ${{ inputs.machinery-wheel-only != 'true' }}
        # setup-uv restores that exact key (lu_machinery.ci.cache_hygiene
        # recomputes it from uv.lock) and passes no restore-keys; a different
        # lock cannot satisfy --offline.
        cache-dependency-glob: uv.lock
        # Only refs/heads/main saves (the nightly schedule and uv-cache-warm.yml),
        # so the one entry every ref can read is the only one written (#9101).
        # A pull_request save lands on refs/pull/N/merge, readable only by that
        # PR, at ~447 MiB each; enough of them pushed the repository past
        # GitHub's 10 GB limit, whose LRU eviction could drop main's entry. PRs
        # still restore main's entry: the key has no event or ref component and
        # a PR may read its base branch's caches. merge_group never saved (its
        # gh-readonly-queue ref is unreadable by the next run) and still cannot.
        save-cache: ${{ inputs.save-cache }}

    # lu-machinery is not on PyPI: uv.lock pins the exact release wheel URL and its
    # SHA-256 (machinery docs/release.md, Consumers). Every CI job needs it, so it
    # comes from the Actions cache, keyed on the wheel name and the lock's hash; a
    # miss downloads it through the authenticated releases API. The anonymous
    # release URL failed with HTTP 403 for whole retry windows when the shared
    # hosted-runner address pool was throttled, so uv sync never fetches that URL
    # here (--no-install-package lu-machinery below). The lock's hash, not the
    # source, decides which bytes install.
    - name: Locate the locked lu-machinery wheel
      id: machinery-wheel
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f uv.lock ]]; then
          # coverage-ref.yml runs this action against the commit it measures:
          # commits before the uv switch (#13194) have no uv.lock to install from.
          echo "::error::uv.lock is missing; this action installs only from uv.lock"
          exit 1
        fi
        wheelhouse="${RUNNER_TEMP}/lu-machinery-wheelhouse"
        requirement="${RUNNER_TEMP}/lu-machinery-requirement.txt"
        mkdir -p "${wheelhouse}"
        python3 -I - uv.lock "${wheelhouse}" "${requirement}" >> "$GITHUB_OUTPUT" <<'PY'
        import re
        import sys
        import tomllib

        lock_path, wheelhouse, requirement = sys.argv[1:4]
        with open(lock_path, "rb") as handle:
            packages = [p for p in tomllib.load(handle).get("package", []) if p.get("name") == "lu-machinery"]
        if len(packages) != 1:
            sys.exit(f"::error::uv.lock must lock exactly one lu-machinery package; found {len(packages)}")
        package = packages[0]
        version = package.get("version", "")
        url = package.get("source", {}).get("url", "")
        wheels = package.get("wheels", [])
        name = f"lu_machinery-{version}-py3-none-any.whl"
        if (re.fullmatch(r"[0-9]+(\.[0-9]+)*", version) is None
                or not url.startswith("https://github.com/learn-ukrainian/machinery/releases/download/")
                or not url.endswith(f"/v{version}/{name}")
                or len(wheels) != 1 or wheels[0].get("url") != url):
            sys.exit("::error::uv.lock must pin lu-machinery to one release wheel URL of learn-ukrainian/machinery")
        match = re.fullmatch(r"sha256:([0-9a-f]{64})", str(wheels[0].get("hash", "")))
        if match is None:
            sys.exit(f"::error::uv.lock carries no sha256 hash for lu-machinery {version}")
        digest = match.group(1)
        with open(requirement, "w", encoding="utf-8") as handle:
            handle.write(f"lu-machinery=={version} --hash=sha256:{digest}\n")
        print(f"version={version}")
        print(f"wheel={name}")
        print(f"hash={digest}")
        print(f"wheelhouse={wheelhouse}")
        print(f"requirement={requirement}")
        print(f"cache-key=lu-machinery-wheel-{version}-{digest[:16]}")
        PY

    - name: Restore the lu-machinery wheel
      id: machinery-wheel-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.machinery-wheel.outputs.wheelhouse }}
        key: ${{ steps.machinery-wheel.outputs.cache-key }}

    - name: Download the lu-machinery wheel
      if: steps.machinery-wheel-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        # The job's token (contents: read is enough for a public release); the
        # API's authenticated quota replaces the anonymous CDN throttle.
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.machinery-wheel.outputs.version }}
        WHEEL: ${{ steps.machinery-wheel.outputs.wheel }}
        WHEELHOUSE: ${{ steps.machinery-wheel.outputs.wheelhouse }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if gh release download "v${VERSION}" --repo learn-ukrainian/machinery \
              --pattern "${WHEEL}" --dir "${WHEELHOUSE}" --clobber; then
            exit 0
          fi
          if (( attempt < 3 )); then
            echo "::warning::lu-machinery wheel download attempt ${attempt} failed; retrying"
            sleep $(( attempt * 15 ))
          fi
        done
        echo "::error::could not download ${WHEEL} from release v${VERSION}"
        exit 1

    # Checked here, too, so a corrupt download is never saved to the cache.
    - name: Verify the lu-machinery wheel against the lock
      shell: bash
      env:
        EXPECTED: ${{ steps.machinery-wheel.outputs.hash }}
        WHEEL_PATH: ${{ steps.machinery-wheel.outputs.wheelhouse }}/${{ steps.machinery-wheel.outputs.wheel }}
        CACHE_HIT: ${{ steps.machinery-wheel-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        actual="$(sha256sum "${WHEEL_PATH}" | cut -d' ' -f1)"
        if [[ "${actual}" != "${EXPECTED}" ]]; then
          echo "::error::${WHEEL_PATH##*/} sha256 ${actual} is not the uv.lock hash ${EXPECTED}"
          exit 1
        fi
        echo "lu-machinery wheel ${WHEEL_PATH##*/} sha256 ${actual} matches uv.lock (cache hit: ${CACHE_HIT:-false})"

    # About 5 MiB, written only on a miss: main writes the entry every ref can
    # read; a pull request also writes its own (readable only by that PR, so a
    # version bump hits on reruns); merge_group and diagnostic runs do not.
    - name: Save the lu-machinery wheel
      if: >-
        steps.machinery-wheel-cache.outputs.cache-hit != 'true'
        && (inputs.save-cache == 'true' || github.event_name == 'pull_request')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.machinery-wheel.outputs.wheelhouse }}
        key: ${{ steps.machinery-wheel.outputs.cache-key }}

    - name: Install Python deps
      if: inputs.machinery-wheel-only != 'true'
      shell: bash
      env:
        MACHINERY_WHEELHOUSE: ${{ steps.machinery-wheel.outputs.wheelhouse }}
        MACHINERY_REQUIREMENT: ${{ steps.machinery-wheel.outputs.requirement }}
        PYTHON_VERSION: ${{ steps.python-pin.outputs.version }}
        # uv sync writes the environment the jobs call as .venv/bin/python.
        UV_PROJECT_ENVIRONMENT: .venv
        UV_PYTHON_DOWNLOADS: never
      run: |
        set -euo pipefail
        # --locked refuses a uv.lock that no longer matches pyproject.toml, and
        # every wheel is checked against its locked SHA-256. Excluded by name:
        # the live-ML wheels (the unit suite does not import them and they exceed
        # the 15m budget; pytest-slow-nightly.yml installs them) and lu-machinery,
        # installed below from the hash-checked wheelhouse.
        sync=(uv sync --locked --python "${PYTHON_VERSION}"
          --no-install-package torch --no-install-package torchvision
          --no-install-package open-clip-torch --no-install-package stanza
          --no-install-package lu-machinery)
        if ! "${sync[@]}" --offline; then
          echo 'uv cache incomplete; retrying installation from the index'
          "${sync[@]}"
        fi
        uv pip install --python .venv/bin/python --no-index --no-deps --require-hashes \
          --find-links "${MACHINERY_WHEELHOUSE}" -r "${MACHINERY_REQUIREMENT}"
        .venv/bin/python packages/v4-runtime/build_assets.py

    # Use the same pointer key and path as deploy-pages and pytest-slow-nightly.
    # An artifact supplied by CI is already local; leave it for the loader to verify.
    - name: Restore Atlas lexicon manifest cache
      id: atlas-manifest-cache
      if: inputs.machinery-wheel-only != 'true' && inputs.hydrate-manifest == 'true' && hashFiles('site/src/data/lexicon-manifest.json') == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: site/src/data/lexicon-manifest.json
        key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}

    - name: Hydrate Atlas lexicon manifest
      if: inputs.machinery-wheel-only != 'true' && inputs.hydrate-manifest == 'true'
      shell: bash
      run: |
        .venv/bin/python -c "import sys; sys.path.insert(0, 'scripts'); from lexicon.manifest_io import load_manifest; load_manifest(); print('Atlas manifest verified against pointer')"

    - name: Save Atlas lexicon manifest cache
      if: inputs.machinery-wheel-only != 'true' && inputs.hydrate-manifest == 'true' && inputs.save-cache == 'true' && steps.atlas-manifest-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: site/src/data/lexicon-manifest.json
        key: lexicon-manifest-${{ hashFiles('site/src/data/lexicon-manifest.pointer.json') }}
