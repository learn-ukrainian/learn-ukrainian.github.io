# Code ownership map (operator order CODE-OWNERS-1117).
#
# main_owner is accountable for all code. An area's owner owns that area's checks (verify_run
# area, reliability checklist items, review guidance) and is the preferred author for hard
# changes there; its reviewer is a different family, per the review ladders.
#
# `closeout_cli checklist` reads this file from the merge-base of the change under review, like
# the reliability checklist, and names in the review brief the owner of every area the diff
# touches. A path in no area belongs to main_owner. A path may sit in several areas.
#
# Area keys: area (kebab-case, unique), owner, paths (full-path globs: `**` spans directories,
# `*` and `?` stay within one), and optionally ui_qa and note.
version: 1
main_owner: claude-cto
areas:
  - area: review-and-dispatch
    owner: claude-opus-5-5
    paths:
      - lu_machinery/review/**
      - lu_machinery/dispatcher/**
      - lu_machinery/agent_runtime/**
      - lu_machinery/guardrails/**
      - lu_machinery/publish/**
      - agents_extensions/shared/hooks/**
      - agents_extensions/shared/skills/review-loop/**

  - area: ci-release-deps
    owner: gpt-6.2-sol
    paths:
      - .github/**
      - lu_machinery/ci/**
      - lu_machinery/release/**
      - packaging/**
      - pyproject.toml
      - uv.lock
      - requirements*.txt
      - requirements*.lock
      - .python-version

  - area: fleet-comms-and-orchestration
    owner: claude-opus-5-5
    paths:
      - lu_machinery/fleet_comms/**
      - lu_machinery/orchestration/**
      - lu_machinery/driver_state.py

  - area: api-and-ui
    owner: grok-4.7-high
    ui_qa: eggbot
    paths:
      - lu_machinery/api/**
      - scripts/project_api/**
      - site/**
      - dashboards/**

  - area: storage-and-sources
    owner: gpt-6.2-sol
    paths:
      - lu_machinery/storage/**
      - lu_machinery/lib/readonly_sqlite.py
      - .mcp/servers/sources/**
      - scripts/verification/**

  - area: ukrainian-content-and-language
    owner: language lanes (gemini-4-neon-high via AGY; gpt-6.2-sol)
    note: VESUM and sources evidence required
    paths:
      - curriculum/**
      - scripts/build/**
      - docs/epics/fresh-build-*
      - agents_extensions/shared/rules/core-curriculum.md

  - area: rules-skills-policy
    owner: claude-cto
    note: designated approval (Opus 5.5 plus Sol 6.2, or the operator)
    paths:
      - agents_extensions/shared/rules/**
      - agents_extensions/shared/skills/**
      - lu_machinery/config/reliability_checklist.yaml
      - lu_machinery/config/code_owners.yaml

  - area: open-model-data
    owner: gpt-6.2-sol
    note: operator keep-list, never delete
    paths:
      - scripts/projects/open_model_data/**
      - tests/projects/open_model_data/**
