# Reviewed exceptions to the headless-Claude spawn rule (#9750).
#
# tests/test_headless_claude_background_controls.py checks every Claude-referencing
# module under scripts/: each process-spawn API reference and InvocationPlan
# construction must be one of the adapter wrappers' own spawns or match an entry
# here by (module, function, program). `program` is the spawn's program as
# written: a literal's first word, otherwise the expression's source.
# `<argv-holder>` entries clear a function that holds a Claude program token and
# a print flag without calling a wrapper.
#
# Categories:
#   non-claude      runs a program other than Claude Code (program must not name Claude)
#   claude-probe    fixed non-headless probe of a CLI that may be Claude; clears only a literal
#                   `[program, *words, --version|--help]` argv (optionally behind a listed
#                   sandbox prefixer), never a computed one
#   runtime         the tested agent-runtime path: Claude/KimiCC plans and the shared runner
#                   (module must be the runner or a harness in _CLAUDE_CODE_HARNESSES)
#   generic-runner  spawns an argv the rule cannot see; the reason names what reaches it.
#                   Not proven safe by this rule: an opaque-helper limit.
#   argv-builder    builds a headless Claude argv that `spawned_by` (same module) runs
#                   through a wrapper; the test checks that function calls one.
#
# A stale entry (one matching no site) fails the test. Add an entry only after
# reading the spawn; never to silence a Claude print-mode run.
exceptions:
  # scripts/agent_runtime/adapters/acpx.py
  - {module: scripts/agent_runtime/adapters/acpx.py, function: "<module>", program: "<argv-holder>", category: non-claude, reason: "module-level ACP option tables hold `--print` for acpx and name the Claude participant; no Claude argv"}
  - {module: scripts/agent_runtime/adapters/acpx.py, function: "AcpxAdapter.build_invocation", program: "cmd", category: non-claude, reason: "plan runs the acpx ACP client (`acpx` argv from _confinement_prefix_argv), not `claude -p`"}
