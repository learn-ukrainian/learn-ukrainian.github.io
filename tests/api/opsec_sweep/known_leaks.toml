# PR-A starts green by recording only findings observed against the isolated
# fixture.  [[known_leaks]] rows are burn-down obligations: remove the row
# with the emitter change in the same diff; do not add compatibility path
# fields to make a finding fit. Every known_leaks row cites its open tracking
# `issue` (checked against tracking_issues.toml).
#
# #8542 burn-down is complete (2026-09-28):
# - dashboard-index-localhost was fixed first (the home page index.html now
#   derives its footer label from location.host).
# - fleet-workers-host-id and occupancy-host-id were scanner false positives:
#   they matched the already-public opaque self host id, which real
#   consumers (the machinery fleet, orient and epics pages) depend on
#   verbatim. HOST_ID_CANARY was dropped from the sweep's canary tuple in
#   test_opsec_route_sweep.py; HOST_ALIAS_CANARY (the real host name the
#   opaque id stands for) remains a canary everywhere.
# - health-instance-host is fixed at the emitter:
#   occupancy_local.resolve_launcher_host_id now rejects a non-opaque
#   LU_MONITOR_HOST_ID and falls back to "local" instead of echoing it.
# - dashboard-work-loopback, the only approved exemption, left with
#   dashboards/work.html when the machinery pages moved out of this checkout.
#
# `[[approved_exemptions]]` rows never expire and take no `owner`/`issue`:
# they stay valid only while the cited `adr` file exists and the finding
# still matches (see _validate_approved_exemptions in
# test_opsec_route_sweep.py). Adding one requires editing
# FROZEN_EXEMPTION_IDS in the same diff. `kind`/`token` pin the row to the
# exact scanner finding (opsec_scan.Finding.kind / .token); operation and
# field alone match the whole dashboard file body, so any other finding in
# that body (a new leak, a swapped URL) would otherwise be absorbed too.
version = 1
