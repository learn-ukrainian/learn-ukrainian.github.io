# Second development lookups for the one entry point, scripts/docs/find.py (#9412),
# written so the first set (docs_find_dev_lookups.yaml) cannot be tuned against.
#
# Each question is asked the way a reader NEW to the repository would ask it, in
# natural wording that avoids the answer file's own name and identifiers ("what
# stops an agent from ..." rather than a hook's name). An independent curator
# drew the questions from issues, handoffs, runbooks and rules (`source`), and
# established the authority paths by reading them; `verify` lists {path,
# contains} pairs, each checked by `git grep --cached -n -F -i -e <contains> --
# <path>` (a data store, which is not a tracked file, verifies against the
# catalogue entry that names it). A second agent, blind to the answers and to the
# tool, wrote the one short `query` per question.
#
# Protocols: `query` (the blind one-shot query) and `question` (the question used
# verbatim as the query). A lookup passes when an expected path is among the
# first `top_n` hits; the ids in known_misses are excluded for the protocols
# they name, each with its reason and its rank when recorded (null: not within
# 200). Checked by tests/test_docs_catalogue_coverage.py, which fails on any
# miss not listed here. The held-out acceptance set is separate and is never
# used here.
#
# Scores within 20 (68 lookups, 2026-10-02), blind queries / full questions:
# before this set existed (#9412 PR 3 round 1, b67381806e) 40 / 29;
# after round 2 (92f6330f30), 61 / 51; after round 3 (lifecycle records), 63 / 54;
# after round 4 (directory notes, supersession records, abbreviations, function spans), 64 / 56.
version: 1
top_n: {query: 20, question: 20}
known_misses:
  N22: {query: null, question: null, reason: 'Vocabulary gap: the guard says accidental disclosure, the question says leak and infrastructure details.'}
  N28: {question: null, reason: 'Not diagnosed in round 3.'}
  N30: {query: 59, question: null, reason: 'Not diagnosed in round 3.'}
  N35: {question: null, reason: 'Not diagnosed in round 3.'}
  N38: {query: 51, reason: 'Not diagnosed in round 3.'}
  N39: {question: 26, reason: 'Not diagnosed in round 3.'}
  N40: {query: 84, question: 36, reason: 'Vocabulary gap: the step says it sets the evidence digest, the question says updates.'}
  N43: {question: 175, reason: 'Not diagnosed in round 3.'}
  N50: {question: 45, reason: 'The store holds the words in its purpose only; long-question words held by prose outrank it.'}
  N54: {question: 24, reason: 'Four places outside: the store record names few of the question''s words about messages.'}
  N59: {question: 71, reason: 'The common words of the long question are held by prose; the short query ranks .gitattributes first.'}
  N64: {question: 28, reason: 'Not diagnosed in round 3.'}
