# Development lookups for the one entry point, scripts/docs/find.py (#9412).
#
# Each lookup is one query as an agent would type it (short, not the whole
# question), the question as asked, the authority path(s) that answer it, and
# the evidence that the path is that authority: `verify` lists {path, contains}
# pairs, each checked by `git grep --cached -n -F -i -e <contains> -- <path>`
# (a lookup whose expected file is not a tracked file, such as a data store,
# verifies against the catalogue entry that names it). A lookup passes when an
# expected path is among the first `top_n.query` hits for its short query and
# the first `top_n.question` hits for its question used verbatim as the query
# (the long-query protocol).
#
# Kinds: resource, doc, data_store, status ("is X still current, what replaced
# it?") and process ("where is this check or step implemented?"). Sources are
# repository issues, rules and handoffs; the L-prefixed lookups are the visible
# dev set the issue driver verified (23 real lookups). The held-out acceptance
# set is separate and is never used here.
# Checked by tests/test_docs_catalogue_coverage.py (verification always; the
# ranking within top_n except the ids listed in known_misses, each with a reason).
# Scores on this set (68 lookups, 2026-10-02), within 20 / within 5 / first:
# before #9412 PR 3, short queries 52 / 48 / 26 and questions 48 / 42 / 24;
# after it, short queries 68 / 62 / 38 and questions 68 / 62 / 38; after round 3
# (lifecycle records), short queries 68 / 63 / 35 and questions 68 / 64 / 35; after round 4
# (directory notes, abbreviations, function spans), 68 / 63 / 34 and 68 / 64 / 34; after round 5
# (the read pool counts text candidates, a family hit lists only the entry points the query
# names), 68 / 64 / 34 and 68 / 65 / 34, at the gate's limit of 50 (read pool 150).
version: 1
top_n: {query: 10, question: 20}
known_misses: {}
