[Service]
Environment=LU_PRODUCT_ROOT=@REPO_ROOT@
Environment=LEARN_UKRAINIAN_PRIMARY_REPO_ROOT=@REPO_ROOT@
ExecStart=
ExecStart=/usr/bin/env bash @REPO_ROOT@/scripts/storage/data_volume_guard.sh -- @REPO_ROOT@/.venv/bin/python -c 'import os,sys; from importlib.resources import files; os.execvp("bash", ["bash", "--noprofile", "--norc", str(files("lu_machinery.orchestration").joinpath("run_project_state_reporter.sh")), *sys.argv[1:]])'
WorkingDirectory=@REPO_ROOT@
RestartPreventExitStatus=78
