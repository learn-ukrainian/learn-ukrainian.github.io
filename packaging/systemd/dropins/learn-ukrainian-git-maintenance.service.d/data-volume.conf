[Service]
Environment=LU_PRODUCT_ROOT=@REPO_ROOT@
Environment=LEARN_UKRAINIAN_PRIMARY_REPO_ROOT=@REPO_ROOT@
ExecStart=
ExecStart=/usr/bin/env @REPO_ROOT@/.venv/bin/python -c 'import os, sys; from importlib.resources import files; os.execvp("bash", ["bash", str(files("lu_machinery.storage").joinpath("data_volume_guard.sh")), *sys.argv[1:]])' -- /usr/bin/env bash @REPO_ROOT@/scripts/orchestration/run_scheduled_worktree_cleanup.sh --repo-root @REPO_ROOT@ --repo-root @PRIVATE_ROOT@ --git-maintenance --apply
RestartPreventExitStatus=78
