# CPU-time ceiling for lu.slice (#10735), approved in the CTO brief for #10735
# (2026-11-02). lu.slice holds lu-dispatch.slice (workers) and lu-driver.slice, so
# the quota covers every worker, driver and descendant, including processes
# reparented to PID 1 (reparenting never leaves the cgroup). Install it next to
# the existing limits drop-in as ~/.config/systemd/user/lu.slice.d/20-cpu.conf
# (procedure, verification and rollback: docs/runbooks/driver-memory-scope.md,
# "CPU-time containment"). Leave the memory limits drop-in (10-limits.conf) untouched.
[Slice]
# Turn on CPU accounting (cpu.stat). The quota itself is enforced by CPUQuota=
# below, through cpu.max.
CPUAccounting=yes
# Percent of ONE CPU per 100%: 1200% is twelve CPUs' worth of CPU time across
# every descendant. It caps CPU time, not load average or thread count.
CPUQuota=1200%
# Enforcement window; a short period limits how long a burst can run at full speed.
CPUQuotaPeriodSec=100ms
# Relative share (default 100). It matters only while the parent cgroup is
# contended, where half weight makes this slice yield CPU to its siblings; it is
# not a cap. The cap is CPUQuota= above.
CPUWeight=50
