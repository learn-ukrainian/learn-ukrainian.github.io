[Service]
Environment=LU_PRODUCT_ROOT=@REPO_ROOT@
Environment=LEARN_UKRAINIAN_PRIMARY_REPO_ROOT=@REPO_ROOT@
ExecStart=
ExecStart=/usr/bin/env @REPO_ROOT@/.venv/bin/python -c 'import os, sys; from importlib.resources import files; os.execvp("bash", ["bash", str(files("lu_machinery.storage").joinpath("data_volume_guard.sh")), *sys.argv[1:]])' -- @REPO_ROOT@/.venv/bin/python -c "import sys, scripts, uvicorn; from lu_machinery.common.repo_root import machinery_path; sys.argv[1:1] = ['--log-config', str(machinery_path('api/logging.json'))]; uvicorn.main()" lu_machinery.api.main:app --host 127.0.0.1 --port 8765 --timeout-graceful-shutdown 8
RestartPreventExitStatus=78
