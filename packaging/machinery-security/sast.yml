# DRAFT for the private learn-ukrainian/machinery repository (issue #12682,
# machinery move contract v3 section 5). Install it there as
# .github/workflows/sast.yml. It is not a check in the public repository.
#
# Blocking SAST with Semgrep CE 1.183.0 and the semgrep/semgrep-rules checkout
# at a pinned commit. Pins and their upstream evidence are recorded in
# pins.txt beside this file; bump them together there.
#
# - Rules come only from local directories of that checkout. No registry name
#   (p/..., r/..., auto) is used, so nothing is fetched from semgrep.dev and
#   metrics stay off. A missing checkout, a commit mismatch or a missing or
#   empty rule directory fails the job.
# - Semgrep and every dependency are installed from PyPI wheels pinned by
#   SHA-256 (pip --require-hashes --only-binary=:all:), for CPython 3.12 on
#   x86_64 Linux.
# - Findings fail the job (--error, exit 1), and so do scanner errors: any
#   other non-zero exit, warning-level errors (--strict), errors in the JSON
#   output, unparsable output, and results arriving with a zero exit.
# - The log shows the rule id, file and line of each finding and the type and
#   file of each error, never the matched code. Scanner stderr is captured and
#   only its line count is printed, because it can quote repository content.
#   Results and stderr stay in the job temp directory and are deleted when the
#   job ends; reproduce a scan error locally with the pinned versions.
# - Install steps run from the job temp directory with isolated interpreters
#   (python -I), and the scanner runs with PYTHONSAFEPATH=1, so no Python
#   module in the checkout is imported.
# - Semgrep's built-in ignore list applies while the repository has no
#   .semgrepignore (it skips test/, tests/, vendor/, build/, dist/ and similar).
#   Files over 1 MB are skipped (Semgrep's default --max-target-bytes).
# - The job has read-only contents permission, does not keep the checkout
#   token, references no secrets, and runs the scanner under `env -i`, so no
#   runner or fleet credential reaches it. It reads and writes nothing outside
#   the workspace and the job temp directory.
# - Suppressions (.semgrepignore, nosemgrep comments) are repository content
#   and are reviewed in the diff, like this workflow.
name: sast

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SEMGREP_VERSION: "1.183.0"
  SEMGREP_RULES_COMMIT: 16b9e6d45f10649f6a531ec4838ed9924372c3bc

jobs:
  semgrep:
    name: SAST (Semgrep CE)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - name: Install Semgrep (hash-pinned wheels)
        run: |
          set -euo pipefail
          # Run from the job temp directory with isolated interpreters (-I), so a
          # venv.py, pip.py or other module in the checkout is never imported.
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/semgrep-venv"
          rm -rf "$venv"
          python -I -m venv "$venv"
          requirements="$RUNNER_TEMP/semgrep-requirements.txt"
