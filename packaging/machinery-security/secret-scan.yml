# DRAFT for the private learn-ukrainian/machinery repository (issue #12682,
# machinery move contract v3 section 5). Install it there as
# .github/workflows/secret-scan.yml, next to the root .trufflehogignore drafted
# beside this file. It is not a check in the public repository.
#
# Blocking secret scan with TruffleHog CLI 3.99.0. Pins and their upstream
# evidence are recorded in pins.txt beside this file; bump them together there.
#
# - pull_request and merge_group scan the commits between base and head.
# - workflow_dispatch scans the full history of the dispatched ref: run it once
#   on the imported history before publication.
# - Unverified results are reported as well as verified and unknown ones
#   (claude-cto decision, 2026-11-03; the reason is in pins.txt).
# - Findings fail the job (exit 183), and so do scanner errors
#   (--fail-on-scan-errors), any other non-zero exit, unparsable output, and
#   results arriving with a zero exit.
# - The log shows the detector, file, line and commit of each finding, never
#   the secret. Scanner stderr is captured and only its line count and the
#   numeric scan summary are printed, because it can quote repository content.
#   Results and stderr stay in the job temp directory and are deleted when the
#   job ends; reproduce a scan error locally with the pinned version.
# - The runner needs no Docker. The CLI comes from the release tarball and is
#   checked against a pinned SHA-256 before it runs. The command line follows
#   the pinned upstream action script (pins.txt) without its Docker wrapper.
# - The job has read-only contents permission, does not keep the checkout
#   token, references no secrets, and runs the scanner under `env -i`, so no
#   runner or fleet credential reaches it. It reads and writes nothing outside
#   the workspace and the job temp directory.
# - Suppressions (.trufflehogignore, trufflehog:ignore comments) are repository
#   content and are reviewed in the diff, like this workflow.
name: secret-scan

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRUFFLEHOG_VERSION: "3.99.0"
  TRUFFLEHOG_LINUX_AMD64_SHA256: e35ae3fd1e4b7a0c1699d0fda1814282bf906d03379bd4337b092b3a84c6740b

jobs:
  trufflehog:
    name: Secret scan (TruffleHog)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/trufflehog"
          rm -rf "$tool"
          mkdir -p "$tool"
          tarball="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$tool/$tarball" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/$tarball"
          printf '%s  %s\n' "$TRUFFLEHOG_LINUX_AMD64_SHA256" "$tool/$tarball" | sha256sum --check --strict
          tar -xzf "$tool/$tarball" -C "$tool" trufflehog
          reported="$("$tool/trufflehog" --version 2>&1)"
          if [ "$reported" != "trufflehog ${TRUFFLEHOG_VERSION}" ]; then
            echo "::error::Expected trufflehog ${TRUFFLEHOG_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MQ_BASE"; head="$MQ_HEAD" ;;
            workflow_dispatch) base=""; head="$(git rev-parse HEAD)" ;;
            *) echo "::error::Unsupported event ${EVENT_NAME}"; exit 1 ;;
          esac
          for rev in $base $head; do
            if ! git cat-file -e "${rev}^{commit}"; then
              echo "::error::Commit ${rev} is not in the checkout; nothing was scanned"
              exit 1
            fi
          done
          if [ -n "$base" ] && [ "$base" = "$head" ]; then
            echo "::error::Base and head are the same commit; nothing would be scanned"
            exit 1
          fi

          work="$RUNNER_TEMP/secret-scan"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          findings="$work/findings.jsonl"
          args=(
            git "file://${GITHUB_WORKSPACE}"
            --branch "$head"
            --fail --no-update --json
            "--results=verified,unknown,unverified"
            --exclude-detectors=Lob
            --fail-on-scan-errors
            --exclude-paths="${GITHUB_WORKSPACE}/.trufflehogignore"
          )
          if [ -n "$base" ]; then
            args+=(--since-commit "$base")
          fi

          diagnostics="$work/stderr.log"
          # Scanner stderr can quote repository content (an ignore-file entry,
          # for example), so it goes to a file that is never printed. Only its
          # line count and the numeric fields of the final summary reach the log.
          set +e
          env -i PATH=/usr/bin:/bin HOME="$work/home" TMPDIR="$work/tmp" \
            "$RUNNER_TEMP/trufflehog/trufflehog" "${args[@]}" > "$findings" 2> "$diagnostics"
          rc=$?
          set -e
          echo "TruffleHog exited ${rc}; $(wc -l < "$diagnostics") stderr line(s) withheld from this log."
          jq -R -r 'fromjson? | select(type == "object" and .msg == "finished scanning")
            | [("chunks", "bytes", "verified_secrets", "unverified_secrets") as $k
               | "\($k)=\(.[$k] | if type == "number" then tostring else "?" end)"]
            | "Scan summary: " + join(" ")' "$diagnostics" 2> /dev/null || true

          # jq's own error text can quote the input, so it is discarded.
          if ! count="$(jq -s 'length' "$findings" 2> /dev/null)"; then
            echo "::error::TruffleHog output is not valid JSON (exit ${rc}); failing closed"
            exit 1
          fi
          if [ "$count" -gt 0 ]; then
            echo "::error::TruffleHog reported ${count} finding(s). Secret values are redacted from this log."
            # Location fields only, each a string, number or boolean; Raw, RawV2,
            # Redacted and ExtraData never reach the log.
            jq -r 'def s: if type == "string" or type == "number" or type == "boolean" then tostring else "?" end;
              .SourceMetadata.Data.Git as $git
              | "::error::TruffleHog \(.DetectorName | s) verified=\(.Verified | s)"
              + " \($git.file | s):\($git.line | s) commit=\($git.commit | s)"' \
              "$findings" 2> /dev/null || echo "::error::Finding locations could not be summarized"
          fi
          case "$rc" in
            0)
              if [ "$count" -ne 0 ]; then
                echo "::error::Findings were reported with exit 0; failing closed"
                exit 1
              fi
              echo "No secrets found."
              ;;
            183)
              exit 1
              ;;
            *)
              echo "::error::TruffleHog exited ${rc} (scan error); failing closed"
              exit 1
              ;;
          esac

      - name: Remove scan results
        if: always()
        run: rm -rf "$RUNNER_TEMP/secret-scan" "$RUNNER_TEMP/trufflehog"
