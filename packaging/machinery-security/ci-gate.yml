# DRAFT for the public learn-ukrainian/machinery repository (machinery move
# plan v1, section 4 steps 4 and 7). Install it there as
# .github/workflows/ci-gate.yml before final history clearance. It is not a
# check in this source repository.
#
# Bootstrap CI for the first push. Branch protection requires one check named
# "CI Gate", and the merge queue ruleset waits for that check on merge groups,
# so this workflow runs on pull_request and merge_group for main. Pins and their
# upstream evidence are recorded in pins.txt beside this file; bump them
# together there.
#
# - Jobs: Ruff over lu_machinery/ with the source repository's Ruff version and
#   lint settings (the extracted tree has no Ruff configuration yet); compileall
#   of lu_machinery on the pinned Python; actionlint (with a pinned ShellCheck) and zizmor (offline) over
#   .github/workflows/; the TruffleHog secret scan and the Semgrep SAST scan.
#   The secret-scan and sast jobs below are the only definition of each scan
#   for the machinery repository.
# - NOT in this bootstrap: importing lu_machinery and running its tests. Both
#   need the step 8 packaging. Step 8 adds those jobs to `needs` of CI Gate and
#   to the gate's expected job list in the same change.
# - Every job counts its targets first and fails on zero, because the tools
#   exit 0 on an empty or missing target. Each job prints what it inspected.
# - CI Gate needs every other job, runs even when one of them fails, and passes
#   only when every expected job reports `success`. A failed, cancelled or
#   skipped job, a missing result or an unexpected job fails it, because GitHub
#   counts a skipped required check as passing. There is no matrix, so each
#   check name is the job name. A new job must be added to both `needs` and the
#   gate's expected list; nothing else catches a job left out of both.
# - Hosted runners only (ubuntu-24.04). Every tool is downloaded at a pinned
#   version and checked against a pinned SHA-256 before it runs: release
#   tarballs for actionlint and ShellCheck, hash-pinned PyPI wheels
#   (pip --require-hashes --only-binary=:all:) for Ruff, zizmor and Semgrep.
#   Install steps run from the job temp directory with isolated interpreters
#   (python -I), so no Python module in the checkout is imported.
# - Read-only contents permission (none for CI Gate), no kept checkout token,
#   no secrets. Scanners and zizmor run under `env -i`, so no runner credential
#   reaches them. zizmor runs offline: its online audits (impostor commits,
#   known-vulnerable actions) need a token, and the action pins in pins.txt are
#   checked against their upstream tags instead.
# - Suppressions (.trufflehogignore, trufflehog:ignore, nosemgrep, noqa, Ruff
#   and zizmor configuration) are repository content and are reviewed in the
#   diff, like this workflow.
name: CI Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12.15"
  RUFF_VERSION: "0.15.21"
  ZIZMOR_VERSION: "1.31.1"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_LINUX_X86_64_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
  TRUFFLEHOG_VERSION: "3.99.0"
  TRUFFLEHOG_LINUX_AMD64_SHA256: e35ae3fd1e4b7a0c1699d0fda1814282bf906d03379bd4337b092b3a84c6740b
  SEMGREP_VERSION: "1.183.0"
  SEMGREP_RULES_COMMIT: 16b9e6d45f10649f6a531ec4838ed9924372c3bc

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Install Ruff (hash-pinned wheel)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/ruff-venv"
          rm -rf "$venv"
          python -I -m venv "$venv"
          requirements="$RUNNER_TEMP/ruff-requirements.txt"
          cat > "$requirements" <<'REQUIREMENTS'
          ruff==0.15.21 \
              --hash=sha256:bab0905d2f29e0d9fbc3c373ed23db0095edaa3f71f1f4f519ec15134d9e85c8
          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          reported="$("$venv/bin/ruff" --version)"
          if [ "$reported" != "ruff ${RUFF_VERSION}" ]; then
            echo "::error::Expected ruff ${RUFF_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Ruff check lu_machinery/
        run: |
          set -euo pipefail
          ruff="$RUNNER_TEMP/ruff-venv/bin/ruff"
          if [ ! -d lu_machinery ]; then
            echo "::error::lu_machinery/ is missing; nothing would be checked"
            exit 1
          fi
          # Bootstrap lint settings: the source repository's pyproject.toml
          # [tool.ruff] table with scripts/ renamed to lu_machinery/. A config
          # file passed with --config applies to every file, its relative paths
          # resolve from the working directory, and any repository config is
          # ignored. Step 8 moves these settings into the machinery
          # pyproject.toml and drops this file and the --config flag.
          config="$RUNNER_TEMP/ruff-bootstrap.toml"
          cat > "$config" <<'TOML'
          line-length = 120
          target-version = "py312"
          src = [".", "lu_machinery"]
          exclude = [".venv/", "node_modules/", "starlight/", "lu_machinery/oneoff/"]

          [lint]
          select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF", "PLC0415"]
          ignore = ["RUF001", "RUF002", "RUF003", "E402", "E501", "E741"]

          [lint.per-file-ignores]
          "!lu_machinery/{api,project_api}/**.py" = ["PLC0415"]
          "lu_machinery/api/*.py" = ["B008"]
          "lu_machinery/project_api/*.py" = ["B008"]
          TOML
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          # The files Ruff itself selects, after the configured exclusions.
          inspected="$("$ruff" check --no-cache --config "$config" --show-files lu_machinery | grep -c . || true)"
          echo "Ruff inspects ${inspected} file(s); lu_machinery/ holds ${python_files} Python file(s)."
          if [ "$python_files" -eq 0 ] || [ "$inspected" -eq 0 ]; then
            echo "::error::Ruff would inspect no Python files in lu_machinery/"
            exit 1
          fi
          "$ruff" check --no-cache --config "$config" --output-format=github lu_machinery

  compileall:
    name: Compile (Python 3.12.15)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Compile lu_machinery
        run: |
          set -euo pipefail
          reported="$(python -I -c 'import platform; print(platform.python_version())')"
          if [ "$reported" != "$PYTHON_VERSION" ]; then
            echo "::error::Expected Python ${PYTHON_VERSION}, got: ${reported}"
            exit 1
          fi
          if [ ! -d lu_machinery ]; then
            echo "::error::lu_machinery/ is missing; nothing would be compiled"
            exit 1
          fi
          # compileall -q exits 0 on a missing or empty directory, so count first.
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          if [ "$python_files" -eq 0 ]; then
            echo "::error::lu_machinery/ holds no Python files; nothing would be compiled"
            exit 1
          fi
          # Bytecode goes to the job temp directory, not the checkout, and its
          # count proves compileall reached every file. The prefix mirrors each
          # source's absolute directory and also receives the interpreter's own
          # stdlib bytecode, so only the mirror of lu_machinery/ is counted.
          prefix="$RUNNER_TEMP/pycache"
          rm -rf "$prefix"
          python -I -X pycache_prefix="$prefix" -m compileall -q lu_machinery
          mirror="${prefix}${PWD}/lu_machinery"
          if [ ! -d "$mirror" ]; then
            echo "::error::compileall wrote no bytecode for lu_machinery/"
            exit 1
          fi
          compiled="$(find "$mirror" -type f -name '*.pyc' | wc -l)"
          echo "Compiled ${compiled} of ${python_files} Python file(s) with Python ${reported}."
          if [ "$compiled" -ne "$python_files" ]; then
            echo "::error::compileall produced ${compiled} bytecode file(s) for ${python_files} source file(s)"
            exit 1
          fi

      - name: Remove bytecode
        if: always()
        run: rm -rf "$RUNNER_TEMP/pycache"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and ShellCheck (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/actionlint"
          rm -rf "$tool"
          mkdir -p "$tool"
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --retry 3 --output "$1" "$2"
          }
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          fetch "$tool/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$tool/$tarball" | sha256sum --check --strict
          tar -xzf "$tool/$tarball" -C "$tool" actionlint
          sc_tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          fetch "$tool/$sc_tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$sc_tarball"
          printf '%s  %s\n' "$SHELLCHECK_LINUX_X86_64_SHA256" "$tool/$sc_tarball" | sha256sum --check --strict
          tar -xzf "$tool/$sc_tarball" -C "$tool" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          reported="$("$tool/actionlint" -version | head -n 1)"
          if [ "$reported" != "$ACTIONLINT_VERSION" ]; then
            echo "::error::Expected actionlint ${ACTIONLINT_VERSION}, got: ${reported}"
            exit 1
          fi
          reported="$("$tool/shellcheck" --version | sed -n 's/^version: //p')"
          if [ "$reported" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::Expected shellcheck ${SHELLCHECK_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: actionlint .github/workflows/
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/actionlint"
          if [ ! -d .github/workflows ]; then
            echo "::error::.github/workflows/ is missing; nothing would be linted"
            exit 1
          fi
          mapfile -t files < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) | LC_ALL=C sort)
          echo "actionlint inspects ${#files[@]} workflow file(s)."
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::.github/workflows/ holds no workflow files"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          # The pinned ShellCheck lints every run: script; pyflakes is disabled
          # so the result never depends on what the runner image ships.
          "$tool/actionlint" -shellcheck="$tool/shellcheck" -pyflakes= "${files[@]}"

      - name: Remove tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/actionlint"

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Install zizmor (hash-pinned wheel)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          venv="$RUNNER_TEMP/zizmor-venv"
          rm -rf "$venv"
          python -I -m venv "$venv"
          requirements="$RUNNER_TEMP/zizmor-requirements.txt"
          cat > "$requirements" <<'REQUIREMENTS'
          zizmor==1.31.1 \
              --hash=sha256:58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          reported="$("$venv/bin/zizmor" --version)"
          if [ "$reported" != "zizmor ${ZIZMOR_VERSION}" ]; then
            echo "::error::Expected zizmor ${ZIZMOR_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: zizmor .github/workflows/
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/zizmor-venv"
          if [ ! -d .github/workflows ]; then
            echo "::error::.github/workflows/ is missing; nothing would be audited"
            exit 1
          fi
          mapfile -t files < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) | LC_ALL=C sort)
          echo "zizmor audits ${#files[@]} workflow file(s) offline."
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::.github/workflows/ holds no workflow files"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          work="$RUNNER_TEMP/zizmor"
          rm -rf "$work"
          mkdir -p "$work/home"
          # Any finding (exit 10 and above) or tool error fails the job.
          env -i PATH=/usr/bin:/bin HOME="$work/home" \
            "$venv/bin/zizmor" --offline --no-progress --format=github "${files[@]}"

      - name: Remove tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/zizmor" "$RUNNER_TEMP/zizmor-venv" "$RUNNER_TEMP/zizmor-requirements.txt"

  # Blocking secret scan with the pinned TruffleHog CLI (pins.txt).
  # - pull_request and merge_group scan the commits between base and head;
  #   workflow_dispatch scans the full history of the dispatched ref.
  # - Verified, unknown and unverified results are reported (pins.txt records
  #   why). Findings fail the job (exit 183), and so do scanner errors
  #   (--fail-on-scan-errors), any other non-zero exit, unparsable output and
  #   results arriving with a zero exit.
  # - The CLI is the checksum-verified release binary, not a container, run
  #   with the command line of the pinned upstream action script (pins.txt).
  # - The job also fails when the range holds no commit, or when the root
  #   .trufflehogignore is missing or leaves no Python or workflow file in scope.
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # For the exclusion coverage check only; the scanner is a Go binary.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Install TruffleHog (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/trufflehog"
          rm -rf "$tool"
          mkdir -p "$tool"
          tarball="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$tool/$tarball" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/$tarball"
          printf '%s  %s\n' "$TRUFFLEHOG_LINUX_AMD64_SHA256" "$tool/$tarball" | sha256sum --check --strict
          tar -xzf "$tool/$tarball" -C "$tool" trufflehog
          reported="$("$tool/trufflehog" --version 2>&1)"
          if [ "$reported" != "trufflehog ${TRUFFLEHOG_VERSION}" ]; then
            echo "::error::Expected trufflehog ${TRUFFLEHOG_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MQ_BASE"; head="$MQ_HEAD" ;;
            workflow_dispatch) base=""; head="$(git rev-parse HEAD)" ;;
            *) echo "::error::Unsupported event ${EVENT_NAME}"; exit 1 ;;
          esac
          for rev in $base $head; do
            if ! git cat-file -e "${rev}^{commit}"; then
              echo "::error::Commit ${rev} is not in the checkout; nothing was scanned"
              exit 1
            fi
          done
          if [ -n "$base" ] && [ "$base" = "$head" ]; then
            echo "::error::Base and head are the same commit; nothing would be scanned"
            exit 1
          fi
          if [ -n "$base" ]; then
            commits="$(git rev-list --count "${base}..${head}")"
          else
            commits="$(git rev-list --count "$head")"
          fi
          echo "Scanning ${commits} commit(s) up to ${head}."
          if [ "$commits" -eq 0 ]; then
            echo "::error::No commits between base and head; nothing would be scanned"
            exit 1
          fi

          work="$RUNNER_TEMP/secret-scan"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          findings="$work/findings.jsonl"

          # Exclusion coverage. TruffleHog reports no per-file coverage, so the
          # exclusions are applied here to the head tree the way TruffleHog
          # 3.99.0 applies them (pkg/common/filter.go and pkg/sources/git/git.go:
          # comment and blank lines are skipped, every other line is a regular
          # expression searched in the repository-relative path, and a match
          # skips the file). The job fails unless Python and workflow files
          # remain in scope. Patterns are limited to a syntax subset that
          # Python's re (ASCII mode) and Go's regexp read the same way; any
          # other pattern fails the job. Only counts and line numbers are
          # printed. Files changed in the scanned range are counted for the
          # log only: a pull request that changes only documentation, or only
          # deletes files, is still scanned and can pass.
          ignore="${GITHUB_WORKSPACE}/.trufflehogignore"
          if [ ! -f "$ignore" ]; then
            echo "::error::.trufflehogignore is missing at the repository root; the scan cannot run"
            exit 1
          fi
          git ls-tree -r -z --name-only "$head" > "$work/head-paths"
          if [ -n "$base" ]; then
            git diff -z --name-only --no-renames --diff-filter=d "$base" "$head" > "$work/range-paths"
          else
            : > "$work/range-paths"
          fi
          python -I - "$ignore" "$work/head-paths" "$work/range-paths" "${base:+range}" <<'PY'
          import re
          import sys

          # Escapes both engines read alike; groups with flags, POSIX classes,
          # {,n} (a quantifier in Python, a literal in Go), \s and \S (Python's
          # ASCII \s also matches \v, Go's does not) and non-ASCII text are
          # refused.
          ESCAPES = set(".^$*+?()[]{}|\\/-dDwW")
          # Go's \s is [\t\n\f\r ]; Go's line scanner drops one trailing \r.
          SKIP = re.compile(r"[\t\n\f\r ]*(#|$)")

          def supported(line):
              if any(not " " <= c <= "~" for c in line) or "(?" in line or "[:" in line or "{," in line:
                  return False
              i = 0
              while i < len(line):
                  if line[i] == "\\":
                      if i + 1 == len(line) or line[i + 1] not in ESCAPES:
                          return False
                      i += 2
                  else:
                      i += 1
              return True

          rules = []
          with open(sys.argv[1], encoding="utf-8") as stream:
              lines = stream.read().split("\n")
          for number, line in enumerate(lines, 1):
              line = line.removesuffix("\r")
              if SKIP.match(line):
                  continue
              rule = None
              if supported(line):
                  try:
                      rule = re.compile(line, re.ASCII)
                  except re.error:
                      rule = None
              if rule is None:
                  print(f"::error::.trufflehogignore line {number} uses regular expression syntax this check does not support")
                  sys.exit(1)
              rules.append(rule)

          def paths(name):
              with open(name, "rb") as stream:
                  return [p.decode("utf-8", "surrogateescape") for p in stream.read().split(b"\0") if p]

          def kept(items):
              return [p for p in items if not any(rule.search(p) for rule in rules)]

          tree = paths(sys.argv[2])
          python = [p for p in tree if p.endswith(".py")]
          workflows = [p for p in tree if re.fullmatch(r"\.github/workflows/[^/]+\.ya?ml", p)]
          kept_python, kept_workflows = kept(python), kept(workflows)
          print(f"Exclusions: {len(rules)} pattern(s). In scope at head: {len(kept_python)} of"
                f" {len(python)} Python file(s), {len(kept_workflows)} of {len(workflows)} workflow file(s).")
          if sys.argv[4]:
              changed = paths(sys.argv[3])
              print(f"Files added or modified in the range: {len(kept(changed))} of {len(changed)} in scope.")
          if not kept_python or not kept_workflows:
              print("::error::The exclusions leave no Python or no workflow files in scope; failing closed")
              sys.exit(1)
          PY
          args=(
            git "file://${GITHUB_WORKSPACE}"
            --branch "$head"
            --fail --no-update --json
            "--results=verified,unknown,unverified"
            --exclude-detectors=Lob
            --fail-on-scan-errors
            --exclude-paths="${GITHUB_WORKSPACE}/.trufflehogignore"
          )
          if [ -n "$base" ]; then
            args+=(--since-commit "$base")
          fi

          diagnostics="$work/stderr.log"
          # Scanner stderr can quote repository content (an ignore-file entry,
          # for example), so it goes to a file that is never printed. Only its
          # line count and the numeric fields of the final summary reach the log.
          set +e
          env -i PATH=/usr/bin:/bin HOME="$work/home" TMPDIR="$work/tmp" \
            "$RUNNER_TEMP/trufflehog/trufflehog" "${args[@]}" > "$findings" 2> "$diagnostics"
          rc=$?
          set -e
          echo "TruffleHog exited ${rc}; $(wc -l < "$diagnostics") stderr line(s) withheld from this log."
          jq -R -r 'fromjson? | select(type == "object" and .msg == "finished scanning")
            | [("chunks", "bytes", "verified_secrets", "unverified_secrets") as $k
               | "\($k)=\(.[$k] | if type == "number" then tostring else "?" end)"]
            | "Scan summary: " + join(" ")' "$diagnostics" 2> /dev/null || true

          # jq's own error text can quote the input, so it is discarded.
          if ! count="$(jq -s 'length' "$findings" 2> /dev/null)"; then
            echo "::error::TruffleHog output is not valid JSON (exit ${rc}); failing closed"
            exit 1
          fi
          if [ "$count" -gt 0 ]; then
            echo "::error::TruffleHog reported ${count} finding(s). Secret values are redacted from this log."
            # Location fields only, each a string, number or boolean; Raw, RawV2,
            # Redacted and ExtraData never reach the log.
            jq -r 'def s: if type == "string" or type == "number" or type == "boolean" then tostring else "?" end;
              .SourceMetadata.Data.Git as $git
              | "::error::TruffleHog \(.DetectorName | s) verified=\(.Verified | s)"
              + " \($git.file | s):\($git.line | s) commit=\($git.commit | s)"' \
              "$findings" 2> /dev/null || echo "::error::Finding locations could not be summarized"
          fi
          case "$rc" in
            0)
              if [ "$count" -ne 0 ]; then
                echo "::error::Findings were reported with exit 0; failing closed"
                exit 1
              fi
              echo "No secrets found."
              ;;
            183)
              exit 1
              ;;
            *)
              echo "::error::TruffleHog exited ${rc} (scan error); failing closed"
              exit 1
              ;;
          esac

      - name: Remove scan results
        if: always()
        run: rm -rf "$RUNNER_TEMP/secret-scan" "$RUNNER_TEMP/trufflehog"

  # Blocking SAST with the pinned Semgrep CE and the semgrep/semgrep-rules
  # checkout at the pinned commit (pins.txt).
  # - Rules come only from local directories of that checkout. No registry name
  #   (p/..., r/..., auto) is used, so nothing is fetched from semgrep.dev and
  #   metrics stay off. A missing checkout, a commit mismatch or a missing or
  #   empty rule directory fails the job.
  # - Findings fail the job (--error, exit 1), and so do scanner errors: any
  #   other non-zero exit, warning-level errors (--strict), errors in the JSON
  #   output, unparsable output, results arriving with a zero exit, and a scan
  #   that covered no Python file.
  # - Exclusions: Semgrep's built-in ignore list applies while the repository
  #   has no .semgrepignore (it skips test/, tests/, vendor/, build/, dist/ and
  #   similar), and files over 1 MB are skipped (Semgrep's default
  #   --max-target-bytes). prepublication-gate.sh allows exactly these two skip
  #   reasons and refuses a .semgrepignore anywhere in the history.
  # - The scanner runs with PYTHONSAFEPATH=1, so no Python module in the
  #   checkout is imported. Suppressions (.semgrepignore, nosemgrep comments)
  #   are repository content and are reviewed in the diff, like this workflow.
  sast:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"

      - name: Install Semgrep (hash-pinned wheels)
