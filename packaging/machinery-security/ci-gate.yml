          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          mkdir -p "$venv/home"
          reported="$(env -i PATH="$venv/bin:/usr/bin:/bin" HOME="$venv/home" PYTHONSAFEPATH=1 \
            "$venv/bin/semgrep" --version)"
          if [ "$reported" != "$SEMGREP_VERSION" ]; then
            echo "::error::Expected semgrep ${SEMGREP_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Fetch semgrep-rules at the pinned commit
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/semgrep-rules"
          rm -rf "$rules"
          git init --quiet "$rules"
          git -C "$rules" fetch --quiet --depth 1 --no-tags \
            https://github.com/semgrep/semgrep-rules.git "$SEMGREP_RULES_COMMIT"
          git -C "$rules" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          checked_out="$(git -C "$rules" rev-parse HEAD)"
          if [ "$checked_out" != "$SEMGREP_RULES_COMMIT" ]; then
            echo "::error::semgrep-rules is at ${checked_out}, expected ${SEMGREP_RULES_COMMIT}"
            exit 1
          fi

      - name: Scan with Semgrep
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/semgrep-rules"
          venv="$RUNNER_TEMP/semgrep-venv"
          configs=(
            python/lang
            python/correctness
            python/jinja2
            python/jwt
            python/requests
            python/sh
            generic/secrets
            bash/lang
            yaml/github-actions
            yaml/kubernetes
          )
          args=()
          for config in "${configs[@]}"; do
            dir="$rules/$config"
            if [ ! -d "$dir" ] || [ -z "$(find "$dir" -name '*.yaml' -print -quit)" ]; then
              echo "::error::Rule config ${config} is missing from the semgrep-rules checkout"
              exit 1
            fi
            args+=(--config "$dir")
          done

          work="$RUNNER_TEMP/sast"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          results="$work/results.json"
          diagnostics="$work/stderr.log"
          # Scanner stderr can quote repository content, so it goes to a file
          # that is never printed; only its line count reaches the log.
          set +e
          env -i PATH="$venv/bin:/usr/bin:/bin" HOME="$work/home" TMPDIR="$work/tmp" \
            PYTHONSAFEPATH=1 SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$venv/bin/semgrep" scan "${args[@]}" \
            --metrics=off --disable-version-check --strict --error \
            --json --output "$results" --quiet . 2> "$diagnostics"
          rc=$?
          set -e
          echo "Semgrep exited ${rc}; $(wc -l < "$diagnostics") stderr line(s) withheld from this log."

          # Exactly one JSON object with results and errors arrays and a list of
          # scanned paths; anything else (missing file, other JSON, several
          # values) fails. jq's own error text can quote the input, so it is
          # discarded.
          if ! jq -s -e 'length == 1 and (.[0] | type == "object"
                and (.results | type) == "array" and (.errors | type) == "array"
                and (.paths.scanned | type) == "array")' \
                "$results" > /dev/null 2>&1; then
            echo "::error::Semgrep output is missing or malformed (exit ${rc}); failing closed"
            exit 1
          fi
          scanned="$(jq '.paths.scanned | length' "$results")"
          scanned_python="$(jq '[.paths.scanned[] | select(type == "string" and endswith(".py"))] | length' "$results")"
          echo "Semgrep scanned ${scanned} file(s), ${scanned_python} of them Python."
          if [ "$scanned" -eq 0 ] || [ "$scanned_python" -eq 0 ]; then
            echo "::error::Semgrep scanned no Python files; failing closed"
            exit 1
          fi
          findings="$(jq '.results | length' "$results")"
          errors="$(jq '.errors | length' "$results")"
          if [ "$findings" -gt 0 ]; then
            echo "::error::Semgrep reported ${findings} finding(s). Matched code is redacted from this log."
            # Rule id and location only; extra.lines (the matched code) never reaches the log.
            # Every printed field must be a string or a number; anything else prints "?".
            jq -r 'def s: if type == "string" or type == "number" then tostring else "?" end;
              .results[]
              | "::error file=\(.path | s),line=\(.start.line | s)::Semgrep \(.check_id | s)"
              + " at \(.path | s):\(.start.line | s)"' \
              "$results" 2> /dev/null || echo "::error::Finding locations could not be summarized"
          fi
          if [ "$errors" -gt 0 ]; then
            echo "::error::Semgrep reported ${errors} scan error(s)."
            # Type, level and path only; error messages can quote target code.
            jq -r 'def s: if type == "string" or type == "number" then tostring else "?" end;
              .errors[]
              | "::error::Semgrep error level=\(.level | s)"
              + " type=\(.type | if type == "array" then .[0] else . end | s)"
              + " path=\(.path // .spans[0].file | s)"' \
              "$results" 2> /dev/null || echo "::error::Scan errors could not be summarized"
          fi
          if [ "$rc" -eq 0 ] && [ "$findings" -eq 0 ] && [ "$errors" -eq 0 ]; then
            echo "No findings."
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::error::Semgrep exited 0 but reported findings or errors; failing closed"
          elif [ "$rc" -ne 1 ]; then
            echo "::error::Semgrep exited ${rc} (scan error); failing closed"
          fi
          exit 1

      - name: Remove scan results
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/sast" "$RUNNER_TEMP/semgrep-rules"
          "$RUNNER_TEMP/semgrep-venv" "$RUNNER_TEMP/semgrep-requirements.txt"

  ci-gate:
    name: CI Gate
    # always(): a job skipped because a dependency failed would otherwise count
    # as a passing required check.
    if: always()
    needs: [ruff, compileall, actionlint, zizmor, secret-scan, sast]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Keep this list equal to `needs` above.
          expected=(actionlint compileall ruff sast secret-scan zizmor)
          if ! actual="$(jq -r 'if type == "object" then keys[] else error("not an object") end' \
                <<< "$NEEDS_JSON" 2> /dev/null)"; then
            echo "::error::Job results are not a JSON object; failing closed"
            exit 1
          fi
          failed=0
          for job in "${expected[@]}"; do
            result="$(jq -r --arg job "$job" \
              '.[$job].result // "missing" | if type == "string" then . else "invalid" end' \
              <<< "$NEEDS_JSON")"
            echo "${job}: ${result}"
            if [ "$result" != "success" ]; then
              echo "::error::Required job ${job} finished with result ${result}"
              failed=1
            fi
          done
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            if ! printf '%s\n' "${expected[@]}" | grep -qxF -- "$job"; then
              echo "::error::Unexpected job ${job} in the gate's dependencies"
              failed=1
            fi
          done <<< "$actual"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "CI Gate green: ${#expected[@]} of ${#expected[@]} jobs succeeded."
