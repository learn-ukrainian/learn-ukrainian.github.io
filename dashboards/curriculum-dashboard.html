<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curriculum Dashboard - ukraine-ops</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
  --green: #3fb950; --blue: #58a6ff; --red: #f85149; --yellow: #d29922;
  --gray: #484f58; --purple: #bc8cff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

.topbar { display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 18px; font-weight: 600; }
.topbar .monitor-nav { margin-left: auto; display: flex; gap: 12px; font-size: 13px; }
.topbar .monitor-nav a { color: var(--text2); }
.refresh-indicator { font-size: 11px; color: var(--text3); }

.main { display: grid; grid-template-columns: minmax(0,1fr) 400px; height: calc(100vh - 49px); }
@media (max-width: 1000px) { .main { grid-template-columns: 1fr; } }

.left-panel { overflow-x:auto; overflow-y: auto; padding: 16px 24px; }
.right-panel { border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; background: var(--bg2); }

/* Treemap */
.treemap { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
.treemap-cell { border-radius: 6px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; min-height: 60px; transition: transform 0.1s; }
.treemap-cell:hover { transform: scale(1.02); z-index: 1; }
.treemap-cell .name { font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.treemap-cell .count { font-size: 11px; opacity: 0.8; }
.treemap-cell.selected { outline: 2px solid var(--blue); outline-offset: -2px; }

/* Module table */
.module-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.module-table th { text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--border); color: var(--text2); font-size: 11px; text-transform: uppercase; position: sticky; top: 0; background: var(--bg); }
.module-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
.module-table tr { cursor: pointer; }
.module-table tr:hover { background: var(--bg2); }
.module-table .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.module-table .status-dot.pass { background: var(--green); }
.module-table .status-dot.content-complete { background: var(--blue); }
.module-table .status-dot.fail { background: var(--red); }
.module-table .status-dot.unaudited { background: var(--yellow); }
.module-table .status-dot.missing { background: var(--gray); }
.module-table .word-mini { display: inline-block; height: 4px; border-radius: 2px; background: var(--green); min-width: 2px; }
.module-table .rq-score { font-size: 11px; font-weight: 600; }
.module-table .rq-score.exemplary { color: var(--green); }
.module-table .rq-score.solid { color: var(--blue); }
.module-table .rq-score.adequate { color: var(--yellow); }
.module-table .rq-score.thin { color: #f0883e; }
.module-table .rq-score.stub { color: var(--red); }
.module-table .rq-coverage { color: var(--text3); font-size: 11px; }
.module-table .ver-label { font-size: 10px; font-weight: 600; padding: 1px 4px; border-radius: 3px; }
.module-table .ver-current { background: rgba(63,185,80,0.15); color: var(--green); }
.module-table .ver-backlog { background: rgba(210,153,34,0.15); color: var(--yellow); }
.module-table .ver-pending { background: rgba(72,79,88,0.2); color: var(--text3); }

/* Unbuilt modules */
.obsolete { opacity: 0.4; }

/* Dimension bar */
.dim-bar { display: flex; gap: 2px; align-items: center; margin: 2px 0; }
.dim-bar .dim-label { font-size: 11px; color: var(--text2); width: 28px; text-align: right; }
.dim-bar .dim-fill { height: 6px; border-radius: 3px; }
.dim-bar .dim-fill.filled { background: var(--green); }
.dim-bar .dim-fill.empty { background: var(--bg3); }
.dim-bar .dim-val { font-size: 10px; color: var(--text3); margin-left: 4px; }
.refresh-banner { background: rgba(210,153,34,0.15); border: 1px solid var(--yellow); border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-size: 12px; color: var(--yellow); }
.gap-list { list-style: none; padding: 0; margin-top: 4px; }
.gap-list li { font-size: 11px; color: var(--text2); padding: 1px 0; }
.gap-list li::before { content: '\2022'; color: var(--red); margin-right: 6px; }

/* Detail panel */
.detail-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.detail-card h3 { font-size: 15px; margin-bottom: 8px; }
.detail-card .meta-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
.detail-card .meta-row .label { color: var(--text2); }
.detail-card .section-list { list-style: none; padding: 0; }
.detail-card .section-list li { padding: 2px 0; font-size: 12px; color: var(--text2); }
.detail-card .section-list li::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--blue); border-radius: 50%; margin-right: 6px; }
.obj-list { list-style: none; padding: 0; }
.obj-list li { padding: 2px 0; font-size: 12px; }
.obj-list li::before { content: ''; display: inline-block; width: 4px; height: 4px; background: var(--green); border-radius: 50%; margin-right: 6px; }

.empty { color: var(--text3); font-size: 13px; padding: 24px; text-align: center; }
.loading { text-align: center; padding: 40px; color: var(--text2); }
.loading .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.track-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.track-stats { display: flex; flex-wrap:wrap; gap: 12px; font-size: 12px; color: var(--text2); margin-bottom: 12px; }

.reader-status { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 0; font-size:12px; color:var(--text2); overflow-wrap:anywhere; }
.reader-status button { color:var(--text); background:var(--bg3); border:1px solid var(--border); border-radius:4px; padding:5px 10px; cursor:pointer; }
:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
button { font:inherit; }
td, .meta-row, .module-cell, .issue-card { overflow-wrap:anywhere; }
.container, .left-panel, .right-panel { min-width:0; }
.container { overflow-x:auto; }
.topbar { flex-wrap:wrap; }
.skip-link { position:absolute; top:-100px; left:8px; z-index:100; background:var(--bg); padding:10px; }
.skip-link:focus { top:8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
<link rel="stylesheet" href="/monitor.css">
</head>
<body>
<a class="skip-link" href="#reader-main">Skip to content</a>

<div class="topbar">
  <h1>Curriculum Dashboard</h1>
  <div class="spacer"></div>
  <span class="refresh-indicator" id="refresh-info"></span>
  <nav class="monitor-nav" aria-label="Ops API sections">
    <a href="/">Home</a>
    <a href="/orient.html">Orient</a>
    <a href="/fleet.html">Fleet</a>
    <a href="/work.html">Work</a>
    <a href="/artifacts/">Artifacts</a>
    <a href="/runtime.html">Runtime</a>
    <a href="/docs">API</a>
  </nav>
</div>
<nav class="ops-nav" aria-label="Operations pages">
  <a href="/progress.html">Progress</a>
  <a href="/quality.html">Quality</a>
</nav>

<div class="main" id="reader-main" role="main" tabindex="-1">
  <div class="left-panel" id="left-panel">
    <div id="overview-content">Loading overview…</div>
    <div id="track-detail">Select a track to inspect modules</div>
  </div>
  <div class="right-panel" id="right-panel">
    <div class="empty">Select a module to see details</div>
  </div>
</div>

<script>

const readerStates = new Map();
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function object(value) { return value !== null && typeof value === 'object' && !Array.isArray(value); }
function numeric(value) { return typeof value === 'number' && Number.isFinite(value) && value >= 0; }
function count(value) { return numeric(value) ? String(value) : 'unknown'; }
function identity(row, key) { return object(row) && typeof row[key] === 'string' && row[key].length > 0; }
function collection(data, key, valid) {
  if (!object(data) || !Array.isArray(data[key])) throw Error('Malformed success: invalid ' + key);
  const rows = data[key].filter(valid);
  if (data[key].length && !rows.length) throw Error('Malformed success: invalid ' + key + ' rows');
  return {...data, [key]: rows, _empty: rows.length === 0, _partial: rows.length !== data[key].length || data.partial === true};
}
async function fetchJson(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    // Legacy callers may request fresh=true; readers use the existing bounded cache.
    const target = new URL(url, location.origin);
    target.searchParams.delete('fresh');
    const res = await fetch(target.pathname + target.search, {signal: controller.signal});
    if (!res.ok) throw Error('Request failed: HTTP ' + res.status);
    let data;
    try { data = await res.json(); } catch { throw Error('Parse failure: invalid JSON'); }
    if (data === null || typeof data !== 'object') throw Error('Malformed success: expected JSON object or array');
    return data;
  } catch (error) {
    if (error.name === 'AbortError') throw Error('Request timed out');
    throw error;
  } finally { clearTimeout(timeout); }
}
function validTime(value) {
  const time = typeof value === 'string' && value ? Date.parse(value) : NaN;
  return Number.isFinite(time) && time <= Date.now() ? time : null;
}
function readerClock(state) {
  const elapsed = Math.max(0, (Date.now() - state.fetchedAt) / 1000);
  const meta = state.data?.meta;
  const generated = validTime(meta?.generated_at || state.data?.generated_at);
  const cacheAge = numeric(meta?.age_s) ? ` · Cache age ${Math.floor(meta.age_s + elapsed)}s` : '';
  const stale = meta?.stale === true || (numeric(meta?.age_s) && numeric(meta?.stale_after_s) && meta.stale_after_s > 0 && meta.age_s + elapsed > meta.stale_after_s) ? ' · Stale snapshot cache' : '';
  const fetched = state.data?._partial || meta?.error ? 'Last partial fetch' : 'Last successful fetch';
  const snapshot = generated === null ? '' : ` · Snapshot generated ${new Date(generated).toLocaleString()} (${Math.floor((Date.now()-generated)/1000)}s ago)`;
  return `Source age unknown${snapshot}${cacheAge}${stale} · ${fetched} ${new Date(state.fetchedAt).toLocaleString()}`;
}
function invalidateReader(id) {
  const state = readerStates.get(id);
  if (state) { state.generation++; state.scope = null; state.pending = null; }
}
function runReader(id, url, validate, render) {
  const panel = document.getElementById(id);
  let state = readerStates.get(id);
  if (state?.pending && state.scope === url && state.panel === panel) return state.pending;
  if (!state || state.panel !== panel) {
    state = {generation: 0, panel}; readerStates.set(id, state);
  }
  if (state.scope !== url) { state.data = null; state.fetchedAt = null; }
  state.scope = url;
  const generation = ++state.generation;
  let status = document.getElementById(id + '-reader-status');
  if (!status) {
    status = document.createElement('div'); status.id = id + '-reader-status'; status.className = 'reader-status';
    const label = document.createElement('span'); label.setAttribute('role', 'status');
    const clock = document.createElement('span'); clock.className = 'reader-clock';
    const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Retry';
    retry.setAttribute('aria-label', 'Retry ' + id.replaceAll('-', ' '));
    status.append(label, clock, retry); panel.before(status);
  }
  const [label, clock, retry] = status.children;
  retry.onclick = () => runReader(id, url, validate, render);
  label.textContent = 'Loading';
  clock.textContent = state.fetchedAt ? readerClock(state) : 'Source age unknown · No successful fetch';
  panel.setAttribute('aria-busy', 'true');
  if (!state.data) panel.textContent = 'Loading…';
  const current = () => state.generation === generation && document.getElementById(id) === panel;
  state.pending = (async () => {
    try {
      const data = validate(await fetchJson(url));
      if (!current()) return;
      const active = panel.contains(document.activeElement) ? document.activeElement.dataset.readerKey : null;
      render(data, panel);
      if (active != null) [...panel.querySelectorAll('[data-reader-key]')].find(el => el.dataset.readerKey === active)?.focus({preventScroll:true});
      state.data = data; state.fetchedAt = Date.now();
      const meta = data.meta || {};
      label.textContent = [data._partial ? 'Partial · incomplete coverage' : data._empty ? 'Empty · no rows returned' : 'Loaded', meta.error ? 'Source unavailable' : '', meta.stale === true || data.stale === true ? 'Stale · retained source snapshot' : '', 'Source age/coverage unknown'].filter(Boolean).join(' · ');
      clock.textContent = readerClock(state);
      return data;
    } catch (error) {
      if (!current()) return;
      label.textContent = error.message + (state.data ? ' · Historical values retained' : ' · No data');
      if (!state.data) panel.textContent = 'Unable to load this section. Use Retry.';
    } finally {
      if (current()) { panel.setAttribute('aria-busy', 'false'); state.pending = null; }
    }
  })();
  return state.pending;
}
setInterval(() => {
  for (const [id, state] of readerStates) {
    const clock = document.getElementById(id + '-reader-status')?.querySelector('.reader-clock');
    if (clock && state.fetchedAt) clock.textContent = readerClock(state);
  }
}, 10000);

const API = '/api/dashboard';
let overviewData = null;
let selectedTrack = null;
let selectedModule = null;
function pctColor(pct) {
  if (!numeric(pct)) return 'var(--bg3)';
  return pct >= 80 ? 'rgba(63,185,80,0.5)' : pct >= 50 ? 'rgba(210,153,34,0.5)' : 'rgba(248,81,73,0.3)';
}
function pipelineLabel(version) {
  return version === 'v6' ? 'current' : ['v5','v3'].includes(version) ? 'legacy' : !version || version === 'unbuilt' ? 'pending' : 'unknown';
}
function pipelineClass(version) { return pipelineLabel(version) === 'current' ? 'ver-current' : 'ver-pending'; }
function needsBuildRefresh(module) { return typeof module.needs_rebuild === 'boolean' ? module.needs_rebuild : pipelineLabel(module.pipeline_version) !== 'current'; }
function operationalTracks(tracks) { return tracks.filter(t => t.module_source !== 'plans-fallback'); }
function clearDetail() {
  selectedModule = null; invalidateReader('right-panel');
  document.getElementById('right-panel').textContent = 'Select a module to see details';
  document.getElementById('right-panel-reader-status')?.remove();
}
function fetchOverview() {
  return runReader('overview-content', `${API}/overview`, d => collection(d, 'tracks', t => identity(t, 'id') && numeric(t.module_count) && object(t.stats)), data => {
    overviewData = {...data, tracks: operationalTracks(data.tracks)};
    if (selectedTrack && !overviewData.tracks.some(t => t.id === selectedTrack) && !data._partial && !data.meta?.error) {
      selectedTrack = null; invalidateReader('track-detail'); clearDetail();
      document.getElementById('track-detail').textContent = 'Selected track is no longer in this overview';
      document.getElementById('track-detail-reader-status')?.remove();
    }
    renderTreemap(overviewData.tracks);
    if (selectedTrack) loadTrackDetail(selectedTrack);
    document.getElementById('refresh-info').textContent = 'Overview fetched ' + new Date().toLocaleTimeString();
  });
}
function renderTreemap(tracks) {
  const container = document.getElementById('overview-content');
  const total = tracks.reduce((sum, t) => sum + t.module_count, 0);
  container.innerHTML = tracks.length ? '<div class="treemap"></div>' : '<p>No operational tracks returned; coverage/age unknown.</p>';
  const map = container.querySelector('.treemap');
  for (const t of tracks) {
    const w = total ? Math.max(80, Math.round(t.module_count / total * 1200)) : 80;
    const h = total ? Math.max(60, Math.round(t.module_count / total * 600)) : 60;
    const button = document.createElement('button');
    button.className = 'treemap-cell' + (selectedTrack === t.id ? ' selected' : '');
    button.style.cssText = `width:${w}px;min-height:${h}px;background:${pctColor(t.pct_complete)};color:var(--text);border:0`;
    button.setAttribute('aria-pressed', String(selectedTrack === t.id)); button.dataset.readerKey = t.id;
    button.innerHTML = `<span class="name">${escapeHtml(t.id.toUpperCase())}</span><span class="count">${count(t.module_count)} modules · ${numeric(t.pct_complete) ? t.pct_complete + '%' : 'unknown'}</span>`;
    button.onclick = () => selectTrack(t.id); map.append(button);
  }
}
function selectTrack(trackId) {
  if (selectedTrack !== trackId) clearDetail();
  selectedTrack = trackId;
  document.querySelectorAll('.treemap-cell').forEach((button, index) => {
    const active = overviewData.tracks[index].id === trackId;
    button.classList.toggle('selected', active); button.setAttribute('aria-pressed', String(active));
  });
  return loadTrackDetail(trackId);
}
function loadTrackDetail(trackId) {
  return runReader('track-detail', `${API}/track/${encodeURIComponent(trackId)}`, d => {
    if (d?.track_id !== trackId) throw Error('Malformed success: track identity mismatch');
    return collection(d, 'modules', m => identity(m, 'slug'));
  }, (data, container) => {
    const t = overviewData.tracks.find(t => t.id === trackId);
    const s = data.stats || {};
    const research = object(s.research) ? s.research : {};
    container.innerHTML = `<h2 class="track-title">${escapeHtml(t?.name || trackId)}</h2>
      <div class="track-stats">${['pass','content_complete','fail','unaudited','missing','final_review'].map(k => `<span>${escapeHtml(k)}: ${count(s[k])}</span>`).join('')}</div>
      <p>Research: ${count(research.total)} returned · ${escapeHtml(research.profile ?? 'rubric unknown')} · ${['exemplary','solid','adequate','thin','stub'].map(key => escapeHtml(key) + ': ' + count(research[key])).join(', ')}</p>
      <table class="module-table"><caption>Returned modules for ${escapeHtml(trackId)}</caption>
      <thead><tr><th>#</th><th>Module</th><th>Build</th><th>Status</th><th>Words</th><th>Research</th><th>QA</th></tr></thead><tbody>
      ${data.modules.map(m => `<tr class="${needsBuildRefresh(m) ? 'obsolete' : ''}">
        <td>${count(m.num)}</td><td><button type="button" class="module-select" data-reader-key="${escapeHtml(m.slug)}">${escapeHtml(m.slug)}</button></td>
        <td><span class="ver-label ${pipelineClass(m.pipeline_version)}">${pipelineLabel(m.pipeline_version)}</span></td>
        <td>${escapeHtml(m.status ?? 'unknown')}</td><td>${count(m.word_count)}/${count(m.word_target)}</td>
        <td>${m.research?.exists === true ? (numeric(m.research.score) ? count(m.research.score) + '/10' : count(m.research.words) + ' words') : m.research?.exists === false ? 'missing' : 'unknown'}</td>
        <td>${m.has_final_review === true ? 'Reviewed' : m.has_final_review === false ? 'Pending' : 'unknown'}</td></tr>`).join('')}
      </tbody></table>${data.modules.length ? '' : '<p>No modules returned; coverage/age unknown.</p>'}`;
    container.querySelectorAll('.module-select').forEach((button, index) => {
      button.onclick = () => loadModuleDetail(trackId, data.modules[index].slug);
    });
    if (selectedModule && !data.modules.some(m => m.slug === selectedModule)) clearDetail();
  });
}
function metadataCard(title, entries) {
  return `<section class="detail-card"><h3>${escapeHtml(title)}</h3>${entries.map(([label, value]) => `<div class="meta-row"><span class="label">${escapeHtml(label)}</span><span>${escapeHtml(value == null ? 'unknown' : typeof value === 'object' ? JSON.stringify(value) : value)}</span></div>`).join('')}</section>`;
}
function listCard(title, values) {
  return Array.isArray(values) && values.length ? `<section class="detail-card"><h3>${escapeHtml(title)}</h3><ul class="section-list">${values.map(v => `<li>${escapeHtml(typeof v === 'object' ? JSON.stringify(v) : v)}</li>`).join('')}</ul></section>` : '';
}
function loadModuleDetail(trackId, slug) {
  selectedModule = slug;
  return runReader('right-panel', `${API}/module/${encodeURIComponent(trackId)}/${encodeURIComponent(slug)}`, m => {
    if (!object(m) || m.track !== trackId || m.slug !== slug) throw Error('Malformed success: module identity mismatch');
    return {...m, _partial: ['plan','meta','lesson','research'].some(k => m[k] != null && !object(m[k]))};
  }, (m, panel) => {
    const plan = object(m.plan) ? m.plan : null;
    const research = object(m.research) ? m.research : null;
    let html = `<h2>${escapeHtml(slug)}</h2><p>${escapeHtml(trackId)} · ${pipelineLabel(m.pipeline_version)} build state</p>`;
    html += metadataCard('Review and audit', [['Audit', m.status?.overall?.status], ['Audit freshness', m.status_is_fresh], ['QA review', m.has_final_review], ['Review score', m.review_score], ['Review verdict', m.review_verdict], ['Plan review', m.plan_review_verdict]]);
    if (research) {
      html += metadataCard('Research', ['exists','profile','score','quality','words'].map(k => [k, research[k]]));
      if (object(research.dimensions)) html += metadataCard('Research dimensions', Object.entries(research.dimensions));
      html += listCard('Research gaps', research.gaps) + listCard('Refresh reasons', research.content_alignment?.reasons);
    }
    if (plan) {
      html += metadataCard('Plan', ['title','word_target','focus','pedagogy','grammar'].map(k => [k, plan[k]]));
      html += listCard('Objectives', plan.objectives) + listCard('Content outline', plan.content_outline || plan.outline);
    } else html += '<p>No plan returned.</p>';
    if (object(m.meta)) html += metadataCard('Meta', ['duration','pedagogy','transliteration','grammar'].map(k => [k, m.meta[k]]));
    if (object(m.lesson)) html += metadataCard('Lesson', [['Words', m.lesson.word_count], ['Modified (event time)', m.lesson.last_modified]]) + listCard('Sections', m.lesson.sections);
    panel.innerHTML = html;
  });
}
fetchOverview();
setInterval(() => { if (!document.hidden) fetchOverview(); }, 30000);

</script>
</body>
</html>
