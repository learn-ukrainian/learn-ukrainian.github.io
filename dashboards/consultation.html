<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultation Loop - ukraine-ops</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
  --green: #3fb950; --blue: #58a6ff; --red: #f85149; --yellow: #d29922;
  --purple: #bc8cff; --orange: #f0883e; --cyan: #39d2c0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.topbar { display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 20px; font-weight: 700; }
.topbar a { color: var(--text2); text-decoration: none; font-size: 13px; }
.topbar a:hover { color: var(--blue); }
.topbar .spacer { flex: 1; }
.topbar .refresh-info { font-size: 11px; color: var(--text3); }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 24px; background: var(--bg2); }
.tab { padding: 12px 20px; color: var(--text2); cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--purple); border-bottom-color: var(--purple); }

.main { padding: 24px; max-width: 1200px; margin: 0 auto; }

.section { display: none; }
.section.active { display: block; }

/* Stats row */
.stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; min-width: 140px; text-align: center; }
.stat-card .value { font-size: 28px; font-weight: 700; }
.stat-card .label { font-size: 11px; color: var(--text2); text-transform: uppercase; margin-top: 4px; }

/* Proposal cards */
.proposal-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.15s;
}
.proposal-card:hover { border-color: var(--purple); transform: translateY(-1px); }
.proposal-card .header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.proposal-card .module { font-weight: 600; font-size: 15px; }
.proposal-card .meta { font-size: 12px; color: var(--text2); }
.proposal-card .root-cause { font-size: 13px; color: var(--text2); line-height: 1.4; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge.high { background: rgba(63,185,80,0.15); color: var(--green); }
.badge.medium { background: rgba(210,153,34,0.15); color: var(--yellow); }
.badge.low { background: rgba(248,81,73,0.15); color: var(--red); }

/* Detail modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; }
.modal-overlay.visible { display: flex; align-items: center; justify-content: center; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; max-width: 900px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 24px; }
.modal h2 { font-size: 18px; margin-bottom: 16px; }
.modal .close-btn { float: right; background: none; border: none; color: var(--text2); cursor: pointer; font-size: 20px; }
.modal .close-btn:hover { color: var(--text); }

/* Diff blocks */
.diff-block { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.diff-header { background: var(--bg3); padding: 8px 12px; font-size: 12px; color: var(--text2); display: flex; justify-content: space-between; }
.diff-find { background: rgba(248,81,73,0.1); padding: 12px; font-family: 'SF Mono', Monaco, monospace; font-size: 12px; white-space: pre-wrap; border-bottom: 1px solid var(--border); color: var(--red); }
.diff-replace { background: rgba(63,185,80,0.1); padding: 12px; font-family: 'SF Mono', Monaco, monospace; font-size: 12px; white-space: pre-wrap; color: var(--green); }
.diff-rationale { padding: 8px 12px; font-size: 12px; color: var(--text3); font-style: italic; }

/* Action buttons */
.actions { display: flex; gap: 12px; margin-top: 20px; }
button.action-btn {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
  transition: all 0.15s;
}
button.action-btn:hover { border-color: var(--blue); color: var(--blue); }
button.action-btn.approve { border-color: var(--green); color: var(--green); }
button.action-btn.approve:hover { background: rgba(63,185,80,0.1); }
button.action-btn.reject { border-color: var(--red); color: var(--red); }
button.action-btn.reject:hover { background: rgba(248,81,73,0.1); }
button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Confirm modal */
.confirm-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; }
.confirm-overlay.visible { display: flex; align-items: center; justify-content: center; }
.confirm-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 24px; max-width: 400px; text-align: center; }
.confirm-box p { margin-bottom: 16px; }

/* History table */
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--text3); text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
tr:hover td { background: var(--bg2); }

.outcome-badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.outcome-badge.applied { background: rgba(63,185,80,0.15); color: var(--green); }
.outcome-badge.queued { background: rgba(188,140,255,0.15); color: var(--purple); }
.outcome-badge.no_action { background: rgba(139,148,158,0.15); color: var(--text2); }
.outcome-badge.parse_failed { background: rgba(248,81,73,0.15); color: var(--red); }
.outcome-badge.no_match { background: rgba(210,153,34,0.15); color: var(--yellow); }

/* Filters */
.filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.filters select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px; }

/* Metrics bar chart */
.bar-chart { margin-top: 16px; }
.bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.bar-label { min-width: 100px; font-size: 13px; color: var(--text2); text-align: right; }
.bar-track { flex: 1; background: var(--bg3); border-radius: 4px; height: 24px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--purple); border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; min-width: fit-content; }

.keywords-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.keyword { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 4px 12px; font-size: 12px; color: var(--text2); }

.empty-state { text-align: center; padding: 60px 24px; color: var(--text3); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.6s linear infinite; margin-left: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.skip-link { position: absolute; left: -10000px; }
.skip-link:focus { position: fixed; left: 8px; top: 8px; z-index: 1000; background: var(--bg); padding: 12px; }
p, td, .meta, .card-path, .refresh-info { overflow-wrap: anywhere; }
@media (max-width: 700px) {
  .topbar, .filters, .tabs, .page-controls, .bulk-bar { flex-wrap: wrap; }
  .layout, .page-layout { display: block; }
  .main, .panel { padding: 12px; overflow-x: auto; }
  .ann-row { display: flex; flex-wrap: wrap; }
  .modal { width: 95vw; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>
<a class="skip-link" href="#page-main">Skip to content</a>

<div class="topbar">
  <h1>Consultation Loop</h1>
  <div class="spacer"></div>
  <span class="refresh-info" id="refresh-info"></span>
  <nav class="monitor-nav" aria-label="Ops API sections">
    <a href="/">Home</a>
    <a href="/orient.html">Orient</a>
    <a href="/fleet.html">Fleet</a>
    <a href="/work.html">Work</a>
    <a href="/artifacts/">Artifacts</a>
    <a href="/runtime.html">Runtime</a>
    <a href="/docs">API</a>
  </nav>
</div>

<div class="tabs">
  <button class="tab active" data-tab="queue">Queue</button>
  <button class="tab" data-tab="history">History</button>
  <button class="tab" data-tab="metrics">Metrics</button>
</div>

<main class="main" id="page-main" tabindex="-1">
  <!-- QUEUE TAB -->
  <div class="section active" id="tab-queue">
    <div class="stats-row" id="queue-stats"></div>
    <p id="queue-list-status" role="status"></p><button onclick="loadQueue()">Retry / refresh</button><div id="queue-list"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="section" id="tab-history">
    <p id="config-status" role="status"></p><button onclick="loadTrackFilter()">Retry track options</button><div class="filters">
      <select id="filter-track" aria-label="History track"><option value="">All tracks</option></select>
      <select id="filter-outcome" aria-label="History outcome">
        <option value="">All outcomes</option>
        <option value="applied">Applied</option>
        <option value="queued">Queued</option>
        <option value="no_action">No action</option>
        <option value="no_match">No match</option>
        <option value="parse_failed">Parse failed</option>
      </select>
    </div>
    <p id="history-table-status" role="status"></p><button onclick="loadHistory()">Retry / refresh</button><div id="history-table"></div>
  </div>

  <!-- METRICS TAB -->
  <div class="section" id="tab-metrics">
    <div class="stats-row" id="metrics-stats"></div>
    <p id="metrics-charts-status" role="status"></p><button onclick="loadMetrics()">Retry / refresh</button><div id="metrics-charts"></div>
  </div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal" role="dialog" aria-modal="true" aria-label="Proposal detail">
  <div class="modal">
    <button aria-label="Close proposal detail" class="close-btn" onclick="closeModal()">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="confirm-overlay" id="confirm-modal" role="dialog" aria-modal="true" aria-label="Confirm proposal action">
  <div class="confirm-box">
    <p id="confirm-text"></p><p id="action-error" role="alert"></p>
    <div class="actions" style="justify-content:center">
      <button class="action-btn" onclick="closeConfirm()">Cancel</button>
      <button class="action-btn" id="confirm-action-btn">Confirm</button>
    </div>
  </div>
</div>

<script>
const API = '/api/consultation';
let currentDetail = null;
let detailGeneration = 0;
let returnFocus = null;
let confirmFocus = null;
let pendingAction = null;
const reads = new Map();
const record = value => value !== null && typeof value === 'object' && !Array.isArray(value);
const count = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
const text = value => escHtml(value == null ? 'Unknown' : value);
const bucket = value => ['high', 'medium', 'low', 'applied', 'queued', 'no_action', 'no_match', 'parse_failed'].includes(value) ? value : 'unknown';

async function fetchJson(url, options) {
  const res = await fetch(url, options);
  let data;
  try { data = await res.json(); } catch { throw new Error(res.ok ? 'Malformed successful response: invalid JSON' : `HTTP ${res.status}`); }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  if (data == null) throw new Error('Malformed successful response');
  if (data.error) throw new Error('Source unavailable');
  return data;
}

function escHtml(value) {
  const d = document.createElement('div');
  d.textContent = value == null ? '' : String(value);
  return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function timeAgo(ts) {
  const stamp = typeof ts === 'string' && ts ? Date.parse(ts) : NaN;
  if (!Number.isFinite(stamp) || stamp > Date.now()) return 'Unknown';
  const seconds = Math.floor((Date.now() - stamp) / 1000);
  return seconds < 60 ? `${seconds}s ago` : seconds < 3600 ? `${Math.floor(seconds / 60)}m ago` : `${Math.floor(seconds / 3600)}h ago`;
}

function readStatus(id, state) {
  const el = document.getElementById(`${id}-status`);
  el.textContent = `${state.loading ? 'Loading. ' : ''}${state.error ? `Request failed: ${state.error}. ${state.fetched ? 'Historical observation retained. ' : ''}` : ''}Source age and coverage unknown. Last successful fetch: ${state.fetched || 'none'}.`;
}

async function readPanel(id, url, valid, render, coalesce = true) {
  const old = reads.get(id);
  if (coalesce && old?.loading) return;
  const state = old?.url === url ? { ...old } : { url };
  reads.set(id, state);
  state.loading = true;
  const el = document.getElementById(id);
  el.setAttribute('aria-busy', 'true');
  if (!state.fetched) el.textContent = 'Loading…';
  readStatus(id, state);
  try {
    const data = await fetchJson(url);
    if (reads.get(id) !== state) return;
    if (!valid(data)) throw new Error('Malformed successful response');
    render(data);
    state.fetched = new Date().toISOString();
    state.error = null;
  } catch (error) {
    if (reads.get(id) !== state) return;
    state.error = error.message;
    if (!state.fetched) el.textContent = 'Observation unavailable. Use Retry.';
  } finally {
    if (reads.get(id) === state) {
      state.loading = false;
      el.setAttribute('aria-busy', 'false');
      readStatus(id, state);
    }
  }
}

function switchTab(id) {
  if (!['queue', 'history', 'metrics'].includes(id)) {
    id = 'queue';
    history.replaceState(null, '', '#queue');
  }
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === `tab-${id}`));
  if (location.hash !== `#${id}`) location.hash = id;
}
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));
window.addEventListener('hashchange', () => {
  if (location.hash !== '#page-main') switchTab(location.hash.slice(1));
});

function loadQueue() {
  return readPanel('queue-list', `${API}/queue`, d => record(d) && Array.isArray(d.pending) && count(d.count) && d.pending.every(i => record(i) && typeof i.filename === 'string' && Array.isArray(i.target_files)), data => {
    document.getElementById('queue-stats').textContent = `${data.pending.length} proposals returned. Operator-decision obligations unknown.`;
    document.getElementById('queue-list').innerHTML = data.pending.map(item => `
      <div class="proposal-card">
        <div class="header"><button class="module" data-detail="${text(item.filename)}">${text(item.source_module)}${item.consultation_num == null ? '' : ` #${text(item.consultation_num)}`}</button>
        <span class="badge ${bucket(item.confidence)}">${text(item.confidence)}</span><span class="meta">${count(item.change_count) ? item.change_count : 'Unknown'} changes</span></div>
        <div class="root-cause">${text(item.root_cause_summary)}</div>
        <div class="meta">${item.target_files.map(f => `<code>${text(f)}</code>`).join(' ')} · Queued ${timeAgo(item.queued_at)}</div>
      </div>`).join('') || '<p>No proposals returned; source age and coverage unknown.</p>';
  });
}
document.getElementById('queue-list').addEventListener('click', event => {
  const button = event.target.closest('[data-detail]');
  if (button) loadDetail(button.dataset.detail);
});

async function loadDetail(filename) {
  const generation = ++detailGeneration;
  closeConfirm();
  const modal = document.getElementById('detail-modal');
  if (!modal.classList.contains('visible')) returnFocus = document.activeElement;
  modal.classList.add('visible');
  modal.querySelector('.close-btn').focus();
  currentDetail = null;
  const content = document.getElementById('modal-content');
  content.textContent = 'Loading proposal…';
  content.setAttribute('aria-busy', 'true');
  try {
    const data = await fetchJson(`${API}/queue/${encodeURIComponent(filename)}`);
    if (generation !== detailGeneration) return;
    if (!record(data) || !['pending', 'applied', 'rejected'].includes(data.status) || !Array.isArray(data.proposed_changes) || !data.proposed_changes.every(record)) throw new Error('Malformed successful response');
    currentDetail = { filename, data };
    content.innerHTML = `<h2 id="detail-title">${text(data.source_module || filename)}</h2>
      <p>Proposal: ${text(filename)} · ${text(data.status)} · <span class="badge ${bucket(data.confidence)}">${text(data.confidence)}</span></p>
      <p>Queued ${timeAgo(data.queued_at)}. Source age and coverage unknown. Last successful fetch: ${new Date().toISOString()}.</p>
      <h3>Root cause</h3><p style="white-space:pre-wrap">${text(data.root_cause)}</p>
      <h3>Proposed changes (${data.proposed_changes.length})</h3>
      ${data.proposed_changes.map((c, i) => `<div class="diff-block"><div class="diff-header">Change ${i + 1}: ${text(c.file)}</div><div class="diff-find">${text(c.find)}</div><div class="diff-replace">${text(c.replace)}</div>${c.rationale ? `<div class="diff-rationale">${text(c.rationale)}</div>` : ''}</div>`).join('')}
      ${data.additional_notes ? `<p>${text(data.additional_notes)}</p>` : ''}
      ${data.status === 'pending' ? '<div class="actions"><button class="action-btn approve" data-action="approve">Approve &amp; Apply</button><button class="action-btn reject" data-action="reject">Reject</button></div>' : ''}`;
    content.querySelectorAll('[data-action]').forEach(button => {
      button.onclick = () => confirmAction(button.dataset.action, filename);
    });
  } catch (error) {
    if (generation !== detailGeneration) return;
    content.textContent = `Failed to load proposal: ${error.message}. Source age unknown. Last successful fetch: none. `;
    const retry = document.createElement('button');
    retry.textContent = 'Retry detail';
    retry.onclick = () => loadDetail(filename);
    content.appendChild(retry);
  } finally {
    if (generation === detailGeneration) content.setAttribute('aria-busy', 'false');
  }
}

function closeModal() {
  ++detailGeneration;
  closeConfirm();
  document.getElementById('detail-modal').classList.remove('visible');
  currentDetail = null;
  if (returnFocus?.isConnected) returnFocus.focus();
}

function confirmAction(action, filename) {
  if (!['approve', 'reject'].includes(action) || currentDetail?.filename !== filename || currentDetail.data.status !== 'pending') return;
  pendingAction = { action, filename };
  confirmFocus = document.activeElement;
  document.getElementById('confirm-text').textContent = action === 'approve' ? 'Apply template changes and approve this proposal?' : 'Reject this proposal?';
  document.getElementById('action-error').textContent = '';
  const btn = document.getElementById('confirm-action-btn');
  btn.className = `action-btn ${action}`;
  btn.textContent = action === 'approve' ? 'Approve' : 'Reject';
  btn.onclick = executeAction;
  document.getElementById('confirm-modal').classList.add('visible');
  document.getElementById('confirm-modal').querySelector('button').focus();
}

function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('visible');
  pendingAction = null;
  if (confirmFocus?.isConnected) confirmFocus.focus();
}

async function executeAction() {
  if (!pendingAction) return;
  const actionState = pendingAction;
  const { action, filename } = actionState;
  const btn = document.getElementById('confirm-action-btn');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = action === 'approve' ? 'Applying…' : 'Rejecting…';
  try {
    const data = await fetchJson(`${API}/queue/${encodeURIComponent(filename)}/${action}?confirm=true`, { method: 'POST' });
    if (!record(data) || !['approved', 'already_applied', 'rejected', 'already_rejected'].includes(data.status)) throw new Error('Mutation result unknown; reload proposal before retrying');
    if (pendingAction !== actionState) return;
    closeConfirm();
    closeModal();
    await loadQueue();
  } catch (error) {
    if (pendingAction === actionState) document.getElementById('action-error').textContent = `Request failed: ${error.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = action === 'approve' ? 'Approve' : 'Reject';
  }
}

function loadHistory() {
  const params = new URLSearchParams({ limit: '200' });
  const track = document.getElementById('filter-track').value;
  const outcome = document.getElementById('filter-outcome').value;
  if (track) params.set('track', track);
  if (outcome) params.set('outcome', outcome);
  return readPanel('history-table', `${API}/history?${params}`, d => record(d) && Array.isArray(d.consultations) && count(d.total) && d.consultations.every(record), data => {
    document.getElementById('history-table').innerHTML = data.consultations.length ? `<table><caption>Consultation history, ${data.consultations.length} of ${data.total} returned</caption><thead><tr><th>Module</th><th>Track</th><th>Outcome</th><th>Confidence</th><th>Scope</th><th>Changes</th><th>Event age</th></tr></thead><tbody>${data.consultations.map(c => `<tr><td>${text(c.slug)}</td><td>${text(c.track)}</td><td><span class="outcome-badge ${bucket(c.outcome)}">${text(c.outcome)}</span></td><td><span class="badge ${bucket(c.confidence)}">${text(c.confidence)}</span></td><td>${text(c.scope)}</td><td>${count(c.changes_count) ? c.changes_count : 'Unknown'}</td><td>${timeAgo(c.ts)}</td></tr>`).join('')}</tbody></table>` : '<p>No history rows returned for these filters; source age and coverage unknown.</p>';
  }, false);
}

async function loadTrackFilter() {
  try {
    const data = await fetchJson('/api/config');
    if (!record(data) || !Array.isArray(data.levels) || !data.levels.every(l => record(l) && typeof l.id === 'string')) throw new Error('Malformed successful response');
    const select = document.getElementById('filter-track');
    const selected = select.value;
    select.replaceChildren(new Option('All tracks', ''));
    data.levels.forEach(l => select.add(new Option(l.id, l.id)));
    select.value = selected;
    document.getElementById('config-status').textContent = `Source age unknown. Last successful fetch: ${new Date().toISOString()}.`;
  } catch (error) {
    document.getElementById('config-status').textContent = `Track options unavailable: ${error.message}. Source age unknown.`;
  }
}

function loadMetrics() {
  return readPanel('metrics-charts', `${API}/metrics`, d => record(d) && count(d.total) && count(d.pending_queue) && ['by_outcome', 'by_track', 'by_confidence', 'by_scope'].every(k => record(d[k]) && Object.values(d[k]).every(count)) && Array.isArray(d.top_root_causes) && d.top_root_causes.every(row => Array.isArray(row) && row.length === 2 && count(row[1])), data => {
    const outcomes = data.by_outcome;
    document.getElementById('metrics-stats').textContent = `Total: ${data.total}. Applied: ${outcomes.applied ?? 0}. Queued: ${outcomes.queued ?? 0}. Parse failed: ${outcomes.parse_failed ?? 0}. Pending proposals: ${data.pending_queue}.`;
    const largest = Math.max(1, ...Object.values(data.by_track));
    const trackChart = `<h3>Consultations by track</h3><div class="bar-chart">${Object.entries(data.by_track).map(([track, value]) => `<div class="bar-row"><div class="bar-label">${text(track)}</div><div class="bar-track"><div class="bar-fill" style="width:${value / largest * 100}%">${value}</div></div></div>`).join('')}</div>`;
    document.getElementById('metrics-charts').innerHTML = trackChart + ['by_track', 'by_confidence', 'by_scope'].map(key => `<h3>${key.replace('by_', 'By ')}</h3><table><thead><tr><th>Category</th><th>Count</th></tr></thead><tbody>${Object.entries(data[key]).map(([label, value]) => `<tr><td>${text(label)}</td><td>${value}</td></tr>`).join('')}</tbody></table>`).join('') + `<h3>Root cause keywords</h3>${data.top_root_causes.map(([word, value]) => `<span class="keyword">${text(word)} (${value})</span>`).join('')}`;
  });
}

document.getElementById('filter-track').addEventListener('change', loadHistory);
document.getElementById('filter-outcome').addEventListener('change', loadHistory);
document.addEventListener('keydown', event => {
  const modal = ['confirm-modal', 'detail-modal'].map(id => document.getElementById(id)).find(el => el.classList.contains('visible'));
  if (!modal) return;
  if (event.key === 'Escape') {
    if (modal.id === 'confirm-modal') closeConfirm(); else closeModal();
  }
  if (event.key === 'Tab') {
    const focusable = [...modal.querySelectorAll('button:not(:disabled), [href], input, select')];
    const first = focusable[0], last = focusable.at(-1);
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
    if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
  }
});
['detail-modal', 'confirm-modal'].forEach(id => document.getElementById(id).addEventListener('click', event => {
  if (event.target === event.currentTarget) { if (id === 'detail-modal') closeModal(); else closeConfirm(); }
}));
loadTrackFilter();
loadQueue();
loadHistory();
loadMetrics();
switchTab(location.hash.slice(1));
</script>
</body>
</html>
