<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Events - ukraine-ops</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
  --green: #3fb950; --blue: #58a6ff; --red: #f85149; --yellow: #d29922;
  --gray: #484f58; --purple: #bc8cff; --orange: #f0883e; --cyan: #39d2c0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 0; z-index: 10; }
.topbar h1 { font-size: 22px; font-weight: 700; }
.topbar .sub { font-size: 12px; color: var(--text2); }
.topbar .spacer { flex: 1; }
.muted { color: var(--text3); font-size: 12px; }
.btn, select, input { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 12px; }
.btn { padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
select, input { padding: 8px 10px; }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.card { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--orange); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
.card.cyan { border-left-color: var(--cyan); }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-header h2 { font-size: 15px; font-weight: 600; }
.banner { display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(248,81,73,0.14); border: 1px solid rgba(248,81,73,0.35); color: var(--red); font-size: 13px; }
.empty { color: var(--text3); font-size: 13px; padding: 8px 0; }
.active-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.active-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.active-card.stale { border-left: 3px solid var(--red); }
.active-card.live { border-left: 3px solid var(--green); }
.k { color: var(--text3); font-size: 11px; text-transform: uppercase; }
.v { font-size: 13px; margin: 4px 0 8px; }
.filters { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; color: var(--text3); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
.pill.ok { background: rgba(63,185,80,0.15); color: var(--green); }
.pill.err { background: rgba(248,81,73,0.15); color: var(--red); }
@media (max-width: 760px) { .topbar { flex-wrap: wrap; } }

.reader-status { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 0; font-size:12px; color:var(--text2); overflow-wrap:anywhere; }
.reader-status button { color:var(--text); background:var(--bg3); border:1px solid var(--border); border-radius:4px; padding:5px 10px; cursor:pointer; }
:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
button { font:inherit; }
td, .meta-row, .module-cell, .issue-card { overflow-wrap:anywhere; }
.container, .left-panel, .right-panel { min-width:0; }
.container { overflow-x:auto; }
.topbar { flex-wrap:wrap; }
.skip-link { position:absolute; top:-100px; left:8px; z-index:100; background:var(--bg); padding:10px; }
.skip-link:focus { top:8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
<link rel="stylesheet" href="/monitor.css">
</head>
<body>
<a class="skip-link" href="#reader-main">Skip to content</a>
<div class="topbar">
  <div>
    <h1>Build Events</h1>
    <div class="sub">Live build event stream</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" onclick="refreshAll()">Refresh</button>
  <div class="muted" id="last-refresh">Auto-refresh every 10s</div>
  <nav class="monitor-nav" aria-label="Ops API sections">
    <a href="/">Home</a>
    <a href="/orient.html">Orient</a>
    <a href="/fleet.html">Fleet</a>
    <a href="/work.html">Work</a>
    <a href="/artifacts/">Artifacts</a>
    <a href="/runtime.html">Runtime</a>
    <a href="/docs">API</a>
  </nav>
</div>

<div class="container" id="reader-main" role="main" tabindex="-1">
  <section class="card">
    <div class="card-header"><h2>&#128293; Active Builds</h2><div class="muted" id="active-muted"></div></div>
    <div class="banner" id="active-banner"></div>
    <div id="active-content" class="empty">Loading...</div>
  </section>

  <section class="card cyan">
    <div class="card-header"><h2>&#128196; Recent Events</h2><div class="muted">Refetches on filter change</div></div>
    <div class="banner" id="recent-banner"></div>
    <div class="filters">
      <select id="level-filter" aria-label="Level"></select>
      <input id="slug-filter" aria-label="Slug" placeholder="Filter by slug">
      <button class="btn" onclick="refreshRecent()">Apply</button>
    </div>
    <div id="recent-content" class="empty">Loading...</div>
  </section>
</div>

<script>
const REFRESH_MS = 10000;
const LEVEL_OPTIONS = ['','a1','a2','b1','b2','b2-pro','c1','c1-pro','c2','folk','hist','bio','istorio','lit','oes','ruth'];
let refreshTimer = null;
let slugDebounce = null;



function formatTs(value) { const time = validTime(value); return time === null ? 'unknown event time' : new Date(time).toLocaleString(); }

function formatDuration(value) {
  if (!numeric(value)) return '—';
  if (value >= 60) return `${(value / 60).toFixed(1)}m`;
  return `${value.toFixed(1)}s`;
}


const readerStates = new Map();
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function object(value) { return value !== null && typeof value === 'object' && !Array.isArray(value); }
function numeric(value) { return typeof value === 'number' && Number.isFinite(value) && value >= 0; }
function count(value) { return numeric(value) ? String(value) : 'unknown'; }
function identity(row, key) { return object(row) && typeof row[key] === 'string' && row[key].length > 0; }
function collection(data, key, valid) {
  if (!object(data) || !Array.isArray(data[key])) throw Error('Malformed success: invalid ' + key);
  const rows = data[key].filter(valid);
  if (data[key].length && !rows.length) throw Error('Malformed success: invalid ' + key + ' rows');
  return {...data, [key]: rows, _empty: rows.length === 0, _partial: rows.length !== data[key].length || data.partial === true};
}
async function fetchJson(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    // Legacy callers may request fresh=true; readers use the existing bounded cache.
    const target = new URL(url, location.origin);
    target.searchParams.delete('fresh');
    const res = await fetch(target.pathname + target.search, {signal: controller.signal});
    if (!res.ok) throw Error('Request failed: HTTP ' + res.status);
    let data;
    try { data = await res.json(); } catch { throw Error('Parse failure: invalid JSON'); }
    if (data === null || typeof data !== 'object') throw Error('Malformed success: expected JSON object or array');
    return data;
  } catch (error) {
    if (error.name === 'AbortError') throw Error('Request timed out');
    throw error;
  } finally { clearTimeout(timeout); }
}
function validTime(value) {
  const time = typeof value === 'string' && value ? Date.parse(value) : NaN;
  return Number.isFinite(time) && time <= Date.now() ? time : null;
}
function readerClock(state) {
  const elapsed = Math.max(0, (Date.now() - state.fetchedAt) / 1000);
  const meta = state.data?.meta;
  const generated = validTime(meta?.generated_at || state.data?.generated_at);
  const cacheAge = numeric(meta?.age_s) ? ` · Cache age ${Math.floor(meta.age_s + elapsed)}s` : '';
  const stale = meta?.stale === true || (numeric(meta?.age_s) && numeric(meta?.stale_after_s) && meta.stale_after_s > 0 && meta.age_s + elapsed > meta.stale_after_s) ? ' · Stale snapshot cache' : '';
  const fetched = state.data?._partial || meta?.error ? 'Last partial fetch' : 'Last successful fetch';
  const snapshot = generated === null ? '' : ` · Snapshot generated ${new Date(generated).toLocaleString()} (${Math.floor((Date.now()-generated)/1000)}s ago)`;
  return `Source age unknown${snapshot}${cacheAge}${stale} · ${fetched} ${new Date(state.fetchedAt).toLocaleString()}`;
}
function invalidateReader(id) {
  const state = readerStates.get(id);
  if (state) { state.generation++; state.scope = null; state.pending = null; }
}
function runReader(id, url, validate, render) {
  const panel = document.getElementById(id);
  let state = readerStates.get(id);
  if (state?.pending && state.scope === url && state.panel === panel) return state.pending;
  if (!state || state.panel !== panel) {
    state = {generation: 0, panel}; readerStates.set(id, state);
  }
  if (state.scope !== url) { state.data = null; state.fetchedAt = null; }
  state.scope = url;
  const generation = ++state.generation;
  let status = document.getElementById(id + '-reader-status');
  if (!status) {
    status = document.createElement('div'); status.id = id + '-reader-status'; status.className = 'reader-status';
    const label = document.createElement('span'); label.setAttribute('role', 'status');
    const clock = document.createElement('span'); clock.className = 'reader-clock';
    const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Retry';
    retry.setAttribute('aria-label', 'Retry ' + id.replaceAll('-', ' '));
    status.append(label, clock, retry); panel.before(status);
  }
  const [label, clock, retry] = status.children;
  retry.onclick = () => runReader(id, url, validate, render);
  label.textContent = 'Loading';
  clock.textContent = state.fetchedAt ? readerClock(state) : 'Source age unknown · No successful fetch';
  panel.setAttribute('aria-busy', 'true');
  if (!state.data) panel.textContent = 'Loading…';
  const current = () => state.generation === generation && document.getElementById(id) === panel;
  state.pending = (async () => {
    try {
      const data = validate(await fetchJson(url));
      if (!current()) return;
      const active = panel.contains(document.activeElement) ? document.activeElement.dataset.readerKey : null;
      render(data, panel);
      if (active != null) [...panel.querySelectorAll('[data-reader-key]')].find(el => el.dataset.readerKey === active)?.focus({preventScroll:true});
      state.data = data; state.fetchedAt = Date.now();
      const meta = data.meta || {};
      label.textContent = [data._partial ? 'Partial · incomplete coverage' : data._empty ? 'Empty · no rows returned' : 'Loaded', meta.error ? 'Source unavailable' : '', meta.stale === true || data.stale === true ? 'Stale · retained source snapshot' : '', 'Source age/coverage unknown'].filter(Boolean).join(' · ');
      clock.textContent = readerClock(state);
      return data;
    } catch (error) {
      if (!current()) return;
      label.textContent = error.message + (state.data ? ' · Historical values retained' : ' · No data');
      if (!state.data) panel.textContent = 'Unable to load this section. Use Retry.';
    } finally {
      if (current()) { panel.setAttribute('aria-busy', 'false'); state.pending = null; }
    }
  })();
  return state.pending;
}
setInterval(() => {
  for (const [id, state] of readerStates) {
    const clock = document.getElementById(id + '-reader-status')?.querySelector('.reader-clock');
    if (clock && state.fetchedAt) clock.textContent = readerClock(state);
  }
}, 10000);

function setBanner(id, message) {
  const el = document.getElementById(id);
  el.textContent = message || '';
  el.style.display = message ? 'block' : 'none';
}

function initFilters() {
  const level = document.getElementById('level-filter');
  level.innerHTML = LEVEL_OPTIONS.map(option => `<option value="${option}">${option || 'All levels'}</option>`).join('');
  level.addEventListener('change', refreshRecent);
  document.getElementById('slug-filter').addEventListener('input', () => {
    invalidateReader('recent-content');
    document.getElementById('recent-content').textContent = 'Loading results for the edited filter…';
    clearTimeout(slugDebounce);
    slugDebounce = setTimeout(refreshRecent, 250);
  });
}

function recentQuery() {
  const params = new URLSearchParams({ limit: '100' });
  const level = document.getElementById('level-filter').value.trim();
  const slug = document.getElementById('slug-filter').value.trim();
  if (level) params.set('level', level);
  if (slug) params.set('slug', slug);
  return params.toString();
}

function renderActive(active) {
  document.getElementById('active-muted').textContent = `${active.length} active modules`;
  if (!active.length) {
    document.getElementById('active-content').innerHTML = '<div class="empty">No active build rows returned; source age/coverage unknown</div>';
    return;
  }
  document.getElementById('active-content').innerHTML = `<div class="active-grid">${active.map(item => `
    <div class="active-card ${numeric(item.age_s) ? item.age_s > 300 ? 'stale' : 'live' : ''}">
      <div class="k">level</div><div class="v">${escapeHtml(item.level || '—')}</div>
      <div class="k">slug</div><div class="v mono">${escapeHtml(item.slug || '—')}</div>
      <div class="k">current phase</div><div class="v">${escapeHtml(item.current_phase || '—')}</div>
      <div class="k">last dispatch age (not source age)</div><div class="v">${formatDuration(item.age_s)}</div>
    </div>
  `).join('')}</div>`;
}

function renderRecent(events) {
  if (!events.length) {
    const level = document.getElementById('level-filter')?.value.trim();
    const slug = document.getElementById('slug-filter')?.value.trim();
    const message = (level || slug)
      ? 'No build events returned for the current filters; source age/coverage unknown'
      : 'No recent build events returned; source age/coverage unknown';
    document.getElementById('recent-content').innerHTML = `<div class="empty">${message}</div>`;
    return;
  }
  document.getElementById('recent-content').innerHTML = `<table>
    <thead><tr><th>ts</th><th>level</th><th>slug</th><th>phase</th><th>agent</th><th>duration</th><th>ok</th></tr></thead>
    <tbody>${events.map(event => `<tr>
      <td>${escapeHtml(formatTs(event.ts))}</td>
      <td>${escapeHtml(event.level || '—')}</td>
      <td class="mono">${escapeHtml(event.slug || '—')}</td>
      <td>${escapeHtml(event.phase || '—')}</td>
      <td>${escapeHtml(event.agent || '—')}</td>
      <td>${formatDuration(event.duration_s)}</td>
      <td><span class="pill ${event.ok === true ? 'ok' : event.ok === false ? 'err' : ''}">${event.ok === true ? 'yes' : event.ok === false ? 'no' : 'unknown'}</span></td>
    </tr>`).join('')}</tbody>
  </table>`;
}


function loadActive() {
  return runReader('active-content', '/api/build/events/active', d => collection(d, 'active', row => identity(row, 'slug') && identity(row, 'level')), d => {
    renderActive(d.active); setBanner('active-banner', '');
  });
}
function refreshRecent() {
  return runReader('recent-content', `/api/build/events/recent?${recentQuery()}`, d => collection(d, 'events', row => identity(row, 'slug') && identity(row, 'level')), d => {
    renderRecent(d.events); setBanner('recent-banner', '');
  });
}


function stopRefresh() {
  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

function startRefresh() {
  if (!refreshTimer) refreshTimer = setInterval(refreshAll, REFRESH_MS);
}

function refreshAll() {
  loadActive();
  refreshRecent();
  document.getElementById('last-refresh').textContent = `Refresh attempted ${new Date().toLocaleTimeString()} · auto-refresh every 10s`;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopRefresh();
  } else {
    refreshAll();
    startRefresh();
  }
});

initFilters();
refreshAll();
startRefresh();
</script>
</body>
</html>
