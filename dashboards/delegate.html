<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delegate - ukraine-ops</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
  --green: #3fb950; --blue: #58a6ff; --red: #f85149; --yellow: #d29922;
  --gray: #484f58; --purple: #bc8cff; --orange: #f0883e; --cyan: #39d2c0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg2); }
.topbar h1 { font-size: 22px; font-weight: 700; }
.topbar .sub { font-size: 12px; color: var(--text2); }
.topbar .spacer { flex: 1; }
.btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 12px; font-size: 12px; cursor: pointer; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.card { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--blue); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
.card.orange { border-left-color: var(--orange); }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-header h2 { font-size: 15px; font-weight: 600; }
.muted { color: var(--text3); font-size: 12px; }
.banner { display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(248,81,73,0.14); border: 1px solid rgba(248,81,73,0.35); color: var(--red); font-size: 13px; }
.empty { color: var(--text3); font-size: 13px; padding: 8px 0; }
.task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.task-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.task-card.zombie { border-left: 3px solid var(--red); }
.task-card.running { border-left: 3px solid var(--yellow); }
.task-card.spawning { border-left: 3px solid var(--blue); }
.task-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
.pill.ok { background: rgba(63,185,80,0.15); color: var(--green); }
.pill.err { background: rgba(248,81,73,0.15); color: var(--red); }
.pill.warn { background: rgba(210,153,34,0.15); color: var(--yellow); }
.pill.gray { background: rgba(72,79,88,0.2); color: var(--text2); }
.kv { display: grid; grid-template-columns: 78px 1fr; gap: 6px 10px; font-size: 12px; margin-bottom: 12px; }
.kv .k { color: var(--text3); }
.task-card button { width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; color: var(--text3); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr.task-row { cursor: pointer; }
tr.task-row:hover { background: var(--bg3); }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 20; }
.overlay.open { display: block; }
.modal { max-width: 1100px; width: calc(100% - 48px); max-height: calc(100vh - 48px); overflow: auto; margin: 24px auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.modal-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.modal-top h3 { font-size: 18px; }
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 12px; overflow: auto; max-height: 65vh; }
@media (max-width: 900px) {
  .modal-grid { grid-template-columns: 1fr; }
  .topbar { flex-wrap: wrap; }
}
</style>
<link rel="stylesheet" href="/monitor.css">
</head>
<body>
<div class="topbar">
  <div>
    <h1>Delegate</h1>
    <div class="sub">Delegation task list and detail inspector</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" onclick="loadTasks()">Refresh</button>
  <div class="muted" id="last-refresh">No auto-refresh</div>
  <nav class="monitor-nav" aria-label="Ops API sections">
    <a href="/">Home</a>
    <a href="/orient.html">Orient</a>
    <a href="/fleet.html">Fleet</a>
    <a href="/work.html">Work</a>
    <a href="/artifacts/">Artifacts</a>
    <a href="/runtime.html">Runtime</a>
    <a href="/docs">API</a>
  </nav>
</div>

<div class="container">
  <section class="card">
    <div class="card-header"><h2>&#129309; Active Tasks</h2><div class="muted" id="active-muted"></div></div>
    <div class="banner" id="active-banner"></div>
    <div aria-live="polite" aria-busy="true" id="active-content" class="empty">Loading...</div>
  </section>

  <section class="card orange">
    <div class="card-header"><h2>&#10003; Finished and attention tasks</h2><div class="muted" id="completed-muted"></div></div>
    <div class="banner" id="completed-banner"></div>
    <div aria-live="polite" id="completed-content" class="empty">Loading...</div>
  </section>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" onclick="event.stopPropagation()">
    <div class="modal-top">
      <h3 id="modal-title">Task Detail</h3>
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
    <div class="banner" id="detail-banner"></div>
    <div class="muted" id="detail-meta" style="margin-bottom:12px"></div>
    <div class="modal-grid">
      <div>
        <div class="muted" style="margin-bottom:8px">Observer-safe task summary</div>
        <pre id="task-json">Loading...</pre>
      </div>
      <div>
        <div class="muted" style="margin-bottom:8px">Result file</div>
        <pre id="task-result">Loading...</pre>
      </div>
    </div>
  </div>
</div>

<script>
const API_TIMEOUT_MS = 5000;
let tasksLoading = false;
let lastTasksFetch = null;
let detailGeneration = 0;
let detailOpener = null;

function validTask(task) {
  return task && typeof task === 'object' && typeof task.task_id === 'string' && task.task_id.length > 0
    && (task.status == null || typeof task.status === 'string');
}

function validateTasks(data) {
  if (!Array.isArray(data.tasks) || !Number.isSafeInteger(data.total) || data.total < data.tasks.length
      ) throw new Error('Malformed task list');
  const tasks = data.tasks.filter(validTask);
  if (data.tasks.length && !tasks.length) throw new Error('Malformed task rows');
  return tasks;
}

function bindDetails(container) {
  container.querySelectorAll('button[data-task-id]').forEach(button => {
    button.addEventListener('click', event => { event.stopPropagation(); openDetail(button.dataset.taskId); });
  });
}


function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function formatTs(value) {
  if (!value) return '—';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
}

function formatElapsed(seconds) {
  if (typeof seconds !== 'number' || !Number.isFinite(seconds) || seconds < 0) return '—';
  if (seconds >= 3600) return `${(seconds / 3600).toFixed(1)}h`;
  if (seconds >= 60) return `${(seconds / 60).toFixed(1)}m`;
  return `${seconds.toFixed(0)}s`;
}

function finishedAt(task) {
  if (!task || !task.started_at || typeof task.duration_s !== 'number') return '—';
  const start = new Date(task.started_at);
  if (Number.isNaN(start.getTime())) return '—';
  return new Date(start.getTime() + task.duration_s * 1000).toLocaleString();
}

async function fetchJson(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
  try {
    const response = await fetch(url, { signal: controller.signal });
    const text = await response.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error('Malformed JSON response'); }
    if (!response.ok) throw new Error(data.detail || data.error || `HTTP ${response.status}`);
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Malformed response object');
    return data;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('Request timed out');
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}

function setBanner(id, message) {
  const el = document.getElementById(id);
  el.textContent = message || '';
  el.style.display = message ? 'block' : 'none';
}

function statusClass(status) {
  if (status === 'done') return 'ok';
  if (status === 'failed' || status === 'zombie') return 'err';
  if (status === 'running' || status === 'spawning') return 'warn';
  return 'gray';
}

function observerTaskView(task) {
  if (!task || typeof task !== 'object') return {};
  const timings = {};
  for (const key of ['started_at', 'finished_at', 'duration_s', 'elapsed_s', 'age_s']) {
    if (task[key] != null) timings[key] = task[key];
  }
  const verdict = {};
  if (task.verdict != null) verdict.outcome = task.verdict;
  for (const key of ['returncode', 'no_deliverable_reason', 'delivery_declaration', 'substitution']) {
    if (task[key] != null) verdict[key] = task[key];
  }
  const view = {
    task_id: task.task_id ?? null,
    agent: task.agent ?? null,
    model: task.model ?? null,
    status: task.status ?? null,
  };
  if (Object.keys(timings).length) view.timings = timings;
  if (Object.keys(verdict).length) view.verdict = verdict;
  return view;
}

function isToday(date) {
  if (!date || Number.isNaN(date.getTime())) return false;
  const now = new Date();
  return date.getFullYear() === now.getFullYear()
    && date.getMonth() === now.getMonth()
    && date.getDate() === now.getDate();
}

function taskTouchedToday(task) {
  if (!task || !task.started_at) return false;
  const start = new Date(task.started_at);
  if (isToday(start)) return true;
  if (typeof task.duration_s === 'number' && !Number.isNaN(start.getTime())) {
    return isToday(new Date(start.getTime() + task.duration_s * 1000));
  }
  return false;
}

function idleCopy(finishedToday) {
  // Distinguish live-now idle (work happened today) from a genuinely empty day (#7078).
  return finishedToday > 0
    ? `Nothing running right now in returned rows. ${finishedToday} task${finishedToday === 1 ? '' : 's'} finished today in returned rows. See finished and attention tasks below; coverage unknown.`
    : 'No running task rows returned; source age and complete-day coverage unknown.';
}

function renderActive(tasks, finishedToday) {
  document.getElementById('active-muted').textContent = `${tasks.length} visible`;
  if (!tasks.length) {
    document.getElementById('active-content').innerHTML = `<div class="empty">${idleCopy(finishedToday || 0)}</div>`;
    return;
  }
  document.getElementById('active-content').innerHTML = `<div class="task-grid">${tasks.map(task => `
    <div class="task-card ${statusClass(task.status)}">
      <div class="task-top">
        <div class="mono">${escapeHtml(task.task_id || '—')}</div>
        <span class="pill ${statusClass(task.status)}">${task.status === 'zombie' ? 'ZOMBIE' : escapeHtml(task.status || 'unknown')}</span>
      </div>
      <div class="kv">
        <div class="k">agent</div><div>${escapeHtml(task.agent || '—')}</div>
        <div class="k">started</div><div>${escapeHtml(formatTs(task.started_at))}</div>
        <div class="k">elapsed</div><div>${formatElapsed(task.age_s)}</div>
      </div>
      <button class="btn" data-task-id="${escapeHtml(task.task_id)}">View detail</button>
    </div>
  `).join('')}</div>`;
  bindDetails(document.getElementById('active-content'));
}

function renderCompleted(tasks) {
  document.getElementById('completed-muted').textContent = `${tasks.length} shown`;
  if (!tasks.length) {
    document.getElementById('completed-content').innerHTML = '<div class="empty">No finished or attention rows returned; coverage unknown</div>';
    return;
  }
  document.getElementById('completed-content').innerHTML = `<table>
    <thead><tr><th>task_id</th><th>agent</th><th>status</th><th>duration</th><th>finished_at</th></tr></thead>
    <tbody>${tasks.map(task => `<tr class="task-row" onclick='openDetail(this.dataset.taskId)' data-task-id="${escapeHtml(task.task_id)}">
      <td class="mono"><button class="btn" data-task-id="${escapeHtml(task.task_id)}">${escapeHtml(task.task_id)}</button></td>
      <td>${escapeHtml(task.agent || '—')}</td>
      <td><span class="pill ${statusClass(task.status)}">${escapeHtml(task.status || 'unknown')}</span></td>
      <td>${formatElapsed(task.duration_s)}</td>
      <td>${finishedAt(task)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
  bindDetails(document.getElementById('completed-content'));
}

async function openDetail(taskId) {
  const generation = ++detailGeneration;
  if (!document.getElementById('overlay').classList.contains('open')) detailOpener = document.activeElement;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal-title').textContent = taskId;
  document.getElementById('detail-meta').textContent = 'Loading...';
  document.getElementById('task-json').textContent = 'Loading...';
  document.getElementById('task-result').textContent = 'Loading...';
  setBanner('detail-banner', '');
  document.querySelector('.modal').focus();
  try {
    const detail = await fetchJson(`/api/delegate/tasks/${encodeURIComponent(taskId)}`);
    if (generation !== detailGeneration) return;
    if (!validTask(detail.task) || detail.task.task_id !== taskId || (detail.result !== null && typeof detail.result !== 'string')
        || typeof detail.result_truncated !== 'boolean') throw new Error('Malformed task detail');
    document.getElementById('detail-meta').textContent = `Source age unknown · Last successful fetch ${new Date().toLocaleTimeString()} · ${detail.result_truncated ? 'Result truncated to 64 KiB' : 'Result read'}`;
    document.getElementById('task-json').textContent = JSON.stringify(observerTaskView(detail.task || {}), null, 2);
    document.getElementById('task-result').textContent = detail.result ? detail.result : 'No result returned; task completion is not established by this field';
  } catch (error) {
    if (generation !== detailGeneration) return;
    setBanner('detail-banner', `API unavailable: ${error.message}`);
    document.getElementById('detail-meta').textContent = 'Unable to load task detail';
    document.getElementById('task-json').textContent = 'Unable to load task detail';
    document.getElementById('task-result').textContent = 'No result returned; task completion is not established by this field';
  }
}

function closeModal(event) {
  if (event && event.target && event.target.id !== 'overlay') return;
  ++detailGeneration;
  document.getElementById('overlay').classList.remove('open');
  if (detailOpener?.isConnected) detailOpener.focus();
}

async function loadTasks() {
  if (tasksLoading) return;
  tasksLoading = true;
  document.getElementById('active-content').setAttribute('aria-busy', 'true');
  try {
    const data = await fetchJson('/api/delegate/tasks?limit=100');
    const tasks = validateTasks(data);
    const active = tasks.filter(task => ['running', 'spawning'].includes(task.status));
    const completed = tasks.filter(task => !['running', 'spawning'].includes(task.status));
    const finishedToday = completed.filter(task => task.status === 'done' || task.finished_at || typeof task.duration_s === 'number').filter(taskTouchedToday).length;
    renderActive(active, finishedToday);
    renderCompleted(completed);
    lastTasksFetch = new Date();
    document.getElementById('last-refresh').textContent = `Source age unknown · Last successful fetch ${lastTasksFetch.toLocaleTimeString()} · ${tasks.length} of ${data.total} task records loaded · refresh on demand`;
    const partial = data.tasks.length !== tasks.length ? `Partial task list: ${data.tasks.length - tasks.length} malformed rows omitted; coverage incomplete.` : '';
    setBanner('active-banner', partial);
    setBanner('completed-banner', partial);
  } catch (error) {
    const message = `Task read failed: ${error.message}. ${lastTasksFetch ? 'Retained rows are historical.' : 'Task state unknown.'}`;
    setBanner('active-banner', message);
    setBanner('completed-banner', message);
    if (!lastTasksFetch) {
      document.getElementById('active-content').textContent = 'Unable to load tasks';
      document.getElementById('completed-content').textContent = 'Unable to load tasks';
    }
  } finally {
    tasksLoading = false;
    document.getElementById('active-content').removeAttribute('aria-busy');
  }
}

document.addEventListener('keydown', event => {
  const overlay = document.getElementById('overlay');
  if (!overlay.classList.contains('open')) return;
  if (event.key === 'Escape') closeModal();
  if (event.key === 'Tab') {
    const controls = [...overlay.querySelectorAll('button, [tabindex="0"]')];
    const first = controls[0], last = controls[controls.length - 1];
    if (event.shiftKey && (document.activeElement === first || document.activeElement === document.querySelector('.modal'))) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});

loadTasks();
</script>
</body>
</html>
