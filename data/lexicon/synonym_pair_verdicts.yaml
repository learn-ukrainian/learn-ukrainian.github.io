rejected:
- a: абстрактний
  b: загальний
  polarity: synonym
  reason: абстрактний = утворений абстрагуванням; загальний = який стосується всіх.
    Різні поняття.
- a: абстрактний
  b: книжний
  polarity: synonym
  reason: абстрактний = результат абстрагування; книжний = характерний для писемного
    викладу. Різні поняття.
- a: аварія
  b: інцидент
  polarity: synonym
  reason: аварія = значне пошкодження механізму; інцидент = пригода, випадок. Гіперо-гіпонімічний
    зв'язок, не синоніми.
- a: акцент
  b: вимова
  polarity: synonym
  reason: акцент — 'своєрідний характер вимови' (специфічний тип); вимова — загальне
    поняття — гіпонім, не синонім
- a: алегорія
  b: двозначність
  polarity: synonym
  reason: алегорія = художній прийом, двозначність = неоднозначність. Різні поняття.
- a: алегорія
  b: підтекст
  polarity: synonym
  reason: алегорія = художній прийом (втілення абстрактного в образі); підтекст =
    прихований зміст. Різні поняття.
- a: арка
  b: вікно
  polarity: synonym
  reason: Арка — архітектурна конструкція (склепіння); вікно — отвір для світла. Різні
    елементи.
- a: арка
  b: двері
  polarity: synonym
  reason: Арка = дугоподібна конструкція, двері = отвір для входу/виходу; різні архітектурні
    елементи.
- a: архітектура
  b: будівництво
  polarity: synonym
  reason: архітектура = мистецтво проектування будов; будівництво = процес спорудження.
    Суміжні, але не синоніми.
- a: атмосфера
  b: повітря
  polarity: synonym
  reason: атмосфера = газова оболонка планети; повітря = суміш газів для дихання.
    Атмосфера містить повітря, але це не синоніми.
- a: багаж
  b: те
  polarity: synonym
  reason: багаж = речі для перевезення; те = вказівний займенник «той» у середньому
    роді. Жодного семантичного перетину.
- a: багато
  b: набагато
  polarity: synonym
  reason: багато = кількість («у великій кількості»); набагато = ступінь порівняння
    («у великій мірі; значно»). Різні семантичні к
- a: бажання
  b: намір
  polarity: synonym
  reason: бажання = прагнення, хотіння (емоційне); намір = задум, план дій (раціональне).
    Різні психологічні категорії.
- a: базар
  b: крик
  polarity: synonym
  reason: базар = торгівля/ринок; крик = сильний різкий звук голосу. Жаргонне «базар»
    = шум не є літературним синонімом.
- a: батько
  b: тата
  polarity: synonym
  reason: обидва — назви батька; батько — офіційне, тато/тата — пестливе/розмовне;
    реєстрова відмінність
- a: бачення
  b: зустріч
  polarity: synonym
  reason: бачення — сприйняття зором/візія; зустріч — контакт/побачення; різні концепти
- a: бачення
  b: побачення
  polarity: synonym
  reason: бачення (процес зорового сприйняття, візія) ≠ побачення (зустріч, побачення
    закоханих); зовсім різні значення
- a: безперечно
  b: ясно
  polarity: synonym
  reason: безперечно = без сумніву (впевненість); ясно = чітко, зрозуміло. Різні семантичні
    поля.
- a: берегти
  b: заощаджувати
  polarity: synonym
  reason: берегти = оберігати/не витрачати; заощаджувати = нагромаджувати заощадження.
    Різні основні значення.
- a: берегти
  b: шанувати
  polarity: synonym
  reason: берегти = оберігати/зберігати; шанувати = поважати. Різні основні значення.
- a: бережімо
  b: заощаджувати
  polarity: synonym
  reason: бережімо — наказ.сп. від берегти «охороняти, захищати»; заощаджувати — «економити»;
    різні значення
- a: бережімо
  b: зберігати
  polarity: synonym
  reason: обидва — збереження/охорона; берегти = охороняти, зберігати = тримати в
    цілості
- a: бережімо
  b: шанувати
  polarity: synonym
  reason: берегти = оберігати/зберігати, шанувати = поважати; різні стрижневі значення,
    немає спільного сенсу
- a: бирка
  b: ярлик
  polarity: synonym
  reason: бирка (діал.) = однорічна вівця; ярлик = етикетка, грамота; жодного перетину
- a: бити
  b: частувати
  polarity: synonym
  reason: бити — завдавати ударів; частувати — пригощати
- a: брат
  b: друг
  polarity: synonym
  reason: Брат — родинний звʼязок, друг — соціальний; різні відносини.
- a: брат
  b: друга
  polarity: synonym
  reason: Брат — іменник чоловічого роду; друга — нелематизована форма, не пара.
- a: брат
  b: другові
  polarity: synonym
  reason: брат = родинний зв'язок; друг = соціальний зв'язок (дружба); різні типи
    стосунків
- a: брата
  b: племінник
  polarity: synonym
  reason: брат (родич, син тих самих батьків) ≠ племінник (син брата/сестри); різні
    родинні зв'язки
- a: брати
  b: займати
  polarity: synonym
  reason: брати — фізично схоплювати/взяти; займати — займати місце/позичати; основні
    значення не перетинаються
- a: брати
  b: набирати
  polarity: synonym
  reason: брати = схоплювати, брати руками; набирати = збирати/накопичувати/наймати.
    Різні значення, хоча спільнокореневі.
- a: бруківка
  b: шлях
  polarity: synonym
  reason: бруківка — cobblestone pavement (тип покриття), не синонім шляху
- a: буде
  b: жити
  polarity: synonym
  reason: буде — форма майб.ч. 3 ос.одн. від бути; жити — існувати; різні дієслова
- a: буде
  b: стояти
  polarity: synonym
  reason: буде — форма майб.ч. від бути; стояти — перебувати вертикально; різні дієслова
- a: будемо
  b: жити
  polarity: synonym
  reason: будемо — форма бути; жити — окреме дієслово; різні лексеми
- a: будемо
  b: стояти
  polarity: synonym
  reason: будемо — 1 ос. мн. майб. часу від бути; стояти — зовсім інше дієслово
- a: будете
  b: жити
  polarity: synonym
  reason: будете — форма майб.ч. 2 ос.мн. від бути; жити — існувати; різні дієслова
- a: будете
  b: стояти
  polarity: synonym
  reason: будете — 2 ос. мн. майб. часу від бути; стояти — зовсім інше дієслово
- a: будеш
  b: жити
  polarity: synonym
  reason: будеш — 2 ос. одн. майб. часу від бути; жити — існувати/мешкати; різні дієслова
- a: будеш
  b: стояти
  polarity: synonym
  reason: будеш = 2 ос. одн. майб. часу від бути; стояти = перебувати у вертикальному
    положенні. Жодного семантичного перетину.
- a: будильник
  b: годинник
  polarity: synonym
  reason: Будильник — різновид годинника зі спеціальним механізмом для дзвінка; гіперонім/гіпонім,
    не синоніми.
- a: буду
  b: жити
  polarity: synonym
  reason: буду = 1 ос. одн. майб. часу від бути; жити = існувати/бути живим. Граматично
    несумісні форми.
- a: буду
  b: стояти
  polarity: synonym
  reason: буду — 1 ос. одн. майб. часу від бути, стояти = перебувати у вертикальному
    положенні; різні дієслова
- a: будувати
  b: піднімати
  polarity: synonym
  reason: будувати = споруджувати; піднімати = здіймати вгору. Різні основні значення.
- a: будуть
  b: жити
  polarity: synonym
  reason: будуть — форма бути (майб. час); жити — окреме дієслово
- a: будуть
  b: стояти
  polarity: synonym
  reason: будуть — форма майбутнього часу від бути; стояти — перебувати вертикально;
    різні дієслова
- a: будь-коли
  b: завжди
  polarity: synonym
  reason: Будь-коли — «у всякий час» (будь-який момент), завжди — «повсякчас, постійно»
    (універсальний квантор); різні значення.
- a: будьмо
