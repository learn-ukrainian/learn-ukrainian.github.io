schema_version: university_corpus_denominator_v1
operation:
  as_of: 2026/27
  counted_in_school_textbook_denominator: false
  completion_evaluated_separately: true
  purpose: Advanced Ukrainian-language and domain-prose evidence for machine-learnable content.
  source_count_policy: Coverage is judged by required topic cells and evidence quality, not by an arbitrary book count.
  foreign_language_sources: out_of_scope
normative_hierarchy:
- rank: 1
  authority: current_official_ukrainian_orthography
  role: normative
- rank: 2
  authority: official_ukrainian_dictionaries_and_terminology_sources
  role: normative_support
- rank: 3
  authority: accredited_university_textbooks_and_course_materials
  role: explanatory_support
- rank: 4
  authority: historical_or_superseded_orthography_material
  role: transition_and_comparison_only
orthography_policy:
  normative_system: pravopys_2019
  current_official_edition: pravopys_2026
  current_edition_effective_date: "2026-03-28"
  edition_relationship: editorial_technical_update_without_norm_change
  current_regime: current_2019
  older_regimes: retain_with_explicit_regime_metadata
  silent_normalization: forbidden
  conflict_rule: University sources cannot override the current official orthography.
source_admission_contract:
  required_fields:
  - source_id
  - title
  - domain
  - topic_cell_ids
  - provenance_url
  - institution_or_publisher
  - publication_year
  - edition
  - license_or_access_status
  - reuse_tier
  - orthography_regime
  - normative_weight
  - language_profile
  - native_text_canary_state
  - pdf_sha256
  - jsonl_sha256
  - drive_pdf_identity
  - drive_jsonl_identity
  - database_identity
  - quality_state
  - admission_state
  admission_order:
  - verify_provenance_and_access
  - verify_topic_coverage
  - verify_native_text_or_page_level_ocr_canary
  - record_orthography_regime_and_normative_weight
  - create_pdf_and_jsonl_identities
  - back_up_pdf_and_jsonl_to_google_drive
  - ingest_into_sources_database
  - verify_database_identity_and_ukrainian_readability
  quality_rules:
    guessed_text: forbidden
    mojibake: quarantine
    image_only_without_page_canary: quarantine
    missing_license_or_access_evidence: quarantine
    disputed_claims: require_independent_source_or_exclude
