# zizmor configuration — per-audit ignore rules
# See https://docs.zizmor.sh/configuration/
rules:
  artipacked:
    ignore:
      # deploy-pages.yml:30 — credentials needed for gh-pages deploy
      - deploy-pages.yml:30
      # gemini-plan-execute.yml:49 — credentials needed for MCP push_files (contents:write)
      - gemini-plan-execute.yml:49
  self-repository:
    ignore:
      # Every workflow that calls a local action: `./` is the form pinned
      # actionlint 1.7.12 accepts; `$/` is the form zizmor wants (zizmor 1.30 /
      # GitHub Actions, 2026-07-30) but actionlint rejects (rhysd/actionlint#711
      # still open; 1.7.12 remains the latest release). Keep `./` until actionlint
      # accepts `$/`, then migrate and drop these ignores. Whole-file entries:
      # the reason holds for every `./` use in the file, and line-anchored
      # entries went stale whenever a step moved.
      - content-ci.yml
      - ci.yml
      - ci-advisory.yml
      - uv-cache-warm.yml
